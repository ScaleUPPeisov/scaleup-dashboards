name: Build MusicForge v0.4.2 Cloud Safe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-musicforge-v042.yml'
      - 'musicforge-build/v042/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore v0.4.1 and apply v0.4.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat musicforge-build/v041/source/part-*.txt > /tmp/musicforge-source.b64
          test "$(wc -c < /tmp/musicforge-source.b64)" -eq 44988
          echo '23bf21a9463ca3de906e51d2acc071846b8783643a6053c8d8ce06158d032fa2  /tmp/musicforge-source.b64' | sha256sum -c -
          base64 -d /tmp/musicforge-source.b64 > /tmp/musicforge-source.zip
          echo 'a43fbd32cd672a384ba000840ba6cda808557819434298d9b260cd781d876a69  /tmp/musicforge-source.zip' | sha256sum -c -
          unzip -t /tmp/musicforge-source.zip
          rm -rf /tmp/musicforge-src && mkdir -p /tmp/musicforge-src
          unzip -q /tmp/musicforge-source.zip -d /tmp/musicforge-src
          base64 -d musicforge-build/v042/patch.gz.b64 | gzip -dc > /tmp/v042.patch
          echo '2f1a79bcef2d518af484e63d5ed207824467fc7f3a994c15a39c995de7783104  /tmp/v042.patch' | sha256sum -c -
          cd /tmp/musicforge-src
          patch -p1 --forward --batch < /tmp/v042.patch
          grep -q '"version": "0.4.2"' package.json
          grep -q "const CLOUD_SPACE_ID = 'ACE-Step/ACE-Step'" main.js
          grep -q "client.predict('/__call__'" main.js
          grep -q 'const localAllowed = total >= 24' main.js
          ! grep -q "Client.connect('ACE-Step/Ace-Step-v1.5')" main.js

      - name: Validate JavaScript, DOM and M1 safety
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/musicforge-src/main.js
          node --check /tmp/musicforge-src/preload.js
          node --check /tmp/musicforge-src/renderer/app.js
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('/tmp/musicforge-src')
          main=(p/'main.js').read_text(); js=(p/'renderer/app.js').read_text(); html=(p/'renderer/index.html').read_text()
          assert "const CLOUD_SPACE_ID = 'ACE-Step/ACE-Step'" in main
          assert "client.predict('/__call__'" in main
          assert 'const localAllowed = total >= 24' in main
          assert "await stopOrphanEngine('startup')" in main
          boot=main.split("app.whenReady().then",1)[1].split("app.on('before-quit'",1)[0]
          assert 'startEngine()' not in boot
          assert "generationBackend = 'cloud'" in js
          ids=set(re.findall(r"\$\('#([^']+)'\)",js))
          missing=sorted(i for i in ids if f'id="{i}"' not in html)
          assert not missing, missing
          assert 'v0.4.2' in html
          print('DOM selectors:',len(ids),'M1 Safe + Cloud checks: OK')
          PY

      - name: Install dependencies
        working-directory: /tmp/musicforge-src
        run: npm install --no-audit --no-fund

      - name: Real Cloud AI smoke test
        working-directory: /tmp/musicforge-src
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Client } from '@gradio/client';
          const app = await Client.connect('ACE-Step/ACE-Step');
          const result = await app.predict('/__call__', {
            audio_duration: 10,
            prompt: 'modern electronic pop instrumental, bright synth hook, punchy drums, original unique melody',
            lyrics: '[Instrumental]',
            infer_step: 10,
            guidance_scale: 15,
            scheduler_type: 'euler',
            cfg_type: 'apg',
            omega_scale: 10,
            manual_seeds: null,
            guidance_interval: 0.5,
            guidance_interval_decay: 0,
            min_guidance_scale: 3,
            use_erg_tag: true,
            use_erg_lyric: false,
            use_erg_diffusion: true,
            oss_steps: null,
            guidance_scale_text: 0,
            guidance_scale_lyric: 0,
            audio2audio_enable: false,
            ref_audio_strength: 0.5,
            ref_audio_input: null,
            lora_name_or_path: 'none'
          });
          const file=result?.data?.[0];
          const url=file?.url;
          if(!url) throw new Error('Cloud smoke: no audio URL');
          const r=await fetch(url);
          if(!r.ok) throw new Error('Cloud smoke download HTTP '+r.status);
          const bytes=Buffer.from(await r.arrayBuffer());
          if(bytes.length<10000) throw new Error('Cloud smoke audio too small');
          console.log('Cloud smoke OK:',bytes.length,'bytes',file.orig_name||'audio.mp3');
          NODE

      - name: Package Darwin ARM64 bundle
        working-directory: /tmp/musicforge-src
        shell: bash
        run: |
          set -euo pipefail
          npm run package:mac
          APP='dist/MusicForge AI-darwin-arm64/MusicForge AI.app'
          test -d "$APP" && test -x "$APP/Contents/MacOS/MusicForge AI" && test -f "$APP/Contents/Resources/app.asar"
          file "$APP/Contents/MacOS/MusicForge AI" | grep -q 'Mach-O 64-bit arm64'
          file "$APP/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" | grep -q 'Mach-O 64-bit arm64'
          test -L "$APP/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          test -L "$APP/Contents/Frameworks/Electron Framework.framework/Resources"
          test -L "$APP/Contents/Frameworks/Electron Framework.framework/Versions/Current"

      - name: Ad-hoc sign complete macOS app
        uses: indygreg/apple-code-sign-action@v1
        with:
          input_path: '/tmp/musicforge-src/dist/MusicForge AI-darwin-arm64/MusicForge AI.app'
          output_path: '/tmp/musicforge-signed/MusicForge AI.app'

      - name: Verify signed output structure
        shell: bash
        run: |
          set -euo pipefail
          APP='/tmp/musicforge-signed/MusicForge AI.app'
          test -d "$APP" && test -x "$APP/Contents/MacOS/MusicForge AI" && test -f "$APP/Contents/Resources/app.asar"
          file "$APP/Contents/MacOS/MusicForge AI" | grep -q 'Mach-O 64-bit arm64'
          test -L "$APP/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          find "$APP" -name '_CodeSignature' -type d -print | grep -q .

      - name: Create macOS-safe release ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/musicforge-signed
          zip -qry -y '/tmp/MusicForge-AI-v0.4.2-Mac-M1.zip' 'MusicForge AI.app'
          unzip -t '/tmp/MusicForge-AI-v0.4.2-Mac-M1.zip'
          sha256sum '/tmp/MusicForge-AI-v0.4.2-Mac-M1.zip' | tee /tmp/v042.sha256
          python3 - <<'PY'
          import zipfile,stat
          z=zipfile.ZipFile('/tmp/MusicForge-AI-v0.4.2-Mac-M1.zip')
          i=z.getinfo('MusicForge AI.app/Contents/MacOS/MusicForge AI')
          assert ((i.external_attr>>16)&0xffff) & stat.S_IXUSR
          links=[x for x in z.infolist() if stat.S_ISLNK((x.external_attr>>16)&0xffff)]
          assert len(links)>=3
          assert any(x.filename.endswith('Contents/Resources/app.asar') for x in z.infolist())
          print('ZIP metadata OK, symlinks:',len(links))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: MusicForge-AI-v0.4.2-Mac-M1
          path: |
            /tmp/MusicForge-AI-v0.4.2-Mac-M1.zip
            /tmp/v042.sha256
          retention-days: 14
