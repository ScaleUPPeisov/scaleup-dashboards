name: Build MusicForge v0.5.0

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-musicforge-v050.yml'
      - 'musicforge-build/v050/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore v0.4.2 base
        shell: bash
        run: |
          set -euo pipefail
          cat musicforge-build/v041/source/part-*.txt > /tmp/musicforge-source.b64
          test "$(wc -c < /tmp/musicforge-source.b64)" -eq 44988
          echo '23bf21a9463ca3de906e51d2acc071846b8783643a6053c8d8ce06158d032fa2  /tmp/musicforge-source.b64' | sha256sum -c -
          base64 -d /tmp/musicforge-source.b64 > /tmp/musicforge-source.zip
          echo 'a43fbd32cd672a384ba000840ba6cda808557819434298d9b260cd781d876a69  /tmp/musicforge-source.zip' | sha256sum -c -
          rm -rf /tmp/musicforge-src && mkdir -p /tmp/musicforge-src
          unzip -q /tmp/musicforge-source.zip -d /tmp/musicforge-src
          cat musicforge-build/v042/patch-parts/part-*.txt > /tmp/v042.b64
          base64 -d /tmp/v042.b64 | gzip -dc > /tmp/v042.patch
          cd /tmp/musicforge-src
          patch -p1 --forward --batch < /tmp/v042.patch
          grep -q '"version": "0.4.2"' package.json

      - name: Apply v0.5.0 rebuild
        shell: bash
        run: |
          set -euo pipefail
          cat musicforge-build/v050/patch-part-*.b64 > /tmp/v050.b64
          base64 -d /tmp/v050.b64 | gzip -dc > /tmp/v050.patch
          cd /tmp/musicforge-src
          patch -p1 --forward --batch < /tmp/v050.patch
          grep -q '"version": "0.5.0"' package.json
          grep -q 'const QUEUE_MAX = 100' main.js
          grep -q "generationBackend: 'cloud'" main.js
          grep -q 'OTA UPDATE CENTER' renderer/index.html

      - name: Validate JS and UI wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/musicforge-src/main.js
          node --check /tmp/musicforge-src/preload.js
          node --check /tmp/musicforge-src/renderer/app.js
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('/tmp/musicforge-src')
          main=(p/'main.js').read_text(); js=(p/'renderer/app.js').read_text(); html=(p/'renderer/index.html').read_text()
          assert 'const QUEUE_MAX = 100' in main
          assert "generationBackend: 'cloud'" in main
          assert 'processQueue' in main and 'enqueueBatch' in main
          boot=main.split('app.whenReady().then',1)[1].split("app.on('before-quit'",1)[0]
          assert 'startEngine()' not in boot
          ids=set(re.findall(r"\$\('#([^']+)'\)",js))
          missing=sorted(i for i in ids if f'id="{i}"' not in html)
          assert not missing, missing
          print('DOM selectors:',len(ids),'Queue100/Cloud/OTA checks OK')
          PY

      - name: Install dependencies
        working-directory: /tmp/musicforge-src
        run: npm install --no-audit --no-fund

      - name: Real stable cloud audio smoke test
        working-directory: /tmp/musicforge-src
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Client } from '@gradio/client';
          const app=await Client.connect('ACE-Step/ACE-Step');
          const result=await app.predict('/__call__',{
            audio_duration:10,prompt:'modern pop instrumental, clear drums, bass, piano, wide stereo mix, original melody',lyrics:'[Instrumental]',
            infer_step:10,guidance_scale:15,scheduler_type:'euler',cfg_type:'apg',omega_scale:10,manual_seeds:null,
            guidance_interval:0.5,guidance_interval_decay:0,min_guidance_scale:3,use_erg_tag:true,use_erg_lyric:false,use_erg_diffusion:true,
            oss_steps:null,guidance_scale_text:0,guidance_scale_lyric:0,audio2audio_enable:false,ref_audio_strength:0.5,ref_audio_input:null,lora_name_or_path:'none'
          });
          const file=result?.data?.[0]; const url=file?.url;
          if(!url) throw new Error('No cloud audio URL');
          const r=await fetch(url); if(!r.ok) throw new Error('Audio HTTP '+r.status);
          const b=Buffer.from(await r.arrayBuffer()); if(b.length<10000) throw new Error('Audio too small');
          console.log('Cloud audio smoke OK',b.length,'bytes');
          NODE

      - name: Package Darwin ARM64
        working-directory: /tmp/musicforge-src
        shell: bash
        run: |
          set -euo pipefail
          npm run package:mac
          APP='dist/MusicForge AI-darwin-arm64/MusicForge AI.app'
          test -x "$APP/Contents/MacOS/MusicForge AI"
          test -f "$APP/Contents/Resources/app.asar"
          file "$APP/Contents/MacOS/MusicForge AI" | grep -q 'Mach-O 64-bit arm64'
          test -L "$APP/Contents/Frameworks/Electron Framework.framework/Electron Framework"

      - name: Sign complete app
        uses: indygreg/apple-code-sign-action@v1
        with:
          input_path: '/tmp/musicforge-src/dist/MusicForge AI-darwin-arm64/MusicForge AI.app'
          output_path: '/tmp/musicforge-signed/MusicForge AI.app'

      - name: Verify and create updater ZIP
        shell: bash
        run: |
          set -euo pipefail
          APP='/tmp/musicforge-signed/MusicForge AI.app'
          test -x "$APP/Contents/MacOS/MusicForge AI"
          file "$APP/Contents/MacOS/MusicForge AI" | grep -q 'Mach-O 64-bit arm64'
          find "$APP" -name '_CodeSignature' -type d -print | grep -q .
          cd /tmp/musicforge-signed
          zip -qry -y '/tmp/MusicForge-AI-v0.5.0-Mac-M1.zip' 'MusicForge AI.app'
          unzip -t '/tmp/MusicForge-AI-v0.5.0-Mac-M1.zip'
          sha256sum '/tmp/MusicForge-AI-v0.5.0-Mac-M1.zip' | tee /tmp/v050.sha256
          python3 - <<'PY'
          import zipfile,stat
          z=zipfile.ZipFile('/tmp/MusicForge-AI-v0.5.0-Mac-M1.zip')
          i=z.getinfo('MusicForge AI.app/Contents/MacOS/MusicForge AI')
          assert ((i.external_attr>>16)&0xffff)&stat.S_IXUSR
          links=[x for x in z.infolist() if stat.S_ISLNK((x.external_attr>>16)&0xffff)]
          assert len(links)>=3
          print('Updater ZIP OK; symlinks:',len(links))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: MusicForge-AI-v0.5.0-Mac-M1
          path: |
            /tmp/MusicForge-AI-v0.5.0-Mac-M1.zip
            /tmp/v050.sha256
          retention-days: 14
