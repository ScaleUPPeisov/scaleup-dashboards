name: ChannelArt Factory M1 DMG v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4
        with:
          ref: channelart-build-v010

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Restore exact source
        shell: bash
        run: |
          set -euo pipefail
          cat channelart-e8-*.b64 > /tmp/channelart.b64
          python3 -c "import base64;open('/tmp/channelart-source.zip','wb').write(base64.b64decode(open('/tmp/channelart.b64','rb').read()))"
          test "$(shasum -a 256 /tmp/channelart-source.zip | awk '{print $1}')" = "f9088ed4b7ba7844384315faeba93180c7adbdfab64cb43138e02cacc0184f81"
          rm -rf /tmp/channelart-src
          mkdir -p /tmp/channelart-src
          unzip -q /tmp/channelart-source.zip -d /tmp/channelart-src
          test -d /tmp/channelart-src/ChannelArtFactory-v0.1.0

      - name: Install and validate
        working-directory: /tmp/channelart-src/ChannelArtFactory-v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json;p="src-tauri/tauri.conf.json";d=json.load(open(p));d["bundle"]["createUpdaterArtifacts"]=False;open(p,"w").write(json.dumps(d,ensure_ascii=False,indent=2)+"\n")'
          npm install --no-audit --no-fund
          npm run check
          npm run build
          npx tauri icon src-tauri/icons/icon.svg
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build ARM64 app and DMG
        working-directory: /tmp/channelart-src/ChannelArtFactory-v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -d "$APP"
          test -f "$DMG"
          BID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          test "$BID" = "ai.channelart.factory"
          test "$VER" = "0.1.0"
          lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          mkdir -p "$GITHUB_WORKSPACE/channelart-artifact"
          cp "$DMG" "$GITHUB_WORKSPACE/channelart-artifact/ChannelArt-Factory-0.1.0-M1.dmg"
          shasum -a 256 "$GITHUB_WORKSPACE/channelart-artifact/ChannelArt-Factory-0.1.0-M1.dmg" > "$GITHUB_WORKSPACE/channelart-artifact/SHA256SUMS.txt"
          printf '%s\n' '{"app":"ChannelArt Factory","version":"0.1.0","status":"verified","platform":"macos-arm64"}' > "$GITHUB_WORKSPACE/channelart-artifact/BUILD_RECEIPT.json"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ChannelArt-Factory-0.1.0-M1
          path: channelart-artifact/*
          if-no-files-found: error
          retention-days: 30
