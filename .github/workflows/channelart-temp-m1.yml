name: ChannelArt Factory temporary M1 build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-channelart-m1:
    runs-on: macos-latest
    steps:
      - name: Checkout ChannelArt build branch
        uses: actions/checkout@v4
        with:
          ref: channelart-build-v010

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build installer with internal diagnostics
        shell: bash
        run: |
          set +e
          ROOT="$PWD"
          mkdir -p channelart-artifact
          LOG="$ROOT/channelart-artifact/BUILD_LOG.txt"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          STATUS="verified"; FAILED_STEP=""; ERROR_CODE=0
          fail(){ STATUS="failed"; FAILED_STEP="$1"; ERROR_CODE="$2"; echo "CHANNELART_FAIL step=$FAILED_STEP code=$ERROR_CODE"; }
          step(){ local name="$1"; shift; [ "$STATUS" != "verified" ] && return 0; echo "===== $name ====="; "$@"; local rc=$?; [ $rc -ne 0 ] && fail "$name" "$rc"; }
          step macos_runner bash -lc 'uname -a; test "$(uname -s)" = Darwin'
          if [ "$STATUS" = verified ]; then
            cat channelart-e8-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/channelart-source.zip
            GOT="$(shasum -a 256 /tmp/channelart-source.zip | awk '{print $1}')"
            EXPECTED="f9088ed4b7ba7844384315faeba93180c7adbdfab64cb43138e02cacc0184f81"
            [ "$GOT" != "$EXPECTED" ] && fail source_checksum 41
          fi
          if [ "$STATUS" = verified ]; then unzip -q /tmp/channelart-source.zip || fail source_unzip $?; fi
          if [ "$STATUS" = verified ]; then cd ChannelArtFactory-v0.1.0 || fail source_directory $?; fi
          step disable_updater_artifacts python3 -c 'import json;p="src-tauri/tauri.conf.json";d=json.load(open(p));d["bundle"]["createUpdaterArtifacts"]=False;open(p,"w").write(json.dumps(d,ensure_ascii=False,indent=2)+"\n")'
          step npm_install npm install --no-audit --no-fund
          step ui_contract npm run check
          step frontend_build npm run build
          step generate_icons npx tauri icon src-tauri/icons/icon.svg
          step rust_check cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          step tauri_build npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          if [ "$STATUS" = verified ]; then
            APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
            DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            if [ ! -d "$APP" ] || [ ! -f "$DMG" ]; then fail bundle_missing 51; fi
          fi
          if [ "$STATUS" = verified ]; then
            BID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist" 2>/dev/null)"
            VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist" 2>/dev/null)"
            EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist" 2>/dev/null)"
            ARCHS="$(lipo -archs "$APP/Contents/MacOS/$EXE" 2>/dev/null)"
            [ "$BID" != "ai.channelart.factory" ] && fail bundle_id 52
            [ "$VER" != "0.1.0" ] && fail bundle_version 53
            echo "$ARCHS" | grep -qw arm64 || fail executable_not_arm64 54
          fi
          cd "$ROOT"
          [ "$STATUS" = verified ] && cp "$ROOT/ChannelArtFactory-v0.1.0/$DMG" channelart-artifact/ChannelArt-Factory-0.1.0-M1.dmg
          python3 - "$STATUS" "$FAILED_STEP" "$ERROR_CODE" "$GITHUB_RUN_ID" <<'PY'
          import json,sys,datetime
          status,step,code,run_id=sys.argv[1:]
          d={'app':'ChannelArt Factory','version':'0.1.0','status':status,'failed_step':step or None,'error_code':int(code),'platform':'macos-arm64','run_id':run_id,'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')}
          open('channelart-artifact/BUILD_RECEIPT.json','w').write(json.dumps(d,indent=2)+'\n')
          PY
          shasum -a 256 channelart-artifact/* > channelart-artifact/SHA256SUMS.txt 2>/dev/null || true
          echo "Internal result: $STATUS / $FAILED_STEP"
          exit 0

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChannelArt-Factory-0.1.0-M1
          path: channelart-artifact/*
          if-no-files-found: error
          retention-days: 30
        continue-on-error: true
