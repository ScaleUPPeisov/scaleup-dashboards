name: Probe ACE-Step Space API

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-acestep-space.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe official Space via Gradio client
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @gradio/client
          node --input-type=module <<'NODE'
          import { Client } from '@gradio/client';
          const app = await Client.connect('ACE-Step/Ace-Step-v1.5');
          const api = await app.view_api();
          console.log('=== API START ===');
          console.log(JSON.stringify(api, null, 2));
          console.log('=== API END ===');
          NODE
