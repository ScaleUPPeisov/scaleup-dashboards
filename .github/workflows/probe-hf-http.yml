name: Probe Hugging Face Space HTTP

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-hf-http.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Space and inspect Gradio API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          repo='https://huggingface.co/api/spaces/ACE-Step/Ace-Step-v1.5'
          req=urllib.request.Request(repo,headers={'User-Agent':'MusicForge-CI'})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          print('SPACE_META',json.dumps({k:data.get(k) for k in ['id','host','sdk','sha','private','disabled']},ensure_ascii=False))
          host=data.get('host') or 'ace-step-ace-step-v1-5.hf.space'
          if not host.startswith('http'): host='https://'+host
          for suffix in ['/config','/gradio_api/info']:
              url=host+suffix
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MusicForge-CI'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      text=r.read().decode('utf-8','replace')
                  print('URL',url,'LEN',len(text))
                  open('/tmp/'+suffix.strip('/').replace('/','_')+'.json','w').write(text)
                  print(text[:12000])
              except Exception as e:
                  print('ERROR',url,repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hf-space-api-probe
          path: /tmp/*.json
          if-no-files-found: ignore
