name: Test ACE-Step Cloud Generation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-acestep-cloud-generate.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Initialize cloud model and generate 10 second preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/acetest && cd /tmp/acetest
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @gradio/client
          node --input-type=module <<'NODE'
          import { Client } from '@gradio/client';
          import fs from 'node:fs';
          const app = await Client.connect('ACE-Step/Ace-Step-v1.5');
          console.log('connected');
          const init = await app.predict('/lambda_1', {
            param_0: '/home/user/app/data/checkpoints',
            param_1: 'acestep-v15-turbo',
            param_2: 'auto',
            param_3: false,
            param_4: 'acestep-5Hz-lm-1.7B',
            param_5: 'pt',
            param_6: false,
            param_7: false,
            param_8: false
          });
          console.log('INIT', JSON.stringify(init.data, null, 2).slice(0,5000));
          const result = await app.predict('/generation_wrapper', {
            selected_model: 'acestep-v15-turbo', generation_mode: 'custom', simple_query_input: '', simple_vocal_language: 'unknown',
            param_4: 'uplifting modern electronic pop instrumental, bright synth hook, punchy drums, original melody, no vocals',
            param_5: '', param_6: 118, param_7: '', param_8: '4', param_9: 'unknown', param_10: 1, param_11: 7.0,
            param_12: true, param_13: '-1', param_14: null, param_15: 10, param_16: 1, param_17: null, param_18: '',
            param_19: 0.0, param_20: -1, param_21: 'Fill the audio semantic mask based on the given conditions:', param_22: 1.0,
            param_23: 'text2music', param_24: false, param_25: 0.0, param_26: 1.0, param_27: 3.0, param_28: 'ode', param_29: '',
            param_30: 'mp3', param_31: 0.85, param_32: false, param_33: 2.0, param_34: 0, param_35: 0.9,
            param_36: 'NO USER INPUT', param_37: false, param_38: false, param_39: true, param_41: false, param_42: true,
            param_43: false, param_44: false, param_45: 0.5, param_46: 8, param_47: null, param_48: [], param_49: false
          });
          console.log('RESULT_DATA', JSON.stringify(result.data, null, 2).slice(0,20000));
          fs.writeFileSync('/tmp/cloud-result.json', JSON.stringify(result, null, 2));
          const first = result?.data?.[0];
          let url = null;
          if (typeof first === 'string' && first.startsWith('http')) url = first;
          if (first && typeof first === 'object') url = first.url || first.path || null;
          console.log('FIRST_AUDIO', JSON.stringify(first));
          if (!url) throw new Error('No audio URL/path returned');
          if (url.startsWith('/')) url = 'https://ace-step-ace-step-v1-5.hf.space' + url;
          if (!url.startsWith('http')) throw new Error('Returned audio is not an HTTP URL: '+url);
          const r = await fetch(url);
          if (!r.ok) throw new Error('Audio download failed '+r.status+' '+url);
          const buf = Buffer.from(await r.arrayBuffer());
          fs.writeFileSync('/tmp/cloud-preview.mp3', buf);
          console.log('AUDIO_BYTES', buf.length, 'URL', url);
          if (buf.length < 10000) throw new Error('Audio file unexpectedly small');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acestep-cloud-generation-test
          path: |
            /tmp/cloud-result.json
            /tmp/cloud-preview.mp3
          if-no-files-found: ignore
