name: VYRON 2.0.7 Final Gate

on:
  push:
    branches:
      - candidate/vyron-2.0.7-future-channels
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-macos-gate:
    name: macOS Apple Silicon signed build + full regression gate
    runs-on: macos-14
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Verify release secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test "$APPLE_SIGNING_IDENTITY" = '-'

      - name: Run VYRON 2.0.7 release build gate
        shell: bash
        run: bash vyron-v207/release_build_v207.sh

      - name: User shortcomings regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.vyron-v207-release')
          pm=(r/'src-tauri/src/production_manager.rs').read_text()
          ui=(r/'src/ProductionManager.tsx').read_text()
          publisher=(r/'src/PublisherOS.tsx').read_text()
          accounts=(r/'src/AccountsPage.tsx').read_text()
          channels=(r/'src/ChannelsOS.tsx').read_text()
          for token in ('join("Downloads")','recursive_images(&downloads)','VYRON не может читать папку Downloads','Файлы и папки','collector_seen_at_start'):
              assert token in pm, token
          assert 'session.collected.iter().map(|x|x.source_path.clone()).collect()' in pm
          assert 'youtubeProfileId' not in ui and 'youtubeChannelId' not in ui
          assert '+ Будущий канал' in channels and 'findFutureChannelMatch' in accounts
          for token in ('Обложки YouTube — не менять','Video Uploads сегодня','Каждый день','2/2','3/1','Удалить выбранные'):
              assert token in publisher, token
          print('USER SHORTCOMINGS REGRESSION CONTRACTS: PASS')
          PY

      - name: Final artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          REL=.vyron-v207-release/release
          test -s "$REL/VYRON-2.0.7-macOS-AppleSilicon.dmg"
          test -s "$REL/VYRON.app.tar.gz"
          test -s "$REL/VYRON.app.tar.gz.sig"
          test -s "$REL/VYRON-2.0.7-source.tar.gz"
          test -s "$REL/SHA256.txt"
          test -s "$REL/UPDATER_SHA256.txt"
          test -s "$REL/SOURCE_SHA256.txt"
          APP=.vyron-v207-release/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/VYRON.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          echo 'VYRON 2.0.7 FINAL GATE: PASS'

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.0.7-final-candidate
          path: .vyron-v207-release/release/
          if-no-files-found: error
          retention-days: 14
