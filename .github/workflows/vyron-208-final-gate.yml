name: VYRON 2.0.8 Final Gate

on:
  push:
    branches:
      - candidate/vyron-2.0.8-production-future-channel-button
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-final:
    name: macOS Apple Silicon — one-shortcut hotfix gate
    runs-on: macos-14
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Verify signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test "$APPLE_SIGNING_IDENTITY" = '-'

      - name: Build and run full 2.0.8 regression gate
        shell: bash
        run: bash vyron-v208/release_build_v208.sh

      - name: Verify only requested UX contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.vyron-v208-release')
          prod=(r/'src/ProductionOS.tsx').read_text()
          mat=prod[prod.index("tab==='materials'"):prod.index('<ProductionManager view="materials"/>')]
          assert '<select value={channelId}' in mat
          assert '+ Будущий канал' in mat
          assert '+ Импортировать изображения' in mat
          assert mat.index('+ Будущий канал') < mat.index('+ Импортировать изображения')
          assert 'const created=addChannel({name})' in prod
          assert 'setChannelId(created.id)' in prod
          assert 'hasChannelNameConflict(channels,name)' in prod
          assert 'youtubeProfileId' not in prod and 'youtubeChannelId' not in prod
          # Critical untouched systems still carry the exact 2.0.7 contracts.
          accounts=(r/'src/AccountsPage.tsx').read_text()
          pub=(r/'src/PublisherOS.tsx').read_text()
          rust=(r/'src-tauri/src/production_manager.rs').read_text()
          assert 'const future=findFutureChannelMatch(state.channels,p.channelTitle)' in accounts
          assert 'Обложки YouTube — не менять' in pub and 'Video Uploads сегодня' in pub
          assert 'join("Downloads")' in rust and 'recursive_images(&downloads)' in rust
          print('2.0.8 ONLY REQUESTED UX CONTRACT: PASS')
          PY

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          REL=.vyron-v208-release/release
          test -s "$REL/VYRON-2.0.8-macOS-AppleSilicon.dmg"
          test -s "$REL/VYRON.app.tar.gz"
          test -s "$REL/VYRON.app.tar.gz.sig"
          test -s "$REL/VYRON-2.0.8-source.tar.gz"
          test -s "$REL/SHA256.txt"
          test -s "$REL/UPDATER_SHA256.txt"
          test -s "$REL/SOURCE_SHA256.txt"
          APP=.vyron-v208-release/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/VYRON.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          echo 'VYRON 2.0.8 FINAL GATE: PASS'

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.0.8-final-candidate
          path: .vyron-v208-release/release/
          if-no-files-found: error
          retention-days: 14
