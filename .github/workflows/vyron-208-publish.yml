name: VYRON 2.0.8 Publish

on:
  push:
    branches:
      - release/vyron-2.0.8

permissions:
  contents: write

concurrency:
  group: vyron-208-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Rebuild exact hotfix and publish 2.0.8
    runs-on: macos-14
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/vyron-2.0.8'
          git merge-base --is-ancestor dfc4097fa4e9856becdb32087468b06f8fca135a HEAD
          test -s vyron-v208/release_build_v208.sh
          test -s vyron-v208/release_publish_v208.sh

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Verify signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test "$APPLE_SIGNING_IDENTITY" = '-'

      - name: Rebuild and run full 2.0.8 gate
        shell: bash
        run: bash vyron-v208/release_build_v208.sh

      - name: Recheck single requested change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.vyron-v208-release')
          prod=(r/'src/ProductionOS.tsx').read_text()
          mat=prod[prod.index("tab==='materials'"):prod.index('<ProductionManager view="materials"/>')]
          assert '+ Будущий канал' in mat and '+ Импортировать изображения' in mat
          assert mat.index('+ Будущий канал') < mat.index('+ Импортировать изображения')
          assert 'const created=addChannel({name})' in prod and 'setChannelId(created.id)' in prod
          assert 'hasChannelNameConflict(channels,name)' in prod
          assert 'youtubeProfileId' not in prod and 'youtubeChannelId' not in prod
          print('2.0.8 SINGLE HOTFIX CONTRACT: PASS')
          PY

      - name: Verify app signature before publish
        shell: bash
        run: |
          set -euo pipefail
          APP=.vyron-v208-release/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/VYRON.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'

      - name: Publish GitHub release and updater feed
        shell: bash
        run: bash vyron-v208/release_publish_v208.sh

      - name: Verify public release and updater
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.0.8 --repo "$GITHUB_REPOSITORY" --json tagName,assets > /tmp/vyron208-release.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/vyron208-release.json'))
          assert x['tagName']=='v2.0.8'
          names={a['name'] for a in x['assets']}
          required={'VYRON-2.0.8-macOS-AppleSilicon.dmg','VYRON.app.tar.gz','VYRON.app.tar.gz.sig','VYRON-2.0.8-source.tar.gz','latest.json'}
          assert required<=names,sorted(required-names)
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/vyron208-live.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/vyron208-live.json'))
          assert x.get('version')=='2.0.8',x.get('version')
          p=x['platforms']['darwin-aarch64']
          assert p['url'].endswith('/v2.0.8/VYRON.app.tar.gz') and p.get('signature')
          print('VYRON 2.0.8 PUBLIC RELEASE + UPDATER: PASS')
          PY
