name: VYRON 2.0.8 Production Source Inspect

on:
  push:
    branches:
      - candidate/vyron-2.0.8-production-future-channel-button

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct released 2.0.7 source without building
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vyron208-inspect /tmp/vyron208-base
          mkdir -p /tmp/vyron208-inspect /tmp/vyron208-base
          gh release download v1.2.0 --repo "$GITHUB_REPOSITORY" --pattern 'VYRON-1.2.0-source.tar.gz' --dir /tmp/vyron208-base
          tar -xzf /tmp/vyron208-base/VYRON-1.2.0-source.tar.gz -C /tmp/vyron208-inspect
          cd /tmp/vyron208-inspect
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_persistence_recovery.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_intelligence_errors.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_autopilot_attention.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_settings_importfix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_rust_fingerprintfix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v201/apply_v201_quota_rollover_fix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v201/apply_v201_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v202/apply_v202_studio_draft_bridge.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v202/apply_v202_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v203/apply_v203_oauth_discovery.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v203/apply_v203_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v204/apply_v204_selectall_crash_fix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v204/apply_v204_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v205/apply_v205_updater_discovery.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v205/apply_v205_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v206/apply_v206_publisher_flow.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v206/apply_v206_ready_video_delete.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v206/apply_v206_release_blockers_fix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v206/apply_v206_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v207/apply_v207_future_channels.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v207/apply_v207_future_channel_semantics.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v207/apply_v207_version.py" .
          echo '===== ProductionManager imports/state/select area ====='
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/ProductionManager.tsx').read_text()
          for needle in ('export function','channels.map','<select','Импортировать изображения','channelId','setChannel'):
              print('\n---',needle,'---')
              pos=s.find(needle)
              if pos>=0: print(s[max(0,pos-900):min(len(s),pos+1800)])
          PY
