name: VYRON 2.0.9 Security Final Gate

on:
  push:
    branches:
      - candidate/vyron-2.0.9-security-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-security-final:
    name: macOS Apple Silicon — security + full regression gate
    runs-on: macos-14
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout security candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Verify signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test "$APPLE_SIGNING_IDENTITY" = '-'

      - name: Build and run full 2.0.9 security regression gate
        shell: bash
        run: bash vyron-v209/release_build_v209.sh

      - name: Verify security-at-rest contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.vyron-v209-release')
          sec=(r/'src-tauri/src/security.rs').read_text()
          st=(r/'src-tauri/src/storage.rs').read_text()
          yt=(r/'src-tauri/src/youtube.rs').read_text()
          assert 'set_generic_password' in sec and 'get_generic_password' in sec
          assert '0o600' in sec
          assert 'set_state_secret(&mut disk,field,"")' in st
          assert 'hydrate_state_secrets' in st
          assert 'skip_serializing' in yt
          assert 'write_profile_secrets' in yt and 'hydrate_profile_secrets' in yt
          assert 'write_google_secrets' in yt and 'hydrate_google_secrets' in yt
          # Existing critical workflows stay present.
          prod=(r/'src/ProductionOS.tsx').read_text();pm=(r/'src-tauri/src/production_manager.rs').read_text();pub=(r/'src/PublisherOS.tsx').read_text();acc=(r/'src/AccountsPage.tsx').read_text()
          assert '+ Будущий канал' in prod and 'setChannelId(created.id)' in prod
          assert 'join("Downloads")' in pm and 'recursive_images(&downloads)' in pm
          assert 'Обложки YouTube — не менять' in pub and 'Video Uploads сегодня' in pub
          assert 'const future=findFutureChannelMatch(state.channels,p.channelTitle)' in acc
          print('VYRON 2.0.9 SECURITY-AT-REST CONTRACTS: PASS')
          PY

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          REL=.vyron-v209-release/release
          test -s "$REL/VYRON-2.0.9-macOS-AppleSilicon.dmg"
          test -s "$REL/VYRON.app.tar.gz"
          test -s "$REL/VYRON.app.tar.gz.sig"
          test -s "$REL/VYRON-2.0.9-source.tar.gz"
          test -s "$REL/SHA256.txt"
          test -s "$REL/UPDATER_SHA256.txt"
          test -s "$REL/SOURCE_SHA256.txt"
          APP=.vyron-v209-release/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/VYRON.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          echo 'VYRON 2.0.9 SECURITY FINAL GATE: PASS'

      - name: Upload security candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.0.9-security-final-candidate
          path: .vyron-v209-release/release/
          if-no-files-found: error
          retention-days: 14
