name: VYRON 2.0.9 Security Publish

on:
  push:
    branches:
      - release/vyron-2.0.9

permissions:
  contents: write

concurrency:
  group: vyron-209-security-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Rebuild exact security release and publish 2.0.9
    runs-on: macos-14
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/vyron-2.0.9'
          git merge-base --is-ancestor 0a85410dcb9339eb399fa3c23395d78c0cc478a9 HEAD
          test -s vyron-v209/release_build_v209.sh
          test -s vyron-v209/release_publish_v209.sh

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Verify signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test "$APPLE_SIGNING_IDENTITY" = '-'

      - name: Rebuild and run full 2.0.9 security gate
        shell: bash
        run: bash vyron-v209/release_build_v209.sh

      - name: Recheck security and functional compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.vyron-v209-release')
          sec=(r/'src-tauri/src/security.rs').read_text();st=(r/'src-tauri/src/storage.rs').read_text();yt=(r/'src-tauri/src/youtube.rs').read_text()
          assert 'set_generic_password' in sec and 'get_generic_password' in sec and 'delete_generic_password' in sec
          assert 'keychain_roundtrip' in sec and '0o600' in sec
          assert 'secure_state_for_disk' in st and 'hydrate_state_secrets' in st
          assert 'set_state_secret(&mut disk,field,"")' in st
          assert 'write_profile_secrets' in yt and 'hydrate_profile_secrets' in yt
          assert 'write_google_secrets' in yt and 'hydrate_google_secrets' in yt
          prod=(r/'src/ProductionOS.tsx').read_text();pm=(r/'src-tauri/src/production_manager.rs').read_text();pub=(r/'src/PublisherOS.tsx').read_text();acc=(r/'src/AccountsPage.tsx').read_text()
          assert '+ Будущий канал' in prod and 'setChannelId(created.id)' in prod
          assert 'join("Downloads")' in pm and 'recursive_images(&downloads)' in pm
          assert 'Обложки YouTube — не менять' in pub and 'Video Uploads сегодня' in pub
          assert 'const future=findFutureChannelMatch(state.channels,p.channelTitle)' in acc
          print('VYRON 2.0.9 SECURITY + FUNCTIONAL COMPATIBILITY: PASS')
          PY

      - name: Verify app signature before publish
        shell: bash
        run: |
          set -euo pipefail
          APP=.vyron-v209-release/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/VYRON.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'

      - name: Publish GitHub release and updater feed
        shell: bash
        run: bash vyron-v209/release_publish_v209.sh

      - name: Verify public release and updater
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.0.9 --repo "$GITHUB_REPOSITORY" --json tagName,assets,isDraft,isPrerelease,targetCommitish > /tmp/vyron209-release.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/vyron209-release.json'))
          assert x['tagName']=='v2.0.9'
          assert not x['isDraft'] and not x['isPrerelease']
          names={a['name'] for a in x['assets']}
          required={'VYRON-2.0.9-macOS-AppleSilicon.dmg','VYRON.app.tar.gz','VYRON.app.tar.gz.sig','VYRON-2.0.9-source.tar.gz','latest.json'}
          assert required<=names,sorted(required-names)
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/vyron209-live.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/vyron209-live.json'))
          assert x.get('version')=='2.0.9',x.get('version')
          p=x['platforms']['darwin-aarch64']
          assert p['url'].endswith('/v2.0.9/VYRON.app.tar.gz') and p.get('signature')
          print('VYRON 2.0.9 PUBLIC RELEASE + UPDATER: PASS')
          PY
