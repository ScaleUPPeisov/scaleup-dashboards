name: VYRON 2.0.10 Release History Final Gate

on:
  push:
    branches:
      - candidate/vyron-2.0.10-release-history
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-210-final-gate
  cancel-in-progress: true

jobs:
  macos-release-history-final:
    name: macOS Apple Silicon — history UI + full 2.0.9 regression
    runs-on: macos-14
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Verify signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test "$APPLE_SIGNING_IDENTITY" = '-'

      - name: Build 2.0.10 and rerun full stable regression
        shell: bash
        run: bash vyron-v210/release_build_v210.sh

      - name: Verify requested Updates UX and zero functional drift
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.vyron-v210-release')
          h=(r/'src/VyronReleaseHistory.tsx').read_text();s=(r/'src/SettingsOS.tsx').read_text()
          assert 'История обновлений' in h
          assert 'ЧТО СДЕЛАНО • ОТ И ДО' in h
          assert 'Видео-обзор обновления' in h and '▶ Смотреть от и до' in h
          assert 'ОФЛАЙН • БЕЗ YOUTUBE API' in h
          assert "version:'2.0.10'" in h and "version:'1.0.0'" in h
          assert "date:'06.09.2026'" in h and "date:'01.09.2026'" in h
          assert 'api.checkUpdate()' in s and 'update.install((p:number)' in s
          # Security and functional contracts from the stable release are still present.
          sec=(r/'src-tauri/src/security.rs').read_text();st=(r/'src-tauri/src/storage.rs').read_text();yt=(r/'src-tauri/src/youtube.rs').read_text()
          prod=(r/'src/ProductionOS.tsx').read_text();pm=(r/'src-tauri/src/production_manager.rs').read_text();pub=(r/'src/PublisherOS.tsx').read_text();acc=(r/'src/AccountsPage.tsx').read_text()
          assert 'set_generic_password' in sec and 'get_generic_password' in sec and '0o600' in sec
          assert 'hydrate_state_secrets' in st and 'skip_serializing' in yt
          assert '+ Будущий канал' in prod and 'setChannelId(created.id)' in prod
          assert 'join("Downloads")' in pm and 'recursive_images(&downloads)' in pm
          assert 'Обложки YouTube — не менять' in pub and 'Video Uploads сегодня' in pub
          assert 'const future=findFutureChannelMatch(state.channels,p.channelTitle)' in acc
          print('VYRON 2.0.10 REQUESTED UX + ZERO FUNCTIONAL DRIFT: PASS')
          PY

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          REL=.vyron-v210-release/release
          test -s "$REL/VYRON-2.0.10-macOS-AppleSilicon.dmg"
          test -s "$REL/VYRON.app.tar.gz"
          test -s "$REL/VYRON.app.tar.gz.sig"
          test -s "$REL/VYRON-2.0.10-source.tar.gz"
          test -s "$REL/SHA256.txt"
          test -s "$REL/UPDATER_SHA256.txt"
          test -s "$REL/SOURCE_SHA256.txt"
          APP=.vyron-v210-release/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/VYRON.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          echo 'VYRON 2.0.10 FINAL GATE: PASS'

      - name: Upload final candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.0.10-release-history-final-candidate
          path: .vyron-v210-release/release/
          if-no-files-found: error
          retention-days: 14
