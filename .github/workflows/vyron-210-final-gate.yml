name: VYRON 2.0.10 Verified Apply Final Gate

on:
  push:
    branches:
      - release/vyron-2.0.10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-210-final-gate
  cancel-in-progress: true

jobs:
  macos-final:
    name: macOS Apple Silicon — verified Apply + full regression gate
    runs-on: macos-14
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout 2.0.10 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Verify signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test "$APPLE_SIGNING_IDENTITY" = '-'

      - name: Build exact-source VYRON 2.0.10 and run full tests
        shell: bash
        run: bash vyron-v210/release_build_v210.sh

      - name: Verify candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          REL=.vyron-v210-release/release
          test -s "$REL/VYRON-2.0.10-macOS-AppleSilicon.dmg"
          test -s "$REL/VYRON.app.tar.gz"
          test -s "$REL/VYRON.app.tar.gz.sig"
          test -s "$REL/VYRON-2.0.10-source.tar.gz"
          test -s "$REL/SHA256.txt"
          test -s "$REL/UPDATER_SHA256.txt"
          test -s "$REL/SOURCE_SHA256.txt"
          APP=.vyron-v210-release/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/VYRON.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          echo 'VYRON 2.0.10 FINAL GATE: PASS'

      - name: Upload 2.0.10 candidate
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.0.10-final-candidate
          path: .vyron-v210-release/release/
          if-no-files-found: error
          retention-days: 14
