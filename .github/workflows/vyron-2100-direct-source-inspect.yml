name: VYRON 2.1.0 Direct Source Inspect

on:
  push:
    branches:
      - release/vyron-2.1.0-production-repair-shorts
    paths:
      - '.github/workflows/vyron-2100-direct-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect exact VYRON 2.0.13 release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ScaleUPPeisov/scaleup-dashboards
    steps:
      - uses: actions/checkout@v4
      - name: Download exact 2.0.13 source and inspect repair anchors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vyron213src /tmp/vyron213asset
          mkdir -p /tmp/vyron213src /tmp/vyron213asset
          gh release download v2.0.13 --repo "$REPO" --pattern 'VYRON-2.0.13-source.tar.gz' --dir /tmp/vyron213asset
          got=$(sha256sum /tmp/vyron213asset/VYRON-2.0.13-source.tar.gz | awk '{print $1}')
          test "$got" = d9f6345b597d41018b9a439c3eda2558e33936c6b605ac2b8052955b4e088717
          tar -xzf /tmp/vyron213asset/VYRON-2.0.13-source.tar.gz -C /tmp/vyron213src
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/vyron213src')
          specs={
            'src/PublisherOS.tsx':['async function runBatch','notifyError','youtubeUpload','effectivePublishAt','youtubeListExisting','scheduleStartDate'],
            'src/publisherSchedule.ts':['publisherScheduleDates','publisherSchedulePreview','publisherKrasnoyarskIso','todayKrasnoyarskDate'],
            'src/errorCenter.ts':['humanizeError','UNKNOWN','SCHEDULE','operation failed','state saved'],
            'src/App.tsx':['Очистить историю','jobErrors','errorCount','errorHistory'],
            'src/errorHistory.ts':['appendErrorHistory','clearErrorHistory','localStorage'],
            'src/notificationCenter.ts':['notifyError','appendErrorHistory','AppNotification','notify('],
            'src/api.ts':['youtubeUpload','youtubeUpdateExisting','youtubeListExisting','onYoutubeApiRequest'],
            'src-tauri/src/youtube.rs':['youtube_upload','youtube_list_existing_videos','videos.insert','videos.list','publishAt','scheduleAccepted'],
            'src-tauri/src/production_manager.rs':['Strict','master integrity','frames=','packets=','ffprobe'],
            'src-tauri/src/lib.rs':['youtube_list_existing','generate_handler'],
          }
          for rel,needles in specs.items():
            p=r/rel
            print('\n'+'='*100+'\nFILE',rel,'exists=',p.exists())
            if not p.exists(): continue
            lines=p.read_text(errors='replace').splitlines()
            seen=set()
            for needle in needles:
              hits=[i for i,x in enumerate(lines) if needle.lower() in x.lower()]
              print(f'\n-- NEEDLE {needle!r} HITS {len(hits)}')
              for i in hits[:10]:
                a=max(0,i-16); b=min(len(lines),i+24)
                key=(a,b)
                if key in seen: continue
                seen.add(key)
                for j in range(a,b): print(f'{j+1:05d}: {lines[j]}')
          PY
