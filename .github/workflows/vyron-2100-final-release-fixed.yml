name: VYRON 2.1.0 Direct Source Gate

on:
  push:
    branches: [release/vyron-2.1.0-shorts-buffer-storage]
    paths:
      - '.github/workflows/vyron-2100-final-release-fixed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyron-2100-direct-source
  cancel-in-progress: true

jobs:
  inspect-source:
    name: Inspect exact 2.0.13 source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ScaleUPPeisov/scaleup-dashboards
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect source anchors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vyron213src /tmp/vyron213asset
          mkdir -p /tmp/vyron213src /tmp/vyron213asset
          gh release download v2.0.13 --repo "$REPO" --pattern 'VYRON-2.0.13-source.tar.gz' --dir /tmp/vyron213asset
          got=$(sha256sum /tmp/vyron213asset/VYRON-2.0.13-source.tar.gz | awk '{print $1}')
          echo "SOURCE_SHA=$got"
          test "$got" = d9f6345b597d41018b9a439c3eda2558e33936c6b605ac2b8052955b4e088717
          tar -xzf /tmp/vyron213asset/VYRON-2.0.13-source.tar.gz -C /tmp/vyron213src
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/vyron213src')
          specs={
            'src/PublisherOS.tsx':['scheduleStart=draft.scheduleStartDate||todayKrasnoyarskDate()','resolvedUploadMetadata','const run','publishAt','scheduleStartDate'],
            'src/publisherSchedule.ts':['export','Asia/Krasnoyarsk','schedule'],
            'src/errorCenter.ts':['UNKNOWN','mapError','error'],
            'src/App.tsx':['Очистить историю','errorHistory','Технические детали'],
            'src/errorHistory.ts':['export function','appendErrorHistory','clearErrorHistory'],
            'src/notificationCenter.ts':['appendErrorHistory','export type','interface'],
            'src/api.ts':['youtubeListExisting','youtube_list_existing','invoke'],
            'src-tauri/src/youtube.rs':['youtube_list_existing_videos','publishAt','videos.list','pub async fn youtube_'],
            'src-tauri/src/lib.rs':['youtube_list_existing','generate_handler'],
            'src/releaseHistory.ts':['2.0.13','2.0.12'],
          }
          for rel,needles in specs.items():
            p=r/rel
            print('\n'+'='*100+'\nFILE',rel,'exists=',p.exists())
            if not p.exists(): continue
            lines=p.read_text(errors='replace').splitlines()
            emitted=set()
            for needle in needles:
              hits=[i for i,x in enumerate(lines) if needle in x]
              print(f'-- {needle!r}: {len(hits)} hit(s)')
              for i in hits[:12]:
                a=max(0,i-10); b=min(len(lines),i+16)
                if (a,b) in emitted: continue
                emitted.add((a,b))
                for j in range(a,b): print(f'{j+1:05d}: {lines[j]}')
          PY
