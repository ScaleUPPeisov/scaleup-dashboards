name: VYRON 2.1.0 Source Inspection Notifications

on:
  push:
    branches: [release/vyron-2.1.0-shorts-buffer-storage]
    paths:
      - '.github/workflows/vyron-2100-final-release-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Print exact released source corridors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vyron-src"
          gh release download v2.0.13 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-2.0.13-source.tar.gz' --dir "$RUNNER_TEMP"
          test "$(sha256sum "$RUNNER_TEMP/VYRON-2.0.13-source.tar.gz"|awk '{print $1}')" = 'd9f6345b597d41018b9a439c3eda2558e33936c6b605ac2b8052955b4e088717'
          tar -xzf "$RUNNER_TEMP/VYRON-2.0.13-source.tar.gz" -C "$RUNNER_TEMP/vyron-src"
          cd "$RUNNER_TEMP/vyron-src"
          for f in src/notificationCenter.ts src/api.ts src/types.ts src/YouTubeCenter.tsx src/QuotaMeter.tsx; do
            echo "===== $f ====="
            nl -ba "$f" | sed -n '1,180p'
          done
