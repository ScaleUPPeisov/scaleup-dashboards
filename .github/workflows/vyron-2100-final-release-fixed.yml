name: VYRON 2.1.0 Repair Gate NO PUBLISH

on:
  push:
    branches:
      - release/vyron-2.1.0-production-repair-shorts
    paths:
      - '.github/workflows/vyron-2100-final-release-fixed.yml'
      - 'vyron-v2100/**'
      - 'vyron-v211/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-2100-repair-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-gate:
    name: Repair Gate — macOS Apple Silicon — NO PUBLISH
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
      - name: Build and test direct-source VYRON 2.1.0
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/vyron-2100-gate.log") 2>&1
          ROOT="$GITHUB_WORKSPACE"
          WORK="$ROOT/.vyron-2100-release"
          BASE="$RUNNER_TEMP/vyron-base"
          SOURCE_COMMIT='b74238f2676a047587cb2f34a810a32d853c5fd0'
          SOURCE_SHA='d9f6345b597d41018b9a439c3eda2558e33936c6b605ac2b8052955b4e088717'
          SHORTS_SHA='549ac4175c7745092509010ce928110958870ccc'

          echo '==> Fetch pinned Shorts Factory implementation'
          git fetch --no-tags origin "$SHORTS_SHA"
          git checkout "$SHORTS_SHA" -- vyron-v211

          echo '==> Verify exact official VYRON 2.0.13 source'
          rm -rf "$WORK" "$BASE"; mkdir -p "$WORK" "$BASE"
          if gh release download v2.0.13 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-2.0.13-source.tar.gz' --dir "$BASE"; then
            test "$(shasum -a 256 "$BASE/VYRON-2.0.13-source.tar.gz"|awk '{print $1}')" = "$SOURCE_SHA"
            tar -xzf "$BASE/VYRON-2.0.13-source.tar.gz" -C "$WORK"
          else
            echo 'release asset unavailable; reconstructing exact source tree from pinned release commit'
            git archive "$SOURCE_COMMIT" | tar -x -C "$WORK"
          fi
          test "$(node -p "require('$WORK/package.json').version")" = '2.0.13'

          echo '==> Resolve actual releaseHistory array anchor'
          cp "$ROOT/vyron-v2100/apply_v2100_direct.py" "$RUNNER_TEMP/apply_v2100_direct.py"
          python3 - "$RUNNER_TEMP/apply_v2100_direct.py" "$WORK/src/releaseHistory.ts" <<'PY'
          from pathlib import Path
          import re,sys
          script=Path(sys.argv[1]); source=Path(sys.argv[2]).read_text()
          matches=list(re.finditer(r'export const\s+\w+(?::[^=\n]+)?\s*=\s*\[',source))
          if not matches: raise SystemExit('actual releaseHistory export array not found')
          marker=matches[0].group(0); data=script.read_text(); old="marker='export const RELEASE_HISTORY=['"
          if old not in data: raise SystemExit('transformer releaseHistory marker declaration missing')
          script.write_text(data.replace(old,'marker='+repr(marker),1)); print('releaseHistory anchor:',marker)
          PY

          echo '==> Apply direct YouTube publish/error recovery'
          python3 "$RUNNER_TEMP/apply_v2100_direct.py" "$WORK" recovery

          echo '==> Adapt pinned Shorts command registration to released 2.0.13'
          python3 - "$ROOT/vyron-v211/apply_v211_shorts_factory.py" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          start="p=root/'src-tauri/src/lib.rs';s=p.read_text()"
          end="p=root/'src/ProductionOS.tsx';s=p.read_text()"
          i=s.find(start);j=s.find(end,i+1)
          if i<0 or j<0: raise SystemExit('historical Shorts lib patch block not found')
          robust="""p=root/'src-tauri/src/lib.rs';s=p.read_text()
          if 'mod shorts_factory;' not in s:
           a='mod production_manager;'
           if a not in s: raise SystemExit('lib module anchor missing')
           s=s.replace(a,a+'\\nmod shorts_factory;',1)
          a='production_manager::cleanup_completed_production_assets,'
          if a not in s: raise SystemExit('lib stable cleanup anchor missing')
          s=s.replace(a,a+'shorts_factory::shorts_probe_source,shorts_factory::shorts_validate_file,shorts_factory::shorts_render_segment,',1);p.write_text(s)

          """
          p.write_text(s[:i]+robust+s[j:])
          PY
          echo '==> Apply Shorts Factory'
          python3 "$ROOT/vyron-v211/apply_v211_shorts_factory.py" "$WORK"
          echo '==> Apply safe Storage Manager archive'
          python3 "$RUNNER_TEMP/apply_v2100_direct.py" "$WORK" storage

          echo '==> Fix generated safe archive Rust statement boundary'
          python3 - "$WORK/src-tauri/src/production_manager.rs" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          old='if tmp.exists(){let _=fs::remove_file(&tmp)}fs::copy'
          new='if tmp.exists(){let _=fs::remove_file(&tmp);}fs::copy'
          if old not in s: raise SystemExit('safe archive Rust statement anchor missing')
          p.write_text(s.replace(old,new,1))
          PY

          echo '==> Repair generated archive regression test escaping'
          cat > "$WORK/src/v2100StorageArchive.test.ts" <<'EOF'
          import {describe,expect,it} from 'vitest';
          import {readFileSync} from 'node:fs';
          describe('VYRON 2.1 safe storage archive',()=>{
            it('is copy-only for rendered source video',()=>{
              const r=readFileSync('src-tauri/src/production_manager.rs','utf8');
              const a=readFileSync('src/productionManagerApi.ts','utf8');
              const u=readFileSync('src/ProductionManager.tsx','utf8');
              const l=readFileSync('src-tauri/src/lib.rs','utf8');
              const start=r.indexOf('pub fn archive_production_rendered_videos');
              const fn=r.slice(start);
              expect(start).toBeGreaterThanOrEqual(0);
              expect(fn).toContain('fs::copy');
              expect(fn).not.toContain('remove_file(&canon)');
              expect(fn).not.toContain('remove_dir_all(&canon)');
              expect(fn).toContain('source rendered MP4 is COPY-ONLY');
              expect(a).toContain("archiveRenderedVideos:(manifestPath:string,archiveRoot:string)");
              expect(u).toContain('АРХИВ MP4');
              expect(u).toContain('Исходные видео останутся на месте');
              expect(l).toContain('production_manager::archive_production_rendered_videos');
            });
          });
          EOF
          cd "$WORK"

          echo '==> Static contracts'
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=Path('.')
          pkg=json.loads((r/'package.json').read_text()); conf=json.loads((r/'src-tauri/tauri.conf.json').read_text())
          assert pkg['version']=='2.1.0' and conf['version']=='2.1.0'
          assert conf['identifier']=='studio.channelflow.desktop'
          for f in ['src/shortsCore.ts','src/ShortsFactory.tsx','src/ShortsMetadata.tsx','src/MetadataTabs.tsx','src-tauri/src/shorts_factory.rs','src/v2100PublishRecovery.test.ts','src/v2100StorageArchive.test.ts']:
              assert (r/f).is_file(),f
          pub=(r/'src/PublisherOS.tsx').read_text(); sched=(r/'src/publisherSchedule.ts').read_text(); app=(r/'src/App.tsx').read_text(); err=(r/'src/errorCenter.ts').read_text(); notify=(r/'src/notificationCenter.ts').read_text(); prod=(r/'src/ProductionOS.tsx').read_text(); short=(r/'src-tauri/src/shorts_factory.rs').read_text(); pm=(r/'src-tauri/src/production_manager.rs').read_text(); pma=(r/'src/productionManagerApi.ts').read_text(); pui=(r/'src/ProductionManager.tsx').read_text(); lib=(r/'src-tauri/src/lib.rs').read_text(); yt=(r/'src-tauri/src/youtube.rs').read_text(); runway=(r/'src/channelRunwayCore.ts').read_text()
          for t in ('syncScheduleFromYoutube','api.youtubeListExisting(profileId,1000)','pastSchedule','Синхронизировать с YouTube','Последняя дата на YouTube','technicalDetail:h.detail'): assert t in pub,t
          for t in ('latestYoutubeScheduledPublishAt','suggestedScheduleStartDate','nextFutureScheduleDate','isFuturePublishAt','Asia/Krasnoyarsk'): assert t in sched,t
          for t in ('SCHEDULE_IN_PAST','SCHEDULE_REJECTED'): assert t in err,t
          for t in ('Очистить все ошибки','Убрать ошибку','Технические детали'): assert t in app,t
          assert 'technicalDetail?:string' in notify
          for t in ('SHORTS','СОЗДАТЬ SHORTS','<ShortsFactory'): assert t in prod,t
          for t in ('h264_videotoolbox','libx264','.part.mp4','1080','1920','shorts_render_segment','real_ffmpeg_fixture_if_enabled'): assert t in short,t
          assert 'runwayDays' in runway and 'scheduledUntil' in runway
          for t in ('archive_production_rendered_videos','ArchiveRenderedResult','fs::copy','source rendered MP4 is COPY-ONLY'): assert t in pm,t
          assert 'archiveRenderedVideos' in pma and 'АРХИВ MP4' in pui and 'Исходные видео останутся на месте' in pui
          assert 'production_manager::archive_production_rendered_videos' in lib
          assert '"publishAt":st.get("publishAt")' in yt
          print('STATIC CONTRACTS PASS')
          PY

          echo '==> Frontend tests and production build'
          npm ci --no-audit --no-fund
          npm test
          npm run build

          echo '==> Rust tests including real local Shorts fixture'
          VYRON_SHORTS_REAL_TEST=1 cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
          echo '==> ARM64 compile check'
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          echo '==> Tauri application compile without publishing/signing'
          npx tauri build --target aarch64-apple-darwin --no-bundle
          echo 'VYRON 2.1.0 REPAIR GATE: PASS'
      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.0-repair-gate-log
          path: vyron-2100-gate.log
          if-no-files-found: warn
          retention-days: 14
