name: VYRON 2.1.0 Production Release

on:
  push:
    branches:
      - release/vyron-2.1.0-shorts-buffer-storage
    paths:
      - '.github/workflows/vyron-2100-production-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyron-2100-production-release
  cancel-in-progress: false

jobs:
  final-test:
    name: Final signed candidate — macOS Apple Silicon
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-run exact green direct-source gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY' > "$RUNNER_TEMP/vyron-direct-gate.sh"
          import yaml
          from pathlib import Path
          p=Path('.github/workflows/vyron-2100-final-release-fixed.yml')
          data=yaml.safe_load(p.read_text())
          for step in data['jobs']['final-gate']['steps']:
              if step.get('name')=='Build and test direct-source VYRON 2.1.0':
                  print(step['run'])
                  break
          else:
              raise SystemExit('direct-source gate step not found')
          PY
          test -s "$RUNNER_TEMP/vyron-direct-gate.sh"
          bash "$RUNNER_TEMP/vyron-direct-gate.sh"
          test -f "$GITHUB_WORKSPACE/.vyron-2100-release/package.json"
          test "$(node -p "require('$GITHUB_WORKSPACE/.vyron-2100-release/package.json').version")" = '2.1.0'

      - name: Normalize updater signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key')
          pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          PY

      - name: Build signed updater, app and DMG
        shell: bash
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE/.vyron-2100-release"
          cd "$WORK"

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          pkg=json.loads(Path('package.json').read_text())
          conf=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert pkg['version']=='2.1.0'
          assert conf['version']=='2.1.0'
          assert conf['identifier']=='studio.channelflow.desktop'
          assert conf['plugins']['updater']['pubkey'].strip()==os.environ['TAURI_UPDATER_PUBLIC_KEY'].strip()
          print('Updater public key and 2.1.0 bundle metadata: PASS')
          PY

          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP"
          test -s "$DMG"
          test -s "$UPDATER"
          test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.0'
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"

          rm -rf release
          mkdir release
          cp "$DMG" release/VYRON-2.1.0-macOS-AppleSilicon.dmg
          cp "$UPDATER" release/VYRON.app.tar.gz
          cp "$SIG" release/VYRON.app.tar.gz.sig
          shasum -a 256 release/VYRON-2.1.0-macOS-AppleSilicon.dmg > release/SHA256.txt
          shasum -a 256 release/VYRON.app.tar.gz > release/UPDATER_SHA256.txt
          tar -czf release/VYRON-2.1.0-source.tar.gz \
            --exclude='./node_modules' \
            --exclude='./dist' \
            --exclude='./src-tauri/target' \
            --exclude='./release' \
            .
          shasum -a 256 release/VYRON-2.1.0-source.tar.gz > release/SOURCE_SHA256.txt

          cat > release/FINAL_TEST_REPORT.md <<'REPORT'
          # VYRON 2.1.0 — FINAL PRODUCTION GATE

          - ✅ Exact official VYRON 2.0.13 source SHA256 verified before transformation
          - ✅ Publisher schedule sync uses real YouTube publishAt and rejects past publish dates
          - ✅ Publisher/Error Center preserve real technical upload details
          - ✅ Error Center can clear displayed task errors/history without changing ERROR job status
          - ✅ Shorts Factory integrated into Production OS
          - ✅ Real local FFmpeg Shorts fixture executed in Rust tests
          - ✅ Vertical Shorts contract: 1080×1920, hardware H.264 with libx264 fallback
          - ✅ Source video remains preserved; Storage Manager archive is copy-only
          - ✅ Full frontend Vitest suite
          - ✅ TypeScript/Vite production build
          - ✅ Rust unit tests
          - ✅ ARM64 cargo check
          - ✅ Tauri Apple Silicon application compile
          - ✅ Tauri app + DMG bundle
          - ✅ codesign verification
          - ✅ DMG verification
          - ✅ Tauri updater archive + signature generated

          Public updater is changed only by the publish job after this job succeeds.
          REPORT

          echo 'VYRON 2.1.0 SIGNED PRODUCTION CANDIDATE: PASS'

      - name: Upload exact signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.0-final-candidate
          path: .vyron-2100-release/release/
          if-no-files-found: error
          retention-days: 30

      - name: Final test summary
        if: success()
        shell: bash
        run: |
          {
            echo '# VYRON 2.1.0 FINAL TEST ✅'
            echo
            echo '- ✅ Exact 2.0.13 source → direct recovery → Shorts Factory → Storage Manager'
            echo '- ✅ Frontend + Rust + real FFmpeg Shorts fixture'
            echo '- ✅ ARM64 + Tauri app/DMG'
            echo '- ✅ codesign + DMG verify + updater signature'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish VYRON 2.1.0 and switch updater
    needs: final-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ScaleUPPeisov/scaleup-dashboards
    steps:
      - name: Download exact green candidate
        uses: actions/download-artifact@v4
        with:
          name: VYRON-2.1.0-final-candidate
          path: release

      - name: Verify candidate and create release metadata
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            VYRON-2.1.0-macOS-AppleSilicon.dmg \
            VYRON.app.tar.gz \
            VYRON.app.tar.gz.sig \
            VYRON-2.1.0-source.tar.gz \
            SHA256.txt UPDATER_SHA256.txt SOURCE_SHA256.txt FINAL_TEST_REPORT.md; do
            test -s "release/$f"
          done

          cat > release/RELEASE_NOTES.md <<'NOTES'
          # VYRON YT PEISOV 2.1.0 — Shorts Factory + Publisher Recovery

          - Publisher синхронизирует автоматическое расписание с реальными будущими `publishAt` на YouTube и продолжает после последней отложенной публикации.
          - Прошедшая дата блокируется до отправки в YouTube; для автоматического расписания требуется актуальная синхронизация.
          - При ошибке загрузки сохраняются технические детали реального ответа backend/YouTube, а не только упрощённый текст.
          - Error Center умеет убрать одну ошибку или очистить все отображаемые ошибки и историю, не переводя саму задачу из статуса `ERROR`.
          - Добавлен Shorts Factory: Long → вертикальные Shorts 1080×1920, проверка исходника, сегменты и локальный FFmpeg render.
          - Для macOS используется H.264 VideoToolbox с fallback на libx264; запись идёт через временный `.part.mp4`.
          - Добавлены Shorts metadata/UI и интеграция в Production OS.
          - Storage Manager архивирует готовые MP4 копированием: исходные видео не удаляются автоматически.
          - Сохранены функции предыдущих версий: Keychain recovery, Existing Videos category/playlist/backup/Undo, quota и очистка project assets.

          2.1.0 опубликован только после полного macOS Apple Silicon production gate, включая реальный локальный FFmpeg Shorts fixture, frontend/Rust tests, ARM64, Tauri bundle, codesign, DMG verify и updater signature.
          NOTES

          python3 - <<'PY'
          import json,datetime,pathlib
          rel=pathlib.Path('release')
          sig=(rel/'VYRON.app.tar.gz.sig').read_text().strip()
          notes=(rel/'RELEASE_NOTES.md').read_text()
          data={
            'version':'2.1.0',
            'notes':notes,
            'pub_date':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'platforms':{
              'darwin-aarch64':{
                'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.0/VYRON.app.tar.gz',
                'signature':sig
              }
            }
          }
          (rel/'latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          test "$(python3 -c "import json;print(json.load(open('release/latest.json'))['version'])")" = '2.1.0'

      - name: Publish exact tested GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.1.0 --repo "$REPO" >/dev/null 2>&1; then
            gh release edit v2.1.0 --repo "$REPO" \
              --title 'VYRON YT PEISOV 2.1.0 — Shorts Factory + Publisher Recovery' \
              --notes-file release/RELEASE_NOTES.md --draft=false --prerelease=false
          else
            gh release create v2.1.0 --repo "$REPO" --target "$GITHUB_SHA" \
              --title 'VYRON YT PEISOV 2.1.0 — Shorts Factory + Publisher Recovery' \
              --notes-file release/RELEASE_NOTES.md
          fi
          gh release upload v2.1.0 --repo "$REPO" --clobber \
            release/VYRON-2.1.0-macOS-AppleSilicon.dmg \
            release/VYRON.app.tar.gz \
            release/VYRON.app.tar.gz.sig \
            release/VYRON-2.1.0-source.tar.gz \
            release/SHA256.txt \
            release/UPDATER_SHA256.txt \
            release/SOURCE_SHA256.txt \
            release/FINAL_TEST_REPORT.md \
            release/RELEASE_NOTES.md \
            release/latest.json

      - name: Verify release before updater switch
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v2.1.0 --repo "$REPO" --json isDraft --jq '.isDraft|tostring')" = 'false'
          test "$(gh release view v2.1.0 --repo "$REPO" --json isPrerelease --jq '.isPrerelease|tostring')" = 'false'
          ASSETS=$(gh release view v2.1.0 --repo "$REPO" --json assets --jq '.assets[].name')
          for f in VYRON-2.1.0-macOS-AppleSilicon.dmg VYRON.app.tar.gz VYRON.app.tar.gz.sig VYRON-2.1.0-source.tar.gz latest.json FINAL_TEST_REPORT.md; do
            grep -qx "$f" <<<"$ASSETS"
          done

      - name: Activate updater 2.0.13 to 2.1.0
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | base64 --decode)
          CURRENT_VERSION=$(printf '%s' "$CURRENT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')
          test "$CURRENT_VERSION" = '2.0.13' -o "$CURRENT_VERSION" = '2.1.0'
          OLD_SHA=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .sha)
          CONTENT=$(base64 -w0 release/latest.json)
          gh api --method PUT "repos/$REPO/contents/vyron-updates/latest.json" \
            -f message='VYRON updater: 2.1.0 Shorts Factory + Publisher recovery' \
            -f content="$CONTENT" -f sha="$OLD_SHA" -f branch=main >/dev/null

      - name: Verify public production release and updater
        shell: bash
        run: |
          set -euo pipefail
          LIVE=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | base64 --decode)
          test "$(printf '%s' "$LIVE" | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')" = '2.1.0'
          RELEASE=$(gh release view v2.1.0 --repo "$REPO" --json tagName,isDraft,isPrerelease --jq '.tagName+" "+(.isDraft|tostring)+" "+(.isPrerelease|tostring)')
          test "$RELEASE" = 'v2.1.0 false false'
          echo 'VYRON 2.1.0 PRODUCTION RELEASE: PASS'
          {
            echo '# VYRON 2.1.0 Production Release ✅'
            echo
            echo '- ✅ GitHub Release v2.1.0 published'
            echo '- ✅ DMG / updater / signature / exact source published'
            echo '- ✅ updater feed main switched from 2.0.13 to 2.1.0'
          } >> "$GITHUB_STEP_SUMMARY"
