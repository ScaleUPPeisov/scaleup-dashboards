name: VYRON 2.1.0 Production Release

on:
  push:
    branches:
      - release/vyron-2.1.0-production-repair-shorts
    paths:
      - '.github/workflows/vyron-2100-production-release.yml'
      - '.github/workflows/vyron-2100-final-release-fixed.yml'
      - 'vyron-v2100/**'
      - 'vyron-v211/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyron-2100-production-release
  cancel-in-progress: true

jobs:
  final-test:
    name: Final signed candidate — macOS Apple Silicon
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-run exact green direct-source gate
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
          command -v ffmpeg
          command -v ffprobe
          python3 -m venv "$RUNNER_TEMP/vyron-ci-python"
          source "$RUNNER_TEMP/vyron-ci-python/bin/activate"
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python - <<'PY' > "$RUNNER_TEMP/vyron-direct-gate.sh"
          import yaml
          from pathlib import Path
          p=Path('.github/workflows/vyron-2100-final-release-fixed.yml')
          data=yaml.safe_load(p.read_text())
          for step in data['jobs']['final-gate']['steps']:
              if step.get('name')=='Build and test direct-source VYRON 2.1.0':
                  print(step['run'])
                  break
          else:
              raise SystemExit('direct-source gate step not found')
          PY
          test -s "$RUNNER_TEMP/vyron-direct-gate.sh"
          bash "$RUNNER_TEMP/vyron-direct-gate.sh"
          test -f "$GITHUB_WORKSPACE/.vyron-2100-release/package.json"
          test "$(node -p "require('$GITHUB_WORKSPACE/.vyron-2100-release/package.json').version")" = '2.1.0'

      - name: Normalize updater signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key')
          pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          PY

      - name: Build signed updater, app and DMG
        shell: bash
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE/.vyron-2100-release"
          cd "$WORK"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          pkg=json.loads(Path('package.json').read_text())
          conf=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert pkg['version']=='2.1.0'
          assert conf['version']=='2.1.0'
          assert conf['identifier']=='studio.channelflow.desktop'
          assert conf['plugins']['updater']['pubkey'].strip()==os.environ['TAURI_UPDATER_PUBLIC_KEY'].strip()
          print('Updater public key and 2.1.0 bundle metadata: PASS')
          PY
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.0'
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          rm -rf release; mkdir release
          cp "$DMG" release/VYRON-2.1.0-macOS-AppleSilicon.dmg
          cp "$UPDATER" release/VYRON.app.tar.gz
          cp "$SIG" release/VYRON.app.tar.gz.sig
          shasum -a 256 release/VYRON-2.1.0-macOS-AppleSilicon.dmg > release/SHA256.txt
          shasum -a 256 release/VYRON.app.tar.gz > release/UPDATER_SHA256.txt
          tar -czf release/VYRON-2.1.0-source.tar.gz --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' --exclude='./release' .
          shasum -a 256 release/VYRON-2.1.0-source.tar.gz > release/SOURCE_SHA256.txt
          cat > release/FINAL_TEST_REPORT.md <<'REPORT'
          # VYRON 2.1.0 — PRODUCTION GATE
          - ✅ Exact official VYRON 2.0.13 source SHA256 verified
          - ✅ Frontend Vitest suite
          - ✅ TypeScript/Vite production build
          - ✅ Error Center and real PublisherOS batch-failure wiring regressions
          - ✅ Unified Long + Shorts publication scheduler regressions
          - ✅ Rust unit tests with real local FFmpeg Shorts fixture
          - ✅ ARM64 cargo/Tauri build
          - ✅ codesign verification
          - ✅ DMG verification
          - ✅ updater archive/signature generated
          - ✅ Candidate is eligible for automatic GitHub Release + updater activation after this job is green
          REPORT
          echo 'VYRON 2.1.0 SIGNED CANDIDATE: PASS — READY TO PUBLISH'

      - name: Upload exact signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.0-final-candidate
          path: .vyron-2100-release/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish VYRON 2.1.0 and activate updater
    needs: final-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ScaleUPPeisov/scaleup-dashboards
      VERSION: '2.1.0'
      TAG: 'v2.1.0'
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact green candidate
        uses: actions/download-artifact@v4
        with:
          name: VYRON-2.1.0-final-candidate
          path: release

      - name: Verify candidate and create updater manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in VYRON-2.1.0-macOS-AppleSilicon.dmg VYRON.app.tar.gz VYRON.app.tar.gz.sig VYRON-2.1.0-source.tar.gz SHA256.txt UPDATER_SHA256.txt SOURCE_SHA256.txt FINAL_TEST_REPORT.md; do
            test -s "release/$f"
          done
          cat > release/RELEASE_NOTES.md <<'NOTES'
          # VYRON YT PEISOV 2.1.0 — Shorts Factory + Production Repair

          - Добавлен Shorts Factory: Long → вертикальные Shorts 1080×1920 с реальным FFmpeg pipeline.
          - Shorts получили metadata workflow, расписание и синхронизацию реального `publishAt` с YouTube.
          - Long и Shorts используют единый future-safe scheduler без коллизий занятых слотов.
          - Добавлены Content Buffer и Storage Manager с безопасным архивированием без автоматического удаления исходников.
          - Усилен Error Center: очистка истории не меняет ERROR-задачи на SUCCESS; повторная ошибка снова отображается корректно.
          - Batch upload больше не засыпает интерфейс десятками toast: причины сохраняются в Error Center, наружу выводится агрегированное уведомление.
          - Сохранены Keychain recovery, cleanup, category/playlist, backup, quota и предыдущие production fixes.
          - Релиз публикуется только из exact signed candidate после полного macOS Apple Silicon gate.
          NOTES
          python3 - <<'PY'
          import json,datetime,pathlib
          rel=pathlib.Path('release')
          sig=(rel/'VYRON.app.tar.gz.sig').read_text().strip()
          if not sig:
              raise SystemExit('updater signature is empty')
          notes=(rel/'RELEASE_NOTES.md').read_text()
          data={
            'version':'2.1.0',
            'notes':notes,
            'pub_date':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'platforms':{
              'darwin-aarch64':{
                'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.0/VYRON.app.tar.gz',
                'signature':sig
              }
            }
          }
          (rel/'latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 - <<'PY'
          import json
          d=json.load(open('release/latest.json'))
          assert d['version']=='2.1.0'
          p=d['platforms']['darwin-aarch64']
          assert p['url'].endswith('/v2.1.0/VYRON.app.tar.gz')
          assert p['signature']
          print('Updater manifest: PASS')
          PY

      - name: Publish exact tested GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --title 'VYRON YT PEISOV 2.1.0 — Shorts Factory + Production Repair' \
              --notes-file release/RELEASE_NOTES.md \
              --draft=false --prerelease=false
          else
            gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" \
              --title 'VYRON YT PEISOV 2.1.0 — Shorts Factory + Production Repair' \
              --notes-file release/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber \
            release/VYRON-2.1.0-macOS-AppleSilicon.dmg \
            release/VYRON.app.tar.gz \
            release/VYRON.app.tar.gz.sig \
            release/VYRON-2.1.0-source.tar.gz \
            release/SHA256.txt release/UPDATER_SHA256.txt release/SOURCE_SHA256.txt \
            release/FINAL_TEST_REPORT.md release/RELEASE_NOTES.md release/latest.json

      - name: Activate stable updater 2.0.13 → 2.1.0
        shell: bash
        run: |
          set -Eeuo pipefail
          META=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main")
          CURRENT=$(printf '%s' "$META" | python3 -c 'import sys,json,base64;d=json.load(sys.stdin);print(base64.b64decode(d["content"]).decode())')
          CURRENT_VERSION=$(printf '%s' "$CURRENT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')
          test "$CURRENT_VERSION" = '2.0.13' -o "$CURRENT_VERSION" = '2.1.0'
          OLD_SHA=$(printf '%s' "$META" | python3 -c 'import sys,json;print(json.load(sys.stdin)["sha"])')
          CONTENT=$(base64 -w0 release/latest.json)
          gh api --method PUT "repos/$REPO/contents/vyron-updates/latest.json" \
            -f message='VYRON updater: activate 2.1.0 Shorts Factory production release' \
            -f content="$CONTENT" -f sha="$OLD_SHA" -f branch=main >/dev/null

      - name: Verify public production release and updater
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft|tostring')" = 'false'
          test "$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq '.isPrerelease|tostring')" = 'false'
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          for f in VYRON-2.1.0-macOS-AppleSilicon.dmg VYRON.app.tar.gz VYRON.app.tar.gz.sig VYRON-2.1.0-source.tar.gz latest.json FINAL_TEST_REPORT.md RELEASE_NOTES.md; do
            grep -qx "$f" <<<"$ASSETS"
          done
          LIVE=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | base64 --decode)
          test "$(printf '%s' "$LIVE" | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')" = '2.1.0'
          rm -f /tmp/vyron-release-latest.json
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir /tmp/vyron-release-check --clobber
          test "$(python3 -c "import json;print(json.load(open('/tmp/vyron-release-check/latest.json'))['version'])")" = '2.1.0'
          curl -fsIL --connect-timeout 10 --max-time 30 "https://github.com/$REPO/releases/download/$TAG/VYRON.app.tar.gz" >/dev/null
          curl -fsIL --connect-timeout 10 --max-time 30 "https://github.com/$REPO/releases/download/$TAG/VYRON.app.tar.gz.sig" >/dev/null
          curl -fsIL --connect-timeout 10 --max-time 30 "https://github.com/$REPO/releases/download/$TAG/VYRON-2.1.0-macOS-AppleSilicon.dmg" >/dev/null
          echo 'VYRON 2.1.0 PRODUCTION RELEASE: PASS'
          {
            echo '# VYRON 2.1.0 Production Release ✅'
            echo
            echo '- ✅ Exact green signed candidate published'
            echo '- ✅ GitHub Release v2.1.0 published'
            echo '- ✅ DMG / updater / signature / source published'
            echo '- ✅ main updater feed activated at 2.1.0'
            echo '- ✅ release latest.json verified'
            echo '- ✅ public updater/DMG asset URLs reachable'
          } >> "$GITHUB_STEP_SUMMARY"
