name: VYRON 2.0.11 Shorts Factory Final Gate
on:
  push:
    branches:
      - candidate/vyron-2.0.11-shorts-factory
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vyron-211-final-gate
  cancel-in-progress: true
jobs:
  macos-shorts-final:
    name: macOS Apple Silicon — Shorts Factory + full regression
    runs-on: macos-14
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust Apple Silicon target
        run: rustup target add aarch64-apple-darwin
      - name: FFmpeg and FFprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Verify signing material
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test "$APPLE_SIGNING_IDENTITY" = '-'
      - name: Build 2.0.11 and run full 2.0.10 plus Shorts regression
        shell: bash
        run: bash vyron-v211/release_build_v211.sh
      - name: Verify Shorts Factory contracts
        shell: bash
        run: |
          set -euo pipefail
          R=.vyron-v211-release
          grep -q 'СОЗДАТЬ SHORTS' "$R/src/ProductionOS.tsx"
          grep -q 'h264_videotoolbox' "$R/src-tauri/src/shorts_factory.rs"
          grep -q 'libx264' "$R/src-tauri/src/shorts_factory.rs"
          grep -q 'Total Video Uploads' "$R/src/QuotaMeter.tsx"
          grep -q "version:'2.0.11'" "$R/src/VyronReleaseHistory.tsx"
          test -s "$R/release/VYRON-2.0.11-macOS-AppleSilicon.dmg"
          test -s "$R/release/VYRON.app.tar.gz"
          test -s "$R/release/VYRON.app.tar.gz.sig"
          echo 'VYRON 2.0.11 REQUESTED SHORTS UX + RENDER + UPLOAD CONTRACT: PASS'
      - name: Upload final candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.0.11-shorts-factory-final-candidate
          path: .vyron-v211-release/release/
          if-no-files-found: error
          retention-days: 14
