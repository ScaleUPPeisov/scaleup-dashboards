name: VYRON 2.1.1 Runtime Diagnose NO PUBLISH

on:
  push:
    branches:
      - release/vyron-2.1.1-youtube-runtime-repair
    paths:
      - '.github/workflows/vyron-211-runtime-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose published 2.1.0 YouTube pipeline
    runs-on: macos-14
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download published 2.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vyron211diag"
          gh release download v2.1.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-2.1.0-source.tar.gz' --dir "$RUNNER_TEMP/vyron211diag"
          tar -xzf "$RUNNER_TEMP/vyron211diag/VYRON-2.1.0-source.tar.gz" -C "$RUNNER_TEMP/vyron211diag"
          test "$(node -p "require('$RUNNER_TEMP/vyron211diag/package.json').version")" = '2.1.0'
      - name: Print PublisherOS selection and runtime data flow
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vyron211diag"
          sed -n '1,95p' "$ROOT/src/PublisherOS.tsx"
      - name: Print metadata parser and schedule normalization
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vyron211diag"
          echo '===== metadata.ts ====='
          sed -n '1,360p' "$ROOT/src/metadata.ts"
          echo '===== publisherMetadata.ts ====='
          sed -n '1,220p' "$ROOT/src/publisherMetadata.ts"
          echo '===== publisherSchedule.ts ====='
          sed -n '1,220p' "$ROOT/src/publisherSchedule.ts"
      - name: Print error mapping and notification center
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vyron211diag"
          echo '===== errorCenter.ts ====='
          sed -n '1,320p' "$ROOT/src/errorCenter.ts"
          echo '===== notificationCenter.ts ====='
          sed -n '1,280p' "$ROOT/src/notificationCenter.ts"
      - name: Print upload frontend and backend boundaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vyron211diag"
          grep -nE 'youtubeUpload:|ytInvoke|youtube_upload_video|youtube_resume_upload|youtube_list_existing' "$ROOT/src/api.ts" "$ROOT/src-tauri/src/lib.rs" || true
          sed -n '160,230p' "$ROOT/src-tauri/src/youtube.rs"
      - name: Diagnose exact broken contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/vyron211diag"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); pub=(root/'src/PublisherOS.tsx').read_text(); yt=(root/'src-tauri/src/youtube.rs').read_text(); pm=(root/'src/publisherMetadata.ts').read_text()
          print('button_zero_label=', 'ЗАГРУЗИТЬ {selected.length} ВИДЕО НА YOUTUBE' in pub)
          print('button_blocked_zero=', '!selected.length' in pub and 'preflightBlocked' in pub)
          print('hardcoded_mp4_chunk=', '.header("Content-Type","video/mp4")' in yt)
          print('hardcoded_mp4_init=', '.header("X-Upload-Content-Type","video/mp4")' in yt)
          print('upload_has_post_insert_verify=', 'UPLOAD_VERIFY' in yt or 'videos.list verification' in yt)
          print('date_only_returns_raw=', 'if(row.publishAt)return row.publishAt' in pm)
          PY
          echo 'DIAGNOSE COMPLETE'
