name: VYRON OAuth History Inspect NO PUBLISH

on:
  push:
    branches:
      - release/vyron-2.1.1-youtube-runtime-repair
    paths:
      - '.github/workflows/vyron-2111-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact released sources
        shell: bash
        run: |
          set -Eeuo pipefail
          for V in 2.0.8 2.0.9 2.1.0; do
            SAFE="${V//./}"
            mkdir -p "$RUNNER_TEMP/v$SAFE" "$RUNNER_TEMP/src$SAFE"
            gh release download "v$V" --repo ScaleUPPeisov/scaleup-dashboards --pattern "VYRON-$V-source.tar.gz" --dir "$RUNNER_TEMP/src$SAFE"
            tar -xzf "$RUNNER_TEMP/src$SAFE/VYRON-$V-source.tar.gz" -C "$RUNNER_TEMP/v$SAFE"
          done
      - name: Build OAuth history evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/oauth-history"
          mkdir -p "$OUT"
          : > "$OUT/REPORT.txt"
          for SPEC in '208:2.0.8' '209:2.0.9' '210:2.1.0'; do
            SAFE="${SPEC%%:*}"; VER="${SPEC##*:}"; ROOT="$RUNNER_TEMP/v$SAFE"; DEST="$OUT/$VER"
            mkdir -p "$DEST"
            for F in src-tauri/src/youtube.rs src-tauri/src/security.rs src-tauri/src/storage.rs src-tauri/src/main.rs src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json; do
              [ -f "$ROOT/$F" ] && { mkdir -p "$DEST/$(dirname "$F")"; cp "$ROOT/$F" "$DEST/$F"; }
            done
            {
              echo "=== VYRON $VER: credential-related files ==="
              find "$ROOT" -type f \
                -not -path '*/node_modules/*' -not -path '*/target/*' \
                \( -iname '*oauth*' -o -iname '*token*' -o -iname '*credential*' -o -iname '*keychain*' -o -iname '*youtube*' -o -iname '*security*' -o -iname '*storage*' \) \
                | sed "s#^$ROOT/##" | sort | head -n 300 || true
              echo "=== VYRON $VER: exact storage/keychain evidence ==="
              grep -Rni -B 10 -A 24 -E 'refresh_token|access_token|youtube-oauth\.json|keyring|keychain|SERVICE|service_name|account|youtube:|oauth_key|OAuthProfile|LegacyTokenStore|set_secret|get_secret|write_profile_secrets|hydrate_profile_secrets|config_dir|app_data|app_data_dir|localStorage|sqlite|tauri.store|credential|remove_password|delete_credential|clear_credentials|reset_oauth|remove_file' \
                "$ROOT/src-tauri" "$ROOT/src" 2>/dev/null | head -n 2600 || true
              echo "=== VYRON $VER: identifiers ==="
              grep -Rni -B 4 -A 8 -E 'identifier|bundle|productName|package.name|com\.|ru\.|app_id|appId' "$ROOT/src-tauri/tauri.conf.json" "$ROOT/src-tauri/Cargo.toml" "$ROOT/package.json" 2>/dev/null | head -n 300 || true
              echo
            } >> "$OUT/REPORT.txt"
          done
          echo '=== YOUTUBE.RS DIFF 2.0.8 -> 2.0.9 ===' >> "$OUT/REPORT.txt"
          diff -u "$RUNNER_TEMP/v208/src-tauri/src/youtube.rs" "$RUNNER_TEMP/v209/src-tauri/src/youtube.rs" >> "$OUT/REPORT.txt" || true
          echo '=== YOUTUBE.RS DIFF 2.0.9 -> 2.1.0 ===' >> "$OUT/REPORT.txt"
          diff -u "$RUNNER_TEMP/v209/src-tauri/src/youtube.rs" "$RUNNER_TEMP/v210/src-tauri/src/youtube.rs" >> "$OUT/REPORT.txt" || true
      - name: Print OAuth history evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cat "$RUNNER_TEMP/oauth-history/REPORT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: vyron-oauth-history
          path: ${{ runner.temp }}/oauth-history
          if-no-files-found: error
          retention-days: 3
