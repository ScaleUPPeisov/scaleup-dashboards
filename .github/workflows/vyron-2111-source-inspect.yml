name: VYRON 2.1.1 Source Inspect NO PUBLISH

on:
  push:
    branches:
      - release/vyron-2.1.1-youtube-runtime-repair
    paths:
      - '.github/workflows/vyron-2111-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact published source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/app"
          gh release download v2.1.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-2.1.0-source.tar.gz' --dir "$RUNNER_TEMP/src"
          tar -xzf "$RUNNER_TEMP/src/VYRON-2.1.0-source.tar.gz" -C "$RUNNER_TEMP/app"
      - name: Inspect exact anchors
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/app"
          for spec in \
            'src/ProductionOS.tsx:1:90' \
            'src/productionManagerApi.ts:1:90' \
            'src/shortsCore.ts:1:150' \
            'src-tauri/src/local_delete.rs:1:120' \
            'src-tauri/Cargo.toml:1:180'; do
            f="${spec%%:*}"; rest="${spec#*:}"; a="${rest%%:*}"; b="${rest##*:}"
            echo "=== FILE $f ==="
            sed -n "${a},${b}p" "$ROOT/$f"
          done
          echo '=== NOTIFICATION IMPORTS ==='
          grep -RniE "import .*notify(Error|Success|Info)|from './.*notify|from './notifications|from './errorCenter'" "$ROOT/src" | head -n 120 || true
