name: VYRON 2.1.1 OAuth Health Inspect NO PUBLISH

on:
  push:
    branches:
      - release/vyron-2.1.1-youtube-runtime-repair
    paths:
      - '.github/workflows/vyron-2111-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact released 2.1.0 source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/src" "$RUNNER_TEMP/app"
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/app"
          gh release download v2.1.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-2.1.0-source.tar.gz' --dir "$RUNNER_TEMP/src"
          tar -xzf "$RUNNER_TEMP/src/VYRON-2.1.0-source.tar.gz" -C "$RUNNER_TEMP/app"
      - name: Exact OAuth health and reconnect anchors
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/app"
          echo '=== OAUTH RS HEALTH/REFRESH CONTEXT ==='
          grep -n -B 25 -A 45 -E 'reauth_required|reauthRequired|refresh_access_token|load_tokens|delete_password|SERVICE|youtube-profile-|oauth_disconnect|disconnect|reconnect|enrich' "$ROOT/src-tauri/src/oauth.rs" || true
          echo '=== ALL REAUTH REFERENCES ==='
          grep -Rni -B 8 -A 16 -E 'reauthRequired|reauth_required' "$ROOT/src" "$ROOT/src-tauri/src" || true
          echo '=== ALL KEYCHAIN SERVICE / ACCOUNT FORMATS ==='
          grep -Rni -B 4 -A 10 -E 'const SERVICE|youtube-profile-|set_password_bytes|get_password_bytes|delete_password|keychain' "$ROOT/src-tauri/src" || true
          echo '=== TOKEN STORAGE OUTSIDE OAUTH.RS ==='
          grep -Rni -B 4 -A 10 -E 'refresh_token|refreshToken|access_token|accessToken|oauth.*token|token.*oauth' "$ROOT/src" "$ROOT/src-tauri/src" | grep -v '/oauth.rs' || true
          echo '=== LOCAL STORAGE / FILE STORAGE CANDIDATES ==='
          grep -Rni -B 3 -A 8 -E 'localStorage|sessionStorage|write.*token|read.*token|token.*json|oauth.*json|credentials|credential' "$ROOT/src" "$ROOT/src-tauri/src" || true
      - name: Show exact OAuth file
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -n '1,520p' "$RUNNER_TEMP/app/src-tauri/src/oauth.rs"
