name: VYRON 2.1.13 Global OAuth Preflight Stable Release

on:
  push:
    branches:
      - release/vyron-2.1.13-global-oauth-preflight
    paths:
      - '.github/workflows/vyron-2113-global-oauth-preflight-stable.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-2113-global-oauth-preflight-stable
  cancel-in-progress: false

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.13'
  TAG: v2.1.13
  PREVIOUS_STABLE: '2.1.12'
  SOURCE_RC: 4b8acb699a6b7a5b773035c6b58674d637492789
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  stable-release:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.13-global-oauth-preflight
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Source freeze and 2.1.13 preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          HOTFIX_HEAD="$(git rev-parse HEAD)"
          test "$(git merge-base "$SOURCE_RC" HEAD)" = "$SOURCE_RC"
          git merge-base --is-ancestor "$SOURCE_RC" HEAD

          python3 - <<'PY'
          import json,re,subprocess,os
          from pathlib import Path
          source=os.environ['SOURCE_RC']
          allowed={
            'package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock','src-tauri/tauri.conf.json',
            'src-tauri/src/youtube.rs',
            'src/api.ts','src/AccountsPage.tsx','src/AuthRecoveryCenter.tsx','src/authRecoveryFinalCore.ts',
            'src/v2113GlobalOauthPreflight.test.ts',
            '.github/workflows/vyron-2113-global-oauth-preflight-stable.yml',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only',f'{source}..HEAD'],text=True).splitlines()))
          extra=changed-allowed
          if extra: raise SystemExit('BLOCKER=UNAUTHORIZED_HOTFIX_DIFF:'+','.join(sorted(extra)))
          required={'src-tauri/src/youtube.rs','src/AccountsPage.tsx','src/v2113GlobalOauthPreflight.test.ts'}
          if not required <= changed: raise SystemExit('BLOCKER=GLOBAL_OAUTH_PREFLIGHT_DIFF_INCOMPLETE:'+','.join(sorted(required-changed)))

          pkg=json.load(open('package.json')); lock=json.load(open('package-lock.json')); conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=Path('src-tauri/Cargo.toml').read_text(); clock=Path('src-tauri/Cargo.lock').read_text()
          assert pkg['version']=='2.1.13'
          assert lock['version']=='2.1.13'
          assert lock['packages']['']['version']=='2.1.13'
          assert conf['version']=='2.1.13'
          assert conf['identifier']=='studio.channelflow.desktop'
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']==os.environ['EMBEDDED_UPDATER_KEY']
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.13"\s*$',cargo)
          assert re.search(r'\[\[package\]\]\nname = "channelflow"\nversion = "2\.1\.13"',clock)
          print('SOURCE_FREEZE_FROM_2_1_12=PASS')
          print('VERSION_2_1_13=PASS')
          PY

          test -n "${VYRON_MACOS_SIGNING_P12_BASE64:-}"
          test -n "${VYRON_MACOS_SIGNING_P12_PASSWORD:-}"
          test "$VYRON_MACOS_SIGNING_IDENTITY" = 'VYRON Local Code Signing'
          ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
          ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1

          STABLE_TARGET="$(gh release view v2.1.12 --repo "$REPO" --json targetCommitish --jq .targetCommitish)"
          test "$STABLE_TARGET" = "$SOURCE_RC"

          FEED="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$PREVIOUS_STABLE"

          echo "HOTFIX_HEAD=$HOTFIX_HEAD"
          echo 'BASE_STABLE_2_1_12=VERIFIED'
          echo 'LATEST_JSON_VERSION=2.1.12'
      - name: Global OAuth readiness, add-channel and NO-UI contract
        shell: bash
        run: |
          set -Eeuo pipefail
          S=src-tauri/src/security.rs
          Y=src-tauri/src/youtube.rs
          A=src/AccountsPage.tsx
          R=src/AuthRecoveryCenter.tsx

          grep -Fq 'pub const CANONICAL_SERVICE:&str="com.scaleup.vyron.security.v2"' "$S"
          grep -Fq 'let ready_for_oauth=configured&&c.client_secret_present;' "$Y"
          grep -Fq 'OAUTH_CLIENT_SETUP_REQUIRED' "$Y"
          grep -Fq 'if c.client_secret.trim().is_empty()' "$Y"
          grep -Fq 'readyForOAuth' "$A"
          grep -Fq 'Сначала настроить OAuth Client' "$A"
          grep -Fq 'credentials.json нужен один раз для самого VYRON OAuth Client' "$A"
          grep -Fq 'GLOBAL GOOGLE CONFIG один раз' "$R"
          grep -Fq 'kSecUseAuthenticationUISkip' "$S"
          ! grep -Fq 'get_generic_password(' "$S"
          ! grep -Fq 'set_generic_password(' "$S"
          ! grep -Fq 'delete_generic_password(' "$S"

          python3 - <<'PY'
          import json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          assert conf['identifier']=='studio.channelflow.desktop'
          y=Path('src-tauri/src/youtube.rs').read_text()
          block=y.split('pub async fn youtube_oauth_connect_global(',1)[1].split('#[tauri::command]',1)[0]
          assert block.index('if c.client_secret.trim().is_empty()') < block.index('youtube_oauth_connect(app')
          accounts=Path('src/AccountsPage.tsx').read_text()
          assert accounts.index('if(!config?.readyForOAuth)') < accounts.index('api.youtubeOauthBrowsers()')
          assert 'find(|p|p.channel_id.as_deref()==Some(channel_id.as_str()))' in y
          assert 'let profile_id=reconnect_profile_id(existing.as_ref());' in y
          production=y.split('#[cfg(test)]',1)[0]
          assert 'security::legacy_get_secret_once' not in production
          print('GLOBAL_OAUTH_READY_REQUIRES_SECRET=PASS')
          print('ADD_CHANNEL_PREFLIGHT_BEFORE_BROWSER=PASS')
          print('EXISTING_PROFILE_UUID_REUSE=PASS')
          print('LEGACY_SECRET_READS=0')
          print('KEYCHAIN_NO_UI_CONTRACT=PASS')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted global OAuth preflight, recovery and updater tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run \
            src/v2113GlobalOauthPreflight.test.ts \
            src/v2112BrowserReconnectRecovery.test.ts \
            src/v2111ClientSecretContinuity.test.ts \
            src/finalAuthRecoveryUi.test.ts \
            src/v2110OauthContinuity.test.ts \
            src/v213KeychainRecovery.test.ts \
            src/nativeRecoverySafety.test.ts \
            src/keychainPassiveArchitecture.test.ts \
            src/updaterPolicy.test.ts \
            src/updaterRuntime.test.ts \
            src/updaterRemoteContract.test.ts
          cargo test --manifest-path src-tauri/Cargo.toml v2113_global_oauth_preflight_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2112_browser_reconnect_recovery_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2111_client_secret_continuity_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml keychain_prompt_architecture_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v219_rc7_secitem_ui_skip_tests -- --nocapture
          echo 'PHYSICAL_2_1_12_ADD_CHANNEL_REGRESSION=PASS'
          echo 'GLOBAL_OAUTH_PREFLIGHT_TESTS=PASS'
          echo 'EXISTING_PROFILE_UUID_REUSE_TESTS=PASS'
          echo 'BROWSER_SELECTION_FLOW=PASS'
          echo 'KEYCHAIN_NO_UI_TESTS=PASS'
      - name: Full regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml -- --skip security::tests::keychain_roundtrip
          npx tsc --noEmit
          npm run build
          echo 'FRONTEND_REGRESSION=PASS'
          echo 'RUST_REGRESSION=PASS'
          echo 'TYPESCRIPT=PASS'
          echo 'PRODUCTION_FRONTEND_BUILD=PASS'

      - name: Import persistent VYRON signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          CERT="$RUNNER_TEMP/vyron-signing.pem"

          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c "$VYRON_MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          test -s "$CERT"

          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PERSISTENT_CERT_SHA1=$ID_SHA1"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw
          def dec(x):
            try:return base64.b64decode(x,validate=True).decode()
            except:return None
          if raw.startswith('untrusted comment:'):
            out=base64.b64encode(raw.encode()).decode();box=raw
          else:
            one=dec(raw)
            if one and one.startswith('untrusted comment:'):
              out=raw;box=one
            else:
              box=dec(one) if one else None
              assert box and box.startswith('untrusted comment:')
              out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed production ARM64 and updater
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

          mkdir -p production
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP"
          test -s "$DMG"
          test -s "$UPDATER"
          test -s "$SIG"

          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee production/codesign-details.txt
          codesign -d -r- "$APP" 2>&1 | tee production/designated-requirement.txt
          ! grep -F 'Signature=adhoc' production/codesign-details.txt
          DR="$(sed -n 's/^designated => //p' production/designated-requirement.txt | head -n1)"
          test -n "$DR"
          case "$DR" in cdhash*) exit 1;; esac
          echo "$DR" | grep -F "$BUNDLE_ID" >/dev/null
          rm -rf /tmp/vyron-stable-2112 && mkdir /tmp/vyron-stable-2112
          gh release download v2.1.12 --repo "$REPO" --dir /tmp/vyron-stable-2112 --pattern designated-requirement.txt
          cmp -s production/designated-requirement.txt /tmp/vyron-stable-2112/designated-requirement.txt
          echo 'SIGNING_IDENTITY_CONTINUITY=PASS'

          hdiutil verify "$DMG"
          cp "$DMG" "production/VYRON-$VERSION-arm64.dmg"
          cp "$UPDATER" production/VYRON.app.tar.gz
          cp "$SIG" production/VYRON.app.tar.gz.sig
          shasum -a 256 "production/VYRON-$VERSION-arm64.dmg" | tee "production/VYRON-$VERSION-arm64.dmg.sha256"
          shasum -a 256 production/VYRON.app.tar.gz | tee production/VYRON.app.tar.gz.sha256

          python3 - <<'PY'
          import base64,os,pathlib
          pathlib.Path('/tmp/vyron-updater.pub').write_bytes(base64.b64decode(os.environ['EMBEDDED_UPDATER_KEY']))
          encoded=pathlib.Path('production/VYRON.app.tar.gz.sig').read_text().strip()
          pathlib.Path('/tmp/vyron-updater.sig').write_bytes(base64.b64decode(encoded))
          PY
          mkdir -p /tmp/vyron-minisign-verify/src
          cat >/tmp/vyron-minisign-verify/Cargo.toml <<'EOF'
          [package]
          name = "vyron-minisign-verify"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          minisign-verify = "0.2.5"
          EOF
          cat >/tmp/vyron-minisign-verify/src/main.rs <<'EOF'
          use minisign_verify::{PublicKey,Signature};
          use std::{env,path::Path};
          fn main(){
            let a:Vec<String>=env::args().collect();
            assert_eq!(a.len(),4,"usage: verify <pubkey> <archive> <signature>");
            let pk=PublicKey::from_file(Path::new(&a[1])).expect("public key parse");
            let sig=Signature::from_file(Path::new(&a[3])).expect("signature parse");
            let data=std::fs::read(&a[2]).expect("archive read");
            pk.verify(&data,&sig,false).expect("updater signature verify");
            println!("MINISIGN_SIGNATURE=VERIFIED");
          }
          EOF
          cargo run --quiet --manifest-path /tmp/vyron-minisign-verify/Cargo.toml --             /tmp/vyron-updater.pub production/VYRON.app.tar.gz /tmp/vyron-updater.sig

          echo "DESIGNATED_REQUIREMENT=$DR"
          echo 'ARM64_BUILD=PASS'
          echo 'CODESIGN=PASS'
          echo 'DMG_VERIFY=PASS'
          echo 'UPDATER_SIGNATURE=VERIFIED'

      - name: Finder-like stable launch
        shell: bash
        run: |
          set -Eeuo pipefail
          M="$RUNNER_TEMP/vyron-2113-stable-mount"
          rm -rf "$M"; mkdir -p "$M"
          hdiutil attach "production/VYRON-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$M"
          trap 'hdiutil detach "$M" >/dev/null 2>&1 || true' EXIT
          A="$M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$A/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$A"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/"             "$A/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-2113-stable-launch.log 2>&1 &
          P=$!
          sleep 8
          kill -0 "$P"
          kill "$P" || true
          wait "$P" || true
          hdiutil detach "$M"; trap - EXIT
          echo 'APP_START=PASS'
          echo 'BLACK_SCREEN=NO'
          echo 'VERSION=2.1.13'

      - name: Create candidate updater manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY'
          import json,os,pathlib
          sig=pathlib.Path('production/VYRON.app.tar.gz.sig').read_text().strip()
          d={
            'version':'2.1.13',
            'notes':'VYRON 2.1.13 — исправлен Add Channel/global OAuth preflight. Client ID без Client Secret больше не считается готовой конфигурацией и Google не открывается до one-time credentials.json setup. После этого каналы подключаются через выбранный браузер, а существующий Channel ID переиспользует прежний Profile UUID.',
            'pub_date':os.environ['PUB_DATE'],
            'platforms':{
              'darwin-aarch64':{
                'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.13/VYRON.app.tar.gz',
                'signature':sig,
              }
            }
          }
          pathlib.Path('production/latest.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 - <<'PY'
          import json
          d=json.load(open('production/latest.json'))
          assert d['version']=='2.1.13'
          assert d['platforms']['darwin-aarch64']['url'].endswith('/releases/download/v2.1.13/VYRON.app.tar.gz')
          assert 'rc.7' not in d['platforms']['darwin-aarch64']['url']
          print('CANDIDATE_MANIFEST=PASS')
          PY

      - name: Confirm feed still 2.1.12 before publish
        shell: bash
        run: |
          set -Eeuo pipefail
          FEED="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$PREVIOUS_STABLE"
          echo 'LATEST_JSON_VERSION_BEFORE_RELEASE=2.1.12'

      - name: Publish GitHub stable release v2.1.13
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 2.1.13

          Global OAuth setup / Add Channel hotfix.

          - Fixes the physical 2.1.12 failure where Add Channel opened Google with client_id present but global client_secret missing.
          - OAuth Client is considered ready only when both client_id and canonical client_secret are available.
          - credentials.json is a one-time setup for the VYRON OAuth Client, not one file per YouTube channel.
          - Add Channel blocks before opening Google when global OAuth is incomplete.
          - After global setup, each channel is connected by choosing the desired browser and Google/YouTube account.
          - A successful OAuth for an already known YouTube Channel ID reuses the existing Profile UUID and writes canonical credentials.
          - macOS Keychain remains non-interactive; legacy Keychain secrets are not read automatically.

          Built directly on VYRON 2.1.12 stable source after physical Mac evidence.
          EOF

          gh release create "$TAG"             --repo "$REPO"             --target "$FINAL_HEAD"             --title 'VYRON 2.1.13'             --notes-file /tmp/release-notes.md             "production/VYRON-$VERSION-arm64.dmg"             "production/VYRON-$VERSION-arm64.dmg.sha256"             production/VYRON.app.tar.gz             production/VYRON.app.tar.gz.sha256             production/VYRON.app.tar.gz.sig             production/codesign-details.txt             production/designated-requirement.txt             production/latest.json

          echo "STABLE_RELEASE_TARGET=$FINAL_HEAD"

      - name: Remote stable release verification
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          gh api "repos/$REPO/releases/tags/$TAG" > /tmp/release.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/release.json'))
          assert d['tag_name']=='v2.1.13'
          assert d['draft'] is False
          assert d['prerelease'] is False
          assert d['target_commitish']==os.popen('git rev-parse HEAD').read().strip()
          names={a['name'] for a in d['assets']}
          required={
            'VYRON-2.1.13-arm64.dmg','VYRON-2.1.13-arm64.dmg.sha256',
            'VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig',
            'codesign-details.txt','designated-requirement.txt','latest.json'
          }
          assert required <= names
          for a in d['assets']:
            if a['name'] in required:
              assert a['size']>0
          print('REMOTE_RELEASE_METADATA=PASS')
          PY

          LOCAL_DMG="$(shasum -a 256 "production/VYRON-$VERSION-arm64.dmg" | awk '{print $1}')"
          LOCAL_UPDATER="$(shasum -a 256 production/VYRON.app.tar.gz | awk '{print $1}')"
          REMOTE_DMG="$(python3 -c 'import json;d=json.load(open("/tmp/release.json"));print(next(a["digest"] for a in d["assets"] if a["name"]=="VYRON-2.1.13-arm64.dmg"))')"
          REMOTE_UPDATER="$(python3 -c 'import json;d=json.load(open("/tmp/release.json"));print(next(a["digest"] for a in d["assets"] if a["name"]=="VYRON.app.tar.gz"))')"
          test "$REMOTE_DMG" = "sha256:$LOCAL_DMG"
          test "$REMOTE_UPDATER" = "sha256:$LOCAL_UPDATER"

          rm -rf remote && mkdir remote
          gh release download "$TAG" --repo "$REPO" --dir remote             --pattern 'VYRON.app.tar.gz'             --pattern 'VYRON.app.tar.gz.sig'             --pattern 'latest.json'
          test "$(shasum -a 256 remote/VYRON.app.tar.gz | awk '{print $1}')" = "$LOCAL_UPDATER"
          cmp -s remote/VYRON.app.tar.gz.sig production/VYRON.app.tar.gz.sig
          cmp -s remote/latest.json production/latest.json
          python3 - <<'PY'
          import base64,pathlib
          encoded=pathlib.Path('remote/VYRON.app.tar.gz.sig').read_text().strip()
          pathlib.Path('/tmp/vyron-updater-remote.sig').write_bytes(base64.b64decode(encoded))
          PY
          cargo run --quiet --manifest-path /tmp/vyron-minisign-verify/Cargo.toml --             /tmp/vyron-updater.pub remote/VYRON.app.tar.gz /tmp/vyron-updater-remote.sig

          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"

          FEED="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$PREVIOUS_STABLE"

          echo "DMG_SHA256=$LOCAL_DMG"
          echo "UPDATER_SHA256=$LOCAL_UPDATER"
          echo 'UPDATER_SIGNATURE_REMOTE=VERIFIED'
          echo 'GITHUB_STABLE_RELEASE=PUBLISHED'
          echo 'LATEST_JSON_STILL=2.1.12'

      - name: Activate stable updater feed on main
        shell: bash
        run: |
          set -Eeuo pipefail
          CURRENT="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$CURRENT" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$PREVIOUS_STABLE"
          FEED_SHA="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .sha)"
          B64="$(base64 < production/latest.json | tr -d '\n')"
          gh api --method PUT "repos/$REPO/contents/vyron-updates/latest.json"             -f message='release: activate VYRON 2.1.13 updater feed'             -f content="$B64"             -f sha="$FEED_SHA"             -f branch=main >/tmp/feed-update.json
          echo 'UPDATER_FEED_SWITCH=COMMITTED'

      - name: Final updater activation verification
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/latest-main.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/latest-main.json'))
          assert d['version']=='2.1.13'
          p=d['platforms']['darwin-aarch64']
          assert p['url']=='https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.13/VYRON.app.tar.gz'
          assert 'rc.7' not in p['url']
          assert p['signature']==pathlib.Path('production/VYRON.app.tar.gz.sig').read_text().strip()
          cur=tuple(map(int,'2.1.12'.split('.')))
          nxt=tuple(map(int,d['version'].split('.')))
          assert nxt>cur
          print('LATEST_JSON_VERSION=2.1.13')
          print('UPDATE_FROM_2.1.12=AVAILABLE')
          PY

          cargo run --quiet --manifest-path /tmp/vyron-minisign-verify/Cargo.toml --             /tmp/vyron-updater.pub remote/VYRON.app.tar.gz /tmp/vyron-updater-remote.sig

          echo 'STABLE_TAG=v2.1.13'
          echo 'STABLE_RELEASE_PRERELEASE=false'
          echo 'UPDATER_ASSET=VERIFIED'
          echo 'UPDATER_SIGNATURE=VERIFIED'
          echo 'DMG_SHA256=VERIFIED'
          echo 'GLOBAL_OAUTH_ADD_CHANNEL=FIXED'
          echo 'GLOBAL_OAUTH_PREFLIGHT=PASS'
          echo 'LEGACY_SECRET_READS=0'
          echo 'OAUTH_UPDATE_CONTINUITY=PASS'
          echo 'VYRON_2_1_11_STABLE_RELEASED=YES'
          echo 'READY_FOR_USERS=YES'

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-signing.p12" "$RUNNER_TEMP/vyron-signing.pem"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          fi
