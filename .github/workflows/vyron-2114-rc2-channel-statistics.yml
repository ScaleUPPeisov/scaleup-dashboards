name: VYRON 2.1.14 RC2 Channel Statistics

on:
  push:
    branches:
      - release/vyron-2.1.14-rc2-channel-statistics
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-2114-rc2-channel-statistics
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.14-rc.2'
  TAG: v2.1.14-rc.2
  STABLE_VERSION: '2.1.13'
  SOURCE_STABLE: d137eaa87393e4e5d234f2803f74f73118a5dedb
  SOURCE_RC1: 986b160cc710467ab0e99ed2c3476506d006fc62
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  rc-build:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.14-rc1-youtube-oauth-onboarding
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Source freeze and RC preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          RC_HEAD="$(git rev-parse HEAD)"
          test "$(git merge-base "$SOURCE_RC1" HEAD)" = "$SOURCE_RC1"
          git merge-base --is-ancestor "$SOURCE_RC1" HEAD
          python3 - <<'PY'
          import json,re,subprocess,os
          from pathlib import Path
          source=os.environ['SOURCE_RC1']
          allowed={
            'package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock','src-tauri/tauri.conf.json',
            'src-tauri/src/youtube.rs','src-tauri/src/lib.rs','src/types.ts','src/api.ts','src/AccountsPage.tsx','src/YouTubeChannelBar.tsx',
            'src/styles.css','src/youtubeChannelStats.ts','src/youtubeChannelStats.test.ts','src/v2114ChannelStatistics.test.ts',
            '.github/workflows/vyron-2114-rc2-channel-statistics.yml',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only',f'{source}..HEAD'],text=True).splitlines()))
          extra=changed-allowed
          if extra: raise SystemExit('BLOCKER=UNAUTHORIZED_RC_DIFF:'+','.join(sorted(extra)))
          required={'src-tauri/src/youtube.rs','src-tauri/src/lib.rs','src/types.ts','src/api.ts','src/AccountsPage.tsx','src/YouTubeChannelBar.tsx','src/youtubeChannelStats.ts','src/v2114ChannelStatistics.test.ts'}
          if not required <= changed: raise SystemExit('BLOCKER=CHANNEL_STATS_DIFF_INCOMPLETE:'+','.join(sorted(required-changed)))
          pkg=json.load(open('package.json')); lock=json.load(open('package-lock.json')); conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=Path('src-tauri/Cargo.toml').read_text(); clock=Path('src-tauri/Cargo.lock').read_text()
          assert pkg['version']=='2.1.14-rc.2'
          assert lock['version']=='2.1.14-rc.2'
          assert lock['packages']['']['version']=='2.1.14-rc.2'
          assert conf['version']=='2.1.14-rc.2'
          assert conf['identifier']=='studio.channelflow.desktop'
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']==os.environ['EMBEDDED_UPDATER_KEY']
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.14-rc\.2"\s*$',cargo)
          assert re.search(r'\[\[package\]\]\nname = "channelflow"\nversion = "2\.1\.14-rc\.2"',clock)
          print('SOURCE_STABLE=VERIFIED')
          print('VERSION_RC=PASS')
          PY
          test -n "${VYRON_MACOS_SIGNING_P12_BASE64:-}"
          test -n "${VYRON_MACOS_SIGNING_P12_PASSWORD:-}"
          test "$VYRON_MACOS_SIGNING_IDENTITY" = 'VYRON Local Code Signing'
          ! git ls-remote --exit-code --tags origin "refs/tags/v2.1.14" >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
          ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1
          STABLE_TARGET="$(gh release view v2.1.13 --repo "$REPO" --json targetCommitish --jq .targetCommitish)"
          test "$STABLE_TARGET" = "$SOURCE_STABLE"
          FEED="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$STABLE_VERSION"
          RC1_TARGET="$(gh release view v2.1.14-rc.1 --repo "$REPO" --json targetCommitish --jq .targetCommitish)"
          test "$RC1_TARGET" = "$SOURCE_RC1"
          echo "RC_HEAD=$RC_HEAD"
          echo 'SOURCE_RC1=VERIFIED'
          echo 'LATEST_JSON_VERSION=2.1.13'

      - name: OAuth and channel statistics source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          Y=src-tauri/src/youtube.rs
          A=src/AccountsPage.tsx
          S=src-tauri/src/security.rs
          grep -Fq 'reconcile_google_config_presence' "$Y"
          grep -Fq 'security::list_canonical_secret_accounts("")' "$Y"
          grep -Fq 'urlencoding::encode("select_account consent")' "$Y"
          grep -Fq 'access_type=offline' "$Y"
          grep -Fq 'include_granted_scopes=true' "$Y"
          grep -Fq 'client_secret: String::new()' "$Y"
          grep -Fq '>+ Добавить канал</button>' "$A"
          grep -Fq "if(!profileId&&!config?.oauthReady)" "$A"
          grep -Fq 'pub const CANONICAL_SERVICE:&str="com.scaleup.vyron.security.v2"' "$S"
          grep -Fq 'kSecUseAuthenticationUISkip' "$S"
          ! grep -Fq 'get_generic_password(' "$S"
          python3 - <<'PY'
          from pathlib import Path
          y=Path('src-tauri/src/youtube.rs').read_text()
          start=y.index('async fn youtube_oauth_connect(')
          end=y.index('fn reconnect_profile_id',start)
          connect=y[start:end]
          assert connect.index('TcpListener::bind("127.0.0.1:0")') < connect.index('open_browser(&auth_url')
          assert 'OAUTH_STATE_MISMATCH' in connect
          assert 'YOUTUBE_CHANNEL_NOT_FOUND' in connect
          assert 'client_secret: String::new()' in connect
          assert 'canonical_set_secret(GOOGLE_CLIENT_SECRET' in connect
          print('REAL_CALLBACK_CHAIN_SOURCE=PASS')
          print('GLOBAL_SECRET_NEW_CHANNEL_CONTRACT=PASS')
          print('ACCOUNT_SELECTOR_SOURCE=PASS')
          PY
          grep -Fq 'pub async fn youtube_channel_statistics' "$Y"
          grep -Fq 'snippet,statistics' "$Y"
          grep -Fq 'hiddenSubscriberCount' "$Y"
          grep -Fq 'statisticsUpdatedAt' "$Y"
          grep -Fq 'youtubeChannelStatistics' src/api.ts
          grep -Fq 'isChannelStatsStale' src/AccountsPage.tsx
          grep -Fq 'Всего просмотров' src/YouTubeChannelBar.tsx
          echo 'CHANNEL_STATISTICS_SOURCE=PASS'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted OAuth onboarding channel statistics and regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run             src/v2114ChannelStatistics.test.ts             src/youtubeChannelStats.test.ts             src/v2114OauthOnboarding.test.ts             src/v2113ExistingChannelRebind.test.ts             src/v2112BrowserReconnectRecovery.test.ts             src/v2111ClientSecretContinuity.test.ts             src/finalAuthRecoveryUi.test.ts             src/v2110OauthContinuity.test.ts             src/v213KeychainRecovery.test.ts             src/nativeRecoverySafety.test.ts             src/keychainPassiveArchitecture.test.ts             src/updaterPolicy.test.ts             src/updaterRuntime.test.ts             src/updaterRemoteContract.test.ts
          cargo test --manifest-path src-tauri/Cargo.toml v2114_channel_statistics_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2114_oauth_onboarding_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2113_existing_channel_rebind_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2112_browser_reconnect_recovery_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml keychain_prompt_architecture_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v219_rc7_secitem_ui_skip_tests -- --nocapture
          echo 'TARGETED_OAUTH_AND_CHANNEL_STATISTICS=PASS'

      - name: Full regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml -- --skip security::tests::keychain_roundtrip
          npx tsc --noEmit
          npm run build
          echo 'FRONTEND_REGRESSION=PASS'
          echo 'RUST_REGRESSION=PASS'
          echo 'TYPESCRIPT=PASS'
          echo 'PRODUCTION_FRONTEND_BUILD=PASS'

      - name: Import persistent VYRON signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          CERT="$RUNNER_TEMP/vyron-signing.pem"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c "$VYRON_MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          test -s "$CERT"
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw
          def dec(x):
            try:return base64.b64decode(x,validate=True).decode()
            except:return None
          if raw.startswith('untrusted comment:'):
            out=base64.b64encode(raw.encode()).decode();box=raw
          else:
            one=dec(raw)
            if one and one.startswith('untrusted comment:'):
              out=raw;box=one
            else:
              box=dec(one) if one else None
              assert box and box.startswith('untrusted comment:')
              out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed ARM64 RC and updater
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p production
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee production/codesign-details.txt
          codesign -d -r- "$APP" 2>&1 | tee production/designated-requirement.txt
          ! grep -F 'Signature=adhoc' production/codesign-details.txt
          DR="$(sed -n 's/^designated => //p' production/designated-requirement.txt | head -n1)"
          test -n "$DR"
          case "$DR" in cdhash*) exit 1;; esac
          echo "$DR" | grep -F "$BUNDLE_ID" >/dev/null
          rm -rf /tmp/vyron-stable-2113 && mkdir /tmp/vyron-stable-2113
          gh release download v2.1.13 --repo "$REPO" --dir /tmp/vyron-stable-2113 --pattern designated-requirement.txt
          cmp -s production/designated-requirement.txt /tmp/vyron-stable-2113/designated-requirement.txt
          hdiutil verify "$DMG"
          cp "$DMG" "production/VYRON-$VERSION-arm64.dmg"
          cp "$UPDATER" production/VYRON.app.tar.gz
          cp "$SIG" production/VYRON.app.tar.gz.sig
          shasum -a 256 "production/VYRON-$VERSION-arm64.dmg" | tee "production/VYRON-$VERSION-arm64.dmg.sha256"
          shasum -a 256 production/VYRON.app.tar.gz | tee production/VYRON.app.tar.gz.sha256
          echo 'ARM64_BUILD=PASS'
          echo 'CODESIGN=PASS'
          echo 'DMG_VERIFY=PASS'
          echo 'SIGNING_IDENTITY_CONTINUITY=PASS'

      - name: Finder-like RC launch
        shell: bash
        run: |
          set -Eeuo pipefail
          M="$RUNNER_TEMP/vyron-2114-rc2-mount"
          rm -rf "$M"; mkdir -p "$M"
          hdiutil attach "production/VYRON-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$M"
          trap 'hdiutil detach "$M" >/dev/null 2>&1 || true' EXIT
          A="$M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$A/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$A"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/"             "$A/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-2114-rc2-launch.log 2>&1 &
          P=$!
          sleep 8
          kill -0 "$P"
          kill "$P" || true
          wait "$P" || true
          hdiutil detach "$M"; trap - EXIT
          echo 'APP_START=PASS'
          echo 'BLACK_SCREEN=NO'

      - name: Verify production feed remains stable 2.1.13
        shell: bash
        run: |
          set -Eeuo pipefail
          FEED="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$STABLE_VERSION"
          echo 'LATEST_JSON_VERSION=2.1.13'

      - name: Publish RC prerelease only
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 2.1.14-rc.2

          YouTube OAuth onboarding + factual channel statistics candidate.

          - OAuth Ready is reconciled from actual canonical Keychain account presence, not stale metadata alone.
          - The Add Channel action remains visible and routes through the real GLOBAL OAuth readiness gate.
          - New-channel OAuth explicitly requests Google account selection plus offline consent.
          - One GLOBAL OAuth client secret is used for new channels; historical profile-specific secrets remain supported for compatibility.
          - Existing refresh tokens, Profile UUIDs, channel mappings and Keychain data are preserved.
          - macOS Keychain remains non-interactive.
          - channels.list(part=snippet,statistics) now supplies subscriberCount, viewCount, videoCount, hiddenSubscriberCount and channel identity metadata.
          - New OAuth connections piggyback statistics on the existing channel discovery request, avoiding an extra API unit.
          - Channel statistics persist in existing AppState cache and refresh only when stale (30 minutes), on health check, or manual refresh.
          - Failed refresh keeps the last known factual values instead of replacing them with zero.
          - Active Channel Center and all account cards show subscribers, total channel views and video count.

          Physical Google OAuth acceptance is mandatory before any stable 2.1.14 release.
          Stable updater feed remains on 2.1.13.
          EOF
          gh release create "$TAG"             --repo "$REPO"             --target "$FINAL_HEAD"             --title 'VYRON 2.1.14 RC2'             --prerelease             --notes-file /tmp/release-notes.md             "production/VYRON-$VERSION-arm64.dmg"             "production/VYRON-$VERSION-arm64.dmg.sha256"             production/VYRON.app.tar.gz             production/VYRON.app.tar.gz.sha256             production/VYRON.app.tar.gz.sig             production/codesign-details.txt             production/designated-requirement.txt
          echo "RC_RELEASE_TARGET=$FINAL_HEAD"

      - name: Remote RC verification
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          gh api "repos/$REPO/releases/tags/$TAG" > /tmp/release.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/release.json'))
          assert d['tag_name']=='v2.1.14-rc.2'
          assert d['draft'] is False
          assert d['prerelease'] is True
          assert d['target_commitish']==os.popen('git rev-parse HEAD').read().strip()
          names={a['name'] for a in d['assets']}
          required={'VYRON-2.1.14-rc.2-arm64.dmg','VYRON-2.1.14-rc.2-arm64.dmg.sha256','VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig','codesign-details.txt','designated-requirement.txt'}
          assert required <= names
          for a in d['assets']:
            if a['name'] in required: assert a['size']>0
          print('REMOTE_RC_METADATA=PASS')
          PY
          LOCAL_DMG="$(shasum -a 256 "production/VYRON-$VERSION-arm64.dmg" | awk '{print $1}')"
          LOCAL_UPDATER="$(shasum -a 256 production/VYRON.app.tar.gz | awk '{print $1}')"
          REMOTE_DMG="$(python3 -c 'import json;d=json.load(open("/tmp/release.json"));print(next(a["digest"] for a in d["assets"] if a["name"]=="VYRON-2.1.14-rc.2-arm64.dmg"))')"
          REMOTE_UPDATER="$(python3 -c 'import json;d=json.load(open("/tmp/release.json"));print(next(a["digest"] for a in d["assets"] if a["name"]=="VYRON.app.tar.gz"))')"
          test "$REMOTE_DMG" = "sha256:$LOCAL_DMG"
          test "$REMOTE_UPDATER" = "sha256:$LOCAL_UPDATER"
          FEED="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$STABLE_VERSION"
          echo "DMG_SHA256=$LOCAL_DMG"
          echo "UPDATER_SHA256=$LOCAL_UPDATER"
          echo 'RC_PRERELEASE=PUBLISHED'
          echo 'LATEST_JSON_VERSION=2.1.13'
          echo 'READY_FOR_PHYSICAL_TEST=YES'
          echo 'READY_FOR_STABLE_2.1.14=NO'

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-signing.p12" "$RUNNER_TEMP/vyron-signing.pem"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          fi
