name: VYRON 2.1.15 RC1 Add Channel and Statistics

on:
  push:
    branches:
      - release/vyron-2.1.15-rc1-add-channel-stats
    paths:
      - '.github/workflows/vyron-2115-rc1-add-channel-stats.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-2115-rc1-add-channel-stats
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.15-rc.1'
  TAG: v2.1.15-rc.1
  STABLE_VERSION: '2.1.14'
  SOURCE_STABLE: 75ad5aa2d8438f4d1cc90a95491597775ac80871
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  rc:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.15-rc1-add-channel-stats
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Source freeze and release safety
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$SOURCE_STABLE" HEAD
          test "$(git merge-base "$SOURCE_STABLE" HEAD)" = "$SOURCE_STABLE"

          python3 - <<'PY'
          import json,re,subprocess,os
          from pathlib import Path
          source=os.environ['SOURCE_STABLE']
          allowed={
            'package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock','src-tauri/tauri.conf.json',
            'src-tauri/src/youtube.rs','src-tauri/src/lib.rs','src-tauri/src/shorts_factory.rs',
            'src/api.ts','src/AccountsPage.tsx','src/YouTubeChannelBar.tsx','src/youtubeChannelStats.ts',
            'src/youtubeChannelStatsRuntime.ts','src/ChannelStatisticsScheduler.tsx','src/App.tsx','src/styles.css',
            'src/v2113ExistingChannelRebind.test.ts','src/v2114OauthOnboarding.test.ts','src/v2114ChannelStatistics.test.ts','src/youtubeChannelStats.test.ts','src/v2115AddChannelStats.test.ts',
            '.github/workflows/vyron-2115-rc1-add-channel-stats.yml',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only',f'{source}..HEAD'],text=True).splitlines()))
          extra=changed-allowed
          if extra: raise SystemExit('BLOCKER=UNAUTHORIZED_RC_DIFF:'+','.join(sorted(extra)))
          required={
            'src-tauri/src/youtube.rs','src-tauri/src/lib.rs','src/api.ts','src/AccountsPage.tsx',
            'src/YouTubeChannelBar.tsx','src/youtubeChannelStats.ts','src/youtubeChannelStatsRuntime.ts',
            'src/ChannelStatisticsScheduler.tsx','src/App.tsx','src/styles.css','src/v2115AddChannelStats.test.ts',
          }
          if not required <= changed: raise SystemExit('BLOCKER=FIX_DIFF_INCOMPLETE:'+','.join(sorted(required-changed)))

          pkg=json.load(open('package.json'));lock=json.load(open('package-lock.json'));conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=Path('src-tauri/Cargo.toml').read_text();clock=Path('src-tauri/Cargo.lock').read_text()
          v=os.environ['VERSION']
          assert pkg['version']==v
          assert lock['version']==v and lock['packages']['']['version']==v
          assert conf['version']==v
          assert conf['identifier']==os.environ['BUNDLE_ID']
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']==os.environ['EMBEDDED_UPDATER_KEY']
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.15-rc\.1"\s*$',cargo)
          assert re.search(r'\[\[package\]\]\nname = "channelflow"\nversion = "2\.1\.15-rc\.1"',clock)
          print('SOURCE_FREEZE=PASS')
          print('VERSION_CONTRACT=PASS')
          PY

          test -n "${VYRON_MACOS_SIGNING_P12_BASE64:-}"
          test -n "${VYRON_MACOS_SIGNING_P12_PASSWORD:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test "$VYRON_MACOS_SIGNING_IDENTITY" = 'VYRON Local Code Signing'

          STABLE_TARGET="$(gh release view v2.1.14 --repo "$REPO" --json targetCommitish --jq .targetCommitish)"
          test "$STABLE_TARGET" = "$SOURCE_STABLE"
          ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1
          ! gh release view v2.1.15 --repo "$REPO" >/dev/null 2>&1

          FEED="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$STABLE_VERSION"
          WIN="$(gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$WIN" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = '2.1.13'
          echo 'PRODUCTION_FEEDS_BASELINE=PASS'

      - name: Add Channel OAuth and statistics source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('src/AccountsPage.tsx').read_text()
          start=ui.index('async function askBrowser')
          end=ui.index('async function connect',start)
          add=ui[start:end]
          assert 'file.current?.click()' not in add
          assert 'setOauthSetupOpen(true)' in add
          assert 'youtubeOauthBrowsers' in add
          assert 'Google OAuth Client ещё не настроен' in ui
          assert 'Импортировать credentials.json</button>' in ui
          assert 'Этот YouTube-канал уже подключён' in ui

          y=Path('src-tauri/src/youtube.rs').read_text()
          assert 'prompt=select_account' in y
          assert 'access_type=offline' in y
          assert 'include_granted_scopes=true' in y
          assert y.count('wait_for_oauth_code(listener,expected_state)') >= 2
          assert 'OAUTH_CALLBACK_TIMEOUT' in y
          assert 'YOUTUBE_CHANNEL_ALREADY_CONNECTED' in y
          assert 'fn reconnect_refresh_token(' in y
          assert 'existing_refresh=security::canonical_get_secret_cached' in y
          assert 'pub async fn youtube_channel_statistics_batch' in y
          assert 'if ids.len()>=50' in y

          stats=Path('src/youtubeChannelStats.ts').read_text()
          assert 'CHANNEL_STATS_TTL_MS=10*60*1000' in stats
          scheduler=Path('src/ChannelStatisticsScheduler.tsx').read_text()
          assert 'setInterval(run,CHANNEL_STATS_TTL_MS)' in scheduler
          print('ADD_CHANNEL_FILE_PICKER_REGRESSION=PASS')
          print('GOOGLE_ACCOUNT_SELECTOR_SOURCE=PASS')
          print('CALLBACK_TIMEOUT_SOURCE=PASS')
          print('REFRESH_TOKEN_PRESERVATION_SOURCE=PASS')
          print('BATCH_STATISTICS_SOURCE=PASS')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted frontend tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run             src/v2115AddChannelStats.test.ts             src/v2114OauthOnboarding.test.ts             src/v2114ChannelStatistics.test.ts             src/youtubeChannelStats.test.ts             src/v2113ExistingChannelRebind.test.ts             src/v2112BrowserReconnectRecovery.test.ts             src/v2111ClientSecretContinuity.test.ts             src/v2110OauthContinuity.test.ts             src/v213KeychainRecovery.test.ts             src/keychainPassiveArchitecture.test.ts             src/updaterPolicy.test.ts             src/updaterRuntime.test.ts             src/updaterRemoteContract.test.ts
          echo 'TARGETED_FRONTEND=PASS'

      - name: Targeted Rust OAuth and statistics tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml v2114_oauth_onboarding_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2114_channel_statistics_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml auth_recovery_targeted_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml keychain_prompt_architecture_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v219_rc7_secitem_ui_skip_tests -- --nocapture
          echo 'TARGETED_RUST=PASS'

      - name: TypeScript build and full regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npx tsc --noEmit
          npm test
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --skip security::tests::keychain_roundtrip
          echo 'TYPESCRIPT=PASS'
          echo 'FRONTEND_REGRESSION=PASS'
          echo 'RUST_CHECK=PASS'
          echo 'RUST_REGRESSION=PASS'
          echo 'PRODUCTION_FRONTEND_BUILD=PASS'

      - name: Rust format audit
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Import persistent signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          CERT="$RUNNER_TEMP/vyron-signing.pem"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c "$VYRON_MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          test -s "$CERT"
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw
          def dec(x):
              try:return base64.b64decode(x,validate=True).decode()
              except:return None
          if raw.startswith('untrusted comment:'):
              out=base64.b64encode(raw.encode()).decode();box=raw
          else:
              one=dec(raw)
              if one and one.startswith('untrusted comment:'):
                  out=raw;box=one
              else:
                  box=dec(one) if one else None
                  assert box and box.startswith('untrusted comment:')
                  out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed ARM64 RC and updater
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

          mkdir -p production
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP";test -s "$DMG";test -s "$UPDATER";test -s "$SIG"

          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee production/codesign-details.txt
          codesign -d -r- "$APP" 2>&1 | tee production/designated-requirement.txt
          ! grep -F 'Signature=adhoc' production/codesign-details.txt

          rm -rf /tmp/vyron-stable-2114 && mkdir /tmp/vyron-stable-2114
          gh release download v2.1.14 --repo "$REPO" --dir /tmp/vyron-stable-2114 --pattern designated-requirement.txt
          cmp -s production/designated-requirement.txt /tmp/vyron-stable-2114/designated-requirement.txt

          hdiutil verify "$DMG"
          cp "$DMG" "production/VYRON-$VERSION-arm64.dmg"
          cp "$UPDATER" production/VYRON.app.tar.gz
          cp "$SIG" production/VYRON.app.tar.gz.sig
          shasum -a 256 "production/VYRON-$VERSION-arm64.dmg" | tee "production/VYRON-$VERSION-arm64.dmg.sha256"
          shasum -a 256 production/VYRON.app.tar.gz | tee production/VYRON.app.tar.gz.sha256
          echo 'ARM64_BUILD=PASS'
          echo 'CODESIGN=PASS'
          echo 'DMG_VERIFY=PASS'

      - name: Finder-like RC launch
        shell: bash
        run: |
          set -Eeuo pipefail
          M="$RUNNER_TEMP/vyron-2115-rc1-mount"
          rm -rf "$M";mkdir -p "$M"
          hdiutil attach "production/VYRON-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$M"
          trap 'hdiutil detach "$M" >/dev/null 2>&1 || true' EXIT
          A="$M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$A/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$A"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/"             "$A/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-2115-rc1-launch.log 2>&1 &
          P=$!
          sleep 8
          kill -0 "$P"
          kill "$P" || true
          wait "$P" || true
          hdiutil detach "$M";trap - EXIT
          echo 'APP_START=PASS'
          echo 'BLACK_SCREEN=NO'

      - name: Verify stable feeds unchanged before publish
        shell: bash
        run: |
          set -Eeuo pipefail
          FEED="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = '2.1.14'
          WIN="$(gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$WIN" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = '2.1.13'
          echo 'STABLE_FEEDS_UNCHANGED=PASS'

      - name: Publish RC prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 2.1.15-rc.1

          Physical-regression candidate for Add Channel OAuth and YouTube channel statistics.

          - + Add Channel never invokes the credentials.json file picker.
          - Missing GLOBAL OAuth readiness opens an explicit setup modal; Finder is only opened from the explicit Import credentials action.
          - Installed-browser selector and Google select_account/offline consent flow are preserved.
          - OAuth callback has a bounded five-minute listener timeout with state validation.
          - Reconnect preserves an existing canonical refresh token when Google omits a replacement.
          - Duplicate YouTube Channel IDs are blocked from creating/replacing a profile in the new-channel flow and are routed to explicit Reconnect.
          - GLOBAL OAuth readiness no longer becomes false solely because passive Keychain enumeration skipped a protected secret item.
          - Channel statistics refresh on a ten-minute stale-cache cadence, persist in AppState, and live-update the UI.
          - Up to 50 known Channel IDs are refreshed in one channels.list batch; fallback errors do not abort the remaining profiles.
          - Active-channel and account statistics are larger, show freshness/failure state, and support real manual refresh.
          - Production updater remains VYRON 2.1.14 until physical Google OAuth acceptance succeeds.

          Physical Google account selection, callback, real channel discovery, real statistics and restart persistence are NOT yet marked PASS.
          EOF

          gh release create "$TAG"             --repo "$REPO"             --target "$FINAL_HEAD"             --title 'VYRON 2.1.15 RC1 — Add Channel + Statistics'             --prerelease             --notes-file /tmp/release-notes.md             "production/VYRON-$VERSION-arm64.dmg"             "production/VYRON-$VERSION-arm64.dmg.sha256"             production/VYRON.app.tar.gz             production/VYRON.app.tar.gz.sha256             production/VYRON.app.tar.gz.sig             production/codesign-details.txt             production/designated-requirement.txt

      - name: Remote RC verification
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          gh api "repos/$REPO/releases/tags/$TAG" > /tmp/release.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/release.json'))
          assert d['tag_name']=='v2.1.15-rc.1'
          assert d['draft'] is False
          assert d['prerelease'] is True
          assert d['target_commitish']==os.popen('git rev-parse HEAD').read().strip()
          names={a['name'] for a in d['assets']}
          required={
            'VYRON-2.1.15-rc.1-arm64.dmg','VYRON-2.1.15-rc.1-arm64.dmg.sha256',
            'VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig',
            'codesign-details.txt','designated-requirement.txt',
          }
          assert required <= names
          for a in d['assets']:
              if a['name'] in required: assert a['size']>0
          print('REMOTE_RC_METADATA=PASS')
          PY

          LOCAL_DMG="$(shasum -a 256 production/VYRON-2.1.15-rc.1-arm64.dmg | awk '{print $1}')"
          LOCAL_UPDATER="$(shasum -a 256 production/VYRON.app.tar.gz | awk '{print $1}')"
          REMOTE_DMG="$(python3 -c 'import json;d=json.load(open("/tmp/release.json"));print(next(a["digest"] for a in d["assets"] if a["name"]=="VYRON-2.1.15-rc.1-arm64.dmg"))')"
          REMOTE_UPDATER="$(python3 -c 'import json;d=json.load(open("/tmp/release.json"));print(next(a["digest"] for a in d["assets"] if a["name"]=="VYRON.app.tar.gz"))')"
          test "$REMOTE_DMG" = "sha256:$LOCAL_DMG"
          test "$REMOTE_UPDATER" = "sha256:$LOCAL_UPDATER"

          FEED="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = '2.1.14'
          WIN="$(gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)"
          test "$(printf '%s' "$WIN" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = '2.1.13'

          echo "DMG_SHA256=$LOCAL_DMG"
          echo "UPDATER_SHA256=$LOCAL_UPDATER"
          echo 'RC_PRERELEASE=PUBLISHED'
          echo 'LATEST_JSON_VERSION=2.1.14'
          echo 'WINDOWS_DEDICATED_FEED=2.1.13'
          echo 'READY_FOR_PHYSICAL_TEST=YES'
          echo 'READY_FOR_STABLE_2.1.15=NO'
          echo 'PHYSICAL_ACCEPTANCE=NOT_COMPLETED'

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-signing.p12" "$RUNNER_TEMP/vyron-signing.pem"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          fi

# retry: align historical source-contract tests with explicit OAuth setup and duplicate protection

# retry: authorize only the two historical regression contract updates required by the new explicit flow

# retry: total-channel-views assertion aligned with visible UI label

# retry: TypeScript-safe statistics single-flight cleanup

# retry: serialize Rust tests that mutate process PATH; no production shorts behavior changed
