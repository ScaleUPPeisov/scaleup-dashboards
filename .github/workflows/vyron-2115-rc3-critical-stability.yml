name: VYRON 2.1.15 RC3 Critical Stabilization
# retry: RC3 API type contract corrected after TypeScript factual CI failure

on:
  push:
    branches:
      - release/vyron-2.1.15-rc3-critical-stability
    paths:
      - '.github/workflows/vyron-2115-rc3-critical-stability.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-2115-rc3-critical-stability
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.15-rc.3'
  TAG: v2.1.15-rc.3
  STABLE_VERSION: '2.1.14'
  SOURCE_STABLE: 75ad5aa2d8438f4d1cc90a95491597775ac80871
  SOURCE_RC1: 19403c0a69fb9f45a8a8e0efe5a5b8b38ca222fd
  SOURCE_RC2: c2d2aa26a6afd468772293fba5e61e775298cb1a
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  rc:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout RC3 branch
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.15-rc3-critical-stability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Source freeze and production safety
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse v2.1.15-rc.2)" = "$SOURCE_RC2"
          git merge-base --is-ancestor "$SOURCE_RC2" HEAD
          git merge-base --is-ancestor "$SOURCE_STABLE" HEAD

          python3 - <<'PY'
          import json,re,subprocess,os
          from pathlib import Path
          source=os.environ['SOURCE_RC2']
          allowed={
            'package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock','src-tauri/tauri.conf.json',
            'src-tauri/src/youtube.rs','src-tauri/src/lib.rs',
            'src/api.ts','src/types.ts','src/AccountsPage.tsx','src/App.tsx','src/PublisherOS.tsx',
            'src/storageLifecycle.ts','src/storageLifecycle.test.ts','src/uploadQueueRuntime.ts','src/UploadCenter.tsx',
            'src/UploadProcessingMonitor.tsx','src/errorHistory.ts','src/v2115Rc3CriticalStability.test.ts','src/v2115AddChannelStats.test.ts','src/v2114OauthOnboarding.test.ts',
            '.github/workflows/vyron-2115-rc3-critical-stability.yml',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only',f'{source}..HEAD'],text=True).splitlines()))
          extra=changed-allowed
          if extra: raise SystemExit('BLOCKER=UNAUTHORIZED_RC3_DIFF:'+','.join(sorted(extra)))
          required={
            'src-tauri/src/youtube.rs','src-tauri/src/lib.rs','src/api.ts','src/types.ts','src/AccountsPage.tsx',
            'src/uploadQueueRuntime.ts','src/UploadCenter.tsx','src/UploadProcessingMonitor.tsx','src/storageLifecycle.ts',
            'src/PublisherOS.tsx','src/v2115Rc3CriticalStability.test.ts'
          }
          if not required <= changed: raise SystemExit('BLOCKER=RC3_DIFF_INCOMPLETE:'+','.join(sorted(required-changed)))
          pkg=json.load(open('package.json'));lock=json.load(open('package-lock.json'));conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=Path('src-tauri/Cargo.toml').read_text();clock=Path('src-tauri/Cargo.lock').read_text();v=os.environ['VERSION']
          assert pkg['version']==v
          assert lock['version']==v and lock['packages']['']['version']==v
          assert conf['version']==v and conf['identifier']==os.environ['BUNDLE_ID']
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']==os.environ['EMBEDDED_UPDATER_KEY']
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.15-rc\.3"\s*$',cargo)
          assert re.search(r'\[\[package\]\]\nname = "channelflow"\nversion = "2\.1\.15-rc\.3"',clock)
          print('SOURCE_FREEZE=PASS')
          print('VERSION_CONTRACT=PASS')
          PY

          test -n "${VYRON_MACOS_SIGNING_P12_BASE64:-}"
          test -n "${VYRON_MACOS_SIGNING_P12_PASSWORD:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test "$VYRON_MACOS_SIGNING_IDENTITY" = 'VYRON Local Code Signing'
          test "$(gh release view v2.1.14 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_STABLE"
          test "$(gh release view v2.1.15-rc.2 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_RC2"
          ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1
          ! gh release view v2.1.15 --repo "$REPO" >/dev/null 2>&1

          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/mac-feed-before.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/windows-feed-before.json
          shasum -a 256 /tmp/mac-feed-before.json | awk '{print $1}' > /tmp/mac-feed-before.sha
          shasum -a 256 /tmp/windows-feed-before.json | awk '{print $1}' > /tmp/windows-feed-before.sha
          echo "MAC_FEED_BASELINE=$(python3 -c 'import json;print(json.load(open("/tmp/mac-feed-before.json"))["version"])')"
          echo "WINDOWS_FEED_BASELINE=$(python3 -c 'import json;print(json.load(open("/tmp/windows-feed-before.json"))["version"])')"
          echo 'PRODUCTION_FEEDS_SNAPSHOTTED=PASS'

      - name: RC3 critical stability source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          y=Path('src-tauri/src/youtube.rs').read_text()
          sec=Path('src-tauri/src/security.rs').read_text()
          accounts=Path('src/AccountsPage.tsx').read_text()
          queue=Path('src/uploadQueueRuntime.ts').read_text()
          cleanup=Path('src/storageLifecycle.ts').read_text()
          local_delete=Path('src-tauri/src/local_delete.rs').read_text().split('#[cfg(test)]',1)[0]
          assert 'google_config_operational_status_value' in y
          assert 'NEEDS_SECURE_STORAGE_REPAIR' in y
          assert 'rotated_google_client_secret_account' in y
          assert 'canonical_verify_secret(&new_account,&client_secret)' in y
          assert 'canonical_forget_cache(&old_account)' in y
          assert 'youtube_oauth_reconciliation_diagnostics' in y
          assert 'youtube_video_processing_status' in y
          assert 'processingDetails' in y
          assert 'inventory_completeness_value' in y and 'youtube_retry_existing_video_hydration' in y
          assert 'KEYCHAIN_ACCESS_DENIED_CACHED' in sec
          assert 'kSecUseAuthenticationUI' in sec and 'Skip' in sec
          assert 'p=await api.youtubeProfiles();setProfiles(p)' in accounts
          assert 'Google OAuth требует восстановления' in accounts
          assert 'UPLOAD_ALREADY_HAS_VIDEO_ID' in queue
          assert "processingState:'UPLOAD_ACCEPTED'" in queue
          assert "x.processingState==='READY'" in cleanup
          assert 'trash::delete' in local_delete
          assert 'fs::remove_file' not in local_delete
          print('RC3_SOURCE_CONTRACTS=PASS')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted frontend tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run \
            src/v2115Rc3CriticalStability.test.ts \
            src/storageLifecycle.test.ts \
            src/uploadTelemetry.test.ts \
            src/uploadQueue.test.ts \
            src/v2115ScheduleSyncHotfix.test.ts \
            src/youtubeInventoryRc4.test.ts \
            src/channelSchedule.test.ts \
            src/scheduleContinuation.test.ts \
            src/publisherSchedule.test.ts \
            src/schedulePhysicalRegression.test.ts \
            src/v2115AddChannelStats.test.ts \
            src/v2114OauthOnboarding.test.ts \
            src/v2114ChannelStatistics.test.ts
          echo 'TARGETED_FRONTEND=PASS'

      - name: Targeted Rust OAuth Keychain inventory tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc3_oauth_processing_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc2_schedule_sync_hotfix_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v219_rc4_inventory_and_acl_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml security::tests -- --skip security::tests::keychain_roundtrip --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests -- --nocapture
          echo 'TARGETED_RUST=PASS'

      - name: TypeScript build and full regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npx tsc --noEmit
          npm test
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --skip security::tests::keychain_roundtrip
          echo 'TYPESCRIPT=PASS'
          echo 'FRONTEND_REGRESSION=PASS'
          echo 'RUST_CHECK=PASS'
          echo 'RUST_REGRESSION=PASS'
          echo 'PRODUCTION_FRONTEND_BUILD=PASS'

      - name: Rust format audit
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Import persistent signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          CERT="$RUNNER_TEMP/vyron-signing.pem"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c "$VYRON_MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          test -s "$CERT"
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw
          def dec(x):
              try:return base64.b64decode(x,validate=True).decode()
              except:return None
          if raw.startswith('untrusted comment:'):
              out=base64.b64encode(raw.encode()).decode();box=raw
          else:
              one=dec(raw)
              if one and one.startswith('untrusted comment:'):
                  out=raw;box=one
              else:
                  box=dec(one) if one else None
                  assert box and box.startswith('untrusted comment:')
                  out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed ARM64 RC3 and updater
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

          mkdir -p production
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP";test -s "$DMG";test -s "$UPDATER";test -s "$SIG"

          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee production/codesign-details.txt
          codesign -d -r- "$APP" 2>&1 | tee production/designated-requirement.txt
          ! grep -F 'Signature=adhoc' production/codesign-details.txt

          rm -rf /tmp/vyron-stable-2114 && mkdir /tmp/vyron-stable-2114
          gh release download v2.1.14 --repo "$REPO" --dir /tmp/vyron-stable-2114 --pattern designated-requirement.txt
          cmp -s production/designated-requirement.txt /tmp/vyron-stable-2114/designated-requirement.txt

          hdiutil verify "$DMG"
          cp "$DMG" "production/VYRON-$VERSION-arm64.dmg"
          cp "$UPDATER" production/VYRON.app.tar.gz
          cp "$SIG" production/VYRON.app.tar.gz.sig
          shasum -a 256 "production/VYRON-$VERSION-arm64.dmg" | tee "production/VYRON-$VERSION-arm64.dmg.sha256"
          shasum -a 256 production/VYRON.app.tar.gz | tee production/VYRON.app.tar.gz.sha256
          echo 'ARM64_BUILD=PASS'
          echo 'CODESIGN=PASS'
          echo 'DMG_VERIFY=PASS'

      - name: Finder-like RC3 launch
        shell: bash
        run: |
          set -Eeuo pipefail
          M="$RUNNER_TEMP/vyron-2115-rc3-mount"
          rm -rf "$M";mkdir -p "$M"
          hdiutil attach "production/VYRON-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$M"
          trap 'hdiutil detach "$M" >/dev/null 2>&1 || true' EXIT
          A="$M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$A/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$A"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" \
            "$A/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-2115-rc3-launch.log 2>&1 &
          P=$!
          sleep 8
          kill -0 "$P"
          kill "$P" || true
          wait "$P" || true
          hdiutil detach "$M";trap - EXIT
          echo 'APP_START=PASS'
          echo 'BLACK_SCREEN=NO'

      - name: Verify updater feeds unchanged before publish
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/mac-feed-now.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/windows-feed-now.json
          test "$(shasum -a 256 /tmp/mac-feed-now.json | awk '{print $1}')" = "$(cat /tmp/mac-feed-before.sha)"
          test "$(shasum -a 256 /tmp/windows-feed-now.json | awk '{print $1}')" = "$(cat /tmp/windows-feed-before.sha)"
          echo 'UPDATER_FEEDS_UNCHANGED=PASS'

      - name: Publish RC3 prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 2.1.15-rc.3 — Critical Stabilization

          Built directly on immutable v2.1.15-rc.2.

          - OAuth Ready now requires an operational no-UI secure secret read; metadata presence alone is never READY.
          - Explicit credentials.json repair rotates GLOBAL client_secret to a fresh canonical secure account, verifies readback and clears stale denied cache without deleting old credentials.
          - OAuth profile metadata loads independently from global Keychain health; orphan mappings are diagnosed, not deleted.
          - Existing profile UUID / Channel ID mapping remains preserved; exact client-id matching remains enforced.
          - RC2 authoritative inventory, targeted retry, cache preservation and quota-ledger fixes remain intact.
          - Upload Center uses factual bytes/speed/elapsed/ETA and persists returned YouTube videoId immediately to prevent duplicate retry.
          - Upload accepted is separate from YouTube processing READY; background reconciliation survives app restart.
          - Local cleanup requires fresh YouTube READY identity + exact fingerprint and uses system Trash only.
          - Failed, pending and processing sources are retained.
          - Production updater feeds are intentionally NOT modified by this prerelease.

          Physical OAuth, restart x2, real inventory, upload and Trash acceptance remain REQUIRED before stable/promotion.
          EOF
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$FINAL_HEAD" \
            --title 'VYRON 2.1.15 RC3 — Critical Stabilization' \
            --prerelease \
            --notes-file /tmp/release-notes.md \
            "production/VYRON-$VERSION-arm64.dmg" \
            "production/VYRON-$VERSION-arm64.dmg.sha256" \
            production/VYRON.app.tar.gz \
            production/VYRON.app.tar.gz.sha256 \
            production/VYRON.app.tar.gz.sig \
            production/codesign-details.txt \
            production/designated-requirement.txt

      - name: Remote RC3 verification and production isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" > /tmp/release.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/release.json'))
          assert d['tag_name']=='v2.1.15-rc.3'
          assert d['draft'] is False and d['prerelease'] is True
          assert d['target_commitish']==os.popen('git rev-parse HEAD').read().strip()
          names={a['name'] for a in d['assets']}
          required={'VYRON-2.1.15-rc.3-arm64.dmg','VYRON-2.1.15-rc.3-arm64.dmg.sha256','VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig','codesign-details.txt','designated-requirement.txt'}
          assert required <= names
          for a in d['assets']:
              if a['name'] in required: assert a['size']>0
          print('REMOTE_RC3_METADATA=PASS')
          PY
          LOCAL_DMG="$(shasum -a 256 production/VYRON-2.1.15-rc.3-arm64.dmg | awk '{print $1}')"
          REMOTE_DMG="$(python3 -c 'import json;d=json.load(open("/tmp/release.json"));print(next(a["digest"] for a in d["assets"] if a["name"]=="VYRON-2.1.15-rc.3-arm64.dmg"))')"
          test "$REMOTE_DMG" = "sha256:$LOCAL_DMG"

          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/mac-feed-after.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/windows-feed-after.json
          test "$(shasum -a 256 /tmp/mac-feed-after.json | awk '{print $1}')" = "$(cat /tmp/mac-feed-before.sha)"
          test "$(shasum -a 256 /tmp/windows-feed-after.json | awk '{print $1}')" = "$(cat /tmp/windows-feed-before.sha)"
          echo "DMG_SHA256=$LOCAL_DMG"
          echo 'RC3_PRERELEASE=PUBLISHED'
          echo 'PRODUCTION_UPDATER_PROMOTED=NO'
          echo 'WINDOWS_CHANGED=NO'
          echo 'READY_FOR_PHYSICAL_ACCEPTANCE=YES'
          echo 'READY_FOR_STABLE_2.1.15=NO'

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-signing.p12" "$RUNNER_TEMP/vyron-signing.pem"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          fi
