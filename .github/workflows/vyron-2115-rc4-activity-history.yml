name: VYRON 2.1.15 RC4 Activity History
# RC4 extended: Activity History + strict multi-channel Statistics Center (regression contracts updated)

on:
  push:
    branches:
      - release/vyron-2.1.15-rc4-activity-history
    paths:
      - '.github/workflows/vyron-2115-rc4-activity-history.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-2115-rc4-activity-history
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.15-rc.4'
  TAG: v2.1.15-rc.4
  STABLE_VERSION: '2.1.14'
  SOURCE_STABLE: 75ad5aa2d8438f4d1cc90a95491597775ac80871
  SOURCE_RC3: 5dced86b78fdb84369868de75cf1ca89c1a3333b
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  rc:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout RC4 branch
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.15-rc4-activity-history
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Source freeze, version and updater isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse v2.1.15-rc.3)" = "$SOURCE_RC3"
          git merge-base --is-ancestor "$SOURCE_RC3" HEAD
          git merge-base --is-ancestor "$SOURCE_STABLE" HEAD
          python3 - <<'PY'
          import json,re,subprocess,os
          from pathlib import Path
          allowed={
            'package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock','src-tauri/tauri.conf.json',
            'src-tauri/src/lib.rs','src-tauri/src/local_delete.rs','src-tauri/src/storage.rs','src-tauri/src/youtube.rs',
            'src/AccountsPage.tsx','src/ActivityHistory.tsx','src/App.tsx','src/ExistingVideos.tsx','src/MetadataPage.tsx',
            'src/PublisherOS.tsx','src/UploadCenter.tsx','src/UploadProcessingMonitor.tsx','src/YouTubeCenter.tsx','src/StatisticsCenter.tsx',
            'src/ChannelRunway.tsx','src/ChannelStatisticsScheduler.tsx','src/YouTubeChannelBar.tsx','src/youtubeChannelStatsRuntime.ts','src/youtubeStatisticsCenter.ts',
            'src/activityJournalCore.ts','src/activityJournalRuntime.ts','src/api.ts','src/storageLifecycle.ts','src/store.ts',
            'src/types.ts','src/uploadQueue.ts','src/uploadQueueRuntime.ts','src/storageLifecycle.test.ts','src/v2115Rc3CriticalStability.test.ts',
            'src/v2115Rc4ActivityJournal.test.ts','src/v2115Rc4ActivityWiring.test.ts','src/v2115Rc4StatisticsCenter.test.ts','src/v2115Rc4StatisticsOauthContinuity.test.ts','src/v2114ChannelStatistics.test.ts','src/v2115AddChannelStats.test.ts','tests/stateMigration_v095.test.ts',
            '.github/workflows/vyron-2115-rc4-activity-history.yml',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only',f"{os.environ['SOURCE_RC3']}..HEAD"],text=True).splitlines()))
          extra=changed-allowed
          if extra: raise SystemExit('BLOCKER=UNAUTHORIZED_RC4_DIFF:'+','.join(sorted(extra)))
          required={'src/ActivityHistory.tsx','src/activityJournalCore.ts','src/activityJournalRuntime.ts','src/store.ts','src/types.ts','src/UploadCenter.tsx','src/uploadQueueRuntime.ts','src/MetadataPage.tsx','src/ExistingVideos.tsx','src-tauri/src/storage.rs','src-tauri/src/youtube.rs','src-tauri/src/local_delete.rs','src/StatisticsCenter.tsx','src/youtubeStatisticsCenter.ts','src/youtubeChannelStatsRuntime.ts','src/ChannelRunway.tsx'}
          if not required <= changed: raise SystemExit('BLOCKER=RC4_DIFF_INCOMPLETE:'+','.join(sorted(required-changed)))
          pkg=json.load(open('package.json'));lock=json.load(open('package-lock.json'));conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=Path('src-tauri/Cargo.toml').read_text();clock=Path('src-tauri/Cargo.lock').read_text();v=os.environ['VERSION']
          assert pkg['version']==v
          assert lock['version']==v and lock['packages']['']['version']==v
          assert conf['version']==v and conf['identifier']==os.environ['BUNDLE_ID']
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']==os.environ['EMBEDDED_UPDATER_KEY']
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.15-rc\.4"\s*$',cargo)
          assert re.search(r'\[\[package\]\]\nname = "channelflow"\nversion = "2\.1\.15-rc\.4"',clock)
          print('SOURCE_FREEZE=PASS')
          print('VERSION_CONTRACT=PASS')
          PY
          test -n "${VYRON_MACOS_SIGNING_P12_BASE64:-}"
          test -n "${VYRON_MACOS_SIGNING_P12_PASSWORD:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test "$VYRON_MACOS_SIGNING_IDENTITY" = 'VYRON Local Code Signing'
          test "$(gh release view v2.1.14 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_STABLE"
          test "$(gh release view v2.1.15-rc.3 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_RC3"
          ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1
          ! gh release view v2.1.15 --repo "$REPO" >/dev/null 2>&1
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/mac-feed-before.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/windows-feed-before.json
          shasum -a 256 /tmp/mac-feed-before.json | awk '{print $1}' >/tmp/mac-feed-before.sha
          shasum -a 256 /tmp/windows-feed-before.json | awk '{print $1}' >/tmp/windows-feed-before.sha
          test "$(python3 -c 'import json;print(json.load(open("/tmp/mac-feed-before.json"))["version"])')" = '2.1.15-rc.3'
          test "$(python3 -c 'import json;print(json.load(open("/tmp/windows-feed-before.json"))["version"])')" = '2.1.13'
          echo 'UPDATER_FEEDS_SNAPSHOTTED=PASS'

      - name: RC4 activity/history source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          types=Path('src/types.ts').read_text()
          store=Path('src/store.ts').read_text()
          journal=Path('src/activityJournalCore.ts').read_text()
          history=Path('src/ActivityHistory.tsx').read_text()
          center=Path('src/UploadCenter.tsx').read_text()
          queue=Path('src/uploadQueueRuntime.ts').read_text()
          metadata=Path('src/MetadataPage.tsx').read_text()
          existing=Path('src/ExistingVideos.tsx').read_text()
          rust=Path('src-tauri/src/youtube.rs').read_text()
          trash=Path('src-tauri/src/local_delete.rs').read_text().split('#[cfg(test)]',1)[0]
          assert 'activityJournal:ActivityEvent[]' in types
          assert "SourceLifecycleState='PRESENT'" in types
          assert 'activityJournal:[]' in store and 'appendActivity' in store
          assert 'statisticsHistory:{}' in store and 'recordStatisticsSnapshot' in store
          assert 'RECONSTRUCTED' in journal and 'LEGACY_IMPORT' in journal
          assert 'refresh_token' not in ''.join([x for x in []])
          assert 'История действий' in history and 'Historical' not in history
          assert 'cleanupPreclassification' in center
          assert "eventType:'UPLOAD_ACCEPTED'" in queue
          assert "eventType:'METADATA_UPDATE_STARTED'" in metadata
          assert "eventType:'INVENTORY_SYNC_STARTED'" in existing
          assert 'youtube_video_processing_status_batch' in rust and 'ids.chunks(50)' in rust
          stats=Path('src/youtubeChannelStatsRuntime.ts').read_text();stats_ui=Path('src/StatisticsCenter.tsx').read_text();stats_core=Path('src/youtubeStatisticsCenter.ts').read_text()
          assert 'classification.eligible.filter' in stats
          assert 'requestBatchWithDriverRotation' in stats
          assert "STATS_REFRESH_BATCH" in journal
          assert 'classifyYoutubeChannels' in stats_core
          assert 'Статистика каналов' in stats_ui
          assert 'youtube_channel_statistics_batch' in rust and 'operation_id.as_deref()' in rust
          assert 'pub fn local_source_status' in trash
          assert 'trash::delete' in trash and 'fs::remove_file' not in trash
          print('RC4_SOURCE_CONTRACTS=PASS')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted frontend history + regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run \
            src/v2115Rc4ActivityJournal.test.ts \
            src/v2115Rc4ActivityWiring.test.ts \
            src/v2115Rc4StatisticsCenter.test.ts \
            src/v2115Rc4StatisticsOauthContinuity.test.ts \
            tests/stateMigration_v095.test.ts \
            src/v2115Rc3CriticalStability.test.ts \
            src/storageLifecycle.test.ts \
            src/uploadTelemetry.test.ts \
            src/uploadQueue.test.ts \
            src/v2115ScheduleSyncHotfix.test.ts \
            src/youtubeInventoryRc4.test.ts \
            src/channelSchedule.test.ts \
            src/scheduleContinuation.test.ts \
            src/publisherSchedule.test.ts \
            src/schedulePhysicalRegression.test.ts \
            src/v2115AddChannelStats.test.ts \
            src/v2114OauthOnboarding.test.ts \
            src/v2114ChannelStatistics.test.ts
          echo 'TARGETED_FRONTEND=PASS'

      - name: Targeted Rust persistence OAuth schedule cleanup tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml storage::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc3_oauth_processing_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2114_channel_statistics_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml keychain_prompt_architecture_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc2_schedule_sync_hotfix_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v219_rc4_inventory_and_acl_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml security::tests -- --skip security::tests::keychain_roundtrip --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests -- --nocapture
          echo 'TARGETED_RUST=PASS'

      - name: TypeScript, full regression and production frontend build
        shell: bash
        run: |
          set -Eeuo pipefail
          npx tsc --noEmit
          npm test
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --skip security::tests::keychain_roundtrip
          echo 'TYPESCRIPT=PASS'
          echo 'FRONTEND_REGRESSION=PASS'
          echo 'RUST_CHECK=PASS'
          echo 'RUST_REGRESSION=PASS'
          echo 'PRODUCTION_FRONTEND_BUILD=PASS'

      - name: Rust format audit
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Import persistent signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          CERT="$RUNNER_TEMP/vyron-signing.pem"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c "$VYRON_MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          test -s "$CERT"
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw
          def dec(x):
              try:return base64.b64decode(x,validate=True).decode()
              except:return None
          if raw.startswith('untrusted comment:'):
              out=base64.b64encode(raw.encode()).decode();box=raw
          else:
              one=dec(raw)
              if one and one.startswith('untrusted comment:'): out=raw;box=one
              else:
                  box=dec(one) if one else None
                  assert box and box.startswith('untrusted comment:')
                  out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed ARM64 RC4 and updater artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p production
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP";test -s "$DMG";test -s "$UPDATER";test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee production/codesign-details.txt
          codesign -d -r- "$APP" 2>&1 | tee production/designated-requirement.txt
          ! grep -F 'Signature=adhoc' production/codesign-details.txt
          rm -rf /tmp/vyron-stable && mkdir /tmp/vyron-stable
          gh release download v2.1.14 --repo "$REPO" --dir /tmp/vyron-stable --pattern designated-requirement.txt
          cmp -s production/designated-requirement.txt /tmp/vyron-stable/designated-requirement.txt
          hdiutil verify "$DMG"
          cp "$DMG" "production/VYRON-$VERSION-arm64.dmg"
          cp "$UPDATER" production/VYRON.app.tar.gz
          cp "$SIG" production/VYRON.app.tar.gz.sig
          shasum -a 256 "production/VYRON-$VERSION-arm64.dmg" | tee "production/VYRON-$VERSION-arm64.dmg.sha256"
          shasum -a 256 production/VYRON.app.tar.gz | tee production/VYRON.app.tar.gz.sha256
          echo 'ARM64_BUILD=PASS'
          echo 'CODESIGN=PASS'
          echo 'DMG_VERIFY=PASS'

      - name: Finder-like RC4 launch
        shell: bash
        run: |
          set -Eeuo pipefail
          M="$RUNNER_TEMP/vyron-2115-rc4-mount"
          rm -rf "$M";mkdir -p "$M"
          hdiutil attach "production/VYRON-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$M"
          trap 'hdiutil detach "$M" >/dev/null 2>&1 || true' EXIT
          A="$M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$A/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$A"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$A/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-2115-rc4-launch.log 2>&1 &
          P=$!;sleep 8;kill -0 "$P";kill "$P" || true;wait "$P" || true
          hdiutil detach "$M";trap - EXIT
          echo 'APP_START=PASS'
          echo 'BLACK_SCREEN=NO'

      - name: Verify updater feeds unchanged before publish
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/mac-feed-now.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-now.json
          test "$(shasum -a 256 /tmp/mac-feed-now.json | awk '{print $1}')" = "$(cat /tmp/mac-feed-before.sha)"
          test "$(shasum -a 256 /tmp/windows-feed-now.json | awk '{print $1}')" = "$(cat /tmp/windows-feed-before.sha)"
          echo 'UPDATER_FEEDS_UNCHANGED=PASS'

      - name: Publish RC4 prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 2.1.15-rc.4 — Activity History + Multi-Channel Statistics

          Built directly on immutable v2.1.15-rc.3.

          - Adds a durable append-oriented YouTube Activity Journal.
          - Separates remote YouTube state, VYRON operation history and local source-file lifecycle.
          - Preserves upload history when original MP4 files are missing or later moved to Trash.
          - Reconstructs only provable legacy facts and labels them RECONSTRUCTED / LEGACY_IMPORT.
          - Adds channel/date/type/status/search filters and per-channel daily summaries.
          - Journals future uploads, processing transitions, metadata field counts, schedule/inventory operations and explicit OAuth reconnects.
          - Adds batched videos.list reconciliation and controlled local-source checks.
          - Cleanup candidates are preclassified; already-missing/processing/changed files are excluded before Trash.
          - Repeated CLEANUP_NOT_READY noise is aggregated into one batch result.
          - System Trash remains the only destructive cleanup path; no permanent delete.
          - RC3 OAuth/Keychain/profile protections and RC2 schedule truth remain intact.
          - Adds a separate Multi-Channel Statistics Center with exact linked-channel classification.
          - Refresh All excludes local-only/future/orphan mappings and deduplicates duplicate YouTube Channel IDs.
          - Basic channel statistics are fetched in batches up to 50 IDs with factual method-ledger quota accounting.
          - Adds persistent raw-number statistics snapshots, baseline migration, 24h/7d/30d/monthly history and explicit insufficient-history states.
          - Existing YouTube Analytics scopes expose period views/watch time/duration/subscriber/engagement metrics without forced reconnect.
          - Plan Channels now separates local projects from linked YouTube channels and gates YouTube actions on exact mappings.
          - credentials.json remains explicit import/repair only; Statistics paths never open Finder or trigger OAuth reconnect.
          - macOS and Windows updater feeds are NOT modified by this prerelease.

          Physical reconciliation of existing operator data is required before any stable release or updater promotion.
          EOF
          gh release create "$TAG" --repo "$REPO" --target "$FINAL_HEAD" --title 'VYRON 2.1.15 RC4 — Activity History + Statistics' --prerelease --notes-file /tmp/release-notes.md \
            "production/VYRON-$VERSION-arm64.dmg" "production/VYRON-$VERSION-arm64.dmg.sha256" \
            production/VYRON.app.tar.gz production/VYRON.app.tar.gz.sha256 production/VYRON.app.tar.gz.sig \
            production/codesign-details.txt production/designated-requirement.txt

      - name: Verify RC4 release and production isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" >/tmp/release.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/release.json'))
          assert d['tag_name']=='v2.1.15-rc.4'
          assert d['draft'] is False and d['prerelease'] is True
          assert d['target_commitish']==os.popen('git rev-parse HEAD').read().strip()
          names={a['name'] for a in d['assets']}
          req={'VYRON-2.1.15-rc.4-arm64.dmg','VYRON-2.1.15-rc.4-arm64.dmg.sha256','VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig','codesign-details.txt','designated-requirement.txt'}
          assert req <= names
          for a in d['assets']:
              if a['name'] in req: assert a['size']>0
          print('REMOTE_RC4_METADATA=PASS')
          PY
          LOCAL_DMG="$(shasum -a 256 production/VYRON-2.1.15-rc.4-arm64.dmg | awk '{print $1}')"
          REMOTE_DMG="$(python3 -c 'import json;d=json.load(open("/tmp/release.json"));print(next(a["digest"] for a in d["assets"] if a["name"]=="VYRON-2.1.15-rc.4-arm64.dmg"))')"
          test "$REMOTE_DMG" = "sha256:$LOCAL_DMG"
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/mac-feed-after.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-after.json
          test "$(shasum -a 256 /tmp/mac-feed-after.json | awk '{print $1}')" = "$(cat /tmp/mac-feed-before.sha)"
          test "$(shasum -a 256 /tmp/windows-feed-after.json | awk '{print $1}')" = "$(cat /tmp/windows-feed-before.sha)"
          echo "DMG_SHA256=$LOCAL_DMG"
          echo 'RC4_PRERELEASE=PUBLISHED'
          echo 'MAC_UPDATER_CHANGED=NO'
          echo 'WINDOWS_CHANGED=NO'
          echo 'READY_FOR_PHYSICAL_HISTORY_ACCEPTANCE=YES'
          echo 'READY_FOR_STABLE_2.1.15=NO'

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-signing.p12" "$RUNNER_TEMP/vyron-signing.pem"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; fi
