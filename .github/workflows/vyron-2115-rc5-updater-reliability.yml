name: VYRON 2.1.15 RC5 Updater Reliability
# RC5: rapid updater + full RC1-RC4 reliability preservation; Windows compile rerun after target-gating Apple-only Keychain crates

on:
  push:
    branches:
      - release/vyron-2.1.15-rc5-updater-reliability
    paths:
      - '.github/workflows/vyron-2115-rc5-updater-reliability.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-2115-rc5-updater-reliability
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.15-rc.5'
  TAG: v2.1.15-rc.5
  STABLE_VERSION: '2.1.14'
  SOURCE_STABLE: 75ad5aa2d8438f4d1cc90a95491597775ac80871
  SOURCE_RC4: 8d91324d14dfefdc0760ee14a84a948fae619c36
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  windows_compile:
    name: Windows compile safety
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout RC5 branch
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.15-rc5-updater-reliability
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and portable updater regression on Windows
        shell: pwsh
        run: |
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run src/updaterSchedule.test.ts src/updaterRuntimeRc5.test.ts src/updaterRuntime.test.ts src/updaterPolicy.test.ts src/updaterGuard.test.ts src/updaterHotfix.test.ts src/v2115Rc5KeychainContinuity.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'WINDOWS_TYPESCRIPT=PASS'
          Write-Output 'WINDOWS_UPDATER_TESTS=PASS'
      - name: Rust compile safety on Windows
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'WINDOWS_RUST_CHECK=PASS'

  rc:
    needs: windows_compile
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout RC5 branch
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.15-rc5-updater-reliability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Source freeze, version and feed baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse v2.1.15-rc.4)" = "$SOURCE_RC4"
          git merge-base --is-ancestor "$SOURCE_RC4" HEAD
          git merge-base --is-ancestor "$SOURCE_STABLE" HEAD
          python3 - <<'PY'
          import json,re,subprocess,os
          from pathlib import Path
          allowed={
            '.github/workflows/vyron-2115-rc5-updater-reliability.yml',
            'package-lock.json',
            'package.json',
            'src-tauri/Cargo.lock',
            'src-tauri/Cargo.toml',
            'src-tauri/src/lib.rs',
            'src-tauri/src/security.rs',
            'src-tauri/src/youtube.rs',
            'src-tauri/tauri.conf.json',
            'src/AccountsPage.tsx',
            'src/App.tsx',
            'src/SettingsOS.tsx',
            'src/activityJournalCore.ts',
            'src/api.ts',
            'src/errorCenter.ts',
            'src/errorHistory.ts',
            'src/types.ts',
            'src/updaterPolicy.test.ts',
            'src/updaterPolicy.ts',
            'src/updaterRemoteContract.test.ts',
            'src/updaterRuntime.ts',
            'src/updaterRuntimeRc5.test.ts',
            'src/updaterSchedule.test.ts',
            'src/updaterSchedule.ts',
            'src/v2115Rc5KeychainContinuity.test.ts',
            'src/v2115Rc5UpdaterReliability.test.ts',
            'src/youtubeChannelStatsRuntime.ts',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only',f"{os.environ['SOURCE_RC4']}..HEAD"],text=True).splitlines()))
          extra=changed-allowed
          if extra: raise SystemExit('BLOCKER=UNAUTHORIZED_RC5_DIFF:'+','.join(sorted(extra)))
          required={'package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock','src-tauri/tauri.conf.json','src/App.tsx','src/SettingsOS.tsx','src/updaterRuntime.ts','src/updaterSchedule.ts','src/updaterPolicy.ts','src-tauri/src/security.rs','src-tauri/src/youtube.rs','src-tauri/src/lib.rs','src/api.ts','src/errorCenter.ts','src/errorHistory.ts','src/types.ts','src/activityJournalCore.ts','src/AccountsPage.tsx','src/youtubeChannelStatsRuntime.ts','src/v2115Rc5KeychainContinuity.test.ts'}
          if not required <= changed: raise SystemExit('BLOCKER=RC5_DIFF_INCOMPLETE:'+','.join(sorted(required-changed)))
          pkg=json.load(open('package.json'));lock=json.load(open('package-lock.json'));conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=Path('src-tauri/Cargo.toml').read_text();clock=Path('src-tauri/Cargo.lock').read_text();v=os.environ['VERSION']
          assert pkg['version']==v
          assert lock['version']==v and lock['packages']['']['version']==v
          assert conf['version']==v and conf['identifier']==os.environ['BUNDLE_ID']
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']==os.environ['EMBEDDED_UPDATER_KEY']
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.15-rc\.5"\s*$',cargo)
          assert "[target.'cfg(target_os = \"macos\")'.dependencies]" in cargo
          assert re.search(r'\[\[package\]\]\nname = "channelflow"\nversion = "2\.1\.15-rc\.5"',clock)
          print('SOURCE_FREEZE=PASS')
          print('VERSION_CONTRACT=PASS')
          PY
          test -n "${VYRON_MACOS_SIGNING_P12_BASE64:-}"
          test -n "${VYRON_MACOS_SIGNING_P12_PASSWORD:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test "$VYRON_MACOS_SIGNING_IDENTITY" = 'VYRON Local Code Signing'
          test "$(gh release view v2.1.15-rc.4 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_RC4"
          ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1
          ! gh release view v2.1.15 --repo "$REPO" >/dev/null 2>&1
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/mac-feed-before.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/windows-feed-before.json
          shasum -a 256 /tmp/windows-feed-before.json | awk '{print $1}' >/tmp/windows-feed-before.sha
          test "$(python3 -c 'import json;print(json.load(open("/tmp/mac-feed-before.json"))["version"])')" = '2.1.15-rc.4'
          test "$(python3 -c 'import json;print(json.load(open("/tmp/windows-feed-before.json"))["version"])')" = '2.1.13'
          echo 'FEED_BASELINE=PASS'
      - name: RC5 updater and RC4 preservation source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text();settings=Path('src/SettingsOS.tsx').read_text();runtime=Path('src/updaterRuntime.ts').read_text();schedule=Path('src/updaterSchedule.ts').read_text();api=Path('src/api.ts').read_text();policy=Path('src/updaterPolicy.ts').read_text()
          publisher=Path('src/PublisherOS.tsx').read_text();queue=Path('src/uploadQueueRuntime.ts').read_text();bridge=Path('src/ProductionStatusBridge.tsx').read_text();errors=Path('src/errorCenter.ts').read_text();store=Path('src/store.ts').read_text();types=Path('src/types.ts').read_text();stats=Path('src/youtubeChannelStatsRuntime.ts').read_text();journal=Path('src/activityJournalCore.ts').read_text();local_delete=Path('src-tauri/src/local_delete.rs').read_text()
          assert 'UPDATER_AUTO_INTERVAL_MS=15*60*1000' in schedule
          assert 'UPDATER_FOREGROUND_MIN_AGE_MS=5*60*1000' in schedule
          assert "document.addEventListener('visibilitychange'" in app and "window.addEventListener('online'" in app
          assert 'if(checkPromise)return checkPromise' in runtime
          assert 'nextAutomaticCheckAt' in runtime and 'consecutiveCheckFailures' in runtime
          assert "'Cache-Control':'no-cache, no-store, max-age=0'" in policy and "'Pragma':'no-cache'" in policy
          assert 'check(UPDATER_CHECK_OPTIONS)' in api
          assert '🔔 Доступно обновление' in app and 'Следующая автоматическая проверка' in settings
          assert 'youtube' not in runtime.lower() and 'videos.insert' not in runtime
          assert 'classifyUploadState' in publisher and 'youtubeVideoProcessingStatusBatch' in publisher
          assert "eventType:'UPLOAD_BLOCKED_DUPLICATE_GUARD'" in queue and "code:'LOCAL_DUPLICATE_GUARD'" in errors
          assert "eventType:genuinelyNew?'RENDER_COMPLETED':'RENDER_DISCOVERED_LEGACY'" in bridge and 'if(genuinelyNew)notifySuccess' in bridge
          assert 'pub fn scan_render_folder' in local_delete
          assert 'activityJournal:[]' in store and 'statisticsHistory:{}' in store and 'activityJournal:ActivityEvent[]' in types
          assert 'classification.eligible.filter' in stats and 'requestBatchWithDriverRotation' in stats
          assert 'RECONSTRUCTED' in journal and 'LEGACY_IMPORT' in journal
          security=Path('src-tauri/src/security.rs').read_text();accounts=Path('src/AccountsPage.tsx').read_text();keytest=Path('src/v2115Rc5KeychainContinuity.test.ts').read_text()
          assert 'CanonicalDenialState' in security and 'canonical_retry_secret_access_value' in security
          assert 'original_osstatus' in security and 'CANONICAL_DENIAL_RETRY_COOLDOWN_SECS' in security
          assert 'kSecAttrAccessibleWhenUnlocked' in security and 'kSecUseAuthenticationUISkip' in security
          assert 'KEYCHAIN_BLOCKED' in accounts and 'Повторить безопасную проверку' in accounts
          assert 'youtubeOauthSafeCheckAllProfiles' in accounts and 'youtubeImportGoogleConfig' not in accounts.split('async function checkAll',1)[1].split('const oauthReady',1)[0]
          assert '13 profiles' in keytest and 'not.toHaveBeenCalled()' in keytest
          print('RC5_UPDATER_CONTRACTS=PASS')
          print('RC4_PRESERVATION_CONTRACTS=PASS')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted updater + full critical frontend regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run \
            src/updaterSchedule.test.ts \
            src/updaterRuntimeRc5.test.ts \
            src/updaterRuntime.test.ts \
            src/updaterPolicy.test.ts \
            src/updaterRemoteContract.test.ts \
            src/updaterGuard.test.ts \
            src/updaterHotfix.test.ts \
            src/v2115Rc5UpdaterReliability.test.ts \
            src/v2115Rc5KeychainContinuity.test.ts \
            src/v2115Rc4ActivityJournal.test.ts \
            src/v2115Rc4ActivityWiring.test.ts \
            src/v2115Rc4StatisticsCenter.test.ts \
            src/v2115Rc4StatisticsOauthContinuity.test.ts \
            tests/stateMigration_v095.test.ts \
            src/v2115Rc3CriticalStability.test.ts \
            src/storageLifecycle.test.ts \
            src/uploadTelemetry.test.ts \
            src/uploadQueue.test.ts \
            src/v2115ScheduleSyncHotfix.test.ts \
            src/youtubeInventoryRc4.test.ts \
            src/channelSchedule.test.ts \
            src/scheduleContinuation.test.ts \
            src/publisherSchedule.test.ts \
            src/schedulePhysicalRegression.test.ts \
            src/v2115AddChannelStats.test.ts \
            src/v2114OauthOnboarding.test.ts \
            src/v2114ChannelStatistics.test.ts
          echo 'TARGETED_FRONTEND=PASS'

      - name: Targeted Rust OAuth schedule inventory cleanup regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml storage::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc3_oauth_processing_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2114_channel_statistics_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml keychain_prompt_architecture_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc2_schedule_sync_hotfix_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v219_rc4_inventory_and_acl_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml security::tests -- --skip security::tests::keychain_roundtrip --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests -- --nocapture
          echo 'TARGETED_RUST=PASS'

      - name: TypeScript full regression and production frontend build
        shell: bash
        run: |
          set -Eeuo pipefail
          npx tsc --noEmit
          npm test
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --skip security::tests::keychain_roundtrip
          echo 'TYPESCRIPT=PASS'
          echo 'FRONTEND_REGRESSION=PASS'
          echo 'RUST_CHECK=PASS'
          echo 'RUST_REGRESSION=PASS'
          echo 'PRODUCTION_FRONTEND_BUILD=PASS'

      - name: Rust format audit
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Import persistent signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          CERT="$RUNNER_TEMP/vyron-signing.pem"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c "$VYRON_MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          test -s "$CERT"
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw
          def dec(x):
              try:return base64.b64decode(x,validate=True).decode()
              except:return None
          if raw.startswith('untrusted comment:'):
              out=base64.b64encode(raw.encode()).decode();box=raw
          else:
              one=dec(raw)
              if one and one.startswith('untrusted comment:'): out=raw;box=one
              else:
                  box=dec(one) if one else None
                  assert box and box.startswith('untrusted comment:')
                  out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed ARM64 RC5 and updater artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p production
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP";test -s "$DMG";test -s "$UPDATER";test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee production/codesign-details.txt
          codesign -d -r- "$APP" 2>&1 | tee production/designated-requirement.txt
          ! grep -F 'Signature=adhoc' production/codesign-details.txt
          rm -rf /tmp/vyron-stable && mkdir /tmp/vyron-stable
          gh release download v2.1.14 --repo "$REPO" --dir /tmp/vyron-stable --pattern designated-requirement.txt
          cmp -s production/designated-requirement.txt /tmp/vyron-stable/designated-requirement.txt
          hdiutil verify "$DMG"
          cp "$DMG" "production/VYRON-$VERSION-arm64.dmg"
          cp "$UPDATER" production/VYRON.app.tar.gz
          cp "$SIG" production/VYRON.app.tar.gz.sig
          shasum -a 256 "production/VYRON-$VERSION-arm64.dmg" | tee "production/VYRON-$VERSION-arm64.dmg.sha256"
          shasum -a 256 production/VYRON.app.tar.gz | tee production/VYRON.app.tar.gz.sha256
          echo 'ARM64_BUILD=PASS'
          echo 'CODESIGN=PASS'
          echo 'DMG_VERIFY=PASS'

      - name: Finder-like RC5 launch
        shell: bash
        run: |
          set -Eeuo pipefail
          M="$RUNNER_TEMP/vyron-2115-rc5-mount"
          rm -rf "$M";mkdir -p "$M"
          hdiutil attach "production/VYRON-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$M"
          trap 'hdiutil detach "$M" >/dev/null 2>&1 || true' EXIT
          A="$M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$A/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$A"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$A/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-2115-rc5-launch.log 2>&1 &
          P=$!;sleep 8;kill -0 "$P";kill "$P" || true;wait "$P" || true
          hdiutil detach "$M";trap - EXIT
          echo 'APP_START=PASS'
          echo 'BLACK_SCREEN=NO'

      - name: Verify RC4 feed baseline and Windows isolation before publish
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/mac-feed-now.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-now.json
          test "$(python3 -c 'import json;print(json.load(open("/tmp/mac-feed-now.json"))["version"])')" = '2.1.15-rc.4'
          test "$(shasum -a 256 /tmp/windows-feed-now.json | awk '{print $1}')" = "$(cat /tmp/windows-feed-before.sha)"
          echo 'PRE_PUBLISH_FEED_ISOLATION=PASS'
      - name: Publish immutable RC5 prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 2.1.15-rc.5 — Rapid Updater Reliability

          Built directly on immutable v2.1.15-rc.4.

          - Startup update discovery plus 15-minute automatic checks.
          - Foreground/network checks after a 5-minute age gate.
          - Strict single-flight checks, bounded 15/30/60 minute failure backoff, and updater-error deduplication.
          - Update Center last/next check visibility and immediate Sidebar availability notice.
          - Explicit signed install/restart remains blocked during Upload / ENDLUME / Shorts / Schedule work.
          - Update checks use no-cache headers and consume zero YouTube API quota.
          - Canonical per-profile refresh-token denials retain the original Keychain OSStatus and allow bounded no-UI recovery instead of permanent process-lifetime blocking.
          - GLOBAL OAuth readiness is separated from per-profile refresh-token readiness; Keychain failures before OAuth never become false YouTube rejection errors or quota debit.
          - Basic channel statistics can use one operational OAuth driver for the linked-channel batch while blocked private profiles remain isolated and cached statistics remain visible.
          - Explicit profile reconnect preserves Profile UUID / expected Channel ID and performs canonical Keychain write + no-UI readback.
          - RC1/RC2/RC3/RC4 OAuth, schedule, upload reconciliation, ENDLUME, render recovery, Activity Journal and Statistics protections are preserved.
          EOF
          gh release create "$TAG" --repo "$REPO" --target "$FINAL_HEAD" --title 'VYRON 2.1.15 RC5 — Rapid Updater Reliability' --prerelease --notes-file /tmp/release-notes.md \
            "production/VYRON-$VERSION-arm64.dmg" "production/VYRON-$VERSION-arm64.dmg.sha256" \
            production/VYRON.app.tar.gz production/VYRON.app.tar.gz.sha256 production/VYRON.app.tar.gz.sig \
            production/codesign-details.txt production/designated-requirement.txt

      - name: Verify remote RC5 assets and updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" >/tmp/release.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/release.json'));head=os.popen('git rev-parse HEAD').read().strip()
          assert d['tag_name']==os.environ['TAG'] and d['draft'] is False and d['prerelease'] is True and d['target_commitish']==head
          req={f"VYRON-{os.environ['VERSION']}-arm64.dmg",f"VYRON-{os.environ['VERSION']}-arm64.dmg.sha256",'VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig','codesign-details.txt','designated-requirement.txt'}
          assets={a['name']:a for a in d['assets']};assert req <= set(assets)
          assert all(assets[n]['size']>0 for n in req)
          print('REMOTE_RELEASE_VERIFIED=PASS');print('RELEASE_ASSETS_VERIFIED=PASS')
          PY
          rm -rf /tmp/remote-rc5 && mkdir /tmp/remote-rc5
          gh release download "$TAG" --repo "$REPO" --dir /tmp/remote-rc5 --pattern 'VYRON.app.tar.gz' --pattern 'VYRON.app.tar.gz.sig'
          cmp -s production/VYRON.app.tar.gz /tmp/remote-rc5/VYRON.app.tar.gz
          cmp -s production/VYRON.app.tar.gz.sig /tmp/remote-rc5/VYRON.app.tar.gz.sig
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          d=json.load(open('/tmp/release.json'));archive=Path('/tmp/remote-rc5/VYRON.app.tar.gz')
          digest='sha256:'+hashlib.sha256(archive.read_bytes()).hexdigest()
          remote=next(a['digest'] for a in d['assets'] if a['name']=='VYRON.app.tar.gz');assert remote==digest
          sig=Path('/tmp/remote-rc5/VYRON.app.tar.gz.sig').read_text().strip();decoded=base64.b64decode(sig,validate=True).decode()
          assert decoded.startswith('untrusted comment: signature from tauri secret key')
          print('UPDATER_ARCHIVE_VERIFIED=PASS');print('UPDATER_SIGNATURE_VERIFIED=PASS');print('UPDATER_SHA256='+digest.split(':',1)[1])
          PY

      - name: Promote RC5 macOS updater feed
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          release=json.load(open('/tmp/release.json'));sig=Path('/tmp/remote-rc5/VYRON.app.tar.gz.sig').read_text().strip()
          data={'version':os.environ['VERSION'],'notes':(release.get('body') or '').strip() or 'VYRON 2.1.15-rc.5','pub_date':release['published_at'],'platforms':{'darwin-aarch64':{'url':f"https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/{os.environ['TAG']}/VYRON.app.tar.gz",'signature':sig}}}
          Path('/tmp/latest-rc5.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          BASE="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .sha)"
          BEFORE="$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')"
          test "$BEFORE" = '2.1.15-rc.4'
          CONTENT="$(base64 < /tmp/latest-rc5.json | tr -d '\n')"
          gh api --method PUT "repos/$REPO/contents/vyron-updates/latest.json" -f message="release: publish VYRON $VERSION in-app macOS updater" -f content="$CONTENT" -f sha="$BASE" -f branch=main >/tmp/feed-publish.json
          echo "FEED_COMMIT=$(python3 -c 'import json;print(json.load(open("/tmp/feed-publish.json"))["commit"]["sha"])')"
          echo 'MAC_FEED_PROMOTED=PASS'

      - name: Verify raw RC5 feed and Windows unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/api-feed.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/api-feed.json'));assert d['version']==os.environ['VERSION'];p=d['platforms']['darwin-aarch64']
          assert p['url'].endswith('/'+os.environ['TAG']+'/VYRON.app.tar.gz') and p['signature']
          print('GITHUB_FILE_API_VERIFIED=PASS')
          PY
          verified=0
          for i in {1..18}; do
            curl -fsSL -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json?ts=$(date +%s)-$i" -o /tmp/raw-feed.json || true
            if python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/raw-feed.json'));assert d['version']==os.environ['VERSION'];p=d['platforms']['darwin-aarch64'];assert p['url'].endswith('/'+os.environ['TAG']+'/VYRON.app.tar.gz') and p['signature']
          PY
            then verified=1;break;fi
            sleep 5
          done
          test "$verified" = 1
          echo 'RAW_FEED_VERIFIED=PASS'
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-after.json
          test "$(shasum -a 256 /tmp/windows-feed-after.json | awk '{print $1}')" = "$(cat /tmp/windows-feed-before.sha)"
          test "$(python3 -c 'import json;print(json.load(open("/tmp/windows-feed-after.json"))["version"])')" = '2.1.13'
          echo 'WINDOWS_FEED_UNCHANGED=PASS'
          echo 'ONLINE_UPDATE_AVAILABLE=YES'
          echo 'READY_FOR_STABLE_2.1.15=NO'
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-signing.p12" "$RUNNER_TEMP/vyron-signing.pem"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; fi
