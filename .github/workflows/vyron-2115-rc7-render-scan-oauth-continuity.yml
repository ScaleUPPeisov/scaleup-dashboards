name: VYRON 2.1.15 RC7 Render Scan OAuth Continuity

on:
  push:
    branches:
      - release/vyron-2.1.15-rc7-render-scan-oauth-continuity
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-2115-rc7-render-scan-oauth-continuity
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.15-rc.7'
  TAG: v2.1.15-rc.7
  SOURCE_RC6: c9cc22781979c164c8abba995b121998a399cc59
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  windows_compile:
    name: Windows compile safety
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout RC7 branch
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.15-rc7-render-scan-oauth-continuity
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and RC7 frontend safety on Windows
        shell: pwsh
        run: |
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run src/renderScanClassifier.test.ts src/v2115Rc7RenderScanContract.test.ts src/v2115Rc7OauthUpdateContinuity.test.ts src/updaterSchedule.test.ts src/updaterRuntimeRc5.test.ts src/updaterRuntime.test.ts src/updaterPolicy.test.ts src/updaterGuard.test.ts src/updaterHotfix.test.ts src/v2115Rc5KeychainContinuity.test.ts src/v2115Rc6KeychainRotation.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'WINDOWS_TYPESCRIPT=PASS'
          Write-Output 'WINDOWS_RC7_FRONTEND=PASS'
      - name: Rust compile safety on Windows
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'WINDOWS_RUST_CHECK=PASS'

  rc:
    name: RC7 automated prerelease gates
    needs: windows_compile
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - name: Checkout RC7 branch
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.15-rc7-render-scan-oauth-continuity
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Source freeze version and feed baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse v2.1.15-rc.6)" = "$SOURCE_RC6"
          git merge-base --is-ancestor "$SOURCE_RC6" HEAD
          python3 - <<'PY'
          import json,re,subprocess,os
          from pathlib import Path
          allowed={
            '.github/workflows/vyron-2115-rc7-render-scan-oauth-continuity.yml',
            'package-lock.json','package.json',
            'src-tauri/Cargo.lock','src-tauri/Cargo.toml','src-tauri/tauri.conf.json',
            'src-tauri/src/local_delete.rs','src-tauri/src/youtube.rs',
            'src/AuthRecoveryCenter.tsx','src/PublisherOS.tsx','src/api.ts','src/types.ts',
            'src/storageLifecycle.test.ts',
            'src/renderScanClassifier.ts','src/renderScanClassifier.test.ts',
            'src/v2115Rc7OauthUpdateContinuity.test.ts','src/v2115Rc7RenderScanContract.test.ts',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only',f"{os.environ['SOURCE_RC6']}..HEAD"],text=True).splitlines()))
          extra=changed-allowed
          missing=allowed-changed
          if extra: raise SystemExit('BLOCKER=UNAUTHORIZED_RC7_DIFF:'+','.join(sorted(extra)))
          if missing: raise SystemExit('BLOCKER=RC7_DIFF_INCOMPLETE:'+','.join(sorted(missing)))
          pkg=json.load(open('package.json'));lock=json.load(open('package-lock.json'));conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=Path('src-tauri/Cargo.toml').read_text();clock=Path('src-tauri/Cargo.lock').read_text();v=os.environ['VERSION']
          assert pkg['version']==v
          assert lock['version']==v and lock['packages']['']['version']==v
          assert conf['version']==v and conf['identifier']==os.environ['BUNDLE_ID']
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']==os.environ['EMBEDDED_UPDATER_KEY']
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.15-rc\.7"\s*$',cargo)
          assert re.search(r'\[\[package\]\]\nname = "channelflow"\nversion = "2\.1\.15-rc\.7"',clock)
          print('SOURCE_FREEZE=PASS')
          print('VERSION_CONTRACT=PASS')
          PY
          test -n "${VYRON_MACOS_SIGNING_P12_BASE64:-}"
          test -n "${VYRON_MACOS_SIGNING_P12_PASSWORD:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test "$VYRON_MACOS_SIGNING_IDENTITY" = 'VYRON Local Code Signing'
          test "$(gh release view v2.1.15-rc.6 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_RC6"
          ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/mac-feed-before.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-before.json
          shasum -a 256 /tmp/windows-feed-before.json | awk '{print $1}' >/tmp/windows-feed-before.sha
          test "$(python3 -c 'import json;print(json.load(open("/tmp/mac-feed-before.json"))["version"])')" = '2.1.15-rc.6'
          test "$(python3 -c 'import json;print(json.load(open("/tmp/windows-feed-before.json"))["version"])')" = '2.1.13'
          echo 'FEED_BASELINE_RC6=PASS'

      - name: RC7 source contracts and RC6 preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/PublisherOS.tsx').read_text()
          c=Path('src/renderScanClassifier.ts').read_text()
          y=Path('src-tauri/src/youtube.rs').read_text()
          sec=Path('src-tauri/src/security.rs').read_text()
          types=Path('src/types.ts').read_text()
          assert "channelRenderFolder=(channel?.renderFolderPath||'').trim()" in p
          scan=p.split('async function scanRenderFolder()',1)[1].split('function addScannedRenderCandidates',1)[0]
          assert 'const root=channelRenderFolder' in scan and 'settings.workspace' not in scan
          assert 'CHANNEL_RENDER_FOLDER_NOT_CONFIGURED' in p
          assert 'CROSS_CHANNEL_SCAN_RECOVERY_REQUIRED' in p
          assert "sourceOrigin:'render-scan'" in p
          assert 'TOTAL_CLASSIFIED_FILES' in c and 'RENDER_SCAN_COUNTER_INVARIANT_FAILED' in c
          assert 'UPLOADED_LOCAL_COPY' in c and 'NEW_CANDIDATE' in c and 'VERIFY_REQUIRED' in c
          assert 'renderFolderPath?:string' in types
          assert 'com.scaleup.vyron.security.v2' in sec
          assert 'profile_refresh_token_account_from_state' in y
          assert 'physical_rc5_auth_failed_old_backup_read_rotates_without_old_secret_value' in y
          assert 'fresh_rotated_item_auth_failed_stops_after_one_generation' in y
          assert 'rc7_update_roundtrip_prefers_rotated_pointer_over_blocked_legacy' in y
          assert 'rc7_fifty_profile_update_continuity_changes_no_uuid_or_active_pointer' in y
          print('RC7_RENDER_SCAN_CONTRACTS=PASS')
          print('RC7_OAUTH_UPDATE_CONTINUITY_CONTRACTS=PASS')
          print('RC6_KEYCHAIN_ROTATION_PRESERVED=PASS')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted RC7 frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run             src/renderScanClassifier.test.ts             src/v2115Rc7RenderScanContract.test.ts             src/v2115Rc7OauthUpdateContinuity.test.ts             src/v2115Rc6KeychainRotation.test.ts             src/v2115Rc5KeychainContinuity.test.ts             src/v2115Rc5UpdaterReliability.test.ts             src/v2115Rc4ActivityJournal.test.ts             src/v2115Rc4StatisticsCenter.test.ts             src/v2115ScheduleSyncHotfix.test.ts             src/storageLifecycle.test.ts             src/uploadQueue.test.ts             src/youtubeInventoryRc4.test.ts             src/channelSchedule.test.ts             src/scheduleContinuation.test.ts             src/publisherSchedule.test.ts             src/updaterSchedule.test.ts             src/updaterRuntimeRc5.test.ts             src/updaterRuntime.test.ts             src/updaterPolicy.test.ts
          echo 'TARGETED_FRONTEND=PASS'

      - name: Targeted RC7 Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc6_keychain_rotation_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc3_oauth_processing_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2114_channel_statistics_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml keychain_prompt_architecture_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc2_schedule_sync_hotfix_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v219_rc4_inventory_and_acl_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml security::tests -- --skip security::tests::keychain_roundtrip --nocapture
          echo 'TARGETED_RUST=PASS'

      - name: Full regression and production build
        shell: bash
        run: |
          set -Eeuo pipefail
          npx tsc --noEmit
          npm test
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --skip security::tests::keychain_roundtrip
          echo 'TYPESCRIPT=PASS'
          echo 'FRONTEND_REGRESSION=PASS'
          echo 'RUST_CHECK=PASS'
          echo 'RUST_REGRESSION=PASS'
          echo 'PRODUCTION_FRONTEND_BUILD=PASS'

      - name: Import persistent signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          CERT="$RUNNER_TEMP/vyron-signing.pem"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c "$VYRON_MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          test -s "$CERT"
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw
          def dec(x):
              try:return base64.b64decode(x,validate=True).decode()
              except:return None
          if raw.startswith('untrusted comment:'):
              out=base64.b64encode(raw.encode()).decode();box=raw
          else:
              one=dec(raw)
              if one and one.startswith('untrusted comment:'): out=raw;box=one
              else:
                  box=dec(one) if one else None
                  assert box and box.startswith('untrusted comment:')
                  out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed ARM64 RC7 and updater artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p production
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP";test -s "$DMG";test -s "$UPDATER";test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee production/codesign-details.txt
          codesign -d -r- "$APP" 2>&1 | tee production/designated-requirement.txt
          ! grep -F 'Signature=adhoc' production/codesign-details.txt
          rm -rf /tmp/vyron-rc6 && mkdir /tmp/vyron-rc6
          gh release download v2.1.15-rc.6 --repo "$REPO" --dir /tmp/vyron-rc6 --pattern designated-requirement.txt
          cmp -s production/designated-requirement.txt /tmp/vyron-rc6/designated-requirement.txt
          echo 'RC6_RC7_DESIGNATED_REQUIREMENT_CONTINUITY=PASS'
          hdiutil verify "$DMG"
          cp "$DMG" "production/VYRON-$VERSION-arm64.dmg"
          cp "$UPDATER" production/VYRON.app.tar.gz
          cp "$SIG" production/VYRON.app.tar.gz.sig
          shasum -a 256 "production/VYRON-$VERSION-arm64.dmg" | tee "production/VYRON-$VERSION-arm64.dmg.sha256"
          shasum -a 256 production/VYRON.app.tar.gz | tee production/VYRON.app.tar.gz.sha256
          echo 'ARM64_BUILD=PASS'
          echo 'CODESIGN=PASS'
          echo 'DMG_VERIFY=PASS'

      - name: Finder-like RC7 launch
        shell: bash
        run: |
          set -Eeuo pipefail
          M="$RUNNER_TEMP/vyron-2115-rc7-mount"
          rm -rf "$M";mkdir -p "$M"
          hdiutil attach "production/VYRON-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$M"
          trap 'hdiutil detach "$M" >/dev/null 2>&1 || true' EXIT
          A="$M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$A/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$A"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$A/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-2115-rc7-launch.log 2>&1 &
          P=$!;sleep 8;kill -0 "$P";kill "$P" || true;wait "$P" || true
          hdiutil detach "$M";trap - EXIT
          echo 'APP_START=PASS'
          echo 'BLACK_SCREEN=NO'

      - name: Verify RC6 feed remains live before prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/mac-feed-now.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-now.json
          test "$(python3 -c 'import json;print(json.load(open("/tmp/mac-feed-now.json"))["version"])')" = '2.1.15-rc.6'
          test "$(shasum -a 256 /tmp/windows-feed-now.json | awk '{print $1}')" = "$(cat /tmp/windows-feed-before.sha)"
          echo 'PRE_RELEASE_FEED_ISOLATION=PASS'

      - name: Publish immutable RC7 prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL_HEAD="$(git rev-parse HEAD)"
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 2.1.15-rc.7 — Channel Render Scan + OAuth Update Continuity

          Built directly on immutable v2.1.15-rc.6.

          - Publisher render scan now requires an exact folder bound to the stable local channel ID and never silently falls back to the global workspace.
          - Every supported physical media file receives exactly one primary classification; summary counters cannot exceed the scanned file total.
          - Existing YouTube proof keeps local copies out of NEW upload candidates and same sequence numbers on different channels do not collide.
          - RC6 wrong-root scan records are blocked from upload and exposed for metadata-only recovery; physical files are never moved or deleted by repair.
          - Normal application updates preserve active refresh-token account pointers, profile UUIDs, Bundle ID and canonical Keychain service.
          - 13-profile and 50-profile continuity fixtures protect rotated/legacy mixed states without browser launch, credentials.json reimport or mass rotation.
          - RC6 KEYCHAIN_AUTH_FAILED / OSStatus -25293 generation rotation remains intact.
          - This prerelease is intentionally NOT promoted to the macOS updater feed until physical RC6→RC7 OAuth continuity and Glass City Lovers render-scan acceptance pass.
          EOF
          gh release create "$TAG" --repo "$REPO" --target "$FINAL_HEAD" --title 'VYRON 2.1.15 RC7 — Channel Render Scan + OAuth Update Continuity' --prerelease --notes-file /tmp/release-notes.md             "production/VYRON-$VERSION-arm64.dmg" "production/VYRON-$VERSION-arm64.dmg.sha256"             production/VYRON.app.tar.gz production/VYRON.app.tar.gz.sha256 production/VYRON.app.tar.gz.sig             production/codesign-details.txt production/designated-requirement.txt

      - name: Verify remote RC7 assets and updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" >/tmp/release.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/release.json'));head=os.popen('git rev-parse HEAD').read().strip()
          assert d['tag_name']==os.environ['TAG'] and d['draft'] is False and d['prerelease'] is True and d['target_commitish']==head
          req={f"VYRON-{os.environ['VERSION']}-arm64.dmg",f"VYRON-{os.environ['VERSION']}-arm64.dmg.sha256",'VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig','codesign-details.txt','designated-requirement.txt'}
          assets={a['name']:a for a in d['assets']};assert req <= set(assets);assert all(assets[n]['size']>0 for n in req)
          print('REMOTE_RELEASE_VERIFIED=PASS');print('RELEASE_ASSETS_VERIFIED=PASS')
          PY
          rm -rf /tmp/remote-rc7 && mkdir /tmp/remote-rc7
          gh release download "$TAG" --repo "$REPO" --dir /tmp/remote-rc7 --pattern 'VYRON.app.tar.gz' --pattern 'VYRON.app.tar.gz.sig'
          cmp -s production/VYRON.app.tar.gz /tmp/remote-rc7/VYRON.app.tar.gz
          cmp -s production/VYRON.app.tar.gz.sig /tmp/remote-rc7/VYRON.app.tar.gz.sig
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          d=json.load(open('/tmp/release.json'));archive=Path('/tmp/remote-rc7/VYRON.app.tar.gz')
          digest='sha256:'+hashlib.sha256(archive.read_bytes()).hexdigest()
          remote=next(a['digest'] for a in d['assets'] if a['name']=='VYRON.app.tar.gz');assert remote==digest
          sig=Path('/tmp/remote-rc7/VYRON.app.tar.gz.sig').read_text().strip();decoded=base64.b64decode(sig,validate=True).decode()
          assert decoded.startswith('untrusted comment: signature from tauri secret key')
          print('UPDATER_ARCHIVE_VERIFIED=PASS');print('UPDATER_SIGNATURE_VERIFIED=PASS');print('UPDATER_SHA256='+digest.split(':',1)[1])
          PY

      - name: Hold RC7 feed for physical acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/mac-feed-after.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-after.json
          test "$(python3 -c 'import json;print(json.load(open("/tmp/mac-feed-after.json"))["version"])')" = '2.1.15-rc.6'
          test "$(shasum -a 256 /tmp/windows-feed-after.json | awk '{print $1}')" = "$(cat /tmp/windows-feed-before.sha)"
          test "$(python3 -c 'import json;print(json.load(open("/tmp/windows-feed-after.json"))["version"])')" = '2.1.13'
          echo 'MAC_FEED_STILL_RC6=PASS'
          echo 'WINDOWS_FEED_UNCHANGED=PASS'
          echo 'PHYSICAL_ACCEPTANCE_REQUIRED=YES'
          echo 'MAC_FEED_PROMOTED=NO'

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-signing.p12" "$RUNNER_TEMP/vyron-signing.pem"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; fi
