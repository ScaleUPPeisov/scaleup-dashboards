name: VYRON 2.1.2 Final Regression and Production Release

on:
  push:
    branches:
      - repair/vyron-native-keychain-diagnostic
    paths:
      - '.github/workflows/vyron-212-production-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyron-212-final-production-release
  cancel-in-progress: false

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.2'
  TAG: 'v2.1.2'
  FEATURE_COMMIT: '0419211a312df1c2cb907dc70faad3eca92b9192'
  BUNDLE_ID: 'studio.channelflow.desktop'

jobs:
  final-regression:
    name: One final full regression — exact production source
    runs-on: macos-14
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      VYRON_TEST_REAL_FFMPEG: '1'
      VYRON_SHORTS_REAL_TEST: '1'
    steps:
      - name: Checkout final release HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove production HEAD and feature ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = 'repair/vyron-native-keychain-diagnostic'
          git cat-file -e "$FEATURE_COMMIT^{commit}"
          git merge-base --is-ancestor "$FEATURE_COMMIT" "$GITHUB_SHA"
          git diff --name-only "$FEATURE_COMMIT..$GITHUB_SHA" > "$RUNNER_TEMP/post-feature-paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/post-feature-paths.txt" | tr -d ' ')" = '1'
          grep -Fxq '.github/workflows/vyron-212-production-release.yml' "$RUNNER_TEMP/post-feature-paths.txt"
          test -z "$(git status --porcelain)"
          echo "FINAL_RELEASE_HEAD=$GITHUB_SHA"
          echo "SOURCE_FEATURE_COMMIT=$FEATURE_COMMIT"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble exact final production source
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi

          ROOT="$GITHUB_WORKSPACE/.vyron-212-final"
          SRC="$RUNNER_TEMP/vyron212-base"
          LEGACY="$RUNNER_TEMP/vyron-legacy"
          NATIVE="$RUNNER_TEMP/vyron-native-repair.py"
          AUTH="$RUNNER_TEMP/vyron-auth-recovery.py"
          rm -rf "$ROOT" "$SRC" "$LEGACY"
          mkdir -p "$ROOT" "$SRC" "$LEGACY"

          gh release download v2.1.0 --repo "$REPO" --pattern 'VYRON-2.1.0-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir "$SRC"
          cd "$SRC"
          expected="$(awk '{print $1}' SOURCE_SHA256.txt)"
          actual="$(shasum -a 256 VYRON-2.1.0-source.tar.gz | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          tar -xzf VYRON-2.1.0-source.tar.gz -C "$ROOT"

          cd "$GITHUB_WORKSPACE"
          python3 vyron-v2111/apply_v2111_youtube_runtime_repair.py "$ROOT"
          python3 vyron-v2111/apply_v2111_gatefix1.py "$ROOT"
          python3 vyron-v2111/apply_v2111_gatefix2.py "$ROOT"
          python3 vyron-v2111/apply_v2111_shorts_folder.py "$ROOT"
          python3 vyron-v2111/apply_v2111_global_cleanup.py "$ROOT" || echo 'Base cleanup backend applied; finish script follows'
          python3 vyron-v2111/apply_v2111_global_cleanup_finish.py "$ROOT"
          python3 vyron-v2111/apply_v2111_cleanup_test_placement_fix.py "$ROOT"
          python3 .github/scripts/apply_v2111_oauth_keychain_recovery.py "$ROOT"
          python3 .github/scripts/apply_v2111_oauth_orphan_recovery.py "$ROOT"
          python3 .github/scripts/apply_v2111_oauth_orphan_testfix.py "$ROOT"
          python3 vyron-v212/apply_v212_release.py "$ROOT"

          git diff-tree --no-commit-id --name-only -r "$FEATURE_COMMIT" > "$RUNNER_TEMP/feature-files.txt"
          copied=0
          while IFS= read -r rel; do
            case "$rel" in
              src/*|src-tauri/*|tests/*|package.json|package-lock.json|vite.config.*|tsconfig*.json)
                mkdir -p "$ROOT/$(dirname "$rel")"
                git show "$FEATURE_COMMIT:$rel" > "$ROOT/$rel"
                git show "$FEATURE_COMMIT:$rel" | cmp -s - "$ROOT/$rel"
                copied=$((copied+1))
                ;;
            esac
          done < "$RUNNER_TEMP/feature-files.txt"
          test "$copied" -ge 10

          for f in \
            src/storageLifecycle.ts \
            src/storageLifecycle.test.ts \
            src/PublisherOS.tsx \
            src/v2111PublisherWiring.test.ts \
            src-tauri/src/local_delete.rs \
            src-tauri/src/production_manager.rs \
            src-tauri/src/storage.rs \
            src-tauri/src/youtube.rs; do
            test -s "$ROOT/$f"
          done

          # Apply the current production OAuth/Keychain/upload repair stack AFTER
          # the lifecycle overlay so no later feature overlay can erase these fixes.
          cat .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.00 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.01 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02a \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02b \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.03 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.part01 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.part02 \
            | base64 --decode | gunzip > "$NATIVE"
          test "$(shasum -a 256 "$NATIVE" | awk '{print $1}')" = '4196bc3e2199e3e038120f37128eb2d5ccb412177c25436a751b9f5ec53fe7ea'

          cat .github/scripts/vyron_auth_recovery.py.gz.b64.part00 \
              .github/scripts/vyron_auth_recovery.py.gz.b64.part01 \
              .github/scripts/vyron_auth_recovery.py.gz.b64.part02 \
            | base64 --decode | gunzip > "$AUTH"
          test "$(shasum -a 256 "$AUTH" | awk '{print $1}')" = '3f0b2a6311929def43daedaf7bff52c74dbfe0bbfa5b722cf110893ceabb4462'

          python3 "$NATIVE" "$ROOT"
          python3 .github/scripts/apply_native_keychain_compilefix.py "$ROOT"
          python3 .github/scripts/apply_global_keychain_inventory.py "$ROOT"
          python3 "$AUTH" "$ROOT"
          python3 .github/scripts/apply_final_reconnect_recovery.py "$ROOT"
          python3 .github/scripts/apply_upload_button_unblock_fix.py "$ROOT"
          python3 .github/scripts/apply_youtube_upload_transport_watchdog.py "$ROOT"
          python3 .github/scripts/apply_reconnect_browser_choice.py "$ROOT"

          for V in 2.0.8 2.0.9; do
            mkdir -p "$LEGACY/$V/src"
            gh release download "v$V" --repo "$REPO" --pattern "VYRON-$V-source.tar.gz" --dir "$LEGACY/$V"
            tar -xzf "$LEGACY/$V/VYRON-$V-source.tar.gz" -C "$LEGACY/$V/src"
          done
          grep -Fq 'dir.join("youtube-oauth.json")' "$LEGACY/2.0.8/src/src-tauri/src/youtube.rs"
          grep -Fq 'refresh_token:String' "$LEGACY/2.0.8/src/src-tauri/src/youtube.rs"
          grep -Fq 'const SERVICE:&str="com.scaleup.vyron.security"' "$LEGACY/2.0.9/src/src-tauri/src/security.rs"
          grep -Fq 'fn oauth_key(id:&str,kind:&str)->String{format!("oauth.{id}.{kind}")}' "$LEGACY/2.0.9/src/src-tauri/src/youtube.rs"

          cd "$ROOT"
          python3 - <<'PY'
          import json,re,pathlib
          pkg=json.load(open('package.json'))
          conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=open('src-tauri/Cargo.toml').read()
          assert pkg['version']=='2.1.2'
          assert conf['version']=='2.1.2'
          assert conf['identifier']=='studio.channelflow.desktop'
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.2"\s*$',cargo)
          assert conf.get('bundle',{}).get('createUpdaterArtifacts') is True
          lock=pathlib.Path('package-lock.json')
          if lock.exists():
              data=json.loads(lock.read_text())
              if 'version' in data: assert data['version']=='2.1.2'
              root=data.get('packages',{}).get('',{})
              if 'version' in root: assert root['version']=='2.1.2'
          for text in (json.dumps(pkg),json.dumps(conf),cargo):
              assert '2.1.3' not in text
          print('VERSION/BUNDLE CONTRACT: PASS')
          PY

      - name: Static production contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE/.vyron-212-final"

          # YouTube upload/preflight/verification/schedule contracts.
          grep -Fq "method:'videos.list'" "$ROOT/src/PublisherOS.tsx"
          grep -Fq 'publishAt' "$ROOT/src/PublisherOS.tsx"
          grep -Fq 'ZERO-API PRE-FLIGHT' "$ROOT/src/PublisherOS.tsx"
          grep -Fq 'verify_uploaded_video' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'video/quicktime' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'SKIPPED_PAST_DATE' "$ROOT/src/PublisherOS.tsx"

          # Persistent lifecycle, duplicate guard, cleanup and system Trash.
          grep -Fq 'successfulUploadForHash' "$ROOT/src/PublisherOS.tsx"
          grep -Fq 'uploadHistory' "$ROOT/src/PublisherOS.tsx"
          grep -Fq 'SAFE_TO_CLEAN' "$ROOT/src/storageLifecycle.ts"
          grep -Fq "status==='UPLOADED'" "$ROOT/src/storageLifecycle.ts"
          grep -Fq 'youtubeVideoId' "$ROOT/src/storageLifecycle.ts"
          grep -Fq 'trash::delete' "$ROOT/src-tauri/src/local_delete.rs"
          grep -Fq 'verified_uploaded_job_ids' "$ROOT/src-tauri/src/production_manager.rs"
          grep -Fq 'trash::delete' "$ROOT/src-tauri/src/production_manager.rs"

          # Shorts MP4/MOV contracts.
          grep -Fq 'shorts_scan_folder' "$ROOT/src-tauri/src/shorts_factory.rs"
          grep -Fq 'Some("mp4")' "$ROOT/src-tauri/src/shorts_factory.rs"
          grep -Fq 'Some("mov")' "$ROOT/src-tauri/src/shorts_factory.rs"

          # Current native Keychain diagnostic/recovery contracts.
          grep -Fq 'ItemSearchOptions' "$ROOT/src-tauri/src/security.rs"
          grep -Fq 'ItemClass::generic_password()' "$ROOT/src-tauri/src/security.rs"
          grep -Fq 'load_attributes(true)' "$ROOT/src-tauri/src/security.rs"
          grep -Fq 'Limit::All' "$ROOT/src-tauri/src/security.rs"
          grep -Fq 'security_oauth_inventory' "$ROOT/src-tauri/src/security.rs"
          if grep -Fq 'dump-keychain' "$ROOT/src-tauri/src/security.rs"; then
            echo 'ERROR: shell dump-keychain survived current native repair'
            exit 1
          fi
          grep -Fq 'youtube_oauth_recovery_diagnostic' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'KEYCHAIN_ACCESS_DENIED' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'REFRESH_TOKEN_REVOKED' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'CHANNEL_ID_MISMATCH' "$ROOT/src-tauri/src/youtube.rs"

          # Existing-profile reconnect must require a fresh offline refresh token.
          grep -Fq 'youtube_oauth_reconnect_existing' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'access_type=offline&prompt=consent' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'OAUTH_REFRESH_TOKEN_REQUIRED' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'WRONG_CHANNEL:' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'reconnect_write_readback_with' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'resolveOAuthMissingErrors' "$ROOT/src/AuthRecoveryCenter.tsx"
          grep -Fq 'Уникальных профилей для входа' "$ROOT/src/AuthRecoveryCenter.tsx"
          grep -Fq 'Переподключить следующий' "$ROOT/src/AuthRecoveryCenter.tsx"
          grep -Fq '<AuthRecoveryCenter/>' "$ROOT/src/SettingsOS.tsx"

          # Upload button/runtime lock must not regress to stale persisted lock.
          grep -Fq 'runtimeLocks:ChannelUploadLock' "$ROOT/src/youtubePublishSafety.ts"
          if grep -Fq "LOCKS='vyron:youtube-publish-locks:v1'" "$ROOT/src/youtubePublishSafety.ts"; then
            echo 'ERROR: obsolete persistent frontend upload lock survived'
            exit 1
          fi
          grep -Fq 'СНАЧАЛА СИНХРОНИЗИРУЙТЕ РАСПИСАНИЕ' "$ROOT/src/PublisherOS.tsx"
          grep -Fq 'Почему загрузка сейчас недоступна' "$ROOT/src/PublisherOS.tsx"

          # Upload transport watchdog/resume contracts.
          grep -Fq 'YOUTUBE_UPLOAD_CHUNK_BYTES:usize=8*1024*1024' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'YOUTUBE_UPLOAD_REQUEST_TIMEOUT_SECS:u64=120' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'connect_timeout(Duration::from_secs(YOUTUBE_UPLOAD_CONNECT_TIMEOUT_SECS))' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'timeout(Duration::from_secs(YOUTUBE_UPLOAD_REQUEST_TIMEOUT_SECS))' "$ROOT/src-tauri/src/youtube.rs"
          grep -Fq 'resumable_status(&client,&session.session_url,token,session.total)' "$ROOT/src-tauri/src/youtube.rs"

          # Reconnect browser choice/current production UX.
          grep -Fq 'api.youtubeOauthBrowsers()' "$ROOT/src/AuthRecoveryCenter.tsx"
          grep -Fq 'setBrowserOpen(true)' "$ROOT/src/AuthRecoveryCenter.tsx"
          grep -Fq 'chooseBrowser(target.profileId)' "$ROOT/src/AuthRecoveryCenter.tsx"
          grep -Fq 'chooseBrowser(r.profileId)' "$ROOT/src/AuthRecoveryCenter.tsx"
          grep -Fq "youtube_oauth_reconnect_existing',{profileId,browser}" "$ROOT/src/AuthRecoveryCenter.tsx"
          grep -Fq 'Браузер по умолчанию' "$ROOT/src/reconnectBrowserChoiceCore.ts"

          echo 'STATIC CONTRACTS: PASS'

      - name: Freeze exact source for build after gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.green-source"
          tar -czf "$GITHUB_WORKSPACE/.green-source/VYRON-2.1.2-green-source.tar.gz" \
            --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' \
            -C "$GITHUB_WORKSPACE/.vyron-212-final" .
          shasum -a 256 "$GITHUB_WORKSPACE/.green-source/VYRON-2.1.2-green-source.tar.gz" > "$GITHUB_WORKSPACE/.green-source/GREEN_SOURCE_SHA256.txt"

      - name: Frontend full project tests
        working-directory: .vyron-212-final
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: TypeScript
        working-directory: .vyron-212-final
        shell: bash
        run: |
          set -Eeuo pipefail
          npx tsc --noEmit --pretty false

      - name: Frontend production build
        working-directory: .vyron-212-final
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build

      - name: Rust full tests including OAuth and real FFmpeg MP4/MOV
        working-directory: .vyron-212-final
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          echo 'VYRON 2.1.2 FINAL FULL REGRESSION: PASS'

      - name: Upload exact green source only after regression PASS
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.2-green-source
          path: .green-source/
          if-no-files-found: error
          retention-days: 30

  build-candidate:
    name: ARM64 production build from green source
    needs: final-regression
    runs-on: macos-14
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Download exact green source
        uses: actions/download-artifact@v4
        with:
          name: VYRON-2.1.2-green-source
          path: green-source

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and extract green source
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(awk '{print $1}' green-source/GREEN_SOURCE_SHA256.txt)"
          actual="$(shasum -a 256 green-source/VYRON-2.1.2-green-source.tar.gz | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          ROOT="$GITHUB_WORKSPACE/.vyron-212-release"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          tar -xzf green-source/VYRON-2.1.2-green-source.tar.gz -C "$ROOT"
          python3 - <<'PY'
          import json,re
          root='.vyron-212-release'
          pkg=json.load(open(f'{root}/package.json'))
          conf=json.load(open(f'{root}/src-tauri/tauri.conf.json'))
          cargo=open(f'{root}/src-tauri/Cargo.toml').read()
          assert pkg['version']=='2.1.2'
          assert conf['version']=='2.1.2'
          assert conf['identifier']=='studio.channelflow.desktop'
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.2"\s*$',cargo)
          PY
          cd "$ROOT"
          npm ci --no-audit --no-fund

      - name: Normalize updater signing material
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key')
          pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          PY

      - name: Build real ARM64 app DMG updater archive and signature
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/.vyron-212-release"
          python3 - <<'PY'
          import json,os
          conf=json.load(open('src-tauri/tauri.conf.json'))
          assert conf['version']=='2.1.2'
          assert conf['identifier']=='studio.channelflow.desktop'
          assert conf['plugins']['updater']['pubkey'].strip()==os.environ['TAURI_UPDATER_PUBLIC_KEY'].strip()
          print('UPDATER PUBLIC KEY: PASS')
          PY
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP"
          test -s "$DMG"
          test -s "$UPDATER"
          test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.2'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          test -x "$APP/Contents/MacOS/$EXE"
          file "$APP/Contents/MacOS/$EXE" | grep -q 'arm64'
          otool -hv "$APP/Contents/MacOS/$EXE" | grep -q 'ARM64'
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -qi 'Signature=adhoc'
          hdiutil verify "$DMG"

          MOUNT="$RUNNER_TEMP/vyron212-build-mount"
          rm -rf "$MOUNT"; mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          test -d "$MOUNT/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$MOUNT/VYRON.app/Contents/Info.plist")" = '2.1.2'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$MOUNT/VYRON.app/Contents/Info.plist")" = "$BUNDLE_ID"
          MEXE=$(plutil -extract CFBundleExecutable raw -o - "$MOUNT/VYRON.app/Contents/Info.plist")
          test -x "$MOUNT/VYRON.app/Contents/MacOS/$MEXE"
          file "$MOUNT/VYRON.app/Contents/MacOS/$MEXE" | grep -q 'arm64'
          codesign --verify --deep --strict --verbose=2 "$MOUNT/VYRON.app"
          hdiutil detach "$MOUNT"
          trap - EXIT

          rm -rf release; mkdir release
          cp "$DMG" release/VYRON-2.1.2-macOS-AppleSilicon.dmg
          cp "$UPDATER" release/VYRON.app.tar.gz
          cp "$SIG" release/VYRON.app.tar.gz.sig
          cp "$GITHUB_WORKSPACE/green-source/VYRON-2.1.2-green-source.tar.gz" release/VYRON-2.1.2-source.tar.gz
          shasum -a 256 release/VYRON-2.1.2-macOS-AppleSilicon.dmg > release/SHA256.txt
          shasum -a 256 release/VYRON.app.tar.gz > release/UPDATER_SHA256.txt
          shasum -a 256 release/VYRON-2.1.2-source.tar.gz > release/SOURCE_SHA256.txt
          cat > release/FINAL_TEST_REPORT.md <<REPORT
          # VYRON 2.1.2 — FINAL RELEASE EVIDENCE
          - Source feature commit: 0419211a312df1c2cb907dc70faad3eca92b9192
          - Final release HEAD: $GITHUB_SHA
          - PASS: one final full regression on exact source used for this build
          - PASS: Storage Lifecycle / Duplicate Guard / persistent upload history
          - PASS: Project → Render → verified upload / Safe Cleanup / system Trash
          - PASS: frontend / TypeScript / production frontend build / Rust
          - PASS: YouTube upload, videos.list verification, publishAt and scheduling
          - PASS: current native OAuth/Keychain recovery stack and legacy contracts
          - PASS: Shorts Factory and real FFmpeg MP4/MOV regression
          - PASS: ARM64 VYRON.app and executable
          - PASS: DMG verify + mount
          - PASS: ad-hoc codesign verification (established VYRON signing mechanism)
          - NOTARIZATION: N/A — ad-hoc signing; no Developer ID notarization claimed
          - PASS: updater archive and updater signature generated
          REPORT

      - name: Upload exact production candidate
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.2-production-candidate
          path: .vyron-212-release/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish stable GitHub v2.1.2
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact production candidate
        uses: actions/download-artifact@v4
        with:
          name: VYRON-2.1.2-production-candidate
          path: release

      - name: Validate release payload and notes
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in VYRON-2.1.2-macOS-AppleSilicon.dmg VYRON.app.tar.gz VYRON.app.tar.gz.sig VYRON-2.1.2-source.tar.gz SHA256.txt UPDATER_SHA256.txt SOURCE_SHA256.txt FINAL_TEST_REPORT.md; do
            test -s "release/$f"
          done
          test -n "$(cat release/VYRON.app.tar.gz.sig)"
          cat > release/RELEASE_NOTES.md <<'NOTES'
          # VYRON 2.1.2

          Stable Apple Silicon production release from the current VYRON production source. Includes the verified OAuth/Keychain repair stack, YouTube upload/scheduling repair, Shorts Factory, cleanup protections, persistent upload lifecycle/history, duplicate SHA-256 upload guard, project-to-render upload proof and guarded macOS system Trash cleanup.

          Signing: existing ad-hoc production mechanism. Apple Developer notarization is not claimed for this build.
          NOTES

      - name: Replace stale v2.1.2 and publish exact tested release HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes
          fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG" >/dev/null
          fi
          gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title 'VYRON v2.1.2' --notes-file release/RELEASE_NOTES.md --latest
          gh release upload "$TAG" --repo "$REPO" \
            release/VYRON-2.1.2-macOS-AppleSilicon.dmg \
            release/VYRON.app.tar.gz release/VYRON.app.tar.gz.sig \
            release/VYRON-2.1.2-source.tar.gz \
            release/SHA256.txt release/UPDATER_SHA256.txt release/SOURCE_SHA256.txt \
            release/FINAL_TEST_REPORT.md release/RELEASE_NOTES.md

          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft|tostring')" = 'false'
          test "$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq '.isPrerelease|tostring')" = 'false'
          tag_sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
          echo "TAG_TARGET=$tag_sha"

  download-back:
    name: Download-back published DMG verification
    needs: publish
    runs-on: macos-14
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download only from actual GitHub Release and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir release-back
          gh release download "$TAG" --repo "$REPO" --dir release-back \
            --pattern 'VYRON-2.1.2-macOS-AppleSilicon.dmg' \
            --pattern 'VYRON.app.tar.gz' \
            --pattern 'VYRON.app.tar.gz.sig' \
            --pattern 'SHA256.txt'
          cd release-back
          for f in VYRON-2.1.2-macOS-AppleSilicon.dmg VYRON.app.tar.gz VYRON.app.tar.gz.sig SHA256.txt; do test -s "$f"; done
          expected="$(awk '{print $1}' SHA256.txt)"
          actual="$(shasum -a 256 VYRON-2.1.2-macOS-AppleSilicon.dmg | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          test -n "$(cat VYRON.app.tar.gz.sig)"
          echo "DOWNLOAD_BACK_SHA256=$actual"

          hdiutil verify VYRON-2.1.2-macOS-AppleSilicon.dmg
          MOUNT="$RUNNER_TEMP/vyron212-release-mount"
          rm -rf "$MOUNT"; mkdir -p "$MOUNT"
          hdiutil attach VYRON-2.1.2-macOS-AppleSilicon.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          test -d "$MOUNT/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$MOUNT/VYRON.app/Contents/Info.plist")" = '2.1.2'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$MOUNT/VYRON.app/Contents/Info.plist")" = "$BUNDLE_ID"
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$MOUNT/VYRON.app/Contents/Info.plist")
          test -x "$MOUNT/VYRON.app/Contents/MacOS/$EXE"
          file "$MOUNT/VYRON.app/Contents/MacOS/$EXE" | grep -q 'arm64'
          otool -hv "$MOUNT/VYRON.app/Contents/MacOS/$EXE" | grep -q 'ARM64'
          codesign --verify --deep --strict --verbose=2 "$MOUNT/VYRON.app"
          codesign -dv --verbose=4 "$MOUNT/VYRON.app" 2>&1 | grep -qi 'Signature=adhoc'
          echo 'NOTARIZATION: N/A (ad-hoc signing)'
          hdiutil detach "$MOUNT"
          trap - EXIT
          echo 'DOWNLOAD-BACK: PASS'

  activate-stable:
    name: Stable updater 2.1.2 after download-back PASS
    needs: download-back
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Generate stable updater metadata from published signature
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir stable
          gh release download "$TAG" --repo "$REPO" --dir stable --pattern 'VYRON.app.tar.gz.sig'
          python3 - <<'PY'
          import json,datetime,pathlib
          rel=pathlib.Path('stable')
          sig=(rel/'VYRON.app.tar.gz.sig').read_text().strip()
          if not sig: raise SystemExit('updater signature is empty')
          data={
            'version':'2.1.2',
            'notes':'VYRON 2.1.2 stable Apple Silicon release',
            'pub_date':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'platforms':{'darwin-aarch64':{
              'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.2/VYRON.app.tar.gz',
              'signature':sig
            }}
          }
          (rel/'latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          gh release upload "$TAG" --repo "$REPO" stable/latest.json --clobber

      - name: Activate stable feed only now
        shell: bash
        run: |
          set -Eeuo pipefail
          META=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main")
          CURRENT=$(printf '%s' "$META" | python3 -c 'import sys,json,base64;d=json.load(sys.stdin);print(base64.b64decode(d["content"]).decode())')
          CURRENT_VERSION=$(printf '%s' "$CURRENT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')
          case "$CURRENT_VERSION" in
            2.1.0|2.1.1|2.1.2) ;;
            *) echo "Unexpected stable updater version: $CURRENT_VERSION"; exit 1 ;;
          esac
          OLD_SHA=$(printf '%s' "$META" | python3 -c 'import sys,json;print(json.load(sys.stdin)["sha"])')
          CONTENT=$(base64 -w0 stable/latest.json)
          gh api --method PUT "repos/$REPO/contents/vyron-updates/latest.json" \
            -f message='VYRON updater: activate 2.1.2 final production release' \
            -f content="$CONTENT" -f sha="$OLD_SHA" -f branch=main >/dev/null

      - name: Read back real stable metadata and final release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          LIVE=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | base64 --decode)
          gh release download "$TAG" --repo "$REPO" --dir stable --pattern 'latest.json' --clobber
          python3 - "$LIVE" <<'PY'
          import json,sys,pathlib
          live=json.loads(sys.argv[1])
          asset=json.loads(pathlib.Path('stable/latest.json').read_text())
          sig=pathlib.Path('stable/VYRON.app.tar.gz.sig').read_text().strip()
          for d in (live,asset):
              assert d['version']=='2.1.2'
              assert set(d['platforms'])=={'darwin-aarch64'}
              p=d['platforms']['darwin-aarch64']
              assert p['url']=='https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.2/VYRON.app.tar.gz'
              assert p['signature']==sig and sig
          assert live['platforms']['darwin-aarch64']['signature']==asset['platforms']['darwin-aarch64']['signature']
          print('STABLE UPDATER READ-BACK: PASS')
          PY
          tag_sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft|tostring')" = 'false'
          test "$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq '.isPrerelease|tostring')" = 'false'
          gh release view "$TAG" --repo "$REPO" --json url,tagName,targetCommitish,isDraft,isPrerelease,assets
          echo "FINAL_RELEASE_COMMIT=$GITHUB_SHA"
          echo 'VYRON 2.1.2 RELEASE PIPELINE: PASS'
