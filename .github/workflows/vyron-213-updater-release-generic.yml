name: VYRON 2.1.3 Updater Hotfix Release Generic

on:
  push:
    branches: [repair/vyron-native-keychain-diagnostic]
    paths: ['.github/workflows/vyron-213-updater-release-generic.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build, release, download-back and activate feeds
        shell: bash
        run: bash .github/scripts/run_v213_updater_release.sh
