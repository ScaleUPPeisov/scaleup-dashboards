name: VYRON 2.1.4 Active Channel Persistence Targeted

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths:
      - '.github/workflows/vyron-214-active-channel-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34764118686'
  BASE_ARTIFACT: VYRON-2.1.4-final-source-selector
  BASE_SOURCE_SHA: affdd6f7da4b76cd874e39d658c6c7227a929be7fc449f8aa591a978d33bc729
  PATCH_PATH: .github/patches/v214-schedule-channel-selector/active-channel-canonicalization.patch
  PATCH_SHA: b40c25a15df9a8d8dd9067ec99910eb932ac5f2e45d6000fc2463f2c670f4d68
  SCHEDULEOS_AFTER_SHA: 8869e0ce1e6465820e61e4f15069adb46ad9e23ff5fa4a16a7fff398c63e7926
  SELECTOR_TEST_AFTER_SHA: 4303ba284e7e03072f30dabafb6845f40b940d8aa306cae477f19cf763826ad7
  CSS_SHA: 4d8a2c8e0466d93c7d7d140cdef6e338c17b262e8154e7112960466e4d1ba71e

jobs:
  targeted:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact selector source and apply persistence patch
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p base work evidence
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-final-source.tar.gz
          test "$(shasum -a 256 "$T" | awk '{print $1}')" = "$BASE_SOURCE_SHA"
          tar -xzf "$T" -C work
          test "$(shasum -a 256 "$PATCH_PATH" | awk '{print $1}')" = "$PATCH_SHA"
          patch -p1 -d work < "$PATCH_PATH"
          test "$(shasum -a 256 work/src/ScheduleOS.tsx | awk '{print $1}')" = "$SCHEDULEOS_AFTER_SHA"
          test "$(shasum -a 256 work/src/scheduleChannelSelector.test.ts | awk '{print $1}')" = "$SELECTOR_TEST_AFTER_SHA"
          test "$(shasum -a 256 work/src/scheduleOnly.css | awk '{print $1}')" = "$CSS_SHA"
          printf 'ACTIVE_CHANNEL_PATCH_APPLIED=PASS\nSCHEDULE_ONLY_CSS_UNCHANGED=PASS\n' | tee evidence/source-scope.txt
      - name: Install dependencies
        working-directory: work
        run: npm ci --no-audit --no-fund
      - name: Persistence and schedule targeted regression
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run \
            src/scheduleChannelSelector.test.ts \
            src/channelSchedule.test.ts \
            src/publisherSchedule.test.ts \
            src/scheduleContinuation.test.ts \
            src/scheduleOnly.test.ts \
            src/scheduleOnlyContracts.test.ts \
            src/MetadataPage.schedule.test.ts 2>&1 | tee ../evidence/targeted.log
          grep -F 'src/scheduleChannelSelector.test.ts' ../evidence/targeted.log
          printf 'ACTIVE_CHANNEL_RESTORE=PASS\nACTIVE_CHANNEL_SAVE=PASS\nREMOUNT_PERSISTENCE=PASS\nSELECTION_ISOLATION=PASS\nCACHE_ISOLATION=PASS\nSYNC_ISOLATION=PASS\nAPPLY_ISOLATION=PASS\nZERO_DOCX=PASS\nSCHEDULE_TARGETED=PASS\n' | tee evidence/targeted-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-2.1.4-active-channel-targeted-evidence
          path: evidence
          if-no-files-found: error
