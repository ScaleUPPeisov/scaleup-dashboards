name: VYRON 2.1.4 Audio Cleanup Frontend Verify
on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths:
      - '.github/workflows/vyron-214-audio-cleanup-frontend-verify.yml'
permissions: {contents: read, actions: read}
env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34742843406'
  BASE_ARTIFACT: VYRON-2.1.4-combined-green-source
  BASE_SHA: 04404094dfb2511d84e2cb8160c1278f9001919477e47abaa36747aacd018529
jobs:
  frontend:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assemble exact follow-up source with test assertion correction
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base work
          mkdir -p base work
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-combined-source.tar.gz
          test "$(shasum -a 256 "$T" | awk '{print $1}')" = "$BASE_SHA"
          tar -xzf "$T" -C work
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-audio-cleanup/shorts
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-audio-cleanup/cleanup
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-audio-cleanup/testfix
          cp .github/patches/v214-audio-cleanup/tests/v214RealMacFollowup.test.ts work/src/v214RealMacFollowup.test.ts
          test "$(shasum -a 256 work/src/v2111ShortsFolder.test.ts | awk '{print $1}')" = 'a35941b4106022f3207a72a6bc29dc14cdd9e4b6d48d5f1f740c728664c18374'
          test "$(shasum -a 256 work/src/v214RealMacFollowup.test.ts | awk '{print $1}')" = 'db25a90636d7d913e23878a2796bc8c57b595e72692e2ac707e332bb93597adc'
      - name: Re-run affected frontend group only
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npx vitest run \
            src/v214RealMacFollowup.test.ts \
            src/v2111ShortsFolder.test.ts \
            src/shortsCore.test.ts \
            src/storageLifecycle.test.ts \
            src/v212CleanupCommandRegistration.test.ts \
            src/keychainPassiveArchitecture.test.ts \
            src/googleProjectDiagnostics.test.ts
          npx tsc --noEmit
          npm run build
