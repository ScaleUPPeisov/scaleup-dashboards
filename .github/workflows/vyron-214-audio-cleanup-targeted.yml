name: VYRON 2.1.4 Audio Cleanup Targeted Gate
on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths:
      - '.github/workflows/vyron-214-audio-cleanup-targeted.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34742843406'
  BASE_ARTIFACT: VYRON-2.1.4-combined-green-source
  BASE_SHA: 04404094dfb2511d84e2cb8160c1278f9001919477e47abaa36747aacd018529
jobs:
  followup:
    runs-on: macos-14
    timeout-minutes: 70
    env:
      GH_TOKEN: '${{ github.token }}'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore exact combined green and apply real-Mac follow-up
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base work before frozen build out evidence
          mkdir -p base work before frozen build out evidence
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-combined-source.tar.gz
          ACTUAL=$(shasum -a 256 "$T" | awk '{print $1}')
          printf 'BASE_RUN=%s\nBASE_SOURCE_SHA256=%s\n' "$BASE_RUN" "$ACTUAL" | tee evidence/base-source.txt
          test "$ACTUAL" = "$BASE_SHA"
          tar -xzf "$T" -C work
          cp -R work/. before/
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-audio-cleanup/shorts | tee evidence/shorts-overlay.txt
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-audio-cleanup/cleanup | tee evidence/cleanup-overlay.txt
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-audio-cleanup/testfix | tee evidence/testfix-overlay.txt
          test ! -e work/src/v214RealMacFollowup.test.ts
          cp .github/patches/v214-audio-cleanup/tests/v214RealMacFollowup.test.ts work/src/v214RealMacFollowup.test.ts
          test "$(shasum -a 256 work/src/v214RealMacFollowup.test.ts | awk '{print $1}')" = 'db25a90636d7d913e23878a2796bc8c57b595e72692e2ac707e332bb93597adc'
          { shasum -a 256 .github/patches/v214-audio-cleanup/shorts/manifest.json; shasum -a 256 .github/patches/v214-audio-cleanup/cleanup/manifest.json; shasum -a 256 .github/patches/v214-audio-cleanup/testfix/manifest.json; shasum -a 256 .github/patches/v214-audio-cleanup/tests/v214RealMacFollowup.test.ts; } | tee evidence/followup-payload-sha256.txt
          python3 - <<'PY'
          import hashlib,pathlib
          def h(root):
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          a,b=pathlib.Path('before'),pathlib.Path('work'); A,B=h(a),h(b)
          changed=sorted(k for k in set(A)|set(B) if A.get(k)!=B.get(k))
          expected=sorted([
            'src-tauri/src/shorts_factory.rs','src-tauri/src/production_manager.rs',
            'src/ShortsFactory.tsx','src/ProductionManager.tsx','src/ProductionOS.tsx',
            'src/productionManagerApi.ts','src/api.ts','src/storageLifecycle.test.ts',
            'src/v2111ShortsFolder.test.ts','src/v212CleanupCommandRegistration.test.ts',
            'src/v214RealMacFollowup.test.ts'
          ])
          print('\n'.join(changed)); pathlib.Path('evidence/strict-diff-scope.txt').write_text('\n'.join(changed)+'\n')
          assert changed==expected,(changed,expected)
          for protected in ['src-tauri/src/youtube.rs','src-tauri/src/security.rs','src/PublisherOS.tsx','src/youtubeQuota.ts','src/updaterPolicy.ts']:
              assert A.get(protected)==B.get(protected), protected
          shorts=(b/'src-tauri/src/shorts_factory.rs').read_text()
          prod=(b/'src-tauri/src/production_manager.rs').read_text()
          assert 'FFPROBE_NOT_FOUND' in shorts and '/opt/homebrew/bin' in shorts and '/usr/local/bin' in shorts
          assert 'select_audible_audio_stream' in shorts and 'volumedetect' in shorts and 'spawn_blocking' in shorts
          cleanup=prod[prod.index('fn validate_cleanup_candidate'):prod.index('pub fn archive_production_rendered_videos')]
          assert 'verified_jobs' not in cleanup and 'NOT_UPLOADED' not in cleanup
          assert 'validate_render_media' in cleanup and 'CLEANUP_OUTPUT_INSIDE_PROJECT' in cleanup
          PY
      - name: Capture media tools
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -x /opt/homebrew/bin/ffprobe ] || brew install ffmpeg
          {
            command -v ffprobe || true
            command -v ffmpeg || true
            file /opt/homebrew/bin/ffprobe /opt/homebrew/bin/ffmpeg
            /opt/homebrew/bin/ffprobe -version | head -1
            /opt/homebrew/bin/ffmpeg -version | head -1
          } | tee evidence/media-tools.txt
      - name: Targeted Shorts audible-audio and resolver tests
        shell: bash
        working-directory: work/src-tauri
        env:
          VYRON_SHORTS_REAL_TEST: '1'
        run: |
          set -Eeuo pipefail
          : > ../../evidence/shorts-audio-tests.log
          for t in \
            filter_contract \
            folder_scan_accepts_mp4_mov_and_ignores_other_files \
            bundled_candidate_has_priority \
            path_fallback_resolves_executable \
            missing_ffprobe_is_structured \
            finder_like_path_resolves_media_tools_if_enabled \
            real_mp4_audible_if_enabled \
            audible_aac_mov_if_enabled \
            pcm_mov_transcodes_to_audible_aac_if_enabled \
            legacy_hardcoded_audio_zero_can_reproduce_silent_output_if_enabled \
            multiple_tracks_prefers_audible_default_if_enabled \
            seeked_long_video_keeps_audible_music_if_enabled \
            silent_audio_is_rejected_if_enabled \
            real_unicode_mov_probe_and_render_if_enabled
          do
            echo "=== $t ===" | tee -a ../../evidence/shorts-audio-tests.log
            cargo test "$t" --lib -- --nocapture 2>&1 | tee -a ../../evidence/shorts-audio-tests.log
          done
          grep -q 'LEGACY_AUDIO0_MAX_DB=' ../../evidence/shorts-audio-tests.log
          grep -q 'SELECTED_AUDIO_STREAM=' ../../evidence/shorts-audio-tests.log
          grep -q 'SEEK120_OUTPUT_DURATION=' ../../evidence/shorts-audio-tests.log
      - name: Targeted cleanup lifecycle tests
        shell: bash
        working-directory: work/src-tauri
        env:
          VYRON_CLEANUP_REAL_TEST: '1'
        run: |
          set -Eeuo pipefail
          cargo test v214_cleanup_render_gate_tests --lib -- --nocapture 2>&1 | tee ../../evidence/cleanup-tests.log
          grep -Eq '11 passed; 0 failed' ../../evidence/cleanup-tests.log
          ! grep -q 'completed_project_without_verified_upload_is_not_safe_to_clean' src/production_manager.rs
          grep -q 'completed_project_with_valid_render_is_safe_without_upload' src/production_manager.rs
      - name: Keychain targeted safety regression unchanged
        shell: bash
        working-directory: work/src-tauri
        run: |
          set -Eeuo pipefail
          : > ../../evidence/keychain-regression.log
          for t in passive_profile_listing_zero_secret_store_calls selected_profile_hydration_reads_only_selected_secret session_cache_second_access_has_zero_backend_reads post_save_verification_uses_session_cache denial_guard_blocks_retry_loop google_project_diagnostic_is_metadata_only_and_secret_redacted sanitized_state_never_writes_api_secrets_to_disk; do
            cargo test "$t" --lib -- --nocapture 2>&1 | tee -a ../../evidence/keychain-regression.log
          done
          ! grep -n 'security::get_secret(' src/youtube.rs
      - name: Frontend targeted TypeScript production build
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npx vitest run \
            src/v214RealMacFollowup.test.ts \
            src/v2111ShortsFolder.test.ts \
            src/shortsCore.test.ts \
            src/storageLifecycle.test.ts \
            src/v212CleanupCommandRegistration.test.ts \
            src/keychainPassiveArchitecture.test.ts \
            src/googleProjectDiagnostics.test.ts 2>&1 | tee ../evidence/frontend-tests.log
          npx tsc --noEmit 2>&1 | tee ../evidence/typescript.log
          npm run build 2>&1 | tee ../evidence/frontend-build.log
      - name: Freeze new combined 2.1.4 source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p "require('./work/package.json').version")" = '2.1.4'
          test "$(python3 -c "import json;print(json.load(open('work/src-tauri/tauri.conf.json'))['version'])")" = '2.1.4'
          tar --exclude=node_modules --exclude=src-tauri/target -czf frozen/VYRON-2.1.4-audio-cleanup-source.tar.gz -C work .
          shasum -a 256 frozen/VYRON-2.1.4-audio-cleanup-source.tar.gz | tee frozen/SOURCE_SHA256.txt | tee evidence/new-combined-source-sha256.txt
      - name: Build exact frozen ARM64 candidate and Finder-like smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -xzf frozen/VYRON-2.1.4-audio-cleanup-source.tar.gz -C build
          cd build
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP_REL=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name VYRON.app -print -quit)
          test -n "$APP_REL"
          APP="$(pwd)/$APP_REL"
          test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = 2.1.4
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = studio.channelflow.desktop
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          file "$APP/Contents/MacOS/$EXE" | tee ../evidence/app-binary.txt | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee ../evidence/codesign.txt
          trap 'launchctl unsetenv PATH >/dev/null 2>&1 || true; pkill -if "VYRON|channelflow" >/dev/null 2>&1 || true' EXIT
          launchctl setenv PATH '/usr/bin:/bin:/usr/sbin:/sbin'
          open -na "$APP"
          sleep 5
          pgrep -if "$APP/Contents/MacOS/$EXE" >/dev/null
          printf 'Finder-like PATH launch: PASS\n' | tee ../evidence/finder-launch.txt
          launchctl unsetenv PATH || true
          pkill -if "$APP/Contents/MacOS/$EXE" || true
          ditto -c -k --keepParent "$APP" ../out/VYRON-2.1.4-AUDIO-CLEANUP-ARM64-DEV.app.zip
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with: {name: VYRON-2.1.4-audio-cleanup-green-source, path: frozen/, retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: VYRON-2.1.4-audio-cleanup-ARM64-DEV, path: out/VYRON-2.1.4-AUDIO-CLEANUP-ARM64-DEV.app.zip, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: VYRON-2.1.4-audio-cleanup-evidence, path: evidence/, if-no-files-found: warn, retention-days: 30}
