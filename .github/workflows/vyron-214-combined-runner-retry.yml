name: VYRON 2.1.4 Combined Shorts Gate Runner Retry
on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths: ['.github/workflows/vyron-214-combined-runner-retry.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34740865727'
  BASE_ARTIFACT: VYRON-2.1.4-keychain-prompt-fix-green-source
  BASE_SHA: b707ba58a7e9aedbdba9d2a4a8a940668de689ab7aa3e145b3dbdbf207bd14ff
  APPLE_SIGNING_IDENTITY: '-'
jobs:
  retry-combined:
    runs-on: macos-14
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Execute exact combined gate run blocks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import os, pathlib, subprocess
          p=pathlib.Path('.github/workflows/vyron-214-combined-fast.yml')
          lines=p.read_text().splitlines()
          wanted=[
            'Restore exact Keychain green and apply Shorts overlays',
            'Prove old Finder PATH ENOENT and capture tools',
            'Targeted Shorts real-media tests',
            'Keychain targeted safety regression',
            'Frontend targeted TypeScript build',
            'Freeze combined 2.1.4 source',
            'Build exact frozen ARM64 candidate and Finder-like launch smoke',
          ]
          cwd={
            'Targeted Shorts real-media tests':'work/src-tauri',
            'Keychain targeted safety regression':'work/src-tauri',
            'Frontend targeted TypeScript build':'work',
          }
          blocks={}
          for i,line in enumerate(lines):
            if line.startswith('      - name: '):
              name=line.split(': ',1)[1]
              if name not in wanted: continue
              run_i=next(j for j in range(i+1,min(len(lines),i+12)) if lines[j]=='        run: |')
              block=[]; j=run_i+1
              while j<len(lines) and (not lines[j] or lines[j].startswith('          ')):
                block.append(lines[j][10:] if lines[j].startswith('          ') else '')
                j+=1
              blocks[name]='\n'.join(block)
          assert list(blocks)==wanted,(list(blocks),wanted)
          base=os.environ.copy()
          for name in wanted:
            env=base.copy()
            if name=='Targeted Shorts real-media tests': env['VYRON_SHORTS_REAL_TEST']='1'
            print(f'::group::{name}',flush=True)
            subprocess.run(['bash','-c','set -Eeuo pipefail\n'+blocks[name]],cwd=cwd.get(name,'.'),env=env,check=True)
            print('::endgroup::',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.4-combined-green-source
          path: frozen/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.4-combined-ARM64-DEV
          path: out/VYRON-2.1.4-COMBINED-ARM64-DEV.app.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-2.1.4-combined-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
