name: VYRON 2.1.4 Final Green + Source Freeze + ARM64 RC NO PUBLISH

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths:
      - '.github/workflows/vyron-214-final-green-rc.yml'
      - '.github/patches/v214-keychain-test-isolation/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-214-final-green-rc
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34754240596'
  BASE_ARTIFACT: VYRON-2.1.4-remote-updater-green-source
  BASE_SHA: b8d69d342ac3b42ec018e292a335651fdc3288acd0beb829136571959342ef60
  OVERLAY_DIR: .github/patches/v214-content-runway-z2
  OVERLAY_PATCH_SHA: e9554868011cbc32ee02a48d0a1f3cd43944b3edd67b6c2ef84374d2c17d4393
  OVERLAY_MANIFEST_SHA: 1f62ec33cb4668f811b9c25e691d3f6fe146c30e3df30130c595115ef0f1e291
  CLEANUP_TESTFIX_PATH: .github/patches/v214-final-testfix/v2111GlobalCleanup.test.ts
  CLEANUP_TESTFIX_SHA: 32628fe94a1ce24f0b1cf731db9f89ecce789943a76ba8fa907c770d073a5ebe
  KEYCHAIN_PATCH: .github/patches/v214-keychain-test-isolation/security-test-isolation.patch
  KEYCHAIN_PATCH_SHA: 8cbdfc3e52ffd863ae079dce394f9c0d2bf679d72543a3f6ee1e088fa8b56f00
  KEYCHAIN_SECURITY_BASE_SHA: 3a5a988e1985bf1ed5be4998aad4e104f729f74cab185ae394ca4e5beb56b2c0
  KEYCHAIN_SECURITY_FIXED_SHA: 99e920e14f2405ef7dcb15f8489a0a7524e3874a1df5f64fade3de95d11c4380
  RECOVERY_SHA: 7a7eda30cea453c93565ef8beb38d064e4c91ed9

jobs:
  final-regression-freeze:
    name: Final regression + code freeze + deterministic source freeze
    runs-on: macos-14
    timeout-minutes: 120
    env:
      GH_TOKEN: '${{ github.token }}'
      VYRON_TEST_REAL_FFMPEG: '1'
      VYRON_SHORTS_REAL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recovery ref and stable branch safety
        shell: bash
        run: |
          set -Eeuo pipefail
          RECOVERY_ACTUAL=$(git ls-remote origin refs/heads/backup/vyron-214-updater-green-before-content-runway | awk '{print $1}')
          printf 'RECOVERY_REF_SHA=%s\nEXPECTED=%s\n' "$RECOVERY_ACTUAL" "$RECOVERY_SHA" | tee recovery-ref.txt
          test "$RECOVERY_ACTUAL" = "$RECOVERY_SHA"

      - name: Restore exact source and apply verified release overlays
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base work before frozen evidence deterministic-check
          mkdir -p base work before frozen evidence deterministic-check
          mv recovery-ref.txt evidence/recovery-ref.txt
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-remote-updater-source.tar.gz
          ACTUAL=$(shasum -a 256 "$T" | awk '{print $1}')
          printf 'BASE_RUN=%s\nBASE_SOURCE_SHA256=%s\n' "$BASE_RUN" "$ACTUAL" | tee evidence/base-source.txt
          test "$ACTUAL" = "$BASE_SHA"
          tar -xzf "$T" -C work
          cp -R work/. before/

          MANIFEST_ACTUAL=$(shasum -a 256 "$OVERLAY_DIR/manifest.json" | awk '{print $1}')
          test "$MANIFEST_ACTUAL" = "$OVERLAY_MANIFEST_SHA"
          python3 .github/scripts/apply_v214_overlay_chunks.py work "$OVERLAY_DIR" | tee evidence/content-runway-overlay.txt
          python3 - <<'PY' | tee evidence/content-runway-scope.txt
          import hashlib,json,pathlib,os
          a,b=pathlib.Path('before'),pathlib.Path('work'); m=json.loads((pathlib.Path(os.environ['OVERLAY_DIR'])/'manifest.json').read_text())
          assert m['base_source_sha256']==os.environ['BASE_SHA']; assert m['patch_sha256']==os.environ['OVERLAY_PATCH_SHA']
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          def tree(root): return {str(p.relative_to(root)):sha(p) for p in root.rglob('*') if p.is_file()}
          A,B=tree(a),tree(b); changed=sorted(k for k in set(A)|set(B) if A.get(k)!=B.get(k)); expected=sorted(x['path'] for x in m['files'])
          assert changed==expected,(changed,expected)
          for item in m['files']: assert sha(b/item['path'])==item['after_sha256'],item['path']
          protected=['src/updaterRuntime.ts','src/updaterGuard.ts','src/updaterPolicy.ts','src/updaterStore.ts','src/ScheduleOS.tsx','src/scheduleOnly.ts','src/ShortsFactory.tsx','src/ProductionManager.tsx','src-tauri/src/security.rs','src-tauri/src/youtube.rs','src-tauri/src/shorts_factory.rs','src-tauri/src/production_manager.rs','src-tauri/tauri.conf.json']
          for rel in protected: assert A.get(rel)==B.get(rel),rel
          print('STRICT CONTENT RUNWAY SCOPE: PASS'); print('PROTECTED RUNTIME MODULES UNCHANGED BY CONTENT RUNWAY: PASS')
          PY

          CLEANUP_ACTUAL=$(shasum -a 256 "$CLEANUP_TESTFIX_PATH" | awk '{print $1}')
          test "$CLEANUP_ACTUAL" = "$CLEANUP_TESTFIX_SHA"
          cp "$CLEANUP_TESTFIX_PATH" work/src/v2111GlobalCleanup.test.ts
          test "$(shasum -a 256 work/src/v2111GlobalCleanup.test.ts | awk '{print $1}')" = "$CLEANUP_TESTFIX_SHA"

          SECURITY_BASE_ACTUAL=$(shasum -a 256 work/src-tauri/src/security.rs | awk '{print $1}')
          KEYCHAIN_PATCH_ACTUAL=$(shasum -a 256 "$KEYCHAIN_PATCH" | awk '{print $1}')
          test "$SECURITY_BASE_ACTUAL" = "$KEYCHAIN_SECURITY_BASE_SHA"
          test "$KEYCHAIN_PATCH_ACTUAL" = "$KEYCHAIN_PATCH_SHA"
          patch -p1 -d work < "$KEYCHAIN_PATCH"
          SECURITY_FIXED_ACTUAL=$(shasum -a 256 work/src-tauri/src/security.rs | awk '{print $1}')
          test "$SECURITY_FIXED_ACTUAL" = "$KEYCHAIN_SECURITY_FIXED_SHA"
          python3 - <<'PY' | tee evidence/keychain-test-isolation.txt
          from pathlib import Path
          before=Path('before/src-tauri/src/security.rs').read_text(); after=Path('work/src-tauri/src/security.rs').read_text()
          marker='#[cfg(test)]\nmod tests{'; tail='\n\n\n#[derive(Debug,Clone,serde::Serialize,PartialEq,Eq)]'
          bp,br=before.split(marker,1); bt,bs=br.split(tail,1)
          ap,ar=after.split(marker,1); at,a_s=ar.split(tail,1)
          assert bp==ap and bs==a_s
          assert 'KEYCHAIN_TEST_STATE_LOCK' in at and 'reset_keychain_test_state' in at
          assert 'KEYCHAIN_ACCESS_BLOCKED.store(false,Ordering::SeqCst)' in at
          print('ROOT_CAUSE=PARALLEL_TEST_GLOBAL_KEYCHAIN_DENIAL_STATE_CONTAMINATION')
          print('PRODUCTION_KEYCHAIN_CODE_CHANGED=NO')
          print('TEST_ONLY_ISOLATION_GUARD=PASS')
          PY

      - name: Version, updater, quota and stable-feed contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee evidence/static-contracts.txt
          import json,pathlib,re
          r=pathlib.Path('work'); pkg=json.loads((r/'package.json').read_text()); conf=json.loads((r/'src-tauri/tauri.conf.json').read_text()); cargo=(r/'src-tauri/Cargo.toml').read_text()
          assert pkg['version']=='2.1.4'; assert conf['version']=='2.1.4'; assert conf['identifier']=='studio.channelflow.desktop'; assert re.search(r'(?m)^version\s*=\s*"2\.1\.4"\s*$',cargo)
          assert conf['build']['frontendDist']=='../dist'; assert conf['build']['beforeBuildCommand']=='npm run build'
          assert conf['plugins']['updater']['pubkey']; assert len(conf['plugins']['updater']['endpoints'])==2
          core=(r/'src/contentRunway.ts').read_text(); ui=(r/'src/ChannelRunway.tsx').read_text(); runtime=(r/'src/updaterRuntime.ts').read_text(); joined='\n'.join([runtime,(r/'src/updaterGuard.ts').read_text(),(r/'src/updaterPolicy.ts').read_text(),(r/'src/App.tsx').read_text(),(r/'src/SettingsOS.tsx').read_text(),(r/'src/main.tsx').read_text()])
          assert 'buildContentRunway' in ui; assert 'publisherKrasnoyarskIso' in core and 'patternFor' in core and 'intervalDaysFor' in core; assert 'General API' in ui and 'Video Upload' in ui; assert 'videos.insert' not in core.lower()
          for token in ['UPDATER_SIGNATURE_INVALID','UPDATER_MANIFEST_FETCH_FAILED','UPDATER_ARCHIVE_DOWNLOAD_FAILED','UPDATER_INSTALL_FAILED']: assert token in joined
          assert 'security::get_secret' not in joined
          print('VERSION/BUNDLE/PRODUCTION FRONTEND CONTRACT: PASS'); print('CONTENT RUNWAY / QUOTA SEPARATION: PASS'); print('UPDATER CONFIG/SECURITY CONTRACTS: PASS')
          PY
          git fetch origin main --depth=1
          git show origin/main:vyron-updates/latest.json > evidence/stable-latest.json
          python3 - <<'PY' | tee evidence/stable-feed.txt
          import json
          d=json.load(open('evidence/stable-latest.json')); assert d['version']=='2.1.3',d['version']; p=d['platforms']['darwin-aarch64']; assert '/releases/download/v2.1.3/' in p['url']; assert p.get('signature')
          print('STABLE_VERSION=2.1.3'); print('LATEST_JSON_CHANGED=NO'); print('STABLE_SIGNATURE_PRESENT=PASS'); print('2.1.4_STABLE_ACTIVATED=NO')
          PY

      - name: Install dependencies and real media tools
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
          { command -v ffmpeg; command -v ffprobe; ffmpeg -version | head -1; ffprobe -version | head -1; } | tee ../evidence/media-tools.txt

      - name: Full frontend regression, TypeScript and production build
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run 2>&1 | tee ../evidence/frontend-tests.log
          npx tsc --noEmit --pretty false 2>&1 | tee ../evidence/typescript.log
          npm run build 2>&1 | tee ../evidence/frontend-build.log

      - name: Critical frontend regression evidence without duplicate reruns
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee evidence/critical-frontend-summary.txt
          from pathlib import Path
          log=Path('evidence/frontend-tests.log').read_text()
          groups={
            'CONTENT_RUNWAY':['src/contentRunway.test.ts','src/channelRunway.test.ts'],
            'SCHEDULE':['src/channelSchedule.test.ts','src/publisherSchedule.test.ts','src/scheduleContinuation.test.ts','src/scheduleOnly.test.ts'],
            'UPDATER':['src/updaterGuard.test.ts','src/updaterRuntime.test.ts','src/updaterRemoteContract.test.ts','src/updaterHotfix.test.ts','src/updaterPolicy.test.ts'],
            'QUOTA':['src/dynamicUploadQuota.test.ts','src/publisherQuota.test.ts','src/youtubeQuota.test.ts','src/youtubeQuotaPlanner.test.ts','src/youtubeQuotaRollover.test.ts'],
            'UPLOAD':['src/uploadButtonUnblock.test.ts','src/v2100PublishRecovery.test.ts','src/v2111PublisherRuntime.test.ts','src/youtubePublishSafety.test.ts'],
            'STORAGE':['src/storageLifecycle.test.ts','src/v2100StorageArchive.test.ts','src/v2111GlobalCleanup.test.ts']}
          for name,files in groups.items():
              missing=[f for f in files if f not in log]; assert not missing,(name,missing); print(f'{name}=PASS')
          assert '344 passed' in log
          print('FULL_FRONTEND=344/344 PASS')
          PY

      - name: Targeted Keychain isolation then full Rust regression and ARM64 compile gate
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib security::tests::session_cache_second_access_has_zero_backend_reads -- --exact --nocapture 2>&1 | tee ../evidence/keychain-targeted.log
          grep -F 'SESSION_CACHE_BACKEND_READS=1' ../evidence/keychain-targeted.log
          cargo test --manifest-path src-tauri/Cargo.toml --lib security::tests:: -- --nocapture 2>&1 | tee ../evidence/keychain-security-scope.log
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee ../evidence/rust-tests.log
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin 2>&1 | tee ../evidence/rust-arm64-check.log
          printf 'KEYCHAIN_TARGETED=PASS\nKEYCHAIN_SECURITY_SCOPE=PASS\nFULL_RUST=PASS\nARM64_CARGO_CHECK=PASS\n' | tee ../evidence/rust-summary.txt

      - name: Deterministic release-source freeze after final green
        shell: bash
        run: |
          set -Eeuo pipefail
          GIT_TREE=$(git show -s --format=%T "$GITHUB_SHA"); export GIT_TREE
          python3 - <<'PY'
          import gzip,hashlib,os,pathlib,tarfile
          root=pathlib.Path('work'); outdir=pathlib.Path('frozen'); outdir.mkdir(exist_ok=True)
          def build(out):
              with open(out,'wb') as raw:
                  with gzip.GzipFile(filename='',mode='wb',fileobj=raw,mtime=0) as gz:
                      with tarfile.open(fileobj=gz,mode='w',format=tarfile.PAX_FORMAT) as tf:
                          for p in sorted(root.rglob('*'),key=lambda p:str(p.relative_to(root))):
                              rel=p.relative_to(root)
                              if any(part in {'node_modules','target'} for part in rel.parts): continue
                              ti=tf.gettarinfo(str(p),arcname='./'+str(rel)); ti.uid=0; ti.gid=0; ti.uname=''; ti.gname=''; ti.mtime=0
                              if ti.isfile():
                                  with open(p,'rb') as f: tf.addfile(ti,f)
                              else: tf.addfile(ti)
          a=outdir/'VYRON-2.1.4-final-source.tar.gz'; b=pathlib.Path('deterministic-check/VYRON-2.1.4-final-source.tar.gz'); build(a); build(b)
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest(); ha,hb=sha(a),sha(b); assert ha==hb,(ha,hb); assert ha!=os.environ['BASE_SHA']
          (outdir/'SOURCE_SHA256.txt').write_text(f'{ha}  VYRON-2.1.4-final-source.tar.gz\n')
          (outdir/'SOURCE_METADATA.txt').write_text(f'REPOSITORY={os.environ["GITHUB_REPOSITORY"]}\nBRANCH={os.environ["GITHUB_REF_NAME"]}\nHEAD={os.environ["GITHUB_SHA"]}\nGIT_TREE={os.environ["GIT_TREE"]}\nBASE_SOURCE_SHA256={os.environ["BASE_SHA"]}\n')
          pathlib.Path('evidence/source-freeze.txt').write_text(f'SOURCE_SHA256={ha}\nSECOND_BUILD_SHA256={hb}\nDETERMINISTIC_MATCH=PASS\nCODE_FREEZE=YES\nHEAD={os.environ["GITHUB_SHA"]}\nGIT_TREE={os.environ["GIT_TREE"]}\nOLD_UPDATER_BASELINE_REUSED=NO\n')
          print('FINAL_SOURCE_SHA256='+ha); print('DETERMINISTIC_SECOND_BUILD=MATCH'); print('CODE_FREEZE=YES')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.4-final-source
          path: frozen/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-2.1.4-final-regression-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  arm64-release-candidate:
    name: Verified frozen source -> ARM64 RC + codesign + Finder smoke
    needs: final-regression-freeze
    runs-on: macos-14
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-2.1.4-final-source
          path: frozen

      - name: Independent source artifact SHA verification
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED=$(awk '{print $1}' frozen/SOURCE_SHA256.txt)
          ACTUAL=$(shasum -a 256 frozen/VYRON-2.1.4-final-source.tar.gz | awk '{print $1}')
          printf 'EXPECTED_SOURCE_SHA256=%s\nACTUAL_SOURCE_SHA256=%s\n' "$EXPECTED" "$ACTUAL" | tee source-roundtrip.txt
          test "$EXPECTED" = "$ACTUAL"; test "$ACTUAL" != "$BASE_SHA"
          grep -Fx "REPOSITORY=$GITHUB_REPOSITORY" frozen/SOURCE_METADATA.txt
          grep -Fx "BRANCH=$GITHUB_REF_NAME" frozen/SOURCE_METADATA.txt
          grep -Fx "HEAD=$GITHUB_SHA" frozen/SOURCE_METADATA.txt
          printf 'SOURCE_SHA_VERIFY=MATCH\n' | tee -a source-roundtrip.txt

      - name: Build and verify exact frozen ARM64 release candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build out evidence-rc; mkdir -p build out evidence-rc
          tar -xzf frozen/VYRON-2.1.4-final-source.tar.gz -C build
          cd build
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee ../evidence-rc/tauri-arm64-build.log
          APP_REL=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name VYRON.app -print -quit); test -n "$APP_REL"
          APP="$(pwd)/$APP_REL"; test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = 2.1.4
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = studio.channelflow.desktop
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist"); test "$EXE" = channelflow; test -x "$APP/Contents/MacOS/$EXE"
          file "$APP/Contents/MacOS/$EXE" | tee ../evidence-rc/app-binary.txt | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee ../evidence-rc/codesign.txt
          codesign -dr - "$APP" 2>&1 | tee ../evidence-rc/designated-requirement.txt
          python3 - <<'PY' | tee ../evidence-rc/packaged-contracts.txt
          import json,pathlib
          c=json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())
          assert c['version']=='2.1.4'; assert c['identifier']=='studio.channelflow.desktop'; assert c['build']['frontendDist']=='../dist'; assert c['plugins']['updater']['pubkey']; assert c['plugins']['updater']['endpoints']
          print('PACKAGED_SOURCE_CONFIG=PASS'); print('UPDATER_CONFIG_PRESENT=PASS')
          PY
          test -d "$APP/Contents/Resources"; test -f dist/index.html
          if grep -R --binary-files=without-match -nE 'http://localhost:1421|127\.0\.0\.1:1421' "$APP/Contents/Resources" > ../evidence-rc/dev-url-scan.txt; then echo 'PACKAGED_DEV_URL_FOUND'; cat ../evidence-rc/dev-url-scan.txt; exit 1; else echo 'PACKAGED_RESOURCES_DEV_URL_SCAN=PASS' | tee ../evidence-rc/dev-url-scan.txt; fi
          trap 'launchctl unsetenv PATH >/dev/null 2>&1 || true; pkill -if "VYRON|channelflow" >/dev/null 2>&1 || true' EXIT
          launchctl setenv PATH '/usr/bin:/bin:/usr/sbin:/sbin'
          open -na "$APP"; sleep 6; pgrep -if "$APP/Contents/MacOS/$EXE" >/dev/null
          printf 'FINDER_LIKE_MINIMAL_PATH_LAUNCH=PASS\n' | tee ../evidence-rc/finder-launch.txt
          launchctl unsetenv PATH || true; pkill -if "$APP/Contents/MacOS/$EXE" || true
          ditto -c -k --keepParent "$APP" ../out/VYRON-2.1.4-ARM64-RC.app.zip
          shasum -a 256 ../out/VYRON-2.1.4-ARM64-RC.app.zip | tee ../evidence-rc/app-zip-sha256.txt
          printf 'VERSION=2.1.4\nBUNDLE_ID=studio.channelflow.desktop\nEXECUTABLE=channelflow\nARCH=arm64\nCODESIGN=PASS\nSIGNING_MODE=AD_HOC\nNOTARIZATION=NOT_PERFORMED\nFINDER_LIKE_LAUNCH=PASS\n' | tee ../evidence-rc/rc-contract.txt
          trap - EXIT

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.4-ARM64-RC
          path: out/VYRON-2.1.4-ARM64-RC.app.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-2.1.4-ARM64-RC-evidence
          path: |
            source-roundtrip.txt
            evidence-rc/
          if-no-files-found: warn
          retention-days: 30
