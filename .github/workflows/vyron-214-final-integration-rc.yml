name: VYRON 2.1.4 Final Integration + ARM64 RC NO PUBLISH

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths:
      - '.github/workflows/vyron-214-final-integration-rc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-214-final-integration-rc
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34754240596'
  BASE_ARTIFACT: VYRON-2.1.4-remote-updater-green-source
  BASE_SHA: b8d69d342ac3b42ec018e292a335651fdc3288acd0beb829136571959342ef60
  OVERLAY_DIR: .github/patches/v214-content-runway-z2
  OVERLAY_PATCH_SHA: e9554868011cbc32ee02a48d0a1f3cd43944b3edd67b6c2ef84374d2c17d4393
  OVERLAY_MANIFEST_SHA: 1f62ec33cb4668f811b9c25e691d3f6fe146c30e3df30130c595115ef0f1e291

jobs:
  final-regression-freeze:
    name: Final full regression + deterministic source freeze
    runs-on: macos-14
    timeout-minutes: 120
    env:
      GH_TOKEN: '${{ github.token }}'
      VYRON_TEST_REAL_FFMPEG: '1'
      VYRON_SHORTS_REAL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact updater-green source and apply verified Content Runway overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base work before frozen evidence deterministic-check
          mkdir -p base work before frozen evidence deterministic-check
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-remote-updater-source.tar.gz
          ACTUAL=$(shasum -a 256 "$T" | awk '{print $1}')
          printf 'BASE_RUN=%s\nBASE_SOURCE_SHA256=%s\n' "$BASE_RUN" "$ACTUAL" | tee evidence/base-source.txt
          test "$ACTUAL" = "$BASE_SHA"
          tar -xzf "$T" -C work
          cp -R work/. before/

          MANIFEST_ACTUAL=$(shasum -a 256 "$OVERLAY_DIR/manifest.json" | awk '{print $1}')
          printf 'CONTENT_RUNWAY_MANIFEST_SHA256=%s\n' "$MANIFEST_ACTUAL" | tee evidence/content-runway-manifest.txt
          test "$MANIFEST_ACTUAL" = "$OVERLAY_MANIFEST_SHA"

          python3 .github/scripts/apply_v214_overlay_chunks.py work "$OVERLAY_DIR" | tee evidence/content-runway-overlay.txt

          python3 - <<'PY' | tee evidence/content-runway-scope.txt
          import hashlib,json,pathlib,os
          a,b=pathlib.Path('before'),pathlib.Path('work')
          m=json.loads((pathlib.Path(os.environ['OVERLAY_DIR'])/'manifest.json').read_text())
          assert m['base_source_sha256']==os.environ['BASE_SHA']
          assert m['patch_sha256']==os.environ['OVERLAY_PATCH_SHA']
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def tree(root): return {str(p.relative_to(root)):sha(p) for p in root.rglob('*') if p.is_file()}
          A,B=tree(a),tree(b)
          changed=sorted(k for k in set(A)|set(B) if A.get(k)!=B.get(k))
          expected=sorted(x['path'] for x in m['files'])
          print('CHANGED FILES:')
          print('\n'.join(changed))
          assert changed==expected,(changed,expected)
          for item in m['files']:
              assert sha(b/item['path'])==item['after_sha256'],item['path']
          protected=[
            'src/updaterRuntime.ts','src/updaterGuard.ts','src/updaterPolicy.ts','src/updaterStore.ts',
            'src/ScheduleOS.tsx','src/scheduleOnly.ts','src/ShortsFactory.tsx','src/ProductionManager.tsx',
            'src-tauri/src/security.rs','src-tauri/src/youtube.rs','src-tauri/src/shorts_factory.rs','src-tauri/src/production_manager.rs',
            'src-tauri/tauri.conf.json'
          ]
          for rel in protected: assert A.get(rel)==B.get(rel),rel
          print('STRICT 4-FILE CONTENT RUNWAY SCOPE: PASS')
          print('PROTECTED RUNTIME MODULES UNCHANGED: PASS')
          PY

      - name: Version, updater, quota and stable-feed contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee evidence/static-contracts.txt
          import json,pathlib,re
          r=pathlib.Path('work')
          pkg=json.loads((r/'package.json').read_text())
          conf=json.loads((r/'src-tauri/tauri.conf.json').read_text())
          cargo=(r/'src-tauri/Cargo.toml').read_text()
          assert pkg['version']=='2.1.4'
          assert conf['version']=='2.1.4'
          assert conf['identifier']=='studio.channelflow.desktop'
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.4"\s*$',cargo)
          core=(r/'src/contentRunway.ts').read_text()
          ui=(r/'src/ChannelRunway.tsx').read_text()
          policy=(r/'src/updaterPolicy.ts').read_text()
          runtime=(r/'src/updaterRuntime.ts').read_text()
          joined='\n'.join([policy,runtime,(r/'src/updaterGuard.ts').read_text(),(r/'src/App.tsx').read_text(),(r/'src/SettingsOS.tsx').read_text(),(r/'src/main.tsx').read_text()])
          assert 'buildContentRunway' in ui
          assert 'publisherKrasnoyarskIso' in core and 'patternFor' in core and 'intervalDaysFor' in core
          assert 'General API' in ui and 'Video Upload' in ui
          assert 'videos.insert' not in core.lower()
          assert 'raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json' in policy
          assert 'releases/latest/download/latest.json' in policy
          assert 'UPDATER_SIGNATURE_INVALID' in joined
          assert 'UPDATER_MANIFEST_FETCH_FAILED' in joined
          assert 'UPDATER_ARCHIVE_DOWNLOAD_FAILED' in joined
          assert 'UPDATER_INSTALL_FAILED' in joined
          assert 'videos.insert' not in runtime.lower()
          assert 'youtube_update_existing_schedule' not in runtime
          assert 'security::get_secret' not in joined
          print('VERSION/BUNDLE CONTRACT: PASS')
          print('CONTENT RUNWAY / SEPARATED QUOTA CONTRACT: PASS')
          print('UPDATER ENDPOINT/ERROR/ISOLATION CONTRACTS: PASS')
          PY

          git fetch origin main --depth=1
          git show origin/main:vyron-updates/latest.json > evidence/stable-latest.json
          python3 - <<'PY' | tee evidence/stable-feed.txt
          import json
          d=json.load(open('evidence/stable-latest.json'))
          assert d['version']=='2.1.3',d['version']
          p=d['platforms']['darwin-aarch64']
          assert '/releases/download/v2.1.3/' in p['url']
          assert p.get('signature')
          print('STABLE VERSION: 2.1.3')
          print('STABLE SIGNATURE PRESENT: PASS')
          print('2.1.4 STABLE ACTIVATION: NO')
          PY

      - name: Install dependencies and real media tools
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
          { command -v ffmpeg; command -v ffprobe; ffmpeg -version | head -1; ffprobe -version | head -1; } | tee ../evidence/media-tools.txt

      - name: Full frontend regression
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          npx vitest run 2>&1 | tee ../evidence/frontend-tests.log
          npx tsc --noEmit --pretty false 2>&1 | tee ../evidence/typescript.log
          npm run build 2>&1 | tee ../evidence/frontend-build.log

      - name: Full Rust regression and ARM64 compile gate
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee ../evidence/rust-tests.log
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin 2>&1 | tee ../evidence/rust-arm64-check.log
          printf 'FULL RUST + ARM64 CHECK: PASS\n' | tee ../evidence/rust-summary.txt

      - name: Explicit critical regression groups
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          npx vitest run \
            src/contentRunway.test.ts \
            src/channelRunway.test.ts \
            src/channelSchedule.test.ts \
            src/publisherSchedule.test.ts \
            src/scheduleContinuation.test.ts \
            src/scheduleOnly.test.ts \
            src/scheduleOnlyContracts.test.ts \
            src/updaterGuard.test.ts \
            src/updaterRuntime.test.ts \
            src/updaterRemoteContract.test.ts \
            src/updaterHotfix.test.ts \
            src/updaterPolicy.test.ts \
            src/dynamicUploadQuota.test.ts \
            src/publisherQuota.test.ts \
            src/youtubeQuota.test.ts \
            src/youtubeQuotaPlanner.test.ts \
            src/youtubeQuotaRollover.test.ts \
            src/storageLifecycle.test.ts \
            src/uploadButtonUnblock.test.ts \
            src/v2100StorageArchive.test.ts \
            src/v2100PublishRecovery.test.ts \
            src/v2111PublisherRuntime.test.ts \
            src/youtubePublishSafety.test.ts 2>&1 | tee ../evidence/critical-regression-groups.log
          printf 'SCHEDULE/UPDATER/UPLOAD/STORAGE/DUPLICATE/QUOTA CRITICAL GROUPS: PASS\n' | tee ../evidence/critical-summary.txt

      - name: Deterministic release-source freeze
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import gzip,hashlib,os,pathlib,tarfile
          root=pathlib.Path('work')
          outdir=pathlib.Path('frozen'); outdir.mkdir(exist_ok=True)
          def build(out):
              with open(out,'wb') as raw:
                  with gzip.GzipFile(filename='',mode='wb',fileobj=raw,mtime=0) as gz:
                      with tarfile.open(fileobj=gz,mode='w',format=tarfile.PAX_FORMAT) as tf:
                          paths=sorted(root.rglob('*'),key=lambda p:str(p.relative_to(root)))
                          for p in paths:
                              rel=p.relative_to(root)
                              if any(part in {'node_modules','target'} for part in rel.parts):
                                  continue
                              ti=tf.gettarinfo(str(p),arcname='./'+str(rel))
                              ti.uid=0; ti.gid=0; ti.uname=''; ti.gname=''; ti.mtime=0
                              if ti.isfile():
                                  with open(p,'rb') as f: tf.addfile(ti,f)
                              else:
                                  tf.addfile(ti)
          a=outdir/'VYRON-2.1.4-final-source.tar.gz'
          b=pathlib.Path('deterministic-check/VYRON-2.1.4-final-source.tar.gz')
          build(a); build(b)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          ha,hb=sha(a),sha(b)
          assert ha==hb,(ha,hb)
          (outdir/'SOURCE_SHA256.txt').write_text(f'{ha}  VYRON-2.1.4-final-source.tar.gz\n')
          pathlib.Path('evidence/source-freeze.txt').write_text(f'SOURCE_SHA256={ha}\nSECOND_BUILD_SHA256={hb}\nDETERMINISTIC_MATCH=PASS\n')
          print('FINAL_SOURCE_SHA256='+ha)
          print('DETERMINISTIC SECOND BUILD: MATCH')
          PY
          cat frozen/SOURCE_SHA256.txt | tee -a evidence/source-freeze.txt
          test "$(awk '{print $1}' frozen/SOURCE_SHA256.txt)" != "$BASE_SHA"
          printf 'OLD UPDATER-GREEN SHA REUSED: NO\n' | tee -a evidence/source-freeze.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.4-final-source
          path: frozen/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-2.1.4-final-regression-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  arm64-release-candidate:
    name: Exact frozen source -> ARM64 RC + Finder smoke
    needs: final-regression-freeze
    runs-on: macos-14
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: VYRON-2.1.4-final-source
          path: frozen

      - name: Independent artifact round-trip SHA verification
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED=$(awk '{print $1}' frozen/SOURCE_SHA256.txt)
          ACTUAL=$(shasum -a 256 frozen/VYRON-2.1.4-final-source.tar.gz | awk '{print $1}')
          printf 'EXPECTED_SOURCE_SHA256=%s\nACTUAL_SOURCE_SHA256=%s\n' "$EXPECTED" "$ACTUAL" | tee source-roundtrip.txt
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" != "$BASE_SHA"
          printf 'INDEPENDENT SOURCE VERIFICATION: MATCH\n' | tee -a source-roundtrip.txt

      - name: Build exact frozen ARM64 release candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build out evidence-rc
          mkdir -p build out evidence-rc
          tar -xzf frozen/VYRON-2.1.4-final-source.tar.gz -C build
          cd build
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee ../evidence-rc/tauri-arm64-build.log
          APP_REL=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name VYRON.app -print -quit)
          test -n "$APP_REL"
          APP="$(pwd)/$APP_REL"
          test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = 2.1.4
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = studio.channelflow.desktop
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          test "$EXE" = channelflow
          file "$APP/Contents/MacOS/$EXE" | tee ../evidence-rc/app-binary.txt | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee ../evidence-rc/codesign.txt
          codesign -dr - "$APP" 2>&1 | tee ../evidence-rc/designated-requirement.txt

          trap 'launchctl unsetenv PATH >/dev/null 2>&1 || true; pkill -if "VYRON|channelflow" >/dev/null 2>&1 || true' EXIT
          launchctl setenv PATH '/usr/bin:/bin:/usr/sbin:/sbin'
          open -na "$APP"
          sleep 6
          pgrep -if "$APP/Contents/MacOS/$EXE" >/dev/null
          printf 'FINDER_LIKE_MINIMAL_PATH_LAUNCH=PASS\n' | tee ../evidence-rc/finder-launch.txt
          launchctl unsetenv PATH || true
          pkill -if "$APP/Contents/MacOS/$EXE" || true

          ditto -c -k --keepParent "$APP" ../out/VYRON-2.1.4-ARM64-RC.app.zip
          shasum -a 256 ../out/VYRON-2.1.4-ARM64-RC.app.zip | tee ../evidence-rc/app-zip-sha256.txt
          printf 'VERSION=2.1.4\nBUNDLE_ID=studio.channelflow.desktop\nEXECUTABLE=channelflow\nARCH=arm64\nCODESIGN=PASS\n' | tee ../evidence-rc/rc-contract.txt
          trap - EXIT

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.4-ARM64-RC
          path: out/VYRON-2.1.4-ARM64-RC.app.zip
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-2.1.4-ARM64-RC-evidence
          path: |
            source-roundtrip.txt
            evidence-rc/
          if-no-files-found: warn
          retention-days: 30
