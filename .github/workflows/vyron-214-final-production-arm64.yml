name: VYRON 2.1.4 Final ARM64 Production + Signed Updater

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths: ['.github/workflows/vyron-214-final-production-arm64.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-214-final-production-arm64
  cancel-in-progress: false

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  FINAL_RUN: '34793876334'
  FINAL_SOURCE_ARTIFACT: VYRON-2.1.4-final-source
  FINAL_SOURCE_SHA256: 24ccb1649d91b090dcc5437c66e18c0ae465528423110efe0c1d392397f6fef1
  FINAL_HEAD: b23b945caa2bf41f22207b8661c9409e69a9ed04
  FINAL_GIT_TREE: 5c1db2e95246d7f96a0ff900a19629c108e57d1d
  VERSION: '2.1.4'
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK
  SAFETY_REF: backup/vyron-214-before-active-channel-canonicalization
  SAFETY_SHA: aad9bd3abc6b01f000d94094fee13f7309c91794
  RECOVERY_REF: backup/vyron-214-updater-green-before-content-runway
  RECOVERY_SHA: 7a7eda30cea453c93565ef8beb38d064e4c91ed9

jobs:
  production:
    name: Exact final freeze -> ARM64 app + DMG + signed updater
    runs-on: macos-14-arm64
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Safety refs and stable feed guard
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p source work production evidence
          test "$(git ls-remote origin refs/heads/$SAFETY_REF | awk '{print $1}')" = "$SAFETY_SHA"
          test "$(git ls-remote origin refs/heads/$RECOVERY_REF | awk '{print $1}')" = "$RECOVERY_SHA"
          git fetch origin main --depth=1
          git show origin/main:vyron-updates/latest.json > evidence/latest-before.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/latest-before.json'))
          assert d['version']=='2.1.3',d['version']
          p=d['platforms']['darwin-aarch64']
          assert '/releases/download/v2.1.3/' in p['url'] and p.get('signature')
          print('STABLE_FEED_BEFORE=2.1.3')
          PY

      - name: Restore and independently verify exact final frozen source
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run download "$FINAL_RUN" --repo "$REPO" -n "$FINAL_SOURCE_ARTIFACT" -D source
          T=source/VYRON-2.1.4-final-source.tar.gz
          test -s "$T" && test -s source/SOURCE_SHA256.txt && test -s source/SOURCE_METADATA.txt
          DECLARED=$(awk '{print $1}' source/SOURCE_SHA256.txt)
          ACTUAL=$(shasum -a 256 "$T" | awk '{print $1}')
          test "$DECLARED" = "$FINAL_SOURCE_SHA256"
          test "$ACTUAL" = "$FINAL_SOURCE_SHA256"
          grep -Fxq "HEAD=$FINAL_HEAD" source/SOURCE_METADATA.txt
          grep -Fxq "GIT_TREE=$FINAL_GIT_TREE" source/SOURCE_METADATA.txt
          tar -xzf "$T" -C work
          python3 - <<'PY'
          import json,re
          pkg=json.load(open('work/package.json')); conf=json.load(open('work/src-tauri/tauri.conf.json')); cargo=open('work/src-tauri/Cargo.toml').read()
          assert pkg['version']=='2.1.4'; assert conf['version']=='2.1.4'; assert conf['identifier']=='studio.channelflow.desktop'
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.4"\s*$',cargo)
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']=='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK'
          print('SOURCE_IDENTITY=PASS')
          print('VERSION_BUNDLE_UPDATER_CONFIG=PASS')
          PY
          printf 'FINAL_HEAD=%s\nFINAL_GIT_TREE=%s\nSOURCE_SHA256=%s\nINDEPENDENT_SOURCE_SHA256=%s\nSOURCE_MATCH=YES\n' "$FINAL_HEAD" "$FINAL_GIT_TREE" "$DECLARED" "$ACTUAL" > evidence/source-identity.txt

      - name: Normalize updater signing material and prove public key unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def b64dec(s):
              try:return base64.b64decode(s.strip(),validate=True).decode()
              except Exception:return None
          def normalize(name,kind):
              raw=os.environ[name].strip()
              if raw.startswith('untrusted comment:'):
                  encoded=base64.b64encode(raw.encode()).decode()
                  box=raw
              else:
                  once=b64dec(raw)
                  if once and once.startswith('untrusted comment:'):
                      encoded=raw; box=once
                  else:
                      twice=b64dec(once) if once else None
                      if twice and twice.startswith('untrusted comment:'):
                          encoded=once.strip(); box=twice
                      else: raise SystemExit(f'{name}: invalid Tauri minisign key encoding')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return encoded,box
          sk,_=normalize('TAURI_SIGNING_PRIVATE_KEY','secret key')
          pk,pkbox=normalize('TAURI_UPDATER_PUBLIC_KEY','public key')
          embedded=os.environ['EMBEDDED_UPDATER_KEY'].strip()
          if pk!=embedded: raise SystemExit('updater public key secret != embedded public key')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TAURI_SIGNING_PRIVATE_KEY='+sk+'\nTAURI_UPDATER_PUBLIC_KEY='+pk+'\n')
          open('evidence/updater-public-key.txt','w').write('PUBLIC_UPDATER_KEY_CHANGED=NO\nPUBLIC_KEY_MATCH=PASS\n')
          open('/tmp/vyron-updater.pub','w').write(pkbox+'\n')
          print('::add-mask::'+sk)
          print('UPDATER_PUBLIC_KEY=PASS')
          PY

      - name: Build exact ARM64 production app DMG and updater
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg 2>&1 | tee ../evidence/tauri-production-build.log

          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          test -x "$APP/Contents/MacOS/$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q 'arm64'
          otool -hv "$APP/Contents/MacOS/$EXECUTABLE" | grep -q 'ARM64'
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -qi 'Signature=adhoc'
          hdiutil verify "$DMG"
          if grep -R -a -E 'localhost:1421|127\.0\.0\.1:1421' "$APP/Contents/Resources"; then echo 'DEV_SERVER_REFERENCE_FOUND'; exit 1; fi

          mkdir -p ../production/VYRON.app-copy
          rm -rf ../production/VYRON.app-copy
          cp -R "$APP" ../production/VYRON.app-copy
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../production/VYRON.app.zip
          cp "$DMG" ../production/VYRON-2.1.4-arm64.dmg
          cp "$UPDATER" ../production/VYRON.app.tar.gz
          cp "$SIG" ../production/VYRON.app.tar.gz.sig
          APP_SHA=$(shasum -a 256 "$APP/Contents/MacOS/$EXECUTABLE" | awk '{print $1}')
          ZIP_SHA=$(shasum -a 256 ../production/VYRON.app.zip | awk '{print $1}')
          DMG_SHA=$(shasum -a 256 ../production/VYRON-2.1.4-arm64.dmg | awk '{print $1}')
          UPDATER_SHA=$(shasum -a 256 ../production/VYRON.app.tar.gz | awk '{print $1}')
          printf '%s  VYRON.app.zip\n' "$ZIP_SHA" > ../production/VYRON.app.zip.sha256
          printf '%s  VYRON-2.1.4-arm64.dmg\n' "$DMG_SHA" > ../production/VYRON-2.1.4-arm64.dmg.sha256
          printf '%s  VYRON.app.tar.gz\n' "$UPDATER_SHA" > ../production/VYRON.app.tar.gz.sha256
          printf 'APP_EXECUTABLE_SHA256=%s\nAPP_ZIP_SHA256=%s\nDMG_SHA256=%s\nUPDATER_SHA256=%s\nVERSION=2.1.4\nBUNDLE_ID=studio.channelflow.desktop\nEXECUTABLE=channelflow\nARCHITECTURE=arm64\nCODESIGN=PASS\nPACKAGED_LOCALHOST_REFERENCE=ABSENT\n' "$APP_SHA" "$ZIP_SHA" "$DMG_SHA" "$UPDATER_SHA" | tee ../evidence/production-build.txt

      - name: Verify exact updater signature with embedded minisign public key
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v minisign >/dev/null; then brew install minisign; fi
          PUB=$(sed -n '2p' /tmp/vyron-updater.pub | tr -d '\r\n')
          test -n "$PUB"
          minisign -Vm production/VYRON.app.tar.gz -x production/VYRON.app.tar.gz.sig -P "$PUB" 2>&1 | tee evidence/updater-signature-verification.txt
          grep -qi 'Signature and comment signature verified' evidence/updater-signature-verification.txt
          echo 'UPDATER_SIGNATURE=VERIFIED' >> evidence/updater-signature-verification.txt

      - name: Verify DMG payload and Finder-like minimal PATH launch
        shell: bash
        run: |
          set -Eeuo pipefail
          MOUNT="$RUNNER_TEMP/vyron214-final-mount"
          rm -rf "$MOUNT"; mkdir -p "$MOUNT"
          hdiutil attach production/VYRON-2.1.4-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          APP="$MOUNT/VYRON.app"
          test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q 'arm64'
          codesign --verify --deep --strict --verbose=2 "$APP"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$APP/Contents/MacOS/$EXECUTABLE" > evidence/finder-launch.log 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then cat evidence/finder-launch.log; exit 1; fi
          kill "$PID" || true
          wait "$PID" || true
          echo 'FINDER_LIKE_MINIMAL_PATH_LAUNCH=PASS' | tee evidence/finder-launch.txt
          hdiutil detach "$MOUNT"
          trap - EXIT

      - name: Final production evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(shasum -a 256 production/VYRON.app.tar.gz | awk '{print $1}')" = "$(awk '{print $1}' production/VYRON.app.tar.gz.sha256)"
          test -s production/VYRON.app.tar.gz.sig
          cat > production/BUILD_SOURCE_IDENTITY.txt <<EOF
          FINAL_HEAD=$FINAL_HEAD
          FINAL_GIT_TREE=$FINAL_GIT_TREE
          SOURCE_SHA256=$FINAL_SOURCE_SHA256
          AUTHORITATIVE_RUN=$FINAL_RUN
          VERSION=$VERSION
          BUNDLE_ID=$BUNDLE_ID
          EXECUTABLE=$EXECUTABLE
          ARCHITECTURE=arm64
          CODESIGN=PASS
          FINDER_LIKE_LAUNCH=PASS
          UPDATER_SIGNATURE=VERIFIED
          PUBLIC_UPDATER_KEY_CHANGED=NO
          EOF
          cp evidence/updater-signature-verification.txt production/UPDATER_SIGNATURE_VERIFICATION.txt
          cp evidence/finder-launch.txt production/FINDER_LAUNCH.txt
          cp evidence/updater-public-key.txt production/UPDATER_PUBLIC_KEY.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.4-ARM64-PRODUCTION
          path: production/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-2.1.4-ARM64-PRODUCTION-EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
