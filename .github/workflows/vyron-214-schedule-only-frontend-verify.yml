name: VYRON 2.1.4 Schedule-Only Frontend Verify
on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths:
      - '.github/workflows/vyron-214-schedule-only-frontend-verify.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34746235915'
  BASE_ARTIFACT: VYRON-2.1.4-audio-cleanup-green-source
  BASE_SHA: 315f7b8cba142d966619f0eb6d14c2b7dc806ad8e6436d13a3ab4f3338fbde12
jobs:
  frontend:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assemble exact Schedule-only source with testfixes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base work
          mkdir -p base work
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-audio-cleanup-source.tar.gz
          test "$(shasum -a 256 "$T" | awk '{print $1}')" = "$BASE_SHA"
          tar -xzf "$T" -C work
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-schedule-only
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-schedule-only-testfix
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-schedule-only-testfix2
          test "$(shasum -a 256 work/src/ScheduleOS.tsx | awk '{print $1}')" = '916d2bb1225657746dcc6a4e14ddc36f51c5f712c5407273547dae1a3bd03396'
          test "$(shasum -a 256 work/src/scheduleOnlyContracts.test.ts | awk '{print $1}')" = '52465f8ee1a9bc4a09507337fd75f24abd6593e719e6df64e05d7625ccd41838'
      - name: Re-run affected frontend group only
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npx vitest run \
            src/scheduleOnly.test.ts \
            src/scheduleOnlyContracts.test.ts \
            src/scheduleContinuation.test.ts \
            src/publisherSchedule.test.ts \
            src/channelSchedule.test.ts \
            src/dynamicUploadQuota.test.ts \
            src/MetadataPage.schedule.test.ts \
            src/publisherMetadata.test.ts
          npx tsc --noEmit
          npm run build
