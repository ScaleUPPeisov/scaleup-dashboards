name: VYRON 2.1.4 Schedule-Only Targeted Gate
on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths:
      - '.github/workflows/vyron-214-schedule-only-targeted.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34746235915'
  BASE_ARTIFACT: VYRON-2.1.4-audio-cleanup-green-source
  BASE_SHA: 315f7b8cba142d966619f0eb6d14c2b7dc806ad8e6436d13a3ab4f3338fbde12
jobs:
  schedule-only:
    runs-on: macos-14
    timeout-minutes: 55
    env:
      GH_TOKEN: '${{ github.token }}'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore exact audio-cleanup green source and apply Schedule-only overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base work before frozen build out evidence
          mkdir -p base work before frozen build out evidence
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-audio-cleanup-source.tar.gz
          ACTUAL=$(shasum -a 256 "$T" | awk '{print $1}')
          printf 'BASE_RUN=%s\nBASE_SOURCE_SHA256=%s\n' "$BASE_RUN" "$ACTUAL" | tee evidence/base-source.txt
          test "$ACTUAL" = "$BASE_SHA"
          tar -xzf "$T" -C work
          cp -R work/. before/
          python3 .github/scripts/apply_v214_overlay_chunks.py work .github/patches/v214-schedule-only | tee evidence/schedule-overlay.txt
          python3 - <<'PY'
          import hashlib,pathlib
          def h(root):
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          a,b=pathlib.Path('before'),pathlib.Path('work'); A,B=h(a),h(b)
          changed=sorted(k for k in set(A)|set(B) if A.get(k)!=B.get(k))
          expected=sorted([
            'src-tauri/src/lib.rs','src-tauri/src/youtube.rs','src/ScheduleOS.tsx','src/YouTubeCenter.tsx','src/api.ts',
            'src/scheduleOnly.css','src/scheduleOnly.test.ts','src/scheduleOnly.ts','src/scheduleOnlyContracts.test.ts'
          ])
          print('\n'.join(changed)); pathlib.Path('evidence/strict-diff-scope.txt').write_text('\n'.join(changed)+'\n')
          assert changed==expected,(changed,expected)
          protected=[
            'src/MetadataPage.tsx','src/ExistingVideos.tsx','src/publisherSchedule.ts','src/scheduleContinuation.ts',
            'src/youtubeQuota.ts','src-tauri/src/shorts_factory.rs','src-tauri/src/production_manager.rs','src-tauri/src/security.rs'
          ]
          for p in protected:
              assert A.get(p)==B.get(p),p
          ui=(b/'src/ScheduleOS.tsx').read_text()
          rust=(b/'src-tauri/src/youtube.rs').read_text()
          assert 'youtubeUpdateExistingSchedule' in ui
          assert 'Metadata writes <b>0</b>' in ui and 'videos.insert <b>0</b>' in ui
          assert 'pub async fn youtube_update_existing_schedule' in rust
          body=rust[rust.index('pub async fn youtube_update_existing_schedule'):rust.index('pub async fn youtube_list_playlists',rust.index('pub async fn youtube_update_existing_schedule'))]
          assert '.query(&[("part", "status")])' in body
          assert '"snippetWrites":0' in body and '"thumbnailWrites":0' in body and '"playlistWrites":0' in body and '"videosInsert":0' in body
          assert 'security::get_secret(' not in rust
          PY
          shasum -a 256 .github/patches/v214-schedule-only/manifest.json | tee evidence/overlay-manifest-sha256.txt
      - name: Schedule-only frontend S1-S20 and regression contracts
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npx vitest run \
            src/scheduleOnly.test.ts \
            src/scheduleOnlyContracts.test.ts \
            src/scheduleContinuation.test.ts \
            src/publisherSchedule.test.ts \
            src/channelSchedule.test.ts \
            src/dynamicUploadQuota.test.ts \
            src/MetadataPage.schedule.test.ts \
            src/publisherMetadata.test.ts 2>&1 | tee ../evidence/schedule-frontend-tests.log
          npx tsc --noEmit 2>&1 | tee ../evidence/typescript.log
          npm run build 2>&1 | tee ../evidence/frontend-build.log
      - name: Schedule-only Rust status preservation tests
        shell: bash
        working-directory: work/src-tauri
        run: |
          set -Eeuo pipefail
          cargo test schedule_only_status_tests --lib -- --nocapture 2>&1 | tee ../../evidence/schedule-rust-tests.log
      - name: Keychain targeted safety regression unchanged
        shell: bash
        working-directory: work/src-tauri
        run: |
          set -Eeuo pipefail
          : > ../../evidence/keychain-regression.log
          for t in passive_profile_listing_zero_secret_store_calls selected_profile_hydration_reads_only_selected_secret session_cache_second_access_has_zero_backend_reads post_save_verification_uses_session_cache denial_guard_blocks_retry_loop google_project_diagnostic_is_metadata_only_and_secret_redacted sanitized_state_never_writes_api_secrets_to_disk; do
            cargo test "$t" --lib -- --nocapture 2>&1 | tee -a ../../evidence/keychain-regression.log
          done
          ! grep -n 'security::get_secret(' src/youtube.rs
      - name: Freeze Schedule-only 2.1.4 source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p "require('./work/package.json').version")" = '2.1.4'
          test "$(python3 -c "import json;print(json.load(open('work/src-tauri/tauri.conf.json'))['version'])")" = '2.1.4'
          tar --exclude=node_modules --exclude=src-tauri/target -czf frozen/VYRON-2.1.4-schedule-only-source.tar.gz -C work .
          shasum -a 256 frozen/VYRON-2.1.4-schedule-only-source.tar.gz | tee frozen/SOURCE_SHA256.txt | tee evidence/new-schedule-source-sha256.txt
      - name: Build exact frozen ARM64 Schedule-only DEV candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -xzf frozen/VYRON-2.1.4-schedule-only-source.tar.gz -C build
          cd build
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP_REL=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name VYRON.app -print -quit)
          test -n "$APP_REL"; APP="$(pwd)/$APP_REL"; test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = 2.1.4
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = studio.channelflow.desktop
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          file "$APP/Contents/MacOS/$EXE" | tee ../evidence/app-binary.txt | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee ../evidence/codesign.txt
          trap 'launchctl unsetenv PATH >/dev/null 2>&1 || true; pkill -if "VYRON|channelflow" >/dev/null 2>&1 || true' EXIT
          launchctl setenv PATH '/usr/bin:/bin:/usr/sbin:/sbin'
          open -na "$APP"; sleep 5
          pgrep -if "$APP/Contents/MacOS/$EXE" >/dev/null
          printf 'Finder-like PATH launch: PASS\n' | tee ../evidence/finder-launch.txt
          launchctl unsetenv PATH || true
          pkill -if "$APP/Contents/MacOS/$EXE" || true
          ditto -c -k --keepParent "$APP" ../out/VYRON-2.1.4-SCHEDULE-ONLY-ARM64-DEV.app.zip
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with: {name: VYRON-2.1.4-schedule-only-green-source, path: frozen/, retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: VYRON-2.1.4-schedule-only-ARM64-DEV, path: out/VYRON-2.1.4-SCHEDULE-ONLY-ARM64-DEV.app.zip, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: VYRON-2.1.4-schedule-only-evidence, path: evidence/, if-no-files-found: warn, retention-days: 30}
