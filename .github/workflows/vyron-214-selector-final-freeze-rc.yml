name: VYRON 2.1.4 Selector Final Green + Source Freeze + ARM64 RC

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths:
      - '.github/workflows/vyron-214-selector-final-freeze-rc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-214-selector-final-freeze-rc
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34761235214'
  BASE_ARTIFACT: VYRON-2.1.4-final-source
  BASE_SHA: 4a8c6eba14ee8c5090353ae2ea5047197f831351238a325fcec2d22fcf797fc8
  PATCH_B64_PATH: .github/patches/v214-schedule-channel-selector/schedule-channel-selector.patch.gz.b64
  MANIFEST_PATH: .github/patches/v214-schedule-channel-selector/manifest.json
  PATCH_SHA: 9df8e3f8155f0b8b1d66247190746b0ab949ed03b21ce78ea0eb95978dfcf477
  PATCH_B64_SHA: cf9372e82d6a3552ff99a98b1afeb120d811f219c9bf8f78b6346123e953fb78
  TESTFIX_PATH: .github/patches/v214-schedule-channel-selector/test-harness-isolation.patch
  TESTFIX_SHA: 7bbfd42897753e306bfb665acfed6f90f2f74ce6edc503cda463c7b9e1de857b
  TESTFIX_AFTER_SHA: 976093563b7cb44c6471b33ddb95be2295521145a03ae23ffb4abf32539db3e4
  RECOVERY_SHA: 7a7eda30cea453c93565ef8beb38d064e4c91ed9

jobs:
  final-regression-freeze:
    name: Selector final regression + code freeze + deterministic source freeze
    runs-on: macos-14
    timeout-minutes: 120
    env:
      GH_TOKEN: '${{ github.token }}'
      VYRON_TEST_REAL_FFMPEG: '1'
      VYRON_SHORTS_REAL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recovery ref and pre-release stable safety
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          RECOVERY_ACTUAL=$(git ls-remote origin refs/heads/backup/vyron-214-updater-green-before-content-runway | awk '{print $1}')
          printf 'RECOVERY_REF_SHA=%s\nEXPECTED=%s\n' "$RECOVERY_ACTUAL" "$RECOVERY_SHA" | tee evidence/recovery-ref.txt
          test "$RECOVERY_ACTUAL" = "$RECOVERY_SHA"
          git fetch origin main --depth=1
          git show origin/main:vyron-updates/latest.json > evidence/stable-latest-before.json
          python3 - <<'PY' | tee evidence/stable-before.txt
          import json
          d=json.load(open('evidence/stable-latest-before.json'))
          assert d['version']=='2.1.3',d['version']
          p=d['platforms']['darwin-aarch64']
          assert '/releases/download/v2.1.3/' in p['url'] and p.get('signature')
          print('STABLE_VERSION_BEFORE=2.1.3')
          print('LATEST_JSON_CHANGED_BEFORE=NO')
          PY

      - name: Restore verified previous final source and apply selector-only overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base work before frozen deterministic-check
          mkdir -p base work before frozen deterministic-check evidence
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-final-source.tar.gz
          ACTUAL=$(shasum -a 256 "$T" | awk '{print $1}')
          printf 'BASE_RUN=%s\nBASE_SOURCE_SHA256=%s\n' "$BASE_RUN" "$ACTUAL" | tee evidence/base-source.txt
          test "$ACTUAL" = "$BASE_SHA"
          tar -xzf "$T" -C work
          cp -R work/. before/

          test "$(shasum -a 256 "$PATCH_B64_PATH" | awk '{print $1}')" = "$PATCH_B64_SHA"
          base64 -D -i "$PATCH_B64_PATH" | gunzip > selector.patch
          test "$(shasum -a 256 selector.patch | awk '{print $1}')" = "$PATCH_SHA"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('work'); m=json.loads(pathlib.Path(os.environ['MANIFEST_PATH']).read_text())
          assert m['base_source_sha256']==os.environ['BASE_SHA']
          assert m['patch_sha256']==os.environ['PATCH_SHA']
          assert m['patch_b64_sha256']==os.environ['PATCH_B64_SHA']
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for item in m['files']:
              p=root/item['path']; before=item.get('before_sha256')
              if before is None: assert not p.exists(),item['path']
              else: assert p.exists() and sha(p)==before,(item['path'],sha(p),before)
          print('SELECTOR_BASELINE_SCOPE=PASS')
          PY
          patch -p1 -d work < selector.patch
          test "$(shasum -a 256 "$TESTFIX_PATH" | awk '{print $1}')" = "$TESTFIX_SHA"
          patch -p1 -d work < "$TESTFIX_PATH"
          test "$(shasum -a 256 work/src/scheduleChannelSelector.test.ts | awk '{print $1}')" = "$TESTFIX_AFTER_SHA"

          python3 - <<'PY' | tee evidence/selector-scope.txt
          import hashlib,pathlib
          A=pathlib.Path('before'); B=pathlib.Path('work')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          def tree(root): return {str(p.relative_to(root)):sha(p) for p in root.rglob('*') if p.is_file()}
          a,b=tree(A),tree(B)
          changed=sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k))
          expected=sorted(['src/ScheduleOS.tsx','src/scheduleOnly.css','src/scheduleChannelSelector.test.ts'])
          assert changed==expected,(changed,expected)
          protected=['src/updaterRuntime.ts','src/updaterGuard.ts','src/updaterPolicy.ts','src/updaterStore.ts','src/scheduleOnly.ts','src/ShortsFactory.tsx','src/ProductionManager.tsx','src-tauri/src/security.rs','src-tauri/src/youtube.rs','src-tauri/src/shorts_factory.rs','src-tauri/src/production_manager.rs','src-tauri/tauri.conf.json']
          for rel in protected: assert a.get(rel)==b.get(rel),rel
          print('SELECTOR_RUNTIME_SCOPE=src/ScheduleOS.tsx,src/scheduleOnly.css')
          print('SELECTOR_TEST_SCOPE=src/scheduleChannelSelector.test.ts')
          print('OAUTH_KEYCHAIN_UPLOAD_STORAGE_UPDATER_UNCHANGED=PASS')
          print('STRICT_SELECTOR_SCOPE=PASS')
          PY

      - name: Version updater and schedule-only contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee evidence/static-contracts.txt
          import json,pathlib,re
          r=pathlib.Path('work')
          pkg=json.loads((r/'package.json').read_text()); conf=json.loads((r/'src-tauri/tauri.conf.json').read_text()); cargo=(r/'src-tauri/Cargo.toml').read_text(); ui=(r/'src/ScheduleOS.tsx').read_text()
          assert pkg['version']=='2.1.4'; assert conf['version']=='2.1.4'; assert conf['identifier']=='studio.channelflow.desktop'; assert re.search(r'(?m)^version\s*=\s*"2\.1\.4"\s*$',cargo)
          assert conf['build']['frontendDist']=='../dist'; assert conf['build']['beforeBuildCommand']=='npm run build'; assert conf['plugins']['updater']['pubkey']; assert conf['plugins']['updater']['endpoints']
          for token in ['aria-label="Канал"','setChannelId','selectedIds','youtubeUpdateExistingSchedule','youtubeListExisting']: assert token in ui,token
          test=(r/'src/scheduleChannelSelector.test.ts').read_text(); assert 'ZERO DOCX' in test and '31 channels' in test
          print('VERSION_BUNDLE_PRODUCTION_FRONTEND=PASS')
          print('UPDATER_CONFIG_PRESENT=PASS')
          print('SCHEDULE_SELECTOR_STATIC_CONTRACT=PASS')
          print('ZERO_DOCX_CONTRACT_PRESENT=PASS')
          PY

      - name: Install dependencies and media tools
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
          { command -v ffmpeg; command -v ffprobe; ffmpeg -version | head -1; ffprobe -version | head -1; } | tee ../evidence/media-tools.txt

      - name: Full frontend regression TypeScript and production build
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run 2>&1 | tee ../evidence/frontend-tests.log
          npx tsc --noEmit --pretty false 2>&1 | tee ../evidence/typescript.log
          npm run build 2>&1 | tee ../evidence/frontend-build.log

      - name: Critical frontend release evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee evidence/critical-frontend-summary.txt
          from pathlib import Path
          log=Path('evidence/frontend-tests.log').read_text()
          groups={
            'SELECTOR':['src/scheduleChannelSelector.test.ts'],
            'CONTENT_RUNWAY':['src/contentRunway.test.ts','src/channelRunway.test.ts'],
            'SCHEDULE':['src/channelSchedule.test.ts','src/publisherSchedule.test.ts','src/scheduleContinuation.test.ts','src/scheduleOnly.test.ts','src/scheduleOnlyContracts.test.ts','src/MetadataPage.schedule.test.ts','src/v2100UnifiedSchedule.test.ts'],
            'UPDATER':['src/updaterGuard.test.ts','src/updaterRuntime.test.ts','src/updaterRemoteContract.test.ts','src/updaterHotfix.test.ts','src/updaterPolicy.test.ts'],
            'QUOTA':['src/dynamicUploadQuota.test.ts','src/publisherQuota.test.ts','src/youtubeQuota.test.ts','src/youtubeQuotaPlanner.test.ts','src/youtubeQuotaRollover.test.ts'],
            'UPLOAD':['src/uploadButtonUnblock.test.ts','src/v2100PublishRecovery.test.ts','src/v2111PublisherRuntime.test.ts','src/youtubePublishSafety.test.ts'],
            'STORAGE':['src/storageLifecycle.test.ts','src/v2100StorageArchive.test.ts','src/v2111GlobalCleanup.test.ts']}
          for name,files in groups.items():
              missing=[f for f in files if f not in log]; assert not missing,(name,missing); print(f'{name}=PASS')
          assert '355 passed' in log, 'expected full frontend 355/355'
          assert '11 tests' in log and 'src/scheduleChannelSelector.test.ts' in log
          print('FULL_FRONTEND=355/355 PASS')
          print('SCHEDULE_SELECTOR=11/11 PASS')
          PY

      - name: Keychain security full Rust and ARM64 compile gate
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib security::tests::session_cache_second_access_has_zero_backend_reads -- --exact --nocapture 2>&1 | tee ../evidence/keychain-targeted.log
          grep -F 'SESSION_CACHE_BACKEND_READS=1' ../evidence/keychain-targeted.log
          cargo test --manifest-path src-tauri/Cargo.toml --lib security::tests:: -- --nocapture 2>&1 | tee ../evidence/keychain-security-scope.log
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee ../evidence/rust-tests.log
          grep -E 'test result: ok\. 111 passed;' ../evidence/rust-tests.log
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin 2>&1 | tee ../evidence/rust-arm64-check.log
          printf 'KEYCHAIN_TARGETED=PASS\nKEYCHAIN_SECURITY_SCOPE=PASS\nFULL_RUST=111/111 PASS\nARM64_CARGO_CHECK=PASS\n' | tee ../evidence/rust-summary.txt

      - name: Deterministic new release-source freeze after final green
        shell: bash
        run: |
          set -Eeuo pipefail
          GIT_TREE=$(git show -s --format=%T "$GITHUB_SHA"); export GIT_TREE
          python3 - <<'PY'
          import gzip,hashlib,os,pathlib,tarfile
          root=pathlib.Path('work'); outdir=pathlib.Path('frozen'); outdir.mkdir(exist_ok=True)
          def build(out):
              with open(out,'wb') as raw:
                  with gzip.GzipFile(filename='',mode='wb',fileobj=raw,mtime=0) as gz:
                      with tarfile.open(fileobj=gz,mode='w',format=tarfile.PAX_FORMAT) as tf:
                          for p in sorted(root.rglob('*'),key=lambda p:str(p.relative_to(root))):
                              rel=p.relative_to(root)
                              if any(part in {'node_modules','target'} for part in rel.parts): continue
                              ti=tf.gettarinfo(str(p),arcname='./'+str(rel)); ti.uid=0; ti.gid=0; ti.uname=''; ti.gname=''; ti.mtime=0
                              if ti.isfile():
                                  with open(p,'rb') as f: tf.addfile(ti,f)
                              else: tf.addfile(ti)
          a=outdir/'VYRON-2.1.4-final-source.tar.gz'; b=pathlib.Path('deterministic-check/VYRON-2.1.4-final-source.tar.gz'); build(a); build(b)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest(); ha,hb=sha(a),sha(b)
          assert ha==hb,(ha,hb); assert ha!=os.environ['BASE_SHA']
          (outdir/'SOURCE_SHA256.txt').write_text(f'{ha}  VYRON-2.1.4-final-source.tar.gz\n')
          (outdir/'SOURCE_METADATA.txt').write_text(f'REPOSITORY={os.environ["GITHUB_REPOSITORY"]}\nBRANCH={os.environ["GITHUB_REF_NAME"]}\nHEAD={os.environ["GITHUB_SHA"]}\nGIT_TREE={os.environ["GIT_TREE"]}\nPREVIOUS_SOURCE_SHA256={os.environ["BASE_SHA"]}\n')
          pathlib.Path('evidence/source-freeze.txt').write_text(f'SOURCE_SHA256={ha}\nSECOND_BUILD_SHA256={hb}\nDETERMINISTIC_MATCH=PASS\nCODE_FREEZE=YES\nHEAD={os.environ["GITHUB_SHA"]}\nGIT_TREE={os.environ["GIT_TREE"]}\nOLD_SOURCE_REUSED=NO\n')
          print('FINAL_SOURCE_SHA256='+ha); print('DETERMINISTIC_SECOND_BUILD=MATCH'); print('CODE_FREEZE=YES')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.4-final-source-selector
          path: frozen/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-2.1.4-final-selector-regression-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  arm64-release-candidate:
    name: Verified selector frozen source -> ARM64 RC + codesign + Finder smoke
    needs: final-regression-freeze
    runs-on: macos-14
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-2.1.4-final-source-selector
          path: frozen

      - name: Independent source SHA verification
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED=$(awk '{print $1}' frozen/SOURCE_SHA256.txt)
          ACTUAL=$(shasum -a 256 frozen/VYRON-2.1.4-final-source.tar.gz | awk '{print $1}')
          printf 'EXPECTED_SOURCE_SHA256=%s\nACTUAL_SOURCE_SHA256=%s\n' "$EXPECTED" "$ACTUAL" | tee source-roundtrip.txt
          test "$EXPECTED" = "$ACTUAL"; test "$ACTUAL" != "$BASE_SHA"
          grep -Fx "REPOSITORY=$GITHUB_REPOSITORY" frozen/SOURCE_METADATA.txt
          grep -Fx "BRANCH=$GITHUB_REF_NAME" frozen/SOURCE_METADATA.txt
          grep -Fx "HEAD=$GITHUB_SHA" frozen/SOURCE_METADATA.txt
          printf 'SOURCE_SHA_VERIFY=MATCH\n' | tee -a source-roundtrip.txt

      - name: Build and verify exact new frozen ARM64 release candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build out evidence-rc; mkdir -p build out evidence-rc
          tar -xzf frozen/VYRON-2.1.4-final-source.tar.gz -C build
          cd build
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee ../evidence-rc/tauri-arm64-build.log
          APP_REL=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name VYRON.app -print -quit); test -n "$APP_REL"
          APP="$(pwd)/$APP_REL"; test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = 2.1.4
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = studio.channelflow.desktop
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist"); test "$EXE" = channelflow; test -x "$APP/Contents/MacOS/$EXE"
          file "$APP/Contents/MacOS/$EXE" | tee ../evidence-rc/app-binary.txt | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee ../evidence-rc/codesign.txt
          codesign -dr - "$APP" 2>&1 | tee ../evidence-rc/designated-requirement.txt
          python3 - <<'PY' | tee ../evidence-rc/packaged-contracts.txt
          import json,pathlib
          c=json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())
          assert c['version']=='2.1.4'; assert c['identifier']=='studio.channelflow.desktop'; assert c['build']['frontendDist']=='../dist'; assert c['plugins']['updater']['pubkey']; assert c['plugins']['updater']['endpoints']
          print('PACKAGED_SOURCE_CONFIG=PASS'); print('UPDATER_CONFIG_PRESENT=PASS')
          PY
          test -d "$APP/Contents/Resources"; test -f dist/index.html
          if grep -R --binary-files=without-match -nE 'http://localhost:1421|127\.0\.0\.1:1421' "$APP/Contents/Resources" > ../evidence-rc/dev-url-scan.txt; then echo 'PACKAGED_DEV_URL_FOUND'; cat ../evidence-rc/dev-url-scan.txt; exit 1; else echo 'PACKAGED_RESOURCES_DEV_URL_SCAN=PASS' | tee ../evidence-rc/dev-url-scan.txt; fi
          trap 'launchctl unsetenv PATH >/dev/null 2>&1 || true; pkill -if "VYRON|channelflow" >/dev/null 2>&1 || true' EXIT
          launchctl setenv PATH '/usr/bin:/bin:/usr/sbin:/sbin'
          open -na "$APP"; sleep 6; pgrep -if "$APP/Contents/MacOS/$EXE" >/dev/null
          printf 'FINDER_LIKE_MINIMAL_PATH_LAUNCH=PASS\n' | tee ../evidence-rc/finder-launch.txt
          launchctl unsetenv PATH || true; pkill -if "$APP/Contents/MacOS/$EXE" || true
          ditto -c -k --keepParent "$APP" ../out/VYRON-2.1.4-ARM64-RC-selector.app.zip
          shasum -a 256 ../out/VYRON-2.1.4-ARM64-RC-selector.app.zip | tee ../evidence-rc/app-zip-sha256.txt
          printf 'VERSION=2.1.4\nBUNDLE_ID=studio.channelflow.desktop\nEXECUTABLE=channelflow\nARCH=arm64\nCODESIGN=PASS\nSIGNING_MODE=AD_HOC\nNOTARIZATION=NOT_PERFORMED\nFINDER_LIKE_LAUNCH=PASS\n' | tee ../evidence-rc/rc-contract.txt
          trap - EXIT

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.4-ARM64-RC-selector
          path: out/VYRON-2.1.4-ARM64-RC-selector.app.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-2.1.4-ARM64-RC-selector-evidence
          path: |
            source-roundtrip.txt
            evidence-rc/
          if-no-files-found: warn
          retention-days: 30
