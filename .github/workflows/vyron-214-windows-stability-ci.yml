name: VYRON 2.1.14 Windows Stability Candidate

on:
  push:
    branches:
      - windows/vyron-214-stability-fix
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-214-windows-stability-candidate
  cancel-in-progress: true

env:
  VERSION: '2.1.14'
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  WINDOWS_PLATFORM_KEY: windows-x86_64
  FFMPEG_VERSION: 8.1.2
  FFMPEG_ZIP_SHA256: db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbWludDogbWluaXNpZ24gcHVibGljIGtleTogREQ4NDU0N0RFMjUwRjFDMQpSV1RBOFZEaWZWU0UzVEd1blZCcTZ4b0FhMGdCU2ZtS2ZVTzhQclAxQ29lZnhCajQvaFhxR3hQMQo=

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: windows/vyron-214-stability-fix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Source version contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,re,os
          v=os.environ['VERSION']
          pkg=json.load(open('package.json'))
          lock=json.load(open('package-lock.json'))
          conf=json.load(open('src-tauri/tauri.conf.json'))
          win=json.load(open('src-tauri/tauri.windows.conf.json'))
          cargo=open('src-tauri/Cargo.toml',encoding='utf-8').read()
          clock=open('src-tauri/Cargo.lock',encoding='utf-8').read()
          assert pkg['version']==v
          assert lock['version']==v and lock['packages']['']['version']==v
          assert conf['version']==v
          assert win['bundle']['targets']==['nsis']
          assert win['bundle']['createUpdaterArtifacts'] is True
          assert win['plugins']['updater']['endpoints'][0].endswith('/vyron-updates/windows-latest.json')
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.14"\s*$',cargo)
          assert re.search(r'\[\[package\]\]\r?\nname = "channelflow"\r?\nversion = "2\.1\.14"',clock)
          print('SOURCE_VERSION_CONTRACT=PASS')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend regression tests
        run: npm test

      - name: TypeScript and Vite production build
        run: npm run build

      - name: Provision pinned FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $unpack = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:FFMPEG_ZIP_SHA256) { throw "FFmpeg SHA-256 mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $ffmpeg = Get-ChildItem -Path $unpack -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $unpack -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries missing" }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/bin" | Out-Null
          Copy-Item $ffmpeg.FullName "src-tauri/resources/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "src-tauri/resources/bin/ffprobe.exe" -Force

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Windows Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Rust warning evidence
        shell: pwsh
        continue-on-error: true
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath rust-check.txt
          $warnings = (Select-String -Path rust-check.txt -Pattern '^warning:' | Measure-Object).Count
          "RUST_WARNING_LINES=$warnings" | Tee-Object -FilePath rust-warning-evidence.txt

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          python - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw
          def dec(x):
              try:return base64.b64decode(x,validate=True).decode()
              except:return None
          if raw.startswith('untrusted comment:'):
              out=base64.b64encode(raw.encode()).decode(); box=raw
          else:
              one=dec(raw)
              if one and one.startswith('untrusted comment:'):
                  out=raw; box=one
              else:
                  box=dec(one) if one else None
                  assert box and box.startswith('untrusted comment:')
                  out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          print('UPDATER_PRIVATE_KEY_NORMALIZED=PASS')
          PY

      - name: Build signed NSIS updater candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npx tauri build --target "$WINDOWS_TARGET" --bundles nsis
          ROOT="src-tauri/target/$WINDOWS_TARGET/release"
          EXE="$ROOT/VYRON.exe"
          INSTALLER="$(find "$ROOT/bundle/nsis" -maxdepth 1 -name '*-setup.exe' -type f | head -n1)"
          test -s "$EXE"
          test -n "$INSTALLER"
          test -s "$INSTALLER"
          test -s "$INSTALLER.sig"
          mkdir -p production
          cp "$EXE" production/VYRON.exe
          cp "$INSTALLER" production/
          cp "$INSTALLER.sig" production/
          INSTALLER_NAME="$(basename "$INSTALLER")"
          SIG_NAME="$(basename "$INSTALLER.sig")"
          SHA="$(sha256sum "$INSTALLER" | awk '{print $1}')"
          BYTES="$(python -c "import os; print(os.path.getsize(r'$INSTALLER'))")"
          printf '%s  %s\n' "$SHA" "$INSTALLER_NAME" > "production/$INSTALLER_NAME.sha256"
          echo "WINDOWS_INSTALLER=$INSTALLER_NAME" >> "$GITHUB_ENV"
          echo "WINDOWS_SIGNATURE=$SIG_NAME" >> "$GITHUB_ENV"
          echo "WINDOWS_INSTALLER_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "WINDOWS_INSTALLER_BYTES=$BYTES" >> "$GITHUB_ENV"
          echo "WINDOWS_NSIS=PASS"
          echo "WINDOWS_INSTALLER=$INSTALLER_NAME"
          echo "WINDOWS_INSTALLER_SHA256=$SHA"

      - name: Independent updater signature verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP'])
          (t/'vyron-updater.pub').write_bytes(base64.b64decode(os.environ['EMBEDDED_UPDATER_KEY']))
          encoded=pathlib.Path('production',os.environ['WINDOWS_SIGNATURE']).read_text().strip()
          (t/'vyron-updater.sig').write_bytes(base64.b64decode(encoded))
          PY
          V="$RUNNER_TEMP/vyron-minisign-verify"
          mkdir -p "$V/src"
          cat >"$V/Cargo.toml" <<'EOF'
          [package]
          name = "vyron-minisign-verify"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          minisign-verify = "0.2.5"
          EOF
          cat >"$V/src/main.rs" <<'EOF'
          use minisign_verify::{PublicKey,Signature};
          use std::{env,path::Path};
          fn main(){
            let a:Vec<String>=env::args().collect();
            assert_eq!(a.len(),4);
            let pk=PublicKey::from_file(Path::new(&a[1])).expect("public key parse");
            let sig=Signature::from_file(Path::new(&a[3])).expect("signature parse");
            let data=std::fs::read(&a[2]).expect("artifact read");
            pk.verify(&data,&sig,false).expect("updater signature verify");
            println!("UPDATER_SIGNATURE=VERIFIED");
          }
          EOF
          cargo run --quiet --manifest-path "$V/Cargo.toml" -- "$RUNNER_TEMP/vyron-updater.pub" "production/$WINDOWS_INSTALLER" "$RUNNER_TEMP/vyron-updater.sig"

      - name: Authenticode evidence
        shell: pwsh
        run: |
          $exe = Get-AuthenticodeSignature "production/VYRON.exe"
          $installer = Get-AuthenticodeSignature ("production/" + $env:WINDOWS_INSTALLER)
          @(
            "VYRON_EXE_AUTHENTICODE_STATUS=$($exe.Status)"
            "VYRON_EXE_SIGNER=$($exe.SignerCertificate.Subject)"
            "INSTALLER_AUTHENTICODE_STATUS=$($installer.Status)"
            "INSTALLER_SIGNER=$($installer.SignerCertificate.Subject)"
          ) | Set-Content -Path production/authenticode.txt
          Get-Content production/authenticode.txt

      - name: Candidate manifest contract
        shell: bash
        run: |
          set -Eeuo pipefail
          SIG="$(cat "production/$WINDOWS_SIGNATURE")"
          test -n "$SIG"
          python - <<'PY'
          import json,os,pathlib,datetime
          installer=os.environ['WINDOWS_INSTALLER']
          sig=pathlib.Path('production',os.environ['WINDOWS_SIGNATURE']).read_text().strip()
          url=f"https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.14-windows-x64/{installer}"
          manifest={
            'version':os.environ['VERSION'],
            'notes':'VYRON 2.1.14 Windows Stability Release candidate.',
            'pub_date':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'platforms':{os.environ['WINDOWS_PLATFORM_KEY']:{'url':url,'signature':sig}}
          }
          pathlib.Path('production/windows-latest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          d=json.load(open('production/windows-latest.json',encoding='utf-8'))
          assert d['version']=='2.1.14'
          p=d['platforms']['windows-x86_64']
          assert p['url'].startswith('https://') and p['signature']
          print('MANIFEST_CONTRACT=PASS')
          PY

      - name: Candidate evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path production | Out-Null
          @(
            "VERSION=2.1.14"
            "WINDOWS_RUNNER=$env:RUNNER_OS"
            "PHYSICAL_WINDOWS_10=NOT_TESTED"
            "PHYSICAL_WINDOWS_11=NOT_TESTED"
            "ACTUAL_OAUTH_BROWSER_FLOW=NOT_TESTED"
            "ACTUAL_YOUTUBE_UPLOAD=NOT_TESTED"
            "ACTUAL_ENDLUME_LAUNCH=NOT_TESTED"
            "ACTUAL_UPDATE_2.1.13_TO_2.1.14=NOT_TESTED"
          ) | Set-Content -Path production/physical-evidence.txt

      - name: Upload candidate artifacts and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyron-2.1.14-windows-candidate
          path: |
            production/**
            rust-check.txt
            rust-warning-evidence.txt
          if-no-files-found: warn
