name: VYRON 2.1.15 Parity Audit CI

on:
  push:
    branches:
      - windows/vyron-214-stability-fix
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-215-parity-audit
  cancel-in-progress: true

jobs:
  parity:
    name: parity-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout audit HEAD
        uses: actions/checkout@v4
        with:
          ref: windows/vyron-214-stability-fix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Version contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='2.1.15') process.exit(1)"
          grep -q '^version = "2.1.15"$' src-tauri/Cargo.toml
          python - <<'PY'
          import json
          assert json.load(open('src-tauri/tauri.conf.json'))['version']=='2.1.15'
          print('VERSION_CONTRACT=PASS')
          PY

      - name: Static OAuth and shell boundary contract
        shell: python
        run: |
          from pathlib import Path
          s=Path('src-tauri/src/youtube.rs').read_text(encoding='utf-8')
          assert 'response_type=code' in s
          assert 'code_challenge_method=S256' in s
          assert 'wait_for_oauth_callback_with_timeout' in s
          open_browser=s.split('fn open_browser',1)[1].split('fn google_oauth_auth_url',1)[0]
          assert 'Command::new("cmd")' not in open_browser
          assert 'Command::new("explorer.exe")' in open_browser
          assert '.arg(url)' in open_browser
          print('OAUTH_STATIC_CONTRACT=PASS')

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted frontend Windows stability suite
        run: npx vitest run src/v214WindowsStability.test.ts

      - name: Full frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Provision Windows FFmpeg resource for Rust/Tauri tests
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "8.1.2"
          $expected = "db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-$version.zip"
          $unpack = Join-Path $env:RUNNER_TEMP "ffmpeg-$version"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$version-essentials_build.zip" -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg SHA-256 mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $ffmpeg = Get-ChildItem -Path $unpack -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $unpack -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries missing" }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/bin" | Out-Null
          Copy-Item $ffmpeg.FullName "src-tauri/resources/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "src-tauri/resources/bin/ffprobe.exe" -Force
          Write-Host "WINDOWS_FFMPEG_RESOURCE=PASS"

      - name: Targeted Rust OAuth callback tests
        run: cargo test --manifest-path src-tauri/Cargo.toml oauth_callback -- --nocapture

      - name: Windows targeted secure-storage and path parity
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --manifest-path src-tauri/Cargo.toml windows_credential_manager_roundtrip_is_tenant_scoped -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml unicode_spaces_ampersand_and_parentheses_path_is_read_write_safe -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml long_windows_path_over_260_chars_is_read_write_safe_when_os_supports_vyron_runtime -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml unc_paths_are_classified_as_external_without_network_access -- --nocapture

      - name: Full Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Windows live updater feed remote asset and cryptographic signature
        if: matrix.name == 'windows'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p audit-evidence
          FEED="https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/windows-latest.json"
          curl -L --fail --silent --show-error -H 'Cache-Control: no-cache' -o audit-evidence/windows-live-feed.json "$FEED"
          python - <<'PY'
          import json,base64,pathlib
          d=json.load(open('audit-evidence/windows-live-feed.json',encoding='utf-8'))
          assert d['version']=='2.1.15', d['version']
          p=d['platforms']['windows-x86_64']
          assert '/releases/download/v2.1.15-windows-x64/VYRON_2.1.15_x64-setup.exe' in p['url']
          assert p['signature']
          conf=json.load(open('src-tauri/tauri.windows.conf.json',encoding='utf-8'))
          pub=conf['plugins']['updater']['pubkey']
          pathlib.Path('audit-evidence/updater.pub').write_bytes(base64.b64decode(pub))
          pathlib.Path('audit-evidence/updater.sig').write_bytes(base64.b64decode(p['signature']))
          pathlib.Path('audit-evidence/live-url.txt').write_text(p['url'],encoding='utf-8')
          print('LIVE_FEED_CONTRACT=PASS')
          PY
          URL="$(cat audit-evidence/live-url.txt)"
          curl -L --fail --silent --show-error -o audit-evidence/VYRON_2.1.15_x64-setup.exe "$URL"
          curl -L --fail --silent --show-error -o audit-evidence/VYRON_2.1.15_x64-setup.exe.sha256 "$URL.sha256"
          EXPECTED="$(awk '{print tolower($1)}' audit-evidence/VYRON_2.1.15_x64-setup.exe.sha256)"
          ACTUAL="$(sha256sum audit-evidence/VYRON_2.1.15_x64-setup.exe | awk '{print tolower($1)}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "LIVE_REMOTE_INSTALLER_SHA256=$ACTUAL" | tee -a audit-evidence/windows-live.txt
          V="$RUNNER_TEMP/vyron-audit-minisign"
          mkdir -p "$V/src"
          cat >"$V/Cargo.toml" <<'EOF'
          [package]
          name = "vyron-audit-minisign"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          minisign-verify = "0.2.5"
          EOF
          cat >"$V/src/main.rs" <<'EOF'
          use minisign_verify::{PublicKey,Signature};
          use std::{env,path::Path};
          fn main(){
            let a:Vec<String>=env::args().collect();
            let pk=PublicKey::from_file(Path::new(&a[1])).expect("public key");
            let sig=Signature::from_file(Path::new(&a[3])).expect("signature");
            let data=std::fs::read(&a[2]).expect("artifact");
            pk.verify(&data,&sig,false).expect("signature verification");
            println!("UPDATER_SIGNATURE=VERIFIED");
          }
          EOF
          cargo run --quiet --manifest-path "$V/Cargo.toml" -- audit-evidence/updater.pub audit-evidence/VYRON_2.1.15_x64-setup.exe audit-evidence/updater.sig | tee -a audit-evidence/windows-live.txt

      - name: Windows installer update downgrade and uninstall safety
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path audit-evidence | Out-Null
          $old = Join-Path $env:RUNNER_TEMP "VYRON_2.1.14_x64-setup.exe"
          Invoke-WebRequest -Uri "https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.14-windows-x64/VYRON_2.1.14_x64-setup.exe" -OutFile $old
          $new = Join-Path $PWD "audit-evidence/VYRON_2.1.15_x64-setup.exe"
          if (-not (Test-Path $new)) { throw "Live 2.1.15 installer missing" }

          $p14 = Start-Process -FilePath $old -ArgumentList "/S" -Wait -PassThru
          if ($p14.ExitCode -ne 0) { throw "2.1.14 silent install failed: $($p14.ExitCode)" }

          $tenantDir = Join-Path $env:APPDATA "studio.channelflow.desktop/users/audit-user"
          New-Item -ItemType Directory -Force -Path $tenantDir | Out-Null
          $state = Join-Path $tenantDir "state.json"
          [IO.File]::WriteAllText($state,'{"version":8,"channels":[{"id":"audit-channel"}],"jobs":[{"id":"audit-job"}],"uploadHistory":[{"id":"audit-upload"}],"fingerprintCache":{"x":"y"},"projectLifecycle":{"p":"ready"}}',[Text.UTF8Encoding]::new($false))
          $before = (Get-FileHash $state -Algorithm SHA256).Hash

          $p15 = Start-Process -FilePath $new -ArgumentList "/S" -Wait -PassThru
          if ($p15.ExitCode -ne 0) { throw "2.1.15 silent update failed: $($p15.ExitCode)" }
          $after = (Get-FileHash $state -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "User state changed across 2.1.14 -> 2.1.15" }

          $exe = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "VYRON.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Installed VYRON.exe not found" }
          $v15 = $exe.VersionInfo.ProductVersion
          if (-not $v15.StartsWith("2.1.15")) { throw "Installed version is not 2.1.15: $v15" }

          $down = Start-Process -FilePath $old -ArgumentList "/S" -Wait -PassThru
          $exeAfterDown = Get-Item $exe.FullName
          $vAfterDown = $exeAfterDown.VersionInfo.ProductVersion
          $downgradeAllowed = $vAfterDown.StartsWith("2.1.14")
          $afterDowngrade = (Get-FileHash $state -Algorithm SHA256).Hash
          $downgradeStatePreserved = $afterDowngrade -eq $before

          $uninstaller = Join-Path $exe.Directory.FullName "uninstall.exe"
          if (-not (Test-Path $uninstaller)) { throw "VYRON uninstaller not found beside executable" }
          $un = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "Uninstall failed: $($un.ExitCode)" }
          $stateExistsAfterUninstall = Test-Path $state
          $afterUninstall = if ($stateExistsAfterUninstall) { (Get-FileHash $state -Algorithm SHA256).Hash } else { "" }
          $uninstallPreserved = $stateExistsAfterUninstall -and ($afterUninstall -eq $before)

          @(
            "INSTALL_2_1_14_TO_2_1_15=PASS",
            "STATE_SHA_BEFORE=$before",
            "STATE_SHA_AFTER_UPDATE=$after",
            "INSTALLED_VERSION=$v15",
            "VERSION_AFTER_OLD_INSTALLER=$vAfterDown",
            "DOWNGRADE_2_1_15_TO_2_1_14=$(if($downgradeAllowed){'FAIL_ALLOWED'}else{'PASS_BLOCKED'})",
            "STATE_SHA_AFTER_DOWNGRADE=$afterDowngrade",
            "DOWNGRADE_STATE_PRESERVED=$(if($downgradeStatePreserved){'PASS'}else{'FAIL'})",
            "UNINSTALL_STATE_EXISTS=$(if($stateExistsAfterUninstall){'YES'}else{'NO'})",
            "STATE_SHA_AFTER_UNINSTALL=$afterUninstall",
            "UNINSTALL_PRESERVES_TENANT_STATE=$(if($uninstallPreserved){'PASS'}else{'FAIL'})"
          ) | Set-Content audit-evidence/windows-installer-safety.txt
          Get-Content audit-evidence/windows-installer-safety.txt

          if (-not $downgradeStatePreserved) { throw "DOWNGRADE_DATA_MUTATION: tenant state changed after old installer" }
          if (-not $uninstallPreserved) { throw "UNINSTALL_DATA_LOSS_OR_MUTATION: tenant state was removed or changed" }
          if ($downgradeAllowed) { throw "DOWNGRADE_ALLOWED: 2.1.14 installer replaced 2.1.15" }

      - name: Evidence
        if: always()
        shell: bash
        run: |
          mkdir -p audit-evidence
          {
            echo "OS=${{ matrix.name }}"
            echo "RUNNER_OS=$RUNNER_OS"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "VERSION=2.1.15"
            echo "PHYSICAL_ACCEPTANCE=NOT_PERFORMED"
          } > audit-evidence/${{ matrix.name }}.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-audit-${{ matrix.name }}
          path: |
            audit-evidence/**
            src-tauri/Cargo.lock
          if-no-files-found: warn
