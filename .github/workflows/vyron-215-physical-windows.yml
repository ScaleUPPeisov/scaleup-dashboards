name: VYRON 2.1.15 Physical Windows Audit

on:
  push:
    branches:
      - windows/vyron-214-stability-fix
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-215-physical-windows
  cancel-in-progress: true

jobs:
  physical-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4
        with:
          ref: windows/vyron-214-stability-fix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Provision pinned Windows FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "8.1.2"
          $expected = "db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-$version.zip"
          $unpack = Join-Path $env:RUNNER_TEMP "ffmpeg-$version"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$version-essentials_build.zip" -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg SHA-256 mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $ffmpeg = Get-ChildItem -Path $unpack -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $unpack -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries missing" }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/bin" | Out-Null
          Copy-Item $ffmpeg.FullName "src-tauri/resources/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "src-tauri/resources/bin/ffprobe.exe" -Force

      - name: Build current audited source NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $auditConfig = @{ bundle = @{ createUpdaterArtifacts = $false } } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText((Join-Path $PWD "tauri.audit.windows.json"), $auditConfig, [Text.UTF8Encoding]::new($false))
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config "tauri.audit.windows.json"
          if ($LASTEXITCODE -ne 0) { throw "Current-source NSIS build failed: $LASTEXITCODE" }
          $installer = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Current-source NSIS installer not found" }
          New-Item -ItemType Directory -Force -Path physical-evidence | Out-Null
          Copy-Item $installer.FullName "physical-evidence/VYRON_2.1.15_current-source_x64-setup.exe" -Force
          $sha=(Get-FileHash "physical-evidence/VYRON_2.1.15_current-source_x64-setup.exe" -Algorithm SHA256).Hash
          "CURRENT_SOURCE_INSTALLER_SHA256=$sha" | Set-Content physical-evidence/current-source-build.txt
          "CURRENT_SOURCE_HEAD=$(git rev-parse HEAD)" | Add-Content physical-evidence/current-source-build.txt

      - name: Prepare evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path physical-evidence | Out-Null
          @(
            "HEAD=$(git rev-parse HEAD)"
            "EXPECTED_VERSION=2.1.15"
            "COMPUTERNAME=$env:COMPUTERNAME"
            "USERNAME=$env:USERNAME"
            "OS=$([System.Environment]::OSVersion.VersionString)"
            "INTERACTIVE=$([Environment]::UserInteractive)"
            "SESSIONNAME=$env:SESSIONNAME"
          ) | Set-Content physical-evidence/environment.txt
          Get-Content physical-evidence/environment.txt

      - name: Fetch public live feed and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $feedUrl = "https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/windows-latest.json"
          Invoke-WebRequest -Uri $feedUrl -Headers @{"Cache-Control"="no-cache"} -OutFile physical-evidence/windows-latest.json
          $feed = Get-Content physical-evidence/windows-latest.json -Raw | ConvertFrom-Json
          if ($feed.version -ne "2.1.15") { throw "Live feed version mismatch: $($feed.version)" }
          $url = $feed.platforms.'windows-x86_64'.url
          if (-not $url) { throw "Windows asset URL missing" }
          Invoke-WebRequest -Uri $url -OutFile physical-evidence/PUBLIC_VYRON_2.1.15_x64-setup.exe
          $sha = (Get-FileHash physical-evidence/PUBLIC_VYRON_2.1.15_x64-setup.exe -Algorithm SHA256).Hash
          "LIVE_FEED_VERSION=$($feed.version)" | Add-Content physical-evidence/environment.txt
          "INSTALLER_SHA256=$sha" | Add-Content physical-evidence/environment.txt
          "INSTALLER_BYTES=$((Get-Item physical-evidence/PUBLIC_VYRON_2.1.15_x64-setup.exe).Length)" | Add-Content physical-evidence/environment.txt

      - name: Snapshot existing VYRON user data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $roots = @(
            (Join-Path $env:APPDATA "studio.channelflow.desktop"),
            (Join-Path $env:LOCALAPPDATA "studio.channelflow.desktop")
          )
          $rows = @()
          foreach($root in $roots){
            if(Test-Path $root){
              Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                $rows += [PSCustomObject]@{
                  Path=$_.FullName
                  Length=$_.Length
                  SHA256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash
                }
              }
            }
          }
          $rows | ConvertTo-Json -Depth 4 | Set-Content physical-evidence/user-data-before.json
          "USER_DATA_FILES_BEFORE=$($rows.Count)" | Add-Content physical-evidence/environment.txt

      - name: Install current audited source VYRON 2.1.15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p=Start-Process -FilePath "$PWD\physical-evidence\VYRON_2.1.15_current-source_x64-setup.exe" -ArgumentList "/S" -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Installer exit code $($p.ExitCode)"}
          $roots=@(
            (Join-Path $env:LOCALAPPDATA "Programs"),
            $env:LOCALAPPDATA,
            $env:ProgramFiles,
            [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          ) | Where-Object {$_ -and (Test-Path $_)}
          $exe=$null
          foreach($r in $roots){
            $exe=Get-ChildItem $r -Filter VYRON.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if($exe){break}
          }
          if(-not $exe){throw "Installed VYRON.exe not found"}
          $v=$exe.VersionInfo.ProductVersion
          if(-not $v.StartsWith("2.1.15")){throw "Installed version mismatch: $v"}
          $exe.FullName | Set-Content physical-evidence/installed-exe.txt
          "INSTALLED_EXE=$($exe.FullName)" | Add-Content physical-evidence/environment.txt
          "INSTALLED_VERSION=$v" | Add-Content physical-evidence/environment.txt
          "CURRENT_SOURCE_INSTALLER_PHYSICAL=PASS" | Add-Content physical-evidence/environment.txt

      - name: Physical Windows special-path and real-video fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:USERPROFILE "VYRON Physical\Видео & Музыка\Проект (01)"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $text = Join-Path $root "данные & test (01).txt"
          [IO.File]::WriteAllText($text,"VYRON unicode path probe",[Text.UTF8Encoding]::new($false))
          if((Get-Content $text -Raw) -ne "VYRON unicode path probe"){throw "Unicode/special path readback failed"}

          $ffmpeg = Resolve-Path "src-tauri/resources/bin/ffmpeg.exe"
          $video = Join-Path $root "Video 001.mp4"
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=black:s=320x180:d=2" -f lavfi -i "anullsrc=r=44100:cl=stereo" -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -y $video
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $video)){throw "Real MP4 fixture generation failed"}
          $shaA=(Get-FileHash $video -Algorithm SHA256).Hash

          & $ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=white:s=320x180:d=2" -f lavfi -i "anullsrc=r=44100:cl=stereo" -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -y $video
          if($LASTEXITCODE -ne 0){throw "Re-render fixture generation failed"}
          $shaB=(Get-FileHash $video -Algorithm SHA256).Hash
          if($shaA -eq $shaB){throw "Re-render at same path did not change physical fingerprint"}

          @(
            "SPECIAL_PATH=$root"
            "SPECIAL_PATH_CREATE_READ_WRITE=PASS"
            "REAL_MP4_PATH=$video"
            "RERENDER_SAME_PATH_SHA_A=$shaA"
            "RERENDER_SAME_PATH_SHA_B=$shaB"
            "RERENDER_SAME_PATH_FINGERPRINT_CHANGED=PASS"
          ) | Set-Content physical-evidence/path-media.txt

      - name: Launch and capture 1 3 6 10 second progression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe=(Get-Content physical-evidence/installed-exe.txt -Raw).Trim()
          $proc=Start-Process -FilePath $exe -PassThru
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Capture([string]$name){
            try{
              $bounds=[System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp=New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
              $g=[System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
              $path=Join-Path $PWD "physical-evidence\$name.png"
              $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose();$bmp.Dispose()
              return $true
            }catch{
              "SCREENSHOT_ERROR $name $($_.Exception.Message)" | Add-Content physical-evidence/environment.txt
              return $false
            }
          }
          $elapsed=0
          foreach($checkpoint in @(1,3,6,10)){
            Start-Sleep -Seconds ($checkpoint-$elapsed)
            $elapsed=$checkpoint
            $proc.Refresh()
            if($proc.HasExited){throw "VYRON exited before checkpoint with code $($proc.ExitCode)"}
            "APP_ALIVE_$($checkpoint)S=PASS" | Add-Content physical-evidence/environment.txt
            if($checkpoint -eq 10){
              "MAIN_WINDOW_HANDLE=$($proc.MainWindowHandle)" | Add-Content physical-evidence/environment.txt
              "MAIN_WINDOW_TITLE=$($proc.MainWindowTitle)" | Add-Content physical-evidence/environment.txt
              if([Environment]::UserInteractive -and $proc.MainWindowHandle -eq 0){
                throw "Interactive physical runner has no visible VYRON main window at 10 seconds"
              }
            }
            if(Capture "startup-$($checkpoint)s"){"SCREENSHOT_$($checkpoint)S=PASS" | Add-Content physical-evidence/environment.txt}
          }
          "PHYSICAL_STARTUP_10S=PASS" | Add-Content physical-evidence/environment.txt
          if($proc.CloseMainWindow()){
            if(-not $proc.WaitForExit(8000)){Stop-Process -Id $proc.Id -Force}
          }else{
            Stop-Process -Id $proc.Id -Force
          }

      - name: Relaunch physical application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe=(Get-Content physical-evidence/installed-exe.txt -Raw).Trim()
          $p=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          if($p.HasExited){throw "VYRON failed relaunch; exit=$($p.ExitCode)"}
          "PHYSICAL_RELAUNCH_6S=PASS" | Add-Content physical-evidence/environment.txt
          if($p.CloseMainWindow()){
            if(-not $p.WaitForExit(8000)){Stop-Process -Id $p.Id -Force}
          }else{
            Stop-Process -Id $p.Id -Force
          }

      - name: Verify existing user data was not unexpectedly deleted
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $before=@()
          if(Test-Path physical-evidence/user-data-before.json){
            $raw=Get-Content physical-evidence/user-data-before.json -Raw
            if($raw.Trim()){$before=@($raw | ConvertFrom-Json)}
          }
          $changed=@()
          foreach($row in $before){
            if(Test-Path $row.Path){
              $now=(Get-FileHash $row.Path -Algorithm SHA256).Hash
              if($now -ne $row.SHA256){$changed += $row.Path}
            }else{
              $changed += "MISSING: $($row.Path)"
            }
          }
          $changed | Set-Content physical-evidence/user-data-changed.txt
          $missing=@($changed | Where-Object {$_ -like "MISSING:*"})
          if($missing.Count -gt 0){throw "Pre-existing user data disappeared: $($missing -join '; ')"}
          "USER_DATA_DELETION=NONE" | Add-Content physical-evidence/environment.txt
          "USER_DATA_CHANGED_COUNT=$($changed.Count)" | Add-Content physical-evidence/environment.txt

      - name: Final physical evidence summary
        if: always()
        shell: pwsh
        run: |
          if(-not (Test-Path physical-evidence/environment.txt)){New-Item -ItemType File physical-evidence/environment.txt | Out-Null}
          "PHYSICAL_WINDOWS_AUDIT_COMPLETED=$(Get-Date -Format o)" | Add-Content physical-evidence/environment.txt
          Get-Content physical-evidence/environment.txt

      - name: Upload physical Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyron-2.1.15-physical-windows
          path: physical-evidence/**
          if-no-files-found: warn
