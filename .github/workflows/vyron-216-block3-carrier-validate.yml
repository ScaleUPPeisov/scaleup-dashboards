name: VYRON 2.1.6 Block 3 Carrier Validate

on:
  push:
    branches: [staging/vyron-216-block3-carrier]
    paths:
      - '.github/workflows/vyron-216-block3-carrier-validate.yml'
      - '.github/patches/v216-upload-center/03-live-progress-and-eta.parts/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact full Block 3 carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          parts=(.github/patches/v216-upload-center/03-live-progress-and-eta.parts/*.patchfrag)
          test "${#parts[@]}" -eq 5
          test "$(wc -c < "${parts[0]}")" -eq 5000
          test "$(wc -c < "${parts[1]}")" -eq 5000
          test "$(wc -c < "${parts[2]}")" -eq 5000
          test "$(wc -c < "${parts[3]}")" -eq 5000
          test "$(wc -c < "${parts[4]}")" -eq 956
          cat "${parts[@]}" > /tmp/block3.patch.gz.b64
          base64 -d /tmp/block3.patch.gz.b64 | gzip -t
          base64 -d /tmp/block3.patch.gz.b64 | gzip -d > /tmp/block3.patch
          ACTUAL=$(sha256sum /tmp/block3.patch | awk '{print $1}')
          echo "BLOCK3_FULL_PATCH_SHA256=$ACTUAL"
          test "$ACTUAL" = '5d7c0e258f23252b141603471392e7fb1db11166d4f81a02052197f4129dc8be'
          grep -q '^diff --git a/src/uploadTelemetry.ts b/src/uploadTelemetry.ts' /tmp/block3.patch
          grep -q '^diff --git a/src/UploadCenter.tsx b/src/UploadCenter.tsx' /tmp/block3.patch
          grep -q '^diff --git a/src-tauri/src/youtube.rs b/src-tauri/src/youtube.rs' /tmp/block3.patch
