name: VYRON 2.1.6 Block 3 Verify

on:
  push:
    branches: [verify/vyron-216-block3]
    paths:
      - '.github/workflows/vyron-216-block3-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34793876334'
  BASE_ARTIFACT: VYRON-2.1.4-final-source
  BASE_SOURCE_SHA256: 24ccb1649d91b090dcc5437c66e18c0ae465528423110efe0c1d392397f6fef1
  FEATURE1_PATCH_SHA256: f0dfdb2f9698e59b8a207c7c6b97a75ddabda039ac86c19cd07e89c81117c71f
  FEATURE2_PATCH_SHA256: a76435719952b9478514bd41d62e79df550ccbcadab459e23067de0cc5fb2299
  VERSION_PATCH_SHA256: fd0f4c7cdae36b45946ce62869aa3979a986467b04d5ebe35d2d46281a823be1
  BLOCK1_PATCH_SHA256: 581452bfa868d5b25cde2a4481e6a4a8cf16c512966f2661a71f8d98570d9038
  BLOCK2_PATCH_SHA256: 40cfae87b5f7faa41a9fce3070074876552ec4178817acb03c86ecefdadcc959
  BLOCK3_CANDIDATE_SHA256: 2d5d27a3880a92dd8aa75b123a6756b1741bff14a16c21beb50d9311d9bfb4ad

jobs:
  block3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Restore frozen VYRON 2.1.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p base work decoded out
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-final-source.tar.gz
          test -f "$T"
          test "$(sha256sum "$T" | awk '{print $1}')" = "$BASE_SOURCE_SHA256"
          tar -xzf "$T" -C work
          test "$(node -p "require('./work/package.json').version")" = '2.1.4'

      - name: Reconstruct exact VYRON 2.1.5
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d .github/patches/v215-youtube-productivity/01-global-channel.patch.gz.b64 | gzip -d > decoded/01.patch
          test "$(sha256sum decoded/01.patch | awk '{print $1}')" = "$FEATURE1_PATCH_SHA256"
          shopt -s nullglob
          p2=(.github/patches/v215-youtube-productivity/02-draft-manager.parts/*.patchfrag)
          test "${#p2[@]}" -eq 9
          cat "${p2[@]}" > decoded/02.patch
          test "$(sha256sum decoded/02.patch | awk '{print $1}')" = "$FEATURE2_PATCH_SHA256"
          cp .github/patches/v215-youtube-productivity/03-version-bump.patch decoded/03.patch
          test "$(sha256sum decoded/03.patch | awk '{print $1}')" = "$VERSION_PATCH_SHA256"
          for p in decoded/01.patch decoded/02.patch decoded/03.patch; do
            git apply --check --directory=work "$p"
            git apply --directory=work "$p"
          done
          test "$(node -p "require('./work/package.json').version")" = '2.1.5'

      - name: Apply verified Blocks 1 and 2
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d .github/patches/v216-upload-center/01-ready-video-inventory.patch.gz.b64 | gzip -d > decoded/04-block1.patch
          test "$(sha256sum decoded/04-block1.patch | awk '{print $1}')" = "$BLOCK1_PATCH_SHA256"
          git apply --check --directory=work decoded/04-block1.patch
          git apply --directory=work decoded/04-block1.patch
          shopt -s nullglob
          q=(.github/patches/v216-upload-center/02-multi-channel-upload-queue.parts/*.patchfrag)
          test "${#q[@]}" -eq 6
          cat "${q[@]}" > decoded/05-block2.patch.gz.b64
          base64 -d decoded/05-block2.patch.gz.b64 | gzip -d > decoded/05-block2.patch
          test "$(sha256sum decoded/05-block2.patch | awk '{print $1}')" = "$BLOCK2_PATCH_SHA256"
          git apply --check --directory=work decoded/05-block2.patch
          git apply --directory=work decoded/05-block2.patch
          git apply --check --directory=work .github/patches/v216-upload-center/02b-upload-queue-typescript-fix.patch
          git apply --directory=work .github/patches/v216-upload-center/02b-upload-queue-typescript-fix.patch

      - name: Snapshot exact Block 2 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C work init
          git -C work config user.name 'VYRON CI'
          git -C work config user.email 'vyron-ci@example.invalid'
          git -C work add -A
          git -C work commit -m 'block2 authoritative source'

      - name: Apply Block 3 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          p=(.github/patches/v216-upload-center/03-live-progress.parts/*.patchfrag)
          test "${#p[@]}" -eq 4
          cat "${p[@]}" > decoded/06-block3.patch.gz.b64
          base64 -d decoded/06-block3.patch.gz.b64 | gzip -t
          base64 -d decoded/06-block3.patch.gz.b64 | gzip -d > decoded/06-block3.patch
          ACTUAL=$(sha256sum decoded/06-block3.patch | awk '{print $1}')
          echo "BLOCK3_CANDIDATE_ACTUAL_SHA256=$ACTUAL"
          test "$ACTUAL" = "$BLOCK3_CANDIDATE_SHA256"
          git apply --check --directory=work decoded/06-block3.patch
          git apply --directory=work decoded/06-block3.patch

      - name: Apply minimal test-only TypeScript correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/src/uploadCenterWiring.test.ts')
          s=p.read_text()
          old="readFileSync(new URL(path, import.meta.url), 'utf8')"
          old2='readFileSync(new URL(path, import.meta.url), "utf8")'
          if old in s:
              s=s.replace(old, "readFileSync(new URL(path, import.meta.url).pathname, 'utf8')", 1)
          elif old2 in s:
              s=s.replace(old2, 'readFileSync(new URL(path, import.meta.url).pathname, "utf8")', 1)
          else:
              raise SystemExit('expected readFileSync(URL) helper not found; refusing blind correction')
          p.write_text(s)
          PY
          grep -q "new URL(path, import.meta.url).pathname" work/src/uploadCenterWiring.test.ts

      - name: Canonicalize corrected Block 3 carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C work diff --binary HEAD > out/03-live-progress-and-eta.patch
          test -s out/03-live-progress-and-eta.patch
          sha256sum out/03-live-progress-and-eta.patch | tee out/block3-canonical.sha256
          gzip -n -c out/03-live-progress-and-eta.patch | base64 -w0 > out/03-live-progress-and-eta.patch.gz.b64
          echo >> out/03-live-progress-and-eta.patch.gz.b64

      - name: Install frontend dependencies
        working-directory: work
        run: npm ci

      - name: Block 3 targeted behavioral regression
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test -- \
            src/readyVideoInventory.test.ts \
            src/uploadQueue.test.ts \
            src/youtubeQuotaAtomic.test.ts \
            src/youtubeQuota.test.ts \
            src/youtubeQuotaPlanner.test.ts \
            src/publisherQuota.test.ts \
            src/publisherSchedule.test.ts \
            src/publisherMetadata.test.ts \
            src/uploadTelemetry.test.ts \
            src/uploadCenterWiring.test.ts \
            src/contentRunway.test.ts \
            src/scheduleOnlyContracts.test.ts | tee ../out/block3-tests.txt

      - name: TypeScript
        working-directory: work
        run: npx tsc --noEmit

      - name: Production frontend build
        working-directory: work
        run: npm run build

      - name: Security and telemetry contracts
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RIE 'refresh[_ -]?token\s*[:=]\s*[A-Za-z0-9._-]{12,}|access[_ -]?token\s*[:=]\s*[A-Za-z0-9._-]{12,}|client[_ -]?secret\s*[:=]\s*[A-Za-z0-9._-]{12,}' \
            src/uploadTelemetry.ts src/UploadCenter.tsx src/uploadCenterUi.ts
          grep -q 'api.onYoutubeProgress(applyUploadProgressFact)' src/App.tsx
          ! grep -E 'onYoutubeProgress\([^\n]*patchJob' src/App.tsx
          grep -q 'youtube_active_uploads' src-tauri/src/youtube.rs

      - name: Rust factual upload progress tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path work/src-tauri/Cargo.toml v216_upload_progress_tests -- --nocapture | tee out/block3-rust.txt

      - name: Package verified Block 3 source
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --exclude='./node_modules' --exclude='./.git' -czf out/VYRON-2.1.6-after-block3-source.tar.gz -C work .
          sha256sum out/VYRON-2.1.6-after-block3-source.tar.gz > out/source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.6-block3-evidence
          path: out/*
          retention-days: 30
          if-no-files-found: error
