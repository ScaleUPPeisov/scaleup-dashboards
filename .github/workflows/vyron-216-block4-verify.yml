name: VYRON 2.1.6 Block 4 Verify

on:
  push:
    branches: [verify/vyron-216-block4]
    paths:
      - '.github/workflows/vyron-216-block4-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_RUN: '34793876334'
  BASE_ARTIFACT: VYRON-2.1.4-final-source
  BASE_SOURCE_SHA256: 24ccb1649d91b090dcc5437c66e18c0ae465528423110efe0c1d392397f6fef1
  FEATURE1_PATCH_SHA256: f0dfdb2f9698e59b8a207c7c6b97a75ddabda039ac86c19cd07e89c81117c71f
  FEATURE2_PATCH_SHA256: a76435719952b9478514bd41d62e79df550ccbcadab459e23067de0cc5fb2299
  VERSION_PATCH_SHA256: fd0f4c7cdae36b45946ce62869aa3979a986467b04d5ebe35d2d46281a823be1
  BLOCK1_PATCH_SHA256: 581452bfa868d5b25cde2a4481e6a4a8cf16c512966f2661a71f8d98570d9038
  BLOCK2_PATCH_SHA256: 40cfae87b5f7faa41a9fce3070074876552ec4178817acb03c86ecefdadcc959
  BLOCK3_PATCH_SHA256: 5d7c0e258f23252b141603471392e7fb1db11166d4f81a02052197f4129dc8be
  BLOCK4_PATCH_SHA256: f62d563240fadfec37bf634c7947b545c106020805262f0ac77f8728db2b77a4

jobs:
  block4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Confirm verify branch ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 0e3e608decb7dc40e83c4445947e2e530be13f37 HEAD
          git cat-file -e 0e3e608decb7dc40e83c4445947e2e530be13f37^{commit}

      - name: Restore frozen VYRON 2.1.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p base work decoded out
          gh run download "$BASE_RUN" --repo "$REPO" -n "$BASE_ARTIFACT" -D base
          T=base/VYRON-2.1.4-final-source.tar.gz
          test -f "$T"
          test "$(sha256sum "$T" | awk '{print $1}')" = "$BASE_SOURCE_SHA256"
          tar -xzf "$T" -C work
          test "$(node -p "require('./work/package.json').version")" = '2.1.4'

      - name: Reconstruct exact VYRON 2.1.5
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d .github/patches/v215-youtube-productivity/01-global-channel.patch.gz.b64 | gzip -d > decoded/01.patch
          test "$(sha256sum decoded/01.patch | awk '{print $1}')" = "$FEATURE1_PATCH_SHA256"
          shopt -s nullglob
          p2=(.github/patches/v215-youtube-productivity/02-draft-manager.parts/*.patchfrag)
          test "${#p2[@]}" -eq 9
          cat "${p2[@]}" > decoded/02.patch
          test "$(sha256sum decoded/02.patch | awk '{print $1}')" = "$FEATURE2_PATCH_SHA256"
          cp .github/patches/v215-youtube-productivity/03-version-bump.patch decoded/03.patch
          test "$(sha256sum decoded/03.patch | awk '{print $1}')" = "$VERSION_PATCH_SHA256"
          for p in decoded/01.patch decoded/02.patch decoded/03.patch; do
            git apply --check --directory=work "$p"
            git apply --directory=work "$p"
          done
          test "$(node -p "require('./work/package.json').version")" = '2.1.5'

      - name: Apply verified Blocks 1 and 2
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d .github/patches/v216-upload-center/01-ready-video-inventory.patch.gz.b64 | gzip -d > decoded/04-block1.patch
          test "$(sha256sum decoded/04-block1.patch | awk '{print $1}')" = "$BLOCK1_PATCH_SHA256"
          git apply --check --directory=work decoded/04-block1.patch
          git apply --directory=work decoded/04-block1.patch
          shopt -s nullglob
          q=(.github/patches/v216-upload-center/02-multi-channel-upload-queue.parts/*.patchfrag)
          test "${#q[@]}" -eq 6
          cat "${q[@]}" > decoded/05-block2.patch.gz.b64
          base64 -d decoded/05-block2.patch.gz.b64 | gzip -d > decoded/05-block2.patch
          test "$(sha256sum decoded/05-block2.patch | awk '{print $1}')" = "$BLOCK2_PATCH_SHA256"
          git apply --check --directory=work decoded/05-block2.patch
          git apply --directory=work decoded/05-block2.patch
          git apply --check --directory=work .github/patches/v216-upload-center/02b-upload-queue-typescript-fix.patch
          git apply --directory=work .github/patches/v216-upload-center/02b-upload-queue-typescript-fix.patch

      - name: Apply authoritative persisted Block 3
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d .github/patches/v216-upload-center/03-live-progress-and-eta.patch.gz.b64 | gzip -t
          base64 -d .github/patches/v216-upload-center/03-live-progress-and-eta.patch.gz.b64 | gzip -d > decoded/06-block3.patch
          ACTUAL=$(sha256sum decoded/06-block3.patch | awk '{print $1}')
          echo "BLOCK3_ACTUAL_SHA256=$ACTUAL"
          test "$ACTUAL" = "$BLOCK3_PATCH_SHA256"
          git apply --check --directory=work decoded/06-block3.patch
          git apply --directory=work decoded/06-block3.patch
          test -f work/src/uploadTelemetry.ts
          test -f work/src/UploadCenter.tsx
          test -f work/src/uploadCenterWiring.test.ts

      - name: Snapshot exact Block 3 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C work init
          git -C work config user.name 'VYRON CI'
          git -C work config user.email 'vyron-ci@example.invalid'
          git -C work add -A
          git -C work commit -m 'block3 authoritative source'

      - name: Verify and apply Block 4 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d .github/patches/v216-stale-reconciliation/04-stale-operation-reconciliation.patch.gz.b64 | gzip -t
          base64 -d .github/patches/v216-stale-reconciliation/04-stale-operation-reconciliation.patch.gz.b64 | gzip -d > decoded/07-block4.patch
          ACTUAL=$(sha256sum decoded/07-block4.patch | awk '{print $1}')
          echo "BLOCK4_ACTUAL_SHA256=$ACTUAL"
          test "$ACTUAL" = "$BLOCK4_PATCH_SHA256"
          git apply --check --directory=work decoded/07-block4.patch
          git apply --directory=work decoded/07-block4.patch
          git -C work diff --check

      - name: Install frontend dependencies
        working-directory: work
        run: npm ci

      - name: Block 4 targeted behavioral regression
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test -- \
            src/activeOperationFacts.test.ts \
            src/staleOperationReconciliation.test.ts \
            src/staleOperationWiring.test.ts \
            src/updaterGuard.test.ts \
            src/uploadTelemetry.test.ts \
            src/uploadCenterWiring.test.ts \
            src/uploadQueue.test.ts \
            src/youtubeQuotaAtomic.test.ts \
            src/youtubeQuota.test.ts \
            src/youtubeQuotaPlanner.test.ts \
            src/publisherQuota.test.ts \
            src/readyVideoInventory.test.ts \
            src/contentRunway.test.ts \
            src/scheduleOnlyContracts.test.ts \
            src/updaterRuntime.test.ts \
            src/updaterPolicy.test.ts | tee ../out/block4-tests.txt

      - name: TypeScript
        working-directory: work
        run: npx tsc --noEmit

      - name: Production frontend build
        working-directory: work
        run: npm run build

      - name: Block 4 security and lifecycle assertions
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RIE 'refresh[_ -]?token\s*[:=]\s*[A-Za-z0-9._-]{12,}|access[_ -]?token\s*[:=]\s*[A-Za-z0-9._-]{12,}|client[_ -]?secret\s*[:=]\s*[A-Za-z0-9._-]{12,}' \
            src/activeOperationFacts.ts src/renderRuntimeEvidence.ts src/staleOperationReconciliation.ts src/updaterGuard.ts
          grep -q 'factualActiveOperationCounts' src/updaterGuard.ts
          ! grep -q "jobs.filter(x=>x.status==='UPLOADING')" src/updaterGuard.ts
          ! grep -q "jobs.filter(x=>x.status==='RENDERING')" src/updaterGuard.ts
          grep -q 'api.youtubeUploadSessions()' src/App.tsx
          grep -q 'scanFactualRenderRuntime' src/ProductionStatusBridge.tsx
          grep -q 'scanFactualRenderRuntime(settings.workspace,channels)' src/ProductionOS.tsx
          grep -q "status:'READY_RENDER'" src/staleOperationReconciliation.ts
          grep -q "storageLifecycle:'UPLOADING'" src/staleOperationReconciliation.ts
          ! grep -Eq "status:'(SUCCESS|UPLOADED|PUBLISHED|READY_UPLOAD)'" src/staleOperationReconciliation.ts
          ! grep -Ei '(unlink|rmSync|removeFile|deleteJobFolder|trash|deleteProject)' src/staleOperationReconciliation.ts
          grep -q "production bug: 16 persisted renders + 1 upload with zero factual work does not block" src/updaterGuard.test.ts
          grep -q "10 stale uploads + 1 factual upload displays exactly one" src/updaterGuard.test.ts
          grep -q "16 stale renders + one factual render displays exactly one" src/updaterGuard.test.ts

      - name: Rust factual upload progress regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path work/src-tauri/Cargo.toml v216_upload_progress_tests -- --nocapture | tee out/block4-rust.txt

      - name: Canonicalize verified Block 4 carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C work add -N .
          git -C work diff --binary HEAD > out/04-stale-operation-reconciliation.patch
          test -s out/04-stale-operation-reconciliation.patch
          sha256sum out/04-stale-operation-reconciliation.patch | tee out/block4-final.sha256
          gzip -n -c out/04-stale-operation-reconciliation.patch | base64 -w0 > out/04-stale-operation-reconciliation.patch.gz.b64
          echo >> out/04-stale-operation-reconciliation.patch.gz.b64

      - name: Package verified Block 4 source
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --exclude='./node_modules' --exclude='./.git' --exclude='./src-tauri/target' -czf out/VYRON-2.1.6-after-block4-source.tar.gz -C work .
          sha256sum out/VYRON-2.1.6-after-block4-source.tar.gz > out/source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.6-block4-evidence
          path: out/*
          retention-days: 30
          if-no-files-found: error
