name: VYRON 2.1.6 Direct Stable Release

on:
  push:
    branches: [release/vyron-2.1.6]
    paths: ['.github/workflows/vyron-216-direct-release.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-216-direct-stable-release
  cancel-in-progress: false

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.6'
  TAG: v2.1.6
  SOURCE_COMMIT: 1c2da4866c90a353f8ca4e9d97702ffddb74e853
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  release:
    name: test -> build ARM64 -> publish v2.1.6 -> activate updater
    runs-on: macos-14
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          pkg=json.load(open('package.json'))
          lock=json.load(open('package-lock.json'))
          conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=open('src-tauri/Cargo.toml').read()
          assert pkg['version']=='2.1.6'
          assert lock['version']=='2.1.6'
          assert lock['packages']['']['version']=='2.1.6'
          assert conf['version']=='2.1.6'
          assert conf['identifier']=='studio.channelflow.desktop'
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']==__import__('os').environ['EMBEDDED_UPDATER_KEY']
          assert re.search(r'(?m)^version\s*=\s*"2\.1\.6"\s*$', cargo)
          seen={}
          collisions=[]
          for root in [Path('src'),Path('src-tauri')]:
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  key=str(p).lower()
                  prev=seen.get(key)
                  if prev and prev != str(p):
                      collisions.append((prev,str(p)))
                  else:
                      seen[key]=str(p)
          if collisions:
              raise SystemExit('case-colliding paths: '+repr(collisions))
          print('case-collision guard: PASS')
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"; exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 1
          fi
          CURRENT=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          test "$CURRENT" = '2.1.5'

      - name: Install dependencies and run final tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          python3 - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip()
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          if raw.startswith('untrusted comment:'):
              box=raw; encoded=base64.b64encode(raw.encode()).decode()
          else:
              once=dec(raw)
              if once and once.startswith('untrusted comment:'):
                  box=once; encoded=raw
              else:
                  twice=dec(once) if once else None
                  if not (twice and twice.startswith('untrusted comment:')):
                      raise SystemExit('invalid TAURI signing key encoding')
                  box=twice; encoded=once.strip()
          if 'secret key' not in box.splitlines()[0].lower():
              raise SystemExit('TAURI signing key is not a secret key')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TAURI_SIGNING_PRIVATE_KEY='+encoded+'\n')
          print('::add-mask::'+encoded)
          PY

      - name: Build production ARM64 DMG and updater
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p production
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP"
          test -s "$DMG"
          test -s "$UPDATER"
          test -s "$SIG"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64
          otool -hv "$APP/Contents/MacOS/$EXECUTABLE" | grep -q ARM64
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          cp "$DMG" production/VYRON-2.1.6-arm64.dmg
          cp "$UPDATER" production/VYRON.app.tar.gz
          cp "$SIG" production/VYRON.app.tar.gz.sig
          shasum -a 256 production/VYRON-2.1.6-arm64.dmg > production/VYRON-2.1.6-arm64.dmg.sha256
          shasum -a 256 production/VYRON.app.tar.gz > production/VYRON.app.tar.gz.sha256

      - name: Finder-like launch from DMG
        shell: bash
        run: |
          set -Eeuo pipefail
          MOUNT="$RUNNER_TEMP/vyron216-mount"
          rm -rf "$MOUNT"; mkdir -p "$MOUNT"
          hdiutil attach production/VYRON-2.1.6-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          APP="$MOUNT/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$APP/Contents/MacOS/$EXECUTABLE" > /tmp/vyron216-launch.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 "$PID" 2>/dev/null
          kill "$PID" || true
          wait "$PID" || true
          hdiutil detach "$MOUNT"
          trap - EXIT

      - name: Create updater manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY'
          import json,os,pathlib
          sig=pathlib.Path('production/VYRON.app.tar.gz.sig').read_text().strip()
          d={
            'version':'2.1.6',
            'notes':'VYRON 2.1.6 — Ready Video Inventory, multi-channel upload queue, live upload progress/ETA, Upload Center and stale operation reconciliation',
            'pub_date':os.environ['PUB_DATE'],
            'platforms':{
              'darwin-aarch64':{
                'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.6/VYRON.app.tar.gz',
                'signature':sig,
              }
            }
          }
          pathlib.Path('production/latest.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish GitHub Release v2.1.6
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## VYRON 2.1.6

          - Ready Video Inventory по каналам и конкретным MP4.
          - Multi-channel upload queue с изоляцией каналов/OAuth.
          - Live upload progress: bytes, speed, elapsed, ETA и ожидаемое время завершения.
          - Global Upload Center и глобальный индикатор загрузки.
          - Reconciliation зависших UPLOADING/RENDERING и factual updater blocker.
          - Исправления регрессий и контрактов 2.1.5 → 2.1.6.
          EOF
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$SOURCE_COMMIT" \
            --title "VYRON 2.1.6" \
            --notes-file /tmp/release-notes.md \
            production/VYRON-2.1.6-arm64.dmg \
            production/VYRON-2.1.6-arm64.dmg.sha256 \
            production/VYRON.app.tar.gz \
            production/VYRON.app.tar.gz.sha256 \
            production/VYRON.app.tar.gz.sig \
            production/latest.json

      - name: Verify published assets
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,targetCommitish,assets > /tmp/release.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/release.json'))
          assert d['tagName']=='v2.1.6'
          assert d['isDraft'] is False
          assert d['isPrerelease'] is False
          assert d['targetCommitish']=='1c2da4866c90a353f8ca4e9d97702ffddb74e853'
          names={a['name'] for a in d['assets']}
          required={'VYRON-2.1.6-arm64.dmg','VYRON-2.1.6-arm64.dmg.sha256','VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig','latest.json'}
          assert required <= names
          PY

      - name: Activate stable updater feed on main
        shell: bash
        run: |
          set -Eeuo pipefail
          FEED_SHA=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .sha)
          B64=$(base64 < production/latest.json | tr -d '\n')
          gh api --method PUT "repos/$REPO/contents/vyron-updates/latest.json" \
            -f message='release: publish VYRON 2.1.6 updater feed' \
            -f content="$B64" \
            -f sha="$FEED_SHA" \
            -f branch=main >/tmp/feed-update.json

      - name: Final public verification
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode > /tmp/latest.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/latest.json'))
          assert d['version']=='2.1.6'
          p=d['platforms']['darwin-aarch64']
          assert p['url']=='https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.6/VYRON.app.tar.gz'
          assert p['signature']==pathlib.Path('production/VYRON.app.tar.gz.sig').read_text().strip()
          PY
          echo 'VYRON_2_1_6_STABLE_RELEASED=YES'
