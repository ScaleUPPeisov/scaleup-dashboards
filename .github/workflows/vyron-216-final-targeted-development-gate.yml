name: VYRON 2.1.6 Final Targeted Development Gate

on:
  push:
    branches: [verify/vyron-216-final-targeted]
    paths:
      - '.github/workflows/vyron-216-final-targeted-development-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  EXPECTED_RELEASE_HEAD: 0ea023831aaa1c8524e2b851543b1ac80b6c0cc9
  EXPECTED_RELEASE_TREE: 0c9994df6e691da640d97a567931abb5af2b691d
  BLOCK4_VERIFY_RUN: '34915210329'
  BLOCK4_ARTIFACT: VYRON-2.1.6-block4-evidence
  BLOCK4_SOURCE_SHA256: 408aa51de972c0f4c0ed2d4400ece0121c44e497ae8693518f80514117d3b1e4
  ERROR_CENTER_PATCH_SHA256: 485f30067c9999b95d761645916adc3ce69d0e32ffb418db347fc51ce7a20e49
  TEST_CONTRACT_PATCH_SHA256: 7c382132cec2306ab6941a199a5c9d38ae8a2b79c4a74ee270aec664adc7a1d2
  TEST_SYNTAX_PATCH_SHA256: 0f028ac1eda29c40c3602cc3891a944187f109094f1142a0a0e011e5554d4973
  VERSION_PATCH_SHA256: 032e5e77c3c6f30cccb6ada5f2d905e2f63964d6c61cf0a019ed9ef77d489005

jobs:
  final-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout authoritative release carriers
        uses: actions/checkout@v4
        with:
          ref: release/vyron-2.1.6
          fetch-depth: 0

      - name: Verify authoritative release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_RELEASE_TREE"
          git merge-base --is-ancestor 426e2ba81af12b7e6a74f8f5ee2a6aac1a9b916d HEAD
          test -f .github/patches/v216-final-fix/05-error-center-queued-failures.patch.gz.b64
          test -f .github/patches/v216-final-fix/06-test-contracts.patch.gz.b64
          test -f .github/patches/v216-final-fix/07-test-contract-syntax.patch.gz.b64
          test -f .github/patches/v216-final-six/06-version-bump.patch
          printf 'FINAL_RELEASE_HEAD=%s\nFINAL_RELEASE_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux Tauri dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Reconstruct exact final 2.1.6 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work evidence decoded out
          gh run download "$BLOCK4_VERIFY_RUN" --repo "$REPO" -n "$BLOCK4_ARTIFACT" -D evidence
          S=evidence/VYRON-2.1.6-after-block4-source.tar.gz
          test -f "$S"
          test "$(sha256sum "$S" | awk '{print $1}')" = "$BLOCK4_SOURCE_SHA256"
          tar -xzf "$S" -C work
          test "$(node -p "require('./work/package.json').version")" = '2.1.5'

          base64 -d .github/patches/v216-final-fix/05-error-center-queued-failures.patch.gz.b64 | gzip -t
          base64 -d .github/patches/v216-final-fix/05-error-center-queued-failures.patch.gz.b64 | gzip -d > decoded/05-error-center.patch
          test "$(sha256sum decoded/05-error-center.patch | awk '{print $1}')" = "$ERROR_CENTER_PATCH_SHA256"
          git apply --check --directory=work decoded/05-error-center.patch
          git apply --directory=work decoded/05-error-center.patch

          base64 -d .github/patches/v216-final-fix/06-test-contracts.patch.gz.b64 | gzip -t
          base64 -d .github/patches/v216-final-fix/06-test-contracts.patch.gz.b64 | gzip -d > decoded/06-test-contracts.patch
          test "$(sha256sum decoded/06-test-contracts.patch | awk '{print $1}')" = "$TEST_CONTRACT_PATCH_SHA256"
          git apply --check --directory=work decoded/06-test-contracts.patch
          git apply --directory=work decoded/06-test-contracts.patch

          base64 -d .github/patches/v216-final-fix/07-test-contract-syntax.patch.gz.b64 | gzip -t
          base64 -d .github/patches/v216-final-fix/07-test-contract-syntax.patch.gz.b64 | gzip -d > decoded/07-test-syntax.patch
          test "$(sha256sum decoded/07-test-syntax.patch | awk '{print $1}')" = "$TEST_SYNTAX_PATCH_SHA256"
          git apply --check --directory=work decoded/07-test-syntax.patch
          git apply --directory=work decoded/07-test-syntax.patch

          cp .github/patches/v216-final-six/06-version-bump.patch decoded/08-version.patch
          test "$(sha256sum decoded/08-version.patch | awk '{print $1}')" = "$VERSION_PATCH_SHA256"
          git apply --check --directory=work decoded/08-version.patch
          git apply --directory=work decoded/08-version.patch

          test "$(node -p "require('./work/package.json').version")" = '2.1.6'
          grep -q '^version = "2.1.6"' work/src-tauri/Cargo.toml
          grep -q '"version": "2.1.6"' work/src-tauri/tauri.conf.json
          grep -q '"identifier": "studio.channelflow.desktop"' work/src-tauri/tauri.conf.json

          sha256sum decoded/05-error-center.patch decoded/06-test-contracts.patch decoded/07-test-syntax.patch decoded/08-version.patch | tee out/final-patch-sha256.txt
          printf 'RELEASE_RECONSTRUCTION=PASS\nFINAL_RELEASE_HEAD=%s\nFINAL_RELEASE_TREE=%s\nVERSION=2.1.6\n' "$EXPECTED_RELEASE_HEAD" "$EXPECTED_RELEASE_TREE" | tee out/reconstruction.txt

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C work . | gzip -n > out/VYRON-2.1.6-final-source.tar.gz
          sha256sum out/VYRON-2.1.6-final-source.tar.gz | tee out/source-sha256.txt

      - name: Install frontend dependencies
        working-directory: work
        run: npm ci

      - name: Full frontend behavioral suite exact 438
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test 2>&1 | tee ../out/frontend-tests.txt
          python3 - <<'PY'
          import pathlib,re,sys
          s=pathlib.Path('../out/frontend-tests.txt').read_text(errors='replace')
          s=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',s)
          files_ok=bool(re.search(r'Test Files\s+79 passed\s+\(79\)',s))
          tests_ok=bool(re.search(r'Tests\s+438 passed\s+\(438\)',s))
          if not files_ok or not tests_ok:
              print(f'FRONTEND_COUNT_ASSERTION_FAILED files_ok={files_ok} tests_ok={tests_ok}',file=sys.stderr)
              sys.exit(1)
          print('FRONTEND=438/438 PASS')
          PY

      - name: TypeScript
        working-directory: work
        run: npx tsc --noEmit

      - name: Production frontend build
        working-directory: work
        run: npm run build

      - name: Final algorithm Error Center and security invariants
        working-directory: work
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'api.onYoutubeProgress(applyUploadProgressFact)' src/App.tsx
          ! grep -Eq 'onYoutubeProgress.*patchJob|patchJob.*onYoutubeProgress' src/App.tsx
          grep -q '<GlobalUploadIndicator/><UploadCenterGlobal/>' src/App.tsx
          grep -q 'bytesUploaded' src/uploadTelemetry.ts
          grep -q 'etaSeconds' src/uploadTelemetry.ts
          grep -q 'subscribeUploadQueue' src/UploadCenter.tsx
          grep -q 'removeQueuedUpload' src/uploadQueueRuntime.ts
          grep -q 'factualActiveOperationCounts' src/updaterGuard.ts
          ! grep -q "jobs.filter(x=>x.status==='UPLOADING')" src/updaterGuard.ts
          ! grep -q "jobs.filter(x=>x.status==='RENDERING')" src/updaterGuard.ts
          grep -q 'api.youtubeUploadSessions()' src/App.tsx
          grep -q 'scanFactualRenderRuntime' src/ProductionStatusBridge.tsx
          grep -q 'scanFactualRenderRuntime(settings.workspace,channels)' src/ProductionOS.tsx
          grep -q "status:'READY_RENDER'" src/staleOperationReconciliation.ts
          grep -q "storageLifecycle:'UPLOADING'" src/staleOperationReconciliation.ts
          ! grep -Eq "status:'(SUCCESS|UPLOADED|PUBLISHED|READY_UPLOAD)'" src/staleOperationReconciliation.ts
          ! grep -Ei '(unlink|rmSync|removeFile|deleteJobFolder|deleteProject)' src/staleOperationReconciliation.ts
          grep -q 'const YOUTUBE_UPLOAD_CHUNK_BYTES: usize = 8 \* 1024 \* 1024' src-tauri/src/youtube.rs
          grep -q 'youtube_active_uploads' src-tauri/src/youtube.rs
          grep -q 'api.writeJobMetadata' src/uploadQueueRuntime.ts
          grep -q 'api.youtubeUpload' src/uploadQueueRuntime.ts
          grep -q 'if(uploaded.verified===false)throw' src/uploadQueueRuntime.ts
          grep -q 'recordVerifiedUpload' src/uploadQueueRuntime.ts
          grep -q 'appendErrorHistory(safeTitle,safeMessage,safeDetail' src/uploadQueueRuntime.ts
          grep -q 'notifyError(safeTitle,safeMessage' src/uploadQueueRuntime.ts
          grep -q 'persistError:false' src/uploadQueueRuntime.ts
          grep -q 'profileId:spec.profileId,channelId:spec.channelId' src/uploadQueueRuntime.ts
          grep -q 'redactSensitive' src/uploadQueueRuntime.ts
          ! grep -RIE 'refresh[_ -]?token\s*[:=]\s*[A-Za-z0-9._-]{12,}|access[_ -]?token\s*[:=]\s*[A-Za-z0-9._-]{12,}|client[_ -]?secret\s*[:=]\s*[A-Za-z0-9._-]{12,}' src/activeOperationFacts.ts src/renderRuntimeEvidence.ts src/staleOperationReconciliation.ts src/updaterGuard.ts src/uploadTelemetry.ts src/UploadCenter.tsx src/uploadQueueRuntime.ts
          echo 'SECURITY_CONTRACTS=PASS' | tee ../out/security-invariants.txt

      - name: Full Rust test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path work/src-tauri/Cargo.toml -- --nocapture 2>&1 | tee out/rust-tests.txt

      - name: Final development summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo 'FRONTEND=438/438 PASS'
            echo 'TYPESCRIPT=PASS'
            echo 'PRODUCTION_BUILD=PASS'
            echo 'RUST_REQUIRED=PASS'
            echo 'SECURITY_CONTRACTS=PASS'
            echo 'RELEASE_RECONSTRUCTION=PASS'
            echo 'FEATURE_SET_COMPLETE=YES'
            echo 'TARGETED_GREEN=YES'
            echo 'RELEASE_READY=YES'
            echo 'DEVELOPMENT_FREEZE=YES'
            echo "FINAL_HEAD=$EXPECTED_RELEASE_HEAD"
            echo "FINAL_TREE=$EXPECTED_RELEASE_TREE"
          } | tee out/final-summary.txt

      - name: Upload immutable final source and evidence
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.6-final-source
          path: out/*
          retention-days: 90
          if-no-files-found: error
