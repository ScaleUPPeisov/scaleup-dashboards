name: VYRON 2.1.6 Acceptance Targeted Diagnostic
on:
  push:
    branches: [acceptance/vyron-2.1.6-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run full frontend suite verbosely to expose exact failures
        run: npx vitest run --reporter=verbose
