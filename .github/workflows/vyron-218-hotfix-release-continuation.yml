name: VYRON 2.1.8 Hotfix Release Continuation

on:
  push:
    branches: [hotfix/vyron-command-center-black-screen]
    paths: ['.github/workflows/vyron-218-hotfix-release-continuation.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-218-release-continuation
  cancel-in-progress: false

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.8'
  TAG: v2.1.8
  HOTFIX_SOURCE: c28da0dd5061f921b7c55bfd5177fe2ee4286b71
  PRODUCT_SOURCE: c6e95c53c7d9da3be59b6f2dd3c751469e3936bd
  PRODUCT_TREE: 17aebb5fbadeca14c8ea80757c03730fc806c42e
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1ZHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  continue-release:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout exact accepted 2.1.8 source
        uses: actions/checkout@v4
        with:
          ref: c6e95c53c7d9da3be59b6f2dd3c751469e3936bd
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Safety preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git rev-parse HEAD^)" = "$HOTFIX_SOURCE"
          test "$(node -p "require('./package.json').version")" = '2.1.8'
          test "$(gh release view v2.1.7 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = '0e511c8a42cf4e3232cb8d0384a1625664a33cdf'
          test "$(gh release view v2.1.6 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = '1c2da4866c90a353f8ca4e9d97702ffddb74e853'
          ! git ls-remote --exit-code --tags origin refs/tags/v2.1.8 >/dev/null 2>&1
          ! gh release view v2.1.8 --repo "$REPO" >/dev/null 2>&1
          CURRENT=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          test "$CURRENT" = '2.1.7'
          echo 'SAFETY_PREFLIGHT=PASS'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fixed production Command Center smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          cat > .vyron-cc-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.addInitScript(()=>{
            const channels=Array.from({length:31},(_,i)=>({id:`c${i+1}`,name:`Channel ${String(i+1).padStart(2,'0')}`,slug:`channel-${i+1}`,cadenceDays:4,targetBufferDays:60,publishHour:18,publishMinute:0,language:'EN',genre:'Music',country:'US',minTracks:10,targetDurationMin:120,enabled:true,seo:{titlePatterns:['{topic}'],descriptionTemplate:'{title}',tags:[],banned:[]}}));
            const state={version:8,channels,jobs:[],competitors:[],settings:{workspace:'/tmp/vyron218',endlumePath:'',youtubeApiKey:'',autoCheckUpdates:false,reduceMotion:false,fpsMonitor:false,autopilotMode:'off',autopilotEnabled:false,autoCreatePlan:true,autoAssignMusic:true,autoAssignImages:true,autoGenerateMetadata:false,autoQueueRender:true,autoOpenEndlume:false,autoUploadYoutube:false,autopilotIntervalSec:30,tracksPerVideo:10,openaiApiKey:'',openaiModel:'',youtubeOAuthClientId:'',youtubeCategoryId:'10',youtubeIntelligenceAutoRefresh:false,youtubeIntelligenceRefreshMin:30,youtubePublishSafeMode:true,youtubeUploadConcurrency:2,competitorRpmLow:1.2,competitorRpmHigh:4,competitorPoolSize:30,publishedVideoCleanupPolicy:'ask',completedProjectCleanupPolicy:'ask',endlumeTargetDurationMin:120,endlumeTargetRenderSec:35,endlumeTargetFileMinMb:700,endlumeTargetFileMaxMb:1000,endlumePreserveImageQuality:true,endlumeProjectNaming:'VIDEO_{number}'},logs:[],uploadHistory:[],fingerprintCache:{},projectLifecycle:{}};
            localStorage.setItem('vyron:channel-runway:v1',JSON.stringify({version:1,channels:Object.fromEntries(channels.map((c,i)=>[c.id,{channelId:c.id,scheduledVideoCount:i%2?0:undefined,status:i%3?'no-data':undefined,priority:'unknown'}]))}));
            let cb=1;
            window.__TAURI_INTERNALS__={transformCallback(fn){const id=cb++;window[`_${id}`]=fn;return id},async invoke(cmd){if(cmd==='load_state')return state;if(cmd==='save_state')return {ok:true};if(cmd==='license_status')return {valid:true};if(cmd==='default_workspace')return '/tmp/vyron218';if(cmd==='youtube_active_uploads'||cmd==='youtube_upload_sessions'||cmd==='youtube_oauth_profiles')return [];if(cmd==='youtube_google_config_status')return {configured:false,hasSecret:false,hasApiKey:false};if(cmd.includes('version'))return '2.1.8';if(cmd.includes('plugin:event|listen'))return 1;if(cmd.includes('plugin:event|unlisten'))return null;if(cmd.includes('plugin:updater|check'))return null;if(cmd.includes('plugin:notification|is_permission_granted'))return false;return null},metadata:{currentWindow:{label:'main'},currentWebview:{label:'main',windowLabel:'main'}}};
          });
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:'Главная',exact:true}).waitFor({timeout:15000});
          for(let i=0;i<5;i++){
            await page.getByRole('button',{name:'Главная',exact:true}).click();
            await page.getByRole('button',{name:'Командный центр',exact:true}).click();
            await page.getByText('КОМАНДНЫЙ ЦЕНТР',{exact:true}).waitFor();
            if(!(await page.locator('.pageWrap').innerText()).trim())throw new Error('COMMAND_CENTER_EMPTY');
            await page.getByRole('button',{name:'Главная',exact:true}).click();
          }
          await page.getByRole('button',{name:'Каналы',exact:true}).click();
          await page.getByText('Каналы',{exact:true}).first().waitFor();
          await page.getByRole('button',{name:'Главная',exact:true}).click();
          await page.getByRole('button',{name:'Командный центр',exact:true}).click();
          await page.getByText('КОМАНДНЫЙ ЦЕНТР',{exact:true}).waitFor();
          if(errors.length)throw new Error('RUNTIME_ERRORS:'+errors.join(' | '));
          console.log('ROUTE_SMOKE=PASS');
          console.log('COMMAND_CENTER_PRODUCTION=PASS');
          await browser.close();
          JS
          (npx vite preview --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 & echo $! >/tmp/preview.pid)
          trap 'kill $(cat /tmp/preview.pid) >/dev/null 2>&1 || true; rm -f .vyron-cc-smoke.mjs' EXIT
          for i in {1..60}; do if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi; sleep 0.2; done
          curl -fsS http://127.0.0.1:4173 >/dev/null
          node ./.vyron-cc-smoke.mjs
          kill $(cat /tmp/preview.pid) >/dev/null 2>&1 || true
          rm -f .vyron-cc-smoke.mjs
          trap - EXIT

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          python3 - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip()
          def dec(v):
            try:return base64.b64decode(v.strip(),validate=True).decode()
            except Exception:return None
          if raw.startswith('untrusted comment:'): box=raw; encoded=base64.b64encode(raw.encode()).decode()
          else:
            once=dec(raw)
            if once and once.startswith('untrusted comment:'): box=once; encoded=raw
            else:
              twice=dec(once) if once else None
              if not (twice and twice.startswith('untrusted comment:')): raise SystemExit('invalid signing key')
              box=twice; encoded=once.strip()
          if 'secret key' not in box.splitlines()[0].lower(): raise SystemExit('not a secret key')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+encoded+'\n')
          print('::add-mask::'+encoded)
          PY

      - name: Build ARM64 production artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p production
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.8'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          cp "$DMG" production/VYRON-2.1.8-arm64.dmg
          cp "$UPDATER" production/VYRON.app.tar.gz
          cp "$SIG" production/VYRON.app.tar.gz.sig
          DMG_SHA=$(shasum -a 256 production/VYRON-2.1.8-arm64.dmg | awk '{print $1}')
          UPDATER_SHA=$(shasum -a 256 production/VYRON.app.tar.gz | awk '{print $1}')
          echo "$DMG_SHA  VYRON-2.1.8-arm64.dmg" > production/VYRON-2.1.8-arm64.dmg.sha256
          echo "$UPDATER_SHA  VYRON.app.tar.gz" > production/VYRON.app.tar.gz.sha256
          echo "DMG_SHA256=$DMG_SHA"
          echo "UPDATER_SHA256=$UPDATER_SHA"
          echo 'ARM64_BUILD=PASS'; echo 'CODESIGN=PASS'; echo 'DMG_VERIFY=PASS'

      - name: Verify updater signature with embedded public key
        shell: bash
        run: |
          set -Eeuo pipefail
          brew install minisign
          printf '%s' "$EMBEDDED_UPDATER_KEY" | base64 --decode >/tmp/vyron.pub
          base64 --decode < production/VYRON.app.tar.gz.sig >/tmp/vyron.sig
          minisign -Vm production/VYRON.app.tar.gz -p /tmp/vyron.pub -x /tmp/vyron.sig
          echo 'UPDATER_SIGNATURE=VERIFIED'; echo 'PUBLIC_KEY_CHANGED=NO'

      - name: Finder-like native launch from DMG
        shell: bash
        run: |
          set -Eeuo pipefail
          MOUNT="$RUNNER_TEMP/vyron218-mount"; rm -rf "$MOUNT"; mkdir -p "$MOUNT"
          hdiutil attach production/VYRON-2.1.8-arm64.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          APP="$MOUNT/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.8'
          codesign --verify --deep --strict --verbose=2 "$APP"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$APP/Contents/MacOS/$EXECUTABLE" >/tmp/vyron218-native.log 2>&1 &
          PID=$!; sleep 8; kill -0 "$PID"; kill "$PID" || true; wait "$PID" || true
          hdiutil detach "$MOUNT"; trap - EXIT
          echo 'FINDER_LAUNCH=PASS'

      - name: Create updater manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY'
          import json,os,pathlib
          sig=pathlib.Path('production/VYRON.app.tar.gz.sig').read_text().strip()
          d={'version':'2.1.8','notes':'VYRON 2.1.8 — Command Center black-screen hotfix, render-path restoration and legacy Channel Runway normalization. Regression fixes only.','pub_date':os.environ['PUB_DATE'],'platforms':{'darwin-aarch64':{'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.8/VYRON.app.tar.gz','signature':sig}}}
          pathlib.Path('production/latest.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish GitHub Release v2.1.8
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 2.1.8

          - Исправлен чёрный экран Командного центра.
          - Восстановлен правильный render path Command Center.
          - Добавлена безопасная нормализация legacy Channel Runway state.
          - Исправлен crash при отсутствующем channelName.
          - Regression fixes only.
          EOF
          gh release create "$TAG" --repo "$REPO" --target "$PRODUCT_SOURCE" --title 'VYRON 2.1.8' --notes-file /tmp/release-notes.md \
            production/VYRON-2.1.8-arm64.dmg production/VYRON-2.1.8-arm64.dmg.sha256 \
            production/VYRON.app.tar.gz production/VYRON.app.tar.gz.sha256 production/VYRON.app.tar.gz.sig production/latest.json

      - name: Verify published assets and hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release view v2.1.8 --repo "$REPO" --json tagName,isDraft,isPrerelease,targetCommitish,assets >/tmp/release218.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/release218.json'))
          assert d['tagName']=='v2.1.8' and not d['isDraft'] and not d['isPrerelease']
          assert d['targetCommitish']==os.environ['PRODUCT_SOURCE']
          names={a['name'] for a in d['assets']}
          assert {'VYRON-2.1.8-arm64.dmg','VYRON-2.1.8-arm64.dmg.sha256','VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig','latest.json'}<=names
          PY
          mkdir -p /tmp/published218
          gh release download v2.1.8 --repo "$REPO" --dir /tmp/published218 --pattern 'VYRON-2.1.8-arm64.dmg' --pattern 'VYRON.app.tar.gz' --pattern 'VYRON.app.tar.gz.sig'
          test "$(shasum -a 256 production/VYRON-2.1.8-arm64.dmg | awk '{print $1}')" = "$(shasum -a 256 /tmp/published218/VYRON-2.1.8-arm64.dmg | awk '{print $1}')"
          test "$(shasum -a 256 production/VYRON.app.tar.gz | awk '{print $1}')" = "$(shasum -a 256 /tmp/published218/VYRON.app.tar.gz | awk '{print $1}')"
          cmp production/VYRON.app.tar.gz.sig /tmp/published218/VYRON.app.tar.gz.sig
          base64 --decode < /tmp/published218/VYRON.app.tar.gz.sig >/tmp/published218.sig
          minisign -Vm /tmp/published218/VYRON.app.tar.gz -p /tmp/vyron.pub -x /tmp/published218.sig
          echo 'PUBLISHED_HASHES_MATCH=PASS'; echo 'PUBLISHED_UPDATER_SIGNATURE=VERIFIED'

      - name: Activate stable updater feed 2.1.8
        shell: bash
        run: |
          set -Eeuo pipefail
          CURRENT=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          test "$CURRENT" = '2.1.7'
          FEED_SHA=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .sha)
          B64=$(base64 < production/latest.json | tr -d '\n')
          gh api --method PUT "repos/$REPO/contents/vyron-updates/latest.json" -f message='release: activate VYRON 2.1.8 updater feed' -f content="$B64" -f sha="$FEED_SHA" -f branch=main >/tmp/feed-update.json
          python3 - <<'PY'
          import json
          print('LATEST_JSON_COMMIT='+json.load(open('/tmp/feed-update.json'))['commit']['sha'])
          PY

      - name: Final stable-feed verification
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/latest218.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/latest218.json')); assert d['version']=='2.1.8'; p=d['platforms']['darwin-aarch64']; assert p['url']=='https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v2.1.8/VYRON.app.tar.gz'; assert p['signature']==pathlib.Path('production/VYRON.app.tar.gz.sig').read_text().strip()
          print('latest.json_VERSION=2.1.8'); print('SETTINGS_DETECTS_2.1.8=PASS_CONTRACT'); print('VYRON_2.1.8_STABLE_RELEASED=YES')
          PY
          test "$(gh release view v2.1.7 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = '0e511c8a42cf4e3232cb8d0384a1625664a33cdf'
          test "$(gh release view v2.1.6 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = '1c2da4866c90a353f8ca4e9d97702ffddb74e853'
          echo 'v2.1.7_CHANGED=NO'; echo 'v2.1.6_CHANGED=NO'
