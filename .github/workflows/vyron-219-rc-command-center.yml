name: VYRON 2.1.9 RC Real Mac Command Center

on:
  push:
    branches: [hotfix/vyron-real-mac-command-center-rc]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-219-rc-command-center
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  VERSION: '2.1.9-rc.1'
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow

jobs:
  rc:
    runs-on: macos-14-arm64
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout RC source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Stable release safety and RC identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$VERSION"
          grep -q '^version = "2.1.9-rc.1"$' src-tauri/Cargo.toml
          test "$(node -p "require('./src-tauri/tauri.conf.json').identifier")" = "$BUNDLE_ID"
          test "$(gh release view v2.1.8 --repo "$REPO" --json targetCommitish --jq .targetCommitish)" = 'c6e95c53c7d9da3be59b6f2dd3c751469e3936bd'
          ! git ls-remote --exit-code --tags origin refs/tags/v2.1.9 >/dev/null 2>&1
          ! gh release view v2.1.9 --repo "$REPO" >/dev/null 2>&1
          FEED=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = '2.1.8'
          echo "RC_SOURCE=$(git rev-parse HEAD)"
          echo "RC_TREE=$(git rev-parse HEAD^{tree})"
          echo 'STABLE_TAG_CREATED=NO'
          echo 'latest.json_CHANGED=NO'

      - name: Normalize lockfile root versions for RC workspace only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,re
          p='package-lock.json'
          d=json.load(open(p))
          d['version']='2.1.9-rc.1'
          d['packages']['']['version']='2.1.9-rc.1'
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p='src-tauri/Cargo.lock'
          s=open(p).read()
          s,n=re.subn(r'(\[\[package\]\]\nname = "channelflow"\nversion = ")2\.1\.8("\n)',r'\g<1>2.1.9-rc.1\2',s,count=1)
          assert n==1
          open(p,'w').write(s)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted legacy Command Center regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run \
            src/commandCenterLegacyPersistence.test.tsx \
            src/commandCenterRuntimeHotfix.test.tsx \
            src/commandCenter.test.ts \
            src/channelRunway.test.ts \
            src/uiHotfix.test.tsx
          echo 'COMMAND_CENTER_LEGACY_TESTS=PASS'
          echo 'COMMAND_CENTER_31_CHANNEL_TEST=PASS'

      - name: Full frontend suite
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run --reporter=json --outputFile=/tmp/vitest.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/vitest.json'))
          total=d.get('numTotalTests',0); passed=d.get('numPassedTests',0); failed=d.get('numFailedTests',0); skipped=d.get('numPendingTests',0); files=len(d.get('testResults',[]))
          print(f'FRONTEND_TEST_FILES={files}')
          print(f'FRONTEND_TESTS_TOTAL={total}')
          print(f'FRONTEND_TESTS_PASS={passed}')
          print(f'FRONTEND_TESTS_FAIL={failed}')
          print(f'FRONTEND_TESTS_SKIPPED={skipped}')
          assert failed==0 and passed+skipped==total
          PY

      - name: TypeScript and production frontend build
        shell: bash
        run: |
          set -Eeuo pipefail
          npx tsc --noEmit
          echo 'TYPESCRIPT=PASS'
          npm run build
          test -s dist/index.html
          echo 'BUILD=PASS'

      - name: Actual App routing legacy browser smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          (npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 & echo $! > /tmp/vite.pid)
          trap 'kill $(cat /tmp/vite.pid) >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:1421 >/dev/null && break; sleep 0.25; done
          node scripts/command-center-legacy-app-smoke.mjs
          kill $(cat /tmp/vite.pid) >/dev/null 2>&1 || true
          trap - EXIT
          echo 'COMMAND_CENTER_REOPEN=PASS'
          echo 'ROUTE_SMOKE=PASS'

      - name: Rust full suite
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee /tmp/cargo.log
          python3 - <<'PY'
          import re
          s=open('/tmp/cargo.log').read(); rows=re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored',s)
          assert rows
          p=sum(int(a) for a,_,__ in rows); f=sum(int(b) for _,b,__ in rows); i=sum(int(c) for _,__,c in rows)
          print(f'RUST_TESTS_TOTAL={p+f+i}');print(f'RUST_TESTS_PASS={p}');print(f'RUST_TESTS_FAIL={f}');print(f'RUST_TESTS_SKIPPED={i}')
          assert f==0
          PY

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          python3 - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip()
          def dec(v):
            try:return base64.b64decode(v.strip(),validate=True).decode()
            except Exception:return None
          if raw.startswith('untrusted comment:'):
            box=raw; encoded=base64.b64encode(raw.encode()).decode()
          else:
            once=dec(raw)
            if once and once.startswith('untrusted comment:'): box=once; encoded=raw
            else:
              twice=dec(once) if once else None
              if not (twice and twice.startswith('untrusted comment:')): raise SystemExit('invalid TAURI signing key encoding')
              box=twice; encoded=once.strip()
          if 'secret key' not in box.splitlines()[0].lower(): raise SystemExit('TAURI signing key is not a secret key')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+encoded+'\n')
          print('::add-mask::'+encoded)
          PY

      - name: Build macOS ARM64 RC only
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p rc
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64
          otool -hv "$APP/Contents/MacOS/$EXECUTABLE" | grep -q ARM64
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          cp "$DMG" "rc/VYRON-$VERSION-arm64.dmg"
          cp "$UPDATER" rc/VYRON.app.tar.gz
          cp "$SIG" rc/VYRON.app.tar.gz.sig
          shasum -a 256 "rc/VYRON-$VERSION-arm64.dmg" > "rc/VYRON-$VERSION-arm64.dmg.sha256"
          shasum -a 256 rc/VYRON.app.tar.gz > rc/VYRON.app.tar.gz.sha256
          echo 'NATIVE_RC_BUILD=PASS'
          echo 'CODESIGN=PASS'
          echo 'DMG_VERIFY=PASS'

      - name: Finder-like RC launch
        shell: bash
        run: |
          set -Eeuo pipefail
          MOUNT="$RUNNER_TEMP/vyron219rc-mount"; rm -rf "$MOUNT"; mkdir -p "$MOUNT"
          hdiutil attach "rc/VYRON-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          APP="$MOUNT/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$APP/Contents/MacOS/$EXECUTABLE" > /tmp/vyron219rc-launch.log 2>&1 &
          PID=$!; sleep 8; kill -0 "$PID" 2>/dev/null; kill "$PID" || true; wait "$PID" || true
          hdiutil detach "$MOUNT"; trap - EXIT
          echo 'FINDER_LAUNCH=PASS'

      - name: Upload manual-install RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.9-rc.1-arm64
          path: |
            rc/VYRON-2.1.9-rc.1-arm64.dmg
            rc/VYRON-2.1.9-rc.1-arm64.dmg.sha256
            rc/VYRON.app.tar.gz
            rc/VYRON.app.tar.gz.sha256
            rc/VYRON.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

      - name: Final stable-feed safety
        shell: bash
        run: |
          set -Eeuo pipefail
          ! git ls-remote --exit-code --tags origin refs/tags/v2.1.9 >/dev/null 2>&1
          ! gh release view v2.1.9 --repo "$REPO" >/dev/null 2>&1
          FEED=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = '2.1.8'
          echo 'STABLE_TAG_CREATED=NO'
          echo 'latest.json_CHANGED=NO'
          echo 'PHYSICAL_COMMAND_CENTER=PENDING'
          echo 'READY_FOR_STABLE_RELEASE=NO'
