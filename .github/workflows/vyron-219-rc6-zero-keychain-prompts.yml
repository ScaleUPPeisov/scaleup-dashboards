name: VYRON 2.1.9 RC6 Zero Keychain Prompts

on:
  push:
    branches:
      - release/vyron-219-rc6-zero-keychain-prompts
    paths:
      - '.github/workflows/vyron-219-rc6-zero-keychain-prompts.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  RC_VERSION: 2.1.9-rc.6
  RC_TAG: v2.1.9-rc.6
  STABLE_VERSION: 2.1.8
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  verify-build-publish-rc6:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/vyron-219-rc6-zero-keychain-prompts
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preflight — RC6 scope and stable feed unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RC6_SOURCE_COMMIT=$(git rev-parse HEAD)"
          test "$(node -p "require('./package.json').version")" = "$RC_VERSION"
          test "$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")" = "$RC_VERSION"
          grep -q '^version = "2.1.9-rc.6"$' src-tauri/Cargo.toml

          test -n "${VYRON_MACOS_SIGNING_P12_BASE64:-}"
          test -n "${VYRON_MACOS_SIGNING_P12_PASSWORD:-}"
          test "$VYRON_MACOS_SIGNING_IDENTITY" = 'VYRON Local Code Signing'

          # Runtime ACL mutation APIs from RC4 must be gone.
          ! grep -RInE 'SecKeychainItem(Set|Copy)Access|SecAccessCreate|SecTrustedApplicationCreateFromPath' src-tauri/src
          grep -RIn 'com.scaleup.vyron.security.v2' src-tauri/src/security.rs
          grep -RIn 'com.scaleup.vyron.security' src-tauri/src/security.rs
          grep -Fq 'SecKeychain::disable_user_interaction()' src-tauri/src/security.rs
          ! grep -Fq 'security::get_secret_cached(GOOGLE_API_KEY)' src-tauri/src/youtube.rs
          ! grep -Fq 'security::set_secret(GOOGLE_API_KEY' src-tauri/src/youtube.rs
          ! grep -Fq 'security::get_secret_cached(account)' src-tauri/src/storage.rs
          ! grep -Fq 'security::set_secret(account' src-tauri/src/storage.rs
          grep -Fq 'security::canonical_get_secret_cached(account)' src-tauri/src/storage.rs
          grep -Fq 'security::canonical_set_secret(account' src-tauri/src/storage.rs
          echo 'ZERO_KEYCHAIN_PROMPT_SOURCE_CONTRACT=PASS'

          ! gh release view v2.1.9 --repo "$REPO" >/dev/null 2>&1
          if gh release view "$RC_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo 'BLOCKER=RC6_TAG_ALREADY_EXISTS'
            exit 1
          fi
          FEED=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$STABLE_VERSION"
          echo 'LATEST_JSON_VERSION=2.1.8'
          echo 'SEC_KEYCHAIN_ITEM_SET_ACCESS_IN_RUNTIME=NO'
          echo 'SEC_KEYCHAIN_ITEM_COPY_ACCESS_IN_RUNTIME=NO'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Targeted RC6 Keychain V2 tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run             src/keychainPassiveArchitecture.test.ts             src/v213KeychainRecovery.test.ts             src/youtubeInventoryRc4.test.ts             src/schedulePhysicalRegression.test.ts             src/channelSchedule.test.ts             src/scheduleContinuation.test.ts             src/MetadataPage.schedule.test.ts

          cargo test --manifest-path src-tauri/Cargo.toml keychain_prompt_architecture_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v219_rc6_zero_prompt_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml security::tests --             --nocapture             --skip security::tests::keychain_diagnostics_roundtrip             --skip security::tests::keychain_roundtrip
          echo 'TARGETED_RC6_ZERO_PROMPT=PASS'

      - name: Full regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --             --skip security::tests::keychain_diagnostics_roundtrip             --skip security::tests::keychain_roundtrip
          npx tsc --noEmit
          npm run build
          echo 'FULL_REGRESSION=PASS'

      - name: Import persistent VYRON signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          CERT="$RUNNER_TEMP/vyron-signing.pem"

          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c "$VYRON_MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          test -s "$CERT"

          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PERSISTENT_CERT_SHA1=$ID_SHA1"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip();assert raw
          def dec(x):
            try:return base64.b64decode(x,validate=True).decode()
            except:return None
          if raw.startswith('untrusted comment:'):out=base64.b64encode(raw.encode()).decode();box=raw
          else:
            one=dec(raw)
            if one and one.startswith('untrusted comment:'):out=raw;box=one
            else:box=dec(one) if one else None;assert box and box.startswith('untrusted comment:');out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build and verify ARM64 RC6
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

          mkdir -p rc6
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -d "$APP"; test -s "$DMG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$RC_VERSION"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee rc6/codesign-details.txt
          codesign -d -r- "$APP" 2>&1 | tee rc6/designated-requirement.txt
          ! grep -F 'Signature=adhoc' rc6/codesign-details.txt
          DR="$(sed -n 's/^designated => //p' rc6/designated-requirement.txt | head -n1)"
          test -n "$DR"
          case "$DR" in cdhash*) exit 1;; esac
          echo "$DR" | grep -F "$BUNDLE_ID" >/dev/null

          hdiutil verify "$DMG"
          cp "$DMG" "rc6/VYRON-$RC_VERSION-arm64.dmg"
          shasum -a 256 "rc6/VYRON-$RC_VERSION-arm64.dmg" | tee "rc6/VYRON-$RC_VERSION-arm64.dmg.sha256"
          echo "DESIGNATED_REQUIREMENT=$DR"
          echo 'ARM64=PASS'
          echo 'CODESIGN=PASS'
          echo 'DMG_VERIFY=PASS'

      - name: Finder-like RC6 launch
        shell: bash
        run: |
          set -Eeuo pipefail
          M="$RUNNER_TEMP/vyron-rc6-mount"; mkdir -p "$M"
          hdiutil attach "rc6/VYRON-$RC_VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$M"
          trap 'hdiutil detach "$M" >/dev/null 2>&1 || true' EXIT
          A="$M/VYRON.app"
          codesign --verify --deep --strict "$A"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/"             "$A/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-rc6-launch.log 2>&1 &
          P=$!
          sleep 8
          kill -0 "$P"
          kill "$P" || true
          wait "$P" || true
          hdiutil detach "$M"; trap - EXIT
          echo 'FINDER_LAUNCH=PASS'

      - name: Publish RC6 prerelease only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/rc6-notes <<'EOF'
          VYRON 2.1.9-rc.6 — zero macOS Keychain password prompts

          Internal/personal macOS RC. Stable feed remains on 2.1.8.

          RC6 security behavior:
          - every native Keychain operation is executed with macOS Keychain user interaction disabled;
          - normal production code has zero callers of legacy secret reads;
          - legacy com.scaleup.vyron.security is metadata/presence only;
          - refresh tokens and API keys use com.scaleup.vyron.security.v2;
          - unavailable legacy credentials return LEGACY_RECONNECT_REQUIRED instead of requesting the Mac/login Keychain password;
          - Google reconnect preserves the existing OAuth profile UUID;
          - YouTube inventory no longer auto-migrates legacy refresh tokens;
          - passive profile/navigation paths do not hydrate secret values;
          - runtime diagnostics expose blocked interaction and reconnect counters without secret values.

          RC4/RC5 YouTube full-inventory and schedule behavior is preserved.
          Physical acceptance on the same Mac is mandatory before stable 2.1.9.
          EOF

          gh release create "$RC_TAG" --repo "$REPO" --target "$(git rev-parse HEAD)" --title 'VYRON 2.1.9 RC6' --prerelease --notes-file /tmp/rc6-notes             "rc6/VYRON-$RC_VERSION-arm64.dmg"             "rc6/VYRON-$RC_VERSION-arm64.dmg.sha256"             "rc6/codesign-details.txt"             "rc6/designated-requirement.txt"

          LOCAL=$(shasum -a 256 "rc6/VYRON-$RC_VERSION-arm64.dmg" | awk '{print $1}')
          REMOTE=$(gh release view "$RC_TAG" --repo "$REPO" --json assets --jq '.assets[] | select(.name=="VYRON-2.1.9-rc.6-arm64.dmg") | .digest')
          test "$REMOTE" = "sha256:$LOCAL"

          FEED=$(gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode)
          test "$(printf '%s' "$FEED" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$STABLE_VERSION"
          ! gh release view v2.1.9 --repo "$REPO" >/dev/null 2>&1

          echo "RC6_DMG_SHA256=$LOCAL"
          echo 'RC6_PRERELEASE=PUBLISHED'
          echo 'LATEST_JSON_VERSION=2.1.8'
          echo 'READY_FOR_PHYSICAL_TEST=YES'
          echo 'READY_FOR_STABLE_2.1.9=NO'

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-signing.p12" "$RUNNER_TEMP/vyron-signing.pem"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          fi
# retry: SettingsOS diagnostic contract aligned with RC6 metadata-only OAuth diagnostic
# retry: RC6 zero-prompt contracts aligned after targeted legacy-test update
