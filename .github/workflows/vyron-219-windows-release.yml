name: VYRON Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - windows/vyron-219-production-port
    paths:
      - .github/workflows/vyron-219-windows-release.yml

permissions:
  contents: write

env:
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  FFMPEG_VERSION: 8.1.2
  FFMPEG_ZIP_SHA256: db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec
  WINDOWS_RELEASE_TAG: v2.1.9-windows-x64

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust format baseline audit
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Provision FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $unpack = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:FFMPEG_ZIP_SHA256) { throw "FFmpeg SHA-256 mismatch" }
          Expand-Archive $zip $unpack -Force
          $ffmpeg = Get-ChildItem $unpack -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem $unpack -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg resources missing" }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/bin" | Out-Null
          Copy-Item $ffmpeg.FullName "src-tauri/resources/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "src-tauri/resources/bin/ffprobe.exe" -Force

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Windows compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build NSIS
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify and stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $exe = Get-Item "$root/VYRON.exe"
          $installer = Get-ChildItem "$root/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer missing" }
          if ($exe.Length -le 0 -or $installer.Length -le 0) { throw "Empty release artifact" }
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          if ($machine -ne 0x8664) { throw "VYRON.exe is not x64 PE" }

          New-Item -ItemType Directory -Force -Path windows-artifacts | Out-Null
          Copy-Item $installer.FullName "windows-artifacts/$($installer.Name)"
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($installer.Name)" | Set-Content "windows-artifacts/$($installer.Name).sha256" -Encoding ascii

          $head = git rev-parse HEAD
          $report = [ordered]@{
            product = "VYRON"
            version = "2.1.9"
            sourceCommit = $head
            sourceBranch = "windows/vyron-219-production-port"
            target = $env:WINDOWS_TARGET
            installer = $installer.Name
            installerBytes = $installer.Length
            installerSha256 = $sha
            peMachine = "0x8664"
            windowsCodeSigning = "NOT CONFIGURED"
            windowsUpdater = "NOT ACTIVATED"
            windows10Physical = "NOT TESTED"
            windows11Physical = "NOT TESTED"
            googleOAuthWindows = "NOT TESTED"
            credentialManagerPhysical = "NOT TESTED"
            youtubeWindows = "NOT TESTED"
            renderWindows = "NOT TESTED"
            uploadWindows = "NOT TESTED"
            multiUserRuntime = "NOT TESTED"
            crossUserDataLeakRuntime = "NOT TESTED"
            crossUserTokenLeakRuntime = "NOT TESTED"
            ownerReleaseAuthorization = "YES"
          }
          $report | ConvertTo-Json | Set-Content windows-artifacts/windows-build-report.json -Encoding utf8

          $notes = @(
            "# VYRON 2.1.9 - Windows x64",
            "",
            "Production Windows x64 build of VYRON 2.1.9.",
            "",
            "Source branch: windows/vyron-219-production-port",
            "Source commit: $head",
            "Target: x86_64-pc-windows-msvc",
            "",
            "Windows Authenticode signing: NOT CONFIGURED.",
            "SmartScreen warning may appear.",
            "Windows updater: NOT ACTIVATED.",
            "Windows 10/11 physical runtime acceptance: NOT TESTED.",
            "Google OAuth, Credential Manager, YouTube, render, upload and multi-user physical runtime acceptance: NOT TESTED.",
            "",
            "Owner release authorization: YES.",
            "This release is intentionally not marked Latest so the existing macOS /releases/latest updater path remains unchanged."
          )
          $notes | Set-Content windows-artifacts/RELEASE_NOTES_WINDOWS.md -Encoding utf8
          Get-Content windows-artifacts/windows-build-report.json
          Get-Content "windows-artifacts/$($installer.Name).sha256"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.9-windows-x64-release
          path: windows-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:WINDOWS_RELEASE_TAG
          $head = $env:GITHUB_SHA
          $installer = Get-ChildItem windows-artifacts -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = Get-Content windows-artifacts/RELEASE_NOTES_WINDOWS.md -Raw
            $payload = @{
              tag_name = $tag
              target_commitish = $head
              name = "VYRON 2.1.9 - Windows x64"
              body = $notes
              draft = $false
              prerelease = $false
              make_latest = "false"
            } | ConvertTo-Json
            Set-Content release.json $payload -Encoding utf8
            gh api --method POST "repos/$repo/releases" --input release.json | Out-Null
          }

          gh release upload $tag $installer.FullName "$($installer.FullName).sha256" windows-artifacts/windows-build-report.json windows-artifacts/RELEASE_NOTES_WINDOWS.md --repo $repo --clobber
          gh api --method PATCH "repos/$repo/releases/tags/$tag" -f make_latest=false | Out-Null
          gh release view $tag --repo $repo
