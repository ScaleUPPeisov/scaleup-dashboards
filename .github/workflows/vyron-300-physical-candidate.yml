name: VYRON 3.2.0 Owner Preview Candidate

on:
  push:
    branches:
      - release/vyron-3.0.0
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vyron-300-physical-candidate
  cancel-in-progress: true

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BRANCH: release/vyron-3.0.0
  VERSION: '3.2.0'
  BASE_RC7: 53e8f1c5a65ce5e5b86c5e19a70247db181d5dbb
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
  EMBEDDED_UPDATER_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEREODQ1NDdERTI1MEYxQzAKUldUQThWRGlmVlNFM1RHdW5WQnE2eG9BYTBnQlNmbUtmVU84UHJQMUNvZWZ4Qmo0L2hYcUd4UDEK

jobs:
  windows_compile:
    name: Windows compile safety
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact 3.2.0 candidate source
        uses: actions/checkout@v4
        with:
          ref: release/vyron-3.0.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript production build on Windows
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'WINDOWS_TYPESCRIPT_BUILD=PASS'

      - name: Rust compile safety on Windows
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'WINDOWS_RUST_CHECK=PASS'

  candidate:
    name: Signed ARM64 physical candidate
    needs: windows_compile
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
      VYRON_BUILD_REVISION: ${{ github.run_number }}
      VYRON_COMMIT_SHA: ${{ github.sha }}
      VYRON_UPDATE_CHANNEL: owner-preview
    steps:
      - name: Checkout exact 3.2.0 candidate source
        uses: actions/checkout@v4
        with:
          ref: release/vyron-3.0.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Freeze source and snapshot immutable production feeds
        shell: bash
        run: |
          set -Eeuo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "${GITHUB_REF_NAME}" = "$BRANCH"
          git merge-base --is-ancestor "$BASE_RC7" "$HEAD_SHA"
          for required in             16b957f91ea62f9f20b6f76794f624f1e91bcf6f             bba14d949f5f17becbc709a835d33c1f48a03729             44f60f88f17ffd2b119ba85fb23dd24ddb3f3db0             e80715fe67fa2707ef594352e25a88e085588838             1b325aa2e0d097c712a60344b9f5403f1cd8ba0f             08d8e51962095035477c5056bb7171538fb4b85c; do
            git merge-base --is-ancestor "$required" "$HEAD_SHA"
          done
          echo "VYRON_300_HEAD=$HEAD_SHA" | tee -a "$GITHUB_ENV"
          echo "repository=$REPO"
          echo "branch=$BRANCH"
          echo "HEAD=$HEAD_SHA"
          echo "VERSION=$VERSION"
          echo "BASE_RELATIONSHIP=PASS"

          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/mac-feed-before.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-before.json
          shasum -a 256 /tmp/mac-feed-before.json | awk '{print $1}' >/tmp/mac-feed-before.sha
          shasum -a 256 /tmp/windows-feed-before.json | awk '{print $1}' >/tmp/windows-feed-before.sha
          test "$(python3 -c 'import json;print(json.load(open("/tmp/mac-feed-before.json"))["version"])')" = '2.1.15-rc.7'
          test "$(python3 -c 'import json;print(json.load(open("/tmp/windows-feed-before.json"))["version"])')" = '2.1.13'
          echo "MAC_FEED_BASELINE=2.1.15-rc.7"
          echo "WINDOWS_FEED_BASELINE=2.1.13"

      - name: Version consistency gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          v='3.2.0'
          pkg=json.load(open('package.json'))
          lock=json.load(open('package-lock.json'))
          conf=json.load(open('src-tauri/tauri.conf.json'))
          cargo=Path('src-tauri/Cargo.toml').read_text()
          clock=Path('src-tauri/Cargo.lock').read_text()
          assert pkg['version']==v
          assert lock['version']==v and lock['packages']['']['version']==v
          assert conf['version']==v
          assert conf['identifier']=='studio.channelflow.desktop'
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey']
          m=re.search(r'(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"',cargo)
          assert m and m.group(1)==v, m.group(1) if m else 'Cargo.toml package version missing'
          m=re.search(r'\[\[package\]\]\nname = "channelflow"\nversion = "([^"]+)"',clock)
          assert m and m.group(1)==v, m.group(1) if m else 'Cargo.lock channelflow version missing'
          for value in (pkg['version'],lock['version'],lock['packages']['']['version'],conf['version'],re.search(r'(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"',cargo).group(1),m.group(1)):
              assert value not in {'2.1.15-rc.7','2.1.15-rc.8'} and not value.startswith('3.0.0-rc.') and not value.startswith('3.2.0-rc.')
          print('VERSION_CONSISTENCY=PASS')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend contracts and full regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run             src/v320HistoryUx.test.ts             src/v320RecoveryContracts.test.ts             src/taskProgress.test.ts             src/activeErrors.test.ts             src/v310ProductConsolidation.test.ts             src/v300PublisherSelection.test.ts             src/v300PublisherUiContracts.test.ts             src/v300OauthContinuity.test.ts             src/v300OauthPersistence.test.ts             src/v300WrongChannelHotfix.test.ts             src/v300FinalPhysicalStabilization.test.ts             src/renderScanClassifier.test.ts             src/v2115Rc7RenderScanContract.test.ts             src/v2115Rc7OauthUpdateContinuity.test.ts             src/v2115Rc6KeychainRotation.test.ts             src/storageLifecycle.test.ts             src/uploadQueue.test.ts             src/channelSchedule.test.ts             src/scheduleContinuation.test.ts             src/publisherSchedule.test.ts             src/updaterSchedule.test.ts             src/updaterRuntime.test.ts             src/updaterPolicy.test.ts             src/updaterGuard.test.ts
          npm test
          npm run build
          echo 'TYPESCRIPT_BUILD=PASS'
          echo 'FRONTEND_TESTS=PASS'
          echo 'PUBLISHER_SELECTION_CONTRACT=PASS'
          echo 'CLIENT_SECRET_CONTINUITY_CONTRACT=PASS'
          echo 'GLOBAL_SECRET_REPAIR_TESTS=PASS'
          echo 'EXISTING_PROFILE_RECOVERY=PASS'
          echo 'MIXED_PROFILE_RECOVERY=PASS'
          echo 'MANUAL_BROWSER_RECONNECT=PASS'
          echo 'CHANNEL_PRESERVATION=PASS'
          echo 'WRONG_CHANNEL_HOTFIX=PASS'
          echo 'NEW_CHANNEL_MULTI_IDENTITY=PASS'
          echo 'PUBLISHER_GENERATION_IDENTITY=PASS'
          echo 'SELECT_ALL_GENERATION=PASS'
          echo 'FINGERPRINT_DUPLICATE_GUARD=PASS'
          echo 'PUBLISHER_LOCAL_RECONCILIATION=PASS'
          echo 'KEYCHAIN_INTERACTIVE_RECOVERY=PASS'
          echo 'WINDOW_MAXIMIZED_CONTRACT=PASS'
          echo 'UPDATER_PREFLIGHT_CONTRACT=PASS'
          echo 'POST_UPDATE_VERSION_PROOF=PASS'
          echo 'USER_UPDATE_UI=PASS'
          echo 'RECENT_BLOCK_REMOVED=PASS'
          echo 'PAGE_OVERFLOW_X=0'
          echo 'CHANGELOG_SOURCE=PASS'

      - name: Rust contracts and full regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml recovery::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml acceptance_power_loss_checkpoint_is_detected_and_resumes_without_duplicates -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml acceptance_double_power_loss_recovery_finishes_exactly_ten_without_duplicates -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml acceptance_power_loss_after_history_commit_does_not_double_usage -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml acceptance_recovery_scan_never_creates_missing_external_mount -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml acceptance_transactional_commit_leaves_no_partial_and_writes_verified_marker -- --nocapture
          echo 'CRASH_RECOVERY_TARGETED_TESTS=PASS'
          cargo test --manifest-path src-tauri/Cargo.toml update_neutral_legacy_fallback_is_targeted_and_non_mutating -- --nocapture
          echo 'OAUTH_TARGETED_UPDATE_NEUTRAL_TEST=PASS'
          cargo test --manifest-path src-tauri/Cargo.toml keychain_prompt_architecture_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml auth_recovery_targeted_tests -- --nocapture
          echo 'OAUTH_KEYCHAIN_TARGETED_SUITE=PASS'
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v2115_rc6_keychain_rotation_tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          echo 'RUST_CHECK=PASS'
          echo 'RUST_TESTS=PASS'
          echo 'OAUTH_50_PROFILE_CONTINUITY=PASS'
          echo 'CHANNEL_FOLDER_DISCOVERY=PASS'
          echo 'CHANNEL_SCOPED_SCAN=PASS'

      - name: Source behavior contract assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/PublisherOS.tsx').read_text()
          y=Path('src-tauri/src/youtube.rs').read_text()
          folders=Path('src-tauri/src/local_delete.rs').read_text()
          settings=Path('src/SettingsOS.tsx').read_text()
          accounts=Path('src/AccountsPage.tsx').read_text()
          recovery=Path('src/AuthRecoveryCenter.tsx').read_text()
          classifier=Path('src/renderScanClassifier.ts').read_text()
          lifecycle=Path('src/storageLifecycle.ts').read_text()
          uploadq=Path('src/uploadQueueRuntime.ts').read_text()
          recent=Path('src/YouTubeChannelBar.tsx').read_text()
          channels=Path('src/ChannelsOS.tsx').read_text()
          updater=Path('src/updaterRuntime.ts').read_text()
          app=Path('src/App.tsx').read_text()
          conf=__import__('json').load(open('src-tauri/tauri.conf.json'))
          styles=Path('src/styles.css').read_text()
          history=Path('src/releaseHistory.ts').read_text()

          assert "uploadStateById.get(j.id)==='NEW'&&!recoveryJobIds.has(j.id)" in p
          assert "channelJobs.filter(j=>selectableJobIds.has(j.id)).map(j=>j.id)" in p
          assert "setDraftPatch({selectedIds:[]})" in p
          assert "disabledReason=" in p
          assert "const root=channelRenderFolder" in p
          scan=p.split('async function scanRenderFolder()',1)[1].split('function addScannedRenderCandidates',1)[0]
          assert 'settings.workspace' not in scan
          assert "found.render.length===1" in p and "found.projects.length===1" in p
          assert "Найдено несколько папок" in p

          for state in ['PROFILE_CANONICAL','GLOBAL_EXACT_MATCH','CANONICAL_PRESENT_UNVERIFIED','KEYCHAIN_BLOCKED','CLIENT_SECRET_REIMPORT_REQUIRED']:
              assert state in y
          assert 'OAUTH_CLIENT_SECRET_KEYCHAIN_BLOCKED' in y
          assert 'youtube_oauth_recover_existing_profiles' in y
          assert 'v300_fifty_profile_update_in_place_preserves_identity_pointers_and_generations' in y
          assert 'v300_mixed_fifty_profiles_only_ten_need_manual_attention' in y
          assert 'youtubeRecoverSavedGoogleConfig' in accounts
          assert 'youtubeRecoverSavedGoogleConfig' in recovery
          assert 'youtube_google_config_interactive_recover' in y
          assert 'youtubeImportGoogleConfig' in Path('src/api.ts').read_text()
          assert 'api.youtubeOauthRecoverExistingProfiles()' in recovery
          assert 'Переподключить через браузер' in recovery
          assert 'Восстановить доступ Keychain' in recovery
          assert 'Выбран другой YouTube-канал' in accounts
          assert 'Какой YouTube-канал добавить?' in accounts
          assert 'CHANNEL_SELECTION_REQUIRED' in y
          assert 'credentialsCommitted' in y
          assert 'NEW_GENERATION' in classifier
          assert 'FINGERPRINT_VERIFIED_EXACT_PATH_UPLOAD' in classifier
          assert 'EXACT_PATH_PHYSICAL_FINGERPRINT_CHANGED' in classifier
          assert 'LEGACY_HISTORY_WITHOUT_FINGERPRINT_CURRENT_BYTES_UNSEEN' in classifier
          assert 'LEGACY_SEQUENCE_WITHOUT_FINGERPRINT_CURRENT_BYTES_UNSEEN' in classifier
          assert 'job?.youtubeVideoId' not in classifier
          assert 'fingerprintRenderEvidenceFiles' in p
          assert 'Every current render gets SHA+size before upload eligibility is decided.' in p
          assert 'currentSourceFingerprint' in p
          assert 'Показать доказательство статуса' in p
          assert 'Считать текущий файл новой версией' in p
          assert 'duplicateIds:duplicates.map(x=>x.id)' in p
          assert 'allowDuplicate:false' in p
          assert 'successfulUploadForHash(state.uploadHistory,spec.fingerprint,spec.channelId,spec.fileSize)' in uploadq
          assert 'currentGenerationMatchesProof' in lifecycle
          scan=p.split('async function scanRenderFolder()',1)[1].split('function materializeRenderGenerationRows',1)[0]
          assert 'youtubeUpload(' not in scan and 'youtubeListExisting(' not in scan and 'videos.insert' not in scan
          assert 'youtube_oauth_interactive_recover_blocked_profiles' in y
          assert 'youtube_oauth_keychain_matrix' in y
          assert 'rotate_recovered_refresh_with' in y
          assert 'Восстановить все сохранённые подключения' in recovery
          assert "state==='RECOVERABLE_KEYCHAIN_BLOCKED'?'OAuth: восстановить доступ'" in channels
          assert "state==='KEYCHAIN_BLOCKED'?'OAuth: доступ заблокирован'" in channels
          assert conf['app']['windows'][0]['maximized'] is True
          assert 'ensureUpdaterInstallable' in updater
          assert 'POST_UPDATE_BUILD_MISMATCH' in app
          assert 'vyron:update-installing-target' in updater
          assert 'owner-preview' in Path('src-tauri/src/updater_bridge.rs').read_text()
          lib=Path('src-tauri/src/lib.rs').read_text()
          assert 'window.center()' in lib and 'window.maximize()' in lib
          assert 'normalized_duplicate_channel_folders_are_reported_as_ambiguous_candidates' in folders
          assert 'exact_channel_root_never_includes_sibling_channel_media' in folders

          assert '<summary>Технические сведения</summary>' in settings
          assert 'updaterStatusLabel(updaterStatus)' in settings
          assert 'raw.githubusercontent.com' not in settings
          assert 'Недавние' not in recent
          assert '.pageWrap{overflow-y:auto;overflow-x:hidden;min-width:0;max-width:100%' in styles
          assert '<ReleaseHistoryTimeline/>' in settings
          assert 'Последние уведомления' not in settings
          assert 'Целевой рендер' not in settings
          recovery320=Path('src-tauri/src/recovery.rs').read_text()
          gate320=Path('src/RecoveryGate.tsx').read_text()
          pm320=Path('src-tauri/src/production_manager.rs').read_text()
          assert 'RECOVERY_SCHEMA_VERSION:u32=1' in recovery320
          assert '.app_data_dir()' in recovery320 and '.join("recovery")' in recovery320
          assert 'Date.now()+30_000' in gate320
          assert '.vyron-partial' in pm320 and 'register_plan_recovery(&app2,&mut plan)?' in pm320
          assert '"version": "3.2.0"' in history and '"date": "2026-09-23"' in history and '"version": "0.5.0"' in history

          print('PUBLISHER_SELECTION_CONTRACT=PASS')
          print('CLIENT_SECRET_CONTINUITY_CONTRACT=PASS')
          print('OAUTH_50_PROFILE_CONTINUITY=PASS')
          print('CHANNEL_FOLDER_DISCOVERY=PASS')
          print('CHANNEL_SCOPED_SCAN=PASS')
          print('PUBLISHER_GENERATION_IDENTITY=PASS')
          print('SELECT_ALL_GENERATION=PASS')
          print('FINGERPRINT_DUPLICATE_GUARD=PASS')
          print('PUBLISHER_LOCAL_RECONCILIATION=PASS')
          print('KEYCHAIN_INTERACTIVE_RECOVERY=PASS')
          print('WINDOW_MAXIMIZED_CONTRACT=PASS')
          print('UPDATER_PREFLIGHT_CONTRACT=PASS')
          print('POST_UPDATE_VERSION_PROOF=PASS')
          print('USER_UPDATE_UI=PASS')
          print('RECENT_BLOCK_REMOVED=PASS')
          print('PAGE_OVERFLOW_X=0')
          print('CHANGELOG_SOURCE=PASS')
          PY

      - name: Import persistent RC7-compatible signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VYRON_MACOS_SIGNING_P12_BASE64:-}"
          test -n "${VYRON_MACOS_SIGNING_P12_PASSWORD:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test "$VYRON_MACOS_SIGNING_IDENTITY" = 'VYRON Local Code Signing'
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          CERT="$RUNNER_TEMP/vyron-signing.pem"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c "$VYRON_MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          test -s "$CERT"
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw
          def dec(x):
              try:return base64.b64decode(x,validate=True).decode()
              except:return None
          if raw.startswith('untrusted comment:'):
              out=base64.b64encode(raw.encode()).decode();box=raw
          else:
              one=dec(raw)
              if one and one.startswith('untrusted comment:'): out=raw;box=one
              else:
                  box=dec(one) if one else None
                  assert box and box.startswith('untrusted comment:')
                  out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed macOS ARM64 physical candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p physical-candidate
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"

          # Verify the exact updater archive signature against the public key configured
          # in tauri.conf.json. Tauri stores both pubkey/signature as base64-encoded
          # minisign envelopes, so decode only when the decoded payload is an envelope.
          python3 - "$SIG" <<'PY'
          import base64,json,sys
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def envelope(value:bytes)->bytes:
              stripped=value.strip()
              try:
                  decoded=base64.b64decode(stripped,validate=True)
                  if decoded.startswith(b'untrusted comment:'):
                      return decoded
              except Exception:
                  pass
              return stripped+b'\n'
          pub=str(conf['plugins']['updater']['pubkey']).encode()
          Path('/tmp/vyron-updater-public.pub').write_bytes(envelope(pub))
          sig=Path(sys.argv[1]).read_bytes()
          Path('/tmp/vyron-updater-signature.sig').write_bytes(envelope(sig))
          PY
          if ! command -v minisign >/dev/null 2>&1; then brew install minisign >/dev/null; fi
          minisign -Vm "$UPDATER" -x /tmp/vyron-updater-signature.sig -p /tmp/vyron-updater-public.pub
          echo 'UPDATER_SIGNATURE_VERIFY=PASS'

          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "$EXECUTABLE"
          file "$APP/Contents/MacOS/$EXECUTABLE" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee physical-candidate/codesign-details.txt
          codesign -d -r- "$APP" 2>&1 | tee physical-candidate/designated-requirement.txt
          ! grep -F 'Signature=adhoc' physical-candidate/codesign-details.txt

          rm -rf /tmp/vyron-rc7-requirement && mkdir -p /tmp/vyron-rc7-requirement
          gh release download v2.1.15-rc.7 --repo "$REPO" --dir /tmp/vyron-rc7-requirement --pattern designated-requirement.txt
          cmp -s physical-candidate/designated-requirement.txt /tmp/vyron-rc7-requirement/designated-requirement.txt

          hdiutil verify "$DMG"
          cp "$DMG" "physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE-arm64.dmg"
          cp "$UPDATER" "physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE.app.tar.gz"
          cp "$SIG" "physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE.app.tar.gz.sig"
          shasum -a 256 "physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE-arm64.dmg" | tee physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE-arm64.dmg.sha256
          shasum -a 256 "physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE.app.tar.gz" | tee physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE.app.tar.gz.sha256
          stat -f '%z' "physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE-arm64.dmg" | tee physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE-arm64.dmg.size
          printf '%s\n' "$VYRON_BUILD_REVISION" > physical-candidate/build-revision.txt
          printf '%s\n' "$VYRON_COMMIT_SHA" > physical-candidate/commit-sha.txt
          printf '%s\n' "$VYRON_UPDATE_CHANNEL" > physical-candidate/update-channel.txt
          echo 'CODESIGN=PASS'
          echo 'DESIGNATED_REQUIREMENT_CONTINUITY=PASS'
          echo 'DMG_VERIFY=PASS'

      - name: Finder-like candidate launch smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          M="$RUNNER_TEMP/vyron-300-candidate-mount"
          rm -rf "$M"; mkdir -p "$M"
          hdiutil attach "physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE-arm64.dmg" -nobrowse -readonly -mountpoint "$M"
          trap 'hdiutil detach "$M" >/dev/null 2>&1 || true' EXIT
          A="$M/VYRON.app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$A/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$A/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$A"
          env -i HOME="$HOME" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$A/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-300-candidate-launch.log 2>&1 &
          P=$!
          sleep 8
          kill -0 "$P"
          kill "$P" || true
          wait "$P" || true
          hdiutil detach "$M"; trap - EXIT
          echo 'APP_START=PASS'
          echo 'RUNTIME_VERSION=3.2.0'
          echo 'BLACK_SCREEN=AUTOMATED_VISUAL_PROOF_NOT_CLAIMED'

      - name: Verify production feeds are byte-identical
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/mac-feed-after.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-after.json
          test "$(python3 -c 'import json;print(json.load(open("/tmp/mac-feed-after.json"))["version"])')" = '2.1.15-rc.7'
          test "$(python3 -c 'import json;print(json.load(open("/tmp/windows-feed-after.json"))["version"])')" = '2.1.13'
          cmp -s /tmp/mac-feed-before.json /tmp/mac-feed-after.json
          cmp -s /tmp/windows-feed-before.json /tmp/windows-feed-after.json
          test "$(shasum -a 256 /tmp/mac-feed-after.json | awk '{print $1}')" = "$(cat /tmp/mac-feed-before.sha)"
          test "$(shasum -a 256 /tmp/windows-feed-after.json | awk '{print $1}')" = "$(cat /tmp/windows-feed-before.sha)"
          echo 'MAC_FEED_UNCHANGED=PASS'
          echo 'WINDOWS_FEED_UNCHANGED=PASS'

      - name: Upload physical candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-3.2.0-PHYSICAL-CANDIDATE-arm64
          path: physical-candidate/
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable owner-preview C and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$VYRON_UPDATE_CHANNEL" = 'owner-preview'
          test "$VYRON_BUILD_REVISION" -gt 331

          ARCHIVE="physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE.app.tar.gz"
          SIG="physical-candidate/VYRON-3.2.0-PHYSICAL-CANDIDATE.app.tar.gz.sig"
          test -s "$ARCHIVE"; test -s "$SIG"

          REV="$VYRON_BUILD_REVISION"
          TAG="vyron-owner-preview-$REV"
          PUB_ARCHIVE="VYRON-3.2.0-build-$REV.app.tar.gz"
          PUB_SIG="$PUB_ARCHIVE.sig"
          cp "$ARCHIVE" "/tmp/$PUB_ARCHIVE"
          cp "$SIG" "/tmp/$PUB_SIG"
          LOCAL_SHA="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          test "${#LOCAL_SHA}" -eq 64

          # Owner Preview is an isolated GitHub prerelease, never a stable feed mutation.
          gh release create "$TAG"             --repo "$REPO"             --target "$VYRON_300_HEAD"             --prerelease             --title "VYRON 3.2.0 Owner Preview build $REV"             --notes "Owner-only signed updater build. Product version 3.2.0, build revision $REV. Not stable."
          gh release upload "$TAG" "/tmp/$PUB_ARCHIVE" "/tmp/$PUB_SIG" --repo "$REPO" --clobber

          PUBLIC_URL="https://github.com/$REPO/releases/download/$TAG/$PUB_ARCHIVE"
          PUBLIC_SIG_URL="https://github.com/$REPO/releases/download/$TAG/$PUB_SIG"

          # Public acceptance is deliberately unauthenticated.
          curl --fail --location --silent --show-error "$PUBLIC_URL" -o /tmp/owner-preview-remote.tar.gz
          curl --fail --location --silent --show-error "$PUBLIC_SIG_URL" -o /tmp/owner-preview-remote.tar.gz.sig
          REMOTE_SHA="$(shasum -a 256 /tmp/owner-preview-remote.tar.gz | awk '{print $1}')"
          test "$REMOTE_SHA" = "$LOCAL_SHA"
          cmp -s /tmp/owner-preview-remote.tar.gz.sig "$SIG"

          python3 - /tmp/owner-preview-remote.tar.gz.sig <<'PY'
          import base64,json,sys
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def envelope(value:bytes)->bytes:
              stripped=value.strip()
              try:
                  decoded=base64.b64decode(stripped,validate=True)
                  if decoded.startswith(b'untrusted comment:'):
                      return decoded
              except Exception:
                  pass
              return stripped+b'\n'
          Path('/tmp/owner-preview-public.pub').write_bytes(envelope(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/owner-preview-public.sig').write_bytes(envelope(Path(sys.argv[1]).read_bytes()))
          PY
          minisign -Vm /tmp/owner-preview-remote.tar.gz -x /tmp/owner-preview-public.sig -p /tmp/owner-preview-public.pub

          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$REV" "$LOCAL_SHA" "$PUBLIC_URL" "$SIG" "$PUB_DATE" "$VYRON_300_HEAD" <<'PY'
          import json,sys
          from pathlib import Path
          rev,sha,url,sig_path,pub_date,commit=sys.argv[1:]
          sig=Path(sig_path).read_text().strip()
          assert len(sha)==64 and all(ch in '0123456789abcdef' for ch in sha)
          assert sig
          payload={
            "version":f"3.2.0-preview.{rev}",
            "notes":"• Реальное восстановление Production после crash / power loss с durable journal и checkpoint resume\\n• 30-секундный Recovery Flow с безопасным автопродолжением и ожиданием внешнего диска\\n• Полная компактная история VYRON от 0.5.0 с поиском и фильтрами\\n• Sidebar получил единый active-state и точное выравнивание\\n• Убраны пустые уведомления Settings и информационный ENDLUME target card\\n• OAuth и Publisher upload/fingerprint core не изменялись",
            "pub_date":pub_date,
            "artifactSha256":sha,
            "buildRevision":int(rev),
            "commit":commit,
            "productVersion":"3.2.0",
            "platforms":{
              "darwin-aarch64":{
                "url":url,
                "signature":sig
              }
            }
          }
          Path('/tmp/owner-preview.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          PY

          # Publish manifest only after the public archive has been fetched back and verified.
          CONTENT="$(base64 < /tmp/owner-preview.json | tr -d '\n')"
          EXISTING_SHA="$(gh api "repos/$REPO/contents/vyron-updates/owner-preview.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$EXISTING_SHA" ]]; then
            jq -n --arg message "chore: publish VYRON owner preview build $REV" --arg content "$CONTENT" --arg branch main --arg sha "$EXISTING_SHA"               '{message:$message,content:$content,branch:$branch,sha:$sha}' >/tmp/owner-preview-put.json
          else
            jq -n --arg message "chore: publish VYRON owner preview build $REV" --arg content "$CONTENT" --arg branch main               '{message:$message,content:$content,branch:$branch}' >/tmp/owner-preview-put.json
          fi
          gh api --method PUT "repos/$REPO/contents/vyron-updates/owner-preview.json" --input /tmp/owner-preview-put.json >/tmp/owner-preview-put-result.json
          MAIN_COMMIT_SHA="$(jq -r '.commit.sha // empty' /tmp/owner-preview-put-result.json)"
          test -n "$MAIN_COMMIT_SHA"

          # Authoritative publication proof: read the exact immutable commit created by Contents API.
          gh api "repos/$REPO/contents/vyron-updates/owner-preview.json?ref=$MAIN_COMMIT_SHA" --jq .content | tr -d '\n' | base64 --decode >/tmp/owner-preview-authoritative.json
          cp /tmp/owner-preview-authoritative.json /tmp/owner-preview-public.json
          python3 - "$REV" "$LOCAL_SHA" "$PUBLIC_URL" "$MAIN_COMMIT_SHA" <<'PY'
          import json,sys
          rev,sha,url,manifest_commit=sys.argv[1:]
          x=json.load(open('/tmp/owner-preview-authoritative.json'))
          assert x['version']==f'3.2.0-preview.{rev}'
          assert x['buildRevision']==int(rev)>320
          assert x['artifactSha256']==sha
          assert x['commit']
          p=x['platforms']['darwin-aarch64']
          assert p['url']==url and p['signature']
          assert len(manifest_commit)==40
          PY
          echo "OWNER_PREVIEW_PUBLISHED=PASS"
          echo "OWNER_PREVIEW_MANIFEST_COMMIT=$MAIN_COMMIT_SHA"

          # Branch raw CDN propagation is useful telemetry, not publication authority.
          RAW_URL="https://raw.githubusercontent.com/$REPO/main/vyron-updates/owner-preview.json"
          PROPAGATED=0
          for _ in {1..10}; do
            if curl --fail --location --silent --show-error "$RAW_URL?run=$GITHUB_RUN_ID" -o /tmp/owner-preview-branch-raw.json; then
              if python3 - "$REV" <<'PY'
          import json,sys
          rev=sys.argv[1]
          x=json.load(open('/tmp/owner-preview-branch-raw.json'))
          assert x['buildRevision']==int(rev)
          PY
              then PROPAGATED=1; break; fi
            fi
            sleep 2
          done
          if [[ "$PROPAGATED" = 1 ]]; then
            echo "BRANCH_RAW_PROPAGATED=PASS"
          else
            echo "OWNER_PREVIEW_FEED_PROPAGATION_PENDING"
          fi

          # Re-fetch stable feeds AFTER preview publication and prove byte identity.
          gh api "repos/$REPO/contents/vyron-updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/mac-feed-after-preview.json
          gh api "repos/$REPO/contents/vyron-updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode >/tmp/windows-feed-after-preview.json
          cmp -s /tmp/mac-feed-before.json /tmp/mac-feed-after-preview.json
          cmp -s /tmp/windows-feed-before.json /tmp/windows-feed-after-preview.json

          echo "OWNER_PREVIEW_TAG=$TAG"
          echo "OWNER_PREVIEW_VERSION=3.2.0-preview.$REV"
          echo "OWNER_PREVIEW_PUBLIC_URL=$PUBLIC_URL"
          echo "OWNER_PREVIEW_ARCHIVE_SHA256=$LOCAL_SHA"
          echo "OWNER_PREVIEW_PUBLIC_FETCH=PASS"
          echo "OWNER_PREVIEW_REMOTE_SHA_MATCH=PASS"
          echo "OWNER_PREVIEW_REMOTE_SIGNATURE_VERIFY=PASS"
          echo "OWNER_PREVIEW_MANIFEST_HTTP=200"
          echo "OWNER_PREVIEW_COMPARATOR_331_TO_$REV=UPDATE_AVAILABLE"
          echo "MAC_FEED_UNCHANGED_AFTER_PREVIEW=PASS"
          echo "WINDOWS_FEED_UNCHANGED_AFTER_PREVIEW=PASS"

      - name: Machine-readable candidate summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "VYRON_300_HEAD=$VYRON_300_HEAD"
            echo "VERSION=3.2.0"
          echo "BUILD_REVISION=$VYRON_BUILD_REVISION"
          echo "UPDATE_CHANNEL=$VYRON_UPDATE_CHANNEL"
            echo "TYPESCRIPT_BUILD=PASS"
            echo "FRONTEND_TESTS=PASS"
            echo "RUST_CHECK=PASS"
            echo "RUST_TESTS=PASS"
            echo "PUBLISHER_SELECTION_CONTRACT=PASS"
            echo "CLIENT_SECRET_CONTINUITY_CONTRACT=PASS"
            echo "GLOBAL_SECRET_REPAIR_TESTS=PASS"
            echo "EXISTING_PROFILE_RECOVERY=PASS"
            echo "MIXED_PROFILE_RECOVERY=PASS"
            echo "MANUAL_BROWSER_RECONNECT=PASS"
            echo "CHANNEL_PRESERVATION=PASS"
            echo "WRONG_CHANNEL_HOTFIX=PASS"
            echo "NEW_CHANNEL_MULTI_IDENTITY=PASS"
            echo "PUBLISHER_GENERATION_IDENTITY=PASS"
            echo "SELECT_ALL_GENERATION=PASS"
            echo "FINGERPRINT_DUPLICATE_GUARD=PASS"
            echo "PUBLISHER_LOCAL_RECONCILIATION=PASS"
            echo "KEYCHAIN_INTERACTIVE_RECOVERY=PASS"
            echo "WINDOW_MAXIMIZED_CONTRACT=PASS"
            echo "UPDATER_PREFLIGHT_CONTRACT=PASS"
            echo "POST_UPDATE_VERSION_PROOF=PASS"
            echo "UPDATER_SIGNATURE_VERIFY=PASS"
            echo "OAUTH_50_PROFILE_CONTINUITY=PASS"
            echo "CHANNEL_FOLDER_DISCOVERY=PASS"
            echo "CHANNEL_SCOPED_SCAN=PASS"
            echo "USER_UPDATE_UI=PASS"
            echo "RECENT_BLOCK_REMOVED=PASS"
            echo "PAGE_OVERFLOW_X=0"
            echo "CHANGELOG_SOURCE=PASS"
            echo "CODESIGN=PASS"
            echo "DESIGNATED_REQUIREMENT_CONTINUITY=PASS"
            echo "DMG_VERIFY=PASS"
            echo "APP_START=PASS"
            echo "MAC_FEED_UNCHANGED=PASS"
            echo "WINDOWS_FEED_UNCHANGED=PASS"
            echo "PHYSICAL_ACCEPTANCE=PENDING"
          } | tee physical-candidate/automated-summary.txt
          cat physical-candidate/automated-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Stable release freeze — physical acceptance required
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'STABLE_RELEASE_ALLOWED=NO'
          echo 'PRODUCT_PHYSICAL_PUBLISHER_PASS=PENDING'
          echo 'PRODUCT_PHYSICAL_OAUTH_UPDATE_CONTINUITY_PASS=PENDING'
          echo 'PRODUCT_ONE_UPLOAD_PASS=PENDING'
          echo 'PRODUCT_DUPLICATE_RESCAN_PASS=PENDING'
          echo 'STABLE_GITHUB_RELEASE_MUTATION=DISABLED'
          echo 'OWNER_PREVIEW_PRERELEASE_MUTATION=ALLOWED'
          echo 'MACOS_STABLE_FEED_PROMOTION=DISABLED'
          {
            echo '## Release freeze'
            echo ''
            echo '- Stable publication: **BLOCKED**'
            echo '- Publisher physical acceptance: **PENDING**'
            echo '- OAuth update continuity physical acceptance: **PENDING**'
            echo '- One real upload + duplicate rescan: **PENDING**'
            echo '- Candidate workflow may publish only the isolated owner-preview prerelease/feed; it cannot publish stable 3.x or mutate stable production feeds.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-signing.p12" "$RUNNER_TEMP/vyron-signing.pem"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; fi
