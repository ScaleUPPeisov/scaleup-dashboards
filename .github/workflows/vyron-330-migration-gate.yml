name: VYRON 3.3.0 Migration Dual Platform Gate

on:
  push:
    branches:
      - release/vyron-3.0.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-330-migration-dual-platform
  cancel-in-progress: true

jobs:
  migration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout exact migration source
        uses: actions/checkout@v4
        with:
          ref: release/vyron-3.0.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Version contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='3.3.0') process.exit(1)"
          grep -q '^version = "3.3.0"$' src-tauri/Cargo.toml
          python3 - <<'PY'
          import json,re
          assert json.load(open('src-tauri/tauri.conf.json'))['version']=='3.3.0'
          lock=open('src-tauri/Cargo.lock',encoding='utf-8').read()
          assert re.search(r'\[\[package\]\]\r?\nname = "channelflow"\r?\nversion = "3\.3\.0"',lock)
          print('VERSION_3_3_0=PASS')
          PY

      - name: Install frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend regression
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust migration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml migration::tests -- --nocapture

      - name: Windows Credential Manager tests
        if: ${{ matrix.name == 'windows' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml windows_credential_manager_tests -- --nocapture

      - name: Full Rust regression
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Migration security source contract
        shell: python
        run: |
          from pathlib import Path
          m=Path('src-tauri/src/migration.rs').read_text(encoding='utf-8')
          o=Path('src-tauri/src/oauth_vault.rs').read_text(encoding='utf-8')
          lib=Path('src-tauri/src/lib.rs').read_text(encoding='utf-8')
          assert 'Argon2id' in m
          assert 'XChaCha20Poly1305' in m
          assert 'MIGRATION_AUTHENTICATION_FAILED' in m
          assert '"willDelete": 0' in m
          assert 'deleted_channels = 0' in m
          assert 'merge_portable_snapshot' in o
          assert 'secretValuesIncluded' in o
          assert 'recover_interrupted_import' in m
          assert 'migration::recover_interrupted_import(app.handle())' in lib
          assert 'migration-transaction.json' in m
          assert 'PREPARED' in m and 'COMMITTED' in m
          assert 'println!' not in m
          assert 'eprintln!' not in m
          print('MIGRATION_ENCRYPTION_CONTRACT=PASS')
          print('MIGRATION_DELETE_COUNT=0')
          print('PLAINTEXT_SECRET_LOGGING=BLOCKED_BY_SOURCE_CONTRACT')

      - name: Provision pinned FFmpeg Windows
        if: ${{ matrix.name == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='8.1.2'
          $expected='db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec'
          $zip=Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $out=Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$version-essentials_build.zip" -OutFile $zip
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "FFmpeg SHA mismatch $actual"}
          Expand-Archive $zip $out -Force
          $ffmpeg=Get-ChildItem $out -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe=Get-ChildItem $out -Recurse -Filter ffprobe.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/resources/bin | Out-Null
          Copy-Item $ffmpeg.FullName src-tauri/resources/bin/ffmpeg.exe -Force
          Copy-Item $ffprobe.FullName src-tauri/resources/bin/ffprobe.exe -Force

      - name: Normalize Windows updater signing key
        if: ${{ matrix.name == 'windows' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os
          raw=os.environ.get('TAURI_SIGNING_PRIVATE_KEY','').strip()
          assert raw, 'TAURI_SIGNING_PRIVATE_KEY missing'
          def dec(x):
              try:return base64.b64decode(x,validate=True).decode()
              except:return None
          if raw.startswith('untrusted comment:'):
              out=base64.b64encode(raw.encode()).decode();box=raw
          else:
              one=dec(raw)
              if one and one.startswith('untrusted comment:'):
                  out=raw;box=one
              else:
                  box=dec(one) if one else None
                  assert box and box.startswith('untrusted comment:')
                  out=one.strip()
          assert 'secret key' in box.splitlines()[0].lower()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          print('WINDOWS_UPDATER_PRIVATE_KEY_NORMALIZED=PASS')
          PY

      - name: Build signed Windows NSIS updater candidate
        if: ${{ matrix.name == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS installer missing'}
          $sig=Get-Item ($installer.FullName + '.sig') -ErrorAction Stop
          if($sig.Length -le 0){throw 'NSIS updater signature missing'}
          New-Item -ItemType Directory -Force -Path migration-artifacts | Out-Null
          Copy-Item $installer.FullName migration-artifacts/VYRON-3.3.0-windows-x64-gate.exe
          Copy-Item $sig.FullName migration-artifacts/VYRON-3.3.0-windows-x64-gate.exe.sig
          $sha=(Get-FileHash migration-artifacts/VYRON-3.3.0-windows-x64-gate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha | Set-Content migration-artifacts/windows.sha256
          "WINDOWS_UPDATER_SIGNATURE_BYTES=$($sig.Length)" | Add-Content migration-artifacts/gate-windows.txt
          "WINDOWS_CANDIDATE_SHA256=$sha" | Add-Content migration-artifacts/gate-windows.txt
          "WINDOWS_UPDATER_ARTIFACT_SIGNED=PASS" | Add-Content migration-artifacts/gate-windows.txt

      - name: Install production baseline, preserve migrated state, update and relaunch Windows
        if: ${{ matrix.name == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          # 1) Install the immutable public Windows production baseline first.
          $baseline=Join-Path $env:RUNNER_TEMP 'VYRON_2.1.16_x64-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/ScaleUPPeisov/vyron-releases/releases/download/v2.1.16-windows-x64/VYRON_2.1.16_x64-setup.exe' -OutFile $baseline
          $baselineSha=(Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant()
          if($baselineSha -ne '10c169e31be98345ef6bd0af1f751743021eada3496c64b39843e2e7f624c63d'){throw "2.1.16 baseline SHA mismatch: $baselineSha"}
          $old=Start-Process -FilePath $baseline -ArgumentList '/S' -Wait -PassThru
          if($old.ExitCode -ne 0){throw "2.1.16 installer exit code $($old.ExitCode)"}

          # 2) Seed synthetic post-migration state in the real Tauri app-data location.
          # No real channel/account/secret values are used.
          $appData=Join-Path $env:APPDATA 'studio.channelflow.desktop'
          $docState=Join-Path $env:USERPROFILE 'Documents\VYRON\State'
          New-Item -ItemType Directory -Force -Path $appData,$docState | Out-Null
          $state=[ordered]@{
            version=10
            channels=@(
              @{id='fixture-a';youtubeChannelId='TEST_CH_A';name='Fixture A'},
              @{id='fixture-b';youtubeChannelId='TEST_CH_B';name='Fixture B'},
              @{id='fixture-c';youtubeChannelId='TEST_CH_C';name='Fixture C'},
              @{id='fixture-d';youtubeChannelId='TEST_CH_D';name='Fixture D'},
              @{id='fixture-e';youtubeChannelId='TEST_CH_E';name='Fixture E'}
            )
            jobs=@(@{id='fixture-job';channelId='fixture-a';status='Pending'})
            competitors=@()
            settings=@{workspace='';endlumePath='';youtubeApiKey='';openaiApiKey='';autoCheckUpdates=$false;reduceMotion=$false;fpsMonitor=$false}
            logs=@()
            uploadHistory=@()
            activityJournal=@()
            statisticsHistory=@{}
            fingerprintCache=@{'fixture-fp'=@{size=123}}
            projectLifecycle=@{'fixture-project'=@{status='READY'}}
          }
          $json=$state | ConvertTo-Json -Depth 12
          [IO.File]::WriteAllText((Join-Path $appData 'state.json'),$json,[Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $docState 'app-state.json'),$json,[Text.UTF8Encoding]::new($false))

          # 3) Install the just-built 3.3.0 candidate over 2.1.16.
          $installer=Resolve-Path 'migration-artifacts/VYRON-3.3.0-windows-x64-gate.exe'
          $p=Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "3.3.0 installer exit code $($p.ExitCode)"}

          $roots=@(
            (Join-Path $env:LOCALAPPDATA 'Programs'),
            $env:LOCALAPPDATA,
            $env:ProgramFiles,
            [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          ) | Where-Object {$_ -and (Test-Path $_)}
          $exe=$null
          foreach($root in $roots){
            $exe=Get-ChildItem $root -Filter 'VYRON.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object {$_.VersionInfo.ProductVersion.StartsWith('3.3.0')} | Select-Object -First 1
            if($exe){break}
          }
          if(-not $exe){throw 'Installed VYRON 3.3.0.exe not found'}

          $statePath=Join-Path $appData 'state.json'
          if(-not (Test-Path $statePath)){throw 'Post-migration state disappeared during 2.1.16 -> 3.3.0 update'}
          $after=Get-Content $statePath -Raw | ConvertFrom-Json
          if(@($after.channels).Count -ne 5){throw "Channel union lost during update: $(@($after.channels).Count)"}
          if(-not $after.fingerprintCache.'fixture-fp'){throw 'Fingerprint state lost during update'}
          if(-not $after.projectLifecycle.'fixture-project'){throw 'Project lifecycle state lost during update'}

          # 4) Real special path and two physical launches prove restart continuity.
          $special=Join-Path $env:USERPROFILE 'VYRON Gate\Видео & Музыка\Проект (01)'
          New-Item -ItemType Directory -Force -Path $special | Out-Null
          $probe=Join-Path $special 'данные & test (01).txt'
          [IO.File]::WriteAllText($probe,'VYRON path probe',[Text.UTF8Encoding]::new($false))
          if((Get-Content $probe -Raw) -ne 'VYRON path probe'){throw 'Windows special path readback failed'}

          foreach($attempt in 1..2){
            $proc=Start-Process -FilePath $exe.FullName -PassThru
            Start-Sleep -Seconds 7
            $proc.Refresh()
            if($proc.HasExited){throw "VYRON exited during physical Windows launch ${attempt}: $($proc.ExitCode)"}
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            $check=Get-Content $statePath -Raw | ConvertFrom-Json
            if(@($check.channels).Count -ne 5){throw "State lost after launch $attempt"}
          }

          "WINDOWS_BASELINE_2_1_16_SHA256=$baselineSha" | Add-Content migration-artifacts/gate-windows.txt
          "WINDOWS_UPDATE_2_1_16_TO_3_3_0=PASS" | Add-Content migration-artifacts/gate-windows.txt
          "WINDOWS_UPDATE_AFTER_MIGRATION_STATE=PASS" | Add-Content migration-artifacts/gate-windows.txt
          "WINDOWS_RESTART_AFTER_MIGRATION=PASS" | Add-Content migration-artifacts/gate-windows.txt
          "WINDOWS_INSTALLED_EXE=$($exe.FullName)" | Add-Content migration-artifacts/gate-windows.txt
          "WINDOWS_PHYSICAL_LAUNCH=PASS" | Add-Content migration-artifacts/gate-windows.txt
          "WINDOWS_SPECIAL_PATH=PASS" | Add-Content migration-artifacts/gate-windows.txt

      - name: Build unsigned macOS app gate
        if: ${{ matrix.name == 'macos' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > tauri.migration.gate.json <<'JSON'
          {"bundle":{"createUpdaterArtifacts":false}}
          JSON
          npx tauri build --bundles app --config tauri.migration.gate.json
          APP="$(find src-tauri/target/release/bundle -name 'VYRON.app' -type d -print -quit)"
          test -d "$APP"
          mkdir -p migration-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" migration-artifacts/VYRON-3.3.0-macos-arm64-gate.zip
          shasum -a 256 migration-artifacts/VYRON-3.3.0-macos-arm64-gate.zip | awk '{print $1}' > migration-artifacts/macos.sha256

      - name: Gate evidence
        shell: bash
        run: |
          mkdir -p migration-artifacts
          {
            echo "platform=${{ matrix.name }}"
            echo "head=$(git rev-parse HEAD)"
            echo "version=3.3.0"
            echo "merge_policy=MERGE_NEVER_REPLACE"
            echo "deleted_channels=0"
            echo "deleted_accounts=0"
            echo "duplicate_import=idempotent-test"
            echo "encrypted_bundle=argon2id+xchacha20poly1305"
          } >> migration-artifacts/gate-${{ matrix.name }}.txt

      - name: Upload dual-platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: vyron-3.3.0-migration-${{ matrix.name }}
          path: migration-artifacts/**
          if-no-files-found: error
