name: VYRON Public Release Authorization Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPO: ScaleUPPeisov/vyron-releases

jobs:
  auth-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - name: Require dedicated release-only token
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'VYRON_RELEASES_TOKEN=USER_ACTION_REQUIRED'
            exit 1
          fi
          echo 'VYRON_RELEASES_TOKEN=PRESENT'

      - name: Verify target release repository access
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$TARGET_REPO" --jq .full_name)" = "$TARGET_REPO"
          gh api "repos/$TARGET_REPO/contents/updates/latest.json?ref=main" >/dev/null
          gh api "repos/$TARGET_REPO/contents/updates/windows-latest.json?ref=main" >/dev/null
          echo 'PRIVATE_SOURCE_TO_PUBLIC_RELEASE_AUTH_READ=PASS'
          echo 'NO_RELEASE_MUTATION_PERFORMED=PASS'

      - name: Architecture guard
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'SOURCE_REPO_RELEASE_PUBLICATION=DISABLED'
          echo 'PUBLIC_RELEASE_TARGET=ScaleUPPeisov/vyron-releases'
