name: VYRON 3.3.4 Live Inventory Dev Gate

on:
  push:
    branches:
      - feature/vyron-3.3.4-live-content-inventory
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest commit on this feature branch matters during development.
  # Cancel superseded Mac/Windows matrices instead of burning minutes on stale SHAs.
  group: vyron-334-live-inventory-dev-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production feed freeze baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/vyron-mac-feed.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/vyron-win-feed.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/vyron-mac-feed.json'));const w=JSON.parse(fs.readFileSync('/tmp/vyron-win-feed.json'));if(m.version!=='3.3.3'||w.version!=='3.3.2')process.exit(1);console.log('MAC_PRODUCTION_FEED=3.3.3');console.log('WINDOWS_PRODUCTION_FEED=3.3.2');console.log('RELEASE_MUTATION=NO')"
      - name: Live inventory + preserved production regressions
        run: |
          npx vitest run             src/v334LiveContentInventory.test.ts             src/v334LiveInventorySafety.test.ts             src/renderScanClassifier.test.ts             src/readyVideoInventory.test.ts             src/v333DocxScheduleTimeSource.test.ts             src/v332WindowsOauthLauncher.test.ts             src/publisherSchedule.test.ts             src/scheduleContinuation.test.ts             src/v2111PublisherRuntime.test.ts             src/v300PublisherUiContracts.test.ts             src/v300OauthContinuity.test.ts             src/v300OauthPersistence.test.ts
      - run: npm run build

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust check + local scanner/watcher tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} local_delete
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} inventory_watch
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Capture generated Cargo.lock
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: vyron-334-generated-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 2
