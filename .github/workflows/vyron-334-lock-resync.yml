name: VYRON 3.3.4 One-Time Cargo Lock Resync

on:
  push:
    branches:
      - feature/vyron-3.3.4-live-content-inventory
    paths:
      - .github/workflows/vyron-334-lock-resync.yml

permissions:
  contents: write

concurrency:
  group: vyron-334-lock-resync
  cancel-in-progress: true

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock with pinned production-compatible Tauri stack
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Verify exact resolved versions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          s=open('src-tauri/Cargo.lock').read()
          expected={
            'tauri':'2.11.5',
            'tauri-build':'2.6.3',
            'tauri-plugin-dialog':'2.7.3',
            'tauri-plugin-opener':'2.5.5',
            'tauri-plugin-process':'2.3.1',
            'tauri-plugin-updater':'2.11.0',
            'tauri-plugin-notification':'2.4.0',
            'notify':'7.0.0',
          }
          for name,version in expected.items():
            m=re.search(r'\[\[package\]\]\nname = "'+re.escape(name)+r'"\nversion = "([^"]+)"',s)
            assert m and m.group(1)==version,(name,m.group(1) if m else None)
          print('TAURI_VERSION_ALIGNMENT=PASS')
          PY
      - name: Commit only Cargo.lock
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code -- . ':!src-tauri/Cargo.lock'
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo 'CARGO_LOCK_ALREADY_CURRENT=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          test "$(git diff --cached --name-only)" = 'src-tauri/Cargo.lock'
          git commit -m 'chore(vyron): align Cargo.lock with pinned 3.3.4 Tauri stack'
          git push origin HEAD:feature/vyron-3.3.4-live-content-inventory
