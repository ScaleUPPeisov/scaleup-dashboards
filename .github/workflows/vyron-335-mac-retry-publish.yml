name: VYRON 3.3.5 macOS Retry + Publish

on:
  push:
    branches:
      - hotfix/vyron-3.3.5-render-folder-picker
    paths:
      - '.github/workflows/vyron-335-mac-retry-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VERSION: '3.3.5'
  RELEASE_REPO: ScaleUPPeisov/vyron-releases
  WINDOWS_SOURCE_RUN: '36387982185'
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  mac:
    name: Signed macOS ARM64 retry
    runs-on: macos-14
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci --no-audit --no-fund
      - name: Picker regression + production build
        run: |
          npx vitest run src/v335RenderFolderPicker.test.ts src/v334LiveContentInventory.test.ts src/v334LiveInventorySafety.test.ts
          npm run build
      - name: Import persistent signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Normalize updater key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip()
          def dec(x):
            try:return base64.b64decode(x,validate=True).decode()
            except:return None
          if raw.startswith('untrusted comment:'): out=base64.b64encode(raw.encode()).decode()
          else:
            one=dec(raw)
            if one and one.startswith('untrusted comment:'): out=raw
            else:
              box=dec(one) if one else None
              assert box and box.startswith('untrusted comment:')
              out=one.strip()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY
      - name: Build and verify signed macOS 3.3.5
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p out-mac
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '3.3.5'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee out-mac/codesign-details.txt
          ! grep -F 'Signature=adhoc' out-mac/codesign-details.txt
          hdiutil verify "$DMG"
          cp "$DMG" out-mac/VYRON-3.3.5-arm64.dmg
          cp "$UPDATER" out-mac/VYRON.app.tar.gz
          cp "$SIG" out-mac/VYRON.app.tar.gz.sig
          shasum -a 256 out-mac/VYRON-3.3.5-arm64.dmg > out-mac/VYRON-3.3.5-arm64.dmg.sha256
          shasum -a 256 out-mac/VYRON.app.tar.gz > out-mac/VYRON.app.tar.gz.sha256
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: Quick physical launch
        shell: bash
        run: |
          set -Eeuo pipefail
          HOME_FIXTURE="$RUNNER_TEMP/vyron-335-home"; mkdir -p "$HOME_FIXTURE"
          env -i HOME="$HOME_FIXTURE" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$APP_PATH/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-335.log 2>&1 &
          P=$!; sleep 5; kill -0 "$P"; kill "$P" || true; wait "$P" || true
          echo 'MACOS_3_3_5_LAUNCH=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-3.3.5-MAC-RETRY
          path: out-mac/**
          if-no-files-found: error

  publish:
    name: Publish 3.3.5 from Mac retry + approved Windows
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
      SOURCE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-3.3.5-MAC-RETRY
          path: release/mac
      - name: Require successful Windows job and download artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$SOURCE_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$WINDOWS_SOURCE_RUN/jobs?per_page=100" > /tmp/jobs.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/jobs.json'))
          rows=[j for j in d['jobs'] if j['name']=='Signed Windows x64']
          assert len(rows)==1,rows
          assert rows[0]['status']=='completed',rows[0]['status']
          assert rows[0]['conclusion']=='success',rows[0]['conclusion']
          print('WINDOWS_APPROVED_JOB=PASS')
          PY
          mkdir -p release/windows
          GH_TOKEN="$SOURCE_TOKEN" gh run download "$WINDOWS_SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name 'VYRON-3.3.5-WINDOWS' --dir release/windows
          test -s release/windows/VYRON_3.3.5_x64-setup.exe
          test -s release/windows/VYRON_3.3.5_x64-setup.exe.sig
      - name: Publish release and feeds
        shell: bash
        run: |
          set -Eeuo pipefail
          MAC_DMG=release/mac/VYRON-3.3.5-arm64.dmg
          MAC_UPDATER=release/mac/VYRON.app.tar.gz
          MAC_SIG=release/mac/VYRON.app.tar.gz.sig
          WIN=release/windows/VYRON_3.3.5_x64-setup.exe
          WIN_SIG=release/windows/VYRON_3.3.5_x64-setup.exe.sig
          for f in "$MAC_DMG" "$MAC_UPDATER" "$MAC_SIG" "$WIN" "$WIN_SIG"; do test -s "$f"; done
          cat >/tmp/notes.md <<EOF
          ## VYRON 3.3.5 — Render Folder Picker Hotfix

          - “Выбрать Render / Сменить Render” directly in Live Content Inventory.
          - Saves only channel.renderFolderPath.
          - Blocks Projects paths, generic Render root and another channel's folder.
          - Persists immediately and rescans the selected channel.
          - OAuth, YouTube profiles, channel IDs, upload history and Projects bindings remain unchanged.
          EOF
          if GH_TOKEN="$RELEASE_TOKEN" gh release view v3.3.5 --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo 'v3.3.5 already exists'; exit 1
          fi
          GH_TOKEN="$RELEASE_TOKEN" gh release create v3.3.5 --repo "$RELEASE_REPO" --target main --title 'VYRON 3.3.5 — Render Folder Picker Hotfix' --notes-file /tmp/notes.md             "$MAC_DMG" release/mac/VYRON-3.3.5-arm64.dmg.sha256 "$MAC_UPDATER" release/mac/VYRON.app.tar.gz.sha256 "$MAC_SIG"             "$WIN" release/windows/VYRON_3.3.5_x64-setup.exe.sha256 "$WIN_SIG"
          git clone "https://x-access-token:$RELEASE_TOKEN@github.com/$RELEASE_REPO.git" release-repo
          OWNER_SHA="$(sha256sum release-repo/updates/owner-preview.json | awk '{print $1}')"
          MAC_SIG_TEXT="$(tr -d '\r\n' < "$MAC_SIG")"
          WIN_SIG_TEXT="$(tr -d '\r\n' < "$WIN_SIG")"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$MAC_SIG_TEXT" "$WIN_SIG_TEXT" "$PUB_DATE" <<'PY'
          import json,sys
          from pathlib import Path
          mac,win,pub=sys.argv[1:4]
          repo='ScaleUPPeisov/vyron-releases'
          notes='VYRON 3.3.5 — Render folder picker hotfix; exact per-channel Render selection, Projects protection, immediate persistence and rescan.'
          Path('release-repo/updates/latest.json').write_text(json.dumps({'version':'3.3.5','notes':notes,'pub_date':pub,'platforms':{'darwin-aarch64':{'url':f'https://github.com/{repo}/releases/download/v3.3.5/VYRON.app.tar.gz','signature':mac}}},ensure_ascii=False,indent=2)+'\n')
          Path('release-repo/updates/windows-latest.json').write_text(json.dumps({'version':'3.3.5','notes':notes,'pub_date':pub,'platforms':{'windows-x86_64':{'url':f'https://github.com/{repo}/releases/download/v3.3.5/VYRON_3.3.5_x64-setup.exe','signature':win}}},ensure_ascii=False,indent=2)+'\n')
          PY
          test "$(sha256sum release-repo/updates/owner-preview.json | awk '{print $1}')" = "$OWNER_SHA"
          cd release-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json updates/windows-latest.json
          git commit -m 'release: promote VYRON 3.3.5 cross-platform updater'
          git push origin main
      - name: Final API verification
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/releases/tags/v3.3.5" --jq '.tag_name + " assets=" + (.assets|length|tostring)'
          for file in latest.json windows-latest.json owner-preview.json; do
            GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/contents/updates/$file?ref=main" --jq .content | tr -d '\n' | base64 -d > "/tmp/$file"
          done
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/latest.json'))['version']=='3.3.5'
          assert json.load(open('/tmp/windows-latest.json'))['version']=='3.3.5'
          assert json.load(open('/tmp/owner-preview.json'))['version']=='3.3.1-preview.339'
          print('VYRON_3_3_5_PRODUCTION=PASS')
          PY
