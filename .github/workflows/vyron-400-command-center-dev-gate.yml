name: VYRON 4.0.0 Command Center Dev Gate

on:
  push:
    branches:
      - feature/vyron-4.0.0-command-center
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-400-command-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 4.0 targeted truth + preservation tests
        run: |
          npx vitest run             src/v400OwnerInventory.test.ts             src/v400UploadLimit.test.ts             src/v335RenderFolderPicker.test.ts             src/v334LiveContentInventory.test.ts             src/v334LiveInventorySafety.test.ts             src/renderScanClassifier.test.ts             src/youtubePublishSafety.test.ts             src/youtubeQuota.test.ts             src/youtubeQuotaAtomic.test.ts             src/youtubeQuotaRollover.test.ts
      - name: Production frontend build
        run: npm run build
      - name: Zero-data-loss source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F "OwnerInventoryScheduler" src/App.tsx
          grep -F "studio.channelflow.desktop" src-tauri/tauri.conf.json
          grep -F '"version": "4.0.0"' package.json
          ! grep -R --include='*.ts' --include='*.tsx' -E 'localStorage\.clear\(|youtubeDisconnect\(|removeChannel\(' src/ownerInventoryRuntime.ts src/OwnerInventoryScheduler.tsx src/DashboardOS.tsx
          ! grep -R --include='*.ts' --include='*.tsx' -E 'projectsFolderPath:row\.candidate|projectsFolderPath:rootValidation\.path' src/LiveContentInventory.tsx
          echo 'ZERO_DATA_LOSS_SOURCE_CONTRACT=PASS'
      - name: Production 3.3.5 feed freeze
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/mac.json'))['version']=='3.3.5'
          assert json.load(open('/tmp/win.json'))['version']=='3.3.5'
          print('PRODUCTION_FEEDS_UNCHANGED=3.3.5')
          PY
