name: VYRON 4.0.0 Signed Cross-Platform Candidate
# final-candidate-rerun-for-app-head-8b2db467

on:
  push:
    branches:
      - feature/vyron-4.0.0
    paths:
      - '.github/workflows/vyron-400-signed-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-400-signed-candidate
  cancel-in-progress: true

env:
  VERSION: '4.0.0'
  BASELINE: '3.3.5'
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  release-gate:
    name: VYRON 4 final regression / production freeze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Version + ancestry + production freeze
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 6af449b6cd5d578f6f174ed27a15393d32655e33 HEAD
          git merge-base --is-ancestor 177ffaf54b66b479a3fb1d7c6365e6ca62aab529 HEAD
          node - <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json'),t=require('./src-tauri/tauri.conf.json');
          if(p.version!=='4.0.0'||l.version!=='4.0.0'||l.packages[''].version!=='4.0.0'||t.version!=='4.0.0')process.exit(1);
          if(t.identifier!=='studio.channelflow.desktop'||t.bundle.createUpdaterArtifacts!==true)process.exit(1);
          console.log('VERSION_IDENTITY=PASS');
          NODE
          grep -F 'version = "4.0.0"' src-tauri/Cargo.toml
          grep -A1 -F 'name = "channelflow"' src-tauri/Cargo.lock | grep -F 'version = "4.0.0"'
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-before.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-before.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/mac-before.json'))['version']=='3.3.5'
          assert json.load(open('/tmp/win-before.json'))['version']=='3.3.5'
          print('PRODUCTION_FEEDS_FROZEN=3.3.5')
          PY

      - name: Critical VYRON 4 release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run             src/v400OwnerInventory.test.ts             src/v400DashboardTruth.test.ts             src/v400QuotaUploadLimitSeparation.test.ts             src/v400PerformanceAndGlobalLimit.test.ts             src/v400BrandingCelebration.test.ts             src/v400RevenueEstimate.test.ts             src/v400ScheduleFrequencyTruth.test.ts             src/v335RenderFolderPicker.test.ts             src/v334LiveContentInventory.test.ts             src/v334LiveInventorySafety.test.ts             src/v332WindowsOauthLauncher.test.ts             src/v2115Rc7OauthUpdateContinuity.test.ts             src/updaterHotfix.test.ts             src/updaterPolicy.test.ts
          npm run build

      - name: Zero-data-loss source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          types=Path('src/types.ts').read_text()
          store=Path('src/store.ts').read_text()
          owner=Path('src/youtubeOwnerInventory.ts').read_text()
          dashboard=Path('src/DashboardOS.tsx').read_text()
          schedule=Path('src/channelSchedule.ts').read_text()
          app=Path('src/App.tsx').read_text()
          required=[
            'youtubeProfileId?:string','youtubeChannelId?:string',
            'renderFolderPath?:string','projectsFolderPath?:string',
            'safeDailyUploadLimit?:number','uploadHistory:UploadHistoryRecord[]',
            'activityJournal:ActivityEvent[]','statisticsHistory:ChannelStatisticsHistory',
            'fingerprintCache:Record<string,FingerprintCacheEntry>',
            'projectLifecycle:Record<string,ProjectLifecycleRecord>'
          ]
          for x in required: assert x in types,x
          for bad in ['localStorage.clear(','removeChannel(','youtubeDisconnect(']:
            assert bad not in owner
          assert 'aggregateOwnerInventories' in dashboard
          assert 'ownerTotals.scheduled' in dashboard
          assert 'renderFolderPath' not in owner
          assert 'OWNER_INVENTORY_TTL_MS' in owner
          assert 'lastCelebratedVersion' in app or 'MajorUpdateCelebration' in app
          assert 'schedule' in schedule.lower()
          assert 'persist:async' in store
          print('EXISTING_CHANNELS=PRESERVED_CONTRACT')
          print('GOOGLE_OAUTH=PRESERVED_CONTRACT')
          print('SCHEDULE=PRESERVED_CONTRACT')
          print('ACTIVITY_HISTORY=PRESERVED_CONTRACT')
          print('ANALYTICS=PRESERVED_CONTRACT')
          print('LOCAL_INVENTORY_SEPARATION=PASS')
          PY

      - name: Production feed freeze after tests
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-after.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-after.json
          cmp -s /tmp/mac-before.json /tmp/mac-after.json
          cmp -s /tmp/win-before.json /tmp/win-after.json
          echo 'RELEASE_MUTATION=NO'

  macos-candidate:
    name: Signed macOS ARM64 candidate
    needs: release-gate
    runs-on: macos-14
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund

      - name: Import VYRON signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$ID_SHA1" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip()
          def dec(x):
            try:return base64.b64decode(x,validate=True).decode()
            except:return None
          if raw.startswith('untrusted comment:'): out=base64.b64encode(raw.encode()).decode()
          else:
            one=dec(raw)
            if one and one.startswith('untrusted comment:'): out=raw
            else:
              box=dec(one) if one else None
              assert box and box.startswith('untrusted comment:')
              out=one.strip()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build + verify signed 4.0.0
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p candidate-macos
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee candidate-macos/codesign-details.txt
          ! grep -F 'Signature=adhoc' candidate-macos/codesign-details.txt
          hdiutil verify "$DMG"
          cp "$DMG" candidate-macos/VYRON-4.0.0-arm64.dmg
          cp "$UPDATER" candidate-macos/VYRON.app.tar.gz
          cp "$SIG" candidate-macos/VYRON.app.tar.gz.sig
          shasum -a 256 candidate-macos/VYRON-4.0.0-arm64.dmg > candidate-macos/VYRON-4.0.0-arm64.dmg.sha256
          shasum -a 256 candidate-macos/VYRON.app.tar.gz > candidate-macos/VYRON.app.tar.gz.sha256
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify macOS updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def env(raw):
            x=raw.strip()
            try:
              y=base64.b64decode(x,validate=True)
              if y.startswith(b'untrusted comment:'): return y
            except Exception: pass
            return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(env(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/vyron.sig').write_bytes(env(Path('candidate-macos/VYRON.app.tar.gz.sig').read_bytes()))
          PY
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm candidate-macos/VYRON.app.tar.gz -x /tmp/vyron.sig -p /tmp/vyron.pub

      - name: Physical 3.3.5 -> 4.0.0 state continuity
        shell: bash
        run: |
          set -Eeuo pipefail
          HOME_FIXTURE="$RUNNER_TEMP/vyron-400-home"
          APP_DATA="$HOME_FIXTURE/Library/Application Support/studio.channelflow.desktop"
          DOC_STATE="$HOME_FIXTURE/Documents/VYRON/State"
          mkdir -p "$APP_DATA" "$DOC_STATE"
          python3 - "$APP_DATA/state.json" "$DOC_STATE/app-state.json" <<'PY'
          import json,sys
          state={
            'version':10,
            'channels':[{
              'id':'fixture-a','name':'Fixture A','slug':'fixture-a','enabled':True,
              'youtubeProfileId':'PROFILE_A','youtubeChannelId':'TEST_CH_A',
              'renderFolderPath':'/Volumes/FIXTURE/Render/Fixture A',
              'projectsFolderPath':'/Volumes/FIXTURE/Projects/Fixture A',
              'safeDailyUploadLimit':10,'cadenceDays':1,'scheduleMode':'interval',
              'publishIntervalDays':1,'publishHour':18,'publishMinute':0,
              'targetBufferDays':30,'language':'EN','genre':'Music','country':'US',
              'minTracks':10,'targetDurationMin':120,
              'seo':{'titlePatterns':[],'descriptionTemplate':'','tags':[],'banned':[]}
            }],
            'jobs':[{'id':'fixture-job','channelId':'fixture-a','number':1,'folder':'/fixture','status':'READY_UPLOAD','createdAt':'2026-09-28T00:00:00Z','tracksCount':10,'minTracks':10,'finalPath':'/Volumes/FIXTURE/Render/Fixture A/001.mov','title':'Fixture','description':'','tags':[],'storageLifecycle':'NEW'}],
            'competitors':[],
            'settings':{'workspace':'/fixture/workspace','renderRootPath':'/Volumes/FIXTURE/Render','endlumePath':'','youtubeApiKey':'','openaiApiKey':'','autoCheckUpdates':False,'reduceMotion':False,'fpsMonitor':False,'estimatedRpmUsd':2.5},
            'logs':[],
            'uploadHistory':[{'id':'fixture-history','jobId':'fixture-job','channelId':'fixture-a','youtubeVideoId':'fixture-video','localFilePath':'/fixture/old.mov','originalFilename':'old.mov','uploadedAt':'2026-09-27T00:00:00Z','fileSize':123,'sha256':'a'*64,'status':'UPLOADED'}],
            'activityJournal':[{'eventId':'fixture-event','timestamp':'2026-09-27T00:00:00Z','eventType':'UPLOAD_ACCEPTED','status':'SUCCESS','source':'LIVE_OPERATION'}],
            'statisticsHistory':{},
            'fingerprintCache':{'fixture-fp':{'path':'/fixture/old.mov','size':123,'mtimeMs':1,'sha256':'a'*64,'computedAt':'2026-09-27T00:00:00Z'}},
            'projectLifecycle':{'fixture-project':{'projectId':'fixture-project','projectPath':'/fixture/project','status':'RENDERED','renderExists':True,'updatedAt':'2026-09-27T00:00:00Z'}}
          }
          raw=json.dumps(state,ensure_ascii=False,indent=2).encode()
          for p in sys.argv[1:]: open(p,'wb').write(raw)
          PY
          OLD_DMG="$RUNNER_TEMP/VYRON-3.3.5-arm64.dmg"
          curl -fL --retry 3 'https://github.com/ScaleUPPeisov/vyron-releases/releases/download/v3.3.5/VYRON-3.3.5-arm64.dmg' -o "$OLD_DMG"
          OLD_M="$RUNNER_TEMP/vyron-335-mount"; mkdir -p "$OLD_M"
          hdiutil attach "$OLD_DMG" -nobrowse -readonly -mountpoint "$OLD_M"
          OLD_APP="$OLD_M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$OLD_APP/Contents/Info.plist")" = "$BASELINE"
          env -i HOME="$HOME_FIXTURE" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$OLD_APP/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-335.log 2>&1 &
          P=$!; sleep 6; kill -0 "$P"; kill "$P" || true; wait "$P" || true
          hdiutil detach "$OLD_M"
          env -i HOME="$HOME_FIXTURE" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$APP_PATH/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-400.log 2>&1 &
          P=$!; sleep 7; kill -0 "$P"; kill "$P" || true; wait "$P" || true
          python3 - "$APP_DATA/state.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          c=d['channels'][0]
          assert c['youtubeProfileId']=='PROFILE_A' and c['youtubeChannelId']=='TEST_CH_A'
          assert c['renderFolderPath']=='/Volumes/FIXTURE/Render/Fixture A'
          assert c['projectsFolderPath']=='/Volumes/FIXTURE/Projects/Fixture A'
          assert c['safeDailyUploadLimit']==10
          assert c['publishIntervalDays']==1 and c['scheduleMode']=='interval'
          assert d['uploadHistory'][0]['youtubeVideoId']=='fixture-video'
          assert d['activityJournal'][0]['eventId']=='fixture-event'
          assert d['fingerprintCache']['fixture-fp']['size']==123
          assert d['projectLifecycle']['fixture-project']['status']=='RENDERED'
          assert d['settings']['workspace']=='/fixture/workspace'
          assert d['settings']['renderRootPath']=='/Volumes/FIXTURE/Render'
          assert d['settings']['estimatedRpmUsd']==2.5
          print('MACOS_3_3_5_TO_4_0_0_STATE_CONTINUITY=PASS')
          PY

      - name: macOS candidate summary
        shell: bash
        run: |
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo 'VERSION=4.0.0'
            echo 'MACOS_SIGNED_BUILD=PASS'
            echo 'MACOS_UPDATER_SIGNATURE=PASS'
            echo 'MACOS_3_3_5_TO_4_0_0_STATE_CONTINUITY=PASS'
            echo 'PRODUCTION_FEED_MUTATED=NO'
            echo 'RELEASE_PUBLISHED=NO'
          } | tee candidate-macos/gate-summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-4.0.0-MACOS-SIGNED-CANDIDATE
          path: candidate-macos/**
          if-no-files-found: error
          retention-days: 14

  windows-candidate:
    name: Signed Windows x64 candidate
    needs: release-gate
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund

      - name: Windows regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx vitest run src/v400OwnerInventory.test.ts src/v400DashboardTruth.test.ts src/v400QuotaUploadLimitSeparation.test.ts src/v400PerformanceAndGlobalLimit.test.ts src/v400BrandingCelebration.test.ts src/v400RevenueEstimate.test.ts src/v400ScheduleFrequencyTruth.test.ts src/v332WindowsOauthLauncher.test.ts src/v2115Rc7OauthUpdateContinuity.test.ts
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_V400_REGRESSION_FAILED'}
          cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_RUST_CHECK_FAILED'}

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip()
          def dec(x):
            try:return base64.b64decode(x,validate=True).decode()
            except:return None
          if raw.startswith('untrusted comment:'): out=base64.b64encode(raw.encode()).decode()
          else:
            one=dec(raw)
            if one and one.startswith('untrusted comment:'): out=raw
            else:
              box=dec(one) if one else None
              assert box and box.startswith('untrusted comment:')
              out=one.strip()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fp: fp.write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed Windows 4.0.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_BUILD_FAILED'}
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS_MISSING'}
          $sig=Get-Item ($installer.FullName + '.sig') -ErrorAction Stop
          New-Item -ItemType Directory -Force -Path candidate-windows | Out-Null
          Copy-Item $installer.FullName candidate-windows/VYRON_4.0.0_x64-setup.exe
          Copy-Item $sig.FullName candidate-windows/VYRON_4.0.0_x64-setup.exe.sig
          $sha=(Get-FileHash candidate-windows/VYRON_4.0.0_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  VYRON_4.0.0_x64-setup.exe" | Set-Content candidate-windows/VYRON_4.0.0_x64-setup.exe.sha256

      - name: Verify Windows updater signature
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $verifyRoot=Join-Path $env:RUNNER_TEMP 'vyron-signature-verify'
          New-Item -ItemType Directory -Force -Path (Join-Path $verifyRoot 'src') | Out-Null
          @'
          [package]
          name = "vyron-signature-verify"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          base64 = "0.22"
          minisign-verify = "=0.2.5"
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'Cargo.toml')
          @'
          use base64::{engine::general_purpose::STANDARD, Engine as _};
          use minisign_verify::{PublicKey, Signature};
          use std::{env,fs};
          fn decode(encoded:&str)->String{String::from_utf8(STANDARD.decode(encoded.trim()).unwrap()).unwrap()}
          fn main(){
            let a:Vec<String>=env::args().collect(); assert_eq!(a.len(),4);
            let artifact=fs::read(&a[1]).unwrap();
            let sig=decode(&fs::read_to_string(&a[2]).unwrap());
            let conf=fs::read_to_string(&a[3]).unwrap();
            let marker="\"pubkey\": \""; let start=conf.find(marker).unwrap()+marker.len();
            let tail=&conf[start..]; let end=tail.find('"').unwrap();
            let pk=PublicKey::decode(&decode(&tail[..end])).unwrap();
            let sg=Signature::decode(&sig).unwrap();
            pk.verify(&artifact,&sg,true).unwrap();
            println!("WINDOWS_UPDATER_SIGNATURE=PASS");
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'src/main.rs')
          cargo run --quiet --release --manifest-path (Join-Path $verifyRoot 'Cargo.toml') -- candidate-windows/VYRON_4.0.0_x64-setup.exe candidate-windows/VYRON_4.0.0_x64-setup.exe.sig src-tauri/tauri.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_SIGNATURE_VERIFY_FAILED'}

      - name: Physical 3.3.5 -> 4.0.0 install and state continuity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $old=Join-Path $env:RUNNER_TEMP 'VYRON_3.3.5_x64-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/ScaleUPPeisov/vyron-releases/releases/download/v3.3.5/VYRON_3.3.5_x64-setup.exe' -OutFile $old
          $p=Start-Process -FilePath $old -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "OLD_INSTALL_EXIT=$($p.ExitCode)"}
          $appData=Join-Path $env:APPDATA 'studio.channelflow.desktop'
          $docState=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'VYRON\State'
          New-Item -ItemType Directory -Force -Path $appData,$docState | Out-Null
          $state=@{
            version=10
            channels=@(@{
              id='fixture-a';name='Fixture A';slug='fixture-a';enabled=$true
              youtubeProfileId='PROFILE_A';youtubeChannelId='TEST_CH_A'
              renderFolderPath='D:\Render\Fixture A';projectsFolderPath='D:\Projects\Fixture A'
              safeDailyUploadLimit=10;cadenceDays=1;scheduleMode='interval';publishIntervalDays=1
              publishHour=18;publishMinute=0;targetBufferDays=30;language='EN';genre='Music';country='US'
              minTracks=10;targetDurationMin=120;seo=@{titlePatterns=@();descriptionTemplate='';tags=@();banned=@()}
            })
            jobs=@(@{id='fixture-job';channelId='fixture-a';number=1;folder='D:\fixture';status='READY_UPLOAD';createdAt='2026-09-28T00:00:00Z';tracksCount=10;minTracks=10;finalPath='D:\Render\Fixture A\001.mov';title='Fixture';description='';tags=@();storageLifecycle='NEW'})
            competitors=@()
            settings=@{workspace='D:\VYRON';renderRootPath='D:\Render';endlumePath='';youtubeApiKey='';openaiApiKey='';autoCheckUpdates=$false;reduceMotion=$false;fpsMonitor=$false;estimatedRpmUsd=2.5}
            logs=@()
            uploadHistory=@(@{id='fixture-history';jobId='fixture-job';channelId='fixture-a';youtubeVideoId='fixture-video';localFilePath='D:\old.mov';originalFilename='old.mov';uploadedAt='2026-09-27T00:00:00Z';fileSize=123;sha256=('a'*64);status='UPLOADED'})
            activityJournal=@(@{eventId='fixture-event';timestamp='2026-09-27T00:00:00Z';eventType='UPLOAD_ACCEPTED';status='SUCCESS';source='LIVE_OPERATION'})
            statisticsHistory=@{}
            fingerprintCache=@{'fixture-fp'=@{path='D:\old.mov';size=123;mtimeMs=1;sha256=('a'*64);computedAt='2026-09-27T00:00:00Z'}}
            projectLifecycle=@{'fixture-project'=@{projectId='fixture-project';projectPath='D:\project';status='RENDERED';renderExists=$true;updatedAt='2026-09-27T00:00:00Z'}}
          } | ConvertTo-Json -Depth 15
          Set-Content -Path (Join-Path $appData 'state.json') -Value $state -Encoding UTF8
          Set-Content -Path (Join-Path $docState 'app-state.json') -Value $state -Encoding UTF8

          function Find-VyronExe([string]$version){
            $roots=@((Join-Path $env:LOCALAPPDATA 'Programs'),$env:LOCALAPPDATA,$env:ProgramFiles,[Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) | Where-Object {$_ -and (Test-Path $_)}
            foreach($root in $roots){
              $exe=Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.Name -in @('channelflow.exe','VYRON.exe') -and ($_.VersionInfo.ProductVersion -as [string]).StartsWith($version)} | Select-Object -First 1
              if($exe){return $exe}
            }
            return $null
          }

          $oldExe=Find-VyronExe '3.3.5'
          if(-not $oldExe){throw 'VYRON_3_3_5_EXE_NOT_FOUND'}
          $oldProc=Start-Process -FilePath $oldExe.FullName -PassThru
          Start-Sleep -Seconds 6
          $oldProc.Refresh()
          if($oldProc.HasExited){throw "VYRON_3_3_5_LAUNCH_EXITED=$($oldProc.ExitCode)"}
          Stop-Process -Id $oldProc.Id -Force -ErrorAction SilentlyContinue

          $candidate=(Resolve-Path 'candidate-windows/VYRON_4.0.0_x64-setup.exe').Path
          $p=Start-Process -FilePath $candidate -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "CANDIDATE_INSTALL_EXIT=$($p.ExitCode)"}
          $exe=Find-VyronExe '4.0.0'
          if(-not $exe){throw 'VYRON_4_0_0_EXE_NOT_FOUND'}
          $proc=Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 7
          $proc.Refresh()
          if($proc.HasExited){throw "VYRON_4_0_0_LAUNCH_EXITED=$($proc.ExitCode)"}
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          $saved=Get-Content (Join-Path $appData 'state.json') -Raw | ConvertFrom-Json
          $c=$saved.channels[0]
          if($c.youtubeProfileId -ne 'PROFILE_A' -or $c.youtubeChannelId -ne 'TEST_CH_A'){throw 'OAUTH_CHANNEL_BINDING_CHANGED'}
          if($c.renderFolderPath -ne 'D:\Render\Fixture A'){throw 'RENDER_PATH_CHANGED'}
          if($c.projectsFolderPath -ne 'D:\Projects\Fixture A'){throw 'PROJECTS_PATH_CHANGED'}
          if($c.safeDailyUploadLimit -ne 10){throw 'UPLOAD_LIMIT_CHANGED'}
          if($c.publishIntervalDays -ne 1 -or $c.scheduleMode -ne 'interval'){throw 'SCHEDULE_CHANGED'}
          if($saved.uploadHistory[0].youtubeVideoId -ne 'fixture-video'){throw 'UPLOAD_HISTORY_CHANGED'}
          if($saved.activityJournal[0].eventId -ne 'fixture-event'){throw 'ACTIVITY_CHANGED'}
          if($saved.fingerprintCache.'fixture-fp'.size -ne 123){throw 'FINGERPRINT_CHANGED'}
          if($saved.projectLifecycle.'fixture-project'.status -ne 'RENDERED'){throw 'PROJECT_LIFECYCLE_CHANGED'}
          if($saved.settings.renderRootPath -ne 'D:\Render'){throw 'RENDER_ROOT_CHANGED'}
          if([double]$saved.settings.estimatedRpmUsd -ne 2.5){throw 'RPM_SETTING_CHANGED'}
          Write-Host 'WINDOWS_3_3_5_TO_4_0_0_STATE_CONTINUITY=PASS'

      - name: Windows candidate summary
        shell: pwsh
        run: |
          @(
            "HEAD=$(git rev-parse HEAD)",
            'VERSION=4.0.0',
            'WINDOWS_X64_SIGNED_BUILD=PASS',
            'WINDOWS_UPDATER_SIGNATURE=PASS',
            'WINDOWS_3_3_5_TO_4_0_0_STATE_CONTINUITY=PASS',
            'WINDOWS_10_PHYSICAL=NOT_RUN_NO_SELF_HOSTED_RUNNER',
            'WINDOWS_11_PHYSICAL=NOT_RUN_NO_SELF_HOSTED_RUNNER',
            'PRODUCTION_FEED_MUTATED=NO',
            'RELEASE_PUBLISHED=NO'
          ) | Set-Content candidate-windows/gate-summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-4.0.0-WINDOWS-SIGNED-CANDIDATE
          path: candidate-windows/**
          if-no-files-found: error
          retention-days: 14

  final-freeze:
    name: Final candidate freeze proof
    needs: [macos-candidate, windows-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production remains 3.3.5
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/mac.json'))['version']=='3.3.5'
          assert json.load(open('/tmp/win.json'))['version']=='3.3.5'
          print('SIGNED_CANDIDATES_READY=YES')
          print('PRODUCTION_FEEDS_UNCHANGED=3.3.5')
          print('VYRON_4_0_0_RELEASE_PUBLISHED=NO')
          print('RELEASE_REQUIRES_EXPLICIT_OWNER_CONFIRMATION=YES')
          print('WINDOWS_10_11_PHYSICAL_REMAINS_EXTERNAL_GATE=YES')
          PY
