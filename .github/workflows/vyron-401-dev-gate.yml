name: VYRON 4.0.1 Dev Gate

on:
  push:
    branches:
      - feature/vyron-4.0.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-401-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical:
    name: 4.0.1 critical regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Hotfix + preservation tests
        run: >
          npx vitest run
          src/v401HotfixContract.test.ts
          src/v400OwnerInventory.test.ts
          src/v400DashboardTruth.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/v400PerformanceAndGlobalLimit.test.ts
          src/v400BlackScreenGuard.test.ts
          src/v400BrandingCelebration.test.ts
          src/v400RevenueEstimate.test.ts
          src/v400ScheduleFrequencyTruth.test.ts
          src/v335RenderFolderPicker.test.ts
          src/v334LiveContentInventory.test.ts
          src/v334LiveInventorySafety.test.ts
          src/v332WindowsOauthLauncher.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
          src/updaterHotfix.test.ts
          src/updaterPolicy.test.ts
      - name: Frontend production build
        run: npm run build
      - name: 4.0.1 version identity
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const p=require('./package.json');
          const l=require('./package-lock.json');
          const t=require('./src-tauri/tauri.conf.json');
          for(const v of [p.version,l.version,l.packages[''].version,t.version]){
            if(v!=='4.0.1') process.exit(1);
          }
          if(t.identifier!=='studio.channelflow.desktop') process.exit(1);
          console.log('VYRON_4_0_1_IDENTITY=PASS');
          NODE
          grep -F 'version = "4.0.1"' src-tauri/Cargo.toml
          grep -A1 -F 'name = "channelflow"' src-tauri/Cargo.lock | grep -F 'version = "4.0.1"'
      - name: Production feeds stay untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/mac.json'))['version']=='3.3.5'
          assert json.load(open('/tmp/win.json'))['version']=='3.3.5'
          print('PRODUCTION_FEEDS_UNCHANGED=3.3.5')
          PY

  parity:
    name: ${{ matrix.os }}
    needs: critical
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Hotfix regression
        run: >
          npx vitest run
          src/v401HotfixContract.test.ts
          src/v400PerformanceAndGlobalLimit.test.ts
          src/v400BlackScreenGuard.test.ts
          src/v400BrandingCelebration.test.ts
          src/v334LiveInventorySafety.test.ts
          src/v332WindowsOauthLauncher.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
      - name: Frontend build
        run: npm run build
      - name: Native compile
        run: cargo check --manifest-path src-tauri/Cargo.toml
