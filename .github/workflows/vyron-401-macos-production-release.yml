# build-rerun-migration-save-fix
name: VYRON 4.0.1 macOS Production Release

on:
  push:
    branches:
      - feature/vyron-4.0.1
    paths:
      - '.github/workflows/vyron-401-macos-production-release.yml'

permissions:
  contents: read

concurrency:
  group: vyron-401-macos-production-release
  cancel-in-progress: false

env:
  VERSION: '4.0.1'
  BASELINE: '4.0.0'
  TAG: v4.0.1
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  SOURCE_REPO: ScaleUPPeisov/scaleup-dashboards
  RELEASE_REPO: ScaleUPPeisov/vyron-releases
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  publish-macos:
    name: Build, verify and publish VYRON 4.0.1 macOS
    runs-on: macos-14
    timeout-minutes: 150
    env:
      RELEASE_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - name: Lock production baseline and Windows feed
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-before.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-before.json
          python3 - <<'PY'
          import json
          mac=json.load(open('/tmp/mac-before.json'))
          win=json.load(open('/tmp/win-before.json'))
          assert mac['version']=='4.0.0',mac['version']
          assert win['version']=='4.0.0',win['version']
          print('MAC_BASELINE=4.0.0')
          print('WINDOWS_FEED_LOCKED=4.0.0')
          PY
          shasum -a 256 /tmp/win-before.json | awk '{print $1}' >/tmp/win-before.sha
          if GH_TOKEN="$RELEASE_TOKEN" gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo 'BLOCKER=V4_0_1_RELEASE_ALREADY_EXISTS'
            exit 1
          fi

      - name: Full VYRON 4.0.1 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run             src/v401Hotfix.test.ts             src/v400PerformanceAndGlobalLimit.test.ts             src/v400BrandingCelebration.test.ts             src/v400OwnerInventory.test.ts             src/v400DashboardTruth.test.ts             src/v400ScheduleFrequencyTruth.test.ts             src/v335RenderFolderPicker.test.ts             src/v334LiveContentInventory.test.ts             src/v334LiveInventorySafety.test.ts             src/v332WindowsOauthLauncher.test.ts             src/v2115Rc7OauthUpdateContinuity.test.ts             src/updaterHotfix.test.ts             src/updaterPolicy.test.ts
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          cargo test --manifest-path src-tauri/Cargo.toml --lib storage::v213_storage_tests
          node - <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json'),t=require('./src-tauri/tauri.conf.json');
          if(p.version!=='4.0.1'||l.version!=='4.0.1'||l.packages[''].version!=='4.0.1'||t.version!=='4.0.1')process.exit(1);
          if(t.identifier!=='studio.channelflow.desktop'||t.bundle.createUpdaterArtifacts!==true)process.exit(1);
          console.log('V401_VERSION_IDENTITY=PASS');
          NODE
          grep -F 'version = "4.0.1"' src-tauri/Cargo.toml
          grep -A1 -F 'name = "channelflow"' src-tauri/Cargo.lock | grep -F 'version = "4.0.1"'

      - name: Import VYRON signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo 'MACOS_DEVELOPER_ID=PASS'

      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip()
          def dec(x):
            try:return base64.b64decode(x,validate=True).decode()
            except:return None
          if raw.startswith('untrusted comment:'): out=base64.b64encode(raw.encode()).decode()
          else:
            one=dec(raw)
            if one and one.startswith('untrusted comment:'): out=raw
            else:
              box=dec(one) if one else None
              assert box and box.startswith('untrusted comment:')
              out=one.strip()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY

      - name: Build signed macOS 4.0.1 production artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p release/mac
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee release/mac/codesign-details.txt
          ! grep -F 'Signature=adhoc' release/mac/codesign-details.txt
          hdiutil verify "$DMG"
          cp "$DMG" release/mac/VYRON-4.0.1-arm64.dmg
          cp "$UPDATER" release/mac/VYRON.app.tar.gz
          cp "$SIG" release/mac/VYRON.app.tar.gz.sig
          shasum -a 256 release/mac/VYRON-4.0.1-arm64.dmg > release/mac/VYRON-4.0.1-arm64.dmg.sha256
          shasum -a 256 release/mac/VYRON.app.tar.gz > release/mac/VYRON.app.tar.gz.sha256
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def env(raw):
            x=raw.strip()
            try:
              y=base64.b64decode(x,validate=True)
              if y.startswith(b'untrusted comment:'): return y
            except Exception: pass
            return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(env(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/vyron.sig').write_bytes(env(Path('release/mac/VYRON.app.tar.gz.sig').read_bytes()))
          PY
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm release/mac/VYRON.app.tar.gz -x /tmp/vyron.sig -p /tmp/vyron.pub
          echo 'MACOS_UPDATER_SIGNATURE=PASS'

      - name: Physical 4.0.0 to 4.0.1 continuity
        shell: bash
        run: |
          set -Eeuo pipefail
          HOME_FIXTURE="$RUNNER_TEMP/vyron-401-release-home"
          APP_DATA="$HOME_FIXTURE/Library/Application Support/studio.channelflow.desktop"
          DOC_STATE="$HOME_FIXTURE/Documents/VYRON/State"
          mkdir -p "$APP_DATA" "$DOC_STATE"
          python3 - "$APP_DATA/state.json" "$DOC_STATE/app-state.json" <<'PY'
          import json,sys
          state={
            'version':10,
            'channels':[
              {'id':'fixture-a','name':'Fixture A','slug':'fixture-a','enabled':True,'youtubeProfileId':'PROFILE_A','youtubeChannelId':'TEST_CH_A','renderFolderPath':'/Volumes/FIXTURE/Render/Fixture A','projectsFolderPath':'/Volumes/FIXTURE/Projects/Fixture A','safeDailyUploadLimit':10,'cadenceDays':1,'scheduleMode':'interval','publishIntervalDays':1,'publishHour':18,'publishMinute':0,'targetBufferDays':30,'language':'EN','genre':'Music','country':'US','minTracks':10,'targetDurationMin':120,'seo':{'titlePatterns':[],'descriptionTemplate':'','tags':[],'banned':[]}},
              {'id':'fixture-a-duplicate','name':'Fixture A duplicate','slug':'fixture-a-copy','enabled':True,'youtubeProfileId':'PROFILE_A','youtubeChannelId':'TEST_CH_A','renderFolderPath':'/Volumes/FIXTURE/Render/Fixture A','projectsFolderPath':'/Volumes/FIXTURE/Projects/Fixture A','cadenceDays':1,'publishHour':18,'publishMinute':0,'targetBufferDays':30,'language':'EN','genre':'Music','country':'US','minTracks':10,'targetDurationMin':120,'seo':{'titlePatterns':[],'descriptionTemplate':'','tags':[],'banned':[]}}
            ],
            'jobs':[{'id':'fixture-job','channelId':'fixture-a-duplicate','number':1,'folder':'/fixture','status':'READY_UPLOAD','createdAt':'2026-09-28T00:00:00Z','tracksCount':10,'minTracks':10,'finalPath':'/Volumes/FIXTURE/Render/Fixture A/001.mov','title':'Fixture','description':'','tags':[],'storageLifecycle':'NEW'}],
            'competitors':[],
            'settings':{'workspace':'/fixture/workspace','renderRootPath':'/Volumes/FIXTURE/Render','endlumePath':'','youtubeApiKey':'','openaiApiKey':'','autoCheckUpdates':False,'reduceMotion':False,'fpsMonitor':False,'localProfileName':'Кирилл','localProfileRole':'Owner / YouTube Manager','localProfileCompany':'VYRON / ScaleUP'},
            'logs':[],
            'uploadHistory':[{'id':'fixture-history','jobId':'fixture-job','channelId':'fixture-a-duplicate','youtubeVideoId':'fixture-video','localFilePath':'/fixture/old.mov','originalFilename':'old.mov','uploadedAt':'2026-09-27T00:00:00Z','fileSize':123,'sha256':'a'*64,'status':'UPLOADED'}],
            'activityJournal':[{'eventId':'fixture-event','timestamp':'2026-09-27T00:00:00Z','eventType':'UPLOAD_ACCEPTED','status':'SUCCESS','source':'LIVE_OPERATION','channelId':'fixture-a-duplicate'}],
            'statisticsHistory':{},
            'fingerprintCache':{'fixture-fp':{'path':'/fixture/old.mov','size':123,'mtimeMs':1,'sha256':'a'*64,'computedAt':'2026-09-27T00:00:00Z'}},
            'projectLifecycle':{'fixture-project':{'projectId':'fixture-project','projectPath':'/fixture/project','status':'RENDERED','renderExists':True,'updatedAt':'2026-09-27T00:00:00Z'}}
          }
          raw=json.dumps(state,ensure_ascii=False,indent=2).encode()
          for p in sys.argv[1:]: open(p,'wb').write(raw)
          PY
          OLD_DMG="$RUNNER_TEMP/VYRON-4.0.0-arm64.dmg"
          curl -fL --retry 3 "https://github.com/$RELEASE_REPO/releases/download/v4.0.0/VYRON-4.0.0-arm64.dmg" -o "$OLD_DMG"
          OLD_M="$RUNNER_TEMP/vyron-400-release-mount"; mkdir -p "$OLD_M"
          hdiutil attach "$OLD_DMG" -nobrowse -readonly -mountpoint "$OLD_M"
          OLD_APP="$OLD_M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$OLD_APP/Contents/Info.plist")" = "$BASELINE"
          env -i HOME="$HOME_FIXTURE" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$OLD_APP/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-400-release.log 2>&1 &
          P=$!; sleep 5; kill -0 "$P"; kill "$P" || true; wait "$P" || true
          hdiutil detach "$OLD_M"
          env -i HOME="$HOME_FIXTURE" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$APP_PATH/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-401-release.log 2>&1 &
          P=$!; sleep 7; kill -0 "$P"; kill "$P" || true; wait "$P" || true
          python3 - "$APP_DATA/state.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert len(d['channels'])==1,d['channels']
          c=d['channels'][0]
          assert c['youtubeProfileId']=='PROFILE_A'
          assert c['youtubeChannelId']=='TEST_CH_A'
          assert c['renderFolderPath']=='/Volumes/FIXTURE/Render/Fixture A'
          assert c['projectsFolderPath']=='/Volumes/FIXTURE/Projects/Fixture A'
          assert d['jobs'][0]['channelId']==c['id']
          assert d['uploadHistory'][0]['channelId']==c['id']
          assert d['activityJournal'][0]['channelId']==c['id']
          assert d['settings']['localProfileName']=='Кирилл'
          assert d['settings']['localProfileCompany']=='VYRON / ScaleUP'
          assert d['fingerprintCache']['fixture-fp']['size']==123
          print('MACOS_4_0_0_TO_4_0_1_CONTINUITY=PASS')
          PY

      - name: Publish macOS-only GitHub release
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 4.0.1 — macOS Stability & Performance Hotfix

          - Reduced render inventory state-write storms with batched fingerprint cache updates.
          - Moved persistent state disk work off the UI command path and serialized/coalesced writes.
          - Reduced unnecessary full inventory rescans while preserving filesystem watcher updates.
          - Added global History entry and per-channel activity summary.
          - Added resilient YouTube channel avatars across core channel surfaces.
          - Added local owner profile with Finder image import.
          - Added stable channel-ID deduplication/remapping during hydration.
          - Preserves existing channels, OAuth bindings, Render/Projects paths, upload history, activity journal, statistics, fingerprints and settings.
          - macOS release only. Windows remains on 4.0.0.
          EOF
          GH_TOKEN="$RELEASE_TOKEN" gh release create "$TAG" --repo "$RELEASE_REPO" --target main             --title 'VYRON 4.0.1 — macOS Stability & Performance Hotfix'             --notes-file /tmp/release-notes.md             release/mac/VYRON-4.0.1-arm64.dmg             release/mac/VYRON-4.0.1-arm64.dmg.sha256             release/mac/VYRON.app.tar.gz             release/mac/VYRON.app.tar.gz.sha256             release/mac/VYRON.app.tar.gz.sig
          echo 'VYRON_4_0_1_MACOS_RELEASE=PUBLISHED'

      - name: Verify remote release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/releases/tags/$TAG" >/tmp/release.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/release.json'))
          assert d['tag_name']=='v4.0.1'
          assert not d['draft'] and not d['prerelease']
          required={'VYRON-4.0.1-arm64.dmg','VYRON-4.0.1-arm64.dmg.sha256','VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig'}
          assets={x['name']:x for x in d['assets']}
          assert required <= set(assets),required-set(assets)
          for name in required: assert assets[name]['size']>0,name
          assert not any('x64' in x.lower() or 'setup.exe' in x.lower() for x in assets)
          print('REMOTE_MACOS_ASSETS=PASS')
          print('WINDOWS_ASSET_PUBLISHED=NO')
          PY

      - name: Promote macOS updater feed only
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:$RELEASE_TOKEN@github.com/$RELEASE_REPO.git" release-repo
          WIN_BEFORE_SHA="$(cat /tmp/win-before.sha)"
          test "$(shasum -a 256 release-repo/updates/windows-latest.json | awk '{print $1}')" = "$WIN_BEFORE_SHA"
          MAC_SIG="$(tr -d '\r\n' < release/mac/VYRON.app.tar.gz.sig)"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$MAC_SIG" "$PUB_DATE" <<'PY'
          import json,sys
          from pathlib import Path
          sig,pub=sys.argv[1:3]
          repo='ScaleUPPeisov/vyron-releases'
          notes='VYRON 4.0.1 — macOS stability and performance hotfix: smoother inventory scans, coalesced persistence, History improvements, channel avatars, owner profile and channel deduplication.'
          Path('release-repo/updates/latest.json').write_text(json.dumps({
            'version':'4.0.1','notes':notes,'pub_date':pub,
            'platforms':{'darwin-aarch64':{
              'url':f'https://github.com/{repo}/releases/download/v4.0.1/VYRON.app.tar.gz',
              'signature':sig
            }}
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cd release-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json
          test -z "$(git status --porcelain -- updates/windows-latest.json)"
          git commit -m 'release: promote VYRON 4.0.1 macOS updater'
          git push origin main
          echo 'MACOS_FEED_PROMOTED=4.0.1'

      - name: Final production verification
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/mac-after.json
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/contents/updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/win-after.json
          python3 - <<'PY'
          import json
          mac=json.load(open('/tmp/mac-after.json'))
          win=json.load(open('/tmp/win-after.json'))
          assert mac['version']=='4.0.1'
          assert win['version']=='4.0.0'
          assert mac['platforms']['darwin-aarch64']['url'].endswith('/v4.0.1/VYRON.app.tar.gz')
          assert mac['platforms']['darwin-aarch64']['signature'].strip()
          print('MACOS_PRODUCTION_FEED=4.0.1')
          print('WINDOWS_PRODUCTION_FEED=4.0.0')
          PY
          test "$(shasum -a 256 /tmp/win-after.json | awk '{print $1}')" = "$(cat /tmp/win-before.sha)"
          rm -rf /tmp/v401-remote && mkdir /tmp/v401-remote
          GH_TOKEN="$RELEASE_TOKEN" gh release download "$TAG" --repo "$RELEASE_REPO" --dir /tmp/v401-remote             --pattern 'VYRON.app.tar.gz'             --pattern 'VYRON.app.tar.gz.sig'
          cmp -s release/mac/VYRON.app.tar.gz /tmp/v401-remote/VYRON.app.tar.gz
          cmp -s release/mac/VYRON.app.tar.gz.sig /tmp/v401-remote/VYRON.app.tar.gz.sig
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON-4.0.1-arm64.dmg" -o /tmp/mac-byte >/dev/null 2>&1
          echo 'REMOTE_ARTIFACT_BYTE_IDENTITY=PASS'
          echo 'WINDOWS_FEED_UNCHANGED=PASS'
          echo 'VYRON_4_0_1_MACOS_PRODUCTION=PASS'
