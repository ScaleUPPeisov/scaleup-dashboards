# candidate-source: v5-owner-ux-complete
name: VYRON 5.0.0 Signed Candidate

on:
  push:
    branches:
      - feature/vyron-5.0.0
    paths:
      - '.github/workflows/vyron-500-signed-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-500-signed-candidate
  cancel-in-progress: true

env:
  VERSION: '5.0.0'
  MAC_BASELINE: '4.0.1'
  WIN_BASELINE: '4.0.0'
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  preflight:
    name: VYRON 5.0.0 candidate preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Install Tauri Linux test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Freeze production feeds
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-before.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-before.json
          python3 - <<'PY'
          import json
          mac=json.load(open('/tmp/mac-before.json')); win=json.load(open('/tmp/win-before.json'))
          assert mac['version']=='4.0.1',mac['version']
          assert win['version']=='4.0.0',win['version']
          print('PRODUCTION_FEEDS_FROZEN=mac:4.0.1 windows:4.0.0')
          PY
      - name: Full VYRON 5 regression
        run: >
          npx vitest run
          src/v500Contract.test.ts
          src/v500Performance.test.ts
          src/dailyOperations.test.ts
          src/systemHealth.test.ts
          src/productionPipeline.test.ts
          src/batchControlContract.test.ts
          src/diagnosticReport.test.ts
          src/youtubeQuotaTrace.test.ts
          src/startupQuotaProbe.test.ts
          src/updaterRuntime.test.ts
          src/v400OwnerInventory.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/v400PerformanceAndGlobalLimit.test.ts
          src/v400BlackScreenGuard.test.ts
          src/v400RevenueEstimate.test.ts
          src/v400ScheduleFrequencyTruth.test.ts
          src/v335RenderFolderPicker.test.ts
          src/v334LiveContentInventory.test.ts
          src/v332WindowsOauthLauncher.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
          src/updaterHotfix.test.ts
          src/updaterPolicy.test.ts
      - run: npm run build
      - name: Migration and secure continuity tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml migration::tests::channel_merge_is_idempotent_and_never_deletes -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml migration::tests::encryption_rejects_tamper_and_wrong_password -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml migration::tests::thirty_plus_ten_with_seven_duplicates_is_thirty_three -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --lib storage::v213_storage_tests
      - name: Version identity
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json'),t=require('./src-tauri/tauri.conf.json');
          for(const v of [p.version,l.version,l.packages[''].version,t.version]) if(v!=='5.0.0') process.exit(1);
          if(t.identifier!=='studio.channelflow.desktop'||t.bundle.createUpdaterArtifacts!==true) process.exit(1);
          console.log('VYRON_5_0_0_IDENTITY=PASS');
          NODE
          grep -F 'version = "5.0.0"' src-tauri/Cargo.toml
          grep -A1 -F 'name = "channelflow"' src-tauri/Cargo.lock | grep -F 'version = "5.0.0"'

  macos-candidate:
    name: VYRON 5.0.0 signed macOS ARM64 candidate
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Freeze production feeds before macOS candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-before.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-before.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/mac-before.json'))['version']=='4.0.1'
          assert json.load(open('/tmp/win-before.json'))['version']=='4.0.0'
          PY
      - name: macOS regression and native compile
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run src/v500Contract.test.ts src/v500Performance.test.ts src/dailyOperations.test.ts src/systemHealth.test.ts src/productionPipeline.test.ts src/batchControlContract.test.ts src/diagnosticReport.test.ts src/youtubeQuotaTrace.test.ts src/startupQuotaProbe.test.ts src/updaterRuntime.test.ts src/v400OwnerInventory.test.ts src/v400PerformanceAndGlobalLimit.test.ts src/v400BlackScreenGuard.test.ts src/v2115Rc7OauthUpdateContinuity.test.ts
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
      - name: Import VYRON signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip()
          def dec(x):
            try:return base64.b64decode(x,validate=True).decode()
            except:return None
          if raw.startswith('untrusted comment:'): out=base64.b64encode(raw.encode()).decode()
          else:
            one=dec(raw)
            if one and one.startswith('untrusted comment:'): out=raw
            else:
              box=dec(one) if one else None
              assert box and box.startswith('untrusted comment:')
              out=one.strip()
          open(os.environ['GITHUB_ENV'],'a').write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY
      - name: Build and verify signed macOS 5.0.0
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          echo "Using macOS signing identity: $APPLE_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p candidate-macos
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee candidate-macos/codesign-details.txt
          ! grep -F 'Signature=adhoc' candidate-macos/codesign-details.txt
          hdiutil verify "$DMG"
          cp "$DMG" candidate-macos/VYRON-5.0.0-arm64.dmg
          cp "$UPDATER" candidate-macos/VYRON.app.tar.gz
          cp "$SIG" candidate-macos/VYRON.app.tar.gz.sig
          shasum -a 256 candidate-macos/VYRON-5.0.0-arm64.dmg > candidate-macos/VYRON-5.0.0-arm64.dmg.sha256
          shasum -a 256 candidate-macos/VYRON.app.tar.gz > candidate-macos/VYRON.app.tar.gz.sha256
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: Verify macOS updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def env(raw):
            x=raw.strip()
            try:
              y=base64.b64decode(x,validate=True)
              if y.startswith(b'untrusted comment:'): return y
            except Exception: pass
            return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(env(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/vyron.sig').write_bytes(env(Path('candidate-macos/VYRON.app.tar.gz.sig').read_bytes()))
          PY
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm candidate-macos/VYRON.app.tar.gz -x /tmp/vyron.sig -p /tmp/vyron.pub
      - name: Physical macOS 4.0.1 to 5.0.0 continuity
        shell: bash
        run: |
          set -Eeuo pipefail
          HOME_FIXTURE="$RUNNER_TEMP/vyron-500-home"
          APP_DATA="$HOME_FIXTURE/Library/Application Support/studio.channelflow.desktop"
          DOC_STATE="$HOME_FIXTURE/Documents/VYRON/State"
          mkdir -p "$APP_DATA" "$DOC_STATE"
          python3 - "$APP_DATA/state.json" "$DOC_STATE/app-state.json" <<'PY'
          import json,sys
          state={
            'version':10,
            'channels':[
              {'id':'fixture-a','name':'Fixture A','slug':'fixture-a','enabled':True,'youtubeProfileId':'PROFILE_A','youtubeChannelId':'TEST_CH_A','renderFolderPath':'/Volumes/FIXTURE/Render/Fixture A','projectsFolderPath':'/Volumes/FIXTURE/Projects/Fixture A','safeDailyUploadLimit':10,'cadenceDays':1,'scheduleMode':'interval','publishIntervalDays':1,'publishHour':18,'publishMinute':0,'targetBufferDays':30,'language':'EN','genre':'Music','country':'US','minTracks':10,'targetDurationMin':120,'seo':{'titlePatterns':[],'descriptionTemplate':'','tags':[],'banned':[]}},
              {'id':'fixture-a-duplicate','name':'Fixture A duplicate','slug':'fixture-a-copy','enabled':True,'youtubeProfileId':'PROFILE_A','youtubeChannelId':'TEST_CH_A','renderFolderPath':'/Volumes/FIXTURE/Render/Fixture A','projectsFolderPath':'/Volumes/FIXTURE/Projects/Fixture A','cadenceDays':1,'publishHour':18,'publishMinute':0,'targetBufferDays':30,'language':'EN','genre':'Music','country':'US','minTracks':10,'targetDurationMin':120,'seo':{'titlePatterns':[],'descriptionTemplate':'','tags':[],'banned':[]}}
            ],
            'jobs':[{'id':'fixture-job','channelId':'fixture-a-duplicate','number':1,'folder':'/fixture','status':'READY_UPLOAD','createdAt':'2026-09-28T00:00:00Z','tracksCount':10,'minTracks':10,'finalPath':'/Volumes/FIXTURE/Render/Fixture A/001.mov','title':'Fixture','description':'','tags':[],'storageLifecycle':'NEW'}],
            'competitors':[],
            'settings':{'workspace':'/fixture/workspace','renderRootPath':'/Volumes/FIXTURE/Render','endlumePath':'','youtubeApiKey':'','openaiApiKey':'','autoCheckUpdates':False,'reduceMotion':False,'fpsMonitor':False,'localProfileName':'Кирилл','localProfileRole':'Owner / YouTube Manager','localProfileCompany':'VYRON / ScaleUP','localProfileAvatarPath':'/fixture/avatar.webp','estimatedRpmUsd':2.5},
            'logs':[],
            'uploadHistory':[{'id':'fixture-history','jobId':'fixture-job','channelId':'fixture-a-duplicate','youtubeVideoId':'fixture-video','localFilePath':'/fixture/old.mov','originalFilename':'old.mov','uploadedAt':'2026-09-27T00:00:00Z','fileSize':123,'sha256':'a'*64,'status':'UPLOADED'}],
            'activityJournal':[{'eventId':'fixture-event','timestamp':'2026-09-27T00:00:00Z','eventType':'UPLOAD_ACCEPTED','status':'SUCCESS','source':'LIVE_OPERATION','channelId':'fixture-a-duplicate'}],
            'statisticsHistory':{'fixture-a':[{'capturedAt':'2026-09-27T00:00:00Z','views':123}]},
            'fingerprintCache':{'fixture-fp':{'path':'/fixture/old.mov','size':123,'mtimeMs':1,'sha256':'a'*64,'computedAt':'2026-09-27T00:00:00Z'}},
            'projectLifecycle':{'fixture-project':{'projectId':'fixture-project','projectPath':'/fixture/project','status':'RENDERED','renderExists':True,'updatedAt':'2026-09-27T00:00:00Z'}}
          }
          raw=json.dumps(state,ensure_ascii=False,indent=2).encode()
          for p in sys.argv[1:]: open(p,'wb').write(raw)
          PY
          OLD_DMG="$RUNNER_TEMP/VYRON-4.0.1-arm64.dmg"
          curl -fL --retry 3 'https://github.com/ScaleUPPeisov/vyron-releases/releases/download/v4.0.1/VYRON-4.0.1-arm64.dmg' -o "$OLD_DMG"
          OLD_M="$RUNNER_TEMP/vyron-401-mount"; mkdir -p "$OLD_M"
          hdiutil attach "$OLD_DMG" -nobrowse -readonly -mountpoint "$OLD_M"
          OLD_APP="$OLD_M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$OLD_APP/Contents/Info.plist")" = "$MAC_BASELINE"
          env -i HOME="$HOME_FIXTURE" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$OLD_APP/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-401.log 2>&1 &
          P=$!; sleep 5; kill -0 "$P"; kill "$P" || true; wait "$P" || true
          hdiutil detach "$OLD_M"
          env -i HOME="$HOME_FIXTURE" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$APP_PATH/Contents/MacOS/$EXECUTABLE" >/tmp/vyron-500.log 2>&1 &
          P=$!; sleep 8; kill -0 "$P"; kill "$P" || true; wait "$P" || true
          python3 - "$APP_DATA/state.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert len(d['channels'])==1,d['channels']
          c=d['channels'][0]
          assert c['youtubeProfileId']=='PROFILE_A' and c['youtubeChannelId']=='TEST_CH_A'
          assert c['renderFolderPath']=='/Volumes/FIXTURE/Render/Fixture A'
          assert c['projectsFolderPath']=='/Volumes/FIXTURE/Projects/Fixture A'
          assert d['jobs'][0]['channelId']==c['id']
          assert d['uploadHistory'][0]['channelId']==c['id']
          assert d['activityJournal'][0]['channelId']==c['id']
          assert d['settings']['localProfileName']=='Кирилл'
          assert d['settings']['localProfileCompany']=='VYRON / ScaleUP'
          assert d['settings']['localProfileAvatarPath']=='/fixture/avatar.webp'
          assert d['fingerprintCache']['fixture-fp']['size']==123
          assert d['projectLifecycle']['fixture-project']['status']=='RENDERED'
          print('MACOS_4_0_1_TO_5_0_0_CONTINUITY=PASS')
          PY
      - name: Verify feeds unchanged after macOS candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-after.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-after.json
          cmp -s /tmp/mac-before.json /tmp/mac-after.json
          cmp -s /tmp/win-before.json /tmp/win-after.json
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo 'VERSION=5.0.0'
            echo 'MACOS_SIGNED_BUILD=PASS'
            echo 'MACOS_UPDATER_SIGNATURE=PASS'
            echo 'MACOS_4_0_1_TO_5_0_0_CONTINUITY=PASS'
            echo 'PRODUCTION_FEED_MUTATED=NO'
            echo 'RELEASE_PUBLISHED=NO'
          } | tee candidate-macos/gate-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-5.0.0-MACOS-SIGNED-CANDIDATE
          path: candidate-macos/**
          if-no-files-found: error
          retention-days: 14

  windows-candidate:
    name: VYRON 5.0.0 Windows x64 signed updater candidate
    needs: macos-candidate
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Freeze production feeds before Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json' -OutFile "$env:RUNNER_TEMP\mac-before.json"
          Invoke-WebRequest 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json' -OutFile "$env:RUNNER_TEMP\win-before.json"
          $mac=Get-Content "$env:RUNNER_TEMP\mac-before.json" -Raw | ConvertFrom-Json
          $win=Get-Content "$env:RUNNER_TEMP\win-before.json" -Raw | ConvertFrom-Json
          if($mac.version -ne '4.0.1' -or $win.version -ne '4.0.0'){throw 'PRODUCTION_FEED_BASELINE_CHANGED'}
      - name: Windows regression and native compile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx vitest run src/v500Contract.test.ts src/v500Performance.test.ts src/dailyOperations.test.ts src/systemHealth.test.ts src/productionPipeline.test.ts src/batchControlContract.test.ts src/diagnosticReport.test.ts src/youtubeQuotaTrace.test.ts src/startupQuotaProbe.test.ts src/updaterRuntime.test.ts src/v400PerformanceAndGlobalLimit.test.ts src/v400BlackScreenGuard.test.ts src/v332WindowsOauthLauncher.test.ts src/v2115Rc7OauthUpdateContinuity.test.ts
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_V500_REGRESSION_FAILED'}
          npm run build
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_FRONTEND_BUILD_FAILED'}
          cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_RUST_CHECK_FAILED'}
      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip()
          def dec(x):
            try:return base64.b64decode(x,validate=True).decode()
            except:return None
          if raw.startswith('untrusted comment:'): out=base64.b64encode(raw.encode()).decode()
          else:
            one=dec(raw)
            if one and one.startswith('untrusted comment:'): out=raw
            else:
              box=dec(one) if one else None
              assert box and box.startswith('untrusted comment:')
              out=one.strip()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fp: fp.write('TAURI_SIGNING_PRIVATE_KEY='+out+'\n')
          print('::add-mask::'+out)
          PY
      - name: Build Windows 5.0.0 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_BUILD_FAILED'}
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS_MISSING'}
          $sig=Get-Item ($installer.FullName + '.sig') -ErrorAction Stop
          New-Item -ItemType Directory -Force -Path candidate-windows | Out-Null
          Copy-Item $installer.FullName candidate-windows/VYRON_5.0.0_x64-setup.exe
          Copy-Item $sig.FullName candidate-windows/VYRON_5.0.0_x64-setup.exe.sig
          (Get-FileHash candidate-windows/VYRON_5.0.0_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content candidate-windows/VYRON_5.0.0_x64-setup.exe.sha256
      - name: Verify Windows updater signature
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $verifyRoot=Join-Path $env:RUNNER_TEMP 'vyron-signature-verify'
          New-Item -ItemType Directory -Force -Path (Join-Path $verifyRoot 'src') | Out-Null
          @'
          [package]
          name = "vyron-signature-verify"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          base64 = "0.22"
          minisign-verify = "=0.2.5"
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'Cargo.toml')
          @'
          use base64::{engine::general_purpose::STANDARD, Engine as _};
          use minisign_verify::{PublicKey, Signature};
          use std::{env,fs};
          fn decode(encoded:&str)->String{String::from_utf8(STANDARD.decode(encoded.trim()).unwrap()).unwrap()}
          fn main(){
            let a:Vec<String>=env::args().collect(); assert_eq!(a.len(),4);
            let artifact=fs::read(&a[1]).unwrap();
            let sig=decode(&fs::read_to_string(&a[2]).unwrap());
            let conf=fs::read_to_string(&a[3]).unwrap();
            let marker="\"pubkey\": \""; let start=conf.find(marker).unwrap()+marker.len();
            let tail=&conf[start..]; let end=tail.find('\"').unwrap();
            let pk=PublicKey::decode(&decode(&tail[..end])).unwrap();
            let sg=Signature::decode(&sig).unwrap();
            pk.verify(&artifact,&sg,true).unwrap();
            println!("WINDOWS_UPDATER_SIGNATURE=PASS");
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'src/main.rs')
          cargo run --quiet --release --manifest-path (Join-Path $verifyRoot 'Cargo.toml') -- candidate-windows/VYRON_5.0.0_x64-setup.exe candidate-windows/VYRON_5.0.0_x64-setup.exe.sig src-tauri/tauri.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_SIGNATURE_VERIFY_FAILED'}
      - name: Physical Windows 4.0.0 to 5.0.0 continuity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $os=Get-CimInstance Win32_OperatingSystem
          Write-Host "WINDOWS_CAPTION=$($os.Caption)"
          Write-Host "WINDOWS_VERSION=$($os.Version)"
          $appData=Join-Path $env:APPDATA 'studio.channelflow.desktop'
          $docState=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'VYRON\State'
          New-Item -ItemType Directory -Force -Path $appData,$docState | Out-Null
          $state=@{
            version=10
            channels=@(
              @{id='fixture-a';name='Fixture A';slug='fixture-a';enabled=$true;youtubeProfileId='PROFILE_A';youtubeChannelId='TEST_CH_A';renderFolderPath='D:\Render\Fixture A';projectsFolderPath='D:\Projects\Fixture A';safeDailyUploadLimit=10;cadenceDays=1;scheduleMode='interval';publishIntervalDays=1;publishHour=18;publishMinute=0;targetBufferDays=30;language='EN';genre='Music';country='US';minTracks=10;targetDurationMin=120;seo=@{titlePatterns=@();descriptionTemplate='';tags=@();banned=@()}},
              @{id='fixture-a-copy';name='Fixture A copy';slug='fixture-a-copy';enabled=$true;youtubeProfileId='PROFILE_A';youtubeChannelId='TEST_CH_A';renderFolderPath='D:\Render\Fixture A';projectsFolderPath='D:\Projects\Fixture A';cadenceDays=1;publishHour=18;publishMinute=0;targetBufferDays=30;language='EN';genre='Music';country='US';minTracks=10;targetDurationMin=120;seo=@{titlePatterns=@();descriptionTemplate='';tags=@();banned=@()}}
            )
            jobs=@(@{id='fixture-job';channelId='fixture-a-copy';number=1;folder='D:\fixture';status='READY_UPLOAD';createdAt='2026-09-28T00:00:00Z';tracksCount=10;minTracks=10;finalPath='D:\Render\Fixture A\001.mov';title='Fixture';description='';tags=@();storageLifecycle='NEW'})
            competitors=@()
            settings=@{workspace='D:\VYRON';renderRootPath='D:\Render';endlumePath='';youtubeApiKey='';openaiApiKey='';autoCheckUpdates=$false;reduceMotion=$false;fpsMonitor=$false;localProfileName='Кирилл';localProfileRole='Owner / YouTube Manager';localProfileCompany='VYRON / ScaleUP';localProfileAvatarPath='D:\VYRON\avatar.webp';estimatedRpmUsd=2.5}
            logs=@()
            uploadHistory=@(@{id='fixture-history';jobId='fixture-job';channelId='fixture-a-copy';youtubeVideoId='fixture-video';localFilePath='D:\old.mov';originalFilename='old.mov';uploadedAt='2026-09-27T00:00:00Z';fileSize=123;sha256=('a'*64);status='UPLOADED'})
            activityJournal=@(@{eventId='fixture-event';timestamp='2026-09-27T00:00:00Z';eventType='UPLOAD_ACCEPTED';status='SUCCESS';source='LIVE_OPERATION';channelId='fixture-a-copy'})
            statisticsHistory=@{}
            fingerprintCache=@{'fixture-fp'=@{path='D:\old.mov';size=123;mtimeMs=1;sha256=('a'*64);computedAt='2026-09-27T00:00:00Z'}}
            projectLifecycle=@{'fixture-project'=@{projectId='fixture-project';projectPath='D:\project';status='RENDERED';renderExists=$true;updatedAt='2026-09-27T00:00:00Z'}}
          } | ConvertTo-Json -Depth 20
          Set-Content -Path (Join-Path $appData 'state.json') -Value $state -Encoding UTF8
          Set-Content -Path (Join-Path $docState 'app-state.json') -Value $state -Encoding UTF8
          $old="$env:RUNNER_TEMP\VYRON_4.0.0_x64-setup.exe"
          Invoke-WebRequest 'https://github.com/ScaleUPPeisov/vyron-releases/releases/download/v4.0.0/VYRON_4.0.0_x64-setup.exe' -OutFile $old
          $p=Start-Process -FilePath $old -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "BASELINE_INSTALL_EXIT=$($p.ExitCode)"}
          $candidate=(Resolve-Path 'candidate-windows/VYRON_5.0.0_x64-setup.exe').Path
          $p=Start-Process -FilePath $candidate -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "CANDIDATE_INSTALL_EXIT=$($p.ExitCode)"}
          $roots=@((Join-Path $env:LOCALAPPDATA 'Programs'),$env:LOCALAPPDATA,$env:ProgramFiles,[Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) | Where-Object {$_ -and (Test-Path $_)}
          $exe=$null
          foreach($root in $roots){
            $exe=Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.Name -in @('channelflow.exe','VYRON.exe') -and ($_.VersionInfo.ProductVersion -as [string]).StartsWith('5.0.0')} | Select-Object -First 1
            if($exe){break}
          }
          if(-not $exe){throw 'VYRON_5_0_0_EXE_NOT_FOUND'}
          $proc=Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if($proc.HasExited){throw "VYRON_5_0_0_LAUNCH_EXITED=$($proc.ExitCode)"}
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          $saved=Get-Content (Join-Path $appData 'state.json') -Raw | ConvertFrom-Json
          if($saved.channels.Count -ne 1){throw 'CHANNEL_DEDUPE_FAILED'}
          $c=$saved.channels[0]
          if($c.youtubeProfileId -ne 'PROFILE_A' -or $c.youtubeChannelId -ne 'TEST_CH_A'){throw 'OAUTH_BINDING_CHANGED'}
          if($c.renderFolderPath -ne 'D:\Render\Fixture A'){throw 'RENDER_PATH_CHANGED'}
          if($c.projectsFolderPath -ne 'D:\Projects\Fixture A'){throw 'PROJECTS_PATH_CHANGED'}
          if($saved.jobs[0].channelId -ne $c.id){throw 'JOB_CHANNEL_REMAP_FAILED'}
          if($saved.uploadHistory[0].channelId -ne $c.id){throw 'HISTORY_CHANNEL_REMAP_FAILED'}
          if($saved.activityJournal[0].channelId -ne $c.id){throw 'ACTIVITY_CHANNEL_REMAP_FAILED'}
          if($saved.settings.localProfileName -ne 'Кирилл'){throw 'OWNER_PROFILE_CHANGED'}
          if($saved.settings.localProfileAvatarPath -ne 'D:\VYRON\avatar.webp'){throw 'OWNER_AVATAR_CHANGED'}
          if($saved.fingerprintCache.'fixture-fp'.size -ne 123){throw 'FINGERPRINT_CHANGED'}
          if($saved.projectLifecycle.'fixture-project'.status -ne 'RENDERED'){throw 'PROJECT_LIFECYCLE_CHANGED'}
          Write-Host 'WINDOWS_4_0_0_TO_5_0_0_CONTINUITY=PASS'
      - name: Verify feeds unchanged after Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json' -OutFile "$env:RUNNER_TEMP\mac-after.json"
          Invoke-WebRequest 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json' -OutFile "$env:RUNNER_TEMP\win-after.json"
          if((Get-FileHash "$env:RUNNER_TEMP\mac-before.json").Hash -ne (Get-FileHash "$env:RUNNER_TEMP\mac-after.json").Hash){throw 'MAC_FEED_MUTATED'}
          if((Get-FileHash "$env:RUNNER_TEMP\win-before.json").Hash -ne (Get-FileHash "$env:RUNNER_TEMP\win-after.json").Hash){throw 'WINDOWS_FEED_MUTATED'}
          @(
            "HEAD=$(git rev-parse HEAD)",
            'VERSION=5.0.0',
            'WINDOWS_X64_BUILD=PASS',
            'WINDOWS_UPDATER_SIGNATURE=PASS',
            'WINDOWS_4_0_0_TO_5_0_0_CONTINUITY=PASS',
            'PRODUCTION_FEED_MUTATED=NO',
            'RELEASE_PUBLISHED=NO'
          ) | Set-Content candidate-windows/gate-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-5.0.0-WINDOWS-SIGNED-CANDIDATE
          path: candidate-windows/**
          if-no-files-found: error
          retention-days: 14

  final-freeze:
    name: Final candidate freeze proof
    needs: [macos-candidate, windows-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production remains unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/mac.json'))['version']=='4.0.1'
          assert json.load(open('/tmp/win.json'))['version']=='4.0.0'
          print('VYRON_5_0_0_SIGNED_CANDIDATES_READY=YES')
          print('PRODUCTION_FEEDS_UNCHANGED=mac:4.0.1 windows:4.0.0')
          print('VYRON_5_0_0_RELEASE_PUBLISHED=NO')
          print('RELEASE_REQUIRES_EXPLICIT_OWNER_CONFIRMATION=YES')
          PY
