name: VYRON 5.0.1 macOS Candidate

on:
  push:
    branches:
      - hotfix/vyron-5.0.1-live-upload-counter
    paths:
      - '.github/workflows/vyron-501-macos-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-501-macos-candidate
  cancel-in-progress: true

env:
  VERSION: '5.0.1'
  MAC_BASELINE: '5.0.0'
  WINDOWS_STABLE: '4.0.0'
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  preflight:
    name: VYRON 5.0.1 macOS candidate preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Install Tauri Linux test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Freeze stable feeds
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-before.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-before.json
          python3 - <<'PY'
          import json
          mac=json.load(open('/tmp/mac-before.json')); win=json.load(open('/tmp/win-before.json'))
          assert mac['version']=='5.0.0',mac['version']
          assert win['version']=='4.0.0',win['version']
          print('PRODUCTION_FREEZE=PASS mac:5.0.0 windows:4.0.0')
          PY
      - name: Zero-background and owner regression
        run: >
          npx vitest run
          src/v501OwnerHotfix.test.ts
          src/v501LocalCleanupZeroQuota.test.ts
          src/youtubePublishSafety.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/youtubeQuota.test.ts
          src/youtubeQuotaAtomic.test.ts
          src/startupQuotaProbe.test.ts
          src/dailyOperations.test.ts
          src/productionPipeline.test.ts
          src/updaterRuntime.test.ts
      - name: Production frontend build
        run: npm run build
      - name: Native local-only filesystem and cleanup tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests::vyron_filesystem_preview_is_non_destructive_and_maps_projects_render -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests::vyron_filesystem_apply_moves_only_confirmed_legacy_and_preserves_file_count -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests::vyron_filesystem_apply_blocks_conflict_without_overwrite -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests::missing_mp4_is_a_clean_success -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml local_delete::tests::directory_is_never_recursively_deleted -- --exact --nocapture
      - name: Version identity
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json'),t=require('./src-tauri/tauri.conf.json');
          for(const v of [p.version,l.version,l.packages[''].version,t.version]) if(v!=='5.0.1') process.exit(1);
          if(t.identifier!=='studio.channelflow.desktop'||t.bundle.createUpdaterArtifacts!==true) process.exit(1);
          console.log('VYRON_5_0_1_IDENTITY=PASS');
          NODE
          grep -F 'version = "5.0.1"' src-tauri/Cargo.toml
          grep -A1 -F 'name = "channelflow"' src-tauri/Cargo.lock | grep -F 'version = "5.0.1"'

  macos-candidate:
    name: VYRON 5.0.1 signed macOS ARM64 + 10m idle audit
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 120
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Freeze production feeds before candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-before.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-before.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/mac-before.json'))['version']=='5.0.0'
          assert json.load(open('/tmp/win-before.json'))['version']=='4.0.0'
          PY
      - name: macOS regression and native compile
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run src/v501OwnerHotfix.test.ts src/v501LocalCleanupZeroQuota.test.ts src/youtubePublishSafety.test.ts src/startupQuotaProbe.test.ts src/dailyOperations.test.ts src/productionPipeline.test.ts src/updaterRuntime.test.ts
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
      - name: Import VYRON signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-501-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-501-signing.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Normalize updater signing key to private key file
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os,pathlib
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(4):
              current=candidates[-1].strip()
              try:
                  decoded=base64.b64decode(current,validate=True).decode('utf-8').strip()
              except Exception:
                  break
              if decoded in candidates:
                  break
              candidates.append(decoded)
          key=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert key, 'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'vyron-updater-private.key'
          path.write_text(key.rstrip()+'\n',encoding='utf-8')
          path.chmod(0o600)
          assert path.read_text(encoding='utf-8').startswith('untrusted comment:')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fp:
              fp.write('TAURI_SIGNING_PRIVATE_KEY_PATH='+str(path)+'\n')
          print('TAURI_UPDATER_KEY_FILE=READY')
          PY
      - name: Build and verify signed macOS 5.0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p candidate-macos
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee candidate-macos/codesign-details.txt
          ! grep -F 'Signature=adhoc' candidate-macos/codesign-details.txt
          hdiutil verify "$DMG"
          cp "$DMG" candidate-macos/VYRON-5.0.1-arm64.dmg
          cp "$UPDATER" candidate-macos/VYRON.app.tar.gz
          cp "$SIG" candidate-macos/VYRON.app.tar.gz.sig
          shasum -a 256 candidate-macos/VYRON-5.0.1-arm64.dmg > candidate-macos/VYRON-5.0.1-arm64.dmg.sha256
          shasum -a 256 candidate-macos/VYRON.app.tar.gz > candidate-macos/VYRON.app.tar.gz.sha256
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: Verify updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def env(raw):
            x=raw.strip()
            try:
              y=base64.b64decode(x,validate=True)
              if y.startswith(b'untrusted comment:'): return y
            except Exception: pass
            return x+b'\\n'
          Path('/tmp/vyron.pub').write_bytes(env(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/vyron.sig').write_bytes(env(Path('candidate-macos/VYRON.app.tar.gz.sig').read_bytes()))
          PY
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm candidate-macos/VYRON.app.tar.gz -x /tmp/vyron.sig -p /tmp/vyron.pub
      - name: Physical 5.0.0 to 5.0.1 continuity on 32-channel fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          HOME_FIXTURE="$RUNNER_TEMP/vyron-501-home"
          APP_DATA="$HOME_FIXTURE/Library/Application Support/studio.channelflow.desktop"
          DOC_STATE="$HOME_FIXTURE/Documents/VYRON/State"
          VYRON_ROOT="$RUNNER_TEMP/ВАЙРОН"
          mkdir -p "$APP_DATA" "$DOC_STATE" "$VYRON_ROOT"
          python3 scripts/v501_candidate_fixture.py seed "$APP_DATA/state.json" "$VYRON_ROOT"
          cp "$APP_DATA/state.json" "$DOC_STATE/app-state.json"
          cp "$APP_DATA/state.json" candidate-macos/state-before.json

          OLD_DMG="$RUNNER_TEMP/VYRON-5.0.0-arm64.dmg"
          curl -fL --retry 3 'https://github.com/ScaleUPPeisov/vyron-releases/releases/download/v5.0.0/VYRON-5.0.0-arm64.dmg' -o "$OLD_DMG"
          OLD_M="$RUNNER_TEMP/vyron-500-mount"; mkdir -p "$OLD_M"
          hdiutil attach "$OLD_DMG" -nobrowse -readonly -mountpoint "$OLD_M"
          OLD_APP="$OLD_M/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$OLD_APP/Contents/Info.plist")" = "$MAC_BASELINE"
          env -i HOME="$HOME_FIXTURE" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" "$OLD_APP/Contents/MacOS/$EXECUTABLE" >candidate-macos/baseline-500.log 2>&1 &
          P=$!; sleep 8; kill -0 "$P"; kill "$P" || true; wait "$P" || true
          hdiutil detach "$OLD_M"

          python3 scripts/v501_candidate_fixture.py verify "$APP_DATA/state.json" "$VYRON_ROOT"
          API_AUDIT="$RUNNER_TEMP/vyron-api-audit.tsv"
          rm -f "$API_AUDIT"
          env -i HOME="$HOME_FIXTURE" USER="$USER" PATH='/usr/bin:/bin:/usr/sbin:/sbin' TMPDIR="$RUNNER_TEMP/" VYRON_API_AUDIT_PATH="$API_AUDIT" "$APP_PATH/Contents/MacOS/$EXECUTABLE" >candidate-macos/candidate-501-idle.log 2>&1 &
          P=$!
          sleep 10
          kill -0 "$P"
          sleep 590
          kill -0 "$P"
          if [ -s "$API_AUDIT" ]; then
            echo 'YOUTUBE_DATA_API_IDLE_AUDIT=FAIL'
            cat "$API_AUDIT"
            exit 51
          fi
          echo 'YOUTUBE_DATA_API_IDLE_AUDIT=PASS requests=0 duration=600s'
          kill "$P" || true
          wait "$P" || true
          python3 scripts/v501_candidate_fixture.py verify "$APP_DATA/state.json" "$VYRON_ROOT"
          cp "$APP_DATA/state.json" candidate-macos/state-after.json
          if [ -e "$API_AUDIT" ]; then cp "$API_AUDIT" candidate-macos/youtube-api-audit.tsv; else : > candidate-macos/youtube-api-audit.tsv; fi
      - name: Static owner-action request budget proof
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run src/v501OwnerHotfix.test.ts
          grep -F 'if ids.len()>=50{break}' src-tauri/src/youtube.rs
          grep -F 'emit_youtube_api_request(&app,"channels.list",operation_id.as_deref());' src-tauri/src/youtube.rs
          echo 'MANUAL_STATS_32_CHANNEL_PLAN=1 channels.list request when one API project is used'
          echo 'CANCEL_PREVIEW_YOUTUBE_API_REQUESTS=0'
          echo 'LOCAL_CLEANUP_YOUTUBE_API_REQUESTS=0'
      - name: Verify feeds unchanged and write candidate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-after.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-after.json
          cmp -s /tmp/mac-before.json /tmp/mac-after.json
          cmp -s /tmp/win-before.json /tmp/win-after.json
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo 'VERSION=5.0.1'
            echo 'PLATFORM=macOS ARM64 ONLY'
            echo 'SIGNED_BUILD=PASS'
            echo 'UPDATER_SIGNATURE=PASS'
            echo 'STATE_CONTINUITY_5_0_0_TO_5_0_1=PASS'
            echo 'FIXTURE_CHANNELS=32'
            echo 'IDLE_DURATION_SECONDS=600'
            echo 'YOUTUBE_DATA_API_IDLE_REQUESTS=0'
            echo 'WINDOWS_BUILD_RUN=NO'
            echo 'WINDOWS_FEED_VERSION=4.0.0'
            echo 'MAC_PRODUCTION_FEED_VERSION=5.0.0'
            echo 'PRODUCTION_FEED_MUTATED=NO'
            echo 'RELEASE_PUBLISHED=NO'
            echo 'VYRON_5_0_1_MAC_CANDIDATE_READY=YES'
          } | tee candidate-macos/gate-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-5.0.1-MACOS-SIGNED-CANDIDATE
          path: candidate-macos/**
          if-no-files-found: error
          retention-days: 14
