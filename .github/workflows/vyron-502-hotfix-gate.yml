name: VYRON 5.0.2 Hotfix Gate

on:
  push:
    branches:
      - hotfix/vyron-5.0.2-full-refresh
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vyron-502-hotfix-gate.yml'

permissions:
  contents: read

concurrency:
  group: vyron-502-hotfix-gate
  cancel-in-progress: true

jobs:
  test:
    name: Test VYRON 5.0.2 refresh hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Targeted refresh and inventory regression
        run: |
          npx vitest run             src/v502FullRefresh.test.ts             src/contentRunway.test.ts             src/v334LiveContentInventory.test.ts             src/v501LocalCleanupZeroQuota.test.ts \
            src/v2115Rc7OauthUpdateContinuity.test.ts \
            src/youtubeApplyVerification.test.ts \
            src/publisherSchedule.test.ts \
            src/v2115ScheduleSyncHotfix.test.ts \
            src/youtubeChannelStats.test.ts
      - name: TypeScript and production frontend build
        run: npm run build

      - name: Legacy full-suite audit
        continue-on-error: true
        run: npx vitest run

      - name: Install Tauri Linux system dependencies
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust compile gate
        if: always()
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Critical migration and storage regressions
        if: always()
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml migration::tests::channel_merge_is_idempotent_and_never_deletes -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml migration::tests::encryption_rejects_tamper_and_wrong_password -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --lib storage::v213_storage_tests
