name: VYRON 5.0.3 macOS Fast Promote

on:
  push:
    branches:
      - hotfix/vyron-5.0.3-upload-counter
    paths:
      - '.github/workflows/vyron-503-macos-fast-promote.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-503-macos-fast-promote
  cancel-in-progress: false

env:
  VERSION: '5.0.3'
  TAG: v5.0.3
  RELEASE_REPO: ScaleUPPeisov/vyron-releases
  CANDIDATE_RUN_ID: '36651673865'
  PRODUCT_SOURCE_SHA: '7a5faacae0d082c1d435f4ba74fb2a2eef42b81a'

jobs:
  promote:
    name: Promote verified macOS 5.0.3 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7a5faacae0d082c1d435f4ba74fb2a2eef42b81a

      - name: Verify production baseline and candidate provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/mac-before.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/win-before.json
          python3 - <<'PY'
          import json
          mac=json.load(open('/tmp/mac-before.json')); win=json.load(open('/tmp/win-before.json'))
          assert mac['version']=='5.0.2',mac['version']
          assert win['version']=='5.0.1',win['version']
          print('MAC_BASELINE=5.0.2')
          print('WINDOWS_LOCKED=5.0.1')
          PY
          sha256sum /tmp/win-before.json | awk '{print $1}' >/tmp/win-before.sha
          RUN_JSON="$(gh api "repos/ScaleUPPeisov/scaleup-dashboards/actions/runs/$CANDIDATE_RUN_ID")"
          test "$(printf '%s' "$RUN_JSON" | jq -r .conclusion)" = "success"
          JOBS_JSON="$(gh api "repos/ScaleUPPeisov/scaleup-dashboards/actions/runs/$CANDIDATE_RUN_ID/jobs")"
          for step in             'Verify exact source and green regression'             'Refresh upload counter regression on macOS'             'Build and verify signed macOS 5.0.3'             'Verify updater signature'             'Physical macOS 5.0.2 to 5.0.3 continuity and idle API audit'             'Verify feeds unchanged and write candidate gate'; do
            test "$(printf '%s' "$JOBS_JSON" | jq -r --arg s "$step" '.jobs[] | select(.name=="VYRON 5.0.3 signed macOS ARM64 candidate") | .steps[] | select(.name==$s) | .conclusion')" = "success"
          done
          if GH_TOKEN="$RELEASE_TOKEN" gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo 'BLOCKER=V5_0_3_RELEASE_ALREADY_EXISTS'
            exit 1
          fi
          echo 'MACOS_5_0_3_CANDIDATE_PROVENANCE=PASS'

      - name: Download exact verified macOS candidate
        uses: actions/download-artifact@v4
        with:
          name: VYRON-5.0.3-MACOS-SIGNED-CANDIDATE
          path: candidate-macos
          repository: ScaleUPPeisov/scaleup-dashboards
          run-id: 36651673865
          github-token: ${{ github.token }}

      - name: Verify candidate bytes and gate summary
        shell: bash
        run: |
          set -Eeuo pipefail
          DMG="$(find candidate-macos -type f -name 'VYRON-5.0.3-arm64.dmg' -print -quit)"
          DMG_SHA="$(find candidate-macos -type f -name 'VYRON-5.0.3-arm64.dmg.sha256' -print -quit)"
          UPDATER="$(find candidate-macos -type f -name 'VYRON.app.tar.gz' -print -quit)"
          UPDATER_SHA="$(find candidate-macos -type f -name 'VYRON.app.tar.gz.sha256' -print -quit)"
          SIG="$(find candidate-macos -type f -name 'VYRON.app.tar.gz.sig' -print -quit)"
          GATE="$(find candidate-macos -type f -name 'gate-summary.txt' -print -quit)"
          test -s "$DMG"; test -s "$DMG_SHA"; test -s "$UPDATER"; test -s "$UPDATER_SHA"; test -s "$SIG"; test -s "$GATE"
          test "$(sha256sum "$DMG" | awk '{print $1}')" = "$(awk '{print tolower($1)}' "$DMG_SHA" | tr -d '\r')"
          test "$(sha256sum "$UPDATER" | awk '{print $1}')" = "$(awk '{print tolower($1)}' "$UPDATER_SHA" | tr -d '\r')"
          grep -F "HEAD=$PRODUCT_SOURCE_SHA" "$GATE"
          grep -F 'VERSION=5.0.3' "$GATE"
          grep -F 'UPLOAD_COUNTER_RESTORE=PASS' "$GATE"
          grep -F 'MACOS_SIGNED_BUILD=PASS' "$GATE"
          grep -F 'MACOS_UPDATER_SIGNATURE=PASS' "$GATE"
          grep -F 'MACOS_5_0_2_TO_5_0_3_CONTINUITY=PASS' "$GATE"
          grep -F 'YOUTUBE_DATA_API_IDLE_REQUESTS=0' "$GATE"
          grep -F 'VYRON_5_0_3_MAC_CANDIDATE_READY=YES' "$GATE"
          mkdir -p release/mac
          cp "$DMG" release/mac/VYRON-5.0.3-arm64.dmg
          cp "$DMG_SHA" release/mac/VYRON-5.0.3-arm64.dmg.sha256
          cp "$UPDATER" release/mac/VYRON.app.tar.gz
          cp "$UPDATER_SHA" release/mac/VYRON.app.tar.gz.sha256
          cp "$SIG" release/mac/VYRON.app.tar.gz.sig
          echo 'MACOS_5_0_3_CANDIDATE_BYTES=PASS'

      - name: Reverify updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def env(raw):
            x=raw.strip()
            try:
              y=base64.b64decode(x,validate=True)
              if y.startswith(b'untrusted comment:'): return y
            except Exception: pass
            return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(env(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/vyron-mac.sig').write_bytes(env(Path('release/mac/VYRON.app.tar.gz.sig').read_bytes()))
          PY
          minisign -Vm release/mac/VYRON.app.tar.gz -x /tmp/vyron-mac.sig -p /tmp/vyron.pub
          echo 'MACOS_5_0_3_UPDATER_SIGNATURE_REVERIFY=PASS'

      - name: Publish macOS 5.0.3 release
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 5.0.3 — Upload Counter Restore Hotfix

          - Restores today's successful VYRON upload count from persisted uploadHistory after an app update or restart.
          - Example: 10 successful VYRON uploads correctly returns 10 / 100 and 90 remaining instead of 0 / 100.
          - The next successful upload updates immediately to 11 / 100; failed uploads do not increment the counter.
          - Topbar and YouTube API Quota card use the same reactive global upload status.
          - Recovery is local-only and performs 0 additional YouTube Data API requests.
          - OAuth profiles, Google credentials, Client ID/Secret, Keychain/Credential Manager, migration, Render/Projects, schedule, ENDLUME and updater logic were not rewritten by this hotfix.
          - macOS physical 5.0.2 → 5.0.3 continuity passed.
          - Product source: 7a5faacae0d082c1d435f4ba74fb2a2eef42b81a.
          EOF
          GH_TOKEN="$RELEASE_TOKEN" gh release create "$TAG" --repo "$RELEASE_REPO" --title "VYRON 5.0.3 — Upload Counter Restore Hotfix" --notes-file /tmp/release-notes.md             release/mac/VYRON-5.0.3-arm64.dmg             release/mac/VYRON-5.0.3-arm64.dmg.sha256             release/mac/VYRON.app.tar.gz             release/mac/VYRON.app.tar.gz.sha256             release/mac/VYRON.app.tar.gz.sig
          echo 'MACOS_5_0_3_RELEASE_ASSETS=PUBLISHED'

      - name: Promote macOS updater feed only
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:$RELEASE_TOKEN@github.com/$RELEASE_REPO.git" release-repo
          test "$(sha256sum release-repo/updates/windows-latest.json | awk '{print $1}')" = "$(cat /tmp/win-before.sha)"
          MAC_SIG="$(tr -d '\r\n' < release/mac/VYRON.app.tar.gz.sig)"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$MAC_SIG" "$PUB_DATE" <<'PY'
          import json,sys
          from pathlib import Path
          sig,pub=sys.argv[1:3]
          repo='ScaleUPPeisov/vyron-releases'
          notes='VYRON 5.0.3 — Upload Counter Restore Hotfix: restores today\'s successful VYRON uploads from persisted history after update/restart; local-only, zero extra YouTube API requests.'
          data={'version':'5.0.3','notes':notes,'pub_date':pub,'platforms':{'darwin-aarch64':{
            'url':f'https://github.com/{repo}/releases/download/v5.0.3/VYRON.app.tar.gz','signature':sig
          }}}
          Path('release-repo/updates/latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cd release-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json
          test -z "$(git status --porcelain -- updates/windows-latest.json)"
          git commit -m 'release: promote VYRON 5.0.3 macOS updater'
          git push origin main
          echo 'MACOS_FEED_PROMOTED=5.0.3'

      - name: Final macOS production verification
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/releases/tags/$TAG" >/tmp/release.json
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/latest-after.json
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/contents/updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/win-after.json
          python3 - <<'PY'
          import json
          rel=json.load(open('/tmp/release.json')); latest=json.load(open('/tmp/latest-after.json')); win=json.load(open('/tmp/win-after.json'))
          assets={x['name']:x for x in rel['assets']}
          required={'VYRON-5.0.3-arm64.dmg','VYRON-5.0.3-arm64.dmg.sha256','VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig'}
          assert required <= set(assets),required-set(assets)
          assert not rel['draft'] and not rel['prerelease']
          assert latest['version']=='5.0.3'
          assert set(latest['platforms'])=={'darwin-aarch64'}
          assert win['version']=='5.0.1'
          print('MACOS_PRODUCTION=5.0.3')
          print('WINDOWS_STILL_LOCKED=5.0.1')
          PY
          test "$(sha256sum /tmp/win-after.json | awk '{print $1}')" = "$(cat /tmp/win-before.sha)"
          rm -rf /tmp/v503-mac-remote && mkdir /tmp/v503-mac-remote
          GH_TOKEN="$RELEASE_TOKEN" gh release download "$TAG" --repo "$RELEASE_REPO" --dir /tmp/v503-mac-remote             --pattern 'VYRON-5.0.3-arm64.dmg' --pattern 'VYRON.app.tar.gz' --pattern 'VYRON.app.tar.gz.sig'
          cmp -s release/mac/VYRON-5.0.3-arm64.dmg /tmp/v503-mac-remote/VYRON-5.0.3-arm64.dmg
          cmp -s release/mac/VYRON.app.tar.gz /tmp/v503-mac-remote/VYRON.app.tar.gz
          cmp -s release/mac/VYRON.app.tar.gz.sig /tmp/v503-mac-remote/VYRON.app.tar.gz.sig
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON-5.0.3-arm64.dmg" -o /tmp/mac-byte >/dev/null 2>&1
          echo 'REMOTE_MACOS_5_0_3_BYTE_IDENTITY=PASS'
          echo 'VYRON_5_0_3_MACOS_PRODUCTION=PASS'
