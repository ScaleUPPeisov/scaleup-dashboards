name: VYRON 6.0.0 macOS Production Manual Hotfix Gate

on:
  push:
    branches:
      - hotfix/vyron-6.0.0-macos-production-manual
    paths:
      - 'src/ProductionManager.tsx'
      - 'src/productionManagerApi.ts'
      - 'src/production-manager.css'
      - 'src-tauri/src/production_manager.rs'
      - 'src-tauri/src/production_manager_tests.rs'
      - 'src-tauri/src/recovery.rs'
      - 'src/v600ProductionManualHotfix.test.ts'
      - '.github/workflows/vyron-600-macos-production-manual-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-600-macos-production-manual-hotfix
  cancel-in-progress: true

env:
  VERSION: '6.0.0'
  SOURCE_BASE: '614b5501689526f67a20062b0037e27de176a0ac'
  BUNDLE_ID: studio.channelflow.desktop
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  macos-hotfix-gate:
    name: Verify and build macOS ARM64 hotfix
    runs-on: macos-14
    timeout-minutes: 120
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock exact source and protected paths
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$SOURCE_BASE" HEAD
          git diff --name-only "$SOURCE_BASE"...HEAD | tee /tmp/production-manual-hotfix-files.txt
          if grep -E '(^|/)(oauth_vault|migration|youtube\.rs|security\.rs)$|credentials|keychain|updater_bridge|tauri\.windows|windows-latest|src-tauri/icons/' /tmp/production-manual-hotfix-files.txt; then
            echo 'PROTECTED_OR_WINDOWS_PATH_CHANGED'
            exit 41
          fi
          node - <<'NODE'
          const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');
          if(p.version!=='6.0.0'||t.version!=='6.0.0') throw new Error('VERSION_CHANGED');
          if(t.identifier!=='studio.channelflow.desktop') throw new Error('BUNDLE_ID_CHANGED');
          NODE
          echo "RUNNER_ARCH=$(uname -m)"
          echo "SOURCE_BASE=$SOURCE_BASE"
          echo "HOTFIX_HEAD=$(git rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - name: Frontend production build
        run: npm run build

      - name: Production manual hotfix contracts
        run: >
          npx vitest run
          src/v600ProductionManualHotfix.test.ts
          src/v600MaterialsMacHotfix.test.ts
          src/v510MaterialsManager.test.ts
          src/v512ManualAssembly.test.ts
          src/v503UploadCounterRestore.test.ts

      - name: Native production regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml materials_manager --lib --no-fail-fast
          cargo test --manifest-path src-tauri/Cargo.toml production_manager_tests --lib --no-fail-fast
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Import macOS signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-production-manual-hotfix.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-production-manual-hotfix.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Canonicalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              current=candidates[-1].strip()
              try: decoded=base64.b64decode(current,validate=True).decode('utf-8').strip()
              except Exception: break
              if decoded in candidates: break
              candidates.append(decoded)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode('utf-8')).decode('ascii')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fp: fp.write('TAURI_SIGNING_PRIVATE_KEY_CANONICAL='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY

      - name: Build signed macOS ARM64 hotfix candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          export TAURI_SIGNING_PRIVATE_KEY="$TAURI_SIGNING_PRIVATE_KEY_CANONICAL"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p candidate-macos
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -d "$APP"
          test -s "$DMG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          cp "$DMG" candidate-macos/VYRON-6.0.0-PRODUCTION-MANUAL-HOTFIX-arm64.dmg
          shasum -a 256 candidate-macos/VYRON-6.0.0-PRODUCTION-MANUAL-HOTFIX-arm64.dmg > candidate-macos/SHA256SUMS.txt
          {
            echo "SOURCE_BASE=$SOURCE_BASE"
            echo "HOTFIX_HEAD=$(git rev-parse HEAD)"
            echo "VERSION=$VERSION"
            echo "WINDOWS_RELEASE=PRESERVED"
            echo "OAUTH_KEYCHAIN_PATHS_MUTATED=NO"
            echo "PRODUCTION_FEEDS_MUTATED=NO"
          } > candidate-macos/gate-summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.0.0-MACOS-PRODUCTION-MANUAL-HOTFIX
          path: candidate-macos/**
          if-no-files-found: error
          retention-days: 7
