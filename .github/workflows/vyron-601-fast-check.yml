name: VYRON 6.0.1 Real Zero-Jank Fast Check

on:
  push:
    branches:
      - hotfix/vyron-6.0.1-real-zero-jank

permissions:
  contents: read

concurrency:
  group: vyron-601-fast-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and Vite build
        run: npm run build
      - name: Protected regressions
        run: npx vitest run src/v510MaterialsManager.test.ts src/v512ManualAssembly.test.ts src/v503UploadCounterRestore.test.ts src/youtubePublishSafety.test.ts src/v400QuotaUploadLimitSeparation.test.ts src/v501LocalCleanupZeroQuota.test.ts src/v2115Rc7OauthUpdateContinuity.test.ts src/v500Performance.test.ts src/v601RealZeroJank.test.ts
