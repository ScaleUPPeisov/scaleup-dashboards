name: VYRON 6.0.1 Real Zero-Jank macOS Candidate

on:
  push:
    branches:
      - hotfix/vyron-6.0.1-real-zero-jank
    paths:
      - '.github/workflows/vyron-601-real-zero-jank-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-601-real-zero-jank-candidate
  cancel-in-progress: true

env:
  VERSION: '6.0.1'
  PRODUCT_BASELINE_SHA: '8619a38ead53ed498fd0e7b2e96d816da2fb2111'
  PRODUCT_SOURCE_SHA: '93bccddebe95a8f39aa75b71d64fa5cbdc620cd7'
  BUNDLE_ID: studio.channelflow.desktop
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  validate-and-build:
    name: Validate and build signed M1 candidate
    runs-on: macos-14
    timeout-minutes: 120
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact V6 product source and 6.0.1 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
          git merge-base --is-ancestor "$PRODUCT_BASELINE_SHA" "$PRODUCT_SOURCE_SHA"
          node - <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json'),t=require('./src-tauri/tauri.conf.json');
          for(const v of [p.version,l.version,l.packages[''].version,t.version]) if(v!=='6.0.1') throw new Error('VERSION_MISMATCH '+v);
          if(t.identifier!=='studio.channelflow.desktop') throw new Error('BUNDLE_ID_CHANGED');
          NODE
          grep -F 'version = "6.0.1"' src-tauri/Cargo.toml
          grep -A1 -F 'name = "channelflow"' src-tauri/Cargo.lock | grep -F 'version = "6.0.1"'
          echo 'VYRON_601_IDENTITY=PASS'

      - name: Freeze OAuth security updater and branding
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only "$PRODUCT_BASELINE_SHA" "$PRODUCT_SOURCE_SHA" | tee /tmp/v601-files.txt
          if grep -E '(^|/)(oauth_vault|migration|youtube\.rs|security\.rs)$|credentials|keychain|updater_bridge|src-tauri/icons/|src/assets/' /tmp/v601-files.txt; then
            echo 'PROTECTED_SECURITY_OR_ASSET_PATH_CHANGED'
            exit 41
          fi
          git diff --quiet "$PRODUCT_BASELINE_SHA" "$PRODUCT_SOURCE_SHA" -- src-tauri/icons src/assets
          git show "$PRODUCT_BASELINE_SHA:src-tauri/tauri.conf.json" >/tmp/base-tauri.json
          python3 - <<'PY'
          import json
          base=json.load(open('/tmp/base-tauri.json'))
          cur=json.load(open('src-tauri/tauri.conf.json'))
          assert base['identifier']==cur['identifier']
          assert base.get('plugins',{}).get('updater')==cur.get('plugins',{}).get('updater')
          assert base.get('bundle',{}).get('icon')==cur.get('bundle',{}).get('icon')
          print('UPDATER_ENDPOINTS_AND_ASSETS=FROZEN')
          PY
          git diff --unified=0 "$PRODUCT_BASELINE_SHA" "$PRODUCT_SOURCE_SHA" -- src-tauri/src/storage.rs | grep '^+' | grep -E 'canonical_(set|get)_secret|oauth_vault|youtube_oauth|STATE_YOUTUBE_API_KEY|STATE_OPENAI_API_KEY' && {
            echo 'CREDENTIAL_STORAGE_LOGIC_CHANGED_IN_STORAGE_DIFF'; exit 42;
          } || true
          echo 'OAUTH_SECURITY_ASSET_FREEZE=PASS'

      - name: Snapshot production feeds before candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/latest-before.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/windows-before.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/latest-before.json')); b=json.load(open('/tmp/windows-before.json'))
          assert a['version']=='6.0.0',a['version']
          assert b['version']=='6.0.0',b['version']
          print('PRODUCTION_BASELINE=6.0.0')
          PY
          shasum -a 256 /tmp/latest-before.json | awk '{print $1}' >/tmp/latest-before.sha
          shasum -a 256 /tmp/windows-before.json | awk '{print $1}' >/tmp/windows-before.sha

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - name: TypeScript production build
        run: npm run build

      - name: Zero-jank and protected functional regressions
        run: >
          npx vitest run
          src/v601RealZeroJank.test.ts
          src/v510MaterialsManager.test.ts
          src/v512ManualAssembly.test.ts
          src/v503UploadCounterRestore.test.ts
          src/youtubePublishSafety.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/v501LocalCleanupZeroQuota.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
          src/v500Performance.test.ts

      - name: Native regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml materials_manager --lib --no-fail-fast
          cargo test --manifest-path src-tauri/Cargo.toml production_manager_tests --lib --no-fail-fast
          cargo test --manifest-path src-tauri/Cargo.toml v213_storage_tests --lib --no-fail-fast

      - name: Import signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-601-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-601-signing.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Canonicalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              current=candidates[-1].strip()
              try: decoded=base64.b64decode(current,validate=True).decode('utf-8').strip()
              except Exception: break
              if decoded in candidates: break
              candidates.append(decoded)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fp: fp.write('TAURI_SIGNING_PRIVATE_KEY_CANONICAL='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY

      - name: Build signed macOS Apple Silicon candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          export TAURI_SIGNING_PRIVATE_KEY="$TAURI_SIGNING_PRIVATE_KEY_CANONICAL"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p candidate-macos
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          cp "$DMG" candidate-macos/VYRON-6.0.1-REAL-ZERO-JANK-CANDIDATE-arm64.dmg
          cp "$UPDATER" candidate-macos/VYRON.app.tar.gz
          cp "$SIG" candidate-macos/VYRON.app.tar.gz.sig
          shasum -a 256 candidate-macos/* | tee candidate-macos/SHA256SUMS.txt

      - name: Verify production feeds still untouched and write candidate gate
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json -o /tmp/latest-after.json
          curl -fsSL https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json -o /tmp/windows-after.json
          test "$(shasum -a 256 /tmp/latest-after.json | awk '{print $1}')" = "$(cat /tmp/latest-before.sha)"
          test "$(shasum -a 256 /tmp/windows-after.json | awk '{print $1}')" = "$(cat /tmp/windows-before.sha)"
          {
            echo "BASELINE=$PRODUCT_BASELINE_SHA"
            echo "PRODUCT_SOURCE=$PRODUCT_SOURCE_SHA"
            echo "VERSION=$VERSION"
            echo "ZERO_JANK_REGRESSIONS=PASS"
            echo "PROTECTED_FUNCTIONS=PASS"
            echo "NATIVE_REGRESSIONS=PASS"
            echo "OAUTH_SECURITY_ASSET_FREEZE=PASS"
            echo "MACOS_SIGNED_BUILD=PASS"
            echo "PRODUCTION_FEEDS_MUTATED=NO"
            echo "VYRON_6_0_1_REAL_ZERO_JANK_MAC_CANDIDATE_READY=YES"
          } > candidate-macos/gate-summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.0.1-REAL-ZERO-JANK-MACOS-CANDIDATE
          path: candidate-macos/**
          if-no-files-found: error
          retention-days: 14
