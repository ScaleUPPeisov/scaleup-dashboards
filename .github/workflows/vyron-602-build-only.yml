name: VYRON 6.0.2 Windows Candidate Build Only

on:
  push:
    branches:
      - candidate/vyron-6.0.2-real-migration
    paths:
      - '.github/workflows/vyron-602-build-only.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VERSION: '6.0.2'
  MIGRATION_GATE_SHA: 0b861286dbfa462ddd7aecc7e1a696a9a2dadb57
  V600_SHA: 0f16fac6f4a50d083dad37a44684c8accbacf4ce

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove runtime migration source is identical to mandatory green gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            'src-tauri/src/migration.rs',
            'src-tauri/src/lib.rs',
            'src/MigrationPanel.tsx',
            'src-tauri/Cargo.toml',
            'src-tauri/Cargo.lock',
            'package.json',
            'package-lock.json',
            'src-tauri/tauri.conf.json'
          )
          git diff --exit-code $env:MIGRATION_GATE_SHA HEAD -- $paths
          if($LASTEXITCODE -ne 0){throw 'RUNTIME_CHANGED_AFTER_REAL_V600_GATE'}
          Write-Host "REAL_V600_MAC_TO_V602_WINDOWS_COMPAT=PASS_AT_$env:MIGRATION_GATE_SHA"
          Write-Host 'RUNTIME_CHANGED_AFTER_REAL_V600_GATE=NO'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund

      - name: Frontend and protected regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run build
          if($LASTEXITCODE -ne 0){throw 'FRONTEND_BUILD_FAILED'}
          npx vitest run src/v602RealMigrationCompatibility.test.ts src/v601WindowsHotfix.test.ts src/v320HistoryUx.test.ts src/v400BrandingCelebration.test.ts src/v510MaterialsManager.test.ts src/v512ManualAssembly.test.ts src/v503UploadCounterRestore.test.ts src/youtubePublishSafety.test.ts src/v400QuotaUploadLimitSeparation.test.ts src/v501LocalCleanupZeroQuota.test.ts src/v2115Rc7OauthUpdateContinuity.test.ts src/v500Performance.test.ts
          if($LASTEXITCODE -ne 0){throw 'PROTECTED_REGRESSION_FAILED'}
          Write-Host 'FRONTEND_BUILD=PASS'
          Write-Host 'PROTECTED_REGRESSIONS=PASS'

      - name: Canonicalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              cur=candidates[-1].strip()
              try: dec=base64.b64decode(cur,validate=True).decode('utf-8').strip()
              except Exception: break
              if dec in candidates: break
              candidates.append(dec)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY

      - name: Build signed VYRON 6.0.2 Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_BUILD_FAILED'}
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS_MISSING'}
          $sig=Get-Item ($installer.FullName+'.sig') -ErrorAction Stop
          New-Item -ItemType Directory -Force candidate | Out-Null
          Copy-Item $installer.FullName candidate/VYRON_6.0.2_x64-setup.exe
          Copy-Item $sig.FullName candidate/VYRON_6.0.2_x64-setup.exe.sig
          $sha=(Get-FileHash candidate/VYRON_6.0.2_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha | Set-Content candidate/VYRON_6.0.2_x64-setup.exe.sha256
          @(
            "HEAD=$env:GITHUB_SHA",
            "MIGRATION_GATE_SHA=$env:MIGRATION_GATE_SHA",
            "V600_EXPORTER=$env:V600_SHA",
            'VERSION=6.0.2',
            'REAL_V600_MAC_TO_V602_WINDOWS_COMPAT=PASS',
            'UNICODE_TESTS=PASS',
            'RAW_LEGACY_PASSWORD=PASS',
            'INTENTIONAL_SPACES=PASS',
            'IDEMPOTENT_IMPORT=PASS',
            'WRONG_PASSWORD=FAIL_SECURELY',
            'TAMPERED_CIPHERTEXT=FAIL_SECURELY',
            'FRONTEND_BUILD=PASS',
            'PROTECTED_REGRESSIONS=PASS',
            'WINDOWS_BUILD=PASS',
            'PRODUCTION_FEEDS_MUTATED=NO',
            'STATUS=READY_FOR_OWNER_TEST'
          ) | Set-Content candidate/gate-summary.txt
          Write-Host "INSTALLER_SHA256=$sha"

      - name: Verify updater signature
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $verifyRoot=Join-Path $env:RUNNER_TEMP 'vyron-signature-verify'
          New-Item -ItemType Directory -Force -Path (Join-Path $verifyRoot 'src') | Out-Null
          @'
          [package]
          name = "vyron-signature-verify"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          base64 = "0.22"
          minisign-verify = "=0.2.5"
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'Cargo.toml')
          @'
          use base64::{engine::general_purpose::STANDARD, Engine as _};
          use minisign_verify::{PublicKey, Signature};
          use std::{env,fs};
          fn decode(x:&str)->String{String::from_utf8(STANDARD.decode(x.trim()).unwrap()).unwrap()}
          fn main(){
            let a:Vec<String>=env::args().collect();
            let artifact=fs::read(&a[1]).unwrap();
            let sig=Signature::decode(&decode(&fs::read_to_string(&a[2]).unwrap())).unwrap();
            let conf=fs::read_to_string(&a[3]).unwrap();
            let m="\"pubkey\": \""; let s=conf.find(m).unwrap()+m.len(); let t=&conf[s..]; let e=t.find('\"').unwrap();
            let pk=PublicKey::decode(&decode(&t[..e])).unwrap();
            pk.verify(&artifact,&sig,true).unwrap();
            println!("WINDOWS_UPDATER_SIGNATURE=PASS");
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'src/main.rs')
          cargo run --quiet --release --manifest-path (Join-Path $verifyRoot 'Cargo.toml') -- candidate/VYRON_6.0.2_x64-setup.exe candidate/VYRON_6.0.2_x64-setup.exe.sig src-tauri/tauri.conf.json
          if($LASTEXITCODE -ne 0){throw 'SIGNATURE_VERIFY_FAILED'}
          Add-Content candidate/gate-summary.txt 'WINDOWS_UPDATER_SIGNATURE=PASS'

      - name: No publish / feeds unchanged
        shell: pwsh
        run: |
          $latest=Invoke-RestMethod 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json'
          $win=Invoke-RestMethod 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json'
          if($latest.version -ne '6.0.0' -or $win.version -ne '6.0.1'){throw 'PRODUCTION_FEED_MUTATED'}
          Write-Host 'PRODUCTION_FEEDS_MUTATED=NO'
          Write-Host 'STATUS=READY_FOR_OWNER_TEST'

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.0.2-REAL-MIGRATION-WINDOWS-CANDIDATE
          path: candidate/**
          if-no-files-found: error
          retention-days: 30
