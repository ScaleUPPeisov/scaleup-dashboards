name: VYRON 6.0.2 Materials Candidate QA

on:
  push:
    branches:
      - candidate/vyron-6.0.2-materials-freeze
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Materials regression tests
        run: npm test -- --run tests/materials-freeze-regression.test.mjs

      - name: Frontend production build
        run: npm run build

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml
