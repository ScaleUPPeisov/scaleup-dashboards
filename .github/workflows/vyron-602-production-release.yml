name: VYRON 6.0.2 Production Release

on:
  push:
    branches:
      - release/vyron-6.0.2-production
    paths:
      - '.github/workflows/vyron-602-production-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-602-production-release
  cancel-in-progress: false

env:
  VERSION: '6.0.2'
  TAG: v6.0.2
  RELEASE_REPO: ScaleUPPeisov/vyron-releases
  PRODUCT_SOURCE_SHA: '42634c3dd65ec65da0447b9ac8452a4ddf808185'
  BUNDLE_ID: studio.channelflow.desktop

jobs:
  gate:
    name: Minimal release gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          fetch-depth: 0
      - name: Exact source and identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
          node - <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json'),t=require('./src-tauri/tauri.conf.json');
          for(const v of [p.version,l.version,l.packages[''].version,t.version]) if(v!=='6.0.2') throw new Error('VERSION_MISMATCH='+v);
          if(t.identifier!=='studio.channelflow.desktop') throw new Error('IDENTIFIER_MISMATCH');
          const ep=t.plugins?.updater?.endpoints||[];
          if(!ep.some(x=>x.includes('ScaleUPPeisov/vyron-releases/main/updates/latest.json'))) throw new Error('MAC_UPDATER_ENDPOINT_CHANGED');
          if(!ep.some(x=>x.includes('ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json'))) throw new Error('WINDOWS_UPDATER_ENDPOINT_CHANGED');
          if(t.bundle?.createUpdaterArtifacts!==true) throw new Error('UPDATER_ARTIFACTS_DISABLED');
          console.log('IDENTITY_GATE=PASS');
          NODE
          grep -F 'version = "6.0.2"' src-tauri/Cargo.toml
          grep -A1 -F 'name = "channelflow"' src-tauri/Cargo.lock | grep -F 'version = "6.0.2"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --no-audit --no-fund
      - name: Current 6.0.2 regression gate
        run: npm test -- tests/vyron-602-manual-production-sidebar.test.mjs
      - name: npm run build
        run: npm run build
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  macos:
    name: Build signed macOS ARM64
    needs: gate
    runs-on: macos-14
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Import macOS signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VYRON_MACOS_SIGNING_P12_BASE64"
          test -n "$VYRON_MACOS_SIGNING_P12_PASSWORD"
          test -n "$VYRON_MACOS_SIGNING_IDENTITY"
          KEYCHAIN="$RUNNER_TEMP/vyron-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-signing.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$VYRON_MACOS_SIGNING_IDENTITY"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              current=candidates[-1].strip()
              try: decoded=base64.b64decode(current,validate=True).decode('utf-8').strip()
              except Exception: break
              if decoded in candidates: break
              candidates.append(decoded)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fp: fp.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY
      - name: Build VYRON 6.0.2 ARM64
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p release-mac
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee release-mac/codesign-details.txt
          ! grep -F 'Signature=adhoc' release-mac/codesign-details.txt
          hdiutil verify "$DMG"
          cp "$DMG" release-mac/VYRON-6.0.2-arm64.dmg
          cp "$UPDATER" release-mac/VYRON.app.tar.gz
          cp "$SIG" release-mac/VYRON.app.tar.gz.sig
          shasum -a 256 release-mac/VYRON-6.0.2-arm64.dmg | awk '{print $1}' > release-mac/VYRON-6.0.2-arm64.dmg.sha256
          shasum -a 256 release-mac/VYRON.app.tar.gz | awk '{print $1}' > release-mac/VYRON.app.tar.gz.sha256
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: Verify macOS updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def env(raw):
              x=raw.strip()
              try:
                  y=base64.b64decode(x,validate=True)
                  if y.startswith(b'untrusted comment:'): return y
              except Exception: pass
              return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(env(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/vyron.sig').write_bytes(env(Path('release-mac/VYRON.app.tar.gz.sig').read_bytes()))
          PY
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm release-mac/VYRON.app.tar.gz -x /tmp/vyron.sig -p /tmp/vyron.pub
      - name: Production app smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          "$APP_PATH/Contents/MacOS/channelflow" >"$RUNNER_TEMP/vyron-smoke.log" 2>&1 &
          PID=$!
          sleep 8
          kill -0 "$PID"
          kill "$PID" || true
          wait "$PID" || true
          ! grep -Eiq 'panic|fatal error|segmentation fault' "$RUNNER_TEMP/vyron-smoke.log"
          grep -F '<ProductionManager view="materials"/>' src/ProductionOS.tsx
          grep -F '<ProductionManager view="builder"/>' src/ProductionOS.tsx
          grep -F 'СОЗДАТЬ ${projectCount} ПРОЕКТОВ' src/ProductionManager.tsx
          grep -F 'function SidebarIcon' src/App.tsx
          echo 'MACOS_SMOKE=PASS'
      - name: Mac gate summary
        shell: bash
        run: |
          {
            echo "SOURCE_SHA=$PRODUCT_SOURCE_SHA"
            echo "VERSION=$VERSION"
            echo "MACOS_ARM64_BUILD=PASS"
            echo "MACOS_SIGNATURE=PASS"
            echo "MACOS_SMOKE=PASS"
            echo "DMG_SHA256=$(cat release-mac/VYRON-6.0.2-arm64.dmg.sha256)"
          } > release-mac/gate-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.0.2-MACOS-RELEASE
          path: release-mac/**
          if-no-files-found: error
          retention-days: 30

  publish_macos:
    name: Publish macOS 6.0.2
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.0.2-MACOS-RELEASE
          path: release-mac
      - name: Publish release and macOS assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          test -s release-mac/VYRON-6.0.2-arm64.dmg
          grep -F "SOURCE_SHA=$PRODUCT_SOURCE_SHA" release-mac/gate-summary.txt
          if GH_TOKEN="$RELEASE_TOKEN" gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "BLOCKER_RELEASE_ALREADY_EXISTS=$TAG"
            exit 1
          fi
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 6.0.2 — Manual Production & Sidebar Hotfix

          - restored classic manual Production flow;
          - Materials → Builder → ENDLUME;
          - fixed Materials image import for selected channel;
          - fixed image reuse;
          - unified SVG sidebar icons;
          - aligned Owner / LOCAL CORE footer;
          - preserved Google/OAuth/Keychain continuity.

          Product source: 42634c3dd65ec65da0447b9ac8452a4ddf808185.
          EOF
          GH_TOKEN="$RELEASE_TOKEN" gh release create "$TAG" --repo "$RELEASE_REPO" --title "VYRON 6.0.2 — Manual Production & Sidebar Hotfix" --notes-file /tmp/release-notes.md             release-mac/VYRON-6.0.2-arm64.dmg             release-mac/VYRON-6.0.2-arm64.dmg.sha256             release-mac/VYRON.app.tar.gz             release-mac/VYRON.app.tar.gz.sha256             release-mac/VYRON.app.tar.gz.sig
      - name: Promote macOS updater
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:$RELEASE_TOKEN@github.com/$RELEASE_REPO.git" release-repo
          MAC_SIG="$(tr -d '\r\n' < release-mac/VYRON.app.tar.gz.sig)"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$MAC_SIG" "$PUB_DATE" <<'PY'
          import json,sys
          from pathlib import Path
          sig,pub=sys.argv[1:3]
          repo='ScaleUPPeisov/vyron-releases'
          notes='VYRON 6.0.2 — Manual Production & Sidebar Hotfix'
          data={'version':'6.0.2','notes':notes,'pub_date':pub,'platforms':{'darwin-aarch64':{
            'url':f'https://github.com/{repo}/releases/download/v6.0.2/VYRON.app.tar.gz','signature':sig
          }}}
          Path('release-repo/updates/latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cd release-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json
          git commit -m 'release: promote VYRON 6.0.2 macOS updater'
          git push origin main
      - name: Verify macOS download and feed
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/latest.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/latest.json'))
          assert x['version']=='6.0.2'
          assert 'darwin-aarch64' in x['platforms']
          assert x['platforms']['darwin-aarch64']['url'].endswith('/v6.0.2/VYRON.app.tar.gz')
          assert x['platforms']['darwin-aarch64']['signature']
          print('MAC_UPDATER_602=PASS')
          PY
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON-6.0.2-arm64.dmg" -o /tmp/mac-byte >/dev/null 2>&1
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON.app.tar.gz" -o /tmp/mac-updater-byte >/dev/null 2>&1

  windows:
    name: Build signed Windows x64
    needs: publish_macos
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact source
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:PRODUCT_SOURCE_SHA){throw 'SOURCE_SHA_MISMATCH'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Normalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              current=candidates[-1].strip()
              try: decoded=base64.b64decode(current,validate=True).decode('utf-8').strip()
              except Exception: break
              if decoded in candidates: break
              candidates.append(decoded)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fp: fp.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY
      - name: Build Windows 6.0.2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm run build
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS_MISSING'}
          $sig=Get-Item ($installer.FullName + '.sig') -ErrorAction Stop
          New-Item -ItemType Directory -Force -Path release-win | Out-Null
          Copy-Item $installer.FullName release-win/VYRON_6.0.2_x64-setup.exe
          Copy-Item $sig.FullName release-win/VYRON_6.0.2_x64-setup.exe.sig
          (Get-FileHash release-win/VYRON_6.0.2_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content release-win/VYRON_6.0.2_x64-setup.exe.sha256
          @(
            "SOURCE_SHA=$env:PRODUCT_SOURCE_SHA",
            'VERSION=6.0.2',
            'WINDOWS_X64_BUILD=PASS',
            "EXE_SHA256=$((Get-Content release-win/VYRON_6.0.2_x64-setup.exe.sha256 -Raw).Trim())"
          ) | Set-Content release-win/gate-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.0.2-WINDOWS-RELEASE
          path: release-win/**
          if-no-files-found: error
          retention-days: 30

  publish_windows:
    name: Publish Windows and finalize updater
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.0.2-WINDOWS-RELEASE
          path: release-win
      - name: Attach Windows assets
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F "SOURCE_SHA=$PRODUCT_SOURCE_SHA" release-win/gate-summary.txt
          GH_TOKEN="$RELEASE_TOKEN" gh release upload "$TAG" --repo "$RELEASE_REPO"             release-win/VYRON_6.0.2_x64-setup.exe             release-win/VYRON_6.0.2_x64-setup.exe.sha256             release-win/VYRON_6.0.2_x64-setup.exe.sig
      - name: Verify both updater signatures
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          mkdir -p /tmp/vyron-mac
          GH_TOKEN="$RELEASE_TOKEN" gh release download "$TAG" --repo "$RELEASE_REPO" --dir /tmp/vyron-mac             --pattern 'VYRON.app.tar.gz' --pattern 'VYRON.app.tar.gz.sig'
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def env(raw):
              x=raw.strip()
              try:
                  y=base64.b64decode(x,validate=True)
                  if y.startswith(b'untrusted comment:'): return y
              except Exception: pass
              return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(env(str(conf['plugins']['updater']['pubkey']).encode()))
          for src,dst in [
            ('/tmp/vyron-mac/VYRON.app.tar.gz.sig','/tmp/mac.sig'),
            ('release-win/VYRON_6.0.2_x64-setup.exe.sig','/tmp/win.sig')
          ]:
              Path(dst).write_bytes(env(Path(src).read_bytes()))
          PY
          minisign -Vm /tmp/vyron-mac/VYRON.app.tar.gz -x /tmp/mac.sig -p /tmp/vyron.pub
          minisign -Vm release-win/VYRON_6.0.2_x64-setup.exe -x /tmp/win.sig -p /tmp/vyron.pub
      - name: Promote final updater feeds
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:$RELEASE_TOKEN@github.com/$RELEASE_REPO.git" release-repo
          MAC_SIG="$(python3 - <<'PY'
          import json
          x=json.load(open('release-repo/updates/latest.json'))
          print(x['platforms']['darwin-aarch64']['signature'])
          PY
          )"
          WIN_SIG="$(tr -d '\r\n' < release-win/VYRON_6.0.2_x64-setup.exe.sig)"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$MAC_SIG" "$WIN_SIG" "$PUB_DATE" <<'PY'
          import json,sys
          from pathlib import Path
          mac_sig,win_sig,pub=sys.argv[1:4]
          repo='ScaleUPPeisov/vyron-releases'
          notes='VYRON 6.0.2 — Manual Production & Sidebar Hotfix'
          both={'version':'6.0.2','notes':notes,'pub_date':pub,'platforms':{
            'darwin-aarch64':{'url':f'https://github.com/{repo}/releases/download/v6.0.2/VYRON.app.tar.gz','signature':mac_sig},
            'windows-x86_64':{'url':f'https://github.com/{repo}/releases/download/v6.0.2/VYRON_6.0.2_x64-setup.exe','signature':win_sig}
          }}
          win={'version':'6.0.2','notes':notes,'pub_date':pub,'platforms':{
            'windows-x86_64':{'url':f'https://github.com/{repo}/releases/download/v6.0.2/VYRON_6.0.2_x64-setup.exe','signature':win_sig}
          }}
          Path('release-repo/updates/latest.json').write_text(json.dumps(both,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('release-repo/updates/windows-latest.json').write_text(json.dumps(win,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cd release-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json updates/windows-latest.json
          git commit -m 'release: promote VYRON 6.0.2 updater feeds'
          git push origin main
      - name: Final production verification
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/releases/tags/$TAG" >/tmp/release.json
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/latest.json
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$RELEASE_REPO/contents/updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/windows.json
          python3 - <<'PY'
          import json
          rel=json.load(open('/tmp/release.json'))
          latest=json.load(open('/tmp/latest.json'))
          win=json.load(open('/tmp/windows.json'))
          assets={x['name'] for x in rel['assets']}
          required={
            'VYRON-6.0.2-arm64.dmg','VYRON-6.0.2-arm64.dmg.sha256',
            'VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig',
