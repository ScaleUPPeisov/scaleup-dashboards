name: VYRON 6.0.3 macOS Hotfix Smoke

on:
  push:
    branches:
      - hotfix/vyron-6.0.3-production-images
    paths:
      - '.github/workflows/vyron-603-macos-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: '6.0.3'
  PRODUCT_SOURCE_SHA: '2912bdd390e9b8b52e826a5ac05189c1205ae5d9'
  BUNDLE_ID: studio.channelflow.desktop
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  smoke:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact hotfix source
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');if(p.version!=='6.0.3'||t.version!=='6.0.3'||t.identifier!=='studio.channelflow.desktop')process.exit(2)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - name: Hotfix regressions on macOS
        run: |
          npm test -- tests/vyron-603-production-hotfix.test.mjs
          cargo test --manifest-path src-tauri/Cargo.toml v603_ -- --nocapture

      - name: Import VYRON signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-603-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-603-signing.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              current=candidates[-1].strip()
              try: decoded=base64.b64decode(current,validate=True).decode('utf-8').strip()
              except Exception: break
              if decoded in candidates: break
              candidates.append(decoded)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as fp: fp.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY

      - name: Build signed 6.0.3 ARM64 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p candidate
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          cp "$DMG" candidate/VYRON-6.0.3-arm64.dmg
          cp "$UPDATER" candidate/VYRON.app.tar.gz
          cp "$SIG" candidate/VYRON.app.tar.gz.sig
          shasum -a 256 candidate/VYRON-6.0.3-arm64.dmg | awk '{print $1}' > candidate/VYRON-6.0.3-arm64.dmg.sha256
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Production launch smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          "$APP_PATH/Contents/MacOS/channelflow" >"$RUNNER_TEMP/vyron603-smoke.log" 2>&1 &
          PID=$!
          sleep 8
          kill -0 "$PID"
          kill "$PID" || true
          wait "$PID" || true
          ! grep -Eiq 'panic|fatal error|segmentation fault' "$RUNNER_TEMP/vyron603-smoke.log"
          grep -F '<ProductionManager view="materials"/>' src/ProductionOS.tsx
          grep -F '<ProductionManager view="builder"/>' src/ProductionOS.tsx
          grep -F '● СБОР АКТИВЕН' src/ProductionManager.tsx
          grep -F 'resolvedImagesAvailable' src/ProductionManager.tsx
          echo 'MACOS_603_SMOKE=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.0.3-MACOS-HOTFIX-CANDIDATE
          path: candidate/**
          if-no-files-found: error
          retention-days: 30
