name: VYRON 6.0.3 Windows OAuth Vault Candidate

on:
  push:
    branches:
      - candidate/vyron-6.0.3-oauth-vault-hotfix
    paths:
      - '.github/workflows/vyron-603-oauth-vault-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-603-oauth-vault-candidate
  cancel-in-progress: false

env:
  VERSION: '6.0.3'
  V602_BASELINE: da54e634e84a7f6b6a51a16c13b02511ee3dce70
  V600_SHA: 0f16fac6f4a50d083dad37a44684c8accbacf4ce

jobs:
  windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download exact macOS VYRON 6.0.0 migration artifact
        uses: actions/download-artifact@v4
        with:
          name: real-v600-macos-origin
          path: real-v600
          run-id: 36811907427
          github-token: ${{ github.token }}

      - name: Verify identity, source baseline and feeds
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),t=require('./src-tauri/tauri.conf.json');for(const v of [p.version,l.version,l.packages[''].version,t.version])if(v!=='6.0.3')process.exit(2)"
          if($LASTEXITCODE -ne 0){throw 'V603_IDENTITY_FAILED'}
          if(-not (Test-Path 'real-v600/real-v600-origin.vyron')){throw 'REAL_V600_ARTIFACT_MISSING'}
          $actual=(Get-FileHash 'real-v600/real-v600-origin.vyron' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=(Get-Content 'real-v600/real-v600-origin.vyron.sha256' -Raw).Trim().Split()[0].ToLowerInvariant()
          if($actual -ne $expected){throw 'REAL_V600_ARTIFACT_HASH_MISMATCH'}
          $latest=Invoke-RestMethod 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json'
          $win=Invoke-RestMethod 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json'
          if($latest.version -ne '6.0.0'){throw "GENERAL_FEED_CHANGED=$($latest.version)"}
          if($win.version -ne '6.0.1'){throw "WINDOWS_FEED_CHANGED=$($win.version)"}
          Write-Host "REAL_V600_ARTIFACT_SHA256=$actual"
          Write-Host 'PRODUCTION_FEEDS_MUTATED=NO'

      - name: Prove migration package crypto unchanged from 6.0.2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $spec="$($env:V602_BASELINE):src-tauri/src/migration.rs"
          git show $spec | Set-Content -Encoding utf8 baseline-migration.rs
          @'
          from pathlib import Path
          base=Path("baseline-migration.rs").read_text(encoding="utf-8-sig").replace("\r\n","\n")
          cur=Path("src-tauri/src/migration.rs").read_text(encoding="utf-8").replace("\r\n","\n")
          marker="fn backup_root(app: &AppHandle)"
          assert marker in base and marker in cur
          assert base.split(marker,1)[0]==cur.split(marker,1)[0], "MIGRATION_PACKAGE_CRYPTO_OR_MERGE_PREFIX_CHANGED"
          print("MIGRATION_PACKAGE_CRYPTO_UNCHANGED=PASS")
          '@ | python -

      - name: Set visually identical Windows migration password
        shell: pwsh
        run: |
          @'
          import os,unicodedata
          p=unicodedata.normalize('NFC','й-ё-é-real-v600-password-123')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('VYRON_FIXTURE_KIND=windows\n')
              f.write('VYRON_FIXTURE_IN='+os.path.abspath('real-v600/real-v600-origin.vyron')+'\n')
              f.write('VYRON_FIXTURE_PASS<<VYRONPASS\n'+p+'\nVYRONPASS\n')
          '@ | python -

      - name: REAL V600 macOS package decrypt gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item Env:VYRON_FIXTURE_OUT -ErrorAction SilentlyContinue
          cargo test --locked --manifest-path src-tauri/Cargo.toml migration::tests::cross_platform_fixture_import_merge_and_reexport -- --ignored --exact --nocapture --test-threads=1
          if($LASTEXITCODE -ne 0){throw 'REAL_V600_DECRYPT_FAILED'}
          Write-Host 'REAL_V600_MAC_TO_V603_WINDOWS_DECRYPT=PASS'
          Write-Host 'IDEMPOTENT_IMPORT=PASS'
          Write-Host 'CHANNELS_DELETED=0'

      - name: Windows canonical key and OAuth vault regression gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tests=@(
            'oauth_vault::tests::windows_canonical_key_without_key_files_selects_current_local_vault',
            'oauth_vault::tests::windows_credential_manager_master_key_is_valid_without_key_files',
            'oauth_vault::tests::failed_602_state_current_vault_wins_even_when_legacy_backup_exists',
            'oauth_vault::tests::portable_merge_31_profiles_into_clean_windows_state_is_complete_and_non_destructive',
            'oauth_vault::tests::migration_backup_is_zero_side_effects_on_live_oauth_storage',
            'oauth_vault::tests::migration_backup_of_absent_vault_creates_no_live_or_snapshot_vault',
            'oauth_vault::tests::rollback_current_local_snapshot_uses_current_key_not_legacy_key',
            'oauth_vault::tests::rollback_opaque_legacy_snapshot_restores_raw_bytes_without_current_key_validation',
            'migration::tests::windows_clean_import_35_channels_is_non_destructive_and_idempotent',
            'migration::tests::rollback_wrapper_restores_partial_mutation'
          )
          foreach($t in $tests){
            cargo test --locked --manifest-path src-tauri/Cargo.toml $t -- --exact --nocapture --test-threads=1
            if($LASTEXITCODE -ne 0){throw "FAILED=$t"}
          }
          Write-Host 'WINDOWS_CANONICAL_KEY_WITHOUT_FILES=PASS'
          Write-Host 'FAILED_602_STATE_RECOVERY=PASS'
          Write-Host 'OAUTH_PORTABLE_MERGE_31_PROFILES=PASS'
          Write-Host 'MIGRATION_COMMIT=PASS'
          Write-Host 'MIGRATION_ROLLBACK=PASS'
          Write-Host 'BACKUP_ZERO_SIDE_EFFECTS=PASS'
          Write-Host 'OAUTH_PROFILES_DELETED=0'

      - name: Frontend and protected regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          npm run build
          if($LASTEXITCODE -ne 0){throw 'FRONTEND_BUILD_FAILED'}
          npx vitest run src/v603OauthVaultMigration.test.ts src/v602RealMigrationCompatibility.test.ts src/v601WindowsHotfix.test.ts src/v320HistoryUx.test.ts src/v400BrandingCelebration.test.ts src/v510MaterialsManager.test.ts src/v512ManualAssembly.test.ts src/v503UploadCounterRestore.test.ts src/youtubePublishSafety.test.ts src/v400QuotaUploadLimitSeparation.test.ts src/v501LocalCleanupZeroQuota.test.ts src/v2115Rc7OauthUpdateContinuity.test.ts src/v500Performance.test.ts
          if($LASTEXITCODE -ne 0){throw 'PROTECTED_REGRESSION_FAILED'}
          Write-Host 'FRONTEND_BUILD=PASS'
          Write-Host 'PROTECTED_REGRESSIONS=PASS'

      - name: Canonicalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              cur=candidates[-1].strip()
              try: dec=base64.b64decode(cur,validate=True).decode('utf-8').strip()
              except Exception: break
              if dec in candidates: break
              candidates.append(dec)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY

      - name: Build signed VYRON 6.0.3 Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_BUILD_FAILED'}
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS_MISSING'}
          $sig=Get-Item ($installer.FullName+'.sig') -ErrorAction Stop
          New-Item -ItemType Directory -Force candidate | Out-Null
          Copy-Item $installer.FullName candidate/VYRON_6.0.3_x64-setup.exe
          Copy-Item $sig.FullName candidate/VYRON_6.0.3_x64-setup.exe.sig
          $sha=(Get-FileHash candidate/VYRON_6.0.3_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha | Set-Content candidate/VYRON_6.0.3_x64-setup.exe.sha256
          @(
            "HEAD=$env:GITHUB_SHA",
            "V602_BASELINE=$env:V602_BASELINE",
            "V600_EXPORTER=$env:V600_SHA",
            'VERSION=6.0.3',
            'WINDOWS_CANONICAL_KEY_WITHOUT_FILES=PASS',
            'FAILED_602_STATE_RECOVERY=PASS',
            'OAUTH_PORTABLE_MERGE_31_PROFILES=PASS',
            'MIGRATION_COMMIT=PASS',
            'MIGRATION_ROLLBACK=PASS',
            'BACKUP_ZERO_SIDE_EFFECTS=PASS',
            'REAL_V600_MAC_TO_V603_WINDOWS_DECRYPT=PASS',
            'IDEMPOTENT_IMPORT=PASS',
            'CHANNELS_DELETED=0',
            'OAUTH_PROFILES_DELETED=0',
            'MIGRATION_PACKAGE_CRYPTO_UNCHANGED=PASS',
            'FRONTEND_BUILD=PASS',
            'PROTECTED_REGRESSIONS=PASS',
            'WINDOWS_BUILD=PASS',
            'PRODUCTION_FEEDS_MUTATED=NO',
            'STATUS=READY_FOR_OWNER_TEST'
          ) | Set-Content candidate/gate-summary.txt
          Write-Host "INSTALLER_SHA256=$sha"

      - name: Verify updater signature
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $verifyRoot=Join-Path $env:RUNNER_TEMP 'vyron-signature-verify'
          New-Item -ItemType Directory -Force -Path (Join-Path $verifyRoot 'src') | Out-Null
          @'
          [package]
          name = "vyron-signature-verify"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          base64 = "0.22"
          minisign-verify = "=0.2.5"
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'Cargo.toml')
          @'
          use base64::{engine::general_purpose::STANDARD, Engine as _};
          use minisign_verify::{PublicKey, Signature};
          use std::{env,fs};
          fn decode(x:&str)->String{String::from_utf8(STANDARD.decode(x.trim()).unwrap()).unwrap()}
          fn main(){
            let a:Vec<String>=env::args().collect();
            let artifact=fs::read(&a[1]).unwrap();
            let sig=Signature::decode(&decode(&fs::read_to_string(&a[2]).unwrap())).unwrap();
            let conf=fs::read_to_string(&a[3]).unwrap();
            let m="\"pubkey\": \""; let s=conf.find(m).unwrap()+m.len(); let t=&conf[s..]; let e=t.find('\"').unwrap();
            let pk=PublicKey::decode(&decode(&t[..e])).unwrap();
            pk.verify(&artifact,&sig,true).unwrap();
            println!("WINDOWS_UPDATER_SIGNATURE=PASS");
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'src/main.rs')
          cargo run --quiet --release --manifest-path (Join-Path $verifyRoot 'Cargo.toml') -- candidate/VYRON_6.0.3_x64-setup.exe candidate/VYRON_6.0.3_x64-setup.exe.sig src-tauri/tauri.conf.json
          if($LASTEXITCODE -ne 0){throw 'SIGNATURE_VERIFY_FAILED'}
          Add-Content candidate/gate-summary.txt 'WINDOWS_UPDATER_SIGNATURE=PASS'

      - name: Final no-publish assertion
        shell: pwsh
        run: |
          $latest=Invoke-RestMethod 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json'
          $win=Invoke-RestMethod 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/windows-latest.json'
          if($latest.version -ne '6.0.0' -or $win.version -ne '6.0.1'){throw 'PRODUCTION_FEED_MUTATED'}
          Write-Host 'PRODUCTION_FEEDS_MUTATED=NO'
          Write-Host 'STATUS=READY_FOR_OWNER_TEST'

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.0.3-WINDOWS-OAUTH-VAULT-CANDIDATE
          path: candidate/**
          if-no-files-found: error
          retention-days: 30
