name: VYRON 6.1.0 Persistent YouTube Production Candidate

on:
  push:
    branches:
      - candidate/vyron-6.1.0-persistent-youtube-route

permissions:
  contents: read

env:
  VERSION: '6.1.0'
  RELEASE_BASE: '4de188b2cf50d3f58cd7074a6e57ccb67c15e1b2'
  PROBE_BLOB: 'f580a12c6bbc85de9b9c429f487a5e94c0449ecc'
  BUNDLE_ID: studio.channelflow.desktop

jobs:
  m1-gate:
    runs-on: macos-14
    timeout-minutes: 150
    outputs:
      m1_gate: ${{ steps.m1.outputs.m1_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify clean production candidate scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RELEASE_BASE:src/M1PerformanceProbe.tsx")" = "$PROBE_BLOB"
          test "$(git rev-parse "HEAD:src/M1PerformanceProbe.tsx")" = "$PROBE_BLOB"
          git diff --exit-code "$RELEASE_BASE"...HEAD -- \
            src/M1PerformanceProbe.tsx \
            src/api.ts \
            src/store.ts \
            src/styles.css \
            src/YouTubeChannelBar.tsx \
            src/youtubePublishSafety.ts \
            src/ChannelRunway.tsx \
            src/MetadataQueueAssignmentBridge.tsx \
            src/MaterialsManager.tsx \
            src-tauri/src/oauth_vault.rs \
            src-tauri/src/security.rs \
            src-tauri/src/youtube.rs \
            src-tauri/src/migration.rs \
            src-tauri/tauri.conf.json \
            src-tauri/tauri.windows.conf.json
          CHANGED="$(git diff --name-only "$RELEASE_BASE"...HEAD | sort)"
          ALLOWED="$(printf '%s\n' \
            '.github/workflows/vyron-610-persistent-youtube-candidate.yml' \
            'src/App.tsx' \
            'src/PublisherOS.tsx' \
            'src/YouTubeCenter.tsx' \
            'src/v610M1RoutePerformance.test.ts' \
            'src/v610PersistentYoutubeRoute.test.ts' | sort)"
          test "$CHANGED" = "$ALLOWED"
          test ! -e src/m1RouteLifecycleTrace.ts
          test ! -e src/M1ParityPassiveObserver.tsx
          ! grep -R -n "tracePassiveEffect\|VITE_M1_ROUTE_TRACE\|VITE_M1_PARITY_DIAG" src/App.tsx src/YouTubeCenter.tsx src/PublisherOS.tsx
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),t=require('./src-tauri/tauri.conf.json'); for(const v of [p.version,l.version,l.packages[''].version,t.version]) if(v!=='6.1.0') process.exit(2); if(t.identifier!=='studio.channelflow.desktop') process.exit(3)"
          echo "PRODUCTION_CANDIDATE_SCOPE=PASS"
          echo "M1PerformanceProbe unchanged=YES"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - name: Targeted persistent-route regressions
        run: >
          npx vitest run
          src/v610PersistentYoutubeRoute.test.ts
          src/v610M1RoutePerformance.test.ts
          src/v610PublisherColdRoute.test.ts

      - name: Production frontend build
        run: npm run build

      - name: Hidden-route background work contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text()
          center=Path('src/YouTubeCenter.tsx').read_text()
          publisher=Path('src/PublisherOS.tsx').read_text()
          bar=Path('src/YouTubeChannelBar.tsx').read_text()
          metadata=Path('src/MetadataPage.tsx').read_text()
          assert 'youtubeRouteMountedRef' in app
          assert 'inert={!youtubeSelected}' in app
          assert "visibility:'hidden'" in app
          assert '<CachedPublisher activityRef={routeActiveRef} active={active}/>' in center
          for needle in (
            'if(!active||!batchActive)return;return subscribeGlobalDailyUploadStatus',
            'if(!active||!batchActive)return;const off=subscribeYoutubeQuota',
            'if(!active)return;let live=true;const check=async()=>',
            'if(!active||!profileId||!batchActive)return',
            "const routeIsActive=()=>active!==false&&activityRef?.current!==false",
          ):
            assert needle in publisher, needle
          assert 'if(!routeActive)return;return subscribeActivePublishChannel' in bar
          assert 'if(!routeActive||!detailsOpen)return' in bar
          assert 'const activeRef=useRef(active);activeRef.current=active' in metadata
          print('PERSISTENT_YOUTUBE_ROUTE=PASS')
          print('BACKGROUND_API_CALLS_WHILE_HIDDEN=0_BY_GUARD_CONTRACT')
          PY

      - name: Build exact ARM64 candidate for physical M1
        shell: bash
        run: |
          set -Eeuo pipefail
          export APPLE_SIGNING_IDENTITY='-'
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          test -d "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          file "$APP/Contents/MacOS/channelflow" | grep -q arm64
          codesign --verify --deep --strict "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Seed isolated owner license
        shell: bash
        run: |
          set -Eeuo pipefail
          LICENSE="$RUNNER_TEMP/license.json"
          printf '%s\n' '{"valid":true,"type":"owner-lifetime","expiresAt":null,"maskedKey":"CI-610-PERSISTENT","activatedAt":"2026-10-02T00:00:00Z"}' > "$LICENSE"
          for ROOT in "$HOME/Library/Application Support/studio.channelflow.desktop" "$HOME/Library/Application Support/VYRON" "$HOME/Library/Application Support/channelflow"; do
            mkdir -p "$ROOT"
            cp "$LICENSE" "$ROOT/license.json"
          done

      - id: m1
        name: Physical exact-workload M1 gate
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT_DIR="$RUNNER_TEMP/m1-report"
          REPORT="$REPORT_DIR/report.json"
          SUMMARY="$REPORT_DIR/summary.json"
          LOG="$REPORT_DIR/runtime.log"
          PERF_ROOT="$RUNNER_TEMP/m1-profile"
          rm -rf "$REPORT_DIR" "$PERF_ROOT"
          mkdir -p "$REPORT_DIR" "$PERF_ROOT"
          VYRON_M1_PERF_PROBE=1 \
          VYRON_M1_PERF_ROOT="$PERF_ROOT" \
          VYRON_M1_PERF_REPORT="$REPORT" \
            "$APP_PATH/Contents/MacOS/channelflow" >"$LOG" 2>&1 &
          PID=$!
          python3 - "$REPORT_DIR" "$REPORT" <<'PY'
          import os,select,sys
          directory,path=sys.argv[1],sys.argv[2]
          fd=os.open(directory,os.O_RDONLY)
          kq=select.kqueue()
          try:
              event=select.kevent(fd,filter=select.KQ_FILTER_VNODE,flags=select.KQ_EV_ADD|select.KQ_EV_CLEAR,fflags=select.KQ_NOTE_WRITE|select.KQ_NOTE_EXTEND|select.KQ_NOTE_RENAME)
              kq.control([event],0)
              while not os.path.isfile(path):
                  kq.control(None,1)
          finally:
              kq.close()
              os.close(fd)
          PY
          kill "$PID" >/dev/null 2>&1 || true
          wait "$PID" >/dev/null 2>&1 || true
          test -s "$REPORT"
          python3 - "$REPORT" "$SUMMARY" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          d=p.get('dataset') or {}
          a=p.get('aggregate') or {}
          rf=p.get('routeFrameTimings') or {}
          assert d.get('channels')==35,p
          assert d.get('jobs')==1000,p
          assert d.get('metadataRecords')==5000,p
          assert d.get('assignedJobs')==1000,p
          assert d.get('navigationSwitchesPerRound')==30,p
          assert d.get('rounds')==3,p
          def fr(name):
              x=rf.get(name) or {}
              return {'p50':x.get('median'),'p95':x.get('p95'),'worst':x.get('worst')}
          gate=(
            float(a.get('fps',0))>=57 and
            float(a.get('p50',999))<=17.5 and
            float(a.get('p95',999))<=20.5 and
            float(a.get('p99',999))<=33.5 and
            float(a.get('dropped',999))<2 and
            int(a.get('long50',999))==0
          )
          out={
            'head':p.get('head'),
            'aggregate':a,
            'youtube':{
              'raf1':fr('youtube:raf1'),
              'raf2':fr('youtube:raf2'),
              'raf3':fr('youtube:raf3')
            },
            'm1Gate':'PASS' if gate else 'FAIL',
            'probeBlob':'f580a12c6bbc85de9b9c429f487a5e94c0449ecc'
          }
          json.dump(out,open(sys.argv[2],'w'),indent=2)
          print(json.dumps(out,indent=2))
          if not gate: raise SystemExit(2)
          PY
          echo "m1_gate=PASS" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-6.1.0-PERSISTENT-M1
          path: ${{ runner.temp }}/m1-report/**
          if-no-files-found: warn
          retention-days: 30

  full-qa:
    needs: m1-gate
    if: needs.m1-gate.result == 'success' && needs.m1-gate.outputs.m1_gate == 'PASS'
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Full frontend exact-head QA
        run: npm test
      - run: npm run build
      - name: Full Rust exact-head QA
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Exact-head proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "HEAD:src/M1PerformanceProbe.tsx")" = "$PROBE_BLOB"
          echo "FULL_QA=PASS"

  migration:
    needs: m1-gate
    if: needs.m1-gate.result == 'success' && needs.m1-gate.outputs.m1_gate == 'PASS'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Exact-head migration regression
        run: cargo test --manifest-path src-tauri/Cargo.toml migration::tests -- --nocapture

  upload-reliability:
    needs: m1-gate
    if: needs.m1-gate.result == 'success' && needs.m1-gate.outputs.m1_gate == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Upload reliability and counter smoke
        run: >
          npx vitest run
          src/youtubePublishSafety.test.ts
          src/v503UploadCounterRestore.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/v501LocalCleanupZeroQuota.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
          src/v610PersistentYoutubeRoute.test.ts

  mac-build:
    needs: [full-qa, migration, upload-reliability]
    if: needs.full-qa.result == 'success' && needs.migration.result == 'success' && needs.upload-reliability.result == 'success'
    runs-on: macos-14
    timeout-minutes: 150
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
      EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund

      - name: Import macOS signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-610-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-610-signing.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Canonicalize updater key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              current=candidates[-1].strip()
              try: decoded=base64.b64decode(current,validate=True).decode().strip()
              except Exception: break
              if decoded in candidates: break
              candidates.append(decoded)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY

      - name: Signed macOS ARM64 build
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p release-mac
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee release-mac/codesign.txt
          ! grep -F 'Signature=adhoc' release-mac/codesign.txt
          hdiutil verify "$DMG"
          cp "$DMG" release-mac/VYRON-6.1.0-arm64.dmg
          cp "$UPDATER" release-mac/VYRON.app.tar.gz
          cp "$SIG" release-mac/VYRON.app.tar.gz.sig
          shasum -a 256 release-mac/VYRON-6.1.0-arm64.dmg | awk '{print $1}' > release-mac/VYRON-6.1.0-arm64.dmg.sha256
          shasum -a 256 release-mac/VYRON.app.tar.gz | awk '{print $1}' > release-mac/VYRON.app.tar.gz.sha256
          echo "$GITHUB_SHA" > release-mac/head.txt

      - name: Verify macOS updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def env(raw):
              x=raw.strip()
              try:
                  y=base64.b64decode(x,validate=True)
                  if y.startswith(b'untrusted comment:'): return y
              except Exception: pass
              return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(env(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/vyron.sig').write_bytes(env(Path('release-mac/VYRON.app.tar.gz.sig').read_bytes()))
          PY
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm release-mac/VYRON.app.tar.gz -x /tmp/vyron.sig -p /tmp/vyron.pub

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.0-MAC-RELEASE-READY
          path: release-mac/**
          retention-days: 30

  windows-build:
    needs: [full-qa, migration, upload-reliability]
    if: needs.full-qa.result == 'success' && needs.migration.result == 'success' && needs.upload-reliability.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund

      - name: Canonicalize updater key
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              current=candidates[-1].strip()
              try: decoded=base64.b64decode(current,validate=True).decode().strip()
              except Exception: break
              if decoded in candidates: break
              candidates.append(decoded)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY

      - name: Windows x64 signed updater build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_BUILD_FAILED'}
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS_MISSING'}
          $sig=Get-Item ($installer.FullName+'.sig') -ErrorAction Stop
          New-Item -ItemType Directory -Force release-win | Out-Null
          Copy-Item $installer.FullName release-win/VYRON_6.1.0_x64-setup.exe
          Copy-Item $sig.FullName release-win/VYRON_6.1.0_x64-setup.exe.sig
          (Get-FileHash release-win/VYRON_6.1.0_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content release-win/VYRON_6.1.0_x64-setup.exe.sha256
          $env:GITHUB_SHA | Set-Content release-win/head.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.0-WINDOWS-RELEASE-READY
          path: release-win/**
          retention-days: 30

  freeze:
    needs: [m1-gate, full-qa, migration, upload-reliability, mac-build, windows-build]
    if: needs.m1-gate.result == 'success' && needs.full-qa.result == 'success' && needs.migration.result == 'success' && needs.upload-reliability.result == 'success' && needs.mac-build.result == 'success' && needs.windows-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Freeze exact production candidate
        shell: bash
        run: |
          cat > freeze.txt <<EOF
          HEAD=$GITHUB_SHA
          VERSION=6.1.0
          M1_GATE=PASS
          FULL_QA=PASS
          MIGRATION=PASS
          UPLOAD_RELIABILITY=PASS
          MAC_BUILD=PASS
          WINDOWS_BUILD=PASS
          RELEASE_ASSETS_READY=YES
          PRODUCTION_FEEDS_MUTATED=NO
          ACTUAL_UPDATER_6_0_2_TO_6_1_0=REQUIRED_BEFORE_PUBLICATION
          EOF
          cat freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.0-FREEZE
          path: freeze.txt
          retention-days: 30
