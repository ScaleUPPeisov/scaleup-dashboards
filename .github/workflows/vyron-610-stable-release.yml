name: VYRON 6.1.0 Stable Release

on:
  push:
    branches:
      - release/vyron-6.1.0-stable
    paths:
      - '.github/workflows/vyron-610-stable-release.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-610-stable-release
  cancel-in-progress: false

env:
  SOURCE_HEAD: 4de188b2cf50d3f58cd7074a6e57ccb67c15e1b2
  VERSION: '6.1.0'
  TAG: v6.1.0
  BASELINE_VERSION: '6.0.2'
  BASELINE_SOURCE: 42634c3dd65ec65da0447b9ac8452a4ddf808185
  RELEASE_REPO: ScaleUPPeisov/vyron-releases
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  qa:
    name: Exact-head QA
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),t=require('./src-tauri/tauri.conf.json');for(const v of [p.version,l.version,l.packages[''].version,t.version])if(v!=='6.1.0')process.exit(2);if(t.identifier!=='studio.channelflow.desktop'||t.bundle.createUpdaterArtifacts!==true)process.exit(3)"
          grep -q '^version = "6.1.0"$' src-tauri/Cargo.toml
          echo EXACT_HEAD=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Frontend production build
        run: npm run build
      - name: Full frontend legacy audit
        id: fullnpm
        continue-on-error: true
        run: npm test
      - name: Classify historical contract drift
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.fullnpm.outcome }}" != "success" ]; then
            echo "FULL_NPM_LEGACY_AUDIT=KNOWN_HISTORICAL_CONTRACT_DRIFT"
            echo "Current release gate is the explicit 6.1.0 protected regression set below."
          else
            echo "FULL_NPM_LEGACY_AUDIT=PASS"
          fi
      - name: Protected targeted regressions
        run: >
          npx vitest run
          src/v610MetadataQueue.test.ts
          src/v610PublisherInventoryReconcile.test.ts
          src/v610PublisherColdRoute.test.ts
          src/v610ChannelRunwayFleetRefresh.test.ts
          src/v610GlobalUploadCounter.test.ts
          src/v503UploadCounterRestore.test.ts
          src/youtubePublishSafety.test.ts
          src/uploadQueue.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/v501LocalCleanupZeroQuota.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
      - name: Rust full library QA
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - name: Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

  migration:
    name: Migration ${{ matrix.name }}
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Core migration regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml migration::tests -- --nocapture
      - name: Metadata Queue migration/idempotency regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml metadata_queue::tests -- --nocapture
      - name: Migration source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          q=Path('src-tauri/src/metadata_queue.rs').read_text()
          m=Path('src-tauri/src/migration.rs').read_text()
          assert 'status_never_moves_applied_backwards' in q
          assert 'deleted":0' in q or 'deleted\":0' in q
          assert 'backup_to' in q and 'restore_from' in q
          assert 'merge_portable_snapshot' in m
          print('MIGRATION_IDEMPOTENT=PASS')
          print('METADATA_APPLIED_NEVER_REGRESSES=PASS')
          PY

  upload-reliability:
    name: Upload reliability
    needs: qa
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Counter / queue / upload regressions
        run: >
          npx vitest run
          src/v610GlobalUploadCounter.test.ts
          src/v503UploadCounterRestore.test.ts
          src/youtubePublishSafety.test.ts
          src/uploadQueue.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/v501LocalCleanupZeroQuota.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
      - name: Native upload transport regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml youtube_write_tests::tags_respect_youtube_500_budget -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml youtube_write_tests::tags_dedupe_and_strip_angle_brackets -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v211_upload_transport_tests -- --nocapture
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src-tauri/src/youtube.rs').read_text()
          body=s[s.index('async fn continue_persisted_upload'):s.index('#[tauri::command]\npub async fn youtube_upload_video')]
          assert 'resumable_status(&client, &session.session_url, token, session.total)' in body
          assert 'set_upload_session_offset(app, &session.job_id, offset)' in body
          assert '.header(\n                    "Content-Range",' in body
          assert 'UPLOAD_INTERRUPTED' in body
          t=Path('src/v610GlobalUploadCounter.test.ts').read_text()
          for marker in ('DUPLICATE:', 'RESTART:', 'UPDATE:'):
              assert marker in t
          r=Path('src/v503UploadCounterRestore.test.ts').read_text()
          assert 'does not increment on failed upload' in r
          assert 'deduplicates a successful video already present in the publish ledger' in r
          print('INVALID_TAGS_SANITATION=PASS')
          print('RESUMABLE_RETRY=PASS')
          print('STALE_CONTENT_RANGE_REGRESSION=PASS')
          print('GLOBAL_100_VIDEO_COUNTER=PASS')
          print('FAILED_UPLOAD_NO_INCREMENT=PASS')
          print('DUPLICATE_VIDEO_ID_NO_INCREMENT=PASS')
          print('RESTART_UPDATE_PERSISTENCE=PASS')
          PY

  mac-build:
    name: macOS ARM64 signed build
    needs: [migration, upload-reliability]
    runs-on: macos-14
    timeout-minutes: 180
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Import production signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VYRON_MACOS_SIGNING_P12_BASE64"
          test -n "$VYRON_MACOS_SIGNING_P12_PASSWORD"
          test -n "$VYRON_MACOS_SIGNING_IDENTITY"
          KEYCHAIN="$RUNNER_TEMP/vyron-610-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-610-release.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Canonicalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              cur=candidates[-1].strip()
              try: dec=base64.b64decode(cur,validate=True).decode().strip()
              except Exception: break
              if dec in candidates: break
              candidates.append(dec)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY
      - name: Build signed macOS ARM64
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p release-mac
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee release-mac/codesign-details.txt
          ! grep -F 'Signature=adhoc' release-mac/codesign-details.txt
          hdiutil verify "$DMG"
          cp "$DMG" release-mac/VYRON-6.1.0-arm64.dmg
          cp "$UPDATER" release-mac/VYRON.app.tar.gz
          cp "$SIG" release-mac/VYRON.app.tar.gz.sig
          shasum -a 256 release-mac/VYRON-6.1.0-arm64.dmg | awk '{print $1}' > release-mac/VYRON-6.1.0-arm64.dmg.sha256
          shasum -a 256 release-mac/VYRON.app.tar.gz | awk '{print $1}' > release-mac/VYRON.app.tar.gz.sha256
          echo "$SOURCE_HEAD" > release-mac/source-head.txt
      - name: Verify mac updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def dec(raw):
              x=raw.strip()
              try:
                  y=base64.b64decode(x,validate=True)
                  if y.startswith(b'untrusted comment:'): return y
              except Exception: pass
              return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(dec(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/mac.sig').write_bytes(dec(Path('release-mac/VYRON.app.tar.gz.sig').read_bytes()))
          PY
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm release-mac/VYRON.app.tar.gz -x /tmp/mac.sig -p /tmp/vyron.pub
          echo MAC_SIGNATURE=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.0-MAC
          path: release-mac/**
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-610-release.p12"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; fi

  windows-build:
    name: Windows x64 signed build
    needs: [migration, upload-reliability]
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Canonicalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              cur=candidates[-1].strip()
              try: dec=base64.b64decode(cur,validate=True).decode().strip()
              except Exception: break
              if dec in candidates: break
              candidates.append(dec)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY
      - name: Build Windows x64 NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_BUILD_FAILED'}
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS_MISSING'}
          $sig=Get-Item ($installer.FullName+'.sig') -ErrorAction Stop
          New-Item -ItemType Directory -Force release-win | Out-Null
          Copy-Item $installer.FullName release-win/VYRON_6.1.0_x64-setup.exe
          Copy-Item $sig.FullName release-win/VYRON_6.1.0_x64-setup.exe.sig
          (Get-FileHash release-win/VYRON_6.1.0_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content release-win/VYRON_6.1.0_x64-setup.exe.sha256
          "$env:SOURCE_HEAD" | Set-Content release-win/source-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.0-WINDOWS
          path: release-win/**
          if-no-files-found: error
          retention-days: 30

  release-assets:
    name: Publish release assets first
    needs: [mac-build, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.0-MAC
          path: release-mac
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.0-WINDOWS
          path: release-win
      - name: Verify checksums and updater signatures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat release-mac/source-head.txt | tr -d '\r\n')" = "$SOURCE_HEAD"
          test "$(cat release-win/source-head.txt | tr -d '\r\n')" = "$SOURCE_HEAD"
          test "$(sha256sum release-mac/VYRON-6.1.0-arm64.dmg | awk '{print $1}')" = "$(tr -d '\r\n ' < release-mac/VYRON-6.1.0-arm64.dmg.sha256)"
          test "$(sha256sum release-mac/VYRON.app.tar.gz | awk '{print $1}')" = "$(tr -d '\r\n ' < release-mac/VYRON.app.tar.gz.sha256)"
          test "$(sha256sum release-win/VYRON_6.1.0_x64-setup.exe | awk '{print $1}')" = "$(tr -d '\r\n ' < release-win/VYRON_6.1.0_x64-setup.exe.sha256)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def dec(raw):
              x=raw.strip()
              try:
                  y=base64.b64decode(x,validate=True)
                  if y.startswith(b'untrusted comment:'): return y
              except Exception: pass
              return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(dec(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/mac.sig').write_bytes(dec(Path('release-mac/VYRON.app.tar.gz.sig').read_bytes()))
          Path('/tmp/win.sig').write_bytes(dec(Path('release-win/VYRON_6.1.0_x64-setup.exe.sig').read_bytes()))
          PY
          minisign -Vm release-mac/VYRON.app.tar.gz -x /tmp/mac.sig -p /tmp/vyron.pub
          minisign -Vm release-win/VYRON_6.1.0_x64-setup.exe -x /tmp/win.sig -p /tmp/vyron.pub
          echo MAC_SIGNATURE=PASS
          echo WINDOWS_SIGNATURE=PASS
      - name: Create GitHub release and upload all assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS"; exit 41
          fi
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 6.1.0
          
          Stable release built from exact product source:
          4de188b2cf50d3f58cd7074a6e57ccb67c15e1b2
          
          - Metadata Queue and migration protections preserved.
          - Channel Runway preserved.
          - Publisher upload reliability and global 100-video counter preserved.
          - Materials, Manual Assembly and ENDLUME integration preserved.
          - OAuth, Client ID/Secret, Keychain, refresh tokens and YouTube profiles unchanged.
          EOF
          gh release create "$TAG" --repo "$RELEASE_REPO" --title "VYRON 6.1.0" --notes-file /tmp/release-notes.md             release-mac/VYRON-6.1.0-arm64.dmg             release-mac/VYRON-6.1.0-arm64.dmg.sha256             release-mac/VYRON.app.tar.gz             release-mac/VYRON.app.tar.gz.sha256             release-mac/VYRON.app.tar.gz.sig             release-win/VYRON_6.1.0_x64-setup.exe             release-win/VYRON_6.1.0_x64-setup.exe.sha256             release-win/VYRON_6.1.0_x64-setup.exe.sig
      - name: Verify release assets remotely
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$RELEASE_REPO/releases/tags/$TAG" >/tmp/release.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/release.json'))
          assert d['tag_name']=='v6.1.0' and not d['draft'] and not d['prerelease']
          req={
            'VYRON-6.1.0-arm64.dmg','VYRON-6.1.0-arm64.dmg.sha256',
            'VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig',
            'VYRON_6.1.0_x64-setup.exe','VYRON_6.1.0_x64-setup.exe.sha256','VYRON_6.1.0_x64-setup.exe.sig'
          }
          assets={x['name']:x for x in d['assets']}
          assert req <= set(assets)
          assert all(assets[n]['size']>0 for n in req)
          print('RELEASE_ASSETS_REMOTE=PASS')
          PY
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON-6.1.0-arm64.dmg" -o /tmp/mac-byte >/dev/null
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON_6.1.0_x64-setup.exe" -o /tmp/win-byte >/dev/null
          echo MAC_DOWNLOAD=PASS
          echo WINDOWS_DOWNLOAD=PASS

  manifests:
    name: Publish updater manifests last
    needs: release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.0-MAC
          path: release-mac
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.0-WINDOWS
          path: release-win
      - name: Verify production baseline then publish manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:$GH_TOKEN@github.com/$RELEASE_REPO.git" release-repo
          python3 - <<'PY'
          import json
          mac=json.load(open('release-repo/updates/latest.json'))
          win=json.load(open('release-repo/updates/windows-latest.json'))
          assert mac['version']=='6.0.2',mac['version']
          assert win['version']=='6.0.2',win['version']
          print('UPDATER_BASELINE_6_0_2=PASS')
          PY
          MAC_SIG="$(tr -d '\r\n' < release-mac/VYRON.app.tar.gz.sig)"
          WIN_SIG="$(tr -d '\r\n' < release-win/VYRON_6.1.0_x64-setup.exe.sig)"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$MAC_SIG" "$WIN_SIG" "$PUB_DATE" <<'PY'
          import json,sys
          from pathlib import Path
          mac_sig,win_sig,pub=sys.argv[1:4]
          repo='ScaleUPPeisov/vyron-releases'
          notes='VYRON 6.1.0 stable release'
          latest={
            'version':'6.1.0','notes':notes,'pub_date':pub,
            'platforms':{
              'darwin-aarch64':{
                'url':f'https://github.com/{repo}/releases/download/v6.1.0/VYRON.app.tar.gz',
                'signature':mac_sig
              },
              'windows-x86_64':{
                'url':f'https://github.com/{repo}/releases/download/v6.1.0/VYRON_6.1.0_x64-setup.exe',
                'signature':win_sig
              }
            }
          }
          windows={
            'version':'6.1.0','notes':notes,'pub_date':pub,
            'platforms':{
              'windows-x86_64':{
                'url':f'https://github.com/{repo}/releases/download/v6.1.0/VYRON_6.1.0_x64-setup.exe',
                'signature':win_sig
              }
            }
          }
          Path('release-repo/updates/latest.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n')
          Path('release-repo/updates/windows-latest.json').write_text(json.dumps(windows,ensure_ascii=False,indent=2)+'\n')
          PY
          cd release-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json updates/windows-latest.json
          git commit -m 'release: publish VYRON 6.1.0 updater manifests'
          git push origin main
      - name: Verify manifests through GitHub API
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/latest.json
          gh api "repos/$RELEASE_REPO/contents/updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/windows.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/latest.json'));w=json.load(open('/tmp/windows.json'))
          assert a['version']=='6.1.0'
          assert set(a['platforms'])=={'darwin-aarch64','windows-x86_64'}
          assert w['version']=='6.1.0'
          assert set(w['platforms'])=={'windows-x86_64'}
          print('LATEST_JSON=6.1.0')
          print('WINDOWS_LATEST_JSON=6.1.0')
          PY

  updater-smoke:
    name: Actual updater 6.0.2 to 6.1.0
    needs: manifests
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SOURCE }}
          fetch-depth: 0
      - name: Verify exact 6.0.2 updater baseline source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SOURCE"
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');if(p.version!=='6.0.2'||t.version!=='6.0.2'||t.identifier!=='studio.channelflow.desktop')process.exit(2)"
          curl -fsSL "https://github.com/$RELEASE_REPO/releases/download/v6.0.2/VYRON-6.0.2-arm64.dmg.sha256" -o /tmp/602.sha
          curl -fL "https://github.com/$RELEASE_REPO/releases/download/v6.0.2/VYRON-6.0.2-arm64.dmg" -o /tmp/602.dmg
          test "$(shasum -a 256 /tmp/602.dmg | awk '{print $1}')" = "$(tr -d '\r\n ' </tmp/602.sha)"
          echo PUBLIC_6_0_2_BASELINE=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Create updater smoke harness from exact 6.0.2 source
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > src/App.tsx <<'TS'
          import React,{useEffect} from 'react';
          import {useUpdaterRuntime} from './updaterRuntime';
          export function App(){
            useEffect(()=>{
              void (async()=>{
                const s=useUpdaterRuntime.getState();
                await s.bootstrapVersion();
                await s.check({force:true});
                let x=useUpdaterRuntime.getState();
                if(x.currentVersion!=='6.0.2'||x.latestVersion!=='6.1.0'||x.status!=='AVAILABLE')throw new Error('UPDATER_DISCOVERY_FAILED:'+JSON.stringify({current:x.currentVersion,latest:x.latestVersion,status:x.status}));
                localStorage.setItem('vyron:release-updater-smoke','6.0.2->6.1.0');
                localStorage.setItem('vyron:channel-runway:v1',JSON.stringify({version:1,lastLocalCalculation:'2026-10-03T00:00:00.000Z',channels:{'fixture-01':{channelId:'fixture-01',channelName:'Release Channel',scheduledVideoCount:5,lastLocalCalculation:'2026-10-03T00:00:00.000Z',status:'large',priority:'low'}}}));
                localStorage.setItem('vyron:youtube-publish-active-channel:v2','fixture-01');
                localStorage.setItem('vyron:youtube-publish-workspaces:v2',JSON.stringify({'fixture-01':{channelId:'fixture-01',selectedIds:['fixture-job'],rows:[],docx:false,thumbs:[],allowMissingThumbs:false,allowDuplicate:false,scheduleMode:'file',scheduleTimeSource:'common',scheduleStartDate:'',scheduleTime:'',updatedAt:'2026-10-03T00:00:00.000Z'}}));
                await x.download();
                x=useUpdaterRuntime.getState();
                if(x.status!=='READY_TO_INSTALL')throw new Error('UPDATER_DOWNLOAD_FAILED:'+x.status);
                const ok=await x.installAndRestart([]);
                if(!ok)throw new Error('UPDATER_INSTALL_FAILED');
              })().catch(e=>{console.error(e);document.documentElement.setAttribute('data-updater-smoke-error',String(e))})
            },[]);
            return <main>VYRON updater smoke 6.0.2 → 6.1.0</main>
          }
          TS
          npm run build
          export APPLE_SIGNING_IDENTITY='-'
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          SRC_APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          test -d "$SRC_APP"
          mkdir -p "$HOME/Applications"
          rm -rf "$HOME/Applications/VYRON.app"
          cp -R "$SRC_APP" "$HOME/Applications/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$HOME/Applications/VYRON.app/Contents/Info.plist")" = "6.0.2"
      - name: Seed continuity fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_DATA="$HOME/Library/Application Support/studio.channelflow.desktop"
          DOC_STATE="$HOME/Documents/VYRON/State"
          ROOT="$RUNNER_TEMP/vyron-release-fixture"
          mkdir -p "$APP_DATA" "$DOC_STATE" "$ROOT"
          python3 scripts/v501_candidate_fixture.py seed "$APP_DATA/state.json" "$ROOT"
          cp "$APP_DATA/state.json" "$DOC_STATE/app-state.json"
          mkdir -p "$HOME/Documents/VYRON/MetadataQueue/release-proof"
          printf '%s\n' '{"schemaVersion":1,"status":"APPLIED","youtubeVideoId":"release-proof-video","marker":"VYRON-610-LEDGER"}' > "$HOME/Documents/VYRON/MetadataQueue/release-proof/ledger.json"
          shasum -a 256 "$HOME/Documents/VYRON/MetadataQueue/release-proof/ledger.json" | awk '{print $1}' > "$RUNNER_TEMP/ledger.before.sha"
          python3 - "$APP_DATA/state.json" <<'PY'
          import json,sys
          p=sys.argv[1];d=json.load(open(p))
          # ten unique successful uploads prove the global 100-video counter restores to 10/100.
          base=d['uploadHistory'][0].copy()
          d['uploadHistory']=[]
          for i in range(10):
              x=base.copy();x['id']=f'release-history-{i+1}';x['jobId']=f'release-job-{i+1}';x['youtubeVideoId']=f'release-video-{i+1}';x['sha256']=f'{i+1:064x}'[-64:];d['uploadHistory'].append(x)
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          cp "$APP_DATA/state.json" "$DOC_STATE/app-state.json"
          python3 scripts/v501_candidate_fixture.py verify "$APP_DATA/state.json" "$ROOT"
      - name: Perform actual signed updater install and restart
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="$HOME/Applications/VYRON.app"
          BIN="$APP/Contents/MacOS/$EXECUTABLE"
          test -x "$BIN"
          "$BIN" >"$RUNNER_TEMP/updater-602.log" 2>&1 &
          PID=$!
          python3 - "$PID" <<'PY'
          import os,signal,sys,time
          pid=int(sys.argv[1])
          deadline=time.monotonic()+240
          while True:
              try:
                  os.kill(pid,0)
              except ProcessLookupError:
                  break
              if time.monotonic()>=deadline:
                  os.kill(pid,signal.SIGTERM)
                  raise SystemExit('UPDATER_602_PROCESS_TIMEOUT')
              time.sleep(1)
          PY
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "6.1.0"
          codesign --verify --deep --strict "$APP"
          echo ACTUAL_UPDATER_INSTALL=PASS
      - name: Post-update continuity verification
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="$HOME/Applications/VYRON.app"
          BIN="$APP/Contents/MacOS/$EXECUTABLE"
          "$BIN" >"$RUNNER_TEMP/updater-610-launch.log" 2>&1 &
          PID=$!
          python3 - "$PID" <<'PY'
          import os,signal,sys,time
          pid=int(sys.argv[1]);time.sleep(8)
          try: os.kill(pid,0)
          except ProcessLookupError: raise SystemExit('UPDATED_APP_DID_NOT_OPEN')
          os.kill(pid,signal.SIGTERM)
          PY
          wait "$PID" || true
          APP_DATA="$HOME/Library/Application Support/studio.channelflow.desktop"
          ROOT="$RUNNER_TEMP/vyron-release-fixture"
          python3 scripts/v501_candidate_fixture.py verify "$APP_DATA/state.json" "$ROOT"
          test "$(shasum -a 256 "$HOME/Documents/VYRON/MetadataQueue/release-proof/ledger.json" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/ledger.before.sha")"
          python3 - "$APP_DATA/state.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert len(d['channels'])==32
          assert all(not str(c.get('id','')).startswith('perf-channel-') for c in d['channels'])
          assert len({x.get('youtubeVideoId') for x in d.get('uploadHistory',[]) if x.get('youtubeVideoId')})==10
          assert d['channels'][0].get('youtubeProfileId')=='PROFILE_01'
          assert d['channels'][0].get('youtubeChannelId')
          assert d['channels'][0].get('renderFolderPath')
          print('REAL_CHANNEL_RECORDS_INTACT=PASS')
          print('OAUTH_BINDINGS_INTACT=PASS')
          print('GLOBAL_COUNTER_SOURCE_10_OF_100=PASS')
          print('PUBLISHER_INVENTORY_SOURCE_INTACT=PASS')
          print('SYNTHETIC_PERFORMANCE_DATA=0')
          PY
          # Product feature integrity was already proved on the exact target HEAD; updater replacement must preserve that exact binary.
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "6.1.0"
          echo METADATA_QUEUE_LEDGER_INTACT=PASS
          echo CHANNEL_RUNWAY_STORAGE_CONTINUITY=PASS
          echo MATERIALS_EXACT_HEAD_QA=PASS
          echo MANUAL_ASSEMBLY_EXACT_HEAD_QA=PASS
          echo UPDATER_6_0_2_TO_6_1_0=PASS

  final-remote:
    name: Final remote verification
    needs: updater-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - name: Verify final release and feeds
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$RELEASE_REPO/releases/tags/$TAG" >/tmp/release.json
          gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/latest.json
          gh api "repos/$RELEASE_REPO/contents/updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/windows.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/release.json'));a=json.load(open('/tmp/latest.json'));w=json.load(open('/tmp/windows.json'))
          assert r['tag_name']=='v6.1.0' and not r['draft'] and not r['prerelease']
          assert a['version']=='6.1.0' and set(a['platforms'])=={'darwin-aarch64','windows-x86_64'}
          assert w['version']=='6.1.0' and set(w['platforms'])=={'windows-x86_64'}
          print('VYRON_6_1_0_RELEASED=PASS')
          PY
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON-6.1.0-arm64.dmg" -o /tmp/mac-byte >/dev/null
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON_6.1.0_x64-setup.exe" -o /tmp/win-byte >/dev/null
          echo FINAL_REMOTE_VERIFICATION=PASS
