name: VYRON 6.1.0 YouTube Containment Candidate

on:
  push:
    branches:
      - diagnostic/youtube-wkwebview-paint-isolation

permissions:
  contents: read

env:
  VERSION: '6.1.0'
  BASE_HEAD: '4de188b2cf50d3f58cd7074a6e57ccb67c15e1b2'
  CANDIDATE_HEAD: 'becf0c3f4bc621632762f2829051d198bd6ef8dc'
  BUNDLE_ID: studio.channelflow.desktop

jobs:
  containment-candidate:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0

      - name: Verify exact production candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./src-tauri/tauri.conf.json').identifier")" = "$BUNDLE_ID"
          mapfile -t changed < <(git diff --name-only "$BASE_HEAD"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "src/YouTubeCenter.tsx"
          test "${changed[1]}" = "src/styles.css"
          git diff --exit-code "$BASE_HEAD"...HEAD -- src/M1PerformanceProbe.tsx
          git diff --exit-code "$BASE_HEAD"...HEAD --             src/ChannelRunway.tsx src/YouTubeChannelBar.tsx src/PublisherOS.tsx             src/youtubePublishSafety.ts src/MetadataTabs.tsx             src/MaterialsManager.tsx src/ProductionManager.tsx             src-tauri/src/oauth_vault.rs src-tauri/src/security.rs src-tauri/src/youtube.rs
          echo "EXACT_PRODUCTION_CANDIDATE=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Targeted YouTube frontend regressions
        run: >
          npx vitest run
          src/v610PublisherColdRoute.test.ts
          src/v610M1RoutePerformance.test.ts
          src/youtubeProductivityGlobalChannel.test.ts
          src/v300PublisherUiContracts.test.ts
          src/uiOverflowAudit.test.ts

      - name: Visual structure and portal safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'return <div className="youtubePaintBoundary">' src/YouTubeCenter.tsx
          grep -F '.youtubePaintBoundary{min-width:0;contain:layout paint}' src/styles.css
          grep -F '<CachedQuotaMeter compact active/>' src/YouTubeCenter.tsx
          grep -F '<CachedYouTubeChannelBar active/>' src/YouTubeCenter.tsx
          grep -F 'className="youtubeTabs youtubeMasterTabs"' src/YouTubeCenter.tsx
          grep -F 'className="youtubeChannelContext"' src/YouTubeCenter.tsx
          git diff --exit-code "$BASE_HEAD"...HEAD -- src/ModalPortal.tsx src/NotificationStack.tsx
          grep -F 'createPortal' src/ModalPortal.tsx
          grep -F 'position:fixed!important' src/styles.css
          ! grep -F 'will-change' <(git diff "$BASE_HEAD"...HEAD -- src/YouTubeCenter.tsx src/styles.css)
          ! grep -F 'translateZ' <(git diff "$BASE_HEAD"...HEAD -- src/YouTubeCenter.tsx src/styles.css)
          ! grep -F 'requestAnimationFrame' <(git diff "$BASE_HEAD"...HEAD -- src/YouTubeCenter.tsx src/styles.css)
          ! grep -F 'setTimeout' <(git diff "$BASE_HEAD"...HEAD -- src/YouTubeCenter.tsx src/styles.css)
          echo "VISUAL_STRUCTURE_PORTAL_SAFETY=PASS"

      - name: Build production ARM64 app
        shell: bash
        run: |
          set -Eeuo pipefail
          export APPLE_SIGNING_IDENTITY='-'
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          test -d "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          file "$APP/Contents/MacOS/channelflow" | grep -q arm64
          codesign --verify --deep --strict "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Seed local owner license
        shell: bash
        run: |
          set -Eeuo pipefail
          for ROOT in             "$HOME/Library/Application Support/studio.channelflow.desktop"             "$HOME/Library/Application Support/VYRON"             "$HOME/Library/Application Support/channelflow"
          do
            mkdir -p "$ROOT"
            cat >"$ROOT/license.json" <<'JSON'
          {
            "valid": true,
            "type": "owner-lifetime",
            "expiresAt": null,
            "maskedKey": "CI-PERF",
            "activatedAt": "2026-10-02T00:00:00Z"
          }
          JSON
          done

      - name: Run exact physical M1 gate
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/vyron-m1-performance.json"
          LOG="$RUNNER_TEMP/vyron-m1-performance.log"
          PERF_ROOT="$RUNNER_TEMP/vyron-m1-profile"
          rm -f "$REPORT"
          rm -rf "$PERF_ROOT"
          mkdir -p "$PERF_ROOT"
          VYRON_M1_PERF_PROBE=1 VYRON_M1_PERF_ROOT="$PERF_ROOT" VYRON_M1_PERF_REPORT="$REPORT"             "$APP_PATH/Contents/MacOS/channelflow" >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" >/dev/null 2>&1 || true; rm -rf "$PERF_ROOT"; }
          trap cleanup EXIT
          sleep 4
          osascript -e 'tell application "System Events" to set frontmost of first process whose name contains "VYRON" to true' >/dev/null 2>&1 || true
          for i in {1..120}; do
            test -s "$REPORT" && break
            kill -0 "$PID"
            sleep 1
          done
          test -s "$REPORT"
          cat "$REPORT"
          python3 - "$REPORT" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          a=p.get("aggregate",{})
          print("PHYSICAL_M1_PASS="+str(bool(p.get("pass"))))
          print(json.dumps(p,ensure_ascii=False))
          if not p.get("pass"):
              raise SystemExit("M1_PERFORMANCE_GATE_FAILED")
          assert a["fps"] >= 57
          assert a["p50"] <= 17.5
          assert a["p95"] <= 20.5
          assert a["p99"] <= 33.5
          assert a["dropped"] < 2
          assert a["long50"] == 0
          PY
          kill "$PID" >/dev/null 2>&1 || true
          wait "$PID" >/dev/null 2>&1 || true
          rm -rf "$PERF_ROOT"
          trap - EXIT

      - name: Preserve candidate evidence
        if: always()
        shell: bash
        run: |
          mkdir -p candidate-evidence
          cp "$RUNNER_TEMP/vyron-m1-performance.json" candidate-evidence/report.json 2>/dev/null || true
          cp "$RUNNER_TEMP/vyron-m1-performance.log" candidate-evidence/runtime.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-6.1.0-YOUTUBE-CONTAINMENT-CANDIDATE
          path: candidate-evidence/**
          if-no-files-found: warn
          retention-days: 30
