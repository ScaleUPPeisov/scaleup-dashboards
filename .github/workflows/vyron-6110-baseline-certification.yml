name: VYRON 6.1.10 Released 6.1.9 Baseline Certification

on:
  push:
    branches:
      - qa/vyron-6.1.10-full-system-certification
    paths:
      - '.github/workflows/vyron-6110-baseline-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-6110-baseline-certification
  cancel-in-progress: true

env:
  SOURCE_HEAD: 588e2070877512daa637077223c678af6a216831
  VERSION: '6.1.9'
  BUNDLE_ID: studio.channelflow.desktop

jobs:
  released-baseline:
    name: macOS released 6.1.9 baseline
    runs-on: macos-14
    timeout-minutes: 180
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - name: Verify exact released source and versions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
          node - <<'NODE'
          const fs=require('fs');
          const p=require('./package.json');
          const l=require('./package-lock.json');
          const t=require('./src-tauri/tauri.conf.json');
          if (p.version!=='6.1.9' || l.version!=='6.1.9' || l.packages?.['']?.version!=='6.1.9' || t.version!=='6.1.9') process.exit(2);
          const cargo=fs.readFileSync('./src-tauri/Cargo.toml','utf8');
          if (!/^version\s*=\s*"6\.1\.9"/m.test(cargo)) process.exit(3);
          console.log('EXACT_RELEASED_619_SOURCE=PASS');
          NODE

      - name: Build complete QA inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qa-evidence
          {
            echo "SOURCE_HEAD=$SOURCE_HEAD"
            echo "VERSION=$VERSION"
            echo "FRONTEND_TEST_FILES"
            find src tests -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.test.mjs' -o -name '*.spec.mjs' \) 2>/dev/null | sort
            echo "FRONTEND_TEST_FILE_COUNT=$(find src tests -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.test.mjs' -o -name '*.spec.mjs' \) 2>/dev/null | wc -l | tr -d ' ')"
            echo "RUST_TEST_ANNOTATION_COUNT=$(grep -R --include='*.rs' -h '#\[test\]' src-tauri/src 2>/dev/null | wc -l | tr -d ' ')"
            echo "WORKFLOW_COUNT=$(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          } | tee qa-evidence/test-inventory.txt
          python3 - <<'PY' | tee qa-evidence/control-map.txt
          from pathlib import Path
          import re
          roots=[Path('src')]
          files=[p for r in roots for p in r.rglob('*') if p.suffix in {'.tsx','.ts'}]
          button=[]; handlers=[]; storage=[]; timers=[]
          for p in files:
              s=p.read_text(errors='ignore')
              for m in re.finditer(r'<button\b[^>]*>',s,re.I|re.S): button.append((str(p),s[:m.start()].count('\n')+1,re.sub(r'\s+',' ',m.group(0))[:220]))
              for m in re.finditer(r'\bon(?:Click|Change|Submit|KeyDown|PointerDown)\s*=',s): handlers.append((str(p),s[:m.start()].count('\n')+1,m.group(0)))
              for m in re.finditer(r'localStorage\.(?:getItem|setItem|removeItem)\(\s*[`\'\"]([^`\'\"]+)',s): storage.append((str(p),m.group(1)))
              for m in re.finditer(r'\b(?:setInterval|setTimeout)\s*\(',s): timers.append((str(p),s[:m.start()].count('\n')+1))
          print(f'TSX_TS_FILES={len(files)}')
          print(f'BUTTON_TAGS={len(button)}')
          print(f'EVENT_HANDLER_BINDINGS={len(handlers)}')
          print(f'LOCAL_STORAGE_LITERAL_REFS={len(storage)}')
          print(f'TIMER_CALLS={len(timers)}')
          print('\nBUTTONS')
          for row in button: print('\t'.join(map(str,row)))
          print('\nLOCAL_STORAGE')
          for row in sorted(set(storage)): print('\t'.join(row))
          print('\nTIMERS')
          for row in timers: print('\t'.join(map(str,row)))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clean npm install
        run: npm ci --no-audit --no-fund

      - name: Install CI-only React renderer
        run: npm install --no-save --no-package-lock react-test-renderer@19.1.1

      - name: Run every frontend test
        id: all_frontend
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --reporter=verbose 2>&1 | tee qa-evidence/all-frontend-tests.log

      - name: Publisher protected pack 1 of 3
        id: publisher1
        continue-on-error: true
        run: >
          npx vitest run
          src/vyron618PublisherIntegrity.test.ts
          src/publisherMetadata.test.ts
          src/uploadQueue.test.ts
          src/v610PublisherColdRoute.test.ts
          src/v610PublisherInventoryReconcile.test.ts
          src/v614PublisherPhysicalInventoryHotfix.test.ts
          src/vyron615PublisherHotfix.test.ts
          src/vyron616PhysicalPublisherConsistency.test.ts
          src/vyron617CurrentGenerationLeafRecovery.test.ts
          src/scheduleContinuation.test.ts
          src/vyron619PublisherAlwaysOpen.test.tsx
          src/vyron619ScheduleSources.test.ts

      - name: Publisher protected pack 2 of 3
        id: publisher2
        continue-on-error: true
        run: >
          npx vitest run
          src/vyron618PublisherIntegrity.test.ts
          src/publisherMetadata.test.ts
          src/uploadQueue.test.ts
          src/v610PublisherColdRoute.test.ts
          src/v610PublisherInventoryReconcile.test.ts
          src/v614PublisherPhysicalInventoryHotfix.test.ts
          src/vyron615PublisherHotfix.test.ts
          src/vyron616PhysicalPublisherConsistency.test.ts
          src/vyron617CurrentGenerationLeafRecovery.test.ts
          src/scheduleContinuation.test.ts
          src/vyron619PublisherAlwaysOpen.test.tsx
          src/vyron619ScheduleSources.test.ts

      - name: Publisher protected pack 3 of 3
        id: publisher3
        continue-on-error: true
        run: >
          npx vitest run
          src/vyron618PublisherIntegrity.test.ts
          src/publisherMetadata.test.ts
          src/uploadQueue.test.ts
          src/v610PublisherColdRoute.test.ts
          src/v610PublisherInventoryReconcile.test.ts
          src/v614PublisherPhysicalInventoryHotfix.test.ts
          src/vyron615PublisherHotfix.test.ts
          src/vyron616PhysicalPublisherConsistency.test.ts
          src/vyron617CurrentGenerationLeafRecovery.test.ts
          src/scheduleContinuation.test.ts
          src/vyron619PublisherAlwaysOpen.test.tsx
          src/vyron619ScheduleSources.test.ts

      - name: TypeScript production build
        id: frontend_build
        continue-on-error: true
        run: npm run build

      - name: Rust library QA
        id: rust_test
        continue-on-error: true
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture 2>&1 | tee qa-evidence/rust-test.log

      - name: Cargo check
        id: cargo_check
        continue-on-error: true
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee qa-evidence/cargo-check.log

      - name: Cargo fmt check
        id: cargo_fmt
        continue-on-error: true
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | tee qa-evidence/cargo-fmt.log

      - name: Cargo clippy
        id: cargo_clippy
        continue-on-error: true
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features 2>&1 | tee qa-evidence/cargo-clippy.log

      - name: Privacy tracked-files gate
        id: privacy
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee qa-evidence/privacy.log
          import pathlib,re,subprocess
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          banned=[r'(^|/)credentials\.json$',r'(^|/)credentials-[^/]*\.json$',r'(^|/)client_secret[^/]*\.json$',r'(^|/)google-credentials[^/]*\.json$',r'(^|/)oauth-tokens?[^/]*\.json$',r'(^|/)tokens\.json$',r'(^|/)keychain-export',r'(^|/)credential-export',r'\.sqlite3?$',r'\.db$',r'\.db-wal$',r'\.db-shm$',r'\.vyron$',r'\.vyron-migration$',r'(^|/)vyron-migration-',r'(^|/)migration-backup',r'(^|/)migration-export',r'(^|/)account-export',r'(^|/)channel-export']
          for f in files:
              if any(re.search(p,f,re.I) for p in banned): raise SystemExit('SENSITIVE_TRACKED_FILE:'+f)
          patterns=[re.compile(rb'ya29\.[A-Za-z0-9._~-]{20,}'),re.compile(rb'1//[A-Za-z0-9._~-]{20,}'),re.compile(rb'GOCSPX-[A-Za-z0-9_-]{20,}'),re.compile(rb'AIza[0-9A-Za-z_-]{20,}'),re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')]
          for f in files:
              p=pathlib.Path(f)
              try:data=p.read_bytes()
              except Exception:continue
              if any(rx.search(data) for rx in patterns): raise SystemExit('HIGH_CONFIDENCE_SECRET:'+f)
          print('PRIVACY_TRACKED_FILES_AND_SECRET_SCAN=PASS')
          PY

      - name: Import signing identity
        id: signing_identity
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VYRON_MACOS_SIGNING_P12_BASE64"
          test -n "$VYRON_MACOS_SIGNING_P12_PASSWORD"
          test -n "$VYRON_MACOS_SIGNING_IDENTITY"
          KEYCHAIN="$RUNNER_TEMP/vyron-6110-baseline.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-6110-baseline.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Normalize updater signing key
        id: updater_key
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW"
          python3 - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              current=candidates[-1].strip()
              try: decoded=base64.b64decode(current,validate=True).decode('utf-8').strip()
              except Exception: break
              if decoded in candidates: break
              candidates.append(decoded)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as fp: fp.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY

      - name: Build signed released 6.1.9 packaged app
        id: package_app
        continue-on-error: true
        if: steps.signing_identity.outcome == 'success' && steps.updater_key.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          test -d "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "PACKAGE_APP=PASS" | tee qa-evidence/package.log

      - name: Packaged app launch smoke
        id: launch_smoke
        continue-on-error: true
        if: steps.package_app.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          BIN="$APP_PATH/Contents/MacOS/channelflow"
          test -x "$BIN"
          "$BIN" >"$RUNNER_TEMP/vyron6110-baseline-smoke.log" 2>&1 &
          PID=$!
          sleep 10
          kill -0 "$PID"
          kill "$PID" || true
          wait "$PID" || true
          ! grep -Eiq 'panic|fatal error|segmentation fault' "$RUNNER_TEMP/vyron6110-baseline-smoke.log"
          cp "$RUNNER_TEMP/vyron6110-baseline-smoke.log" qa-evidence/package-launch.log
          echo PACKAGED_APP_LAUNCH_SMOKE=PASS

      - name: Baseline result matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > qa-evidence/result-matrix.txt <<EOF
          SOURCE_HEAD=$SOURCE_HEAD
          FRONTEND_ALL=${{ steps.all_frontend.outcome }}
          PUBLISHER_1=${{ steps.publisher1.outcome }}
          PUBLISHER_2=${{ steps.publisher2.outcome }}
          PUBLISHER_3=${{ steps.publisher3.outcome }}
          TYPESCRIPT_BUILD=${{ steps.frontend_build.outcome }}
          RUST_TEST=${{ steps.rust_test.outcome }}
          CARGO_CHECK=${{ steps.cargo_check.outcome }}
          CARGO_FMT=${{ steps.cargo_fmt.outcome }}
          CARGO_CLIPPY=${{ steps.cargo_clippy.outcome }}
          PRIVACY=${{ steps.privacy.outcome }}
          SIGNING_IDENTITY=${{ steps.signing_identity.outcome }}
          UPDATER_KEY=${{ steps.updater_key.outcome }}
          PACKAGE_APP=${{ steps.package_app.outcome }}
          PACKAGED_LAUNCH=${{ steps.launch_smoke.outcome }}
          EOF
          cat qa-evidence/result-matrix.txt
          test "${{ steps.all_frontend.outcome }}" = success
          test "${{ steps.publisher1.outcome }}" = success
          test "${{ steps.publisher2.outcome }}" = success
          test "${{ steps.publisher3.outcome }}" = success
          test "${{ steps.frontend_build.outcome }}" = success
          test "${{ steps.rust_test.outcome }}" = success
          test "${{ steps.privacy.outcome }}" = success
          test "${{ steps.package_app.outcome }}" = success
          test "${{ steps.launch_smoke.outcome }}" = success

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-6.1.9-RELEASED-BASELINE-EVIDENCE
          path: qa-evidence/**
          if-no-files-found: error
          retention-days: 30
