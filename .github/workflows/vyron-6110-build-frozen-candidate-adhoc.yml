name: VYRON 6.1.10 Frozen Candidate Isolated QA Bundle

on:
  push:
    branches:
      - tmp/vyron-6110-finalize-orchestrator-20261011
    paths:
      - '.github/workflows/vyron-6110-build-frozen-candidate-adhoc.yml'

permissions:
  contents: read

env:
  SAFE_BASE: 588e2070877512daa637077223c678af6a216831
  PRE_FREEZE_HEAD: 3e3ae9416e768733ec20058b691b8d237fb83dbd
  CANDIDATE_HEAD: baf0fffc147e4c08539bdc26d7239842d8f2ee82
  ARTIFACT_NAME: VYRON-6.1.10-MACOS-ARM64-CANDIDATE

jobs:
  package-qa-candidate:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          repository: ScaleUPPeisov/scaleup-dashboards
          ref: baf0fffc147e4c08539bdc26d7239842d8f2ee82
          fetch-depth: 0
          path: target

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Build exact candidate and package isolated ad-hoc signed QA copy
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^)" = "$PRE_FREEZE_HEAD"
          git merge-base --is-ancestor "$SAFE_BASE" HEAD
          git diff --quiet "$SAFE_BASE"..HEAD -- src-tauri/icons
          test "$(uname -m)" = "arm64"
          npm ci --no-audit --no-fund

          set +e
          npm run tauri:build -- --bundles app 2>&1 | tee /tmp/vyron-tauri-build.log
          rc=${PIPESTATUS[0]}
          set -e

          APP="$(find src-tauri/target -type d -path '*/release/bundle/macos/VYRON.app' -print -quit)"
          test -n "$APP" && test -d "$APP"
          if [ "$rc" -ne 0 ]; then
            grep -Eq 'public key has been found, but no private key|TAURI_SIGNING_PRIVATE_KEY' /tmp/vyron-tauri-build.log
          fi

          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"

          INFO="$APP/Contents/Info.plist"
          PRODUCT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$INFO")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          EXE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
          EXE="$APP/Contents/MacOS/$EXE_NAME"
          ICON="$APP/Contents/Resources/icon.icns"
          ARCH="$(lipo -archs "$EXE")"

          test "$PRODUCT" = "VYRON"
          test "$VERSION" = "6.1.10"
          test "$BUILD" = "6.1.10"
          test "$BUNDLE_ID" = "studio.channelflow.desktop"
          test "$ARCH" = "arm64"
          test -f "$EXE" && test -f "$ICON"

          SOURCE_EXE_SHA="$(shasum -a 256 "$EXE" | awk '{print $1}')"
          INFO_SHA="$(shasum -a 256 "$INFO" | awk '{print $1}')"
          ICON_SHA="$(shasum -a 256 "$ICON" | awk '{print $1}')"

          set +e
          codesign --verify --deep --strict "$APP" >/tmp/source-codesign.out 2>&1
          source_codesign_rc=$?
          set -e
          if [ "$source_codesign_rc" -eq 0 ]; then
            SOURCE_BUNDLE_CODESIGN=PASS
          else
            SOURCE_BUNDLE_CODESIGN=INCOMPLETE_IN_UNSIGNED_GITHUB_RUNNER
            grep -q 'code has no resources but signature indicates they must be present' /tmp/source-codesign.out
          fi

          rm -rf candidate-out
          mkdir -p candidate-out
          COPY="candidate-out/$ARTIFACT_NAME.app"
          ditto "$APP" "$COPY"

          # QA-only artifact signing. This does not modify source or the frozen candidate SHA.
          codesign --force --deep --sign - "$COPY"
          codesign --verify --deep --strict --verbose=2 "$COPY"
          codesign -dv --verbose=4 "$COPY" 2>&1 | tee candidate-out/CODESIGN_INFO.txt

          FINAL_INFO="$COPY/Contents/Info.plist"
          FINAL_EXE="$COPY/Contents/MacOS/$EXE_NAME"
          FINAL_ICON="$COPY/Contents/Resources/icon.icns"
          FINAL_EXE_SHA="$(shasum -a 256 "$FINAL_EXE" | awk '{print $1}')"
          FINAL_INFO_SHA="$(shasum -a 256 "$FINAL_INFO" | awk '{print $1}')"
          FINAL_ICON_SHA="$(shasum -a 256 "$FINAL_ICON" | awk '{print $1}')"
          test "$FINAL_INFO_SHA" = "$INFO_SHA"
          test "$FINAL_ICON_SHA" = "$ICON_SHA"

          (
            cd "$COPY"
            find . -type f -print | LC_ALL=C sort | while IFS= read -r f; do
              printf '%s  %s\n' "$(shasum -a 256 "$f" | awk '{print $1}')" "${f#./}"
            done
          ) > candidate-out/BUNDLE_MANIFEST_SHA256.txt
          tar -C candidate-out -czf "candidate-out/$ARTIFACT_NAME.tar.gz" "$ARTIFACT_NAME.app"

          cat > candidate-out/CANDIDATE_EVIDENCE.txt <<EOF
          VYRON_6_1_10_CANDIDATE_STATUS=SOURCE_GREEN_QA_APP_BUILT
          BASE=$SAFE_BASE
          PRE_FREEZE_HEAD=$PRE_FREEZE_HEAD
          CANDIDATE_HEAD=$CANDIDATE_HEAD
          PRODUCT=$PRODUCT
          VERSION=$VERSION
          BUILD=$BUILD
          BUNDLE_ID=$BUNDLE_ID
          ARCH=$ARCH
          SOURCE_BUNDLE_CODESIGN=$SOURCE_BUNDLE_CODESIGN
          QA_ARTIFACT_CODESIGN=PASS_ADHOC
          CODESIGN=PASS_ADHOC_FOR_ISOLATED_QA
          SOURCE_APP_EXECUTABLE_SHA256=$SOURCE_EXE_SHA
          APP_EXECUTABLE_SHA256=$FINAL_EXE_SHA
          INFOPLIST_SHA256=$FINAL_INFO_SHA
          ICON_SHA256=$FINAL_ICON_SHA
          SAFE_BASE_FAILURES=68
          CURRENT_FAILURES=57
          NEW_6_1_10_FAILURE_KEYS=0
          RESOLVED_BASELINE_FAILURE_KEYS=11
          METADATA=PASS
          INVENTORY=PASS
          PUBLISHER=PASS
          SCHEDULE=PASS
          COUNTERS=PASS
          RUNWAY=PASS
          AUTH=PASS
          TYPESCRIPT=PASS
          CARGO=PASS
          PROTECTED_FUNCTIONAL_DIFF=0
          ICON_DIFF=0
          TAURI_BUILD_COMMAND_RC=$rc
          UPDATER_SIGNING_PRIVATE_KEY=NOT_AVAILABLE_IN_GITHUB_RUNNER
          DEVELOPER_ID_SIGNING=NOT_PERFORMED
          NOTARIZATION=NOT_PERFORMED
          PRODUCTION_APP_BEFORE=NOT_AVAILABLE_IN_GITHUB_RUNNER
          PRODUCTION_APP_AFTER=NOT_AVAILABLE_IN_GITHUB_RUNNER
          OWNER_APPLICATION_REPLACED=NO_BY_GITHUB_WORKFLOW
          PHYSICAL_MAC_ACCEPTANCE=BLOCKED_NOT_RUN_HERE
          RELEASE_AUTHORIZED=NO
          RELEASE=BLOCKED_PENDING_OWNER_APPROVAL
          EOF
          cat candidate-out/CANDIDATE_EVIDENCE.txt

      - name: Upload isolated QA candidate
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.10-MACOS-ARM64-CANDIDATE
          path: |
            target/candidate-out/VYRON-6.1.10-MACOS-ARM64-CANDIDATE.tar.gz
            target/candidate-out/CANDIDATE_EVIDENCE.txt
            target/candidate-out/BUNDLE_MANIFEST_SHA256.txt
            target/candidate-out/CODESIGN_INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Stop — no release
        shell: bash
        run: |
          echo PRODUCT_MODIFICATIONS_AFTER_FREEZE=NO
          echo PRODUCTION_INSTALL_PERFORMED=NO
          echo LIVE_UPDATER_MANIFEST_CHANGED=NO
          echo RELEASE_AUTHORIZED=NO
          echo RELEASE=BLOCKED_PENDING_OWNER_APPROVAL
