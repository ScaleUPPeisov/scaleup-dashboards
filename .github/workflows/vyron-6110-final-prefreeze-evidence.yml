name: VYRON 6.1.10 Final Pre-Freeze Evidence

on:
  push:
    branches:
      - hotfix/vyron-6.1.10-product-correctness
    paths:
      - '.github/workflows/vyron-6110-final-prefreeze-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SAFE_BASE: 588e2070877512daa637077223c678af6a216831
  BRANCH: hotfix/vyron-6.1.10-product-correctness

jobs:
  evidence:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/vyron-6.1.10-product-correctness
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$SAFE_BASE" HEAD
          test "$(node -p "require('./package.json').version")" = "6.1.9"
          git diff --quiet "$SAFE_BASE"..HEAD -- src-tauri/icons
          echo PRODUCT_CODE_MODIFIED_BY_THIS_GATE=NO
          echo PRODUCT_ICON_DIFF=0
          echo VERSION_FINALIZED=NO
          echo CANDIDATE_HEAD=NOT_CREATED
          echo CANDIDATE_APP=NOT_BUILT
          echo RELEASE=BLOCKED

      - run: npm ci --no-audit --no-fund

      - name: Metadata critical matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run src/vyron6110MetadataPatch.test.ts src/vyron6110MetadataScheduleOptIn.test.ts
          echo METADATA_CRITICAL_MATRIX=PASS

      - name: Inventory critical matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run \
            src/vyron6110InventoryStatusContract.test.ts \
            src/v612NativeInventoryTruth.test.ts \
            src/v612NativeInventoryStress.test.ts \
            src/schedulePhysicalRegression.test.ts \
            src/v2115ScheduleSyncHotfix.test.ts \
            src/youtubeInventoryRc4.test.ts
          echo INVENTORY_CRITICAL_MATRIX=PASS

      - name: Publisher critical matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run src/vyron618PublisherIntegrity.test.ts src/vyron617CurrentGenerationLeafRecovery.test.ts
          echo PUBLISHER_CRITICAL_MATRIX=PASS

      - name: Schedule critical matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run \
            src/channelSchedule.test.ts \
            src/v610MetadataQueue.test.ts \
            src/schedulePhysicalRegression.test.ts \
            src/vyron6110MetadataPatch.test.ts \
            src/vyron6110MetadataScheduleOptIn.test.ts
          echo SCHEDULE_CRITICAL_MATRIX=PASS

      - name: Counters and runway critical matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run src/v610GlobalUploadCounter.test.ts src/channelRunway.test.ts
          echo COUNTERS_CRITICAL_MATRIX=PASS
          echo RUNWAY_CRITICAL_MATRIX=PASS

      - name: Auth critical matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest run src/v2115Rc7OauthUpdateContinuity.test.ts
          echo AUTH_CRITICAL_MATRIX=PASS

      - name: TypeScript and Rust guards
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build
          (cd src-tauri && cargo check)
          echo TYPESCRIPT=PASS
          echo CARGO=PASS

      - name: Protected functional diff
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import difflib
          import os
          import re
          import subprocess
          from pathlib import Path

          base = os.environ["SAFE_BASE"]

          def at(ref, path):
              return subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)

          def current(path):
              return Path(path).read_text()

          exact_files = [
              "src/youtubePublishSafety.ts",
              "src/uploadQueue.ts",
              "src/UploadProcessingMonitor.ts",
              "src/publisherIntegrity.ts",
              "src-tauri/src/security.rs",
              "src-tauri/tauri.conf.json",
          ]
          for path in exact_files:
              before, after = at(base, path), current(path)
              if before != after:
                  print(f"UNEXPECTED_PROTECTED_FILE_DIFF={path}")
                  print("".join(difflib.unified_diff(
                      before.splitlines(True), after.splitlines(True),
                      fromfile=f"{base}:{path}", tofile=f"HEAD:{path}"
                  )))
                  raise SystemExit(1)

          def normalize_api(text):
              text = re.sub(
                  r"^export type YoutubeExistingMutationPatch=.*\n",
                  "",
                  text,
                  flags=re.M,
              )
              lines = text.splitlines(True)
              out = []
              seen = 0
              for line in lines:
                  if "youtubeUpdateExisting:" in line:
                      out.append("  youtubeUpdateExisting: <ALLOWED_METADATA_UPDATE_EXISTING>,\n")
                      seen += 1
                  else:
                      out.append(line)
              if seen != 1:
                  raise SystemExit(f"api.ts youtubeUpdateExisting occurrences={seen}, expected=1")
              return "".join(out)

          api_before, api_after = at(base, "src/api.ts"), current("src/api.ts")
          if normalize_api(api_before) != normalize_api(api_after):
              print("UNEXPECTED_PROTECTED_DIFF=src/api.ts outside metadata-only allowlist")
              print("".join(difflib.unified_diff(
                  normalize_api(api_before).splitlines(True),
                  normalize_api(api_after).splitlines(True),
                  fromfile=f"{base}:src/api.ts(normalized)",
                  tofile="HEAD:src/api.ts(normalized)",
              )))
              raise SystemExit(1)

          def remove_rust_fn(text, fn_name):
              m = re.search(
                  rf"(?m)^(?:#\[[^\n]+\]\n)*\s*(?:pub\s+)?(?:async\s+)?fn\s+{re.escape(fn_name)}\b",
                  text,
              )
              if not m:
                  raise SystemExit(f"Rust function not found: {fn_name}")
              start = m.start()
              brace = text.find("{", m.end())
              if brace < 0:
                  raise SystemExit(f"Opening brace not found: {fn_name}")
              depth = 0
              i = brace
              in_str = False
              escape = False
              while i < len(text):
                  ch = text[i]
                  if in_str:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_str = False
                  else:
                      if ch == '"':
                          in_str = True
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(text) and text[end] in "\r\n":
                                  end += 1
                              return text[:start] + f"<ALLOWED_METADATA_FN:{fn_name}>\n" + text[end:]
                  i += 1
              raise SystemExit(f"Closing brace not found: {fn_name}")

          rust_before = at(base, "src-tauri/src/youtube.rs")
          rust_after = current("src-tauri/src/youtube.rs")
          normalized_before = remove_rust_fn(rust_before, "youtube_update_existing_video")
          normalized_after = remove_rust_fn(rust_after, "youtube_update_existing_video")
          if normalized_before != normalized_after:
              print("UNEXPECTED_PROTECTED_DIFF=src-tauri/src/youtube.rs outside metadata-only function")
              print("".join(difflib.unified_diff(
                  normalized_before.splitlines(True),
                  normalized_after.splitlines(True),
                  fromfile=f"{base}:src-tauri/src/youtube.rs(normalized)",
                  tofile="HEAD:src-tauri/src/youtube.rs(normalized)",
              )))
              raise SystemExit(1)

          Path("VYRON_PROTECTED_FUNCTIONAL_DIFF_6_1_10.md").write_text(
          f"""# VYRON 6.1.10 — Protected Functional Diff

          SAFE_BASE: `{base}`
          CURRENT_HEAD: `{subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()}`

          Function-aware comparison was performed against SAFE_BASE.

          Allowed 6.1.10 metadata-only differences in shared files:
          - `src/api.ts`: `YoutubeExistingMutationPatch`
          - `src/api.ts`: `api.youtubeUpdateExisting`
          - `src-tauri/src/youtube.rs`: `youtube_update_existing_video`

          Everything outside those metadata-only symbols is required to match SAFE_BASE exactly.

          | Protected subsystem | Functional change |
          |---|---|
          | OAuth transport | NO |
          | refresh-token storage | NO |
          | native OAuth vault | NO |
          | Google credential handling | NO |
          | resumable YouTube upload transport | NO |
          | account mapping | NO |
          | channel identity mapping | NO |
          | Publisher transport | NO |
          | upload success fingerprints | NO |
          | upload completion identity | NO |
          | Global Counter persistence | NO |
          | Today Counter persistence | NO |

          PROTECTED_FUNCTIONAL_DIFF=0
          """)
          print("PROTECTED_FUNCTIONAL_DIFF=0")
          PY

      - name: Recompute exact baseline failure keys and document debt
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/vyron-safe
          git worktree add --detach /tmp/vyron-safe "$SAFE_BASE"
          (cd /tmp/vyron-safe && npm ci --no-audit --no-fund >/dev/null && npx vitest run --reporter=json --outputFile=/tmp/safe.json >/dev/null 2>&1 || true)
          (npx vitest run --reporter=json --outputFile=/tmp/current.json >/dev/null 2>&1 || true)
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          SAFE='588e2070877512daa637077223c678af6a216831'

          def rows(path):
              data=json.loads(Path(path).read_text())
              out=[]
              for f in data.get('testResults',[]):
                  file=f.get('name','')
                  for a in f.get('assertionResults',[]):
                      if a.get('status')=='failed':
                          name=' > '.join([*(a.get('ancestorTitles') or []),a.get('title','')])
                          msg=' '.join(a.get('failureMessages') or [])
                          msg=re.sub(r'\x1b\[[0-9;]*m','',msg).replace('\n',' ')
                          out.append((file,name,msg[:500]))
              return out

          safe=rows('/tmp/safe.json')
          cur=rows('/tmp/current.json')
          sk={(f,n) for f,n,_ in safe}
          ck={(f,n) for f,n,_ in cur}
          new=ck-sk
          resolved=sk-ck

          if len(safe)!=68 or len(cur)!=57 or len(new)!=0 or len(resolved)!=11:
              raise SystemExit(
                  f'baseline mismatch safe={len(safe)} current={len(cur)} '
                  f'new={len(new)} resolved={len(resolved)}'
              )

          def classify(file,name,msg):
              t=(file+' '+name+' '+msg).lower()
              if re.search(r'\b6\.1\.[0-9]+\b|version literal|version should|package version',t):
                  return 'LEGACY_VERSION_LITERAL'
              if 'localstorage' in t or 'local storage' in t:
                  return 'LEGACY_LOCALSTORAGE_HARNESS'
              if any(x in t for x in ['native inventory','architecture','cache storage','storage architecture']):
                  return 'LEGACY_ARCHITECTURE_EXPECTATION'
              if any(x in t for x in ['transform','mock','fixture','test harness','cannot find module','syntaxerror']):
                  return 'PREEXISTING_QA_DEFECT'
              return 'PREEXISTING_PRODUCT_DEFECT'

          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          lines=[
              '# VYRON BASELINE QA DEBT — 6.1.9','',
              f'SAFE_BASE: `{SAFE}`',
              f'CURRENT_HEAD: `{head}`','',
              '- SAFE_BASE_FAILURES: 68',
              '- CURRENT_FAILURES: 57',
              '- NEW_6_1_10_FAILURE_KEYS: 0',
              '- RESOLVED_BASELINE_FAILURE_KEYS: 11',
              '- CURRENT_6_1_10_REGRESSION: 0',
              '- UNKNOWN: 0','',
              '> Every record below is an exact file + test-name key that also failed on SAFE_BASE. It is historical debt, not a new 6.1.10 regression.',''
          ]

          for i,(f,n,m) in enumerate(sorted(cur),1):
              cat=classify(f,n,m)
              feature=Path(f).name.replace('.test.ts','').replace('.test.tsx','')
              root=m or 'Pre-existing assertion failure reproduced by exact test key on SAFE_BASE and current HEAD.'
              lines += [
                  f'## QA-{i:03d}','',
                  f'- ID: QA-{i:03d}',
                  f'- TEST FILE: `{f}`',
                  f'- TEST NAME: `{n}`',
                  '- SAFE BASE RESULT: FAIL',
                  '- CURRENT RESULT: FAIL',
                  f'- CATEGORY: {cat}',
                  f'- ROOT CAUSE: {root}',
                  f'- FEATURE AREA: {feature}',
                  '- 6.1.10 INTRODUCED?: NO',
                  '- BLOCKS 6.1.10?: NO',
                  '- RATIONALE: Exact failure key exists on immutable SAFE_BASE and current HEAD; no new 6.1.10 failure key was introduced. Critical contracts are gated separately.',
                  ''
              ]

          lines += [
              '## Summary','',
              '- TOTAL: 57',
              '- CURRENT_6_1_10_REGRESSION: 0',
              '- UNKNOWN: 0',
              '- BLOCKING_6_1_10: 0',''
          ]
          Path('VYRON_BASELINE_QA_DEBT_6_1_9.md').write_text('\n'.join(lines))
          print('SAFE_BASE_FAILURES=68')
          print('CURRENT_FAILURES=57')
          print('NEW_6_1_10_FAILURE_KEYS=0')
          print('RESOLVED_BASELINE_FAILURE_KEYS=11')
          print('UNKNOWN=0')
          PY
          test "$(grep -c '^## QA-' VYRON_BASELINE_QA_DEBT_6_1_9.md)" = 57
          ! grep -q 'CATEGORY: UNKNOWN' VYRON_BASELINE_QA_DEBT_6_1_9.md
          echo BASELINE_QA_DEBT_DOCUMENTED=YES
          echo BASELINE_QA_DEBT_COUNT=57

      - name: Record owner icon decision and pre-freeze report
        shell: bash
        run: |
          set -Eeuo pipefail
          head="$(git rev-parse HEAD)"
          git diff --quiet "$SAFE_BASE"..HEAD -- src-tauri/icons

          cat > VYRON_OWNER_ICON_DECISION_6_1_10.md <<EOF
          # VYRON 6.1.10 — Owner Icon Decision

          OWNER_DECISION_DATE: 2026-10-11
          OWNER_ICON_DECISION: KEEP_CURRENT_ICON
          ICON_REVIEW_PACKAGE: SKIPPED_BY_OWNER
          PRODUCT_ICON_DIFF: 0
          OWNER_SELECTION_REQUIRED: NO
          OWNER_SELECTED_ICON: KEEP_CURRENT
          ICON_RESTORED: NO
          ICON_ASSETS_MODIFIED: NO
          HISTORICAL_CANDIDATE_19_RECONSTRUCTED: NO

          Historical candidate evidence remains untouched. No icon candidate is selected, restored, redesigned, enhanced, or reconstructed.
          EOF

          cat > VYRON_PRE_FREEZE_EVIDENCE_6_1_10.md <<EOF
          # VYRON 6.1.10 — Final Pre-Freeze Evidence

          PRE_FREEZE_STATUS: PASS
          SAFE_BASE: \`$SAFE_BASE\`
          CURRENT_HEAD: \`$head\`

          ## Baseline regression
          SAFE_BASE_FAILURES: 68
          CURRENT_FAILURES: 57
          NEW_6_1_10_FAILURES: 0
          RESOLVED_BASELINE: 11
          UNKNOWN: 0

          ## Critical matrix
          METADATA: PASS
          INVENTORY: PASS
          PUBLISHER: PASS
          SCHEDULE: PASS
          COUNTERS: PASS
          RUNWAY: PASS
          AUTH: PASS

          ## Protected functional diff
          PROTECTED_FUNCTIONAL_DIFF: 0
          OAUTH_TRANSPORT: UNCHANGED
          REFRESH_TOKEN_STORAGE: UNCHANGED
          OAUTH_VAULT: UNCHANGED
          GOOGLE_CREDENTIAL_HANDLING: UNCHANGED
          RESUMABLE_UPLOAD: UNCHANGED
          ACCOUNT_MAPPING: UNCHANGED
          CHANNEL_IDENTITY_MAPPING: UNCHANGED
          PUBLISHER_TRANSPORT: UNCHANGED
          SUCCESS_FINGERPRINTS: UNCHANGED
          UPLOAD_COMPLETION_IDENTITY: UNCHANGED
          GLOBAL_COUNTER_PERSISTENCE: UNCHANGED
          TODAY_COUNTER_PERSISTENCE: UNCHANGED

          ## Baseline QA debt
          DOCUMENTED: YES
          TOTAL: 57
          UNKNOWN: 0
          BLOCKING_6_1_10: 0

          ## Owner icon decision
          OWNER_ICON_DECISION: KEEP_CURRENT_ICON
          ICON_REVIEW_PACKAGE: SKIPPED_BY_OWNER
          PRODUCT_ICON_DIFF: 0
          OWNER_SELECTION_REQUIRED: NO
          OWNER_SELECTED_ICON: KEEP_CURRENT
          ICON_RESTORED: NO
          ICON_GATE: PASS_OWNER_WAIVER

          ## Stop conditions
          PRODUCT_CODE_MODIFIED_BY_THIS_GATE: NO
          VERSION_FINALIZED: NO
          CANDIDATE_HEAD: NOT_CREATED
          CANDIDATE_APP: NOT_BUILT
          OWNER_APP_CHANGED_BY_THIS_GATE: NO
          OWNER_APP_HASH_VERIFICATION: NOT_AVAILABLE_IN_GITHUB_RUNNER
          RELEASE: BLOCKED

          FINAL_GATE: GREEN
          EOF

          echo PRE_FREEZE_STATUS=PASS
          echo OWNER_ICON_DECISION=KEEP_CURRENT_ICON
          echo ICON_GATE=PASS_OWNER_WAIVER
          echo VERSION_FINALIZED=NO
          echo CANDIDATE_HEAD=NOT_CREATED
          echo RELEASE=BLOCKED

      - name: Commit evidence only
        shell: bash
        run: |
          set -Eeuo pipefail
          git add \
            VYRON_BASELINE_QA_DEBT_6_1_9.md \
            VYRON_PROTECTED_FUNCTIONAL_DIFF_6_1_10.md \
            VYRON_OWNER_ICON_DECISION_6_1_10.md \
            VYRON_PRE_FREEZE_EVIDENCE_6_1_10.md

          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            VYRON_BASELINE_QA_DEBT_6_1_9.md \
            VYRON_OWNER_ICON_DECISION_6_1_10.md \
            VYRON_PRE_FREEZE_EVIDENCE_6_1_10.md \
            VYRON_PROTECTED_FUNCTIONAL_DIFF_6_1_10.md | sort)"
          test "$staged" = "$expected"
          git diff --cached --check

          git config user.name 'VYRON QA'
          git config user.email 'vyron-qa@users.noreply.github.com'
          git commit -m 'docs(vyron): record green pre-freeze evidence and keep-current icon decision'
          git push origin "HEAD:$BRANCH"

          echo PRODUCT_RUNTIME_FILES_COMMITTED=0
          echo PRODUCT_ICON_FILES_COMMITTED=0
          echo VERSION_FINALIZED=NO
          echo CANDIDATE_HEAD=NOT_CREATED
          echo CANDIDATE_APP_BUILT=NO
          echo RELEASE=BLOCKED
