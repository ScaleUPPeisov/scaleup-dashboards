name: VYRON 6.1.10 Historical Contract Provenance

on:
  push:
    branches:
      - hotfix/vyron-6.1.10-product-correctness
    paths:
      - '.github/workflows/vyron-6110-historical-contract-provenance.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SAFE_BASE: 588e2070877512daa637077223c678af6a216831
  BRANCH: hotfix/vyron-6.1.10-product-correctness

jobs:
  provenance:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/vyron-6.1.10-product-correctness
          fetch-depth: 0

      - name: QA-only safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$SAFE_BASE" HEAD
          test "$(node -p "require('./package.json').version")" = "6.1.9"
          test "$(git status --porcelain)" = ""
          echo PRODUCT_MUTATION=NO
          echo CANDIDATE_BUILD=NO
          echo RELEASE=BLOCKED

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Extract unique failing test files
        shell: bash
        run: |
          set -Eeuo pipefail
          grep '^- TEST_FILE: ' VYRON_6_1_10_REGRESSION_FAILURES.md \
            | sed 's/^- TEST_FILE: //' \
            | sort -u > "$RUNNER_TEMP/failing-files.txt"
          test -s "$RUNNER_TEMP/failing-files.txt"
          echo "UNIQUE_FAILING_FILES=$(wc -l < "$RUNNER_TEMP/failing-files.txt" | tr -d ' ')"
          cat "$RUNNER_TEMP/failing-files.txt"

      - name: Resolve introduction commit and declared contract version
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          safe=os.environ['SAFE_BASE']
          files=Path(os.environ['RUNNER_TEMP']+'/failing-files.txt').read_text().splitlines()
          rows=[]
          def sh(*args):
            return subprocess.check_output(args,text=True).strip()
          for p in files:
            commits=sh('git','log',safe,'--diff-filter=A','--format=%H','--',p).splitlines()
            intro=commits[-1] if commits else ''
            intro_date=sh('git','show','-s','--format=%cI',intro) if intro else ''
            intro_msg=sh('git','show','-s','--format=%s',intro) if intro else ''
            pkg_version=''
            if intro:
              try:
                pkg=json.loads(sh('git','show',f'{intro}:package.json'))
                pkg_version=str(pkg.get('version',''))
              except Exception:
                pass
            current=Path(p).read_text(errors='replace')
            versions=[]
            for m in re.finditer(r'VYRON\s+([0-9]+(?:\.[0-9]+){1,2}(?:\s+RC\d+)?)',current,re.I):
              v=m.group(1)
              if v not in versions: versions.append(v)
            explicit_identity=bool(re.search(r"toBe\(['\"]\d+\.\d+\.\d+['\"]\)|VYRON_MAJOR_VERSION=.*\d+\.\d+\.\d+",current))
            rows.append(dict(test_file=p,intro_commit=intro,intro_date=intro_date,intro_message=intro_msg,intro_package_version=pkg_version,declared_contract_versions=versions,contains_exact_version_identity_assertion=explicit_identity))
          Path(os.environ['RUNNER_TEMP']+'/provenance.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          PY

      - name: Execute every failing test file at its introduction ref
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          rows=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/provenance.json').read_text())
          groups={}
          for r in rows:
            groups.setdefault(r['intro_commit'],[]).append(r['test_file'])
          pathlib.Path(os.environ['RUNNER_TEMP']+'/groups.json').write_text(json.dumps(groups,indent=2)+'\n')
          print(f'UNIQUE_INTRO_COMMITS={len(groups)}')
          PY
          mkdir -p "$RUNNER_TEMP/results"
          i=0
          while IFS= read -r intro; do
            i=$((i+1))
            test -n "$intro"
            wt="$RUNNER_TEMP/wt-$i"
            git worktree add --detach "$wt" "$intro"
            files="$(INTRO="$intro" python3 - <<'PY'
          import json,os,pathlib
          g=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/groups.json').read_text())
          print('\n'.join(g[os.environ['INTRO']]))
          PY
            )"
            printf '%s\n' "$files" > "$RUNNER_TEMP/results/$i-files.txt"
            (
              cd "$wt"
              npm ci --no-audit --no-fund
              if grep -R -q "react-test-renderer" $files 2>/dev/null; then
                npm install --no-save --no-package-lock react-test-renderer@19.1.1
              fi
              set +e
              npx vitest run $files --reporter=json --outputFile="$RUNNER_TEMP/results/$i.json"
              code=$?
              set -e
              echo "$code" > "$RUNNER_TEMP/results/$i.exit"
              test -s "$RUNNER_TEMP/results/$i.json"
            )
            git worktree remove --force "$wt"
          done < <(python3 - <<'PY'
          import json,os,pathlib
          g=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/groups.json').read_text())
          print('\n'.join(k for k in g if k))
          PY
          )

      - name: Build provenance report
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          rows=json.loads((temp/'provenance.json').read_text())
          groups=json.loads((temp/'groups.json').read_text())
          by_file={}
          for idx,intro in enumerate([k for k in groups if k],1):
            data=json.loads((temp/f'results/{idx}.json').read_text())
            for suite in data.get('testResults',[]):
              raw=str(suite.get('name','')).replace('\\','/')
              matched=None
              for f in groups[intro]:
                if raw.endswith('/'+f) or raw==f or raw.endswith(f):
                  matched=f; break
              if not matched: continue
              assertions=suite.get('assertionResults',[])
              by_file[matched]={
                'intro_total':len(assertions),
                'intro_failed':sum(1 for a in assertions if a.get('status')=='failed'),
                'intro_pending':sum(1 for a in assertions if a.get('status') in ('pending','skipped','todo')),
                'intro_passed':sum(1 for a in assertions if a.get('status')=='passed'),
                'intro_failure_names':[a.get('fullName') or a.get('title') for a in assertions if a.get('status')=='failed'],
              }
          lines=['# VYRON 6.1.10 — HISTORICAL CONTRACT TEST PROVENANCE','',f'- SAFE_BASE: `{os.environ["SAFE_BASE"]}`','- PRODUCT_MUTATION: NO','- CANDIDATE_BUILD: NO','- RELEASE: BLOCKED','']
          proven=0; not_proven=0
          for r in rows:
            res=by_file.get(r['test_file'],{})
            passed=res.get('intro_failed')==0 and res.get('intro_pending')==0 and res.get('intro_total',0)>0
            if passed: proven+=1
            else: not_proven+=1
            lines += [f'## {r["test_file"]}','',f'- INTRO_COMMIT: `{r["intro_commit"]}`',f'- INTRO_DATE: {r["intro_date"]}',f'- INTRO_MESSAGE: {r["intro_message"]}',f'- INTRO_PACKAGE_VERSION: {r["intro_package_version"] or "UNKNOWN"}',f'- DECLARED_CONTRACT_VERSIONS: {", ".join(r["declared_contract_versions"]) or "NONE"}',f'- EXACT_VERSION_IDENTITY_ASSERTION: {"YES" if r["contains_exact_version_identity_assertion"] else "NO"}',f'- INTRO_TESTS_TOTAL: {res.get("intro_total","UNKNOWN")}',f'- INTRO_TESTS_PASSED: {res.get("intro_passed","UNKNOWN")}',f'- INTRO_TESTS_FAILED: {res.get("intro_failed","UNKNOWN")}',f'- INTRO_TESTS_PENDING: {res.get("intro_pending","UNKNOWN")}',f'- PASSED_AT_INTRO_REF: {"YES" if passed else "NO"}',f'- INTRO_FAILURES: {res.get("intro_failure_names",[])}','']
          lines += ['## Summary','',f'- UNIQUE_FAILING_FILES: {len(rows)}',f'- FILES_PASSING_AT_INTRO_REF: {proven}',f'- FILES_NOT_PASSING_AT_INTRO_REF: {not_proven}','', 'Passing at the introduction ref is provenance evidence only. It does not by itself authorize excluding a test from current regression. Current-head routing/classification still requires contract-level review.','']
          pathlib.Path('VYRON_6_1_10_HISTORICAL_TEST_PROVENANCE.md').write_text('\n'.join(lines))
          print('\n'.join(lines[-8:]))
          PY
          git diff --check

      - name: Commit QA provenance only
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          test "$changed" = "VYRON_6_1_10_HISTORICAL_TEST_PROVENANCE.md"
          git config user.name "VYRON QA"
          git config user.email "vyron-qa@users.noreply.github.com"
          git add VYRON_6_1_10_HISTORICAL_TEST_PROVENANCE.md
          git diff --cached --check
          git commit -m "test(vyron): record historical regression provenance"
          git push origin "HEAD:$BRANCH"
          echo PRODUCT_FILES_COMMITTED=0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-6.1.10-HISTORICAL-CONTRACT-PROVENANCE
          path: VYRON_6_1_10_HISTORICAL_TEST_PROVENANCE.md
          if-no-files-found: error
          retention-days: 30

      - name: Keep freeze blocked
        shell: bash
        run: |
          echo CANDIDATE_HEAD=NOT_CREATED
          echo CANDIDATE_APP_BUILT=NO
          echo RELEASE=BLOCKED
          exit 1
