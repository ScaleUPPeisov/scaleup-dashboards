name: VYRON 6.1.10 Icon Candidate Index

on:
  push:
    branches:
      - hotfix/vyron-6.1.10-product-correctness
    paths:
      - '.github/workflows/vyron-6110-icon-candidates-index.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: hotfix/vyron-6.1.10-product-correctness

jobs:
  index:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/vyron-6.1.10-product-correctness
          fetch-depth: 0

      - name: Verify decodable historical previews 01 through 18
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p "require('./package.json').version")" = "6.1.9"
          test "$(git rev-parse HEAD:src/assets/vyron-4-artwork.webp)" = "c4bb26bef69571df152fb0ecfe7da5a349663bb7"
          for n in $(seq -w 1 18); do
            p="VYRON-ICON-CANDIDATES/previews/candidate-${n}.png"
            test -s "$p"
            file "$p" | grep -q 'PNG image data'
          done
          echo DECODABLE_PREVIEWS=18

      - name: Record candidate 19 as corrupted historical evidence only
        shell: bash
        run: |
          set -Eeuo pipefail
          root='VYRON-ICON-CANDIDATES'
          rm -f "$root/previews/candidate-19.png"
          printf '%s\n' \
            'original path: src/assets/vyron-4-artwork.webp' \
            'commit SHA: 39662c2aa6fe1cc352d435463692e1d255860c76' \
            'blob SHA: c4bb26bef69571df152fb0ecfe7da5a349663bb7' \
            'dimensions/header information: RIFF/WebP VP8, 384x384' \
            'decoder failures: sips failed; Pillow failed; ffmpeg failed with invalid/insufficient image data; dwebp failed with BITSTREAM_ERROR / NOT_ENOUGH_DATA' \
            'historical context: historical VYRON artwork evidence from src/assets/vyron-4-artwork.webp; physically corrupted/truncated; must not be reconstructed, redrawn, or fabricated as a preview' \
            > "$root/candidate-19-CORRUPTED.txt"
          test ! -e "$root/previews/candidate-19.png"
          test -s "$root/candidate-19-CORRUPTED.txt"
          echo CORRUPTED_HISTORICAL_EVIDENCE=YES
          echo FAKE_PIXELS_GENERATED=NO

      - name: Build owner-facing INDEX.md from forensic manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path

          root=Path('VYRON-ICON-CANDIDATES')
          manifest=json.loads((root/'manifest.json').read_text())
          forensic=(root/'VYRON_ICON_FORENSICS.md').read_text()
          if len(manifest)!=19:
              raise SystemExit(f'expected 19 unique candidate blobs, found {len(manifest)}')

          def meta(n):
              m=re.search(rf'## candidate-{n:02d}\n(.*?)(?=\n## candidate-|\n## Decision)',forensic,re.S)
              text=m.group(1) if m else ''
              cls=re.search(r'- CLASSIFICATION: (.+)',text)
              conf=re.search(r'- CONFIDENCE: (.+)',text)
              return (cls.group(1).strip() if cls else 'UNCLASSIFIED', conf.group(1).strip() if conf else 'UNKNOWN')

          def first_commit(blob, n):
              if n == 19:
                  return ('39662c2aa6fe1cc352d435463692e1d255860c76','UNKNOWN')
              proc=subprocess.run(['git','log','--all','--find-object='+blob,'--format=%H|%aI','--reverse'],text=True,capture_output=True,check=False)
              first=(proc.stdout.strip().splitlines() or ['UNKNOWN|UNKNOWN'])[0].split('|',1)
              return first[0], (first[1] if len(first)>1 else 'UNKNOWN')

          def historical_version(refs):
              pats=[]
              for ref in refs:
                  clean=ref.replace('refs/remotes/origin/','').replace('refs/tags/','')
                  m=re.search(r'(?:vyron-|^v)(\d+\.\d+(?:\.\d+)?)', clean, re.I)
                  if m: pats.append(m.group(1))
              return pats[0] if pats else 'UNKNOWN'

          lines=[
            '# VYRON ICON CANDIDATES — OWNER VISUAL SELECTION','',
            '> QA does not select the final icon. The owner must identify the correct historical icon visually before version finalization.','',
            '- PRODUCT_ICON_CHANGED: NO',
            '- GENERIC_V: REJECTED',
            '- OWNER_SELECTION_REQUIRED: YES',
            '- OWNER_SELECTED_ICON: NONE',
            '- ICON_RESTORED: NO',
            f'- TOTAL_HISTORICAL_CANDIDATES: {len(manifest)}',
            '- DECODABLE_PREVIEWS: 18',
            '- CORRUPTED_HISTORICAL_EVIDENCE: 1','',
            '| NUMBER | PREVIEW FILE | SOURCE PATH | COMMIT | BLOB SHA | DATE | HISTORICAL VERSION | PACKAGED AS APP ICON? | OWNER-PROVIDED? | CONFIDENCE | NOTES |',
            '|---|---|---|---|---|---|---|---|---|---|---|'
          ]

          for i,item in enumerate(manifest,1):
              blob=item['blob']; paths=item.get('paths') or []; refs=item.get('refs') or []
              cls,conf=meta(i)
              commit,date=first_commit(blob,i)
              path='<br>'.join(f'`{p}`' for p in paths) or 'UNKNOWN'
              version=historical_version(refs)
              if i == 19:
                  preview='`candidate-19-CORRUPTED.txt`'
                  packaged='UNKNOWN'
                  owner='YES'
                  notes='CORRUPTED_HISTORICAL_EVIDENCE; no preview pixels generated; historical artwork not proven as bundle icon'
              else:
                  preview=f'`previews/candidate-{i:02d}.png`'
                  packaged='YES' if any(str(p).startswith('src-tauri/icons/') for p in paths) else 'UNKNOWN'
                  owner='UNKNOWN'
                  notes=cls
                  if blob == '9ae975a36e1677e2c49060f13b8651d446dabaf2':
                      notes='REJECTED_GENERIC_V_LINEAGE'
              lines.append(f'| candidate-{i:02d} | {preview} | {path} | `{commit}` | `{blob}` | {date} | {version} | {packaged} | {owner} | {conf} | {notes} |')

          lines += ['', '## Decision', '', '- FINAL_ICON: NONE', '- OWNER_SELECTION_REQUIRED: YES', '- ICON_GATE: BLOCKED_OWNER_SELECTION', '- DO_NOT_FINALIZE_VERSION_BEFORE_SELECTION: YES', '']
          (root/'INDEX.md').write_text('\n'.join(lines))
          PY
          grep -q 'candidate-19-CORRUPTED.txt' VYRON-ICON-CANDIDATES/INDEX.md
          grep -q 'OWNER_SELECTION_REQUIRED: YES' VYRON-ICON-CANDIDATES/INDEX.md
          test ! -e VYRON-ICON-CANDIDATES/previews/candidate-19.png
          git diff --check

      - name: Commit owner-review evidence only
        shell: bash
        run: |
          set -Eeuo pipefail
          git add VYRON-ICON-CANDIDATES/INDEX.md VYRON-ICON-CANDIDATES/candidate-19-CORRUPTED.txt
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          while IFS= read -r p; do
            case "$p" in
              VYRON-ICON-CANDIDATES/INDEX.md|VYRON-ICON-CANDIDATES/candidate-19-CORRUPTED.txt) ;;
              *) echo "forbidden staged path: $p"; exit 1 ;;
            esac
          done <<< "$staged"
          git diff --cached --check
          git config user.name "VYRON QA"
          git config user.email "vyron-qa@users.noreply.github.com"
          git commit -m "docs(vyron): package owner icon evidence without reconstruction"
          git push origin "HEAD:$BRANCH"
          echo PRODUCT_ICON_CHANGED=NO
          echo DECODABLE_PREVIEWS=18
          echo CORRUPTED=1
          echo OWNER_SELECTION_REQUIRED=YES
          echo OWNER_SELECTED_ICON=NONE
          echo ICON_GATE=BLOCKED_OWNER_SELECTION
