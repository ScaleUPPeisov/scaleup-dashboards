name: VYRON 6.1.10 Native Inventory Harness Repair

on:
  push:
    branches:
      - hotfix/vyron-6.1.10-product-correctness
    paths:
      - '.github/workflows/vyron-6110-native-inventory-harness-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SAFE_BASE: 588e2070877512daa637077223c678af6a216831
  BRANCH: hotfix/vyron-6.1.10-product-correctness
  RECIPE_COMMIT: b54a0a1448cd0cf930f482aa28a957b0d6859a80

jobs:
  repair:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/vyron-6.1.10-product-correctness
          fetch-depth: 0

      - name: Safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$SAFE_BASE" HEAD
          test "$(node -p "require('./package.json').version")" = "6.1.9"
          test "$(git status --porcelain)" = ""
          echo PRODUCT_MUTATION=NO
          echo VERSION_FINALIZED=NO
          echo CANDIDATE_BUILD=NO
          echo RELEASE=BLOCKED

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Apply proven native-inventory harness correction only
        shell: bash
        run: |
          set -Eeuo pipefail
          git show "$RECIPE_COMMIT:.github/workflows/vyron-6110-native-inventory-harness-fix.yml" > /tmp/vyron-6110-recipe.yml
          python3 - <<'PY'
          from pathlib import Path

          raw = Path('/tmp/vyron-6110-recipe.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          script = raw[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )

          bad = '}}}});'
          good = '}}});'
          count = script.count(bad)
          if count != 3:
              raise SystemExit(f'expected 3 invalid vi.mock closings in source recipe, found {count}')
          script = script.replace(bad, good)

          legacy_call = "getChannelScheduleState('A',channel('A'),full.slice(0,6),Date.parse('2026-09-18T00:00:00Z'))"
          current_call = "getChannelScheduleState('A',channel('A'),[],Date.parse('2026-09-18T00:00:00Z'))"
          call_count = script.count(legacy_call)
          if call_count != 1:
              raise SystemExit(f'expected exactly one stale getChannelScheduleState harness call, found {call_count}')
          script = script.replace(legacy_call, current_call)

          compile(script, '<vyron-native-inventory-harness-repair>', 'exec')
          exec(compile(script, '<vyron-native-inventory-harness-repair>', 'exec'), {'__name__': '__main__'})
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/schedulePhysicalRegression.test.ts src/v2115ScheduleSyncHotfix.test.ts src/youtubeInventoryRc4.test.ts | sort)"
          test "$changed" = "$expected"
          echo TEST_ONLY_SCOPE=PASS
          echo PRODUCT_FILES_CHANGED=0

      - name: Transform and Vitest collection guard
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vitest list src/schedulePhysicalRegression.test.ts src/v2115ScheduleSyncHotfix.test.ts src/youtubeInventoryRc4.test.ts
          echo TRANSFORM_ERRORS=0

      - name: Focused native inventory regressions
        run: npx vitest run src/schedulePhysicalRegression.test.ts src/v2115ScheduleSyncHotfix.test.ts src/youtubeInventoryRc4.test.ts

      - name: TypeScript production build guard
        run: npm run build

      - name: Commit only after focused proof
        shell: bash
        run: |
          set -Eeuo pipefail
          git add src/schedulePhysicalRegression.test.ts src/v2115ScheduleSyncHotfix.test.ts src/youtubeInventoryRc4.test.ts
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' src/schedulePhysicalRegression.test.ts src/v2115ScheduleSyncHotfix.test.ts src/youtubeInventoryRc4.test.ts | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git config user.name "VYRON QA"
          git config user.email "vyron-qa@users.noreply.github.com"
          git commit -m "test(vyron): align inventory regressions with native cache storage"
          git push origin "HEAD:$BRANCH"
          echo QA_HARNESS_FIX_COMMITTED=YES
          echo PRODUCT_FILES_COMMITTED=0

      - name: Report current freeze state
        shell: bash
        run: |
          echo TRANSFORM_ERRORS=0
          echo FOCUSED_NATIVE_INVENTORY=PASS
          echo TYPESCRIPT_BUILD=PASS
          echo PRODUCT_FILES_COMMITTED=0
          echo VERSION_FINALIZED=NO
          echo ICON_RESOLVED=NO
          echo VYRON_6_1_10_CANDIDATE_HEAD=NOT_CREATED
          echo CANDIDATE_APP_BUILT=NO
          echo RELEASE=BLOCKED_PENDING_FULL_GATE_AND_OWNER_ICON
