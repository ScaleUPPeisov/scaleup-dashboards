name: VYRON 6.1.11 Every N Days Apply Bridge

on:
  push:
    branches:
      - automation/vyron-6111-every-n-days-apply
    paths:
      - .github/workflows/vyron-6111-every-n-days-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: automation/vyron-6111-every-n-days-apply
          path: helper

      - name: Checkout exact product base
        uses: actions/checkout@v4
        with:
          ref: db7baa448565b6b7de2c42f35b80a40a379926de
          fetch-depth: 0
          path: product

      - name: Verify product branch lease
        shell: bash
        run: |
          set -euo pipefail
          cd product
          expected=db7baa448565b6b7de2c42f35b80a40a379926de
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/hotfix/vyron-6.1.11-metadata-inventory-correctness | awk '{print $1}')"
          echo "EXPECTED_BASE=$expected"
          echo "ACTUAL_BASE=$actual"
          echo "REMOTE_HEAD=$remote"
          test "$actual" = "$expected"
          test "$remote" = "$expected"

      - name: Apply product patch
        shell: bash
        run: |
          set -euo pipefail
          python3 helper/.github/scripts/vyron_every_n_days_apply.py product

      - name: Create exactly one product commit
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git diff --check
          mapfile -t changed < <(git status --short | awk '{print $2}')
          printf 'CHANGED=%s\n' "${changed[*]}"
          allowed='^(src/(publishWorkspaceState\.ts|publisherSchedule\.ts|scheduleContinuation\.ts|PublisherOS\.tsx|publisherSchedule\.test\.ts|scheduleContinuation\.test\.ts|publishWorkspaceState\.interval\.test\.ts))$'
          for f in "${changed[@]}"; do
            [[ "$f" =~ $allowed ]] || { echo "FORBIDDEN_FILE=$f"; exit 1; }
          done
          test "${#changed[@]}" -eq 7
          git config user.name 'VYRON QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'feat(vyron): add interval-based YouTube publishing'
          candidate="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          echo "PRODUCT_CANDIDATE_SHA=$candidate"
          echo "PRODUCT_PARENT_SHA=$parent"
          test "$parent" = db7baa448565b6b7de2c42f35b80a40a379926de
          git push origin HEAD:refs/heads/hotfix/vyron-6.1.11-metadata-inventory-correctness
