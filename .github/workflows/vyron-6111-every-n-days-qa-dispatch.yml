name: VYRON 6.1.11 Every N Days QA Dispatch Bridge

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vyron-6111-every-n-days-qa.yml
      - .github/workflows/vyron-6111-every-n-days-qa-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deterministic QA against product candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: d1b1c57607de45cffdc0788c3a5efd144f302599
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"main\",\"inputs\":{\"candidate_sha\":\"%s\"}}' "$CANDIDATE_SHA")"
          for attempt in 1 2 3 4 5; do
            status="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/actions/workflows/vyron-6111-every-n-days-qa.yml/dispatches" \
              -d "$payload")"
            echo "DISPATCH_ATTEMPT=$attempt HTTP_STATUS=$status"
            if [ "$status" = '204' ]; then
              echo "DISPATCHED_CANDIDATE_SHA=$CANDIDATE_SHA"
              exit 0
            fi
            cat /tmp/dispatch.out || true
            sleep 3
          done
          exit 1
