name: VYRON 6.1.11 Cleanup RPM Channel Plan QA

on:
  push:
    branches:
      - hotfix/vyron-6.1.11-metadata-inventory-correctness
    paths:
      - '.github/workflows/vyron-6111-global-cleanup-rpm-plan-qa.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact frozen VYRON product candidate SHA'
        required: true
        default: '0a837760e4a46c6267d7c22cea51325c68495cae'

permissions:
  contents: read

env:
  PRODUCT_CANDIDATE_SHA: '0a837760e4a46c6267d7c22cea51325c68495cae'

concurrency:
  group: vyron-6111-cleanup-rpm-plan-hosted-ci
  cancel-in-progress: false

jobs:
  hosted-ci-gate:
    name: HOSTED_CI_GATE
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Resolve requested candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          REQUESTED="${{ github.event.inputs.candidate_sha }}"
          if [ -z "$REQUESTED" ]; then REQUESTED="$PRODUCT_CANDIDATE_SHA"; fi
          echo "REQUESTED_CANDIDATE_SHA=$REQUESTED" | tee -a "$GITHUB_ENV"
          test "$REQUESTED" = "$PRODUCT_CANDIDATE_SHA"

      - name: Checkout frozen product candidate
        uses: actions/checkout@v4
        with:
          ref: '0a837760e4a46c6267d7c22cea51325c68495cae'
          fetch-depth: 0

      - name: Verify environment and exact candidate SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "PRODUCT_CANDIDATE_SHA=$PRODUCT_CANDIDATE_SHA"
          echo "GITHUB_EVENT_SHA=$GITHUB_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          uname -a
          uname -m
          sw_vers
          test "$(git rev-parse HEAD)" = "$PRODUCT_CANDIDATE_SHA"
          test "$REQUESTED_CANDIDATE_SHA" = "$PRODUCT_CANDIDATE_SHA"
          git status --short

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Focused cleanup RPM and Channel Plan tests
        run: >-
          npx vitest run
          src/rpmCoverage.test.ts
          src/postUploadCleanup.global.test.ts
          src/globalCleanupExecutor.test.ts
          src/channelPlanYoutubeCoverage.test.ts
          --reporter=verbose

      - name: Full frontend test suite
        run: npm test

      - name: TypeScript production build
        run: npm run build

      - name: Native macOS Trash unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml local_delete -- --nocapture

      - name: Hosted CI acceptance marker
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_CANDIDATE_SHA"
          echo 'HOSTED_CI_GATE=PASS'
          echo "HOSTED_CI_SHA=$(git rev-parse HEAD)"
          echo 'PHYSICAL_QA=NOT_CLAIMED'
          echo 'NO_RELEASE_PERFORMED=PASS'
