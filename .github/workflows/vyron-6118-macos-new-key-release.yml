name: VYRON 6.1.18 macOS new-key release

on:
  push:
    branches:
      - feature/vyron-macos-ultimate
    paths:
      - '.github/workflows/vyron-6118-macos-new-key-release.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-6118-macos-new-key-release
  cancel-in-progress: false

env:
  VERSION: '6.1.18'
  TAG: v6.1.18
  TESTED_HEAD: f4564d0dddc5bd939a11aa46715b9a49c7674053
  RELEASE_REPO: ScaleUPPeisov/vyron-releases
  BUNDLE_ID: studio.channelflow.desktop
  ROTATED_PUBKEY_SHA256: 6f95fd039839eaa94cb378a67a0205e42e449a84c978674e20c5fb5abcfdfb19

jobs:
  build:
    name: Build and prove 6.1.17 signature continuity
    runs-on: macos-15
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.VYRON_TAURI_SIGNING_PRIVATE_KEY_2026 || secrets.TAURI_SIGNING_PRIVATE_KEY_2026 || secrets.TAURI_SIGNING_PRIVATE_KEY_ROTATED || secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.VYRON_TAURI_SIGNING_PRIVATE_KEY_PASSWORD_2026 || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_2026 || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_ROTATED || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact tested product and green gates
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "$TESTED_HEAD^{commit}"
          CHANGED="$(git diff --name-only "$TESTED_HEAD" HEAD)"
          test -n "$CHANGED"
          test -z "$(printf '%s\n' "$CHANGED" | grep -Ev '^(\.github/workflows/vyron-6118-macos-new-key-release\.yml|src-tauri/tauri\.618-rotated\.conf\.json)$' || true)"
          for RUN_ID in 43213810559 43213810561 43213810490 43213810378 43213810483 43213810324; do
            RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            test "$(printf '%s' "$RUN" | jq -r .status)" = completed
            test "$(printf '%s' "$RUN" | jq -r .conclusion)" = success
            test "$(printf '%s' "$RUN" | jq -r .head_sha)" = "$TESTED_HEAD"
          done
          python3 - <<'PY'
          import base64,hashlib,json,os
          c=json.load(open('src-tauri/tauri.618-rotated.conf.json'))
          assert c['version']==os.environ['VERSION']
          assert c['identifier']==os.environ['BUNDLE_ID']
          assert c['bundle']['createUpdaterArtifacts'] is True
          raw=base64.b64decode(c['plugins']['updater']['pubkey'],validate=True)
          assert raw.startswith(b'untrusted comment:')
          assert c['plugins']['updater']['pubkey']=='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDgxMzNDOTg3M0ZBQjc5QzEKUldUQmVhcy9oOGt6Z1owb2JOWjJjM1FOQjF3UkJnbm5mZGNZRTloMUZhYkJFRlZ6QWFoNk5VN3kK'
          PY
          echo TESTED_PRODUCT_AND_GREEN_GATES=PASS

      - name: Canonicalize approved updater key
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          python3 - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              try: dec=base64.b64decode(candidates[-1].strip(),validate=True).decode().strip()
              except Exception: break
              if dec in candidates: break
              candidates.append(dec)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'ROTATED_UPDATER_PRIVATE_KEY_SECRET_MISSING_OR_INVALID'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY
          echo UPDATER_KEY_SECRET_PRESENT=PASS

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund

      - name: Final performance and stability regression
        run: |
          npx vitest run --reporter=dot
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          npm run build

      - name: Import macOS signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VYRON_MACOS_SIGNING_P12_BASE64"
          test -n "$VYRON_MACOS_SIGNING_IDENTITY"
          KEYCHAIN="$RUNNER_TEMP/vyron-6118.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-6118.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "\"$VYRON_MACOS_SIGNING_IDENTITY\"" >/dev/null
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Read trusted identity from published 6.1.17
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fL "https://github.com/$RELEASE_REPO/releases/download/v6.1.17/VYRON-6.1.17-arm64.dmg" -o "$RUNNER_TEMP/v617.dmg"
          mkdir -p "$RUNNER_TEMP/v617"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/v617" "$RUNNER_TEMP/v617.dmg" >/dev/null
          OLD_APP="$(find "$RUNNER_TEMP/v617" -maxdepth 2 -name 'VYRON.app' -print -quit)"
          test -d "$OLD_APP"
          codesign --verify --deep --strict "$OLD_APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$OLD_APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$OLD_APP/Contents/Info.plist")" = "6.1.17"
          OLD_REQ="$(codesign -dr - "$OLD_APP" 2>&1 | sed -n 's/^designated => //p')"
          test -n "$OLD_REQ"
          ! printf '%s' "$OLD_REQ" | grep -F cdhash
          printf '%s' "$OLD_REQ" | base64 > "$RUNNER_TEMP/v617.req.b64"
          hdiutil detach "$RUNNER_TEMP/v617" >/dev/null
          echo V617_CODESIGN_TRUST_BASELINE=PASS

      - name: Build signed macOS ARM64 6.1.18
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.618-rotated.conf.json
          BASE=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP="$BASE/macos/VYRON.app"
          ARCHIVE="$BASE/macos/VYRON.app.tar.gz"
          SIG="$ARCHIVE.sig"
          DMG="$(find "$BASE/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -d "$APP"; test -s "$ARCHIVE"; test -s "$SIG"; test -s "$DMG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$APP"
          NEW_REQ="$(codesign -dr - "$APP" 2>&1 | sed -n 's/^designated => //p')"
          OLD_REQ="$(base64 --decode < "$RUNNER_TEMP/v617.req.b64")"
          test "$NEW_REQ" = "$OLD_REQ"
          hdiutil verify "$DMG"
          mkdir release-mac
          cp "$DMG" "release-mac/VYRON-$VERSION-arm64.dmg"
          cp "$ARCHIVE" release-mac/VYRON.app.tar.gz
          cp "$SIG" release-mac/VYRON.app.tar.gz.sig
          shasum -a 256 "release-mac/VYRON-$VERSION-arm64.dmg" | awk '{print $1}' > "release-mac/VYRON-$VERSION-arm64.dmg.sha256"
          shasum -a 256 release-mac/VYRON.app.tar.gz | awk '{print $1}' > release-mac/VYRON.app.tar.gz.sha256
          git rev-parse HEAD > release-mac/source-head.txt
          echo V617_TO_V618_CODESIGN_CONTINUITY=PASS

      - name: Prove rotated updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          c=json.load(open('src-tauri/tauri.618-rotated.conf.json'))
          Path('/tmp/vyron-rotated.pub').write_bytes(base64.b64decode(c['plugins']['updater']['pubkey'],validate=True))
          Path('/tmp/vyron-6118.sig').write_bytes(base64.b64decode(Path('release-mac/VYRON.app.tar.gz.sig').read_text().strip(),validate=True))
          PY
          minisign -Vm release-mac/VYRON.app.tar.gz -x /tmp/vyron-6118.sig -p /tmp/vyron-rotated.pub
          echo ROTATED_UPDATER_SIGNATURE=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.18-MAC
          path: release-mac/**
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-6118.p12"
          if printenv VYRON_SIGNING_KEYCHAIN >/dev/null; then security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; fi

  publish:
    name: Publish 6.1.18 and updater feed
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.18-MAC
          path: release-mac

      - name: Verify release payload
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(sha256sum "release-mac/VYRON-$VERSION-arm64.dmg" | awk '{print $1}')" = "$(tr -d '\r\n ' < "release-mac/VYRON-$VERSION-arm64.dmg.sha256")"
          test "$(sha256sum release-mac/VYRON.app.tar.gz | awk '{print $1}')" = "$(tr -d '\r\n ' < release-mac/VYRON.app.tar.gz.sha256)"
          test -n "$(tr -d '\r\n ' < release-mac/source-head.txt)"

      - name: Publish immutable release
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_HEAD="$(tr -d '\r\n ' < release-mac/source-head.txt)"
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            BODY="$(gh release view "$TAG" --repo "$RELEASE_REPO" --json body --jq .body)"
            printf '%s' "$BODY" | grep -F "$SOURCE_HEAD" >/dev/null
          else
            cat > /tmp/notes.md <<EOF
          VYRON 6.1.18 — macOS ARM64 performance and stability update.

          Exact source: $SOURCE_HEAD
          Tested product baseline: $TESTED_HEAD

          Includes the final PR #22 performance fixes for music-library memory, bounded caches, cleanup and safe local diagnostics.
          Signed with the same rotated updater trust chain and the same macOS application identity as VYRON 6.1.17.
          Windows updater and user data are not changed.
          EOF
            gh release create "$TAG" --repo "$RELEASE_REPO" --title "VYRON $VERSION" --notes-file /tmp/notes.md \
              "release-mac/VYRON-$VERSION-arm64.dmg" \
              "release-mac/VYRON-$VERSION-arm64.dmg.sha256" \
              release-mac/VYRON.app.tar.gz \
              release-mac/VYRON.app.tar.gz.sha256 \
              release-mac/VYRON.app.tar.gz.sig \
              release-mac/source-head.txt
          fi

      - name: Promote macOS updater feed only
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:$GH_TOKEN@github.com/$RELEASE_REPO.git" release-repo
          WIN_BEFORE="$(sha256sum release-repo/updates/windows-latest.json | awk '{print $1}')"
          CURRENT="$(python3 -c "import json; print(json.load(open('release-repo/updates/latest.json'))['version'])")"
          python3 - "$CURRENT" <<'PY'
          import sys
          def v(s): return tuple(map(int,s.split('.')))
          assert v(sys.argv[1]) < v('6.1.18'), f"REFUSE_TO_REPLACE_NEWER_FEED_{sys.argv[1]}"
          PY
          SIG="$(tr -d '\r\n' < release-mac/VYRON.app.tar.gz.sig)"
          SHA="$(tr -d '\r\n ' < release-mac/VYRON.app.tar.gz.sha256)"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$SIG" "$SHA" "$DATE" <<'PY'
          import json,sys
          from pathlib import Path
          sig,sha,date=sys.argv[1:4]
          latest={'version':'6.1.18','notes':'VYRON 6.1.18 — Performance and Stability Update (macOS)','pub_date':date,'platforms':{'darwin-aarch64':{'url':'https://github.com/ScaleUPPeisov/vyron-releases/releases/download/v6.1.18/VYRON.app.tar.gz','signature':sig,'sha256':sha}}}
          Path('release-repo/updates/latest.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n')
          PY
          cd release-repo
          test "$(sha256sum updates/windows-latest.json | awk '{print $1}')" = "$WIN_BEFORE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json
          git commit -m 'release: publish VYRON 6.1.18 macOS updater manifest'
          git push origin main
          echo MACOS_FEED_6118_WINDOWS_UNCHANGED=PASS

      - name: Final remote audit
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$RELEASE_REPO/releases/tags/$TAG" > /tmp/release.json
          gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/latest.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/release.json')); m=json.load(open('/tmp/latest.json'))
          assert r['tag_name']=='v6.1.18' and not r['draft'] and not r['prerelease']
          names={a['name'] for a in r['assets']}
          required={'VYRON-6.1.18-arm64.dmg','VYRON-6.1.18-arm64.dmg.sha256','VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig','source-head.txt'}
          assert required <= names
          assert m['version']=='6.1.18' and set(m['platforms'])=={'darwin-aarch64'}
          assert '/v6.1.18/VYRON.app.tar.gz' in m['platforms']['darwin-aarch64']['url']
          print('VYRON_6_1_18_MACOS_RELEASE=PASS')
          PY
