name: VYRON 6.1.12 Signed Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - infra/vyron-6.1.12-build-only
    paths:
      - '.github/workflows/vyron-612-every-n-days-build-only.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-612-signed-production-release
  cancel-in-progress: false

env:
  VERSION: '6.1.12'
  SOURCE_SHA: '919c18c2e56658262f4e8df695ae6ee302e679ab'
  RELEASE_REPO: 'ScaleUPPeisov/vyron-releases'
  RELEASE_TAG: 'v6.1.12'
  BUNDLE_ID: 'studio.channelflow.desktop'
  EXPECTED_SIGNING_CERT_SHA1: '2C8B0BD4EE1C000D29DD0667BF1068D4673692C9'

jobs:
  release-gate:
    name: Exact SHA, signing inputs and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
      VYRON_RELEASES_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact product SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$SOURCE_SHA"
          echo "ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          echo 'EXACT_SHA_VERIFIED=YES'

      - name: Verify established signing and publication inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD VYRON_MACOS_SIGNING_P12_BASE64 VYRON_MACOS_SIGNING_P12_PASSWORD VYRON_MACOS_SIGNING_IDENTITY VYRON_RELEASES_TOKEN; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=AVAILABLE"
            else
              echo "$name=MISSING"
              missing=1
            fi
          done
          test "$missing" -eq 0
          echo 'ALL_REQUIRED_RELEASE_INPUTS=AVAILABLE'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify 6.1.12 release identity and updater contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const p=require('./package.json');
          const l=require('./package-lock.json');
          const t=require('./src-tauri/tauri.conf.json');
          const v=process.env.VERSION;
          if(p.version!==v||l.version!==v||l.packages?.['']?.version!==v||t.version!==v) process.exit(2);
          if(t.identifier!=='studio.channelflow.desktop'||t.bundle.createUpdaterArtifacts!==true) process.exit(3);
          if(!Array.isArray(t.plugins?.updater?.endpoints)||t.plugins.updater.endpoints.length<2) process.exit(4);
          NODE
          grep -q '^version = "6.1.12"$' src-tauri/Cargo.toml
          python3 - <<'PY'
          import pathlib,re
          lock=pathlib.Path('src-tauri/Cargo.lock').read_text()
          blocks=lock.split('[[package]]')
          hit=[b for b in blocks if re.search(r'(?m)^name\s*=\s*"channelflow"\s*$',b)]
          assert len(hit)==1 and re.search(r'(?m)^version\s*=\s*"6\.1\.12"\s*$',hit[0])
          PY
          echo 'VERSION_IDENTITY=PASS'
          echo 'UPDATER_CONTRACT=PASS'

      - name: Focused accepted release tests
        run: >
          npx vitest run
          src/rpmCoverage.test.ts
          src/vyron618PublisherIntegrity.test.ts
          src/publishWorkspaceState.interval.test.ts
          src/publisherSchedule.test.ts
          src/scheduleContinuation.test.ts

      - name: Production frontend build
        run: npm run build

      - name: Verify tracked product source clean
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo 'PRODUCTION_BUILD=PASS'
          echo 'SOURCE_TREE_CLEAN=YES'

  macos-signed:
    name: macOS ARM64 signed production package
    needs: release-gate
    runs-on: macos-14
    timeout-minutes: 75
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$SOURCE_SHA"
          echo "ACTUAL_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          test -n "$VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$VYRON_MACOS_SIGNING_P12_BASE64"
          test -n "$VYRON_MACOS_SIGNING_P12_PASSWORD"
          test -n "$VYRON_MACOS_SIGNING_IDENTITY"
          echo 'EXACT_SHA_VERIFIED=YES'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund

      - name: Import established production Apple signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/vyron-612-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-612-release.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo 'MACOS_CODE_SIGNING=PASS'

      - name: Canonicalize established Tauri updater key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              cur=candidates[-1].strip()
              try: dec=base64.b64decode(cur,validate=True).decode().strip()
              except Exception: break
              if dec in candidates: break
              candidates.append(dec)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY
          echo 'TAURI_UPDATER_SIGNING_KEY=READY'

      - name: Build signed macOS ARM64 package and updater bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p release-mac
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee release-mac/codesign-details.txt
          ! grep -F 'Signature=adhoc' release-mac/codesign-details.txt
          hdiutil verify "$DMG"
          cp "$DMG" "release-mac/VYRON-${VERSION}-arm64.dmg"
          cp "$UPDATER" release-mac/VYRON.app.tar.gz
          cp "$SIG" release-mac/VYRON.app.tar.gz.sig
          shasum -a 256 "release-mac/VYRON-${VERSION}-arm64.dmg" | awk '{print $1}' > "release-mac/VYRON-${VERSION}-arm64.dmg.sha256"
          shasum -a 256 release-mac/VYRON.app.tar.gz | awk '{print $1}' > release-mac/VYRON.app.tar.gz.sha256
          printf '%s\n' "$SOURCE_SHA" > release-mac/source-head.txt
          echo 'MACOS_PACKAGE=PASS'

      - name: Verify macOS Tauri updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def dec(raw):
              x=raw.strip()
              try:
                  y=base64.b64decode(x,validate=True)
                  if y.startswith(b'untrusted comment:'): return y
              except Exception: pass
              return x.encode()+b'\n' if isinstance(x,str) else x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(dec(str(conf['plugins']['updater']['pubkey'])))
          Path('/tmp/mac.sig').write_bytes(dec(Path('release-mac/VYRON.app.tar.gz.sig').read_text()))
          PY
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm release-mac/VYRON.app.tar.gz -x /tmp/mac.sig -p /tmp/vyron.pub
          echo 'MACOS_UPDATER_SIGNING=PASS'
          echo 'UPDATER_SIGNATURE=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.12-MAC-SIGNED
          path: release-mac/**
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-612-release.p12"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; fi

  windows-signed:
    name: Windows x64 signed updater production package
    needs: release-gate
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source and updater signing inputs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          Write-Host "EXPECTED_SHA=$env:SOURCE_SHA"
          Write-Host "ACTUAL_SHA=$actual"
          if($actual -ne $env:SOURCE_SHA){throw 'SOURCE_SHA_MISMATCH'}
          if([string]::IsNullOrWhiteSpace($env:VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW)){throw 'TAURI_SIGNING_PRIVATE_KEY_MISSING'}
          if([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)){throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD_MISSING'}
          Write-Host 'EXACT_SHA_VERIFIED=YES'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund

      - name: Canonicalize established Tauri updater key
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              cur=candidates[-1].strip()
              try: dec=base64.b64decode(cur,validate=True).decode().strip()
              except Exception: break
              if dec in candidates: break
              candidates.append(dec)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'UPDATER_KEY_CANONICALIZATION_FAILED'}
          Write-Host 'TAURI_UPDATER_SIGNING_KEY=READY'

      - name: Build Windows x64 NSIS package and updater signature
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_BUILD_FAILED'}
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS_MISSING'}
          $sig=Get-Item ($installer.FullName + '.sig') -ErrorAction Stop
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          Copy-Item $installer.FullName release-windows/VYRON_6.1.12_x64-setup.exe
          Copy-Item $sig.FullName release-windows/VYRON_6.1.12_x64-setup.exe.sig
          (Get-FileHash release-windows/VYRON_6.1.12_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content release-windows/VYRON_6.1.12_x64-setup.exe.sha256
          $env:SOURCE_SHA | Set-Content release-windows/source-head.txt
          Write-Host 'WINDOWS_NSIS=PASS'

      - name: Verify Windows Tauri updater signature
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $verifyRoot=Join-Path $env:RUNNER_TEMP 'vyron-signature-verify'
          New-Item -ItemType Directory -Force -Path (Join-Path $verifyRoot 'src') | Out-Null
          @'
          [package]
          name = "vyron-signature-verify"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          base64 = "0.22"
          minisign-verify = "=0.2.5"
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'Cargo.toml')
          @'
          use base64::{engine::general_purpose::STANDARD, Engine as _};
          use minisign_verify::{PublicKey, Signature};
          use std::{env,fs};
          fn decode(encoded:&str)->String{String::from_utf8(STANDARD.decode(encoded.trim()).unwrap()).unwrap()}
          fn main(){
            let a:Vec<String>=env::args().collect(); assert_eq!(a.len(),4);
            let artifact=fs::read(&a[1]).unwrap();
            let sig=decode(&fs::read_to_string(&a[2]).unwrap());
            let conf=fs::read_to_string(&a[3]).unwrap();
            let marker="\"pubkey\": \""; let start=conf.find(marker).unwrap()+marker.len();
            let tail=&conf[start..]; let end=tail.find('\"').unwrap();
            let pk=PublicKey::decode(&decode(&tail[..end])).unwrap();
            let sg=Signature::decode(&sig).unwrap();
            pk.verify(&artifact,&sg,true).unwrap();
            println!("WINDOWS_UPDATER_SIGNATURE=PASS");
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $verifyRoot 'src/main.rs')
          cargo run --quiet --release --manifest-path (Join-Path $verifyRoot 'Cargo.toml') -- release-windows/VYRON_6.1.12_x64-setup.exe release-windows/VYRON_6.1.12_x64-setup.exe.sig src-tauri/tauri.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_SIGNATURE_VERIFY_FAILED'}
          Write-Host 'WINDOWS_UPDATER_SIGNING=PASS'
          Write-Host 'UPDATER_SIGNATURE=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.12-WINDOWS-SIGNED
          path: release-windows/**
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish signed VYRON 6.1.12 and updater manifests
    needs: [macos-signed, windows-signed]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - name: Verify publication credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$GH_TOKEN" ]]; then echo 'VYRON_RELEASES_TOKEN=AVAILABLE'; else echo 'VYRON_RELEASES_TOKEN=MISSING'; exit 41; fi

      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.12-MAC-SIGNED
          path: release-mac
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.12-WINDOWS-SIGNED
          path: release-windows

      - name: Verify signed release artifact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < release-mac/source-head.txt)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < release-windows/source-head.txt)" = "$SOURCE_SHA"
          test -s "release-mac/VYRON-${VERSION}-arm64.dmg"
          test -s release-mac/VYRON.app.tar.gz
          test -s release-mac/VYRON.app.tar.gz.sig
          test -s release-windows/VYRON_6.1.12_x64-setup.exe
          test -s release-windows/VYRON_6.1.12_x64-setup.exe.sig
          test "$(sha256sum "release-mac/VYRON-${VERSION}-arm64.dmg" | awk '{print $1}')" = "$(tr -d '\r\n ' < "release-mac/VYRON-${VERSION}-arm64.dmg.sha256")"
          test "$(sha256sum release-mac/VYRON.app.tar.gz | awk '{print $1}')" = "$(tr -d '\r\n ' < release-mac/VYRON.app.tar.gz.sha256)"
          test "$(sha256sum release-windows/VYRON_6.1.12_x64-setup.exe | awk '{print $1}')" = "$(tr -d '\r\n ' < release-windows/VYRON_6.1.12_x64-setup.exe.sha256)"
          echo 'SIGNED_RELEASE_ARTIFACTS=PASS'

      - name: Confirm v6.1.12 does not already exist
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo 'V6_1_12_RELEASE_ALREADY_EXISTS'
            exit 42
          fi
          echo 'RELEASE_TAG_AVAILABLE=YES'

      - name: Reverify both updater signatures on publication runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          curl -fsSL "https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/${SOURCE_SHA}/src-tauri/tauri.conf.json" -o /tmp/tauri.conf.json
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('/tmp/tauri.conf.json'))
          def dec(raw:bytes)->bytes:
              x=raw.strip()
              try:
                  y=base64.b64decode(x,validate=True)
                  if y.startswith(b'untrusted comment:'): return y
              except Exception: pass
              return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(dec(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/mac.sig').write_bytes(dec(Path('release-mac/VYRON.app.tar.gz.sig').read_bytes()))
          Path('/tmp/win.sig').write_bytes(dec(Path('release-windows/VYRON_6.1.12_x64-setup.exe.sig').read_bytes()))
          PY
          minisign -Vm release-mac/VYRON.app.tar.gz -x /tmp/mac.sig -p /tmp/vyron.pub
          minisign -Vm release-windows/VYRON_6.1.12_x64-setup.exe -x /tmp/win.sig -p /tmp/vyron.pub
          echo 'BOTH_UPDATER_SIGNATURES_REVERIFIED=PASS'

      - name: Publish VYRON 6.1.12 signed release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/release-notes.md <<EOF
          ## VYRON 6.1.12

          - Adds interval-based YouTube publishing (Every N Days) with existing per-channel workspace persistence.
          - Includes the narrow 6.1.12 build fixes for RPM narrowing and the legacy Publisher fixture.
          - macOS ARM64 package is Apple code-signed and the Tauri updater bundle is cryptographically signed.
          - Windows x64 NSIS package has a cryptographically signed Tauri updater artifact.
          - Product source: ${SOURCE_SHA}
          - Full legacy suite remains at the owner-accepted pre-existing unrelated failure state; focused release gates and production build passed.
          EOF
          printf '%s\n' "$SOURCE_SHA" >/tmp/VYRON-6.1.12-source.txt
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" \
            --title 'VYRON 6.1.12' \
            --notes-file /tmp/release-notes.md \
            "release-mac/VYRON-${VERSION}-arm64.dmg" \
            "release-mac/VYRON-${VERSION}-arm64.dmg.sha256" \
            release-mac/VYRON.app.tar.gz \
            release-mac/VYRON.app.tar.gz.sig \
            release-mac/VYRON.app.tar.gz.sha256 \
            release-windows/VYRON_6.1.12_x64-setup.exe \
            release-windows/VYRON_6.1.12_x64-setup.exe.sig \
            release-windows/VYRON_6.1.12_x64-setup.exe.sha256 \
            /tmp/VYRON-6.1.12-source.txt
          echo 'RELEASE_ASSETS=PUBLISHED'

      - name: Promote macOS and Windows updater manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          MAC_SIG="$(tr -d '\r\n' < release-mac/VYRON.app.tar.gz.sig)"
          WIN_SIG="$(tr -d '\r\n' < release-windows/VYRON_6.1.12_x64-setup.exe.sig)"
          MAC_SHA="$(tr -d '\r\n ' < release-mac/VYRON.app.tar.gz.sha256)"
          WIN_SHA="$(tr -d '\r\n ' < release-windows/VYRON_6.1.12_x64-setup.exe.sha256)"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$MAC_SIG" "$WIN_SIG" "$MAC_SHA" "$WIN_SHA" "$PUB_DATE" <<'PY'
          import json,sys
          from pathlib import Path
          mac_sig,win_sig,mac_sha,win_sha,pub=sys.argv[1:6]
          base='https://github.com/ScaleUPPeisov/vyron-releases/releases/download/v6.1.12'
          mac={
            'version':'6.1.12',
            'notes':'VYRON 6.1.12 — Every N Days publishing + build fixes',
            'pub_date':pub,
            'platforms':{'darwin-aarch64':{
              'url':base+'/VYRON.app.tar.gz','signature':mac_sig,'sha256':mac_sha
            }}
          }
          win={
            'version':'6.1.12',
            'notes':'VYRON 6.1.12 — Every N Days publishing + build fixes',
            'pub_date':pub,
            'platforms':{'windows-x86_64':{
              'url':base+'/VYRON_6.1.12_x64-setup.exe','signature':win_sig,'sha256':win_sha
            }}
          }
          Path('/tmp/latest.json').write_text(json.dumps(mac,indent=2,ensure_ascii=False)+'\n')
          Path('/tmp/windows-latest.json').write_text(json.dumps(win,indent=2,ensure_ascii=False)+'\n')
          PY
          for spec in 'updates/latest.json:/tmp/latest.json' 'updates/windows-latest.json:/tmp/windows-latest.json'; do
            path="${spec%%:*}"; file="${spec#*:}"
            current_sha="$(gh api "repos/${RELEASE_REPO}/contents/${path}?ref=main" --jq .sha)"
            content="$(base64 -w0 "$file")"
            gh api -X PUT "repos/${RELEASE_REPO}/contents/${path}" \
              -f message="release(vyron): promote 6.1.12 updater feed" \
              -f content="$content" \
              -f sha="$current_sha" \
              -f branch=main >/dev/null
          done
          echo 'UPDATER_MANIFEST=PASS'
          echo 'UPDATE_PUBLISHED=YES'

      - name: Final factual remote release audit
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json tagName,name,body,assets >/tmp/release.json
          test "$(jq -r .tagName /tmp/release.json)" = "$RELEASE_TAG"
          grep -F "$SOURCE_SHA" /tmp/release.json >/dev/null
          for asset in \
            "VYRON-${VERSION}-arm64.dmg" \
            'VYRON.app.tar.gz' \
            'VYRON.app.tar.gz.sig' \
            'VYRON_6.1.12_x64-setup.exe' \
            'VYRON_6.1.12_x64-setup.exe.sig' \
            'VYRON-6.1.12-source.txt'; do
            jq -e --arg n "$asset" '.assets[]|select(.name==$n)' /tmp/release.json >/dev/null
          done
          gh api "repos/${RELEASE_REPO}/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/remote-mac.json
          gh api "repos/${RELEASE_REPO}/contents/updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/remote-win.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          mac=json.load(open('/tmp/remote-mac.json'))
          win=json.load(open('/tmp/remote-win.json'))
          assert mac['version']=='6.1.12'
          assert win['version']=='6.1.12'
          mp=mac['platforms']['darwin-aarch64']
          wp=win['platforms']['windows-x86_64']
          assert mp['url'].endswith('/v6.1.12/VYRON.app.tar.gz')
          assert wp['url'].endswith('/v6.1.12/VYRON_6.1.12_x64-setup.exe')
          assert mp['signature']==Path('release-mac/VYRON.app.tar.gz.sig').read_text().strip()
          assert wp['signature']==Path('release-windows/VYRON_6.1.12_x64-setup.exe.sig').read_text().strip()
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert mp['sha256']==sha('release-mac/VYRON.app.tar.gz')
          assert wp['sha256']==sha('release-windows/VYRON_6.1.12_x64-setup.exe')
          print('REMOTE_MANIFEST_AUDIT=PASS')
          PY
          echo "MAC_DMG_SIZE=$(stat -c %s "release-mac/VYRON-${VERSION}-arm64.dmg")"
          echo "MAC_UPDATER_SIZE=$(stat -c %s release-mac/VYRON.app.tar.gz)"
          echo "WINDOWS_EXE_SIZE=$(stat -c %s release-windows/VYRON_6.1.12_x64-setup.exe)"
          echo 'RELEASE_STATUS=PUBLISHED_AND_VERIFIED'
          echo 'PUBLISHED_VERSION=6.1.12'
          echo "PUBLISHED_PRODUCT_SHA=$SOURCE_SHA"
