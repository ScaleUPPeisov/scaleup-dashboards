name: VYRON 6.1.12 Every N Days Build Only

on:
  workflow_dispatch:
  push:
    branches:
      - infra/vyron-6.1.12-build-only
    paths:
      - '.github/workflows/vyron-612-every-n-days-build-only.yml'

permissions:
  contents: read
  actions: read

env:
  FINAL_SHA: 919c18c2e56658262f4e8df695ae6ee302e679ab
  PACKAGE_RUN_ID: '39351295227'

jobs:
  inspect-artifacts:
    name: Inspect final packaged artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.12-MAC-FINAL
          path: downloaded/mac
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.12-WINDOWS-FINAL
          path: downloaded/windows
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Inspect exact files, sizes and source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'MAC_FILES_BEGIN'
          find downloaded/mac -maxdepth 3 -type f -printf '%p|%s\n' | sort
          echo 'MAC_FILES_END'
          echo 'WINDOWS_FILES_BEGIN'
          find downloaded/windows -maxdepth 2 -type f -printf '%p|%s\n' | sort
          echo 'WINDOWS_FILES_END'
          MAC_DMG="downloaded/mac/VYRON-6.1.12-arm64.dmg"
          WIN_EXE="downloaded/windows/VYRON_6.1.12_x64-setup.exe"
          test -s "$MAC_DMG"
          test -s "$WIN_EXE"
          MAC_DMG_SIZE="$(stat -c %s "$MAC_DMG")"
          WIN_EXE_SIZE="$(stat -c %s "$WIN_EXE")"
          MAC_SOURCE="$(tr -d '\r\n' < downloaded/mac/source-head.txt)"
          WIN_SOURCE="$(tr -d '\r\n' < downloaded/windows/source-head.txt)"
          echo "MAC_DMG_SIZE=$MAC_DMG_SIZE"
          echo "WINDOWS_EXE_SIZE=$WIN_EXE_SIZE"
          echo "MAC_SOURCE_SHA=$MAC_SOURCE"
          echo "WINDOWS_SOURCE_SHA=$WIN_SOURCE"
          test "$MAC_SOURCE" = "$FINAL_SHA"
          test "$WIN_SOURCE" = "$FINAL_SHA"
          if [[ -d downloaded/mac/VYRON.app ]]; then
            APP_BYTES="$(du -sb downloaded/mac/VYRON.app | awk '{print $1}')"
            echo "MAC_APP_DIRECTORY_BYTES=$APP_BYTES"
          fi
          echo 'ARTIFACT_INSPECTION=PASS'
