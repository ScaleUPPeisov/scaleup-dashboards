name: VYRON 6.1.2 Mobile Sync Sidecar CI

on:
  push:
    branches:
      - feature/vyron-6.1.2-mobile-sync
    paths:
      - 'src/mobileSyncBridge.ts'
      - 'src/mobileSyncBridge.test.ts'
      - 'src/main.tsx'
      - 'src-tauri/src/mobile_sync.rs'
      - 'src-tauri/src/lib.rs'
      - '.github/workflows/vyron-612-mobile-sync-sidecar-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-612-mobile-sync-sidecar-ci
  cancel-in-progress: true

env:
  SOURCE_BASE: 656d740dd9a1195fced39e025eaf0cb51c5ead3c

jobs:
  protected-qa:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact source and protected byte continuity
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$SOURCE_BASE" HEAD
          test "$(node -p "require('./package.json').version")" = "6.1.2"
          git diff --exit-code "$SOURCE_BASE"...HEAD --             src-tauri/src/oauth_vault.rs             src-tauri/src/security.rs             src-tauri/src/youtube.rs             src-tauri/src/metadata_queue.rs             src-tauri/src/materials_manager.rs             src-tauri/src/production_manager.rs             src-tauri/src/updater_bridge.rs             src/MaterialsManager.tsx             src/ManualAssembly.tsx             src/PublisherOS.tsx             src/publisherRuntime.ts             src/channelRunwayCore.ts             src/renderInventoryRuntime.ts             src/store.ts
          echo PROTECTED_BYTES=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Frontend production build
        run: npm run build
      - name: Sync and protected regressions
        run: >
          npx vitest run
          src/mobileSyncBridge.test.ts
          src/v612NativeInventoryTruth.test.ts
          src/v611ChannelRunwayInventoryHotfix.test.ts
          src/v610MetadataQueue.test.ts
          src/v610PublisherInventoryReconcile.test.ts
          src/youtubePublishSafety.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
      - name: Protected command contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'materials_manager::import_production_material_images' src-tauri/src/lib.rs
          grep -F 'production_manager::build_manual_production_batch' src-tauri/src/lib.rs
          grep -F 'production_manager::open_production_batch_in_endlume' src-tauri/src/lib.rs
          grep -F 'youtube::youtube_upload_video' src-tauri/src/lib.rs
          grep -F 'updater_bridge::updater_stable_check' src-tauri/src/lib.rs
          echo PROTECTED_COMMANDS=PASS
      - name: Rust mobile sync tests
        run: cargo test --manifest-path src-tauri/Cargo.toml mobile_sync --lib -- --nocapture
      - name: Rust full library QA
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - name: Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

  cross-platform-compile:
    needs: protected-qa
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml


  candidate-macos:
    name: Signed macOS ARM64 acceptance candidate
    needs: [protected-qa, cross-platform-compile]
    runs-on: macos-14
    timeout-minutes: 75
    env:
      EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact candidate source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "$SOURCE_BASE" HEAD
          test "$(node -p "require('./package.json').version")" = "6.1.2"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci --no-audit --no-fund
      - name: Import production signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VYRON_MACOS_SIGNING_P12_BASE64"
          test -n "$VYRON_MACOS_SIGNING_P12_PASSWORD"
          test -n "$VYRON_MACOS_SIGNING_IDENTITY"
          KEYCHAIN="$RUNNER_TEMP/vyron-mobile-sync-candidate.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-mobile-sync-candidate.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "APPLE_SIGNING_IDENTITY=$VYRON_MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed non-release candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$APP" -a -d "$APP"
          test -n "$DMG" -a -f "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ! codesign -dv --verbose=4 "$APP" 2>&1 | grep -F 'Signature=adhoc'
          mkdir -p acceptance-candidate
          cp "$DMG" acceptance-candidate/VYRON-6.1.2-mobile-sync-acceptance-arm64.dmg
          shasum -a 256 acceptance-candidate/VYRON-6.1.2-mobile-sync-acceptance-arm64.dmg > acceptance-candidate/SHA256.txt
          printf 'SOURCE_HEAD=%s\nVERSION=6.1.2\nSIGNED=PASS\nRELEASED=NO\n' "$GITHUB_SHA" > acceptance-candidate/gate-summary.txt
      - name: Upload acceptance candidate only
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.2-MOBILE-SYNC-MACOS-ACCEPTANCE
          path: acceptance-candidate/
          retention-days: 5
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vyron-mobile-sync-candidate.p12"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; fi
