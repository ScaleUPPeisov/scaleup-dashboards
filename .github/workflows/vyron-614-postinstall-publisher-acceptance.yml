name: VYRON 6.1.4 Post-Install Publisher Acceptance

on:
  push:
    branches:
      - hotfix/vyron-6.1.4-publisher-inventory-selection
    paths:
      - '.github/workflows/vyron-614-postinstall-publisher-acceptance.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-614-postinstall-publisher-acceptance
  cancel-in-progress: true

env:
  SOURCE_HEAD: 81391d65977eaee5ee823ce51799a1fc5877b149
  RELEASE_RUN_ID: '37192470833'
  RELEASE_REPO: ScaleUPPeisov/vyron-releases

jobs:
  post-install-publisher:
    name: Post-install Publisher 21-file acceptance
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Verify actual updater gates already passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${{ github.repository }}/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 - "$RUNNER_TEMP/jobs.json" <<'PY'
          import json,sys
          jobs=json.load(open(sys.argv[1]))['jobs']
          wanted={
            'Realistic updater 6.1.3 -> 6.1.4 (user-applications)',
            'Realistic updater 6.1.3 -> 6.1.4 (system-duplicate)',
            'Final remote verification and promote v6.1.4',
          }
          got={j['name']:j.get('conclusion') for j in jobs}
          for name in wanted:
              assert got.get(name)=='success',(name,got.get(name))
          print('ACTUAL_UPDATER_613_TO_614=PASS')
          print('FINAL_PROMOTE_614=PASS')
          PY
          gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/latest.json"
          python3 - "$RUNNER_TEMP/latest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['version']=='6.1.4'
          assert set(d['platforms'])=={'darwin-aarch64','windows-x86_64'}
          print('PRODUCTION_MANIFEST_614=PASS')
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - name: Verify exact product source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');if(p.version!=='6.1.4'||t.version!=='6.1.4')process.exit(2)"
          echo EXACT_PRODUCT_HEAD=PASS

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Exact 21-file / 10-failed Publisher acceptance
        run: >
          npx vitest run
          src/v614PublisherPhysicalInventoryHotfix.test.ts
          src/v610PublisherInventoryReconcile.test.ts
          src/v610PublisherColdRoute.test.ts
          src/v610GlobalUploadCounter.test.ts
          src/youtubePublishSafety.test.ts

      - name: Assert required post-install product contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/PublisherOS.tsx').read_text()
          r=Path('src/renderInventoryRuntime.ts').read_text()
          rec=Path('src/publisherInventoryReconcile.ts').read_text()
          picker=Path('src/PublisherVideoPicker.tsx').read_text()
          tests=Path('src/v610PublisherInventoryReconcile.test.ts').read_text()
          assert "canonicalSelectedJobs(allChannelJobs,draft.selectedIds)" in p
          assert "const valid=new Set(selectableJobs.map(j=>j.id))" not in p
          assert "checked={p.selectedIds.includes(j.id)}" in picker
          assert "storageLifecycle==='FAILED')return false" not in r
          assert "publisherCurrentPhysicalSize" in p
          assert "Размер не удалось прочитать" in p
          for marker in (
              '[foldersOpen,setFoldersOpen]=useState(true)',
              '[recoveryOpen,setRecoveryOpen]=useState(true)',
              '[metadataOpen,setMetadataOpen]=useState(true)',
              '[thumbnailOpen,setThumbnailOpen]=useState(true)',
              '[scheduleOpen,setScheduleOpen]=useState(true)',
              '[cleanupOpen,setCleanupOpen]=useState(true)',
          ): assert marker in p
          for source in (r,rec):
              assert 'youtubeListExisting(' not in source
              assert 'youtubeUploadVideo(' not in source
              assert 'videos.insert' not in source
          assert "fresh scan restores 10 failed known physical jobs and creates only 11 truly new jobs" in tests
          assert "expect(ready).toHaveLength(21)" in tests
          assert "expect(selectable(all,ready)).toHaveLength(21)" in tests
          assert "0.49" in tests
          print('SELECTION_PERSISTENCE=PASS')
          print('FAILED_PHYSICAL_FILE_RECOVERY=PASS')
          print('FILE_SIZE_CURRENT_PHYSICAL=PASS')
          print('KNOWN_FILE_RECONCILIATION=PASS')
          print('PANELS_DEFAULT_AVAILABLE=PASS')
          print('LOCAL_RECONCILIATION_YOUTUBE_API_REQUESTS=0')
          print('POST_INSTALL_PUBLISHER_ACCEPTANCE=PASS')
          PY
