# VYRON 6.1.7 current generation leaf repair hotfix
# release trigger: verify exact 6.1.7 product head 635c47a9a7031cee53dbc7c042432e99ce5e9230
name: VYRON 6.1.7 Current Generation Repair

on:
  push:
    branches:
      - hotfix/vyron-6.1.7-publisher-current-generation-repair
    paths:
      - '.github/workflows/vyron-617-current-generation-repair.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-617-current-generation-repair
  cancel-in-progress: true

env:
  SOURCE_HEAD: fea356db6828d360a3491fcde4dd9f5467532d4a
  VERSION: '6.1.7'
  TAG: v6.1.7
  BASELINE_VERSION: '6.1.6'
  BASELINE_SOURCE: 635c47a9a7031cee53dbc7c042432e99ce5e9230
  RELEASE_REPO: ScaleUPPeisov/vyron-releases
  BUNDLE_ID: studio.channelflow.desktop
  EXECUTABLE: channelflow
  EXPECTED_SIGNING_CERT_SHA1: 2C8B0BD4EE1C000D29DD0667BF1068D4673692C9

jobs:
  qa:
    name: Exact-head QA
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');for(const v of [p.version,t.version])if(v!=='6.1.7')process.exit(2);if(t.identifier!=='studio.channelflow.desktop'||t.bundle.createUpdaterArtifacts!==true)process.exit(3)"
          grep -q '^version = "6.1.7"$' src-tauri/Cargo.toml
          echo EXACT_HEAD=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Frontend production build
        run: npm run build
      - name: Full frontend legacy audit
        id: fullnpm
        continue-on-error: true
        run: npm test
      - name: Classify historical contract drift
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.fullnpm.outcome }}" != "success" ]; then
            echo "FULL_NPM_LEGACY_AUDIT=KNOWN_HISTORICAL_CONTRACT_DRIFT"
            echo "Current release gate is the explicit 6.1.7 protected regression set below."
          else
            echo "FULL_NPM_LEGACY_AUDIT=PASS"
          fi
      - name: Protected targeted regressions
        run: >
          npx vitest run
          src/v612NativeInventoryStress.test.ts
          src/v612NativeInventoryTruth.test.ts
          src/v610ChannelRunwayFleetRefresh.test.ts
          src/channelRunway.test.ts
          src/channelSchedule.test.ts
          src/v610MetadataQueue.test.ts
          src/v610PublisherInventoryReconcile.test.ts
          src/v614PublisherPhysicalInventoryHotfix.test.ts
          src/vyron615PublisherHotfix.test.ts
          src/vyron616PhysicalPublisherConsistency.test.ts
          src/vyron617PublisherGenerationChain.test.ts
          src/v610PublisherColdRoute.test.ts
          src/v610ChannelRunwayFleetRefresh.test.ts
          src/v610GlobalUploadCounter.test.ts
          src/v503UploadCounterRestore.test.ts
          src/youtubePublishSafety.test.ts
          src/uploadQueue.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/v501LocalCleanupZeroQuota.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
      - name: Rust full library QA
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - name: Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

  migration:
    name: Migration ${{ matrix.name }}
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Core migration regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml migration::tests -- --nocapture
      - name: Metadata Queue migration/idempotency regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml metadata_queue::tests -- --nocapture
      - name: Migration source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          q=Path('src-tauri/src/metadata_queue.rs').read_text()
          m=Path('src-tauri/src/migration.rs').read_text()
          assert 'status_never_moves_applied_backwards' in q
          assert 'deleted":0' in q or 'deleted\":0' in q
          assert 'backup_to' in q and 'restore_from' in q
          assert 'merge_portable_snapshot' in m
          print('MIGRATION_IDEMPOTENT=PASS')
          print('METADATA_APPLIED_NEVER_REGRESSES=PASS')
          PY

  upload-reliability:
    name: Upload reliability
    needs: qa
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Counter / queue / upload regressions
        run: >
          npx vitest run
          src/v610GlobalUploadCounter.test.ts
          src/v503UploadCounterRestore.test.ts
          src/youtubePublishSafety.test.ts
          src/uploadQueue.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/v501LocalCleanupZeroQuota.test.ts
          src/v2115Rc7OauthUpdateContinuity.test.ts
          src/vyron615PublisherHotfix.test.ts
          src/vyron616PhysicalPublisherConsistency.test.ts
          src/vyron617PublisherGenerationChain.test.ts
      - name: Native upload transport regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml youtube_write_tests::tags_respect_youtube_500_budget -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml youtube_write_tests::tags_dedupe_and_strip_angle_brackets -- --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml v211_upload_transport_tests -- --nocapture
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src-tauri/src/youtube.rs').read_text()
          body=s[s.index('async fn continue_persisted_upload'):s.index('#[tauri::command]\npub async fn youtube_upload_video')]
          assert 'resumable_status(&client, &session.session_url, token, session.total)' in body
          assert 'set_upload_session_offset(app, &session.job_id, offset)' in body
          assert '.header(\n                    "Content-Range",' in body
          assert 'UPLOAD_INTERRUPTED' in body
          t=Path('src/v610GlobalUploadCounter.test.ts').read_text()
          for marker in ('DUPLICATE:', 'RESTART:', 'UPDATE:'):
              assert marker in t
          r=Path('src/v503UploadCounterRestore.test.ts').read_text()
          assert 'does not increment on failed upload' in r
          assert 'deduplicates a successful video already present in the publish ledger' in r
          helper=Path('src/youtubeMetadataValidation.ts').read_text()
          runtime=Path('src/uploadQueueRuntime.ts').read_text()
          publisher=Path('src/PublisherOS.tsx').read_text()
          reconcile=Path('src/publisherInventoryReconcile.ts').read_text()
          inventory=Path('src/renderInventoryRuntime.ts').read_text()
          consistency=Path('src/vyron616PhysicalPublisherConsistency.test.ts').read_text()
          chain=Path('src/vyron617PublisherGenerationChain.test.ts').read_text()
          assert 'YOUTUBE_TAG_EFFECTIVE_LIMIT = 500' in helper
          assert 'Math.max(0, tags.length - 1)' in helper
          assert "retryableYoutubeMetadataState(error,acceptedVideoId)" in runtime
          assert "storageLifecycle:retryableMetadata.storageLifecycle" in runtime
          assert "setSessionHiddenIds" in publisher
          assert "removedFromPublishList:true});await api.youtubeCancelUploadSession" not in publisher
          assert "removedFromPublishList:false" in reconcile
          assert "currentPhysicalUploadEligible" in reconcile
          assert "reconcilePublisherInventory" in inventory
          assert "const fresh=useApp.getState()" in inventory
          assert "20 READY / 19 ERROR" in consistency
          assert "Aegean 20 ready / 19 errors" in chain
          assert "sourcePreviousJobId" in chain
          assert "prefer current generation leaf" in Path('src/renderScanClassifier.ts').read_text().lower()
          print('PHYSICAL_READY_PUBLISHER_CONSISTENCY=PASS')
          print('INVALID_TAGS_SANITATION=PASS')
          print('INVALID_TAGS_RETRY_STATE=PASS')
          print('HIDE_SESSION_ONLY=PASS')
          print('LEGACY_HIDE_RECOVERY=PASS')
          print('RESUMABLE_RETRY=PASS')
          print('STALE_CONTENT_RANGE_REGRESSION=PASS')
          print('GLOBAL_100_VIDEO_COUNTER=PASS')
          print('FAILED_UPLOAD_NO_INCREMENT=PASS')
          print('DUPLICATE_VIDEO_ID_NO_INCREMENT=PASS')
          print('RESTART_UPDATE_PERSISTENCE=PASS')
          PY

  mac-build:
    name: macOS ARM64 signed build
    needs: [migration, upload-reliability]
    runs-on: macos-14
    timeout-minutes: 180
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VYRON_MACOS_SIGNING_P12_BASE64: ${{ secrets.VYRON_MACOS_SIGNING_P12_BASE64 }}
      VYRON_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.VYRON_MACOS_SIGNING_P12_PASSWORD }}
      VYRON_MACOS_SIGNING_IDENTITY: ${{ secrets.VYRON_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Import production signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VYRON_MACOS_SIGNING_P12_BASE64"
          test -n "$VYRON_MACOS_SIGNING_P12_PASSWORD"
          test -n "$VYRON_MACOS_SIGNING_IDENTITY"
          KEYCHAIN="$RUNNER_TEMP/vyron-610-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/vyron-610-release.p12"
          printf '%s' "$VYRON_MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$VYRON_MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "$LOGIN_KEYCHAIN"
          ID_SHA1="$(security find-certificate -Z -c "$VYRON_MACOS_SIGNING_IDENTITY" "$KEYCHAIN" 2>/dev/null | awk '/SHA-1 hash:/{print $3; exit}')"
          test "$(printf '%s' "$ID_SHA1" | tr '[:lower:]' '[:upper:]')" = "$EXPECTED_SIGNING_CERT_SHA1"
          echo "VYRON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "VYRON_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Canonicalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              cur=candidates[-1].strip()
              try: dec=base64.b64decode(cur,validate=True).decode().strip()
              except Exception: break
              if dec in candidates: break
              candidates.append(dec)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain,'TAURI_SIGNING_PRIVATE_KEY_FORMAT_UNRECOGNIZED'
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY
      - name: Build signed macOS ARM64
        shell: bash
        run: |
          set -Eeuo pipefail
          security unlock-keychain -p "$VYRON_SIGNING_KEYCHAIN_PASSWORD" "$VYRON_SIGNING_KEYCHAIN"
          export APPLE_SIGNING_IDENTITY="$VYRON_MACOS_SIGNING_IDENTITY"
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          mkdir -p release-mac
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          UPDATER="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)"
          SIG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)"
          test -d "$APP"; test -s "$DMG"; test -s "$UPDATER"; test -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee release-mac/codesign-details.txt
          ! grep -F 'Signature=adhoc' release-mac/codesign-details.txt
          hdiutil verify "$DMG"
          cp "$DMG" release-mac/VYRON-6.1.7-arm64.dmg
          cp "$UPDATER" release-mac/VYRON.app.tar.gz
          cp "$SIG" release-mac/VYRON.app.tar.gz.sig
          shasum -a 256 release-mac/VYRON-6.1.7-arm64.dmg | awk '{print $1}' > release-mac/VYRON-6.1.7-arm64.dmg.sha256
          shasum -a 256 release-mac/VYRON.app.tar.gz | awk '{print $1}' > release-mac/VYRON.app.tar.gz.sha256
          echo "$SOURCE_HEAD" > release-mac/source-head.txt
      - name: Verify mac updater signature
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def dec(raw):
              x=raw.strip()
              try:
                  y=base64.b64decode(x,validate=True)
                  if y.startswith(b'untrusted comment:'): return y
              except Exception: pass
              return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(dec(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/mac.sig').write_bytes(dec(Path('release-mac/VYRON.app.tar.gz.sig').read_bytes()))
          PY
          brew list minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm release-mac/VYRON.app.tar.gz -x /tmp/mac.sig -p /tmp/vyron.pub
          echo MAC_SIGNATURE=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.7-MAC
          path: release-mac/**
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/vyron-610-release.p12"
          if [[ -n "${VYRON_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$VYRON_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; fi

  windows-build:
    name: Windows x64 signed build
    needs: [migration, upload-reliability]
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Canonicalize updater signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,os
          raw=os.environ['VYRON_TAURI_SIGNING_PRIVATE_KEY_RAW'].strip().replace('\\r\\n','\n').replace('\\n','\n')
          candidates=[raw]
          for _ in range(5):
              cur=candidates[-1].strip()
              try: dec=base64.b64decode(cur,validate=True).decode().strip()
              except Exception: break
              if dec in candidates: break
              candidates.append(dec)
          plain=next((x for x in candidates if x.startswith('untrusted comment:')),None)
          assert plain
          canonical=base64.b64encode((plain.rstrip()+'\n').encode()).decode()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('TAURI_SIGNING_PRIVATE_KEY='+canonical+'\n')
          print('::add-mask::'+canonical)
          PY
      - name: Build Windows x64 NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_BUILD_FAILED'}
          $installer=Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS_MISSING'}
          $sig=Get-Item ($installer.FullName+'.sig') -ErrorAction Stop
          New-Item -ItemType Directory -Force release-win | Out-Null
          Copy-Item $installer.FullName release-win/VYRON_6.1.7_x64-setup.exe
          Copy-Item $sig.FullName release-win/VYRON_6.1.7_x64-setup.exe.sig
          (Get-FileHash release-win/VYRON_6.1.7_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content release-win/VYRON_6.1.7_x64-setup.exe.sha256
          "$env:SOURCE_HEAD" | Set-Content release-win/source-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-6.1.7-WINDOWS
          path: release-win/**
          if-no-files-found: error
          retention-days: 30

  release-assets:
    name: Publish release assets first
    needs: [mac-build, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.7-MAC
          path: release-mac
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.7-WINDOWS
          path: release-win
      - name: Verify checksums and updater signatures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat release-mac/source-head.txt | tr -d '\r\n')" = "$SOURCE_HEAD"
          test "$(cat release-win/source-head.txt | tr -d '\r\n')" = "$SOURCE_HEAD"
          test "$(sha256sum release-mac/VYRON-6.1.7-arm64.dmg | awk '{print $1}')" = "$(tr -d '\r\n ' < release-mac/VYRON-6.1.7-arm64.dmg.sha256)"
          test "$(sha256sum release-mac/VYRON.app.tar.gz | awk '{print $1}')" = "$(tr -d '\r\n ' < release-mac/VYRON.app.tar.gz.sha256)"
          test "$(sha256sum release-win/VYRON_6.1.7_x64-setup.exe | awk '{print $1}')" = "$(tr -d '\r\n ' < release-win/VYRON_6.1.7_x64-setup.exe.sha256)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          conf=json.load(open('src-tauri/tauri.conf.json'))
          def dec(raw):
              x=raw.strip()
              try:
                  y=base64.b64decode(x,validate=True)
                  if y.startswith(b'untrusted comment:'): return y
              except Exception: pass
              return x+b'\n'
          Path('/tmp/vyron.pub').write_bytes(dec(str(conf['plugins']['updater']['pubkey']).encode()))
          Path('/tmp/mac.sig').write_bytes(dec(Path('release-mac/VYRON.app.tar.gz.sig').read_bytes()))
          Path('/tmp/win.sig').write_bytes(dec(Path('release-win/VYRON_6.1.7_x64-setup.exe.sig').read_bytes()))
          PY
          minisign -Vm release-mac/VYRON.app.tar.gz -x /tmp/mac.sig -p /tmp/vyron.pub
          minisign -Vm release-win/VYRON_6.1.7_x64-setup.exe -x /tmp/win.sig -p /tmp/vyron.pub
          echo MAC_SIGNATURE=PASS
          echo WINDOWS_SIGNATURE=PASS
      - name: Verify clean 6.1.7 release slot
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            IS_PRERELEASE="$(gh release view "$TAG" --repo "$RELEASE_REPO" --json isPrerelease --jq .isPrerelease)"
            if [ "$IS_PRERELEASE" = "false" ]; then
              echo "STABLE_V6_1_4_ALREADY_EXISTS"
              exit 42
            fi
          fi
      - name: Create GitHub release and upload all assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$RELEASE_REPO" --json isPrerelease --jq .isPrerelease)" = "true"
            gh release delete "$TAG" --repo "$RELEASE_REPO" --yes
            echo OLD_PRERELEASE_REMOVED=PASS
          fi
          cat >/tmp/release-notes.md <<'EOF'
          ## VYRON 6.1.7
          
          VYRON 6.1.7 Publisher hotfix for current-generation leaf recovery when legacy predecessor jobs share the same physical Render path. Exact source HEAD is recorded and verified by the release workflow.
          
          - Metadata Queue and migration protections preserved.
          - Channel Runway preserved with native-disk Existing Videos inventory storage and verified legacy-cache migration.
          - Publisher upload reliability and global 100-video counter preserved.
          - Materials, Manual Assembly and ENDLUME integration preserved.
          - OAuth, Client ID/Secret, Keychain, refresh tokens and YouTube profiles unchanged.
          EOF
          gh release create "$TAG" --repo "$RELEASE_REPO" --prerelease --title "VYRON 6.1.7" --notes-file /tmp/release-notes.md             release-mac/VYRON-6.1.7-arm64.dmg             release-mac/VYRON-6.1.7-arm64.dmg.sha256             release-mac/VYRON.app.tar.gz             release-mac/VYRON.app.tar.gz.sha256             release-mac/VYRON.app.tar.gz.sig             release-win/VYRON_6.1.7_x64-setup.exe             release-win/VYRON_6.1.7_x64-setup.exe.sha256             release-win/VYRON_6.1.7_x64-setup.exe.sig
      - name: Verify release assets remotely
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$RELEASE_REPO/releases/tags/$TAG" >/tmp/release.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/release.json'))
          assert d['tag_name']=='v6.1.7' and not d['draft'] and d['prerelease']
          req={
            'VYRON-6.1.7-arm64.dmg','VYRON-6.1.7-arm64.dmg.sha256',
            'VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig',
            'VYRON_6.1.7_x64-setup.exe','VYRON_6.1.7_x64-setup.exe.sha256','VYRON_6.1.7_x64-setup.exe.sig'
          }
          assets={x['name']:x for x in d['assets']}
          assert req <= set(assets)
          assert all(assets[n]['size']>0 for n in req)
          print('RELEASE_ASSETS_REMOTE=PASS')
          PY
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON-6.1.7-arm64.dmg" -o /tmp/mac-byte >/dev/null
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON_6.1.7_x64-setup.exe" -o /tmp/win-byte >/dev/null
          echo MAC_DOWNLOAD=PASS
          echo WINDOWS_DOWNLOAD=PASS

  manifests:
    name: Publish updater manifests last
    needs: release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.7-MAC
          path: release-mac
      - uses: actions/download-artifact@v4
        with:
          name: VYRON-6.1.7-WINDOWS
          path: release-win
      - name: Verify production baseline then publish manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:$GH_TOKEN@github.com/$RELEASE_REPO.git" release-repo
          python3 - <<'PY'
          import json
          mac=json.load(open('release-repo/updates/latest.json'))
          win=json.load(open('release-repo/updates/windows-latest.json'))
          assert mac['version']=='6.1.6',mac['version']
          assert win['version']=='6.1.6',win['version']
          print('UPDATER_BASELINE_6_1_3=PASS')
          PY
          MAC_SIG="$(tr -d '\r\n' < release-mac/VYRON.app.tar.gz.sig)"
          WIN_SIG="$(tr -d '\r\n' < release-win/VYRON_6.1.7_x64-setup.exe.sig)"
          MAC_SHA="$(tr -d '\r\n ' < release-mac/VYRON.app.tar.gz.sha256)"
          WIN_SHA="$(tr -d '\r\n ' < release-win/VYRON_6.1.7_x64-setup.exe.sha256)"
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$MAC_SIG" "$WIN_SIG" "$MAC_SHA" "$WIN_SHA" "$PUB_DATE" <<'PY'
          import json,sys
          from pathlib import Path
          mac_sig,win_sig,mac_sha,win_sha,pub=sys.argv[1:6]
          assert len(mac_sha)==64 and len(win_sha)==64
          repo='ScaleUPPeisov/vyron-releases'
          notes='VYRON 6.1.7 publisher current-generation recovery hotfix'
          latest={'version':'6.1.7','notes':notes,'pub_date':pub,'platforms':{
            'darwin-aarch64':{'url':f'https://github.com/{repo}/releases/download/v6.1.7/VYRON.app.tar.gz','signature':mac_sig,'sha256':mac_sha},
            'windows-x86_64':{'url':f'https://github.com/{repo}/releases/download/v6.1.7/VYRON_6.1.7_x64-setup.exe','signature':win_sig,'sha256':win_sha}}}
          windows={'version':'6.1.7','notes':notes,'pub_date':pub,'platforms':{
            'windows-x86_64':{'url':f'https://github.com/{repo}/releases/download/v6.1.7/VYRON_6.1.7_x64-setup.exe','signature':win_sig,'sha256':win_sha}}}
          Path('release-repo/updates/latest.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n')
          Path('release-repo/updates/windows-latest.json').write_text(json.dumps(windows,ensure_ascii=False,indent=2)+'\n')
          PY
          cd release-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json updates/windows-latest.json
          git commit -m 'release: publish VYRON 6.1.7 updater manifests'
          git push origin main
      - name: Verify manifests through GitHub API
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/latest.json
          gh api "repos/$RELEASE_REPO/contents/updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/windows.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/latest.json'));w=json.load(open('/tmp/windows.json'))
          assert a['version']=='6.1.7'
          assert set(a['platforms'])=={'darwin-aarch64','windows-x86_64'}
          assert w['version']=='6.1.7'
          assert set(w['platforms'])=={'windows-x86_64'}
          print('LATEST_JSON=6.1.7')
          print('WINDOWS_LATEST_JSON=6.1.7')
          PY

  updater-realistic:
    name: Realistic updater 6.1.6 -> 6.1.7 (${{ matrix.mode }})
    needs: manifests
    strategy:
      fail-fast: false
      matrix:
        mode: [system-duplicate, user-applications]
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SOURCE }}
          fetch-depth: 0
      - name: Verify exact 6.1.6 baseline and public signed release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SOURCE"
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');if(p.version!=='6.1.6'||t.version!=='6.1.6'||t.identifier!=='studio.channelflow.desktop')process.exit(2)"
          curl -fsSL "https://github.com/$RELEASE_REPO/releases/download/v6.1.6/VYRON-6.1.6-arm64.dmg.sha256" -o "$RUNNER_TEMP/611.sha"
          curl -fL "https://github.com/$RELEASE_REPO/releases/download/v6.1.6/VYRON-6.1.6-arm64.dmg" -o "$RUNNER_TEMP/611.dmg"
          test "$(shasum -a 256 "$RUNNER_TEMP/611.dmg" | awk '{print $1}')" = "$(tr -d '\r\n ' <"$RUNNER_TEMP/611.sha")"
          echo PUBLIC_6_1_3_BASELINE=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Build exact-6.1.6 updater harness
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > src/App.tsx <<'TS'
          import React,{useEffect} from 'react';
          import {useUpdaterRuntime} from './updaterRuntime';
          export function App(){
            useEffect(()=>{
              void (async()=>{
                const s=useUpdaterRuntime.getState();
                await s.bootstrapVersion();
                await s.check({force:true});
                let x=useUpdaterRuntime.getState();
                if(x.currentVersion!=='6.1.6'||x.latestVersion!=='6.1.7'||x.status!=='AVAILABLE')throw new Error('UPDATER_DISCOVERY_FAILED:'+JSON.stringify({current:x.currentVersion,latest:x.latestVersion,status:x.status}));
                localStorage.setItem('vyron:realistic-updater-smoke','6.1.6->6.1.7');
                await x.download();
                x=useUpdaterRuntime.getState();
                if(x.status!=='READY_TO_INSTALL')throw new Error('UPDATER_DOWNLOAD_FAILED:'+JSON.stringify({status:x.status,error:x.errorMessage}));
                const ok=await x.installAndRestart([]);
                if(!ok)throw new Error('UPDATER_INSTALL_FAILED:'+JSON.stringify(useUpdaterRuntime.getState()));
              })().catch(e=>{console.error(e);document.documentElement.setAttribute('data-updater-smoke-error',String(e))})
            },[]);
            return <main>VYRON realistic updater 6.1.6 → 6.1.7</main>
          }
          TS
          npm run build
          export APPLE_SIGNING_IDENTITY='-'
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          SRC_APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          test -d "$SRC_APP"
          echo "SRC_APP=$SRC_APP" >> "$GITHUB_ENV"
      - name: Install realistic baseline path and optional duplicate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/Applications"
          rm -rf "$HOME/Applications/VYRON.app"
          sudo rm -rf /Applications/VYRON.app
          if [ "${{ matrix.mode }}" = "system-duplicate" ]; then
            sudo cp -R "$SRC_APP" /Applications/VYRON.app
            sudo chown -R "$(id -u):$(id -g)" /Applications/VYRON.app
            cp -R "$SRC_APP" "$HOME/Applications/VYRON.app"
            TARGET_APP=/Applications/VYRON.app
            DUPLICATE_APP="$HOME/Applications/VYRON.app"
          else
            cp -R "$SRC_APP" "$HOME/Applications/VYRON.app"
            TARGET_APP="$HOME/Applications/VYRON.app"
            DUPLICATE_APP=""
          fi
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$TARGET_APP/Contents/Info.plist")" = "6.1.6"
          OLD_SHA="$(shasum -a 256 "$TARGET_APP/Contents/MacOS/$EXECUTABLE" | awk '{print $1}')"
          echo "TARGET_APP=$TARGET_APP" >> "$GITHUB_ENV"
          echo "DUPLICATE_APP=$DUPLICATE_APP" >> "$GITHUB_ENV"
          echo "OLD_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          if [ -n "$DUPLICATE_APP" ]; then
            DUP_OLD_SHA="$(shasum -a 256 "$DUPLICATE_APP/Contents/MacOS/$EXECUTABLE" | awk '{print $1}')"
            echo "DUP_OLD_SHA=$DUP_OLD_SHA" >> "$GITHUB_ENV"
          fi
      - name: Seed OAuth/data continuity sentinels outside app bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_DATA="$HOME/Library/Application Support/studio.channelflow.desktop"
          ROOT="$RUNNER_TEMP/vyron-realistic-fixture"
          rm -rf "$APP_DATA" "$HOME/Documents/VYRON"
          mkdir -p "$APP_DATA/Auth" "$HOME/Documents/VYRON/State" "$HOME/Documents/VYRON/MetadataQueue/release-proof" "$ROOT"
          python3 scripts/v501_candidate_fixture.py seed "$APP_DATA/state.json" "$ROOT"
          printf '%s\n' '{"profileUuid":"PROFILE_01","channelId":"UC0000000000000000000001","secretValuesIncluded":false}' > "$APP_DATA/Auth/updater-continuity-sentinel.json"
          printf '%s\n' '{"schemaVersion":1,"status":"APPLIED","youtubeVideoId":"release-proof-video","marker":"VYRON-612-LEDGER"}' > "$HOME/Documents/VYRON/MetadataQueue/release-proof/ledger.json"
          shasum -a 256 "$APP_DATA/Auth/updater-continuity-sentinel.json" | awk '{print $1}' > "$RUNNER_TEMP/oauth.before.sha"
          shasum -a 256 "$HOME/Documents/VYRON/MetadataQueue/release-proof/ledger.json" | awk '{print $1}' > "$RUNNER_TEMP/ledger.before.sha"
          printf '%s\n' '{"valid":true,"type":"owner-lifetime","expiresAt":null,"maskedKey":"CI-UPDATER-612","activatedAt":"2026-10-03T00:00:00Z"}' > "$APP_DATA/license.json"
      - name: Perform actual 6.1.6 updater from target installation
        shell: bash
        run: |
          set -Eeuo pipefail
          BIN="$TARGET_APP/Contents/MacOS/$EXECUTABLE"
          python3 - "$BIN" "$RUNNER_TEMP/updater-611.log" <<'PY'
          import subprocess,sys
          bin_path,log_path=sys.argv[1:3]
          with open(log_path,'wb') as log:
              p=subprocess.Popen([bin_path],stdout=log,stderr=subprocess.STDOUT)
              try: rc=p.wait(timeout=240)
              except subprocess.TimeoutExpired:
                  p.terminate()
                  try:p.wait(timeout=5)
                  except subprocess.TimeoutExpired:p.kill()
                  raise SystemExit('UPDATER_611_PROCESS_TIMEOUT')
              if rc not in (0,None): raise SystemExit(f'UPDATER_611_EXIT={rc}')
          PY
      - name: Verify exact updated path, hash, duplicate isolation and runtime process
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$TARGET_APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$TARGET_APP/Contents/Info.plist")" = "6.1.7"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$TARGET_APP/Contents/Info.plist")" = "$BUNDLE_ID"
          NEW_SHA="$(shasum -a 256 "$TARGET_APP/Contents/MacOS/$EXECUTABLE" | awk '{print $1}')"
          test "$NEW_SHA" != "$OLD_SHA"
          codesign --verify --deep --strict "$TARGET_APP"
          python3 - "$TARGET_APP/Contents/MacOS/$EXECUTABLE" "$DUPLICATE_APP" <<'PY'
          import subprocess,sys
          expected=sys.argv[1];duplicate=sys.argv[2] if len(sys.argv)>2 else ''
          out=subprocess.check_output(['/bin/ps','-axo','pid=,command='],text=True)
          commands=[line.strip().split(None,1)[1] for line in out.splitlines() if len(line.strip().split(None,1))==2]
          assert any(cmd==expected or cmd.startswith(expected+' ') for cmd in commands),(expected,commands[-40:])
          if duplicate:
              dup=duplicate+'/Contents/MacOS/channelflow'
              assert not any(cmd==dup or cmd.startswith(dup+' ') for cmd in commands),dup
          print('EXACT_RUNNING_EXECUTABLE_PATH=PASS')
          PY
          if [ -n "$DUPLICATE_APP" ]; then
            test "$(plutil -extract CFBundleShortVersionString raw -o - "$DUPLICATE_APP/Contents/Info.plist")" = "6.1.6"
            test "$(shasum -a 256 "$DUPLICATE_APP/Contents/MacOS/$EXECUTABLE" | awk '{print $1}')" = "$DUP_OLD_SHA"
            echo DUPLICATE_COPY_NOT_LAUNCHED=PASS
          fi
          APP_DATA="$HOME/Library/Application Support/studio.channelflow.desktop"
          test "$(shasum -a 256 "$APP_DATA/Auth/updater-continuity-sentinel.json" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/oauth.before.sha")"
          test "$(shasum -a 256 "$HOME/Documents/VYRON/MetadataQueue/release-proof/ledger.json" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/ledger.before.sha")"
          python3 - "$APP_DATA/state.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert len(d.get('channels',[]))==32
          assert d['channels'][0].get('youtubeProfileId')=='PROFILE_01'
          assert d['channels'][0].get('youtubeChannelId')
          assert d.get('fingerprintCache',{}).get('fixture-fp',{}).get('size')==19
          assert d.get('projectLifecycle',{}).get('fixture-project',{}).get('status')=='RENDERED'
          print('OAUTH_DATA_CONTINUITY=PASS')
          print('PRODUCT_STATE_CONTINUITY=PASS')
          PY
          pkill -f "^$TARGET_APP/Contents/MacOS/$EXECUTABLE" >/dev/null 2>&1 || true
          echo "REALISTIC_${{ matrix.mode }}=PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-6.1.7-REALISTIC-UPDATER-${{ matrix.mode }}
          path: ${{ runner.temp }}/updater-611.log
          if-no-files-found: warn
          retention-days: 30

  rollback-manifests:
    name: Roll back updater manifests if realistic Mac fails
    needs: [manifests,updater-realistic]
    if: always() && needs.manifests.result == 'success' && needs.updater-realistic.result != 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - name: Revert only the 6.1.7 manifest promotion
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:$GH_TOKEN@github.com/$RELEASE_REPO.git" release-repo
          cd release-repo
          test "$(git log -1 --pretty=%s)" = "release: publish VYRON 6.1.7 updater manifests"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit HEAD
          git push origin main
          echo MANIFEST_ROLLBACK_TO_6_1_4=PASS

  final-remote:
    name: Final remote verification and promote v6.1.7
    needs: [updater-realistic]
    if: needs.updater-realistic.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.VYRON_RELEASES_TOKEN }}
    steps:
      - name: Promote prerelease only after realistic updater PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release edit "$TAG" --repo "$RELEASE_REPO" --prerelease=false
          gh api "repos/$RELEASE_REPO/releases/tags/$TAG" >/tmp/release.json
          gh api "repos/$RELEASE_REPO/contents/updates/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/latest.json
          gh api "repos/$RELEASE_REPO/contents/updates/windows-latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/windows.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/release.json'));a=json.load(open('/tmp/latest.json'));w=json.load(open('/tmp/windows.json'))
          assert r['tag_name']=='v6.1.7' and r['name']=='VYRON 6.1.7'
          assert not r['draft'] and not r['prerelease']
          need={'VYRON-6.1.7-arm64.dmg','VYRON-6.1.7-arm64.dmg.sha256','VYRON.app.tar.gz','VYRON.app.tar.gz.sha256','VYRON.app.tar.gz.sig','VYRON_6.1.7_x64-setup.exe','VYRON_6.1.7_x64-setup.exe.sha256','VYRON_6.1.7_x64-setup.exe.sig'}
          assert need <= {x['name'] for x in r['assets']}
          assert a['version']=='6.1.7' and set(a['platforms'])=={'darwin-aarch64','windows-x86_64'}
          assert w['version']=='6.1.7' and set(w['platforms'])=={'windows-x86_64'}
          for p in a['platforms'].values(): assert len(p.get('sha256',''))==64
          assert len(w['platforms']['windows-x86_64'].get('sha256',''))==64
          print('VYRON_6_1_6_RELEASED=PASS')
          PY
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON-6.1.7-arm64.dmg" -o /tmp/mac-byte >/dev/null 2>&1
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON.app.tar.gz" -o /tmp/mac-updater-byte >/dev/null 2>&1
          curl -fL --range 0-0 "https://github.com/$RELEASE_REPO/releases/download/$TAG/VYRON_6.1.7_x64-setup.exe" -o /tmp/win-byte >/dev/null 2>&1
          echo FINAL_VYRON_6_1_6_UPDATER_HOTFIX_RELEASED=PASS
