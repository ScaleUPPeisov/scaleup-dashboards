# VYRON 6.1.8 Publisher Integrity candidate QA. Product version remains 6.1.7 until this gate is green.
name: VYRON 6.1.8 Publisher Integrity QA

on:
  push:
    branches:
      - hotfix/vyron-6.1.8-publisher-integrity
    paths:
      - '.github/workflows/vyron-618-publisher-integrity-qa.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: vyron-618-publisher-integrity-qa
  cancel-in-progress: true

env:
  SOURCE_HEAD: 94537bf8e5a2cf407578acb341a5b2918772f565

jobs:
  qa:
    name: macOS candidate QA
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - name: Verify exact product candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');if(p.version!=='6.1.7'||t.version!=='6.1.7')process.exit(2)"
          grep -q '^version = "6.1.7"$' src-tauri/Cargo.toml
          echo CANDIDATE_VERSION_NOT_BUMPED=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: TypeScript production build
        run: npm run build
      - name: 6.1.8 Publisher integrity regressions
        run: >
          npx vitest run
          src/vyron618PublisherIntegrity.test.ts
          src/publisherMetadata.test.ts
          src/uploadQueue.test.ts
          src/v610PublisherColdRoute.test.ts
          src/v610PublisherInventoryReconcile.test.ts
          src/v614PublisherPhysicalInventoryHotfix.test.ts
          src/vyron615PublisherHotfix.test.ts
          src/vyron616PhysicalPublisherConsistency.test.ts
          src/vyron617CurrentGenerationLeafRecovery.test.ts
      - name: Protected global upload regressions
        run: >
          npx vitest run
          src/v610GlobalUploadCounter.test.ts
          src/v503UploadCounterRestore.test.ts
          src/youtubePublishSafety.test.ts
          src/v400QuotaUploadLimitSeparation.test.ts
          src/v501LocalCleanupZeroQuota.test.ts
      - name: Rust library QA
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - name: Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Strict do-not-touch audit
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only b77b65cb3fe5fa504eb58533cba05f51eae2d751 "$SOURCE_HEAD" > /tmp/vyron618-files.txt
          cat /tmp/vyron618-files.txt
          ! grep -Eq '(^|/)(youtube\.rs|keychain|oauth|credential|updater|renderScanClassifier\.ts)$' /tmp/vyron618-files.txt
          git diff --quiet b77b65cb3fe5fa504eb58533cba05f51eae2d751 "$SOURCE_HEAD" -- src/renderScanClassifier.ts
          git diff --quiet b77b65cb3fe5fa504eb58533cba05f51eae2d751 "$SOURCE_HEAD" -- src-tauri/src/youtube.rs
          echo OAUTH_KEYCHAIN_UPLOAD_TRANSPORT_LEAF_RECOVERY_UNTOUCHED=PASS
