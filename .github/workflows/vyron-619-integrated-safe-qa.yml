name: VYRON 6.1.19 integrated fixes safety gates (no release)

on:
  push:
    branches:
      - release-candidate/vyron-619-integrated-safe-20261118
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - '.github/workflows/vyron-619-integrated-safe-qa.yml'

permissions:
  contents: read

concurrency:
  group: vyron-619-integrated-safe-qa
  cancel-in-progress: true

jobs:
  frontend-regression:
    name: All frontend regressions and production compiler
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
      - run: npm run build
      - name: Ensure candidate cannot be treated as signed or released
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "6.1.15"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "6.1.15"
          echo "THIS_IS_NOT_A_RELEASE=PASS"

  rust-linux-safety:
    name: All Rust unit tests on GitHub-hosted Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VYRON_TRUSTED_UPDATER_PUBLIC_KEY_SHA256: unverified
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies for Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run all Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

  macos-arm64-compile:
    name: Cross-check Rust macOS ARM64 compilation (hosted, never owner Mac)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VYRON_TRUSTED_UPDATER_PUBLIC_KEY_SHA256: unverified
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check application for ARM64 macOS without release signing
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
