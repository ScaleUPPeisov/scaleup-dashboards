name: VYRON Final Channel Reconnect Recovery Candidate

on:
  push:
    branches:
      - repair/vyron-native-keychain-diagnostic
    paths:
      - '.github/diagnostic/vyron-auth-reconnect-trigger.txt'

permissions:
  contents: read

concurrency:
  group: vyron-auth-reconnect-candidate
  cancel-in-progress: false

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_TAG: v2.1.2

jobs:
  targeted-auth-recovery:
    name: Final reconnect targeted gate + ARM64 candidate
    runs-on: macos-14
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout repair payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble exact v2.1.2 + validated reconnect + final recovery UX
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vyron-auth-reconnect"
          SRC="$RUNNER_TEMP/vyron-auth-reconnect-source"
          NATIVE="$RUNNER_TEMP/apply_native_repair.py"
          AUTH="$RUNNER_TEMP/apply_auth_recovery.py"
          rm -rf "$ROOT" "$SRC"
          mkdir -p "$ROOT" "$SRC"

          gh release download "$BASE_TAG" --repo "$REPO" --dir "$SRC" \
            --pattern 'VYRON-2.1.2-source.tar.gz' --pattern 'SOURCE_SHA256.txt'
          cd "$SRC"
          expected="$(awk '{print $1}' SOURCE_SHA256.txt)"
          actual="$(shasum -a 256 VYRON-2.1.2-source.tar.gz | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          tar -xzf VYRON-2.1.2-source.tar.gz -C "$ROOT"

          cd "$GITHUB_WORKSPACE"
          cat .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.00 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.01 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02a \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02b \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.03 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.part01 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.part02 \
            | base64 --decode | gunzip > "$NATIVE"
          test "$(shasum -a 256 "$NATIVE" | awk '{print $1}')" = '4196bc3e2199e3e038120f37128eb2d5ccb412177c25436a751b9f5ec53fe7ea'

          cat .github/scripts/vyron_auth_recovery.py.gz.b64.part00 \
              .github/scripts/vyron_auth_recovery.py.gz.b64.part01 \
              .github/scripts/vyron_auth_recovery.py.gz.b64.part02 \
            | base64 --decode | gunzip > "$AUTH"
          test "$(shasum -a 256 "$AUTH" | awk '{print $1}')" = '3f0b2a6311929def43daedaf7bff52c74dbfe0bbfa5b722cf110893ceabb4462'

          python3 "$NATIVE" "$ROOT"
          python3 .github/scripts/apply_native_keychain_compilefix.py "$ROOT"
          python3 .github/scripts/apply_global_keychain_inventory.py "$ROOT"
          python3 "$AUTH" "$ROOT"
          python3 .github/scripts/apply_final_reconnect_recovery.py "$ROOT"

          cd "$ROOT"
          test "$(node -p "require('./package.json').version")" = '2.1.2'
          grep -q 'youtube_oauth_reconnect_existing' src-tauri/src/youtube.rs
          grep -q 'access_type=offline&prompt=consent' src-tauri/src/youtube.rs
          grep -q 'OAUTH_REFRESH_TOKEN_REQUIRED' src-tauri/src/youtube.rs
          grep -q 'WRONG_CHANNEL:' src-tauri/src/youtube.rs
          grep -q 'reconnect_write_readback_with' src-tauri/src/youtube.rs
          grep -q 'Требуется повторное подключение YouTube' src/errorCenter.ts
          grep -q 'Данные канала сохранены. Нужно только снова войти в Google.' src/errorCenter.ts
          grep -q 'resolveOAuthMissingErrors' src/AuthRecoveryCenter.tsx
          grep -q 'Уникальных профилей для входа' src/AuthRecoveryCenter.tsx
          grep -q 'Переподключить следующий' src/AuthRecoveryCenter.tsx
          grep -q 'Восстановление каналов' src/SettingsOS.tsx
          grep -q 'SKIPPED_PAST_DATE' src/PublisherOS.tsx
          if grep -q 'dump-keychain' src-tauri/src/security.rs; then
            echo 'ERROR: shell Keychain enumeration survived native repair'
            exit 1
          fi
          echo 'FINAL MASS RECONNECT SOURCE ASSEMBLY: PASS'

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/vyron-auth-reconnect"
          npm ci --no-audit --no-fund

      - name: Targeted frontend recovery tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/vyron-auth-reconnect"
          npx vitest run src/authRecoveryCore.test.ts src/finalAuthRecoveryUi.test.ts src/v2111PublisherRuntime.test.ts

      - name: Targeted Rust reconnect tests A-G + offline OAuth contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/vyron-auth-reconnect/src-tauri"
          cargo test auth_recovery_targeted_tests --lib -- --nocapture

      - name: Production frontend compile
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/vyron-auth-reconnect"
          npm run build

      - name: Normalize updater signing material for candidate packaging only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key')
          pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          PY

      - name: Build and verify real-Mac ARM64 final reconnect candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vyron-auth-reconnect"
          cd "$ROOT"
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -d "$APP"
          test -s "$DMG"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.2'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          file "$APP/Contents/MacOS/$EXE" | grep -q 'arm64'
          strings "$APP/Contents/MacOS/$EXE" > "$RUNNER_TEMP/vyron-auth-reconnect-strings.txt"
          grep -q 'youtube_oauth_reconnect_existing' "$RUNNER_TEMP/vyron-auth-reconnect-strings.txt"
          grep -q 'OAUTH_REFRESH_TOKEN_REQUIRED' "$RUNNER_TEMP/vyron-auth-reconnect-strings.txt"
          grep -q 'WRONG_CHANNEL' "$RUNNER_TEMP/vyron-auth-reconnect-strings.txt"
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"

          OUT="$GITHUB_WORKSPACE/auth-reconnect-candidate"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$DMG" "$OUT/VYRON-2.1.2-Final-Channel-Reconnect-ARM64.dmg"
          shasum -a 256 "$OUT/VYRON-2.1.2-Final-Channel-Reconnect-ARM64.dmg" > "$OUT/SHA256.txt"
          cat > "$OUT/TARGETED_TEST_REPORT.md" <<'MD'
          # VYRON Final Channel Reconnect Recovery Candidate

          - Existing OAuthProfile UUID preserved: PASS
          - New refresh_token required and stored: PASS
          - Keychain write + readback/rollback: PASS
          - Wrong channel rejected before bind: PASS
          - Missing refresh_token rejected: PASS
          - Duplicate profile not created: PASS
          - Shared channel/profile mapping preserved: PASS
          - 31 channel / 17 profile fixture: PASS
          - Recovery queue advances only after validated success: PASS
          - REFRESH_TOKEN_MISSING user-facing replacement: PASS
          - Old active missing-token Error Center rows resolved after reconnect: PASS
          - Google offline access + prompt=consent: PASS
          - Past-date auto-reschedule / SKIPPED_PAST_DATE preserved: PASS
          - No videos.insert or bulk sync is started by Recovery Center.
          - Stable release/tag/updater publication: NOT PERFORMED
          MD
          cat > "$OUT/READ_ME_FIRST.txt" <<'TXT'
          VYRON 2.1.2 FINAL CHANNEL RECONNECT RECOVERY CANDIDATE
          THIS IS NOT A STABLE RELEASE AND DOES NOT MODIFY THE STABLE UPDATER.

          Open:
          Settings -> YouTube -> Восстановление каналов

          Recovery Center calculates the actual channel -> existing OAuthProfile mapping.
          It queues UNIQUE missing profile UUIDs, not one login per channel.

          Successful reconnect requires:
          - same existing profile UUID
          - new refresh_token from Google
          - token refresh PASS
          - expected YouTube channel_id match
          - Keychain write/readback PASS
          - CONNECTED state
          - old active REFRESH_TOKEN_MISSING error resolved for the recovered profile/tasks
          - next missing profile selected automatically

          No channel/database/schedule/SEO/Production records are recreated or deleted.
          No bulk sync and no videos.insert are started by the Recovery Center.
          TXT
          echo "DMG_SHA256=$(awk '{print $1}' "$OUT/SHA256.txt")"

      - name: Upload final reconnect candidate only
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.2-final-channel-reconnect-candidate
          path: auth-reconnect-candidate/
          if-no-files-found: error
          retention-days: 30
