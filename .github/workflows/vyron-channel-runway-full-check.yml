name: VYRON Channel Runway Full Check — NO RELEASE

on:
  push:
    branches: [vyron-channel-runway-implementation]
    paths: ['vyron-runway-check-trigger.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 70
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4

      - name: Normalize updater keys for validation only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip();once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip();box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key');pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          print('Updater keys: validation-ready')
          PY

      - name: Restore exact released 0.9.9 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vyron-runway-check && mkdir .vyron-runway-check
          curl -fL --retry 3 'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v0.9.9/VYRON-0.9.9-source.tar.gz' -o /tmp/v099.tar.gz
          echo 'ca4415aa175a9126813009df56f7d8e27c7fdf82fb25ca54fe22e0782faef7b7  /tmp/v099.tar.gz' | shasum -a 256 -c -
          tar -xzf /tmp/v099.tar.gz -C .vyron-runway-check
          python3 - <<'PY'
          import json
          from pathlib import Path
          conf=json.loads(Path('.vyron-runway-check/src-tauri/tauri.conf.json').read_text())
          Path('/tmp/vyron-pubkey.txt').write_text(conf['plugins']['updater']['pubkey'].strip())
          Path('/tmp/vyron-identifier.txt').write_text(conf['identifier'])
          PY

      - name: Apply released VYRON 1.0.1 layer
        run: python3 vyron-v100/apply_v100.py .vyron-runway-check

      - name: Snapshot protected systems before Runway patch
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.vyron-runway-check')
          protected=[
            'src/ExistingVideos.tsx','src/MetadataPage.tsx','src/ProductionOS.tsx','src/ProductionWorkspace.tsx',
            'src/SettingsOS.tsx','src/QuotaMeter.tsx','src/youtubeQuota.ts','src/AccountsPage.tsx','src/store.ts',
            'src/autopilotRuntime.ts','src/api.ts','src-tauri/src/youtube.rs','src-tauri/tauri.conf.json','src-tauri/Cargo.toml'
          ]
          out={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in protected}
          Path('/tmp/protected-before.json').write_text(json.dumps(out,sort_keys=True))
          print('Protected snapshot:',len(out),'files')
          PY

      - name: Apply isolated Channel Runway layer
        run: python3 vyron-v100/apply_channel_runway.py .vyron-runway-check

      - name: Verify protected systems are byte-identical
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.vyron-runway-check');before=json.loads(Path('/tmp/protected-before.json').read_text())
          after={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in before}
          changed=[p for p in before if before[p]!=after[p]]
          if changed: raise SystemExit('PROTECTED FILE CHANGED: '+', '.join(changed))
          print('Protected systems unchanged: PASS')
          PY

      - name: Verify immutable app identity and updater trust
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('.vyron-runway-check');conf=json.loads((root/'src-tauri/tauri.conf.json').read_text())
          assert conf['identifier']==Path('/tmp/vyron-identifier.txt').read_text()
          baseline=Path('/tmp/vyron-pubkey.txt').read_text().strip()
          assert conf['plugins']['updater']['pubkey'].strip()==baseline
          assert os.environ['TAURI_UPDATER_PUBLIC_KEY'].strip()==baseline
          assert conf['plugins']['updater']['endpoints']==['https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json']
          print('Identifier/updater trust unchanged: PASS')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .vyron-runway-check/src-tauri
          cache-on-failure: true

      - name: Install JS dependencies
        working-directory: .vyron-runway-check
        run: npm install --no-audit --no-fund

      - name: Frontend tests including Runway
        working-directory: .vyron-runway-check
        run: npm test

      - name: TypeScript production build
        working-directory: .vyron-runway-check
        run: npm run build

      - name: Rust tests
        working-directory: .vyron-runway-check
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Cargo check ARM64
        working-directory: .vyron-runway-check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Zero Quota + Channel Runway static contracts
        working-directory: .vyron-runway-check
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'refreshYoutubeIntelligence' src/App.tsx
          ! grep -R 'youtubeProfileHealth\|refreshChannelAnalytics\|youtubeDiscoverCompetitors' src/ChannelsOS.tsx src/AnalyticsPage.tsx src/CompetitorsPage.tsx src/SettingsOS.tsx
          ! grep -R 'youtubeUpload' src/autopilotRuntime.ts
          ! grep -R 'QuotaMeter' src/App.tsx src/SettingsOS.tsx
          grep -q 'QuotaMeter' src/YouTubeCenter.tsx
          grep -q 'ChannelRunway' src/YouTubeCenter.tsx
          grep -q 'ChannelRunwayRuntime' src/App.tsx
          grep -q 'vyron:channel-runway:v1' src/channelRunway.ts
          grep -q 'Asia/Krasnoyarsk' src/channelRunway.ts
          grep -q '06:00 Asia/Krasnoyarsk' src/ChannelRunway.tsx
          grep -q '0 API units' src/ChannelRunway.tsx
          grep -q 'vyron:existing-cache:v1:' src/channelRunway.ts
          grep -q 'ESTIMATED_VIDEO_WRITE_UNITS' src/channelRunway.ts
          ! grep -R "from './api'\|api\.\|invoke(\|youtubeListExisting\|youtubeUpdateExisting\|youtubeProfileHealth\|refreshChannelAnalytics\|youtubeDiscoverCompetitors" src/channelRunway.ts src/ChannelRunway.tsx src/ChannelRunwayRuntime.tsx
          grep -q 'existing-cache:v1' src/ExistingVideos.tsx
          grep -q 'metadata-draft:v1' src/MetadataPage.tsx
          grep -q 'production-workspace:v1' src/ProductionWorkspace.tsx
          ! grep -q 'setTimeout(()=>void sync(),350)' src/ExistingVideos.tsx
          ! grep -q 'setTimeout(()=>void loadYoutube(),350)' src/MetadataPage.tsx
          grep -q 'metadata_needed' src-tauri/src/youtube.rs
          grep -q 'chunks(50)' src-tauri/src/youtube.rs
          echo 'Zero Quota + Runway local-only contracts: PASS'

      - name: Prevent updater private key leakage
        working-directory: .vyron-runway-check
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          secret=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip().encode()
          for root in [Path('src'),Path('dist'),Path('src-tauri/src')]:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if p.is_file() and secret and secret in p.read_bytes(): raise SystemExit(f'PRIVATE UPDATER KEY LEAK: {p}')
          print('Private updater key leak scan: PASS')
          PY

      - name: Build signed ARM64 app and DMG — validation only
        working-directory: .vyron-runway-check
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify updater signature against existing VYRON trust key
        working-directory: .vyron-runway-check
        shell: bash
        run: |
          set -euo pipefail
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -n "$UPDATER" && test -s "$UPDATER" && test -n "$SIG" && test -s "$SIG"
          command -v minisign >/dev/null 2>&1 || brew install minisign
          base64 -D -i /tmp/vyron-pubkey.txt -o /tmp/vyron.pub
          base64 -D -i "$SIG" -o /tmp/vyron-runway.minisig
          minisign -Vm "$UPDATER" -p /tmp/vyron.pub -x /tmp/vyron-runway.minisig

      - name: Verify app signature and DMG integrity
        working-directory: .vyron-runway-check
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          test -d "$APP" && test -s "$BIN" && test -s "$DMG"
          file "$BIN" | tee /tmp/runway-bin.txt
          grep -E 'arm64|Mach-O 64-bit executable arm64' /tmp/runway-bin.txt
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          echo 'SIGNED TEST BUILD VERIFIED — NOT PUBLISHED'

      - name: Confirm no release operation exists
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'gh release (create|upload|edit)|git push origin HEAD:main|vyron-updates/latest.json' .github/workflows/vyron-channel-runway-full-check.yml
          echo 'NO RELEASE / NO UPDATER FEED WRITE: PASS'
