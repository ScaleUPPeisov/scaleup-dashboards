name: VYRON CONTROL Cloudflare deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only preflight or explicitly confirmed production deployment"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - deploy

permissions:
  contents: read

concurrency:
  group: vyron-control-cloudflare-production
  cancel-in-progress: false

jobs:
  cloudflare:
    name: Cloudflare preflight / deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/vyron-control
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VYRON_CONTROL_URL: https://vyron-control.endlume-peisov-3ee6109f.workers.dev
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate GitHub Actions credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi
          echo "Cloudflare credential inputs are present. Values are not displayed."

      - name: Install VYRON CONTROL dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Run VYRON CONTROL regression tests
        run: npm test

      - name: Check remote D1 migration state (read-only)
        run: npx --yes wrangler@4.102.0 d1 migrations list vyron-control --remote -c cloudflare/wrangler.jsonc

      - name: Build Worker without deploying
        run: npx --yes wrangler@4.102.0 deploy --dry-run -c cloudflare/wrangler.jsonc

      - name: Block production changes from non-main refs
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production deployment is allowed only from main after PR review and merge."
            exit 1
          fi
          echo "Production deployment requested from main."

      - name: Apply pending additive D1 migrations
        if: ${{ inputs.operation == 'deploy' }}
        run: npx --yes wrangler@4.102.0 d1 migrations apply vyron-control --remote -c cloudflare/wrangler.jsonc

      - name: Deploy Worker and static dashboard assets
        if: ${{ inputs.operation == 'deploy' }}
        run: npx --yes wrangler@4.102.0 deploy -c cloudflare/wrangler.jsonc --keep-vars --strict --message "VYRON CONTROL ${GITHUB_SHA}"

      - name: Verify deployed Worker and D1 schema
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "${VYRON_CONTROL_URL}/api/health")"
          HEALTH_JSON="$body" node --input-type=module -e '
            const health = JSON.parse(process.env.HEALTH_JSON || "{}");
            if (health.ok !== true || health.d1?.schema !== true ||
                health.d1?.expectedTables !== 16 ||
                health.d1?.presentTables !== 16) {
              console.error("Worker health/schema verification failed:", JSON.stringify({
                ok: health.ok, d1: health.d1, error: health.error
              }));
              process.exit(1);
            }
            console.log("Worker healthy; D1 schema verified:", health.d1.presentTables + "/" + health.d1.expectedTables);
          '
