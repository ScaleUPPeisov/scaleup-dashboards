name: VYRON CONTROL — guarded Cloudflare release

on:
  push:
    branches:
      - main
      - feature/vyron-control-cloud-mvp-20261113
      - release/vyron-control-production
    paths:
      - "apps/vyron-control/**"
      - ".github/workflows/vyron-control-cloudflare-release.yml"
      - ".github/vyron-production-approval.json"
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only preflight or confirmed production deployment"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - deploy
      source_ref:
        description: "Reviewed release snapshot (created only after PR #25 is merged)"
        required: true
        type: choice
        default: release/vyron-control-production
        options:
          - release/vyron-control-production
      confirm_production:
        description: "I explicitly authorize applying D1 migrations and deploying production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vyron-control-cloudflare-production
  cancel-in-progress: false

jobs:
  cloudflare:
    name: VYRON CONTROL release preflight / deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/vyron-control
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VYRON_CONTROL_URL: https://vyron-control.endlume-peisov-3ee6109f.workers.dev
      GH_TOKEN: ${{ github.token }}
      SOURCE_REF: ${{ inputs.source_ref || (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name) || 'release/vyron-control-production' }}
      OPERATION: ${{ inputs.operation || (github.event_name == 'push' && github.ref_name == 'main' && contains(github.event.head_commit.message, '[VYRON-PRODUCTION-DEPLOY]') && 'deploy') || 'preflight' }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production || (github.event_name == 'push' && github.ref_name == 'main' && contains(github.event.head_commit.message, '[VYRON-PRODUCTION-DEPLOY]') && 'true') || false }}
    steps:
      - name: Check out the exact release snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name) || 'release/vyron-control-production' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vyron-control/package-lock.json

      - name: Validate release selection and Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" == "deploy" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::Production deployment must originate from main."
              exit 1
            fi
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "${GITHUB_EVENT_NAME}" != "push" ]]; then
              echo "::error::Production deployment requires an explicit manual dispatch or one-time approval commit."
              exit 1
            fi
          fi
          if [[ "${OPERATION}" == "deploy" && "${SOURCE_REF}" != "release/vyron-control-production" ]]; then
            echo "::error::Only the reviewed VYRON CONTROL release snapshot is allowed for production deployment."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi
          echo "Release ref and Cloudflare credential presence validated. Secret values are not displayed."
          echo "Release commit: $(git rev-parse HEAD)"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full VYRON CONTROL regression suite
        run: npm test

      - name: Read remote D1 migration state
        run: npx --yes wrangler@4.102.0 d1 migrations list vyron-control --remote -c cloudflare/wrangler.jsonc

      - name: Read-only D1 schema and row-count audit
        id: d1-audit
        shell: bash
        run: |
          set -euo pipefail
          schema_json="$(npx --yes wrangler@4.102.0 d1 execute vyron-control --remote -c cloudflare/wrangler.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;")"
          D1_SCHEMA_JSON="${schema_json}" node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.D1_SCHEMA_JSON || "[]");
          const rows = results.flatMap(result => Array.isArray(result.results) ? result.results : []);
          const tables = new Set(rows.map(row => String(row.name)));
          const required = [
            "channels","channel_snapshots","events","sync_runs","quota_buckets","devices",
            "commands","channel_analytics","channel_analytics_reports","google_oauth_sessions",
            "google_oauth_profiles","google_oauth_client_credentials","cloud_analytics_runs",
            "channel_analytics_queue","push_subscriptions","push_deliveries"
          ];
          const missing = required.filter(name => !tables.has(name));
          if (missing.length) {
            console.error("D1 schema audit failed; missing tables:", missing.join(", "));
            process.exit(1);
          }
          console.log("D1 schema inventory:", required.length + "/" + required.length + " application tables present.");
          console.log("D1 migration ledger:", tables.has("d1_migrations") ? "present" : "not initialized yet");
          NODE
          COUNTS_SQL="SELECT 'channels' AS table_name, COUNT(*) AS row_count FROM channels;
          SELECT 'channel_snapshots' AS table_name, COUNT(*) AS row_count FROM channel_snapshots;
          SELECT 'events' AS table_name, COUNT(*) AS row_count FROM events;
          SELECT 'sync_runs' AS table_name, COUNT(*) AS row_count FROM sync_runs;
          SELECT 'quota_buckets' AS table_name, COUNT(*) AS row_count FROM quota_buckets;
          SELECT 'devices' AS table_name, COUNT(*) AS row_count FROM devices;
          SELECT 'commands' AS table_name, COUNT(*) AS row_count FROM commands;
          SELECT 'channel_analytics' AS table_name, COUNT(*) AS row_count FROM channel_analytics;
          SELECT 'channel_analytics_reports' AS table_name, COUNT(*) AS row_count FROM channel_analytics_reports;
          SELECT 'google_oauth_sessions' AS table_name, COUNT(*) AS row_count FROM google_oauth_sessions;
          SELECT 'google_oauth_profiles' AS table_name, COUNT(*) AS row_count FROM google_oauth_profiles;
          SELECT 'google_oauth_client_credentials' AS table_name, COUNT(*) AS row_count FROM google_oauth_client_credentials;
          SELECT 'cloud_analytics_runs' AS table_name, COUNT(*) AS row_count FROM cloud_analytics_runs;
          SELECT 'channel_analytics_queue' AS table_name, COUNT(*) AS row_count FROM channel_analytics_queue;
          SELECT 'push_subscriptions' AS table_name, COUNT(*) AS row_count FROM push_subscriptions;
          SELECT 'push_deliveries' AS table_name, COUNT(*) AS row_count FROM push_deliveries;"
          counts_json="$(npx --yes wrangler@4.102.0 d1 execute vyron-control --remote -c cloudflare/wrangler.jsonc --json --command "${COUNTS_SQL}")"
          D1_COUNTS_JSON="${counts_json}" node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          const results = JSON.parse(process.env.D1_COUNTS_JSON || "[]");
          const rows = results.flatMap(result => Array.isArray(result.results) ? result.results : []);
          const counts = Object.fromEntries(rows.map(row => [String(row.table_name), Number(row.row_count)]));
          if (Object.keys(counts).length !== 16 || Object.values(counts).some(value => !Number.isSafeInteger(value) || value < 0)) {
            console.error("D1 row-count audit returned an incomplete or invalid result.");
            process.exit(1);
          }
          if (counts.channels < 33 || counts.google_oauth_profiles < 31) {
            console.error("D1 data baseline is below the verified live dashboard: expected at least 33 channels and 31 OAuth profiles.", JSON.stringify({
              channels: counts.channels, google_oauth_profiles: counts.google_oauth_profiles
            }));
            process.exit(1);
          }
          console.log("D1 row counts (counts only; no row contents or credentials):", JSON.stringify(counts));
          await appendFile(process.env.GITHUB_OUTPUT, "row_counts=" + JSON.stringify(counts) + "\n");
          NODE

      - name: Create deterministic source-SHA release integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)" node browser/release-integrity.mjs build
          sha256sum public/build-info.json
          echo "Public manifest includes only SHA and static asset hashes; no tokens."
      
      - name: Build Cloudflare Worker without deploying
        run: npx --yes wrangler@4.102.0 deploy --dry-run -c cloudflare/wrangler.jsonc

      - name: Require explicit production confirmation and merged application PR
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CONFIRM_PRODUCTION}" != "true" ]]; then
            echo "::error::Production deployment requires confirm_production=true."
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # The approval file must be newly introduced by this exact main commit.
            # Updating or replaying an old approval file cannot authorize another deploy.
            git fetch --no-tags origin main
            if [[ "$(git rev-parse FETCH_HEAD)" != "${GITHUB_SHA}" ]]; then
              echo "::error::Approval commit is no longer the current main head."
              exit 1
            fi
            approval_json="$(git show "${GITHUB_SHA}:.github/vyron-production-approval.json")"
            parent_approval_json='{}'
            if git cat-file -e "${GITHUB_SHA}^1:.github/vyron-production-approval.json" 2>/dev/null; then
              parent_approval_json="$(git show "${GITHUB_SHA}^1:.github/vyron-production-approval.json")"
            fi
            APPROVAL_JSON="${approval_json}" PARENT_APPROVAL_JSON="${parent_approval_json}" RELEASE_SHA="$(git rev-parse HEAD)" node --input-type=module <<'NODE'
          const a=JSON.parse(process.env.APPROVAL_JSON||'{}');
          const previous=JSON.parse(process.env.PARENT_APPROVAL_JSON||'{}');
          if(a.action!=='deploy'||a.application!=='VYRON PEISOV YT'||
             a.release_ref!=='release/vyron-control-production'||
             a.release_sha!==process.env.RELEASE_SHA||a.one_time!==true||
             !a.approval_id||a.approval_id===previous.approval_id||
             a.release_sha===previous.release_sha||
             a.authorized_by!=='user instruction in current conversation')
            throw new Error('One-time production approval must authorize a new exact release SHA with a new approval ID.');
          console.log('One-time user-authorized release marker verified for exact reviewed SHA.');
          NODE
          fi
          neo_merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/55" --jq '.merged')"
          if [[ "${neo_merged}" != "true" ]]; then
            echo "::error::Neo Glass PR #55 must be reviewed and merged before production deployment."
            exit 1
          fi
          neo_base="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/55" --jq '.base.ref')"
          if [[ "${neo_base}" != "feature/vyron-control-cloud-mvp-20261113" ]]; then
            echo "::error::Neo Glass PR #55 target does not match reviewed integration branch."
            exit 1
          fi
          merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/25" --jq '.merged')"
          if [[ "${merged}" != "true" ]]; then
            echo "::error::Application PR #25 must be reviewed and merged before production deployment."
            exit 1
          fi
          base_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/25" --jq '.base.ref')"
          if [[ "${base_ref}" != "feature/vyron-control-cloud-mvp-20261113" ]]; then
            echo "::error::Application PR #25 must be merged into the reviewed VYRON CONTROL integration branch."
            exit 1
          fi
          git fetch --no-tags origin feature/vyron-control-cloud-mvp-20261113
          release_sha="$(git rev-parse HEAD)"
          reviewed_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "${release_sha}" != "${reviewed_sha}" ]]; then
            echo "::error::Release snapshot is stale. Update it to the exact reviewed application branch HEAD before deploying."
            exit 1
          fi
          echo "PR #25 is merged and release snapshot matches the reviewed branch HEAD: ${release_sha}"

      - name: Capture production D1 Time Travel rollback bookmark BEFORE migrating
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          BOOKMARK_RAW="$(npx --yes wrangler@4.102.0 d1 time-travel info vyron-control -c cloudflare/wrangler.jsonc --json)"
          D1_BOOKMARK_JSON="$BOOKMARK_RAW" node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          let parsed;
          try{parsed=JSON.parse(process.env.D1_BOOKMARK_JSON||'{}');}
          catch{throw Error('No JSON Time Travel bookmark: refusing production migration.');}
          const bookmark=parsed.bookmark||parsed.result?.bookmark;
          if(typeof bookmark!=='string'||!/^[0-9a-fA-F-]{25,100}$/.test(bookmark))
            throw Error('D1 Time Travel recovery bookmark not validated: refusing production migration.');
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
            '### Production D1 rollback checkpoint captured\n'+
            'Bookmark: '+bookmark+'\n'+
            'Restore requires separate owner approval and is destructive to subsequent writes.\n');
          console.log('Read-only D1 pre-migration recovery bookmark verified; no restore invoked.');
          NODE
      - name: Verify full production SQL backup export before schema changes
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BACKUP="$(mktemp /tmp/vyron-d1-before-migration-XXXXXXXX.sql)"
          PRIVATE_EXPORT_LOG="$(mktemp /tmp/vyron-d1-export-XXXXXXXX.log)"
          trap 'shred -u "$BACKUP" "$PRIVATE_EXPORT_LOG" 2>/dev/null || rm -f "$BACKUP" "$PRIVATE_EXPORT_LOG"' EXIT
          # Wrangler emits a temporary signed full-DB download URL in its output.
          # The export contains OAuth data: NEVER print/upload stdout, stderr or SQL.
          if ! npx --yes wrangler@4.102.0 d1 export vyron-control --remote --skip-confirmation -c cloudflare/wrangler.jsonc --output="$BACKUP" >"$PRIVATE_EXPORT_LOG" 2>&1; then
            echo "::error::D1 SQL export failed; sensitive export logs intentionally suppressed."
            exit 1
          fi
          D1_BACKUP_PATH="$BACKUP" node --input-type=module <<'NODE'
          import {readFile,stat} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const path=process.env.D1_BACKUP_PATH;
          const size=(await stat(path)).size;
          if(size<256)throw Error('Production SQL export incomplete');
          const sql=await readFile(path,'utf8');
          for(const key of ['channels','google_oauth_profiles','channel_analytics'])
            if(!sql.includes(key))throw Error('SQL export missing table '+key);
          console.log('Private temporary D1 SQL backup verified. Size:',size,
            'sha256:',createHash('sha256').update(sql).digest('hex'));
          console.log('SQL wiped after step; durable recovery is Cloudflare Time Travel.');
          NODE
      - name: Apply additive D1 migrations
        if: ${{ env.OPERATION == 'deploy' }}
        run: npx --yes wrangler@4.102.0 d1 migrations apply vyron-control --remote -c cloudflare/wrangler.jsonc

      - name: Verify D1 application row counts survived migrations
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        env:
          EXPECTED_ROW_COUNTS: ${{ steps.d1-audit.outputs.row_counts }}
        run: |
          set -euo pipefail
          COUNTS_SQL="SELECT 'channels' AS table_name, COUNT(*) AS row_count FROM channels;
          SELECT 'channel_snapshots' AS table_name, COUNT(*) AS row_count FROM channel_snapshots;
          SELECT 'events' AS table_name, COUNT(*) AS row_count FROM events;
          SELECT 'sync_runs' AS table_name, COUNT(*) AS row_count FROM sync_runs;
          SELECT 'quota_buckets' AS table_name, COUNT(*) AS row_count FROM quota_buckets;
          SELECT 'devices' AS table_name, COUNT(*) AS row_count FROM devices;
          SELECT 'commands' AS table_name, COUNT(*) AS row_count FROM commands;
          SELECT 'channel_analytics' AS table_name, COUNT(*) AS row_count FROM channel_analytics;
          SELECT 'channel_analytics_reports' AS table_name, COUNT(*) AS row_count FROM channel_analytics_reports;
          SELECT 'google_oauth_sessions' AS table_name, COUNT(*) AS row_count FROM google_oauth_sessions;
          SELECT 'google_oauth_profiles' AS table_name, COUNT(*) AS row_count FROM google_oauth_profiles;
          SELECT 'google_oauth_client_credentials' AS table_name, COUNT(*) AS row_count FROM google_oauth_client_credentials;
          SELECT 'cloud_analytics_runs' AS table_name, COUNT(*) AS row_count FROM cloud_analytics_runs;
          SELECT 'channel_analytics_queue' AS table_name, COUNT(*) AS row_count FROM channel_analytics_queue;
          SELECT 'push_subscriptions' AS table_name, COUNT(*) AS row_count FROM push_subscriptions;
          SELECT 'push_deliveries' AS table_name, COUNT(*) AS row_count FROM push_deliveries;"
          counts_json="$(npx --yes wrangler@4.102.0 d1 execute vyron-control --remote -c cloudflare/wrangler.jsonc --json --command "${COUNTS_SQL}")"
          EXPECTED_ROW_COUNTS="${EXPECTED_ROW_COUNTS}" D1_COUNTS_JSON="${counts_json}" node --input-type=module <<'NODE'
          const expected = JSON.parse(process.env.EXPECTED_ROW_COUNTS || "{}");
          const results = JSON.parse(process.env.D1_COUNTS_JSON || "[]");
          const rows = results.flatMap(result => Array.isArray(result.results) ? result.results : []);
          const actual = Object.fromEntries(rows.map(row => [String(row.table_name), Number(row.row_count)]));
          const changed = Object.keys(expected).filter(name => actual[name] !== expected[name]);
          if (changed.length) {
            console.error("D1 data preservation check failed:", JSON.stringify({
              changed: Object.fromEntries(changed.map(name => [name, {
                before: expected[name], after: actual[name]
              }]))
            }));
            process.exit(1);
          }
          console.log("D1 data preservation verified: all 16 application-table row counts are unchanged.");
          NODE

      - name: Capture currently active Worker version for non-destructive rollback
        id: previous-worker
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_JSON="$(npx --yes wrangler@4.102.0 deployments status --name vyron-control --json -c cloudflare/wrangler.jsonc)"
          WORKER_JSON="$DEPLOY_JSON" node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          const raw=JSON.parse(process.env.WORKER_JSON||'{}');
          const x=Array.isArray(raw)?raw[0]:raw;
          const versions=(x?.versions||[]).map(v=>v.version_id||v.versionId||v.id).filter(Boolean);
          if(versions.length!==1||!/^[a-f0-9-]{36}$/i.test(versions[0]))
            throw Error('Rollback Worker version not verifiable; refusing deploy');
          await appendFile(process.env.GITHUB_OUTPUT,'version_id='+versions[0]+'\n');
          console.log('Rollback Worker version captured:',versions[0]);
          NODE
      - name: Deploy Worker and static dashboard assets
        id: production-deploy
        if: ${{ env.OPERATION == 'deploy' }}
        run: npx --yes wrangler@4.102.0 deploy -c cloudflare/wrangler.jsonc --keep-vars --strict --message "VYRON CONTROL release $(git rev-parse --short HEAD)"

      - name: Verify deployed Worker and D1 schema
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "${VYRON_CONTROL_URL}/api/health")"
          HEALTH_JSON="${body}" node --input-type=module -e '
            const health = JSON.parse(process.env.HEALTH_JSON || "{}");
            if (health.ok !== true || health.d1?.schema !== true ||
                health.d1?.expectedTables !== 22 ||
                health.d1?.presentTables !== 22) {
              console.error("Worker health/schema verification failed:", JSON.stringify({
                ok: health.ok, d1: health.d1, error: health.error
              }));
              process.exit(1);
            }
            console.log("Worker healthy; D1 schema verified:", health.d1.presentTables + "/" + health.d1.expectedTables);
          '

      - name: Verify exact published Git SHA and static asset integrity
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)" node browser/release-integrity.mjs verify

      - name: Verify active production deployment identifier
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.102.0 deployments status --name vyron-control --json -c cloudflare/wrangler.jsonc |
            node --input-type=module -e '
              let body="";for await(const x of process.stdin)body+=x;
              const raw=JSON.parse(body),v=Array.isArray(raw)?raw[0]:raw;
              const versions=(v.versions||[]).map(x=>x.version_id||x.versionId||x.id).filter(Boolean);
              if(!v.id||versions.length!==1)process.exit(1);
              console.log("RELEASED Worker deployment ID:",v.id,"version ID:",versions[0]);
            '

      - name: Auto-rollback Worker only after a deployed release fails verification
        if: ${{ failure() && env.OPERATION == 'deploy' && steps.production-deploy.outcome == 'success' }}
        shell: bash
        env:
          ROLLBACK_VERSION: ${{ steps.previous-worker.outputs.version_id }}
        run: |
          set -euo pipefail
          test -n "$ROLLBACK_VERSION"
          npx --yes wrangler@4.102.0 rollback "$ROLLBACK_VERSION" --name vyron-control -c cloudflare/wrangler.jsonc --message "Automatic rollback of failed VYRON CONTROL 5.0 release"
          curl --fail --silent --show-error --max-time 30 "${VYRON_CONTROL_URL}/api/health" >/dev/null
          echo "Worker rollback executed; additive D1 schema intentionally remains unchanged."

      - name: Confirm preflight-only run made no production changes
        if: ${{ env.OPERATION == 'preflight' }}
        run: echo "Preflight complete. No D1 migrations were applied and no Worker was deployed."
