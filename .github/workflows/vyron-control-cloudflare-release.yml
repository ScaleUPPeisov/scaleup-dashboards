name: VYRON CONTROL — guarded Cloudflare release

on:
  push:
    branches:
      - main
      - feature/vyron-control-cloud-mvp-20261113
      - release/vyron-control-production
    paths:
      - "apps/vyron-control/**"
      - ".github/workflows/vyron-control-cloudflare-release.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only preflight or confirmed production deployment"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - deploy
      source_ref:
        description: "Reviewed release snapshot (created only after PR #25 is merged)"
        required: true
        type: choice
        default: release/vyron-control-production
        options:
          - release/vyron-control-production
      confirm_production:
        description: "I explicitly authorize applying D1 migrations and deploying production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vyron-control-cloudflare-production
  cancel-in-progress: false

jobs:
  cloudflare:
    name: VYRON CONTROL release preflight / deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/vyron-control
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VYRON_CONTROL_URL: https://vyron-control.endlume-peisov-3ee6109f.workers.dev
      GH_TOKEN: ${{ github.token }}
      SOURCE_REF: ${{ inputs.source_ref || (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name) || 'release/vyron-control-production' }}
      OPERATION: ${{ inputs.operation || 'preflight' }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production || false }}
    steps:
      - name: Check out the exact release snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name) || 'release/vyron-control-production' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vyron-control/package-lock.json

      - name: Validate release selection and Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" == "deploy" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production deployment must be manually dispatched from main."
            exit 1
          fi
          if [[ "${OPERATION}" == "deploy" && "${SOURCE_REF}" != "release/vyron-control-production" ]]; then
            echo "::error::Only the reviewed VYRON CONTROL release snapshot is allowed for production deployment."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi
          echo "Release ref and Cloudflare credential presence validated. Secret values are not displayed."
          echo "Release commit: $(git rev-parse HEAD)"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full VYRON CONTROL regression suite
        run: npm test

      - name: Read remote D1 migration state
        run: npx --yes wrangler@4.102.0 d1 migrations list vyron-control --remote -c cloudflare/wrangler.jsonc

      - name: Read-only D1 schema and row-count audit
        id: d1-audit
        shell: bash
        run: |
          set -euo pipefail
          schema_json="$(npx --yes wrangler@4.102.0 d1 execute vyron-control --remote -c cloudflare/wrangler.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;")"
          D1_SCHEMA_JSON="${schema_json}" node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.D1_SCHEMA_JSON || "[]");
          const rows = results.flatMap(result => Array.isArray(result.results) ? result.results : []);
          const tables = new Set(rows.map(row => String(row.name)));
          const required = [
            "channels","channel_snapshots","events","sync_runs","quota_buckets","devices",
            "commands","channel_analytics","channel_analytics_reports","google_oauth_sessions",
            "google_oauth_profiles","google_oauth_client_credentials","cloud_analytics_runs",
            "channel_analytics_queue","push_subscriptions","push_deliveries"
          ];
          const missing = required.filter(name => !tables.has(name));
          if (missing.length) {
            console.error("D1 schema audit failed; missing tables:", missing.join(", "));
            process.exit(1);
          }
          console.log("D1 schema inventory:", required.length + "/" + required.length + " application tables present.");
          console.log("D1 migration ledger:", tables.has("d1_migrations") ? "present" : "not initialized yet");
          NODE
          COUNTS_SQL="SELECT 'channels' AS table_name, COUNT(*) AS row_count FROM channels
          UNION ALL SELECT 'channel_snapshots', COUNT(*) FROM channel_snapshots
          UNION ALL SELECT 'events', COUNT(*) FROM events
          UNION ALL SELECT 'sync_runs', COUNT(*) FROM sync_runs
          UNION ALL SELECT 'quota_buckets', COUNT(*) FROM quota_buckets
          UNION ALL SELECT 'devices', COUNT(*) FROM devices
          UNION ALL SELECT 'commands', COUNT(*) FROM commands
          UNION ALL SELECT 'channel_analytics', COUNT(*) FROM channel_analytics
          UNION ALL SELECT 'channel_analytics_reports', COUNT(*) FROM channel_analytics_reports
          UNION ALL SELECT 'google_oauth_sessions', COUNT(*) FROM google_oauth_sessions
          UNION ALL SELECT 'google_oauth_profiles', COUNT(*) FROM google_oauth_profiles
          UNION ALL SELECT 'google_oauth_client_credentials', COUNT(*) FROM google_oauth_client_credentials
          UNION ALL SELECT 'cloud_analytics_runs', COUNT(*) FROM cloud_analytics_runs
          UNION ALL SELECT 'channel_analytics_queue', COUNT(*) FROM channel_analytics_queue
          UNION ALL SELECT 'push_subscriptions', COUNT(*) FROM push_subscriptions
          UNION ALL SELECT 'push_deliveries', COUNT(*) FROM push_deliveries
          ORDER BY table_name;"
          counts_json="$(npx --yes wrangler@4.102.0 d1 execute vyron-control --remote -c cloudflare/wrangler.jsonc --json --command "${COUNTS_SQL}")"
          D1_COUNTS_JSON="${counts_json}" node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          const results = JSON.parse(process.env.D1_COUNTS_JSON || "[]");
          const rows = results.flatMap(result => Array.isArray(result.results) ? result.results : []);
          const counts = Object.fromEntries(rows.map(row => [String(row.table_name), Number(row.row_count)]));
          if (Object.keys(counts).length !== 16 || Object.values(counts).some(value => !Number.isSafeInteger(value) || value < 0)) {
            console.error("D1 row-count audit returned an incomplete or invalid result.");
            process.exit(1);
          }
          if (counts.channels < 33 || counts.google_oauth_profiles < 31) {
            console.error("D1 data baseline is below the verified live dashboard: expected at least 33 channels and 31 OAuth profiles.", JSON.stringify({
              channels: counts.channels, google_oauth_profiles: counts.google_oauth_profiles
            }));
            process.exit(1);
          }
          console.log("D1 row counts (counts only; no row contents or credentials):", JSON.stringify(counts));
          await appendFile(process.env.GITHUB_OUTPUT, "row_counts=" + JSON.stringify(counts) + "\n");
          NODE

      - name: Build Cloudflare Worker without deploying
        run: npx --yes wrangler@4.102.0 deploy --dry-run -c cloudflare/wrangler.jsonc

      - name: Require explicit production confirmation and merged application PR
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CONFIRM_PRODUCTION}" != "true" ]]; then
            echo "::error::Production deployment requires confirm_production=true."
            exit 1
          fi
          merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/25" --jq '.merged')"
          if [[ "${merged}" != "true" ]]; then
            echo "::error::Application PR #25 must be reviewed and merged before production deployment."
            exit 1
          fi
          base_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/25" --jq '.base.ref')"
          if [[ "${base_ref}" != "feature/vyron-control-cloud-mvp-20261113" ]]; then
            echo "::error::Application PR #25 must be merged into the reviewed VYRON CONTROL integration branch."
            exit 1
          fi
          git fetch --no-tags origin feature/vyron-control-cloud-mvp-20261113
          release_sha="$(git rev-parse HEAD)"
          reviewed_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "${release_sha}" != "${reviewed_sha}" ]]; then
            echo "::error::Release snapshot is stale. Update it to the exact reviewed application branch HEAD before deploying."
            exit 1
          fi
          echo "PR #25 is merged and release snapshot matches the reviewed branch HEAD: ${release_sha}"

      - name: Apply additive D1 migrations
        if: ${{ env.OPERATION == 'deploy' }}
        run: npx --yes wrangler@4.102.0 d1 migrations apply vyron-control --remote -c cloudflare/wrangler.jsonc

      - name: Verify D1 application row counts survived migrations
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        env:
          EXPECTED_ROW_COUNTS: ${{ steps.d1-audit.outputs.row_counts }}
        run: |
          set -euo pipefail
          COUNTS_SQL="SELECT 'channels' AS table_name, COUNT(*) AS row_count FROM channels
          UNION ALL SELECT 'channel_snapshots', COUNT(*) FROM channel_snapshots
          UNION ALL SELECT 'events', COUNT(*) FROM events
          UNION ALL SELECT 'sync_runs', COUNT(*) FROM sync_runs
          UNION ALL SELECT 'quota_buckets', COUNT(*) FROM quota_buckets
          UNION ALL SELECT 'devices', COUNT(*) FROM devices
          UNION ALL SELECT 'commands', COUNT(*) FROM commands
          UNION ALL SELECT 'channel_analytics', COUNT(*) FROM channel_analytics
          UNION ALL SELECT 'channel_analytics_reports', COUNT(*) FROM channel_analytics_reports
          UNION ALL SELECT 'google_oauth_sessions', COUNT(*) FROM google_oauth_sessions
          UNION ALL SELECT 'google_oauth_profiles', COUNT(*) FROM google_oauth_profiles
          UNION ALL SELECT 'google_oauth_client_credentials', COUNT(*) FROM google_oauth_client_credentials
          UNION ALL SELECT 'cloud_analytics_runs', COUNT(*) FROM cloud_analytics_runs
          UNION ALL SELECT 'channel_analytics_queue', COUNT(*) FROM channel_analytics_queue
          UNION ALL SELECT 'push_subscriptions', COUNT(*) FROM push_subscriptions
          UNION ALL SELECT 'push_deliveries', COUNT(*) FROM push_deliveries
          ORDER BY table_name;"
          counts_json="$(npx --yes wrangler@4.102.0 d1 execute vyron-control --remote -c cloudflare/wrangler.jsonc --json --command "${COUNTS_SQL}")"
          EXPECTED_ROW_COUNTS="${EXPECTED_ROW_COUNTS}" D1_COUNTS_JSON="${counts_json}" node --input-type=module <<'NODE'
          const expected = JSON.parse(process.env.EXPECTED_ROW_COUNTS || "{}");
          const results = JSON.parse(process.env.D1_COUNTS_JSON || "[]");
          const rows = results.flatMap(result => Array.isArray(result.results) ? result.results : []);
          const actual = Object.fromEntries(rows.map(row => [String(row.table_name), Number(row.row_count)]));
          const changed = Object.keys(expected).filter(name => actual[name] !== expected[name]);
          if (changed.length) {
            console.error("D1 data preservation check failed:", JSON.stringify({
              changed: Object.fromEntries(changed.map(name => [name, {
                before: expected[name], after: actual[name]
              }]))
            }));
            process.exit(1);
          }
          console.log("D1 data preservation verified: all 16 application-table row counts are unchanged.");
          NODE

      - name: Deploy Worker and static dashboard assets
        if: ${{ env.OPERATION == 'deploy' }}
        run: npx --yes wrangler@4.102.0 deploy -c cloudflare/wrangler.jsonc --keep-vars --strict --message "VYRON CONTROL release $(git rev-parse --short HEAD)"

      - name: Verify deployed Worker and D1 schema
        if: ${{ env.OPERATION == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "${VYRON_CONTROL_URL}/api/health")"
          HEALTH_JSON="${body}" node --input-type=module -e '
            const health = JSON.parse(process.env.HEALTH_JSON || "{}");
            if (health.ok !== true || health.d1?.schema !== true ||
                health.d1?.expectedTables !== 16 ||
                health.d1?.presentTables !== 16) {
              console.error("Worker health/schema verification failed:", JSON.stringify({
                ok: health.ok, d1: health.d1, error: health.error
              }));
              process.exit(1);
            }
            console.log("Worker healthy; D1 schema verified:", health.d1.presentTables + "/" + health.d1.expectedTables);
          '

      - name: Confirm preflight-only run made no production changes
        if: ${{ env.OPERATION == 'preflight' }}
        run: echo "Preflight complete. No D1 migrations were applied and no Worker was deployed."
