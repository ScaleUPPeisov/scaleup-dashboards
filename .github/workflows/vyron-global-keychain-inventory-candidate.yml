name: VYRON Global Keychain Inventory Candidate Build

on:
  push:
    branches:
      - repair/vyron-native-keychain-diagnostic
    paths:
      - '.github/diagnostic/vyron-global-inventory-trigger.txt'

permissions:
  contents: read

concurrency:
  group: vyron-global-keychain-inventory-candidate
  cancel-in-progress: false

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_TAG: v2.1.2

jobs:
  package-real-mac-inventory:
    name: Package ARM64 local Keychain inventory candidate only
    runs-on: macos-14
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout repair payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble exact v2.1.2 source plus native repair plus global inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vyron-global-inventory"
          SRC="$RUNNER_TEMP/vyron-global-inventory-source"
          PATCH="$RUNNER_TEMP/apply_native_repair.py"
          rm -rf "$ROOT" "$SRC"
          mkdir -p "$ROOT" "$SRC"

          gh release download "$BASE_TAG" --repo "$REPO" --dir "$SRC" \
            --pattern 'VYRON-2.1.2-source.tar.gz' --pattern 'SOURCE_SHA256.txt'
          cd "$SRC"
          expected="$(awk '{print $1}' SOURCE_SHA256.txt)"
          actual="$(shasum -a 256 VYRON-2.1.2-source.tar.gz | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          tar -xzf VYRON-2.1.2-source.tar.gz -C "$ROOT"

          cd "$GITHUB_WORKSPACE"
          cat .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.00 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.01 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02a \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02b \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.03 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.part01 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.part02 \
            | base64 --decode | gunzip > "$PATCH"
          test "$(shasum -a 256 "$PATCH" | awk '{print $1}')" = '4196bc3e2199e3e038120f37128eb2d5ccb412177c25436a751b9f5ec53fe7ea'
          python3 "$PATCH" "$ROOT"
          python3 .github/scripts/apply_native_keychain_compilefix.py "$ROOT"
          python3 .github/scripts/apply_global_keychain_inventory.py "$ROOT"

          cd "$ROOT"
          test "$(node -p "require('./package.json').version")" = '2.1.2'
          grep -q 'ItemSearchOptions' src-tauri/src/security.rs
          grep -q 'security_oauth_inventory' src-tauri/src/security.rs
          grep -q 'OAuth Diagnostics' src/SettingsOS.tsx
          grep -q 'Сканировать локальные credentials' src/OAuthInventoryPanel.tsx
          grep -q 'Скопировать безопасный отчёт' src/OAuthInventoryPanel.tsx
          if grep -q 'dump-keychain' src-tauri/src/security.rs; then
            echo 'ERROR: shell Keychain enumeration present'
            exit 1
          fi
          if grep -Eq 'youtube_[a-z_]+\(' src/OAuthInventoryPanel.tsx; then
            echo 'ERROR: inventory UI unexpectedly references YouTube operation'
            exit 1
          fi
          echo 'GLOBAL LOCAL INVENTORY SOURCE: READY'

      - name: Compile frontend only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/vyron-global-inventory"
          npm ci --no-audit --no-fund
          npm run build

      - name: Normalize updater signing material for packaging
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key')
          pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          PY

      - name: Package and verify ARM64 inventory candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vyron-global-inventory"
          cd "$ROOT"
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -d "$APP"
          test -s "$DMG"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.2'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          file "$APP/Contents/MacOS/$EXE" | grep -q 'arm64'
          strings "$APP/Contents/MacOS/$EXE" | grep -q 'security_oauth_inventory'
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"

          OUT="$GITHUB_WORKSPACE/global-keychain-inventory-candidate"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$DMG" "$OUT/VYRON-2.1.2-Global-Keychain-Inventory-ARM64.dmg"
          shasum -a 256 "$OUT/VYRON-2.1.2-Global-Keychain-Inventory-ARM64.dmg" > "$OUT/SHA256.txt"
          cat > "$OUT/READ_ME_FIRST.txt" <<'TXT'
          VYRON 2.1.2 GLOBAL LOCAL KEYCHAIN INVENTORY DIAGNOSTIC CANDIDATE
          NOT A STABLE RELEASE. DOES NOT MODIFY STABLE UPDATER.

          Open:
          Settings -> OAuth Diagnostics
          Click: "Сканировать локальные credentials"
          Then: "Скопировать безопасный отчёт"

          Inventory is local-only:
          - VYRON OAuth profile database
          - macOS Keychain service attributes/read status
          - youtube-oauth.json inventory
          - NO Google/YouTube API calls
          - NO token/client_secret values in output
          TXT
          echo "DMG_SHA256=$(awk '{print $1}' "$OUT/SHA256.txt")"

      - name: Upload inventory candidate only
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.2-global-keychain-inventory-candidate
          path: global-keychain-inventory-candidate/
          if-no-files-found: error
          retention-days: 30
