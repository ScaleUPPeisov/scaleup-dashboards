name: VYRON Google Project Architecture Diagnostic

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths: ['.github/workflows/vyron-google-project-architecture-diagnostic.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact released 2.1.3 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p src213
          gh release download v2.1.3 --repo ScaleUPPeisov/scaleup-dashboards --dir . --pattern 'VYRON-2.1.3-source.tar.gz'
          tar -xzf VYRON-2.1.3-source.tar.gz -C src213
          echo '--- package version ---'
          node -p "require('./src213/package.json').version"
          echo '--- relevant files ---'
          grep -RIlE 'projectKey|project_key|videos\.insert|usedToday|used_today|America/Los_Angeles|upload.*limit|quota.*limit|client_id|clientId|oauth.*profile|OAuthProfile' src213/src src213/src-tauri 2>/dev/null | sort | tee /tmp/relevant-files.txt
      - name: Extract architecture evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in $(cat /tmp/relevant-files.txt); do
            echo "===== $f ====="
            grep -nE -C 5 'projectKey|project_key|videos\.insert|usedToday|used_today|America/Los_Angeles|upload.*limit|quota.*limit|client_id|clientId|oauth.*profile|OAuthProfile' "$f" || true
          done
      - name: Copy exact candidate source files for inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          while IFS= read -r f; do
            rel=${f#src213/}
            mkdir -p "evidence/$(dirname "$rel")"
            cp "$f" "evidence/$rel"
          done < /tmp/relevant-files.txt
          find evidence -type f -maxdepth 5 -print
      - uses: actions/upload-artifact@v4
        with:
          name: vyron-google-project-architecture-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
