name: VYRON Google Project Cloud URL + Restart Acceptance

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths: ['.github/workflows/vyron-google-project-cloud-restart-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BUILD_RUN: '34736126738'
  BUILD_ARTIFACT: 'VYRON-google-project-diagnostics-ARM64-DEV-retry'
  GREEN_SOURCE_SHA256: 'a6d00f2d8bbe38f75f17ba6526973bc759e5d34a442931679b551fbc1a0dc512'
  PROJECT_ID: 'vyron-diagnostics-test-project'

jobs:
  cloud-url-restart:
    runs-on: macos-14
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified ARM64 app and canonical safe fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf app-in evidence "$RUNNER_TEMP/vyron-cloud-restart" "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          mkdir -p app-in evidence
          gh run download "$BUILD_RUN" --repo "$REPO" -n "$BUILD_ARTIFACT" -D app-in
          ZIP=$(find app-in -name 'VYRON-2.1.3-GoogleProject-Diagnostics-ARM64-DEV.app.zip' -print -quit)
          test -s "$ZIP"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/vyron-cloud-restart"
          APP=$(find "$RUNNER_TEMP/vyron-cloud-restart" -maxdepth 2 -name 'VYRON.app' -print -quit)
          test -d "$APP"
          mv "$APP" "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          APP="$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.3'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          file "$APP/Contents/MacOS/$EXE" | tee evidence/binary-file.txt | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          chmod -R u+rwX "$APP"
          xattr -dr com.apple.quarantine "$APP" || true
          echo "DEV_APP=$APP" >> "$GITHUB_ENV"
          printf '%s\n' "$GREEN_SOURCE_SHA256" > evidence/green-source-sha256.txt
          printf '%s\n' "$BUILD_RUN" > evidence/arm64-build-run.txt

          export CLIENT_A='123456789012-abcdefghijklmnop.apps.googleusercontent.com'
          export CLIENT_C='987654321098-zyxwvutsrqponmlk.apps.googleusercontent.com'
          export PROJECT_ID='vyron-diagnostics-test-project'
          python3 <<'PY'
          import pathlib, subprocess, os
          lines=pathlib.Path('.github/workflows/vyron-google-project-dev-ui.yml').read_text(encoding='utf-8').splitlines()
          s=next(i for i,l in enumerate(lines) if l.strip()=='- name: Seed safe local metadata fixture with no secrets')
          r=next(i for i in range(s,len(lines)) if lines[i]=='        run: |')+1
          b=[]
          for line in lines[r:]:
              if line and not line.startswith('          '): break
              b.append(line[10:] if line.startswith('          ') else '')
          subprocess.run(['bash','-c','set -Eeuo pipefail\n'+'\n'.join(b)],check=True,env=os.environ.copy())
          PY
          SUPPORT="$HOME/Library/Application Support/studio.channelflow.desktop"
          ! grep -R -Eiq 'client_secret|refresh_token|access_token|Authorization|private_key' "$SUPPORT"
          echo 'SAFE FIXTURE SECRET SCAN: PASS' > evidence/safe-fixture-secret-scan.txt

      - name: Install deterministic HTTPS URL capture handler
        shell: bash
        run: |
          set -Eeuo pipefail
          CAPTURE_APP="$RUNNER_TEMP/VYRONURLCapture.app"
          CAPTURE_FILE="/tmp/vyron-captured-url.txt"
          rm -rf "$CAPTURE_APP" "$CAPTURE_FILE"
          mkdir -p "$CAPTURE_APP/Contents/MacOS"

          cat > "$RUNNER_TEMP/VYRONURLCapture.swift" <<'SWIFT'
          import AppKit
          import Carbon

          final class AppDelegate: NSObject, NSApplicationDelegate {
            let capturePath = "/tmp/vyron-captured-url.txt"

            func applicationWillFinishLaunching(_ notification: Notification) {
              NSAppleEventManager.shared().setEventHandler(
                self,
                andSelector: #selector(handleGetURL(_:withReplyEvent:)),
                forEventClass: AEEventClass(kInternetEventClass),
                andEventID: AEEventID(kAEGetURL)
              )
            }

            @objc func handleGetURL(_ event: NSAppleEventDescriptor, withReplyEvent replyEvent: NSAppleEventDescriptor) {
              guard let value = event.paramDescriptor(forKeyword: keyDirectObject)?.stringValue else {
                return
              }
              do {
                try (value + "\n").write(toFile: capturePath, atomically: true, encoding: .utf8)
              } catch {
                fputs("capture write failed: \(error)\n", stderr)
              }
              DispatchQueue.main.asyncAfter(deadline: .now() + 0.15) {
                NSApp.terminate(nil)
              }
            }
          }

          let app = NSApplication.shared
          let delegate = AppDelegate()
          app.delegate = delegate
          app.setActivationPolicy(.accessory)
          app.run()
          SWIFT

          swiftc "$RUNNER_TEMP/VYRONURLCapture.swift" \
            -framework AppKit -framework Carbon \
            -o "$CAPTURE_APP/Contents/MacOS/VYRONURLCapture"

          cat > "$CAPTURE_APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>VYRONURLCapture</string>
            <key>CFBundleDisplayName</key><string>VYRONURLCapture</string>
            <key>CFBundleExecutable</key><string>VYRONURLCapture</string>
            <key>CFBundleIdentifier</key><string>com.scaleup.vyron.urlcapture</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSUIElement</key><true/>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key><string>VYRON URL Capture</string>
                <key>CFBundleURLSchemes</key>
                <array><string>https</string><string>http</string></array>
              </dict>
            </array>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key><string>Web URL</string>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>LSHandlerRank</key><string>Owner</string>
                <key>LSItemContentTypes</key>
                <array><string>public.url</string><string>public.html</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          plutil -lint "$CAPTURE_APP/Contents/Info.plist"
          codesign --force --deep --sign - "$CAPTURE_APP"
          codesign --verify --deep --strict --verbose=2 "$CAPTURE_APP"
          file "$CAPTURE_APP/Contents/MacOS/VYRONURLCapture" | tee evidence/url-capture-binary.txt | grep -q arm64

          LSREGISTER='/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister'
          "$LSREGISTER" -f "$CAPTURE_APP"

          cat > "$RUNNER_TEMP/set-default.swift" <<'SWIFT'
          import Foundation
          import CoreServices
          let bundle = "com.scaleup.vyron.urlcapture" as CFString
          let httpStatus = LSSetDefaultHandlerForURLScheme("http" as CFString, bundle)
          let urlRole = LSSetDefaultRoleHandlerForContentType("public.url" as CFString, .viewer, bundle)
          let htmlRole = LSSetDefaultRoleHandlerForContentType("public.html" as CFString, .viewer, bundle)
          print("http=\(httpStatus) public.url=\(urlRole) public.html=\(htmlRole)")
          if httpStatus != noErr { exit(1) }
          SWIFT
          swift "$RUNNER_TEMP/set-default.swift" | tee evidence/url-handler-registration.txt
          sleep 2

          osascript <<'APPLESCRIPT' | tee evidence/default-browser-prompt.txt
          tell application "System Events"
            set out to ""
            set clicked to false
            repeat with p in application processes
              try
                repeat with w in windows of p
                  try
                    repeat with b in buttons of w
                      try
                        set bn to name of b as text
                        if bn is not "missing value" then set out to out & (name of p as text) & " :: " & bn & linefeed
                        if clicked is false and (bn contains "VYRONURLCapture" or bn contains "Use" or bn contains "Change") and bn does not contain "Keep" and bn does not contain "Cancel" then
                          click b
                          set clicked to true
                        end if
                      end try
                    end repeat
                  end try
                end repeat
              end try
            end repeat
            return out & "clicked=" & (clicked as text)
          end tell
          APPLESCRIPT
          sleep 3

          cat > "$RUNNER_TEMP/verify-default.swift" <<'SWIFT'
          import Foundation
          import CoreServices
          let bundle = "com.scaleup.vyron.urlcapture"
          let bundleCF = bundle as CFString
          let httpsStatus = LSSetDefaultHandlerForURLScheme("https" as CFString, bundleCF)
          let currentHTTP = LSCopyDefaultHandlerForURLScheme("http" as CFString)?.takeRetainedValue() as String? ?? ""
          let currentHTTPS = LSCopyDefaultHandlerForURLScheme("https" as CFString)?.takeRetainedValue() as String? ?? ""
          print("httpsSet=\(httpsStatus) currentHttp=\(currentHTTP) currentHttps=\(currentHTTPS)")
          if currentHTTP != bundle || currentHTTPS != bundle { exit(1) }
          SWIFT
          swift "$RUNNER_TEMP/verify-default.swift" | tee evidence/url-handler-verification.txt
          echo "CAPTURE_FILE=$CAPTURE_FILE" >> "$GITHUB_ENV"

          rm -f "$CAPTURE_FILE"
          open 'https://example.com/vyron-handler-self-test'
          for i in {1..20}; do test -s "$CAPTURE_FILE" && break; sleep 1; done
          test -s "$CAPTURE_FILE"
          SELF=$(cat "$CAPTURE_FILE")
          printf '%s\n' "$SELF" | tee evidence/url-handler-self-test.txt
          test "$SELF" = 'https://example.com/vyron-handler-self-test'
          echo 'HTTPS CAPTURE HANDLER SELF-TEST: PASS' > evidence/url-handler-self-test-status.txt
          rm -f "$CAPTURE_FILE"

      - name: Physically open Google Cloud from VYRON and capture exact URL
        shell: bash
        run: |
          set -Eeuo pipefail
          open -na "$DEV_APP"
          for i in {1..30}; do pgrep -if "$DEV_APP/Contents/MacOS/channelflow" >/dev/null && break; sleep 1; done
          test -n "$(pgrep -if "$DEV_APP/Contents/MacOS/channelflow" | head -1)"
          sleep 6
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set position of window 1 of p to {120, 55}
            set size of window 1 of p to {1200, 760}
            delay 1
            set {wx, wy} to position of window 1 of p
            click at {wx + 92, wy + 352}
            delay 2
            click at {wx + 330, wy + 217}
          end tell
          APPLESCRIPT
          sleep 2
          osascript -e 'tell application "System Events" to key code 121'
          sleep 2
          screencapture -x evidence/01-project-a-card.png || true
          osascript -e 'tell application "System Events" to key code 121'
          sleep 2
          screencapture -x evidence/02-project-a-actions.png || true
          rm -f "$CAPTURE_FILE"
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set {wx, wy} to position of window 1 of p
            click at {wx + 670, wy + 247}
          end tell
          APPLESCRIPT
          for i in {1..20}; do test -s "$CAPTURE_FILE" && break; sleep 1; done
          test -s "$CAPTURE_FILE"
          CLOUD_URL=$(cat "$CAPTURE_FILE")
          printf '%s\n' "$CLOUD_URL" | tee evidence/google-cloud-url.txt
          python3 - "$CLOUD_URL" "$PROJECT_ID" <<'PY'
          import sys, urllib.parse
          url, project = sys.argv[1:]
          parsed = urllib.parse.urlparse(url)
          assert parsed.scheme == 'https', parsed.scheme
          assert parsed.hostname == 'console.cloud.google.com', parsed.hostname
          q = urllib.parse.parse_qs(parsed.query)
          assert q.get('project') == [project], q
          print('GOOGLE CLOUD EXACT URL STRUCTURE: PASS')
          PY
          echo 'GOOGLE CLOUD PHYSICAL CLICK + EXACT URL: PASS' > evidence/google-cloud-click.txt

      - name: Restart real app and verify diagnostics card returns
        shell: bash
        run: |
          set -Eeuo pipefail
          pkill -if 'VYRON|channelflow' || true
          sleep 2
          open -na "$DEV_APP"
          for i in {1..30}; do pgrep -if "$DEV_APP/Contents/MacOS/channelflow" >/dev/null && break; sleep 1; done
          test -n "$(pgrep -if "$DEV_APP/Contents/MacOS/channelflow" | head -1)"
          sleep 6
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set position of window 1 of p to {120, 55}
            set size of window 1 of p to {1200, 760}
            delay 1
            set {wx, wy} to position of window 1 of p
            click at {wx + 92, wy + 352}
            delay 2
            click at {wx + 330, wy + 217}
          end tell
          APPLESCRIPT
          sleep 2
          osascript -e 'tell application "System Events" to key code 121'
          sleep 2
          screencapture -x evidence/03-after-restart-project-card.png || true
          echo 'RESTART PHYSICAL NAVIGATION: PASS' > evidence/restart.txt

      - name: Evidence summary
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fqx 'https://example.com/vyron-handler-self-test' evidence/url-handler-self-test.txt
          grep -Fq 'https://console.cloud.google.com/' evidence/google-cloud-url.txt
          grep -Fq "project=$PROJECT_ID" evidence/google-cloud-url.txt
          test -s evidence/03-after-restart-project-card.png
          if grep -R -Eiq 'client_secret|refresh_token|access_token|Authorization: Bearer|private_key|authorization_code' evidence; then
            echo 'EVIDENCE SECRET LEAK SCAN: FAIL' >&2
            exit 1
          fi
          echo 'EVIDENCE SECRET LEAK SCAN: PASS' > evidence/evidence-secret-leak-scan.txt
          cat > evidence/STATUS.txt <<'TXT'
          FIXTURE ACCEPTANCE SUPPLEMENT — NOT REAL USER PROFILE
          ARM64 APP REUSED FROM VERIFIED BUILD RUN 34736126738
          HTTPS CAPTURE HANDLER SELF-TEST: PASS
          GOOGLE CLOUD BUTTON PHYSICAL CLICK: PASS
          EXACT GOOGLE CLOUD URL CAPTURE: PASS
          PROJECT-SPECIFIC URL: PASS
          RESTART PHYSICAL NAVIGATION: PASS
          EVIDENCE SECRET LEAK SCAN: PASS
          PRODUCTION SOURCE MODIFIED: NO
          REAL USER PROFILE TESTED: NO
          TXT
          cat evidence/STATUS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-google-project-cloud-restart-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pkill -if 'VYRON|channelflow|VYRONURLCapture' || true
          rm -f /tmp/vyron-captured-url.txt
