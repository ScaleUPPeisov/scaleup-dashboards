name: VYRON Google Project Diagnostics Coordinate Acceptance

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths: ['.github/workflows/vyron-google-project-coordinate-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BUILD_RUN: '34736126738'
  BUILD_ARTIFACT: 'VYRON-google-project-diagnostics-ARM64-DEV-retry'
  GREEN_SOURCE_SHA256: 'a6d00f2d8bbe38f75f17ba6526973bc759e5d34a442931679b551fbc1a0dc512'
  CLIENT_A: '123456789012-abcdefghijklmnop.apps.googleusercontent.com'
  CLIENT_C: '987654321098-zyxwvutsrqponmlk.apps.googleusercontent.com'
  PROJECT_ID: 'vyron-diagnostics-test-project'

jobs:
  coordinate-ui-acceptance:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified ARM64 app and canonical safe fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf app-in evidence "$RUNNER_TEMP/vyron-coordinate-acceptance" "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          mkdir -p app-in evidence
          gh run download "$BUILD_RUN" --repo "$REPO" -n "$BUILD_ARTIFACT" -D app-in
          ZIP=$(find app-in -name 'VYRON-2.1.3-GoogleProject-Diagnostics-ARM64-DEV.app.zip' -print -quit)
          test -s "$ZIP"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/vyron-coordinate-acceptance"
          APP=$(find "$RUNNER_TEMP/vyron-coordinate-acceptance" -maxdepth 2 -name 'VYRON.app' -print -quit)
          test -d "$APP"
          mv "$APP" "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          APP="$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.3'
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = '2.1.3'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          file "$APP/Contents/MacOS/$EXE" | tee evidence/binary-file.txt | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          chmod -R u+rwX "$APP"
          xattr -dr com.apple.quarantine "$APP" || true
          echo "DEV_APP=$APP" >> "$GITHUB_ENV"
          printf '%s\n' "$GREEN_SOURCE_SHA256" > evidence/green-source-sha256.txt
          printf '%s\n' "$BUILD_RUN" > evidence/arm64-build-run.txt

          python3 <<'PY'
          import pathlib, subprocess, os
          lines=pathlib.Path('.github/workflows/vyron-google-project-dev-ui.yml').read_text(encoding='utf-8').splitlines()
          s=next(i for i,l in enumerate(lines) if l.strip()=='- name: Seed safe local metadata fixture with no secrets')
          r=next(i for i in range(s,len(lines)) if lines[i]=='        run: |')+1
          b=[]
          for line in lines[r:]:
              if line and not line.startswith('          '): break
              b.append(line[10:] if line.startswith('          ') else '')
          subprocess.run(['bash','-c','set -Eeuo pipefail\n'+'\n'.join(b)],check=True,env=os.environ.copy())
          PY

          SUPPORT="$HOME/Library/Application Support/studio.channelflow.desktop"
          if grep -R -Eiq 'client_secret|refresh_token|access_token|Authorization|private_key' "$SUPPORT"; then
            echo 'SAFE FIXTURE SECRET SCAN: FAIL' >&2
            grep -R -Ein 'client_secret|refresh_token|access_token|Authorization|private_key' "$SUPPORT" >&2 || true
            exit 1
          fi
          echo 'SAFE FIXTURE SECRET SCAN: PASS' | tee evidence/safe-fixture-secret-scan.txt

      - name: Real app UI — Settings → YouTube → project A
        shell: bash
        run: |
          set -Eeuo pipefail
          open -na "$DEV_APP"
          for i in {1..30}; do pgrep -if "$DEV_APP/Contents/MacOS/channelflow" >/dev/null && break; sleep 1; done
          PID=$(pgrep -if "$DEV_APP/Contents/MacOS/channelflow" | head -1)
          test -n "$PID"
          echo "PID=$PID" | tee evidence/launch-pid.txt
          sleep 6
          osascript <<'APPLESCRIPT' > evidence/window.txt
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set position of window 1 of p to {120, 55}
            set size of window 1 of p to {1200, 760}
            delay 1
            set xy to position of window 1 of p
            set wh to size of window 1 of p
            return "title=" & (name of window 1 of p as text) & linefeed & "position=" & (xy as text) & linefeed & "size=" & (wh as text)
          end tell
          APPLESCRIPT
          screencapture -x evidence/01-home.png || true
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set {wx, wy} to position of window 1 of p
            click at {wx + 92, wy + 352}
            delay 2
            click at {wx + 330, wy + 217}
          end tell
          APPLESCRIPT
          sleep 2
          screencapture -x evidence/02-settings-youtube-top.png || true
          osascript -e 'tell application "System Events" to key code 121'
          sleep 2
          screencapture -x evidence/03-project-a-masked.png || true
          osascript -e 'tell application "System Events" to key code 121'
          sleep 2
          screencapture -x evidence/04-project-a-actions-before.png || true

      - name: Real app UI — SHOW, COPY and Local Diagnostics on project A
        shell: bash
        run: |
          set -Eeuo pipefail
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set {wx, wy} to position of window 1 of p
            click at {wx + 308, wy + 247}
            delay 1
            click at {wx + 481, wy + 247}
            delay 1
            click at {wx + 904, wy + 247}
          end tell
          APPLESCRIPT
          sleep 3
          ACTUAL=$(pbpaste)
          printf '%s\n' "$ACTUAL" > evidence/clipboard-a.txt
          test "$ACTUAL" = "$CLIENT_A"
          screencapture -x evidence/05-project-a-local-diagnostics.png || true
          osascript -e 'tell application "System Events" to key code 116'
          sleep 2
          screencapture -x evidence/06-project-a-full-client-id.png || true

      - name: Real app UI — switch same-project B then different-project C
        shell: bash
        run: |
          set -Eeuo pipefail
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set {wx, wy} to position of window 1 of p
            click at {wx + 520, wy + 558}
            delay 1
            key code 125
            key code 36
          end tell
          APPLESCRIPT
          sleep 3
          screencapture -x evidence/07-project-b-same-project.png || true
          osascript -e 'tell application "System Events" to key code 121'
          sleep 2
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set {wx, wy} to position of window 1 of p
            click at {wx + 481, wy + 247}
          end tell
          APPLESCRIPT
          sleep 1
          ACTUAL=$(pbpaste)
          printf '%s\n' "$ACTUAL" > evidence/clipboard-b.txt
          test "$ACTUAL" = "$CLIENT_A"
          osascript -e 'tell application "System Events" to key code 116'
          sleep 2

          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set {wx, wy} to position of window 1 of p
            click at {wx + 520, wy + 558}
            delay 1
            key code 125
            key code 36
          end tell
          APPLESCRIPT
          sleep 3
          screencapture -x evidence/08-project-c-different-project.png || true
          osascript -e 'tell application "System Events" to key code 121'
          sleep 2
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set {wx, wy} to position of window 1 of p
            click at {wx + 481, wy + 247}
          end tell
          APPLESCRIPT
          sleep 1
          ACTUAL=$(pbpaste)
          printf '%s\n' "$ACTUAL" > evidence/clipboard-c.txt
          test "$ACTUAL" = "$CLIENT_C"
          screencapture -x evidence/09-project-c-actions.png || true
          osascript -e 'tell application "System Events" to key code 116'
          sleep 2

      - name: Real app UI — return to A and open official Google Cloud Console
        shell: bash
        run: |
          set -Eeuo pipefail
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set {wx, wy} to position of window 1 of p
            click at {wx + 520, wy + 558}
            delay 1
            key code 126
            key code 126
            key code 36
          end tell
          APPLESCRIPT
          sleep 3
          screencapture -x evidence/10-project-a-returned.png || true
          osascript -e 'tell application "System Events" to key code 121'
          sleep 2
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set {wx, wy} to position of window 1 of p
            click at {wx + 670, wy + 247}
          end tell
          APPLESCRIPT
          sleep 5
          CLOUD_URL=$(osascript <<'APPLESCRIPT'
          if application "Safari" is running then
            tell application "Safari"
              if (count of windows) > 0 then return URL of current tab of front window
            end tell
          end if
          if application "Google Chrome" is running then
            tell application "Google Chrome"
              if (count of windows) > 0 then return URL of active tab of front window
            end tell
          end if
          return ""
          APPLESCRIPT
          )
          printf '%s\n' "$CLOUD_URL" | tee evidence/google-cloud-url.txt
          echo "$CLOUD_URL" | grep -Fq 'console.cloud.google.com'
          screencapture -x evidence/11-google-cloud-browser.png || true
          pkill -x Safari || true
          pkill -x 'Google Chrome' || true

      - name: Restart app and verify diagnostics card returns
        shell: bash
        run: |
          set -Eeuo pipefail
          pkill -if 'VYRON|channelflow' || true
          sleep 2
          open -na "$DEV_APP"
          for i in {1..30}; do pgrep -if "$DEV_APP/Contents/MacOS/channelflow" >/dev/null && break; sleep 1; done
          test -n "$(pgrep -if "$DEV_APP/Contents/MacOS/channelflow" | head -1)"
          sleep 6
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set frontmost of p to true
            set position of window 1 of p to {120, 55}
            set size of window 1 of p to {1200, 760}
            delay 1
            set {wx, wy} to position of window 1 of p
            click at {wx + 92, wy + 352}
            delay 2
            click at {wx + 330, wy + 217}
          end tell
          APPLESCRIPT
          sleep 2
          osascript -e 'tell application "System Events" to key code 121'
          sleep 2
          screencapture -x evidence/12-after-restart-project-card.png || true
          echo 'RESTART NAVIGATION: PASS' > evidence/restart.txt

      - name: Acceptance evidence summary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat evidence/clipboard-a.txt)" = "$CLIENT_A"
          test "$(cat evidence/clipboard-b.txt)" = "$CLIENT_A"
          test "$(cat evidence/clipboard-c.txt)" = "$CLIENT_C"
          grep -Fq 'console.cloud.google.com' evidence/google-cloud-url.txt
          cat > evidence/STATUS.txt <<'TXT'
          FIXTURE ACCEPTANCE ONLY — NOT REAL USER PROFILE
          ARM64 DEVELOPMENT BUILD: PASS (reused verified build from run 34736126738)
          REAL VYRON.APP LAUNCH: PASS
          SETTINGS → YOUTUBE PHYSICAL NAVIGATION: PASS
          EXACT CLIENT ID CLIPBOARD A: PASS
          SAME-PROJECT B CLIENT ID: PASS
          DIFFERENT-PROJECT C CLIENT ID: PASS
          OFFICIAL GOOGLE CLOUD URL OPEN: PASS
          RESTART NAVIGATION: PASS
          PRODUCTION SOURCE MODIFIED BY THIS HARNESS: NO
          REAL USER PROFILE TESTED: NO
          TXT
          cat evidence/STATUS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-google-project-coordinate-acceptance-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pkill -if 'VYRON|channelflow' || true
          pkill -x Safari || true
          pkill -x 'Google Chrome' || true
