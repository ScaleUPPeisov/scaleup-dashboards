name: VYRON Google Project Diagnostics ARM64 Dev UI Retry

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths: ['.github/workflows/vyron-google-project-dev-ui-retry.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  TARGETED_RUN: '34735206801'
  TARGETED_ARTIFACT: 'VYRON-google-project-diagnostics-green-source'
  GREEN_SOURCE_SHA256: 'a6d00f2d8bbe38f75f17ba6526973bc759e5d34a442931679b551fbc1a0dc512'
  CLIENT_A: '123456789012-abcdefghijklmnop.apps.googleusercontent.com'
  CLIENT_C: '987654321098-zyxwvutsrqponmlk.apps.googleusercontent.com'
  PROJECT_ID: 'vyron-diagnostics-test-project'
  APPLE_SIGNING_IDENTITY: '-'

jobs:
  dev-ui-retry:
    runs-on: macos-14
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Restore exact targeted-green source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf green work evidence dev-out
          mkdir -p green work evidence dev-out
          gh run download "$TARGETED_RUN" --repo "$REPO" -n "$TARGETED_ARTIFACT" -D green
          test -s green/VYRON-2.1.3-google-project-diagnostics-dev-source.tar.gz
          test "$(awk '{print $1}' green/SOURCE_SHA256.txt)" = "$GREEN_SOURCE_SHA256"
          test "$(shasum -a 256 green/VYRON-2.1.3-google-project-diagnostics-dev-source.tar.gz | awk '{print $1}')" = "$GREEN_SOURCE_SHA256"
          tar -xzf green/VYRON-2.1.3-google-project-diagnostics-dev-source.tar.gz -C work
          test "$(node -p "require('./work/package.json').version")" = '2.1.3'
          printf '%s\n' "$GREEN_SOURCE_SHA256" > evidence/green-source-sha256.txt

      - name: Build development ARM64 app without updater payload
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          npm ci --no-audit --no-fund
          npx tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.3'
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = '2.1.3'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          file "$APP/Contents/MacOS/$EXE" | tee "$GITHUB_WORKSPACE/evidence/binary-file.txt" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -rf "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          cp -R "$APP" "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          chmod -R u+rwX "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app" || true
          echo "DEV_APP=$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app" >> "$GITHUB_ENV"
          plutil -p "$APP/Contents/Info.plist" > "$GITHUB_WORKSPACE/evidence/info-plist.txt"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/dev-out/VYRON-2.1.3-GoogleProject-Diagnostics-ARM64-DEV.app.zip"

      - name: Execute canonical existing UI acceptance scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import subprocess

          path = pathlib.Path('.github/workflows/vyron-google-project-dev-ui.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '- name: Seed safe local metadata fixture with no secrets')
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip().startswith('- uses: actions/upload-artifact@'))
          scripts = []
          i = start
          while i < end:
              if lines[i].startswith('      - name: '):
                  name = lines[i].split(': ', 1)[1]
                  j = i + 1
                  while j < end and not lines[j].startswith('      - name: '):
                      if lines[j] == '        run: |':
                          j += 1
                          block = []
                          while j < end:
                              line = lines[j]
                              if line and not line.startswith('          '):
                                  break
                              block.append(line[10:] if line.startswith('          ') else '')
                              j += 1
                          scripts.append((name, '\n'.join(block)))
                          break
                      j += 1
                  i = max(j, i + 1)
              else:
                  i += 1

          expected = [
              'Seed safe local metadata fixture with no secrets',
              'Launch real development VYRON.app',
              'Open Settings → YouTube in real UI',
              'Select first OAuth profile and verify project A locally',
              'Show/copy exact Client ID and run ZERO-API Local Diagnostics',
              'Switch same-project channel then different-project channel',
              'Return to project A and physically open official Google Cloud Console',
              'Restart real app and verify diagnostics persistence',
              'Final no-secret evidence scan',
          ]
          names = [name for name, _ in scripts]
          if names != expected:
              raise SystemExit(f'Canonical acceptance script set changed unexpectedly: {names!r}')

          for name, script in scripts:
              print(f'::group::{name}', flush=True)
              subprocess.run(['bash', '-c', 'set -Eeuo pipefail\n' + script], check=True, env=os.environ.copy())
              print('::endgroup::', flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-google-project-diagnostics-real-ui-evidence-retry
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-google-project-diagnostics-ARM64-DEV-retry
          path: dev-out/VYRON-2.1.3-GoogleProject-Diagnostics-ARM64-DEV.app.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pkill -if 'VYRON|channelflow' || true
          pkill -x Safari || true
          pkill -x 'Google Chrome' || true
