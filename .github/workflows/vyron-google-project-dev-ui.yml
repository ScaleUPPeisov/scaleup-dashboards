name: VYRON Google Project Diagnostics ARM64 Dev UI

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths: ['.github/workflows/vyron-google-project-dev-ui.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  TARGETED_RUN: '34735206801'
  TARGETED_ARTIFACT: 'VYRON-google-project-diagnostics-green-source'
  GREEN_SOURCE_SHA256: 'a6d00f2d8bbe38f75f17ba6526973bc759e5d34a442931679b551fbc1a0dc512'
  CLIENT_A: '123456789012-abcdefghijklmnop.apps.googleusercontent.com'
  CLIENT_C: '987654321098-zyxwvutsrqponmlk.apps.googleusercontent.com'
  PROJECT_ID: 'vyron-diagnostics-test-project'

jobs:
  dev-ui:
    runs-on: macos-14
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Restore exact targeted-green source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf green work evidence dev-out
          mkdir -p green work evidence dev-out
          gh run download "$TARGETED_RUN" --repo "$REPO" -n "$TARGETED_ARTIFACT" -D green
          test -s green/VYRON-2.1.3-google-project-diagnostics-dev-source.tar.gz
          test "$(awk '{print $1}' green/SOURCE_SHA256.txt)" = "$GREEN_SOURCE_SHA256"
          test "$(shasum -a 256 green/VYRON-2.1.3-google-project-diagnostics-dev-source.tar.gz|awk '{print $1}')" = "$GREEN_SOURCE_SHA256"
          tar -xzf green/VYRON-2.1.3-google-project-diagnostics-dev-source.tar.gz -C work
          test "$(node -p "require('./work/package.json').version")" = '2.1.3'
          printf '%s\n' "$GREEN_SOURCE_SHA256" > evidence/green-source-sha256.txt

      - name: Build development ARM64 app only
        shell: bash
        working-directory: work
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin
          npm ci --no-audit --no-fund
          npx tauri build --target aarch64-apple-darwin --bundles app
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.3'
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = '2.1.3'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          file "$APP/Contents/MacOS/$EXE" | tee "$GITHUB_WORKSPACE/evidence/binary-file.txt" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -rf "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          cp -R "$APP" "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          chmod -R u+rwX "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app" || true
          echo "DEV_APP=$RUNNER_TEMP/VYRON-GoogleProject-Diagnostics.app" >> "$GITHUB_ENV"
          plutil -p "$APP/Contents/Info.plist" > "$GITHUB_WORKSPACE/evidence/info-plist.txt"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/dev-out/VYRON-2.1.3-GoogleProject-Diagnostics-ARM64-DEV.app.zip"

      - name: Seed safe local metadata fixture with no secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          DATA="$HOME/Library/Application Support/studio.channelflow.desktop"
          rm -rf "$DATA"
          mkdir -p "$DATA"
          cat > "$DATA/license.json" <<'JSON'
          {"valid":true,"type":"ci-google-project-diagnostics","expiresAt":null,"maskedKey":"CI••••TEST"}
          JSON
          cat > "$DATA/youtube-oauth.json" <<JSON
          {"profiles":[
            {"id":"profile-safe-a","client_id":"$CLIENT_A","channel_id":"UC_DIAGNOSTICS_A","channel_title":"Diagnostics Test Channel A","expires_at":0,"connected_at":"2026-09-13T00:00:00Z","scopes":[],"preferred_browser":"","identity_validated_at":null,"identity_validated_channel_id":null},
            {"id":"profile-safe-b","client_id":"$CLIENT_A","channel_id":"UC_DIAGNOSTICS_B","channel_title":"Diagnostics Test Channel B","expires_at":0,"connected_at":"2026-09-13T00:00:00Z","scopes":[],"preferred_browser":"","identity_validated_at":null,"identity_validated_channel_id":null},
            {"id":"profile-safe-c","client_id":"$CLIENT_C","channel_id":"UC_DIAGNOSTICS_C","channel_title":"Diagnostics Different Project C","expires_at":0,"connected_at":"2026-09-13T00:00:00Z","scopes":[],"preferred_browser":"","identity_validated_at":null,"identity_validated_channel_id":null}
          ]}
          JSON
          cat > "$DATA/google-config.json" <<JSON
          {"client_id":"$CLIENT_A","project_id":"$PROJECT_ID"}
          JSON
          cat > "$DATA/state.json" <<'JSON'
          {"version":8,"channels":[
            {"id":"channel-a","name":"Diagnostics Channel A","slug":"diagnostics-a","cadenceDays":4,"targetBufferDays":60,"publishHour":18,"publishMinute":0,"language":"EN","genre":"Music","country":"US","minTracks":10,"targetDurationMin":120,"enabled":true,"youtubeProfileId":"profile-safe-a","seo":{"titlePatterns":[],"descriptionTemplate":"","tags":[],"banned":[]}},
            {"id":"channel-b","name":"Diagnostics Channel B","slug":"diagnostics-b","cadenceDays":4,"targetBufferDays":60,"publishHour":18,"publishMinute":0,"language":"EN","genre":"Music","country":"US","minTracks":10,"targetDurationMin":120,"enabled":true,"youtubeProfileId":"profile-safe-b","seo":{"titlePatterns":[],"descriptionTemplate":"","tags":[],"banned":[]}},
            {"id":"channel-c","name":"Diagnostics Different C","slug":"diagnostics-c","cadenceDays":4,"targetBufferDays":60,"publishHour":18,"publishMinute":0,"language":"EN","genre":"Music","country":"US","minTracks":10,"targetDurationMin":120,"enabled":true,"youtubeProfileId":"profile-safe-c","seo":{"titlePatterns":[],"descriptionTemplate":"","tags":[],"banned":[]}}
          ],"jobs":[],"competitors":[],"settings":{"workspace":"","endlumePath":"","youtubeApiKey":"","autoCheckUpdates":false,"reduceMotion":false,"fpsMonitor":false},"logs":[],"uploadHistory":[],"fingerprintCache":{},"projectLifecycle":{}}
          JSON
          chmod 600 "$DATA"/*.json
          if grep -ERi 'client_secret|access_token|refresh_token|authorization' "$DATA"; then echo 'Fixture unexpectedly contains a secret-shaped field'; exit 1; fi
          echo 'SAFE FIXTURE: NO TOKEN/SECRET FIELDS'

      - name: Launch real development VYRON.app
        shell: bash
        run: |
          set -Eeuo pipefail
          open -na "$DEV_APP"
          for i in {1..30}; do pgrep -if "$DEV_APP/Contents/MacOS/channelflow" >/dev/null && break; sleep 1; done
          pgrep -if "$DEV_APP/Contents/MacOS/channelflow" >/dev/null
          sleep 4
          echo "PID=$(pgrep -if "$DEV_APP/Contents/MacOS/channelflow"|head -1)" | tee evidence/process.txt

      - name: Open Settings → YouTube in real UI
        shell: bash
        run: |
          set -Eeuo pipefail
          osascript <<'APPLESCRIPT'
          on pressNamed(p, wanted)
            repeat with e in entire contents of window 1 of p
              try
                if (name of e as text) is wanted then
                  try
                    perform action "AXPress" of e
                  on error
                    click e
                  end try
                  return true
                end if
              end try
            end repeat
            return false
          end pressNamed
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            if not my pressNamed(p,"⚙ Настройки") then error "Settings button not found"
            delay 1
            if not my pressNamed(p,"YouTube") then error "YouTube settings tab not found"
          end tell
          APPLESCRIPT
          sleep 3
          osascript <<'APPLESCRIPT' > evidence/youtube-settings-ax-before-select.txt
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set out to ""
            repeat with e in entire contents of window 1 of p
              try
                set n to name of e as text
                if n is not "missing value" then set out to out & n & linefeed
              end try
            end repeat
            return out
          end tell
          APPLESCRIPT
          grep -Fq 'GOOGLE CLOUD PROJECT' evidence/youtube-settings-ax-before-select.txt
          grep -Fq 'Выберите OAuth профиль' evidence/youtube-settings-ax-before-select.txt

      - name: Select first OAuth profile and verify project A locally
        shell: bash
        run: |
          set -Eeuo pipefail
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set hit to false
            repeat with e in entire contents of window 1 of p
              try
                set n to name of e as text
                set v to value of e as text
                if n is "Выберите OAuth профиль" or v is "Выберите OAuth профиль" then
                  click e
                  delay 0.5
                  key code 125
                  key code 36
                  set hit to true
                  exit repeat
                end if
              end try
            end repeat
            if hit is false then error "OAuth profile selector not found"
          end tell
          APPLESCRIPT
          sleep 3
          osascript <<'APPLESCRIPT' > evidence/project-a-ax.txt
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set out to ""
            repeat with e in entire contents of window 1 of p
              try
                set n to name of e as text
                if n is not "missing value" then set out to out & n & linefeed
              end try
            end repeat
            return out
          end tell
          APPLESCRIPT
          cat evidence/project-a-ax.txt
          grep -Fq 'Diagnostics Channel A' evidence/project-a-ax.txt
          grep -Fq '123456789012' evidence/project-a-ax.txt
          grep -Fq "$PROJECT_ID" evidence/project-a-ax.txt
          grep -Fq '2 каналов' evidence/project-a-ax.txt
          grep -Fq 'DEFAULT' evidence/project-a-ax.txt
          grep -Fq 'UPLOAD videos.insert QUOTA: 0 / 100' evidence/project-a-ax.txt
          grep -Fq 'GENERAL YOUTUBE API QUOTA: 0 / 10000' evidence/project-a-ax.txt
          screencapture -x evidence/google-project-a.png || true

      - name: Show/copy exact Client ID and run ZERO-API Local Diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          osascript <<'APPLESCRIPT'
          on pressNamed(p,wanted)
            repeat with e in entire contents of window 1 of p
              try
                if (name of e as text) is wanted then
                  try
                    perform action "AXPress" of e
                  on error
                    click e
                  end try
                  return true
                end if
              end try
            end repeat
            return false
          end pressNamed
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            if not my pressNamed(p,"ПОКАЗАТЬ CLIENT ID") then error "Show client ID button missing"
            delay 0.5
            if not my pressNamed(p,"СКОПИРОВАТЬ CLIENT ID") then error "Copy client ID button missing"
            delay 0.5
            if not my pressNamed(p,"ПРОВЕРИТЬ ЛОКАЛЬНУЮ ДИАГНОСТИКУ") then error "Local diagnostics button missing"
          end tell
          APPLESCRIPT
          sleep 2
          PB=$(pbpaste)
          printf '%s\n' "$PB" > evidence/clipboard.txt
          test "$PB" = "$CLIENT_A"
          osascript <<'APPLESCRIPT' > evidence/local-diagnostics-ax.txt
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set out to ""
            repeat with e in entire contents of window 1 of p
              try
                set n to name of e as text
                if n is not "missing value" then set out to out & n & linefeed
              end try
            end repeat
            return out
          end tell
          APPLESCRIPT
          grep -Fq "$CLIENT_A" evidence/local-diagnostics-ax.txt
          grep -Fq 'LOCAL DIAGNOSTICS: PASS' evidence/local-diagnostics-ax.txt
          grep -Fq 'YouTube API requests: 0' evidence/local-diagnostics-ax.txt
          screencapture -x evidence/local-diagnostics-pass.png || true

      - name: Switch same-project channel then different-project channel
        shell: bash
        run: |
          set -Eeuo pipefail
          # HTML select is the first popup in this card. From A: one Arrow Down => B.
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set hit to false
            repeat with e in entire contents of window 1 of p
              try
                set v to value of e as text
                if v contains "Diagnostics" then
                  click e
                  delay 0.3
                  key code 125
                  key code 36
                  set hit to true
                  exit repeat
                end if
              end try
            end repeat
            if hit is false then error "Profile selector for B not found"
          end tell
          APPLESCRIPT
          sleep 2
          osascript <<'APPLESCRIPT' > evidence/project-b-ax.txt
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set out to ""
            repeat with e in entire contents of window 1 of p
              try
                set n to name of e as text
                if n is not "missing value" then set out to out & n & linefeed
              end try
            end repeat
            return out
          end tell
          APPLESCRIPT
          grep -Fq 'Diagnostics Channel B' evidence/project-b-ax.txt
          grep -Fq "$PROJECT_ID" evidence/project-b-ax.txt
          grep -Fq '2 каналов' evidence/project-b-ax.txt
          grep -Fq 'UPLOAD videos.insert QUOTA: 0 / 100' evidence/project-b-ax.txt
          # B -> C, which must no longer use the GCP project identity.
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set hit to false
            repeat with e in entire contents of window 1 of p
              try
                set v to value of e as text
                if v contains "Diagnostics" then
                  click e
                  delay 0.3
                  key code 125
                  key code 36
                  set hit to true
                  exit repeat
                end if
              end try
            end repeat
            if hit is false then error "Profile selector for C not found"
          end tell
          APPLESCRIPT
          sleep 2
          osascript <<'APPLESCRIPT' > evidence/project-c-ax.txt
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set out to ""
            repeat with e in entire contents of window 1 of p
              try
                set n to name of e as text
                if n is not "missing value" then set out to out & n & linefeed
              end try
            end repeat
            return out
          end tell
          APPLESCRIPT
          grep -Fq 'Diagnostics Different C' evidence/project-c-ax.txt
          grep -Fq '987654321098' evidence/project-c-ax.txt
          if grep -Fq "$PROJECT_ID" evidence/project-c-ax.txt; then echo 'Different client incorrectly inherited Project ID'; exit 1; fi
          grep -Fq 'Не определён локально' evidence/project-c-ax.txt
          grep -Fq '1 каналов' evidence/project-c-ax.txt

      - name: Return to project A and physically open official Google Cloud Console
        shell: bash
        run: |
          set -Eeuo pipefail
          # C -> A by two Arrow Up keys.
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set hit to false
            repeat with e in entire contents of window 1 of p
              try
                set v to value of e as text
                if v contains "Diagnostics" then
                  click e
                  delay 0.3
                  key code 126
                  key code 126
                  key code 36
                  set hit to true
                  exit repeat
                end if
              end try
            end repeat
            if hit is false then error "Profile selector return to A not found"
          end tell
          APPLESCRIPT
          sleep 2
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            repeat with e in entire contents of window 1 of p
              try
                if (name of e as text) is "ОТКРЫТЬ GOOGLE CLOUD" then
                  try
                    perform action "AXPress" of e
                  on error
                    click e
                  end try
                  exit repeat
                end if
              end try
            end repeat
          end tell
          APPLESCRIPT
          sleep 5
          URL=''
          URL=$(osascript -e 'tell application "Safari" to if it is running then return URL of front document' 2>/dev/null || true)
          if [ -z "$URL" ]; then URL=$(osascript -e 'tell application "Google Chrome" to if it is running then return URL of active tab of front window' 2>/dev/null || true); fi
          printf '%s\n' "$URL" | tee evidence/google-cloud-opened-url.txt
          test -n "$URL"
          python3 - "$URL" <<'PY'
          import sys,urllib.parse
          u=urllib.parse.urlparse(sys.argv[1])
          assert u.scheme=='https'
          assert u.hostname=='console.cloud.google.com',u.hostname
          assert 'project=vyron-diagnostics-test-project' in sys.argv[1]
          print('GOOGLE CLOUD PHYSICAL OPEN: PASS')
          PY

      - name: Restart real app and verify diagnostics persistence
        shell: bash
        run: |
          set -Eeuo pipefail
          pkill -if "$DEV_APP/Contents/MacOS/channelflow" || true
          sleep 2
          open -na "$DEV_APP"
          for i in {1..30}; do pgrep -if "$DEV_APP/Contents/MacOS/channelflow" >/dev/null && break; sleep 1; done
          pgrep -if "$DEV_APP/Contents/MacOS/channelflow" >/dev/null
          sleep 3
          osascript <<'APPLESCRIPT'
          on pressNamed(p,wanted)
            repeat with e in entire contents of window 1 of p
              try
                if (name of e as text) is wanted then
                  try
                    perform action "AXPress" of e
                  on error
                    click e
                  end try
                  return true
                end if
              end try
            end repeat
            return false
          end pressNamed
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            if not my pressNamed(p,"⚙ Настройки") then error "Settings after restart missing"
            delay 1
            if not my pressNamed(p,"YouTube") then error "YouTube after restart missing"
          end tell
          APPLESCRIPT
          sleep 2
          # Select A again; metadata/config must survive restart without OAuth authorization.
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            repeat with e in entire contents of window 1 of p
              try
                set n to name of e as text
                set v to value of e as text
                if n is "Выберите OAuth профиль" or v is "Выберите OAuth профиль" then
                  click e
                  delay 0.3
                  key code 125
                  key code 36
                  exit repeat
                end if
              end try
            end repeat
          end tell
          APPLESCRIPT
          sleep 2
          osascript <<'APPLESCRIPT' > evidence/restart-ax.txt
          tell application "System Events"
            set p to first application process whose name is "channelflow"
            set out to ""
            repeat with e in entire contents of window 1 of p
              try
                set n to name of e as text
                if n is not "missing value" then set out to out & n & linefeed
              end try
            end repeat
            return out
          end tell
          APPLESCRIPT
          grep -Fq 'Diagnostics Channel A' evidence/restart-ax.txt
          grep -Fq "$PROJECT_ID" evidence/restart-ax.txt
          grep -Fq '2 каналов' evidence/restart-ax.txt
          grep -Fq 'UPLOAD videos.insert QUOTA: 0 / 100' evidence/restart-ax.txt
          screencapture -x evidence/after-restart.png || true

      - name: Final no-secret evidence scan
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -ERniE 'client_secret|access_token|refresh_token|Authorization:|Bearer [A-Za-z0-9._-]+' evidence; then
            echo 'SECRET LEAK IN EVIDENCE'; exit 1
          fi
          cat > evidence/RESULT.txt <<EOF
          ARM64 development build: PASS
          Real VYRON.app launch: PASS
          Settings → YouTube → Google Cloud Project: PASS
          Same-project sharing (A/B): PASS
          Different-project isolation (C): PASS
          Exact Client ID clipboard: PASS
          Local diagnostics: PASS
          YouTube API requests by diagnostics: 0
          Google Cloud physical open: PASS
          Restart persistence: PASS
          Secret leak evidence scan: PASS
          Fixture is safe local metadata only; it is not claimed to be the user's real Google profile.
          EOF
          cat evidence/RESULT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-google-project-diagnostics-real-ui-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYRON-google-project-diagnostics-ARM64-DEV
          path: dev-out/VYRON-2.1.3-GoogleProject-Diagnostics-ARM64-DEV.app.zip
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pkill -if 'VYRON|channelflow' || true
          pkill -x Safari || true
          pkill -x 'Google Chrome' || true
