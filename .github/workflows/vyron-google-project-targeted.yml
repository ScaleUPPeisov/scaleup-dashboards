name: VYRON Google Project Diagnostics Targeted Gate

on:
  push:
    branches: [feature/vyron-google-project-diagnostics]
    paths:
      - '.github/scripts/apply_v213_google_project_diagnostics.py'
      - '.github/workflows/vyron-google-project-targeted.yml'
      - 'vyron-v213-google-project/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_SOURCE_SHA256: 0a52bef2b38b1aefd0f0d76b7dd7bcb0763dafc6680cd366c72eb97c0556a9ad

jobs:
  targeted:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Restore exact released VYRON 2.1.3 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base feature source-download green-source
          mkdir -p base feature source-download
          gh release download v2.1.3 --repo "$REPO" --dir source-download --pattern 'VYRON-2.1.3-source.tar.gz' --pattern 'SOURCE_SHA256.txt'
          test -s source-download/VYRON-2.1.3-source.tar.gz
          test "$(awk '{print $1}' source-download/SOURCE_SHA256.txt)" = "$BASE_SOURCE_SHA256"
          test "$(shasum -a 256 source-download/VYRON-2.1.3-source.tar.gz|awk '{print $1}')" = "$BASE_SOURCE_SHA256"
          tar -xzf source-download/VYRON-2.1.3-source.tar.gz -C base
          cp -R base/. feature/
          test "$(node -p "require('./base/package.json').version")" = '2.1.3'

      - name: Apply diagnostics overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/apply_v213_google_project_diagnostics.py feature "$GITHUB_WORKSPACE/vyron-v213-google-project"

      - name: Prove strict feature scope and zero-API architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,pathlib
          a=pathlib.Path('base'); b=pathlib.Path('feature')
          def hs(root): return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and 'node_modules/' not in str(p)}
          aa,bb=hs(a),hs(b)
          changed={k for k in set(aa)|set(bb) if aa.get(k)!=bb.get(k)}
          allowed={'src-tauri/src/youtube.rs','src-tauri/src/lib.rs','src/api.ts','src/SettingsOS.tsx','src/googleProjectDiagnostics.ts','src/googleProjectDiagnostics.test.ts'}
          assert changed==allowed,(sorted(changed),sorted(allowed-changed),sorted(changed-allowed))
          untouched=['src/PublisherOS.tsx','src/youtubeQuota.ts','src/MetadataPage.tsx','src/shortsCore.ts','src-tauri/src/production_manager.rs','src-tauri/src/shorts_factory.rs','src-tauri/src/security.rs']
          for p in untouched: assert aa[p]==bb[p],p
          api=(b/'src/api.ts').read_text(); settings=(b/'src/SettingsOS.tsx').read_text(); rust=(b/'src-tauri/src/youtube.rs').read_text(); lib=(b/'src-tauri/src/lib.rs').read_text()
          assert "youtubeGoogleProjectDiagnostic:(profileId:string)=>invoke<GoogleProjectDiagnosticSafe>('youtube_google_project_diagnostic',{profileId})" in api
          assert "ytInvoke<GoogleProjectDiagnosticSafe>('youtube_google_project_diagnostic'" not in api
          assert 'youtube_google_project_diagnostic' in lib
          cmd=rust[rust.index('pub fn youtube_google_project_diagnostic'):rust.index('fn load_or_migrate_google_config')]
          for forbidden in ['reqwest','emit_youtube_api_request','valid_access_token','refresh_token','access_token','client_secret','get_secret']:
            assert forbidden not in cmd,forbidden
          safe_struct=rust[rust.index('struct SafeGoogleMetadata'):rust.index('fn google_project_diagnostic_value')]
          for forbidden in ['client_secret','refresh_token','access_token','api_key']:
            assert forbidden not in safe_struct,forbidden
          for token in ['GOOGLE CLOUD PROJECT','OAuth Client ID','Project number','Project ID','VYRON project identity','Local videos.insert used today','Configured upload limit','Источник лимита','Расчётный остаток','LOCAL DIAGNOSTICS','GENERAL YOUTUBE API QUOTA','UPLOAD videos.insert QUOTA','YOUTUBE ACCOUNT/CHANNEL UPLOAD LIMIT','ОТКРЫТЬ GOOGLE CLOUD','СКОПИРОВАТЬ CLIENT ID']:
            assert token in settings,token
          assert 'navigator.clipboard.writeText(googleProjectDiag.clientId)' in settings
          print('STRICT FEATURE SCOPE: PASS')
          print('ZERO YOUTUBE API DIAGNOSTIC COMMAND: PASS')
          print('\n'.join(sorted(changed)))
          PY

      - name: Targeted frontend tests only
        shell: bash
        working-directory: feature
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npx vitest run src/googleProjectDiagnostics.test.ts src/dynamicUploadQuota.test.ts src/publisherQuota.test.ts

      - name: Targeted Rust safe DTO test only
        shell: bash
        working-directory: feature/src-tauri
        run: |
          set -Eeuo pipefail
          cargo test google_project_diagnostic_is_metadata_only_and_secret_redacted --lib -- --nocapture | tee /tmp/google-project-rust-test.txt
          grep -Eq 'test .*google_project_diagnostic_is_metadata_only_and_secret_redacted .* ok' /tmp/google-project-rust-test.txt
          grep -Eq '1 passed; 0 failed' /tmp/google-project-rust-test.txt

      - name: TypeScript
        shell: bash
        working-directory: feature
        run: npx tsc --noEmit

      - name: Frontend production build
        shell: bash
        working-directory: feature
        run: npm run build

      - name: Package exact targeted-green development source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir green-source
          tar -czf green-source/VYRON-2.1.3-google-project-diagnostics-dev-source.tar.gz --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' -C feature .
          (cd green-source && shasum -a 256 VYRON-2.1.3-google-project-diagnostics-dev-source.tar.gz > SOURCE_SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-google-project-diagnostics-green-source
          path: green-source/
          if-no-files-found: error
          retention-days: 30
