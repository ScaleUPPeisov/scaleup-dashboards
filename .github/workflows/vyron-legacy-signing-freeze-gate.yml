name: VYRON legacy signer freeze gate

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/security/check-legacy-vyron-signers.mjs'
      - 'scripts/security/check-obsolete-vyron-publishers.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/security/check-legacy-vyron-signers.mjs'
      - 'scripts/security/check-obsolete-vyron-publishers.mjs'

permissions:
  contents: read

jobs:
  verify-signing-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify obsolete release jobs cannot run
        run: node --test scripts/security/check-legacy-vyron-signers.mjs scripts/security/check-obsolete-vyron-publishers.mjs

  verify-compromised-secrets-revoked:
    # Only inspect secret presence after code is merged to main.
    # Never echo, hash, serialize, or otherwise expose secret values.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LEGACY_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      LEGACY_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Require revocation of compromised updater signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${LEGACY_UPDATER_PRIVATE_KEY:-}" ]]; then
            echo "::error::Compromised TAURI_SIGNING_PRIVATE_KEY is still configured for this workflow context. Remove the repository/organization Actions secret."
            exit 1
          fi
          if [[ -n "${LEGACY_UPDATER_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo "::error::Compromised TAURI_SIGNING_PRIVATE_KEY_PASSWORD is still configured for this workflow context. Remove the repository/organization Actions secret."
            exit 1
          fi
          echo "LEGACY_UPDATER_SIGNING_SECRETS_ABSENT=PASS"
