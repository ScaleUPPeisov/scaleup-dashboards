name: VYRON macOS Ultimate + Analytics 360 safety gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/AiAnalyticsExport.tsx'
      - 'src/Analytics360Page.tsx'
      - 'src/Analytics360Fleet.tsx'
      - 'src/Analytics360Fleet.test.ts'
      - 'src/M1PerformanceProbe.tsx'
      - 'src/analytics360Core.ts'
      - 'src/analytics360Core.test.ts'
      - 'src/Analytics360.css'
      - 'src/App.tsx'
      - 'src/AnalyticsPage.tsx'
      - 'src-tauri/src/analytics_ai_export.rs'
      - 'src-tauri/src/analytics360_cache.rs'
      - 'src-tauri/src/analytics_reach.rs'
      - 'src-tauri/src/storage.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/vyron-mac-ai-export-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-compile-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux prerequisites for Tauri static compile
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Frontend TypeScript + Vite validation
        run: |
          npm ci
          npm run build
          npx vitest run src/analytics360Core.test.ts src/Analytics360Fleet.test.ts
      - name: Rust type checking + exporter unit tests
        working-directory: src-tauri
        run: |
          cargo test --locked --lib analytics_ai_export -- --nocapture
          cargo test --locked --lib analytics360_cache -- --nocapture
          cargo test --locked --lib analytics_reach -- --nocapture
          cargo test --locked --lib v213_storage_tests -- --nocapture
          cargo check --locked
  historical-vitest-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: All historical tests (failures remain visible; no legacy test rewriting)
        run: |
          npm ci
          npm test
  mac-arm64-compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: TypeScript, Vite and strict Analytics 360 tests
        run: |
          npm ci
          npm run build
          npx vitest run src/analytics360Core.test.ts src/Analytics360Fleet.test.ts
      - name: Rust build tests on macOS ARM64
        working-directory: src-tauri
        run: |
          cargo test --locked --lib analytics_ai_export -- --nocapture
          cargo test --locked --lib analytics360_cache -- --nocapture
          cargo test --locked --lib analytics_reach -- --nocapture
          cargo test --locked --lib v213_storage_tests -- --nocapture
          cargo check --locked --target aarch64-apple-darwin
