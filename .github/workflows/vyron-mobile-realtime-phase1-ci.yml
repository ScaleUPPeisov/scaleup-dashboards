name: VYRON Mobile Realtime Phase 1 Full Gate

on:
  push:
    branches:
      - feature/vyron-mobile-design-lock
    paths:
      - 'vyron-mobile/**'
      - 'supabase/functions/vyron-mobile-sync-ingest/**'
      - '.github/workflows/vyron-mobile-realtime-phase1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-mobile-realtime-phase1-ci
  cancel-in-progress: true

jobs:
  mobile-js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vyron-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production iOS JS export
        run: npx expo export --platform ios --output-dir dist-ios

  ios-simulator-build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vyron-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build for iPhone Simulator
        run: |
          set -Eeuo pipefail
          xcodebuild             -workspace ios/VYRON.xcworkspace             -scheme VYRON             -sdk iphonesimulator             -configuration Release             -derivedDataPath "$RUNNER_TEMP/vyron-mobile-derived"             CODE_SIGNING_ALLOWED=NO             build
      - name: Package iPhone Simulator acceptance app
        run: |
          set -Eeuo pipefail
          APP="$RUNNER_TEMP/vyron-mobile-derived/Build/Products/Release-iphonesimulator/VYRON.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/VYRON-Mobile-iPhoneSimulator.zip"
          shasum -a 256 "$RUNNER_TEMP/VYRON-Mobile-iPhoneSimulator.zip" > "$RUNNER_TEMP/VYRON-Mobile-iPhoneSimulator.sha256"
      - name: Standalone iPhone 14 Pro Simulator smoke
        run: |
          set -Eeuo pipefail
          APP="$RUNNER_TEMP/vyron-mobile-derived/Build/Products/Release-iphonesimulator/VYRON.app"
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devicetypes"]; print(next(x["identifier"] for x in d if x["name"]=="iPhone 14 Pro"))')"
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x.get("platform")=="iOS"]; d.sort(key=lambda x:x.get("version","")); print(d[-1]["identifier"])')"
          UDID="$(xcrun simctl create "VYRON Acceptance iPhone 14 Pro" "$DEVICE_TYPE" "$RUNTIME")"
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          LAUNCH="$(xcrun simctl launch "$UDID" com.scaleup.vyronmobile)"
          printf '%s\n' "$LAUNCH"
          printf '%s\n' "$LAUNCH" | grep -E 'com\.scaleup\.vyronmobile: [0-9]+'
          echo IPHONE_14_PRO_STANDALONE_LAUNCH=PASS
      - name: Upload iPhone Simulator acceptance app
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-MOBILE-IPHONE-SIMULATOR
          path: |
            ${{ runner.temp }}/VYRON-Mobile-iPhoneSimulator.zip
            ${{ runner.temp }}/VYRON-Mobile-iPhoneSimulator.sha256
          retention-days: 5
