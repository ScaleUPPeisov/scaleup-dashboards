name: VYRON Native Keychain Diagnostic Candidate

on:
  push:
    branches:
      - repair/vyron-native-keychain-diagnostic
    paths:
      - '.github/diagnostic/vyron-native-keychain-trigger.txt'

permissions:
  contents: read

concurrency:
  group: vyron-native-keychain-diagnostic-candidate
  cancel-in-progress: false

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_TAG: v2.1.2
  VERSION: '2.1.2'

jobs:
  targeted-repair-and-candidate:
    name: Native Keychain A-K + ARM64 diagnostic candidate
    runs-on: macos-14
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble exact published 2.1.2 source and apply native repair
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vyron-native-repair"
          SRC="$RUNNER_TEMP/vyron-native-source"
          PATCH="$RUNNER_TEMP/apply_native_repair.py"
          rm -rf "$ROOT" "$SRC"
          mkdir -p "$ROOT" "$SRC"

          gh release download "$BASE_TAG" --repo "$REPO" --dir "$SRC" \
            --pattern 'VYRON-2.1.2-source.tar.gz' --pattern 'SOURCE_SHA256.txt'
          cd "$SRC"
          expected="$(awk '{print $1}' SOURCE_SHA256.txt)"
          actual="$(shasum -a 256 VYRON-2.1.2-source.tar.gz | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          tar -xzf VYRON-2.1.2-source.tar.gz -C "$ROOT"

          cd "$GITHUB_WORKSPACE"
          cat .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.00 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.01 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02a \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02b \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.03 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.part01 \
              .github/scripts/vyron_native_keychain_repair.py.gz.b64.part02 \
            | base64 --decode | gunzip > "$PATCH"
          test "$(shasum -a 256 "$PATCH" | awk '{print $1}')" = '4196bc3e2199e3e038120f37128eb2d5ccb412177c25436a751b9f5ec53fe7ea'
          python3 "$PATCH" "$ROOT"
          python3 .github/scripts/apply_native_keychain_compilefix.py "$ROOT"

          cd "$ROOT"
          test "$(node -p "require('./package.json').version")" = '2.1.2'
          grep -q 'ItemSearchOptions' src-tauri/src/security.rs
          grep -q 'ItemClass::generic_password()' src-tauri/src/security.rs
          grep -q 'load_attributes(true)' src-tauri/src/security.rs
          grep -q 'Limit::All' src-tauri/src/security.rs
          if grep -q 'dump-keychain' src-tauri/src/security.rs; then
            echo 'Shell dump-keychain still present in production recovery'
            exit 1
          fi
          grep -q 'youtube_oauth_recovery_diagnostic' src-tauri/src/youtube.rs
          grep -q 'KEYCHAIN_ACCESS_DENIED' src-tauri/src/youtube.rs
          grep -q 'REFRESH_TOKEN_REVOKED' src-tauri/src/youtube.rs
          grep -q 'CHANNEL_ID_MISMATCH' src-tauri/src/youtube.rs
          grep -q 'SKIPPED_PAST_DATE' src/publisherRuntime.ts
          echo 'NATIVE KEYCHAIN CONTRACTS: PASS'

      - name: Targeted frontend A-K schedule and diagnostic safety tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/vyron-native-repair"
          npm ci --no-audit --no-fund
          npx vitest run src/nativeRecoverySafety.test.ts src/publisherSchedule.test.ts
          npm run build

      - name: Rust recovery taxonomy tests A-H
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/vyron-native-repair"
          cargo test --manifest-path src-tauri/Cargo.toml native_keychain_recovery_state_tests -- --nocapture

      - name: Real macOS Security.framework enumeration smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/vyron-native-repair"
          cargo test --manifest-path src-tauri/Cargo.toml native_enumeration_tests -- --nocapture

      - name: Normalize updater signing material for candidate build
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key')
          pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          PY

      - name: Build and verify ARM64 diagnostic candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vyron-native-repair"
          cd "$ROOT"
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -d "$APP"
          test -s "$DMG"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.2'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          test -x "$APP/Contents/MacOS/$EXE"
          file "$APP/Contents/MacOS/$EXE" | grep -q 'arm64'
          otool -hv "$APP/Contents/MacOS/$EXE" | grep -q 'ARM64'
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"

          OUT="$GITHUB_WORKSPACE/diagnostic-candidate"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$DMG" "$OUT/VYRON-2.1.2-Native-Keychain-Diagnostic-ARM64.dmg"
          shasum -a 256 "$OUT/VYRON-2.1.2-Native-Keychain-Diagnostic-ARM64.dmg" > "$OUT/SHA256.txt"
          cat > "$OUT/REAL_MAC_ACCEPTANCE.txt" <<'TXT'
          VYRON 2.1.2 native-Keychain diagnostic candidate.
          This is NOT a stable release and does NOT update the stable updater.

          On the problem Mac:
          1. Install/open this candidate.
          2. Open Settings -> Diagnostics.
          3. Select the affected YouTube channel/profile.
          4. Run OAuth recovery diagnostic.
          5. Capture only the safe diagnostic JSON/statuses shown there.

          The diagnostic intentionally does not expose refresh_token, access_token, or client_secret values.
          Stable release is blocked until real-Mac acceptance.
          TXT
          echo "CANDIDATE_DMG_SHA256=$(awk '{print $1}' "$OUT/SHA256.txt")"
          echo 'ARM64 DIAGNOSTIC CANDIDATE: PASS'

      - name: Upload diagnostic candidate only
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.2-native-keychain-diagnostic-candidate
          path: diagnostic-candidate/
          if-no-files-found: error
          retention-days: 30
