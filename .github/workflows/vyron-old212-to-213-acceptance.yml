name: VYRON Real Old Client 2.1.2 → 2.1.3 Acceptance

on:
  push:
    branches: [repair/vyron-native-keychain-diagnostic]
    paths: ['.github/workflows/vyron-old212-to-213-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  OLD_RUN: '34508993436'
  OLD_ARTIFACT: 'VYRON-2.1.2-production-candidate'

jobs:
  acceptance:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Restore actual previously-published 2.1.2 app
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          mkdir old
          gh run download "$OLD_RUN" --repo "$REPO" -n "$OLD_ARTIFACT" -D old
          test -s old/VYRON-2.1.2-macOS-AppleSilicon.dmg
          M="$RUNNER_TEMP/old212-dmg"; mkdir -p "$M"
          hdiutil attach old/VYRON-2.1.2-macOS-AppleSilicon.dmg -nobrowse -readonly -mountpoint "$M" >/dev/null
          cp -R "$M/VYRON.app" "$RUNNER_TEMP/VYRON.app"
          hdiutil detach "$M" >/dev/null
          APP="$RUNNER_TEMP/VYRON.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.2'
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = '2.1.2'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          chmod -R u+rwX "$APP"
          xattr -dr com.apple.quarantine "$APP" || true
          echo "TEST_APP=$APP" >> "$GITHUB_ENV"
          echo 'OLD CLIENT START VERSION: 2.1.2'

      - name: Seed isolated valid app state
        shell: bash
        run: |
          set -Eeuo pipefail
          DATA="$HOME/Library/Application Support/studio.channelflow.desktop"
          rm -rf "$DATA"; mkdir -p "$DATA"
          cat > "$DATA/license.json" <<'JSON'
          {"valid":true,"type":"ci-updater-acceptance","expiresAt":null,"maskedKey":"CI••••TEST"}
          JSON
          cat > "$DATA/state.json" <<'JSON'
          {"version":8,"channels":[],"jobs":[],"competitors":[],"settings":{"workspace":"","endlumePath":"","youtubeApiKey":"","autoCheckUpdates":true,"reduceMotion":false,"fpsMonitor":false},"logs":[],"uploadHistory":[],"fingerprintCache":{},"projectLifecycle":{}}
          JSON

      - name: Launch real old app and prove 2.1.3 is found
        shell: bash
        run: |
          set -Eeuo pipefail
          open -na "$TEST_APP"

          for i in {1..60}; do
            pid=$(pgrep -if "$TEST_APP/Contents/MacOS/channelflow" | head -1 || true)
            if [ -n "$pid" ]; then break; fi
            sleep 1
          done
          test -n "${pid:-}"
          echo "OLD_PID=$pid" >> "$GITHUB_ENV"
          echo "OLD_PID=$pid"

          # Bring the actual app to the foreground. Failure here is evidence, not something to swallow.
          osascript <<'APPLESCRIPT' || true
          tell application "System Events"
            try
              set p to first application process whose name is "channelflow"
              set frontmost of p to true
            end try
          end tell
          APPLESCRIPT

          found=0
          for i in {1..120}; do
            text=$(osascript <<'APPLESCRIPT'
          tell application "System Events"
            try
              set p to first application process whose name is "channelflow"
              set out to ""
              set windowCount to count of windows of p
              set out to out & "WINDOW_COUNT=" & windowCount & linefeed
              repeat with w in windows of p
                try
                  set out to out & "WINDOW=" & (name of w as text) & linefeed
                end try
                repeat with e in entire contents of w
                  set lineText to ""
                  try
                    set lineText to lineText & " role=" & (role of e as text)
                  end try
                  try
                    set lineText to lineText & " name=" & (name of e as text)
                  end try
                  try
                    set lineText to lineText & " value=" & (value of e as text)
                  end try
                  try
                    set lineText to lineText & " description=" & (description of e as text)
                  end try
                  if lineText is not "" then set out to out & lineText & linefeed
                end repeat
              end repeat
              return out
            on error errMsg number errNum
              return "__AX_ERROR__ " & errNum & " " & errMsg
            end try
          end tell
          APPLESCRIPT
            )
            printf '%s\n' "$text" > /tmp/update-ui.txt
            if printf '%s\n' "$text" | grep -Fq '2.1.3' && printf '%s\n' "$text" | grep -Fq 'ОБНОВИТЬ'; then
              found=1
              break
            fi
            # Keep the last accessibility error visible in the Actions log instead of hiding it.
            if printf '%s\n' "$text" | grep -Fq '__AX_ERROR__'; then
              printf '%s\n' "$text"
            fi
            sleep 1
          done

          cat /tmp/update-ui.txt
          test "$found" = 1
          echo 'OLD CLIENT CHECK UPDATE: 2.1.3 FOUND — PASS'

      - name: Press real ОБНОВИТЬ button in old app
        shell: bash
        run: |
          set -Eeuo pipefail
          pressed=0
          for i in {1..30}; do
            result=$(osascript <<'APPLESCRIPT'
          tell application "System Events"
            try
              set p to first application process whose name is "channelflow"
              set frontmost of p to true
              repeat with w in windows of p
                repeat with e in entire contents of w
                  try
                    if (role of e as text) is "AXButton" and (name of e as text) is "ОБНОВИТЬ" then
                      try
                        perform action "AXPress" of e
                      on error
                        click e
                      end try
                      return "PRESSED"
                    end if
                  end try
                end repeat
              end repeat
              return "NOT_FOUND"
            on error errMsg number errNum
              return "AX_ERROR " & errNum & " " & errMsg
            end try
          end tell
          APPLESCRIPT
            )
            echo "$result"
            if [ "$result" = 'PRESSED' ]; then pressed=1; break; fi
            sleep 1
          done
          test "$pressed" = 1
          echo 'REAL UPDATE BUTTON PRESSED'

      - name: Wait for download, install and relaunch
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "OLD_PID=$OLD_PID"
          upgraded=0
          relaunched=0
          for i in {1..240}; do
            if [ -f "$TEST_APP/Contents/Info.plist" ]; then
              v=$(plutil -extract CFBundleShortVersionString raw -o - "$TEST_APP/Contents/Info.plist" 2>/dev/null || true)
              if [ "$v" = '2.1.3' ]; then upgraded=1; fi
            fi

            current_pids=$(pgrep -if "$TEST_APP/Contents/MacOS/channelflow" || true)
            if [ "$upgraded" = 1 ] && [ -n "$current_pids" ]; then
              if ! printf '%s\n' "$current_pids" | grep -Fxq "$OLD_PID"; then
                relaunched=1
                break
              fi
            fi
            sleep 1
          done

          echo "BUNDLE_UPGRADED=$upgraded"
          echo "RELAUNCHED=$relaunched"
          test "$upgraded" = 1
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$TEST_APP/Contents/Info.plist")" = '2.1.3'
          test "$(plutil -extract CFBundleVersion raw -o - "$TEST_APP/Contents/Info.plist")" = '2.1.3'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$TEST_APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$TEST_APP/Contents/Info.plist")
          file "$TEST_APP/Contents/MacOS/$EXE" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$TEST_APP"
          test "$relaunched" = 1
          echo "NEW_PIDS=$(pgrep -if "$TEST_APP/Contents/MacOS/channelflow" | tr '\n' ' ')"
          echo 'OLD 2.1.2 → DOWNLOAD → INSTALL → RELAUNCH → 2.1.3: PASS'

      - name: Prove same-version client is now up to date
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 8
          text=$(osascript <<'APPLESCRIPT'
          tell application "System Events"
            try
              set p to first application process whose name is "channelflow"
              set out to ""
              repeat with w in windows of p
                repeat with e in entire contents of w
                  try
                    set out to out & " role=" & (role of e as text) & " name=" & (name of e as text) & linefeed
                  end try
                end repeat
              end repeat
              return out
            on error errMsg number errNum
              return "__AX_ERROR__ " & errNum & " " & errMsg
            end try
          end tell
          APPLESCRIPT
          )
          printf '%s\n' "$text" > /tmp/post-update-ui.txt
          cat /tmp/post-update-ui.txt
          if printf '%s\n' "$text" | grep -Fq 'Новое обновление' && printf '%s\n' "$text" | grep -Fq 'ОБНОВИТЬ'; then
            echo 'Unexpected same-version update prompt'
            exit 1
          fi
          echo 'SAME VERSION 2.1.3 → UP TO DATE: PASS'

      - name: Capture acceptance evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/vyron-acceptance
          cp /tmp/update-ui.txt /tmp/vyron-acceptance/before-update-ui.txt 2>/dev/null || true
          cp /tmp/post-update-ui.txt /tmp/vyron-acceptance/after-update-ui.txt 2>/dev/null || true
          if [ -f "$TEST_APP/Contents/Info.plist" ]; then
            plutil -p "$TEST_APP/Contents/Info.plist" > /tmp/vyron-acceptance/final-info-plist.txt || true
          fi
          screencapture -x /tmp/vyron-acceptance/final-screen.png || true
          ps aux | grep -Ei 'VYRON|channelflow' | grep -v grep > /tmp/vyron-acceptance/processes.txt || true
          DATA="$HOME/Library/Application Support/studio.channelflow.desktop"
          cp "$DATA/state.json" /tmp/vyron-acceptance/state.json 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vyron-old212-to-213-acceptance-evidence
          path: /tmp/vyron-acceptance/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: pkill -if 'VYRON|channelflow' || true
