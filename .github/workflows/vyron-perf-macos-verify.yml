name: VYRON perf macOS verify (no publish)

on:
  push:
    branches:
      - ci/verify-perf-macos

permissions:
  contents: read

concurrency:
  group: vyron-perf-macos-verify
  cancel-in-progress: true

jobs:
  verify:
    name: macOS build and test (no secrets, no upload, no release)
    runs-on: macos-14
    timeout-minutes: 75
    outputs:
      tsc: ${{ steps.sum.outputs.tsc }}
      fe: ${{ steps.sum.outputs.fe }}
      vfail: ${{ steps.vitest.outputs.vfail }}
      vpass: ${{ steps.vitest.outputs.vpass }}
      ccheck: ${{ steps.sum.outputs.ccheck }}
      ctest: ${{ steps.sum.outputs.ctest }}
      cpass: ${{ steps.cargo_test.outputs.cpass }}
      cfail: ${{ steps.cargo_test.outputs.cfail }}
      tauri: ${{ steps.sum.outputs.tauri }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Source identity
        run: |
          git log --oneline -3
          echo "HEAD=$(git rev-parse HEAD)"
          node -p "'package.json version: '+require('./package.json').version"
          rustc --version && cargo --version && node --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        id: tsc
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Frontend production build
        id: fe
        continue-on-error: true
        run: npm run build

      - name: Unit tests (vitest)
        id: vitest
        continue-on-error: true
        run: |
          npx vitest run --reporter=json --outputFile=vitest.json || true
          node -e "const r=require('./vitest.json');console.log('VITEST failed tests:',r.numFailedTests,'passed:',r.numPassedTests)"
          echo "vfail=$(node -p "require('./vitest.json').numFailedTests")" >> "$GITHUB_OUTPUT"
          echo "vpass=$(node -p "require('./vitest.json').numPassedTests")" >> "$GITHUB_OUTPUT"

      - name: cargo check
        id: cargo_check
        continue-on-error: true
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo test --lib
        id: cargo_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee cargo-test.log
          ec=${PIPESTATUS[0]}
          echo "cpass=$(grep -E '^test result' cargo-test.log | sed -E 's/.* ([0-9]+) passed.*/\1/' | head -1)" >> "$GITHUB_OUTPUT"
          echo "cfail=$(grep -E '^test result' cargo-test.log | sed -E 's/.*passed; ([0-9]+) failed.*/\1/' | head -1)" >> "$GITHUB_OUTPUT"
          exit $ec

      - name: Tauri release binary (compile only, no bundle, no signing)
        id: tauri
        continue-on-error: true
        run: npx tauri build --target aarch64-apple-darwin --no-bundle

      - name: Summary
        id: sum
        if: always()
        run: |
          echo "tsc=${{ steps.tsc.outcome }}" >> "$GITHUB_OUTPUT"
          echo "fe=${{ steps.fe.outcome }}" >> "$GITHUB_OUTPUT"
          echo "ccheck=${{ steps.cargo_check.outcome }}" >> "$GITHUB_OUTPUT"
          echo "ctest=${{ steps.cargo_test.outcome }}" >> "$GITHUB_OUTPUT"
          echo "tauri=${{ steps.tauri.outcome }}" >> "$GITHUB_OUTPUT"

  report:
    name: "RESULT tsc=${{ needs.verify.outputs.tsc }} build=${{ needs.verify.outputs.fe }} vitestFailed=${{ needs.verify.outputs.vfail }} vitestPassed=${{ needs.verify.outputs.vpass }} cargoCheck=${{ needs.verify.outputs.ccheck }} cargoTest=${{ needs.verify.outputs.ctest }} rustPassed=${{ needs.verify.outputs.cpass }} rustFailed=${{ needs.verify.outputs.cfail }} tauriNoBundle=${{ needs.verify.outputs.tauri }}"
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "see job name"
