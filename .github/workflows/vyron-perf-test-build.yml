name: VYRON Perf Test Build (unsigned, isolated, NOT a release)

on:
  push:
    branches:
      - perf/vyron-macos-premium-ui-120hz
    paths:
      - '.github/workflows/vyron-perf-test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      diag: ${{ steps.diag.outputs.line }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      # Isolated build: different bundle id + name => separate data dir/Keychain/updater, no secrets used, no release, no manifests.
      - name: Build isolated test app
        run: |
          npx tauri build --bundles app --target aarch64-apple-darwin \
            --config '{"identifier":"studio.channelflow.perftest","productName":"VYRON PerfTest","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://localhost:9/none.json"]}}}'
      - name: Ad-hoc sign and zip
        run: |
          APP="$(find src-tauri/target -name 'VYRON PerfTest.app' -maxdepth 6 | head -1)"
          echo "APP=$APP"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/VYRON-PerfTest.zip"
          ls -la "$RUNNER_TEMP/VYRON-PerfTest.zip"
      - name: Launch smoke (simulates user download)
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/dl"; rm -rf "$D"; mkdir -p "$D"; ditto -x -k "$RUNNER_TEMP/VYRON-PerfTest.zip" "$D"
          APP="$D/VYRON PerfTest.app"
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$APP"
          OUT=""
          OUT="$OUT\nSPCTL: $(spctl --assess --type execute -vv "$APP" 2>&1)"
          OUT="$OUT\nCODESIGN: $(codesign -dv --verbose=2 "$APP" 2>&1 | head -12)"
          OUT="$OUT\nVERIFY: $(codesign --verify --deep --strict "$APP" 2>&1)"
          OUT="$OUT\nARCH: $(lipo -archs "$APP/Contents/MacOS/"* 2>&1)"
          xattr -cr "$APP"
          BIN="$(ls "$APP/Contents/MacOS/"* | head -1)"
          "$BIN" > "$RUNNER_TEMP/app.log" 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then OUT="$OUT\nALIVE after 20s: YES"; else wait $PID; OUT="$OUT\nALIVE after 20s: NO exit=$?"; fi
          OUT="$OUT\nAPPLOG: $(head -c 3000 "$RUNNER_TEMP/app.log")"
          OUT="$OUT\nCRASH: $(ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -3)"
          kill $PID 2>/dev/null
          echo "::notice title=smoke::$(printf "$OUT" | tr '\n' '|' | head -c 6000)"
      - name: Launch diagnostics
        id: diag
        run: |
          APP="$(find src-tauri/target -name 'VYRON PerfTest.app' -maxdepth 6 | head -1)"
          BIN="$(ls "$APP"/Contents/MacOS/* | head -1)"
          ARCH="$(lipo -info "$BIN" 2>&1 | sed 's/.*: //')"
          SIG="$(codesign --verify --deep --strict "$APP" 2>&1 && echo sig-ok || echo sig-BAD)"
          ( "$BIN" > "$RUNNER_TEMP/run.log" 2>&1 & echo $! > "$RUNNER_TEMP/pid"; sleep 12; if kill -0 "$(cat "$RUNNER_TEMP/pid")" 2>/dev/null; then echo ALIVE > "$RUNNER_TEMP/state"; kill "$(cat "$RUNNER_TEMP/pid")"; else wait "$(cat "$RUNNER_TEMP/pid")" 2>/dev/null; echo "EXIT-$?" > "$RUNNER_TEMP/state"; fi ) || true
          ERR="$(tr '\n' ' ' < "$RUNNER_TEMP/run.log" | cut -c1-220)"
          echo "line=$ARCH | $SIG | $(cat "$RUNNER_TEMP/state") | $ERR" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: VYRON-PerfTest-macOS-arm64
          path: ${{ runner.temp }}/VYRON-PerfTest.zip
          retention-days: 3

  report:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    name: "DIAG ${{ needs.build.outputs.diag }}"
    steps:
      - run: echo done
