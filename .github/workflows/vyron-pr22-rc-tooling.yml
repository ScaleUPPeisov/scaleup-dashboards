name: VYRON PR22 RC tooling safety

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/macos/**'
      - 'scripts/vyron_macos_offline_preflight.py'
      - 'scripts/test_vyron_macos_offline_preflight.py'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/tauri.617-rotated.conf.json'
      - 'src-tauri/tauri.pr22-probe.conf.json'
      - 'docs/VYRON_PR22_MAC_OWNER_RUNBOOK.md'
      - '.github/workflows/vyron-pr22-rc-tooling.yml'
      - '.github/workflows/vyron-pr22-remote-rc.yml'
      - 'docs/security/VYRON_617_UPDATER_KEY_INCIDENT_2026-11-12.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-tooling-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and no release mutations
        run: |
          bash -n scripts/macos/vyron-pr22-release-validation.sh
          bash -n scripts/macos/vyron-617-publish-new-key.sh
          ! grep -E 'gh release|git push|security (add|delete)|notarytool submit|ditto .*/Applications' scripts/macos/vyron-pr22-release-validation.sh
      - name: Incident freeze - legacy updater signer must stay disabled
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          wf = Path('.github/workflows/vyron-pr22-remote-rc.yml').read_text()
          assert 'workflow_dispatch:' in wf and '\npermissions:' in wf
          modes = wf.split('workflow_dispatch:', 1)[1].split('\npermissions:', 1)[0]
          assert '- isolated' in modes
          assert '- local-upgrade-' not in modes and '- signed-upgrade' not in modes
          jobs = wf.split('\njobs:\n', 1)[1]
          blocks = re.split(r'(?=^  [a-z][a-z0-9-]+:\n)', jobs, flags=re.M)
          markers = ('secrets.TAURI_SIGNING_PRIVATE_KEY', 'secrets.VYRON_MACOS_SIGNING_P12_BASE64', 'secrets.APPLE_CERTIFICATE')
          frozen = []
          for block in blocks:
              if not any(marker in block for marker in markers):
                  continue
              name = block.splitlines()[0].strip().rstrip(':')
              assert ('    if: ' + '$' + '{{ false }}' + '\n') in block, 'SIGNING_JOB_NOT_FROZEN:' + name
              frozen.append(name)
          assert set(frozen) == {'signed-upgrade-arm64-rc', 'production-local-upgrade-arm64'}, frozen
          isolated = [b for b in blocks if b.startswith('  isolated-arm64-rc:\n')]
          assert len(isolated) == 1 and ('    if: ' + '$' + '{{ false }}' + '\n') in isolated[0], 'UNSIGNED_ISOLATED_RC_NOT_FROZEN'
          conf = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert conf['version'] == '6.1.15'
          assert conf['identifier'] == 'studio.channelflow.desktop'
          assert conf['plugins']['updater']['endpoints'][0] == 'https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json'
          assert Path('docs/security/VYRON_617_UPDATER_KEY_INCIDENT_2026-11-12.md').is_file()
          print('COMPROMISED_UPDATER_SIGNING_FROZEN=PASS')
          PY
      - name: Rotated updater bridge contract (synthetic public-key only)
        run: |
          node --test scripts/macos/test-vyron-rotated-updater.mjs
          node --test scripts/macos/test-vyron-617-rotated-public-key.mjs
      - name: Python safety tests
        run: |
          python3 -m unittest scripts.macos.test_verify_vyron_pr22_performance scripts.test_vyron_macos_offline_preflight
      - name: Bundle and updater isolation contract
        run: |
          python3 - <<'PY'
          import json
          stable=json.load(open('src-tauri/tauri.conf.json'))
          probe=json.load(open('src-tauri/tauri.pr22-probe.conf.json'))
          assert stable['version']=='6.1.15'
          assert stable['identifier']=='studio.channelflow.desktop'
          assert stable['bundle']['createUpdaterArtifacts'] is True
          assert probe['identifier']=='studio.channelflow.desktop.pr22probe'
          assert probe['bundle']['createUpdaterArtifacts'] is False
          assert probe['plugins']['updater']['endpoints']==[]
          PY
