name: VYRON PR22 RC tooling safety

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/macos/**'
      - 'scripts/vyron_macos_offline_preflight.py'
      - 'scripts/test_vyron_macos_offline_preflight.py'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/tauri.pr22-probe.conf.json'
      - 'docs/VYRON_PR22_MAC_OWNER_RUNBOOK.md'
      - '.github/workflows/vyron-pr22-rc-tooling.yml'
      - '.github/workflows/vyron-pr22-remote-rc.yml'
      - 'docs/security/VYRON_617_UPDATER_KEY_INCIDENT_2026-11-12.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-tooling-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and no release mutations
        run: |
          bash -n scripts/macos/vyron-pr22-release-validation.sh
          ! grep -E 'gh release|git push|security (add|delete)|notarytool submit|ditto .*/Applications' scripts/macos/vyron-pr22-release-validation.sh
      - name: Incident freeze — no old Tauri updater key can be used in PR22
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          w=Path('.github/workflows/vyron-pr22-remote-rc.yml').read_text()
          assert 'jobs:\n' in w, 'MISSING_JOBS'
          assert 'workflow_dispatch:' in w, 'MISSING_DISPATCH'
          dispatch=w.split('workflow_dispatch:',1)[1].split('\npermissions:',1)[0]
          assert '- isolated' in dispatch, 'ISOLATED_REVIEW_MODE_MISSING'
          assert '- local-upgrade-' not in dispatch and '- signed-upgrade' not in dispatch, 'LEGACY_DISPATCH_SIGNING_ENABLED'
          jobs=w.split('\njobs:\n',1)[1]
          blocks=re.split(r'(?=^  [a-z][a-z0-9-]+:\n)',jobs,flags=re.M)
          sensitive=('secrets.TAURI_SIGNING_PRIVATE_KEY','secrets.VYRON_MACOS_SIGNING_P12_BASE64','secrets.APPLE_CERTIFICATE')
          checked=[]
          for block in blocks:
            if not any(x in block for x in sensitive):continue
            name=block.splitlines()[0].strip().rstrip(':')
            assert re.search(r'^    if: \$\{\{ false \}\}\s*        run: |
          python3 -m unittest scripts.macos.test_verify_vyron_pr22_performance scripts.test_vyron_macos_offline_preflight
      - name: Bundle and updater isolation contract
        run: |
          python3 - <<'PY'
          import json
          stable=json.load(open('src-tauri/tauri.conf.json'))
          probe=json.load(open('src-tauri/tauri.pr22-probe.conf.json'))
          assert stable['version']=='6.1.15'
          assert stable['identifier']=='studio.channelflow.desktop'
          assert stable['bundle']['createUpdaterArtifacts'] is True
          assert probe['identifier']=='studio.channelflow.desktop.pr22probe'
          assert probe['bundle']['createUpdaterArtifacts'] is False
          assert probe['plugins']['updater']['endpoints']==[]
          PY
,block,flags=re.M), f'SIGNER_JOB_NOT_FROZEN: {name}'
            checked.append(name)
          assert set(checked)=={'signed-upgrade-arm64-rc','production-local-upgrade-arm64'}, f'SIGNING_SURFACE_CHANGED: {checked}'
          stable=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert stable['version']=='6.1.15' and stable['identifier']=='studio.channelflow.desktop'
          assert stable['plugins']['updater']['endpoints'][0]=='https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/main/updates/latest.json'
          assert Path('docs/security/VYRON_617_UPDATER_KEY_INCIDENT_2026-11-12.md').is_file()
          print('COMPROMISED_UPDATER_SIGNING_FROZEN=PASS')
          PY
      - name: Python safety tests
        run: |
          python3 -m unittest scripts.macos.test_verify_vyron_pr22_performance scripts.test_vyron_macos_offline_preflight
      - name: Bundle and updater isolation contract
        run: |
          python3 - <<'PY'
          import json
          stable=json.load(open('src-tauri/tauri.conf.json'))
          probe=json.load(open('src-tauri/tauri.pr22-probe.conf.json'))
          assert stable['version']=='6.1.15'
          assert stable['identifier']=='studio.channelflow.desktop'
          assert stable['bundle']['createUpdaterArtifacts'] is True
          assert probe['identifier']=='studio.channelflow.desktop.pr22probe'
          assert probe['bundle']['createUpdaterArtifacts'] is False
          assert probe['plugins']['updater']['endpoints']==[]
          PY
