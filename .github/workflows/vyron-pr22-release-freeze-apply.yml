name: VYRON PR22 one-time legacy release freeze apply

on:
  push:
    branches:
      - security/freeze-pr22-legacy-release-workflows-20261116
    paths:
      - '.github/workflows/vyron-pr22-release-freeze-apply.yml'

permissions:
  contents: write

concurrency:
  group: vyron-pr22-legacy-release-freeze-apply
  cancel-in-progress: false

jobs:
  apply-release-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disable legacy signing, candidate, promotion and publisher jobs
        run: node scripts/security/freeze-pr22-legacy-release-workflows.mjs
      - name: Verify every targeted workflow is fail-closed
        run: node --test scripts/security/check-pr22-release-freeze.mjs
      - name: Remove one-time apply automation
        shell: bash
        run: |
          rm -f .github/workflows/vyron-pr22-release-freeze-apply.yml
          rm -f scripts/security/freeze-pr22-legacy-release-workflows.mjs
      - name: Commit the reviewed workflow freeze to this security branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows scripts/security
          if git diff --cached --quiet; then
            echo "No workflow changes were produced."
            exit 1
          fi
          git commit -m "security: freeze legacy VYRON release paths in PR22 branch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
