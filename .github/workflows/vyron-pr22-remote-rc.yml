name: VYRON PR22 remote macOS RC

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/vyron-pr22-remote-rc.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'src-tauri/**'
  workflow_dispatch:
    inputs:
      mode:
        description: RC build mode
        required: true
        default: isolated
        type: choice
        options:
          - isolated
          - signed-upgrade

permissions:
  contents: read

concurrency:
  group: vyron-pr22-remote-rc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RC_VERSION: '6.1.16'
  RC_TEST_FEED: https://raw.githubusercontent.com/ScaleUPPeisov/vyron-releases/rc/updates/latest.json

jobs:
  isolated-arm64-rc:
    name: Isolated ARM64 RC artifact
    if: github.event_name == 'pull_request' || github.event.inputs.mode == 'isolated'
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Assert native Apple Silicon runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          system_profiler SPHardwareDataType | grep -E 'Chip: Apple|Processor Name: Apple'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Frontend and Rust release checks
        run: |
          npm run build
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Prepare isolated RC config and verify updater separation
        env:
          RC_CONFIG: ${{ runner.temp }}/tauri.pr22-isolated-rc.json
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const stable=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
          if(stable.version!=='6.1.15')throw new Error('PRODUCTION_VERSION_CHANGED');
          if(stable.identifier!=='studio.channelflow.desktop')throw new Error('PRODUCTION_IDENTIFIER_CHANGED');
          const productionEndpoints=stable.plugins.updater.endpoints;
          const endpoint=process.env.RC_TEST_FEED;
          if(productionEndpoints.includes(endpoint))throw new Error('RC_FEED_REUSES_PRODUCTION');
          const rc={
            $schema:'https://schema.tauri.app/config/2',
            productName:'VYRON PR22 RC',
            version:process.env.RC_VERSION,
            identifier:'studio.channelflow.desktop.pr22rc',
            bundle:{
              targets:['app','dmg'],
              createUpdaterArtifacts:false,
              macOS:{bundleName:'VYRON PR22 RC'}
            },
            plugins:{updater:{pubkey:stable.plugins.updater.pubkey,endpoints:[endpoint]}}
          };
          fs.writeFileSync(process.env.RC_CONFIG,JSON.stringify(rc,null,2)+'\n');
          console.log('RC_CONFIG_CONTRACT=PASS');
          NODE

      - name: Build isolated macOS ARM64 RC
        env:
          RC_CONFIG: ${{ runner.temp }}/tauri.pr22-isolated-rc.json
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config "$RC_CONFIG"

      - name: Verify identity and prepare checksummed artifact
        env:
          OUT: ${{ runner.temp }}/vyron-pr22-isolated-rc
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")" = "studio.channelflow.desktop.pr22rc"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")" = "$RC_VERSION"
          mkdir -p "$OUT"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT/VYRON-PR22-RC-${RC_VERSION}-arm64.app.zip"
          DMG_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit || true)"
          if [[ -n "$DMG_PATH" ]]; then cp "$DMG_PATH" "$OUT/VYRON-PR22-RC-${RC_VERSION}-arm64.dmg"; fi
          codesign --display --verbose=4 "$APP_PATH" >"$OUT/codesign.txt" 2>&1 || true
          if codesign --verify --deep --strict "$APP_PATH" >"$OUT/codesign-verify.txt" 2>&1; then
            CODE_SIGN_STATUS=VALID
          else
            CODE_SIGN_STATUS=UNSIGNED_OR_INVALID
          fi
          if spctl --assess --type execute --verbose=4 "$APP_PATH" >"$OUT/gatekeeper.txt" 2>&1; then
            GATEKEEPER_STATUS=ACCEPTED
          else
            GATEKEEPER_STATUS=NOT_ACCEPTED
          fi
          export CODE_SIGN_STATUS GATEKEEPER_STATUS
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const out=process.env.OUT;
          const manifest={
            schemaVersion:1,
            artifactKind:'ISOLATED_TEST_RC',
            sourceSha:process.env.GITHUB_SHA,
            version:process.env.RC_VERSION,
            architecture:'aarch64',
            runner:'macos-15',
            bundleIdentifier:'studio.channelflow.desktop.pr22rc',
            updaterEndpoint:process.env.RC_TEST_FEED,
            updaterArtifacts:false,
            productionFeedModified:false,
            productionInstallPerformed:false,
            physicalM1PerformanceValidated:false,
            codeSignStatus:process.env.CODE_SIGN_STATUS,
            gatekeeperStatus:process.env.GATEKEEPER_STATUS,
            warning:'Isolated CI artifact. It is not the production-identity upgrade candidate and is not a physical M1 performance result.'
          };
          fs.writeFileSync(path.join(out,'BUILD-MANIFEST.json'),JSON.stringify(manifest,null,2)+'\n');
          NODE
          (
            cd "$OUT"
            for file in *; do
              [[ "$file" == "SHA256SUMS.txt" ]] || shasum -a 256 "$file"
            done > SHA256SUMS.txt
          )
          (cd "$OUT" && shasum -a 256 -c SHA256SUMS.txt)

      - name: Upload isolated RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-Mac-Ultimate-PR22-isolated-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/vyron-pr22-isolated-rc/
          if-no-files-found: error
          retention-days: 14

  signed-upgrade-arm64-rc:
    name: Signed and notarized production-identity RC
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'signed-upgrade'
    runs-on: macos-15
    environment: rc-signing
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Verify signing and notarization secret availability without disclosure
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$APPLE_CERTIFICATE" ]] || missing+=(APPLE_CERTIFICATE)
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          api_ready=false
          apple_id_ready=false
          if [[ -n "$APPLE_API_ISSUER" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_CONTENT" ]]; then api_ready=true; fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then apple_id_ready=true; fi
          if [[ "$api_ready" != true && "$apple_id_ready" != true ]]; then
            missing+=(APPLE_NOTARIZATION_CREDENTIAL_SET)
          fi
          if (( ${#missing[@]} )); then
            echo "SIGNING_READY=false"
            printf 'Missing required secret name: %s\n' "${missing[@]}"
            exit 2
          fi
          echo "SIGNING_READY=true"
          echo "NOTARIZATION_READY=true"
          echo "UPDATER_SIGNING_READY=true"

      - name: Import Developer ID certificate into an ephemeral keychain
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/vyron-rc-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vyron-rc-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: Prepare notarization authentication
        run: |
          set -euo pipefail
          if [[ -n "$APPLE_API_ISSUER" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_CONTENT" ]]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$API_KEY_PATH"
            chmod 600 "$API_KEY_PATH"
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
            echo "NOTARIZATION_AUTH=APP_STORE_CONNECT_API"
          else
            echo "NOTARIZATION_AUTH=APPLE_ID_APP_SPECIFIC_PASSWORD"
          fi

      - name: Install dependencies and verify source
        run: |
          test "$(uname -m)" = arm64
          npm ci
          npm run build
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Prepare production-identity RC config
        env:
          RC_CONFIG: ${{ runner.temp }}/tauri.pr22-upgrade-rc.json
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const stable=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
          if(stable.version!=='6.1.15')throw new Error('PRODUCTION_VERSION_CHANGED');
          if(stable.identifier!=='studio.channelflow.desktop')throw new Error('PRODUCTION_IDENTIFIER_CHANGED');
          const rc={
            $schema:'https://schema.tauri.app/config/2',
            productName:'VYRON',
            version:process.env.RC_VERSION,
            identifier:stable.identifier,
            bundle:{
              targets:['app','dmg'],
              createUpdaterArtifacts:true,
              macOS:{bundleName:'VYRON'}
            },
            plugins:{updater:{pubkey:stable.plugins.updater.pubkey,endpoints:[process.env.RC_TEST_FEED]}}
          };
          if(rc.plugins.updater.endpoints.some(x=>stable.plugins.updater.endpoints.includes(x))){
            throw new Error('RC_FEED_REUSES_PRODUCTION');
          }
          if(rc.plugins.updater.pubkey!==stable.plugins.updater.pubkey){
            throw new Error('UPDATER_PUBLIC_KEY_MISMATCH');
          }
          fs.writeFileSync(process.env.RC_CONFIG,JSON.stringify(rc,null,2)+'\n');
          console.log('UPGRADE_RC_CONFIG_CONTRACT=PASS');
          NODE

      - name: Build, sign and notarize production-identity RC
        env:
          RC_CONFIG: ${{ runner.temp }}/tauri.pr22-upgrade-rc.json
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config "$RC_CONFIG"

      - name: Verify notarized identity, updater artifacts and checksums
        env:
          OUT: ${{ runner.temp }}/vyron-pr22-signed-upgrade-rc
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")" = "studio.channelflow.desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")" = "$RC_VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          SIG_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -type f -name '*.sig' -print -quit)"
          UPDATE_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -type f \( -name '*.app.tar.gz' -o -name '*.tar.gz' \) -print -quit)"
          test -n "$SIG_PATH"
          test -n "$UPDATE_PATH"
          mkdir -p "$OUT"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT/VYRON-${RC_VERSION}-signed-notarized-arm64.app.zip"
          cp "$SIG_PATH" "$OUT/"
          cp "$UPDATE_PATH" "$OUT/"
          DMG_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit || true)"
          if [[ -n "$DMG_PATH" ]]; then cp "$DMG_PATH" "$OUT/VYRON-${RC_VERSION}-signed-notarized-arm64.dmg"; fi
          codesign --display --verbose=4 "$APP_PATH" >"$OUT/codesign.txt" 2>&1
          spctl --assess --type execute --verbose=4 "$APP_PATH" >"$OUT/gatekeeper.txt" 2>&1
          xcrun stapler validate "$APP_PATH" >"$OUT/notarization.txt" 2>&1
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const out=process.env.OUT;
          const manifest={
            schemaVersion:1,
            artifactKind:'SIGNED_NOTARIZED_PRODUCTION_IDENTITY_RC',
            sourceSha:process.env.GITHUB_SHA,
            version:process.env.RC_VERSION,
            architecture:'aarch64',
            runner:'macos-15',
            bundleIdentifier:'studio.channelflow.desktop',
            updaterEndpoint:process.env.RC_TEST_FEED,
            updaterPublicKeyMatchesProduction:true,
            updaterArtifacts:true,
            productionFeedModified:false,
            productionInstallPerformed:false,
            physicalM1PerformanceValidated:false,
            codeSignStatus:'VALID',
            gatekeeperStatus:'ACCEPTED',
            notarizationStatus:'STAPLED',
            warning:'Do not install over 6.1.15 until the owner has made and verified a restorable backup.'
          };
          fs.writeFileSync(path.join(out,'BUILD-MANIFEST.json'),JSON.stringify(manifest,null,2)+'\n');
          NODE
          (
            cd "$OUT"
            for file in *; do
              [[ "$file" == "SHA256SUMS.txt" ]] || shasum -a 256 "$file"
            done > SHA256SUMS.txt
          )
          (cd "$OUT" && shasum -a 256 -c SHA256SUMS.txt)

      - name: Upload signed upgrade RC without publishing a feed or release
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-Mac-Ultimate-PR22-signed-upgrade-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/vyron-pr22-signed-upgrade-rc/
          if-no-files-found: error
          retention-days: 14
