name: VYRON Privacy Gate

on:
  push:
    branches:
      - main
      - 'release/vyron-*'
    paths:
      - '.github/workflows/vyron-*.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'vyron-updates/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/vyron-*.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'vyron-updates/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: No user/channel/OAuth data in GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Block sensitive tracked files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,re,subprocess,sys

          def changed_files():
              event=os.environ.get('GITHUB_EVENT_NAME','')
              if event=='push':
                  try:
                      return subprocess.check_output(
                          ['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],
                          text=True
                      ).splitlines()
                  except Exception:
                      pass
              # Manual/PR fallback: only VYRON-owned paths, never whole monorepo.
              all_files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
              roots=('src/','src-tauri/','vyron-updates/','.github/workflows/vyron-')
              roots_files={'package.json','package-lock.json','tsconfig.json','.gitignore'}
              return [f for f in all_files if f.startswith(roots) or f in roots_files or f.startswith('vite.config.')]

          files=changed_files()
          banned=[
              r'(^|/)credentials\.json$',
              r'(^|/)credentials-[^/]*\.json$',
              r'(^|/)client_secret[^/]*\.json$',
              r'(^|/)google-credentials[^/]*\.json$',
              r'(^|/)oauth-tokens?[^/]*\.json$',
              r'(^|/)tokens\.json$',
              r'(^|/)keychain-export',
              r'(^|/)credential-export',
              r'\.sqlite3?$',
              r'\.db$',
              r'\.db-wal$',
              r'\.db-shm$',
              r'\.vyron$',
              r'\.vyron-migration$',
              r'(^|/)vyron-migration-',
              r'(^|/)migration-backup',
              r'(^|/)migration-export',
              r'(^|/)account-export',
              r'(^|/)channel-export',
          ]
          bad=[f for f in files if any(re.search(p,f,re.I) for p in banned)]
          if bad:
              print('PRIVACY_GATE=FAIL:SENSITIVE_TRACKED_FILE')
              print('\n'.join(bad))
              sys.exit(1)
          print(f'PRIVACY_TRACKED_FILES=PASS scanned={len(files)}')
          PY

      - name: Block high-confidence secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,pathlib,re,subprocess,sys

          def candidates():
              event=os.environ.get('GITHUB_EVENT_NAME','')
              if event=='push':
                  names=subprocess.check_output(
                      ['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],
                      text=True
                  ).splitlines()
              else:
                  names=subprocess.check_output(['git','ls-files'],text=True).splitlines()
              roots=('src/','src-tauri/','vyron-updates/','.github/workflows/vyron-')
              roots_files={'package.json','package-lock.json','tsconfig.json','.gitignore'}
              return [n for n in names if n.startswith(roots) or n in roots_files or n.startswith('vite.config.')]

          patterns=[
              re.compile(rb'ya29\.[A-Za-z0-9._~-]{20,}'),
              re.compile(rb'1//[A-Za-z0-9._~-]{20,}'),
              re.compile(rb'GOCSPX-[A-Za-z0-9_-]{20,}'),
              re.compile(rb'AIza[0-9A-Za-z_-]{20,}'),
              re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          ]
          scanned=0
          for name in candidates():
              p=pathlib.Path(name)
              if not p.is_file():
                  continue
              try:
                  data=p.read_bytes()
              except Exception:
                  continue
              scanned+=1
              matched=next((idx for idx,rx in enumerate(patterns) if rx.search(data)),None)
              if matched is not None:
                  print(f'PRIVACY_GATE=FAIL:HIGH_CONFIDENCE_SECRET:file={p}:pattern={matched}')
                  sys.exit(1)
          print(f'PRIVACY_SECRET_SCAN=PASS scanned={scanned}')
          PY

      - name: Block real YouTube acceptance identifiers in CI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, sys
          import os,subprocess
          here=pathlib.Path('.github/workflows/vyron-privacy-gate.yml')
          forbidden=('PHYSICAL_'+'VIDEO_ID','physical_'+'video_id','Physical one-video acceptance '+'ID')
          if os.environ.get('GITHUB_EVENT_NAME')=='push':
              names=subprocess.check_output(
                  ['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],
                  text=True
              ).splitlines()
              workflows=[pathlib.Path(n) for n in names if n.startswith('.github/workflows/vyron-') and n.endswith(('.yml','.yaml'))]
          else:
              workflows=list(pathlib.Path('.github/workflows').glob('vyron-*.y*ml'))
          for wf in workflows:
              if wf==here or not wf.exists():
                  continue
              text=wf.read_text(errors='ignore')
              if any(token in text for token in forbidden):
                  print(f'PRIVACY_GATE=FAIL:YOUTUBE_ACCEPTANCE_IDENTIFIER:file={wf}')
                  sys.exit(1)
          print(f'YOUTUBE_ACCEPTANCE_ID_LOGGING=BLOCKED scanned={len(workflows)}')
          PY

      - name: Block user-state artifact uploads
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          import os,subprocess
          bad = re.compile(r'(user-data|app-data|Application Support|AppData|keychain|credential-export|migration-export|account-export|channel-export|\.sqlite|\.db\b|\.vyron)', re.I)
          here=pathlib.Path('.github/workflows/vyron-privacy-gate.yml')
          if os.environ.get('GITHUB_EVENT_NAME')=='push':
              names=subprocess.check_output(
                  ['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],
                  text=True
              ).splitlines()
              workflows=[pathlib.Path(n) for n in names if n.startswith('.github/workflows/vyron-') and n.endswith(('.yml','.yaml'))]
          else:
              workflows=list(pathlib.Path('.github/workflows').glob('vyron-*.y*ml'))
          for wf in workflows:
              if wf==here or not wf.exists():
                  continue
              text = wf.read_text(errors='ignore')
              chunks = re.split(r'(?=\n\s*- name:)', text)
              for chunk in chunks:
                  if 'actions/upload-artifact@' in chunk and bad.search(chunk):
                      print(f'PRIVACY_GATE=FAIL:SENSITIVE_ARTIFACT_UPLOAD:file={wf}')
                      sys.exit(1)
          print(f'SENSITIVE_ARTIFACT_UPLOAD=BLOCKED scanned={len(workflows)}')
          PY

      - name: Privacy summary
        run: |
          echo 'REAL_CHANNEL_DATA_ALLOWED_IN_GITHUB=NO'
          echo 'REAL_OAUTH_TOKENS_ALLOWED_IN_GITHUB=NO'
          echo 'LOCAL_DATABASE_ALLOWED_IN_GITHUB=NO'
          echo 'MIGRATION_BUNDLES_ALLOWED_IN_GITHUB=NO'
          echo 'REAL_YOUTUBE_VIDEO_ID_IN_CI=NO'
          echo 'PRIVACY_GATE=PASS'
