name: VYRON render routing hotfix apply

on:
  push:
    branches:
      - automation/vyron-render-routing-hotfix-20261013

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/vyron-6.1.11-metadata-inventory-correctness
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ba160aadfd5db92a97f641ff488ef23809596387"
          test "$(git rev-parse HEAD^{tree})" = "b6723e13028d6a51d4543987a5dd075fe9ab5c45"

      - name: Apply render destination hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("src-tauri/src/production_manager.rs")
          tests_path = Path("src-tauri/src/production_manager_tests.rs")
          s = source_path.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              s = s.replace(old, new, 1)

          replace_once(
              "    path::{Path, PathBuf},\n",
              "    path::{Component, Path, PathBuf},\n",
              "path import",
          )

          marker = "fn atomic_json<T: Serialize>(path: &Path, value: &T) -> Result<(), String> {\n"
          helper = r'''const INVALID_FINAL_RENDER_DESTINATION: &str = "INVALID_FINAL_RENDER_DESTINATION";

fn is_production_batches_path(path: &Path) -> bool {
    let parts = path
        .components()
        .filter_map(|component| match component {
            Component::Normal(value) => Some(value.to_string_lossy().to_ascii_lowercase()),
            _ => None,
        })
        .collect::<Vec<_>>();
    parts
        .windows(2)
        .any(|pair| pair[0] == "productionmanager" && pair[1] == "batches")
}

fn validate_final_render_destination(path: &Path) -> Result<(), String> {
    if is_production_batches_path(path) {
        return Err(INVALID_FINAL_RENDER_DESTINATION.into());
    }
    Ok(())
}

fn render_output_dir(output_workspace: &str, channel_name: &str) -> Result<PathBuf, String> {
    let path = PathBuf::from(output_workspace)
        .join("Render")
        .join(safe_component(channel_name));
    validate_final_render_destination(&path)?;
    fs::create_dir_all(&path).map_err(|e| format!("Render output: {e}"))?;
    let resolved = path
        .canonicalize()
        .map_err(|e| format!("Render output: {e}"))?;
    validate_final_render_destination(&resolved)?;
    Ok(resolved)
}

'''
          replace_once(marker, helper + marker, "render output helpers")

          replace_once(
              '        output_dir: broot.join("Rendered").to_string_lossy().into_owned(),\n',
              '''        output_dir: render_output_dir(
            &resolve_output_workspace(&plan.request)?,
            &plan.request.channel_name,
        )?
        .to_string_lossy()
        .into_owned(),
''',
              "manifest output_dir",
          )

          replace_once(
              '    destination_paths.push(PathBuf::from(&plan.batch_root).join("Rendered").to_string_lossy().into_owned());\n',
              '''    let output_workspace = resolve_output_workspace(&plan.request)?;
    destination_paths.push(
        render_output_dir(&output_workspace, &plan.request.channel_name)?
            .to_string_lossy()
            .into_owned(),
    );
''',
              "recovery render destination",
          )

          replace_once(
              '''    let (m, _) = load_manifest(&manifest_path)?;
    let app = PathBuf::from(&endlume_path);
''',
              '''    let (m, _) = load_manifest(&manifest_path)?;
    let final_destination = PathBuf::from(&m.output_dir);
    validate_final_render_destination(&final_destination)?;
    fs::create_dir_all(&final_destination).map_err(|e| format!("Render output: {e}"))?;
    let resolved_final_destination = final_destination
        .canonicalize()
        .map_err(|e| format!("Render output: {e}"))?;
    validate_final_render_destination(&resolved_final_destination)?;
    let app = PathBuf::from(&endlume_path);
''',
              "ENDLUME pre-render destination guard",
          )

          source_path.write_text(s)

          tests = tests_path.read_text()
          sentinel = "acceptance_render_output_routes_to_channel_render_root"
          if sentinel in tests:
              raise SystemExit("routing tests already exist unexpectedly")
          tests += r'''

#[test]
fn acceptance_render_output_routes_to_channel_render_root() {
    let (ws, cid, name) = fixture(1, 2);
    let plan = plan_build(&request(&ws, &cid, &name, 1, 1, "even", false)).unwrap();
    let summary = execute_plan(None, &plan).unwrap();
    let (manifest, _) = load_manifest(&summary.manifest_path).unwrap();
    let expected = ws.join("Render").join(&name).canonicalize().unwrap();
    assert_eq!(PathBuf::from(&manifest.output_dir), expected);
    assert!(expected.is_dir());
    assert!(!is_production_batches_path(&expected));
    assert!(PathBuf::from(&manifest.root_path).starts_with(ws.join("ProductionManager").join("Batches")));
    cleanup(&ws);
}

#[test]
fn acceptance_final_render_destination_rejects_batches_tree() {
    let forbidden = PathBuf::from("/Volumes/TOSHIBA EXT/ВАЙРОН/ProductionManager/Batches/channel/batch/Rendered");
    assert_eq!(
        validate_final_render_destination(&forbidden).unwrap_err(),
        INVALID_FINAL_RENDER_DESTINATION
    );
}

#[test]
fn acceptance_render_output_is_channel_isolated() {
    let root = std::env::temp_dir().join(format!("vyron-render-routing-{}", Uuid::new_v4()));
    fs::create_dir_all(&root).unwrap();
    let first = render_output_dir(&root.to_string_lossy(), "Channel Alpha").unwrap();
    let second = render_output_dir(&root.to_string_lossy(), "Channel Beta").unwrap();
    assert_eq!(first, root.join("Render").join("Channel Alpha").canonicalize().unwrap());
    assert_eq!(second, root.join("Render").join("Channel Beta").canonicalize().unwrap());
    assert_ne!(first, second);
    assert!(!is_production_batches_path(&first));
    assert!(!is_production_batches_path(&second));
    let _ = fs::remove_dir_all(root);
}
'''
          tests_path.write_text(tests)
          PY

      - name: Verify patch scope and forbidden old routing removed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src-tauri/src/production_manager.rs src-tauri/src/production_manager_tests.rs "
          ! grep -F 'output_dir: broot.join("Rendered")' src-tauri/src/production_manager.rs
          ! grep -F 'destination_paths.push(PathBuf::from(&plan.batch_root).join("Rendered")' src-tauri/src/production_manager.rs
          grep -F 'INVALID_FINAL_RENDER_DESTINATION' src-tauri/src/production_manager.rs
          grep -F '.join("Render")' src-tauri/src/production_manager.rs

      - name: Run focused Rust routing tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml production_manager_tests::acceptance_render_output_routes_to_channel_render_root -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml production_manager_tests::acceptance_final_render_destination_rejects_batches_tree -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml production_manager_tests::acceptance_render_output_is_channel_isolated -- --nocapture

      - name: Commit hotfix to target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/production_manager.rs src-tauri/src/production_manager_tests.rs
          git commit -m "fix(vyron): route ENDLUME renders outside batches"
          git push origin HEAD:hotfix/vyron-6.1.11-metadata-inventory-correctness
          echo "HOTFIX_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Show committed routing evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "HOTFIX_COMMIT=$HOTFIX_COMMIT"
          git show --stat --oneline --decorate HEAD
          grep -n 'INVALID_FINAL_RENDER_DESTINATION\|output_dir: render_output_dir\|render_output_dir(&output_workspace' src-tauri/src/production_manager.rs
