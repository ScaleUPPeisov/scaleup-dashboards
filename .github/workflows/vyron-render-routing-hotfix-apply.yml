name: VYRON render routing hotfix apply

on:
  push:
    branches:
      - automation/vyron-render-routing-hotfix-20261013

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/vyron-6.1.11-metadata-inventory-correctness
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ba160aadfd5db92a97f641ff488ef23809596387"
          test "$(git rev-parse HEAD^{tree})" = "b6723e13028d6a51d4543987a5dd075fe9ab5c45"

      - name: Load one-shot patch script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/vyron-render-routing-hotfix-20261013
          git show FETCH_HEAD:tools/apply_vyron_render_routing_hotfix.py > /tmp/apply_vyron_render_routing_hotfix.py

      - name: Apply render destination hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply_vyron_render_routing_hotfix.py

      - name: Verify patch scope and forbidden old routing removed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src-tauri/src/production_manager.rs src-tauri/src/production_manager_tests.rs "
          ! grep -F 'output_dir: broot.join("Rendered")' src-tauri/src/production_manager.rs
          ! grep -F 'destination_paths.push(PathBuf::from(&plan.batch_root).join("Rendered")' src-tauri/src/production_manager.rs
          grep -F 'INVALID_FINAL_RENDER_DESTINATION' src-tauri/src/production_manager.rs
          grep -F '.join("Render")' src-tauri/src/production_manager.rs

      - name: Run focused Rust routing tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml production_manager_tests::acceptance_render_output_routes_to_channel_render_root -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml production_manager_tests::acceptance_final_render_destination_rejects_batches_tree -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml production_manager_tests::acceptance_render_output_is_channel_isolated -- --nocapture

      - name: Commit hotfix to target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/production_manager.rs src-tauri/src/production_manager_tests.rs
          git commit -m "fix(vyron): route ENDLUME renders outside batches"
          git push origin HEAD:hotfix/vyron-6.1.11-metadata-inventory-correctness
          echo "HOTFIX_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Show committed routing evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "HOTFIX_COMMIT=$HOTFIX_COMMIT"
          git show --stat --oneline --decorate HEAD
          grep -n 'INVALID_FINAL_RENDER_DESTINATION\|output_dir: render_output_dir\|render_output_dir(&output_workspace' src-tauri/src/production_manager.rs
