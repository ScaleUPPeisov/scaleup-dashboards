name: VYRON SQLite dependency lock maintenance (PR branch only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/analytics_sqlite.rs'
      - '.github/workflows/vyron-sqlite-lock-sync.yml'
permissions:
  contents: read
concurrency:
  group: vyron-sqlite-lock-${{ github.head_ref }}
  cancel-in-progress: false
jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/vyron-macos-ultimate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vyron-macos-ultimate
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve fixed rusqlite version without updating unrelated releases
        run: |
          set -euo pipefail
          cargo fetch --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          grep -A 2 '^name = "rusqlite"' src-tauri/Cargo.lock | grep -F 'version = "0.36.0"'
      - name: Commit generated lockfile ONLY to the existing Draft PR branch
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock unchanged. No write."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src-tauri/Cargo.lock
          git commit -m "build(mac): lock bundled rusqlite 0.36.0 and SQLite transitive crates"
          git push origin HEAD:refs/heads/feature/vyron-macos-ultimate
