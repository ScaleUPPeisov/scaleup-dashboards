name: VYRON Studio isolated ARM64 UI preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feature/vyron-macos-ultimate

permissions:
  contents: read

jobs:
  isolated-preview:
    if: ${{ github.event.pull_request.number == 68 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/vyron-studio-ui-isolated-20261123' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Pin design branch commit, not production base merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require isolation and no production installation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -f src/vyron-studio.css
          test -f src/vyronStudio.test.ts
          test "$(node -p "require('./src-tauri/tauri.conf.json').identifier")" = "studio.channelflow.desktop"
      - name: Require owner-approved rotated updater trust fingerprint for release-mode compilation
        env:
          APPROVED_SHA: ${{ vars.VYRON617_APPROVED_PUBKEY_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{64}$ ]] || { echo OWNER_APPROVED_UPDATER_FINGERPRINT_MISSING; exit 1; }
          test "$APPROVED_SHA" != aa6fb45ab082ef39279e841dc40b0f85e5b33f23746f77557b6f93e3e72c2c06 || { echo COMPROMISED_LEGACY_UPDATER_FINGERPRINT_REJECTED; exit 1; }
          echo "VYRON_TRUSTED_UPDATER_PUBLIC_KEY_SHA256=$APPROVED_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Studio UI contract tests
        run: npm test -- src/vyronStudio.test.ts
      - name: Full TypeScript and web bundle build
        run: npm run build
      - name: Prepare isolated bundle identity and disable updater feed
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const cfg={productName:'VYRON Studio Preview',version:'6.1.17',identifier:'studio.channelflow.preview',bundle:{createUpdaterArtifacts:false,macOS:{bundleName:'VYRON Studio Preview'}},app:{windows:[{label:'main',title:'VYRON Studio — TEST ONLY',backgroundColor:'#0a111b'}]},plugins:{updater:{endpoints:[]}}};fs.writeFileSync(process.env.RUNNER_TEMP+'/vyron-studio-preview.json',JSON.stringify(cfg));"
      - name: Build isolated macOS ARM64 app
        env:
          VYRON_UPDATE_CHANNEL: owner-preview
        run: npx tauri build --target aarch64-apple-darwin --bundles app --config "$RUNNER_TEMP/vyron-studio-preview.json"
      - name: Verify preview identity and architecture
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP"
          INFO="$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "studio.channelflow.preview"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "6.1.17"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
          lipo -archs "$APP/Contents/MacOS/$EXE" | tr ' ' '\n' | grep -qx arm64
          echo "Preview identity and architecture verified; no owner data, no production install"
          mkdir -p "$RUNNER_TEMP/studio-preview"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/studio-preview/VYRON-Studio-6.1.17-M1-TEST-ONLY.zip"
          printf 'TEST-ONLY PREVIEW\nSeparate macOS bundle ID: studio.channelflow.preview\nNo notarization. Do NOT install over /Applications/VYRON.app.\nNative VYRON code may still use ~/Documents/VYRON; do not launch against owner HOME.\nUse a dedicated throwaway macOS user account, offline, with synthetic data.\n' > "$RUNNER_TEMP/studio-preview/README-TEST-ONLY.txt"
      - name: Upload owner preview (not a stable release)
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-Studio-6.1.17-M1-ISOLATED-PREVIEW-NOT-PRODUCTION
          path: ${{ runner.temp }}/studio-preview/
          retention-days: 7
          if-no-files-found: error
