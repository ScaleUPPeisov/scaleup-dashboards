name: VYRON Upload Button Unblock Candidate

on:
  push:
    branches:
      - repair/vyron-native-keychain-diagnostic
    paths:
      - '.github/diagnostic/vyron-upload-button-candidate-trigger.txt'

permissions:
  contents: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_TAG: v2.1.2

jobs:
  targeted-upload-button:
    name: Upload button gate tests + ARM64 candidate
    runs-on: macos-14
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble exact current candidate source plus upload-button fix
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vyron-upload-button"
          SRC="$RUNNER_TEMP/vyron-source"
          NATIVE="$RUNNER_TEMP/native.py"
          AUTH="$RUNNER_TEMP/auth.py"
          rm -rf "$ROOT" "$SRC" && mkdir -p "$ROOT" "$SRC"
          gh release download "$BASE_TAG" --repo "$REPO" --dir "$SRC" --pattern 'VYRON-2.1.2-source.tar.gz' --pattern 'SOURCE_SHA256.txt'
          cd "$SRC"
          test "$(awk '{print $1}' SOURCE_SHA256.txt)" = "$(shasum -a 256 VYRON-2.1.2-source.tar.gz | awk '{print $1}')"
          tar -xzf VYRON-2.1.2-source.tar.gz -C "$ROOT"
          cd "$GITHUB_WORKSPACE"
          cat .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.00 .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.01 .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02a .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02b .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.03 .github/scripts/vyron_native_keychain_repair.py.gz.b64.part01 .github/scripts/vyron_native_keychain_repair.py.gz.b64.part02 | base64 --decode | gunzip > "$NATIVE"
          test "$(shasum -a 256 "$NATIVE" | awk '{print $1}')" = '4196bc3e2199e3e038120f37128eb2d5ccb412177c25436a751b9f5ec53fe7ea'
          cat .github/scripts/vyron_auth_recovery.py.gz.b64.part00 .github/scripts/vyron_auth_recovery.py.gz.b64.part01 .github/scripts/vyron_auth_recovery.py.gz.b64.part02 | base64 --decode | gunzip > "$AUTH"
          test "$(shasum -a 256 "$AUTH" | awk '{print $1}')" = '3f0b2a6311929def43daedaf7bff52c74dbfe0bbfa5b722cf110893ceabb4462'
          python3 "$NATIVE" "$ROOT"
          python3 .github/scripts/apply_native_keychain_compilefix.py "$ROOT"
          python3 .github/scripts/apply_global_keychain_inventory.py "$ROOT"
          python3 "$AUTH" "$ROOT"
          python3 .github/scripts/apply_final_reconnect_recovery.py "$ROOT"
          python3 .github/scripts/apply_upload_button_unblock_fix.py "$ROOT"
          cd "$ROOT"
          test "$(node -p "require('./package.json').version")" = '2.1.2'
          grep -q 'runtimeLocks:ChannelUploadLock' src/youtubePublishSafety.ts
          ! grep -q "LOCKS='vyron:youtube-publish-locks:v1'" src/youtubePublishSafety.ts
          grep -q 'СНАЧАЛА СИНХРОНИЗИРУЙТЕ РАСПИСАНИЕ' src/PublisherOS.tsx
          grep -q 'Почему загрузка сейчас недоступна' src/PublisherOS.tsx
          grep -q 'SKIPPED_PAST_DATE' src/PublisherOS.tsx
          grep -q 'youtube_oauth_reconnect_existing' src-tauri/src/youtube.rs
          echo 'UPLOAD BUTTON FIX SOURCE: PASS'

      - name: Targeted upload-button tests and production frontend compile
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/vyron-upload-button"
          npm ci --no-audit --no-fund
          npx vitest run src/uploadButtonUnblock.test.ts src/publisherRuntime.test.ts src/v2111PublisherRuntime.test.ts
          npm run build

      - name: Normalize updater signing material for candidate packaging only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key')
          pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          PY

      - name: Build and verify ARM64 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vyron-upload-button"
          cd "$ROOT"
          rustup target add aarch64-apple-darwin
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -d "$APP" && test -s "$DMG"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '2.1.2'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.channelflow.desktop'
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          file "$APP/Contents/MacOS/$EXE" | grep -q 'arm64'
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          OUT="$GITHUB_WORKSPACE/upload-button-candidate"
          mkdir -p "$OUT"
          cp "$DMG" "$OUT/VYRON-2.1.2-Upload-Button-Unblock-ARM64.dmg"
          shasum -a 256 "$OUT/VYRON-2.1.2-Upload-Button-Unblock-ARM64.dmg" > "$OUT/SHA256.txt"
          cat > "$OUT/TEST_REPORT.md" <<'MD'
          # VYRON Upload Button Unblock Candidate
          - DAILY/2-2/3-1 schedule sync gate is now explicitly shown: PASS
          - Upload button label explains schedule synchronization requirement: PASS
          - Runtime channel lock blocks concurrent videos.insert in the same running app: PASS
          - Upload lock is not persisted across a fresh frontend boot: PASS
          - Backend resumable upload sessions remain unchanged: PASS
          - Existing OAuth reconnect recovery preserved: PASS
          - Past-date SKIPPED_PAST_DATE preserved: PASS
          - Stable release/tag/updater: NOT MODIFIED
          MD

      - name: Upload candidate only
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-2.1.2-upload-button-unblock-candidate
          path: upload-button-candidate/
          if-no-files-found: error
          retention-days: 30
