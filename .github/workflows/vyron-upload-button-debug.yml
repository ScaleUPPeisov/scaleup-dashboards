name: VYRON Upload Button Exact Source Diagnostic

on:
  push:
    branches:
      - repair/vyron-native-keychain-diagnostic
    paths:
      - '.github/diagnostic/vyron-upload-button-debug-trigger.txt'

permissions:
  contents: read

env:
  REPO: ScaleUPPeisov/scaleup-dashboards
  BASE_TAG: v2.1.2

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact current candidate source and inspect upload transport
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vyron-upload-debug"
          SRC="$RUNNER_TEMP/vyron-source"
          NATIVE="$RUNNER_TEMP/native.py"
          AUTH="$RUNNER_TEMP/auth.py"
          rm -rf "$ROOT" "$SRC" && mkdir -p "$ROOT" "$SRC"
          gh release download "$BASE_TAG" --repo "$REPO" --dir "$SRC" --pattern 'VYRON-2.1.2-source.tar.gz' --pattern 'SOURCE_SHA256.txt'
          cd "$SRC"
          test "$(awk '{print $1}' SOURCE_SHA256.txt)" = "$(shasum -a 256 VYRON-2.1.2-source.tar.gz | awk '{print $1}')"
          tar -xzf VYRON-2.1.2-source.tar.gz -C "$ROOT"
          cd "$GITHUB_WORKSPACE"
          cat .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.00 .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.01 .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02a .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.02b .github/scripts/vyron_native_keychain_repair.py.gz.b64.p00.03 .github/scripts/vyron_native_keychain_repair.py.gz.b64.part01 .github/scripts/vyron_native_keychain_repair.py.gz.b64.part02 | base64 --decode | gunzip > "$NATIVE"
          cat .github/scripts/vyron_auth_recovery.py.gz.b64.part00 .github/scripts/vyron_auth_recovery.py.gz.b64.part01 .github/scripts/vyron_auth_recovery.py.gz.b64.part02 | base64 --decode | gunzip > "$AUTH"
          python3 "$NATIVE" "$ROOT"
          python3 .github/scripts/apply_native_keychain_compilefix.py "$ROOT"
          python3 .github/scripts/apply_global_keychain_inventory.py "$ROOT"
          python3 "$AUTH" "$ROOT"
          python3 .github/scripts/apply_final_reconnect_recovery.py "$ROOT"
          python3 .github/scripts/apply_upload_button_unblock_fix.py "$ROOT"
          cd "$ROOT"
          echo '=== YOUTUBE UPLOAD FUNCTION LOCATIONS ==='
          grep -n -E 'youtube_upload_video|youtube_resume_upload|resumable|Content-Range|content-range|Range|upload-progress|youtube-progress|emit.*progress|offset|chunk' src-tauri/src/youtube.rs | head -n 320 || true
          echo '=== YOUTUBE.RS 300-470 ==='
          nl -ba src-tauri/src/youtube.rs | sed -n '300,470p'
          echo '=== YOUTUBE.RS 470-650 ==='
          nl -ba src-tauri/src/youtube.rs | sed -n '470,650p'
          echo '=== API PROGRESS EVENT ==='
          grep -R -n -E 'youtube-progress|youtube_progress|onYoutubeProgress|uploadProgress' src src-tauri/src | head -n 220 || true
