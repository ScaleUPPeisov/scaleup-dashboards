name: VYRON 0.5 macOS Apple Silicon

on:
  push:
    branches: [vyron-rebrand]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified ChannelFlow 0.4 base
        shell: bash
        run: |
          set -euo pipefail
          cat channelflow-v040/source.part* > /tmp/channelflow-v040.b64
          base64 -D -i /tmp/channelflow-v040.b64 -o /tmp/channelflow-v040.tar.gz
          echo "bd6296ae943e1756fb3b3e0dcf61436b6c61e77de88834321bf82388d12c2bd1  /tmp/channelflow-v040.tar.gz" | shasum -a 256 -c -
          rm -rf .vyron-v050
          mkdir .vyron-v050
          tar -xzf /tmp/channelflow-v040.tar.gz -C .vyron-v050
          cp channelflow-v040/files.rs.fixed .vyron-v050/src-tauri/src/files.rs

      - name: Apply VYRON rebrand and migration
        shell: bash
        run: |
          set -euo pipefail
          python3 vyron-v050/rebrand.py
          cp vyron-v050/system.rs .vyron-v050/src-tauri/src/system.rs
          cp vyron-v050/storage.rs .vyron-v050/src-tauri/src/storage.rs
          python3 -m json.tool .vyron-v050/package.json >/dev/null
          python3 -m json.tool .vyron-v050/src-tauri/tauri.conf.json >/dev/null
          grep -q '"productName": "VYRON"' .vyron-v050/src-tauri/tauri.conf.json
          grep -q '"version": "0.5.0"' .vyron-v050/src-tauri/tauri.conf.json
          grep -q '"identifier": "studio.channelflow.desktop"' .vyron-v050/src-tauri/tauri.conf.json
          grep -q '<title>VYRON</title>' .vyron-v050/index.html
          grep -q 'VYRON 0.5.0' .vyron-v050/src/App.tsx
          echo 'Remaining ChannelFlow refs are allowed only for migration/release notes:'
          grep -RIn --exclude-dir=target --exclude-dir=node_modules 'ChannelFlow' .vyron-v050 || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .vyron-v050/src-tauri
          cache-on-failure: true

      - name: Install JS dependencies
        working-directory: .vyron-v050
        run: npm install --no-audit --no-fund

      - name: Generate VYRON app icon
        working-directory: .vyron-v050
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          w=h=1024
          bg=(5,16,28)
          cyan=(52,221,255)
          mint=(83,242,189)
          with open('/tmp/vyron.ppm','wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode())
              for y in range(h):
                  row=bytearray()
                  for x in range(w):
                      # Premium rounded-square background + bold V mark.
                      dx=min(x,1023-x); dy=min(y,1023-y)
                      inside_bg = dx>90 and dy>90
                      left = abs((x-270) - (y-260)*0.43) < 58 and 260 < y < 770
                      right = abs((x-754) + (y-260)*0.43) < 58 and 260 < y < 770
                      tip = ((x-512)**2 + (y-760)**2) < 72**2
                      if left:
                          px=cyan
                      elif right or tip:
                          px=mint
                      elif inside_bg:
                          px=bg
                      else:
                          px=(3,10,18)
                      row += bytes(px)
                  f.write(row)
          PY
          sips -s format png /tmp/vyron.ppm --out /tmp/vyron.png >/dev/null
          npx tauri icon /tmp/vyron.png

      - name: Unit tests
        working-directory: .vyron-v050
        run: npm test

      - name: Frontend production build
        working-directory: .vyron-v050
        run: npm run build

      - name: Rust ARM64 check
        working-directory: .vyron-v050
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build VYRON app and DMG
        working-directory: .vyron-v050
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify VYRON app and package checked DMG
        working-directory: .vyron-v050
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          test -n "$APP" && test -d "$APP/Contents"
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          test -n "$BIN" && test -s "$BIN"
          file "$BIN" | tee /tmp/vyron-file.txt
          grep -E 'arm64|Mach-O 64-bit executable arm64' /tmp/vyron-file.txt

          mkdir -p "$APP/Contents/Resources"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          rm -rf /tmp/vyron-dmg-root release
          mkdir -p /tmp/vyron-dmg-root release
          ditto "$APP" /tmp/vyron-dmg-root/VYRON.app
          ln -s /Applications /tmp/vyron-dmg-root/Applications
          hdiutil create -volname "VYRON 0.5.0" -srcfolder /tmp/vyron-dmg-root -ov -format UDZO release/VYRON-0.5.0-macOS-AppleSilicon.dmg
          hdiutil verify release/VYRON-0.5.0-macOS-AppleSilicon.dmg
          test -s release/VYRON-0.5.0-macOS-AppleSilicon.dmg
          cp RELEASE_NOTES.md release/RELEASE_NOTES.md
          shasum -a 256 release/VYRON-0.5.0-macOS-AppleSilicon.dmg > release/SHA256.txt

          tar -czf release/VYRON-0.5.0-source.tar.gz --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' .
          shasum -a 256 release/VYRON-0.5.0-source.tar.gz > release/SOURCE_SHA256.txt

      - name: Upload VYRON installer and source
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-macOS-AppleSilicon-v0.5.0
          path: .vyron-v050/release/
          retention-days: 30
