name: VYRON 0.9.0 Release

on:
  push:
    branches: [vyron-v090]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified VYRON base
        shell: bash
        run: |
          set -euo pipefail
          cat channelflow-v040/source.part* > /tmp/channelflow-v040.b64
          base64 -D -i /tmp/channelflow-v040.b64 -o /tmp/channelflow-v040.tar.gz
          echo "bd6296ae943e1756fb3b3e0dcf61436b6c61e77de88834321bf82388d12c2bd1  /tmp/channelflow-v040.tar.gz" | shasum -a 256 -c -
          rm -rf .vyron-v051 && mkdir .vyron-v051
          tar -xzf /tmp/channelflow-v040.tar.gz -C .vyron-v051
          cp channelflow-v040/files.rs.fixed .vyron-v051/src-tauri/src/files.rs
          sed 's/\.vyron-v050/.vyron-v051/g' vyron-v050/rebrand.py > /tmp/rebrand-v051.py
          python3 /tmp/rebrand-v051.py
          cp vyron-v050/system.rs .vyron-v051/src-tauri/src/system.rs
          cp vyron-v050/storage.rs .vyron-v051/src-tauri/src/storage.rs

      - name: Reconstruct stable VYRON 0.8.1
        shell: bash
        run: |
          set -euo pipefail
          cat vyron-v051/patcher.part00 vyron-v051/patcher.part01 vyron-v051/patcher.part02 > /tmp/apply_vyron051.py
          echo "6a0b2287b7face63d1b33cec342101b83a1e0160ed0f0c9ad9a6b62ba13744fe  /tmp/apply_vyron051.py" | shasum -a 256 -c -
          if [ ! -f .vyron-v051/package-lock.json ]; then printf '%s\n' '{"name":"channelflow","version":"0.5.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"channelflow","version":"0.5.0"}}}' > .vyron-v051/package-lock.json; fi
          if [ ! -f .vyron-v051/src-tauri/Cargo.lock ]; then printf 'version = 3\n\n[[package]]\nname = "channelflow"\nversion = "0.5.0"\n' > .vyron-v051/src-tauri/Cargo.lock; fi
          python3 /tmp/apply_vyron051.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.vyron-v051/src-tauri/src/youtube.rs');s=p.read_text();old='old_status.get("privacyStatus").and_then(|x|x.as_str())!="private"';new='old_status.get("privacyStatus").and_then(|x|x.as_str())!=Some("private")'
          if old not in s: raise SystemExit('privacyStatus marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          python3 vyron-v052/apply_v052.py
          python3 vyron-v053/apply_v053.py
          python3 vyron-v060/apply_v060.py
          python3 vyron-v061/apply_v061.py
          python3 vyron-v070/apply_v070.py
          python3 vyron-v080/apply_v080.py
          python3 vyron-v080/fix_v080_rust.py
          python3 vyron-v081/apply_v081.py
          grep -q '"version": "0.8.1"' .vyron-v051/package.json

      - name: Apply VYRON 0.9.0 OS update
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile vyron-v090/apply_v090.py vyron-v090/patch_backend_v090.py vyron-v090/postfix_v090.py
          python3 vyron-v090/apply_v090.py
          python3 vyron-v090/patch_backend_v090.py
          python3 vyron-v090/postfix_v090.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.vyron-v051/src-tauri/src/youtube_intelligence.rs')
          s=p.read_text()
          old='use tauri::AppHandle;'
          new='use tauri::{AppHandle,Manager};'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 -m json.tool .vyron-v051/package.json >/dev/null
          python3 -m json.tool .vyron-v051/src-tauri/tauri.conf.json >/dev/null
          grep -q '"version": "0.9.0"' .vyron-v051/package.json
          grep -q "page:'youtube'" .vyron-v051/src/App.tsx
          grep -q 'youtube_backup_existing_videos' .vyron-v051/src-tauri/src/lib.rs
          grep -q 'yt-analytics-monetary.readonly' .vyron-v051/src-tauri/src/youtube.rs
          grep -q 'YouTube не подтвердил' .vyron-v051/src-tauri/src/youtube.rs
          grep -q 'VYRON CONTROL CENTER' .vyron-v051/src/DashboardOS.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .vyron-v051/src-tauri
          cache-on-failure: true

      - name: Install JS dependencies
        working-directory: .vyron-v051
        run: npm install --no-audit --no-fund

      - name: Generate VYRON app icon
        working-directory: .vyron-v051
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          w=h=1024;bg=(5,16,28);cyan=(52,221,255);mint=(83,242,189)
          with open('/tmp/vyron.ppm','wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode())
              for y in range(h):
                  row=bytearray()
                  for x in range(w):
                      dx=min(x,1023-x);dy=min(y,1023-y);inside=dx>90 and dy>90
                      left=abs((x-270)-(y-260)*0.43)<58 and 260<y<770
                      right=abs((x-754)+(y-260)*0.43)<58 and 260<y<770
                      tip=((x-512)**2+(y-760)**2)<72**2
                      px=cyan if left else mint if (right or tip) else bg if inside else (3,10,18)
                      row+=bytes(px)
                  f.write(row)
          PY
          sips -s format png /tmp/vyron.ppm --out /tmp/vyron.png >/dev/null
          npx tauri icon /tmp/vyron.png

      - name: Unit tests
        working-directory: .vyron-v051
        run: npm test

      - name: Frontend production build
        working-directory: .vyron-v051
        run: npm run build

      - name: Rust ARM64 check
        working-directory: .vyron-v051
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Configure updater signing mode
        working-directory: .vyron-v051
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo 'UPDATER_SIGNED=1' >> "$GITHUB_ENV"
            echo 'Signed Tauri updater enabled'
          else
            echo 'UPDATER_SIGNED=0' >> "$GITHUB_ENV"
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json');d=json.loads(p.read_text());d['bundle']['createUpdaterArtifacts']=False;p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
            echo 'No TAURI_SIGNING_PRIVATE_KEY: building verified DMG without updater feed'
          fi

      - name: Build VYRON app and DMG
        working-directory: .vyron-v051
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify app, package release and source
        working-directory: .vyron-v051
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          test -n "$APP" && test -d "$APP/Contents"
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          test -n "$BIN" && test -s "$BIN"
          file "$BIN" | tee /tmp/vyron-file.txt
          grep -E 'arm64|Mach-O 64-bit executable arm64' /tmp/vyron-file.txt
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -rf /tmp/vyron-dmg-root release
          mkdir -p /tmp/vyron-dmg-root release
          ditto "$APP" /tmp/vyron-dmg-root/VYRON.app
          ln -s /Applications /tmp/vyron-dmg-root/Applications
          hdiutil create -volname "VYRON 0.9.0" -srcfolder /tmp/vyron-dmg-root -ov -format UDZO release/VYRON-0.9.0-macOS-AppleSilicon.dmg
          hdiutil verify release/VYRON-0.9.0-macOS-AppleSilicon.dmg
          test -s release/VYRON-0.9.0-macOS-AppleSilicon.dmg
          cp ../vyron-v090/RELEASE_NOTES.md release/RELEASE_NOTES.md
          shasum -a 256 release/VYRON-0.9.0-macOS-AppleSilicon.dmg > release/SHA256.txt
          tar -czf release/VYRON-0.9.0-source.tar.gz --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' --exclude='./release' .
          shasum -a 256 release/VYRON-0.9.0-source.tar.gz > release/SOURCE_SHA256.txt
          if [ "$UPDATER_SIGNED" = '1' ]; then
            UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit || true)
            SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit || true)
            test -n "$UPDATER" && test -s "$UPDATER"
            test -n "$SIG" && test -s "$SIG"
            cp "$UPDATER" release/VYRON.app.tar.gz
            cp "$SIG" release/VYRON.app.tar.gz.sig
            python3 - <<'PY'
          import json,datetime
          from pathlib import Path
          sig=Path('release/VYRON.app.tar.gz.sig').read_text().strip()
          data={"version":"0.9.0","notes":Path('release/RELEASE_NOTES.md').read_text(),"pub_date":datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),"platforms":{"darwin-aarch64":{"url":"https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v0.9.0/VYRON.app.tar.gz","signature":sig}}}
          Path('release/latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          else
            printf '%s\n' 'Signed updater was not published because TAURI_SIGNING_PRIVATE_KEY is not configured.' > release/UPDATER_STATUS.txt
          fi

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-macOS-AppleSilicon-v0.9.0
          path: .vyron-v051/release/
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v0.9.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.9.0 .vyron-v051/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VYRON 0.9.0" --notes-file vyron-v090/RELEASE_NOTES.md

      - name: Publish signed updater feed
        if: env.UPDATER_SIGNED == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=$(gh api repos/$GITHUB_REPOSITORY/contents/vyron-updates/latest.json --jq .sha 2>/dev/null || true)
          CONTENT=$(base64 < .vyron-v051/release/latest.json | tr -d '\n')
          if [ -n "$BASE" ]; then
            gh api --method PUT repos/$GITHUB_REPOSITORY/contents/vyron-updates/latest.json -f message='release: publish VYRON 0.9.0 updater feed' -f content="$CONTENT" -f sha="$BASE" -f branch=main >/dev/null
          else
            gh api --method PUT repos/$GITHUB_REPOSITORY/contents/vyron-updates/latest.json -f message='release: publish VYRON 0.9.0 updater feed' -f content="$CONTENT" -f branch=main >/dev/null
          fi
