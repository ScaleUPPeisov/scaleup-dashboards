name: Fix VYRON updater key normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vyron-v091-key-normalizer-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch signed updater workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/vyron-v091-updater-bootstrap.yml')
          s=p.read_text()
          marker="      - name: Validate updater trust secrets\n"
          if 'Normalize updater trust secrets' not in s:
              lines=[
                  "      - name: Normalize updater trust secrets",
                  "        shell: bash",
                  "        run: |",
                  "          set -euo pipefail",
                  "          python3 - <<'PYKEY'",
                  "          import base64, os",
                  "          def box(value):",
                  "              try: return base64.b64decode(value.strip(), validate=True).decode('utf-8')",
                  "              except Exception: return None",
                  "          def normalize(name):",
                  "              raw=os.environ[name].strip()",
                  "              d=box(raw)",
                  "              if d and d.startswith('untrusted comment:'): return raw",
                  "              try: outer=base64.b64decode(raw, validate=True).decode('utf-8').strip()",
                  "              except Exception as e: raise SystemExit(f'{name}: invalid updater key encoding: {e}')",
                  "              d=box(outer)",
                  "              if not d or not d.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')",
                  "              return outer",
                  "          sk=normalize('TAURI_SIGNING_PRIVATE_KEY')",
                  "          pk=normalize('TAURI_UPDATER_PUBLIC_KEY')",
                  "          with open(os.environ['GITHUB_ENV'],'a') as f:",
                  "              f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\\n')",
                  "              f.write(f'TAURI_UPDATER_PUBLIC_KEY={pk}\\n')",
                  "          print('Updater secrets normalized: OK')",
                  "          PYKEY",
                  "",
              ]
              insert='\n'.join(lines)
              if marker not in s: raise SystemExit('validation marker missing')
              s=s.replace(marker,insert+marker,1)
              p.write_text(s)
          PY
          git diff --check
          grep -q 'Normalize updater trust secrets' .github/workflows/vyron-v091-updater-bootstrap.yml

      - name: Commit workflow fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/vyron-v091-updater-bootstrap.yml
          if git diff --cached --quiet; then
            echo 'Workflow already normalized'
            exit 0
          fi
          git commit -m 'fix: normalize Tauri updater signing secrets'
          git push origin HEAD:main
