name: Kick off VYRON 0.9.1 updater bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vyron-v091-kickoff.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed updater bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run vyron-v091-updater-bootstrap.yml --repo "$GITHUB_REPOSITORY" --ref main
