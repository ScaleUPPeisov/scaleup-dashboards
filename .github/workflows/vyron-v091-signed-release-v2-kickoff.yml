name: Kick off VYRON 0.9.1 signed release v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vyron-v091-signed-release-v2-kickoff.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected signed updater release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run vyron-v091-signed-release-v2.yml --repo "$GITHUB_REPOSITORY" --ref main
