name: VYRON 0.9.6 YouTube Metadata Write Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['vyron-v096-release-trigger.txt']

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 70
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Checkout VYRON 0.9.6 payload
        uses: actions/checkout@v4
        with:
          ref: vyron-v096-metadata-write-fix

      - name: Normalize updater keys
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY'; exit 1; }
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}" || { echo 'Missing TAURI_UPDATER_PUBLIC_KEY'; exit 1; }
          python3 - <<'PY'
          import base64, os
          def dec(value):
              try: return base64.b64decode(value.strip(), validate=True).decode()
              except Exception: return None
          def norm(name, kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key'); pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          PY

      - name: Restore released VYRON 0.9.5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vyron-v051 && mkdir .vyron-v051
          curl -fL --retry 3 'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v0.9.5/VYRON-0.9.5-source.tar.gz' -o /tmp/v095.tar.gz
          tar -xzf /tmp/v095.tar.gz -C .vyron-v051
          test -f .vyron-v051/package.json
          grep -q '"version": "0.9.5"' .vyron-v051/package.json

      - name: Apply VYRON 0.9.6 write fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile vyron-v096/apply_v096.py vyron-v096/postfix_v096.py
          python3 vyron-v096/apply_v096.py
          python3 vyron-v096/postfix_v096.py
          grep -q '"version": "0.9.6"' .vyron-v051/package.json
          grep -q '"version": "0.9.6"' .vyron-v051/src-tauri/tauri.conf.json
          grep -q '^version = "0.9.6"$' .vyron-v051/src-tauri/Cargo.toml
          ! grep -q 'catch{err++}' .vyron-v051/src/MetadataPage.tsx
          grep -q 'metadataVerified' .vyron-v051/src/MetadataPage.tsx
          grep -q 'scheduleError' .vyron-v051/src/MetadataPage.tsx
          grep -q 'Phase 1: metadata only' .vyron-v051/src-tauri/src/youtube.rs
          grep -q 'Phase 2: privacy/schedule' .vyron-v051/src-tauri/src/youtube.rs

      - name: Verify updater configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          conf=json.loads(Path('.vyron-v051/src-tauri/tauri.conf.json').read_text())
          assert conf['version']=='0.9.6'
          assert conf['bundle']['createUpdaterArtifacts'] is True
          assert conf['plugins']['updater']['pubkey'].strip()==os.environ['TAURI_UPDATER_PUBLIC_KEY'].strip()
          assert conf['plugins']['updater'].get('endpoints',[])==['https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json']
          print('Updater configuration: OK')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .vyron-v051/src-tauri
          cache-on-failure: true

      - name: Install dependencies
        working-directory: .vyron-v051
        run: npm install --no-audit --no-fund

      - name: Frontend unit tests
        working-directory: .vyron-v051
        run: npm test

      - name: Frontend production build
        working-directory: .vyron-v051
        run: npm run build

      - name: Rust write-safety unit tests
        working-directory: .vyron-v051
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --target aarch64-apple-darwin youtube_write_tests

      - name: Rust ARM64 check
        working-directory: .vyron-v051
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Required write-contract markers
        working-directory: .vyron-v051
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'youtube_sanitize_tags' src-tauri/src/youtube.rs
          grep -q 'youtube_truncate_utf8_bytes' src-tauri/src/youtube.rs
          grep -q 'error/errors/0/reason' src-tauri/src/youtube.rs
          grep -q 'YOUTUBE WRITE REPORT' src/MetadataPage.tsx
          grep -q 'Применяю ${applyProgress' src/MetadataPage.tsx
          echo 'VYRON 0.9.6 YouTube write contract: OK'

      - name: Scan private key leakage
        working-directory: .vyron-v051
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          secret=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip().encode()
          for root in [Path('dist'),Path('src'),Path('src-tauri/src')]:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if p.is_file() and secret in p.read_bytes(): raise SystemExit(f'PRIVATE KEY LEAK: {p}')
          print('Leak scan: OK')
          PY

      - name: Build signed updater and DMG
        working-directory: .vyron-v051
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Package and verify release
        working-directory: .vyron-v051
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -s "$BIN" && test -s "$DMG" && test -s "$UPDATER" && test -s "$SIG"
          file "$BIN" | grep -E 'arm64|Mach-O 64-bit executable arm64'
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          rm -rf release && mkdir release
          cp "$DMG" release/VYRON-0.9.6-macOS-AppleSilicon.dmg
          cp "$UPDATER" release/VYRON.app.tar.gz
          cp "$SIG" release/VYRON.app.tar.gz.sig
          cp ../vyron-v096/RELEASE_NOTES.md release/RELEASE_NOTES.md
          shasum -a 256 release/VYRON-0.9.6-macOS-AppleSilicon.dmg > release/SHA256.txt
          shasum -a 256 release/VYRON.app.tar.gz >> release/SHA256.txt
          tar -czf release/VYRON-0.9.6-source.tar.gz --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' --exclude='./release' .
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          sig=Path('release/VYRON.app.tar.gz.sig').read_text().strip()
          feed={'version':'0.9.6','notes':Path('release/RELEASE_NOTES.md').read_text(),'pub_date':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'platforms':{'darwin-aarch64':{'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v0.9.6/VYRON.app.tar.gz','signature':sig}}}
          Path('release/latest.json').write_text(json.dumps(feed,ensure_ascii=False,indent=2)+'\n')
          PY
          test -s release/VYRON-0.9.6-macOS-AppleSilicon.dmg
          test -s release/VYRON.app.tar.gz
          test -s release/VYRON.app.tar.gz.sig
          grep -q '"version": "0.9.6"' release/latest.json

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-macOS-AppleSilicon-v0.9.6-signed
          path: .vyron-v051/release/
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          gh release delete v0.9.6 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.9.6 .vyron-v051/release/* --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title 'VYRON 0.9.6 — YouTube Metadata Write Fix' --notes-file vyron-v096/RELEASE_NOTES.md

      - name: Publish updater feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=$(gh api repos/$GITHUB_REPOSITORY/contents/vyron-updates/latest.json --jq .sha 2>/dev/null || true)
          CONTENT=$(base64 < .vyron-v051/release/latest.json | tr -d '\n')
          if [ -n "$BASE" ]; then
            gh api --method PUT repos/$GITHUB_REPOSITORY/contents/vyron-updates/latest.json -f message='release: publish signed VYRON 0.9.6 updater feed' -f content="$CONTENT" -f sha="$BASE" -f branch=main >/dev/null
          else
            gh api --method PUT repos/$GITHUB_REPOSITORY/contents/vyron-updates/latest.json -f message='release: publish signed VYRON 0.9.6 updater feed' -f content="$CONTENT" -f branch=main >/dev/null
          fi

      - name: Verify published release and live updater feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.9.6 --repo "$GITHUB_REPOSITORY" >/dev/null
          for f in VYRON-0.9.6-macOS-AppleSilicon.dmg VYRON.app.tar.gz VYRON.app.tar.gz.sig VYRON-0.9.6-source.tar.gz SHA256.txt latest.json; do
            gh release view v0.9.6 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$f" >/dev/null
          done
          python3 - <<'PY'
          import json,time,urllib.request
          expected='https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v0.9.6/VYRON.app.tar.gz'
          live='https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json'
          last=None
          for _ in range(24):
              try:
                  req=urllib.request.Request(live+f'?t={time.time_ns()}',headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as r: data=json.load(r)
                  last=data; p=data.get('platforms',{}).get('darwin-aarch64',{})
                  if data.get('version')=='0.9.6' and p.get('url')==expected and p.get('signature'):
                      print('Live updater feed verified: 0.9.6'); break
              except Exception as exc: last=repr(exc)
              time.sleep(5)
          else: raise SystemExit(f'Updater feed verification failed: {last}')
          PY
