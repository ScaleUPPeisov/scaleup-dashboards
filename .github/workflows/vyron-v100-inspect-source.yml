name: VYRON 1.0 Source Snapshot

on:
  push:
    branches: [vyron-v0100-zero-quota-production]
    paths: ['vyron-v100-inspect-trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: vyron-v0100-zero-quota-production

      - name: Restore released VYRON 0.9.9 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vyron099
          mkdir -p /tmp/vyron099
          curl -fL --retry 3 'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v0.9.9/VYRON-0.9.9-source.tar.gz' -o /tmp/v099.tar.gz
          echo 'ca4415aa175a9126813009df56f7d8e27c7fdf82fb25ca54fe22e0782faef7b7  /tmp/v099.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v099.tar.gz -C /tmp/vyron099
          grep -q '"version": "0.9.9"' /tmp/vyron099/package.json

      - name: Export selected source files for upgrade audit
        shell: bash
        run: |
          set -euo pipefail
          OUT=vyron-v100/source-snapshot
          rm -rf "$OUT"
          mkdir -p "$OUT/src" "$OUT/src-tauri/src"
          for f in App.tsx api.ts store.ts types.ts autopilotRuntime.ts autopilotCore.ts DashboardOS.tsx ChannelsOS.tsx ProductionOS.tsx AnalyticsPage.tsx CompetitorsPage.tsx YouTubeCenter.tsx SettingsOS.tsx MetadataPage.tsx youtubeQuota.ts youtubeIntelligence.ts styles.css; do
            if [ -f "/tmp/vyron099/src/$f" ]; then cp "/tmp/vyron099/src/$f" "$OUT/src/$f"; fi
          done
          for f in lib.rs youtube.rs youtube_intelligence.rs storage.rs system.rs; do
            if [ -f "/tmp/vyron099/src-tauri/src/$f" ]; then cp "/tmp/vyron099/src-tauri/src/$f" "$OUT/src-tauri/src/$f"; fi
          done
          cp /tmp/vyron099/package.json "$OUT/package.json"
          cp /tmp/vyron099/src-tauri/Cargo.toml "$OUT/Cargo.toml"
          cp /tmp/vyron099/src-tauri/tauri.conf.json "$OUT/tauri.conf.json"
          find "$OUT" -type f -maxdepth 4 -print | sort > "$OUT/FILES.txt"

      - name: Commit source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vyron-v100/source-snapshot
          if git diff --cached --quiet; then echo 'snapshot unchanged'; exit 0; fi
          git commit -m 'chore(vyron): snapshot released 0.9.9 source for 1.0 upgrade'
          git push origin HEAD:vyron-v0100-zero-quota-production
