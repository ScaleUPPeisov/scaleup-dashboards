name: VYRON 1.0.10 Updater EXDEV Release v2

on:
  push:
    branches: [vyron-v1010-updater-exdev-hotfix]
    paths: ['vyron-v1010-release-v2-trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyron-v1010-updater-exdev-release-v2
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 100
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: "-"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout hotfix
        uses: actions/checkout@v4

      - name: Verify live 1.0.9 and updater keys
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json' -o /tmp/current-live.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/current-live.json'))['version']=='1.0.9'
          PY
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"; test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key'); pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          PY

      - name: Restore exact released VYRON 1.0.9 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vyron-v1010 /tmp/v109-assets; mkdir -p .vyron-v1010 /tmp/v109-assets
          gh release download v1.0.9 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.0.9-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/v109-assets
          EXPECTED="$(awk '{print $1; exit}' /tmp/v109-assets/SOURCE_SHA256.txt)"; GOT="$(shasum -a 256 /tmp/v109-assets/VYRON-1.0.9-source.tar.gz | awk '{print $1}')"; test "$EXPECTED" = "$GOT"
          tar -xzf /tmp/v109-assets/VYRON-1.0.9-source.tar.gz -C .vyron-v1010
          grep -q '"version": "1.0.9"' .vyron-v1010/package.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.vyron-v1010'); c=json.loads((root/'src-tauri/tauri.conf.json').read_text())
          Path('/tmp/v109-id').write_text(c['identifier']); Path('/tmp/v109-pub').write_text(c['plugins']['updater']['pubkey']); Path('/tmp/v109-endpoints').write_text(json.dumps(c['plugins']['updater']['endpoints']))
          protected=['src-tauri/src/youtube.rs','src-tauri/src/storage.rs','src-tauri/src/files.rs','src-tauri/src/production_manager.rs','src-tauri/src/production_manager_tests.rs','src/store.ts','src/types.ts','src/ProductionManager.tsx','src/productionManagerApi.ts','src/productionPrefs.ts','src/YouTubeCenter.tsx','src/AnalyticsPage.tsx','src/CompetitorsPage.tsx']
          Path('/tmp/v109-protected.json').write_text(json.dumps({p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in protected},sort_keys=True))
          PY

      - name: Apply corrected EXDEV patch v2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile vyron-v1010/apply_v1010_v2.py
          cd .vyron-v1010
          python3 ../vyron-v1010/apply_v1010_v2.py

      - name: Static regression and updater contracts
        shell: bash
        run: |
          set -euo pipefail
          cd .vyron-v1010
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=json.loads(Path('package.json').read_text()); c=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert p['version']=='1.0.10' and c['version']=='1.0.10'
          assert c['identifier']==Path('/tmp/v109-id').read_text()
          assert c['plugins']['updater']['pubkey']==Path('/tmp/v109-pub').read_text()
          assert c['plugins']['updater']['pubkey'].strip()==os.environ['TAURI_UPDATER_PUBLIC_KEY'].strip()
          assert json.dumps(c['plugins']['updater']['endpoints'])==Path('/tmp/v109-endpoints').read_text()
          for f,h in json.loads(Path('/tmp/v109-protected.json').read_text()).items(): assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h, f
          lib=Path('src-tauri/src/lib.rs').read_text(); assert lib.startswith('#![recursion_limit = "512"]\nmod updater_bridge;\n')
          api=Path('src/api.ts').read_text(); assert api.index("prepare_updater_tempdir") < api.index('downloadAndInstall')
          print('VYRON 1.0.10 static contracts: PASS')
          PY
          grep -Fq 'MetadataExt' src-tauri/src/updater_bridge.rs
          grep -Fq 'app_dev==tmp_dev' src-tauri/src/updater_bridge.rs
          grep -Fq '.vyron-updater-tmp' src-tauri/src/updater_bridge.rs
          grep -Fq 'set_var("TMPDIR"' src-tauri/src/updater_bridge.rs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .vyron-v1010/src-tauri
          cache-on-failure: true

      - name: Install and frontend tests
        working-directory: .vyron-v1010
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Rust acceptance and ARM64 check
        working-directory: .vyron-v1010
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build signed VYRON
        working-directory: .vyron-v1010
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify and prepare release
        working-directory: .vyron-v1010
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP" -a -s "$DMG" -a -s "$UPDATER" -a -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$(cat /tmp/v109-id)"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '1.0.10'
          codesign --verify --deep --strict --verbose=2 "$APP"; hdiutil verify "$DMG"
          command -v minisign >/dev/null 2>&1 || brew install minisign
          base64 -D -i /tmp/v109-pub -o /tmp/vyron.pub; base64 -D -i "$SIG" -o /tmp/v1010.minisig; minisign -Vm "$UPDATER" -p /tmp/vyron.pub -x /tmp/v1010.minisig
          rm -rf release; mkdir release
          cp "$DMG" release/VYRON-1.0.10-macOS-AppleSilicon.dmg; cp "$UPDATER" release/VYRON.app.tar.gz; cp "$SIG" release/VYRON.app.tar.gz.sig
          cp ../vyron-v1010/RELEASE_NOTES_1.0.10.md release/RELEASE_NOTES.md
          shasum -a 256 release/VYRON-1.0.10-macOS-AppleSilicon.dmg > release/SHA256.txt
          shasum -a 256 release/VYRON.app.tar.gz > release/UPDATER_SHA256.txt
          tar -czf release/VYRON-1.0.10-source.tar.gz --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' --exclude='./release' .
          shasum -a 256 release/VYRON-1.0.10-source.tar.gz > release/SOURCE_SHA256.txt
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          data={'version':'1.0.10','notes':Path('release/RELEASE_NOTES.md').read_text(),'pub_date':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'platforms':{'darwin-aarch64':{'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v1.0.10/VYRON.app.tar.gz','signature':Path('release/VYRON.app.tar.gz.sig').read_text().strip()}}}
          Path('release/latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish v1.0.10
        working-directory: .vyron-v1010
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.10 --repo ScaleUPPeisov/scaleup-dashboards >/dev/null 2>&1; then gh release upload v1.0.10 release/* --repo ScaleUPPeisov/scaleup-dashboards --clobber; gh release edit v1.0.10 --repo ScaleUPPeisov/scaleup-dashboards --title 'VYRON 1.0.10 — Updater EXDEV Hotfix' --notes-file release/RELEASE_NOTES.md; else gh release create v1.0.10 release/* --repo ScaleUPPeisov/scaleup-dashboards --target "$GITHUB_SHA" --title 'VYRON 1.0.10 — Updater EXDEV Hotfix' --notes-file release/RELEASE_NOTES.md; fi

      - name: Publish live updater feed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; rm -rf /tmp/vyron-main-v1010; git worktree add /tmp/vyron-main-v1010 origin/main
          mkdir -p /tmp/vyron-main-v1010/vyron-updates; cp .vyron-v1010/release/latest.json /tmp/vyron-main-v1010/vyron-updates/latest.json
          cd /tmp/vyron-main-v1010; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add vyron-updates/latest.json
          if ! git diff --cached --quiet; then git commit -m 'release(vyron): publish 1.0.10 updater feed'; git push origin HEAD:main; fi

      - name: Verify live release
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.10 --repo ScaleUPPeisov/scaleup-dashboards --json tagName,assets > /tmp/v1010.json
          python3 - <<'PY'
          import json,time,urllib.request
          r=json.load(open('/tmp/v1010.json')); n={x['name'] for x in r['assets']}; assert r['tagName']=='v1.0.10'; assert 'VYRON-1.0.10-macOS-AppleSilicon.dmg' in n and 'VYRON.app.tar.gz' in n
          for _ in range(20):
              try:
                  x=json.load(urllib.request.urlopen('https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json'))
                  if x.get('version')=='1.0.10': print('Live updater 1.0.10: PASS'); break
              except Exception: pass
              time.sleep(3)
          else: raise SystemExit('live updater did not reach 1.0.10')
          PY
