name: VYRON 1.0.11 Project Storage Release

on:
  push:
    branches: [vyron-v1011-project-location]
    paths: ['vyron-v1011-release-trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyron-v1011-project-storage-release
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 100
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: "-"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Verify live 1.0.10 and updater keys
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json' -o /tmp/current-live.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/current-live.json'))
          assert x['version']=='1.0.10', f"Expected live 1.0.10, got {x['version']}"
          print('Current live updater 1.0.10: PASS')
          PY
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip();once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip();box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key');pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          print('Updater keys: PASS')
          PY

      - name: Restore exact released VYRON 1.0.10 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vyron-v1011 /tmp/v1010-assets
          mkdir -p .vyron-v1011 /tmp/v1010-assets
          gh release download v1.0.10 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.0.10-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/v1010-assets
          EXPECTED="$(awk '{print $1; exit}' /tmp/v1010-assets/SOURCE_SHA256.txt)"
          GOT="$(shasum -a 256 /tmp/v1010-assets/VYRON-1.0.10-source.tar.gz | awk '{print $1}')"
          test "$EXPECTED" = "$GOT"
          tar -xzf /tmp/v1010-assets/VYRON-1.0.10-source.tar.gz -C .vyron-v1011
          grep -q '"version": "1.0.10"' .vyron-v1011/package.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.vyron-v1011');c=json.loads((root/'src-tauri/tauri.conf.json').read_text())
          Path('/tmp/v1010-id').write_text(c['identifier'])
          Path('/tmp/v1010-pub').write_text(c['plugins']['updater']['pubkey'])
          Path('/tmp/v1010-endpoints').write_text(json.dumps(c['plugins']['updater']['endpoints']))
          protected=[
            'src/api.ts','src-tauri/src/youtube.rs','src-tauri/src/storage.rs','src-tauri/src/files.rs',
            'src-tauri/src/production_manager.rs','src-tauri/src/production_manager_tests.rs','src-tauri/src/updater_bridge.rs',
            'src/store.ts','src/types.ts','src/ProductionManager.tsx','src/productionManagerApi.ts',
            'src/YouTubeCenter.tsx','src/AnalyticsPage.tsx','src/CompetitorsPage.tsx'
          ]
          Path('/tmp/v1010-protected.json').write_text(json.dumps({p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in protected},sort_keys=True))
          print('Exact 1.0.10 release source restored: PASS')
          PY

      - name: Apply VYRON 1.0.11 storage routing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile vyron-v1011/apply_v1011.py
          cd .vyron-v1011
          python3 ../vyron-v1011/apply_v1011.py

      - name: Static regression and scope contracts
        shell: bash
        run: |
          set -euo pipefail
          cd .vyron-v1011
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=json.loads(Path('package.json').read_text());c=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert p['version']=='1.0.11' and c['version']=='1.0.11'
          assert c['identifier']==Path('/tmp/v1010-id').read_text()
          assert c['plugins']['updater']['pubkey']==Path('/tmp/v1010-pub').read_text()
          assert c['plugins']['updater']['pubkey'].strip()==os.environ['TAURI_UPDATER_PUBLIC_KEY'].strip()
          assert json.dumps(c['plugins']['updater']['endpoints'])==Path('/tmp/v1010-endpoints').read_text()
          for f,h in json.loads(Path('/tmp/v1010-protected.json').read_text()).items():
              assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h, f'OUT-OF-SCOPE FILE CHANGED: {f}'
          prefs=Path('src/productionPrefs.ts').read_text();osui=Path('src/ProductionOS.tsx').read_text();auto=Path('src/autopilotRuntime.ts').read_text()
          assert 'resolveProductionRootFromPrefs' in prefs
          assert 'api.importImages(root,c.id,c.name' in osui
          assert "chooseProjectRoot('global')" in osui and "chooseProjectRoot('channel')" in osui
          assert 'ХРАНИЛИЩЕ ФАЙЛОВ ПРОЕКТОВ' in osui
          assert 'ensureFolder(channel,job,projectRoot)' in auto
          assert 'productionManagerApi.storageStatus(projectRoot)' in auto
          print('VYRON 1.0.11 storage scope: PASS')
          PY
          grep -Fq 'prepare_updater_tempdir' src/api.ts
          grep -Fq '.vyron-updater-tmp' src-tauri/src/updater_bridge.rs
          ! grep -RniE 'youtube_upload_video|youtube_list_existing_videos|youtube_update_existing_video|youtube_channel_analytics|googleapis\.com' tests/productionRoot_v1011.test.ts src/productionPrefs.ts src/ProductionOS.tsx src/autopilotRuntime.ts
          echo 'YouTube quota isolation: PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .vyron-v1011/src-tauri
          cache-on-failure: true

      - name: Install and frontend tests
        working-directory: .vyron-v1011
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Rust acceptance and ARM64 check
        working-directory: .vyron-v1011
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build signed VYRON
        working-directory: .vyron-v1011
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify and prepare release
        working-directory: .vyron-v1011
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -d "$APP" -a -s "$DMG" -a -s "$UPDATER" -a -s "$SIG"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$(cat /tmp/v1010-id)"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '1.0.11'
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$DMG"
          command -v minisign >/dev/null 2>&1 || brew install minisign
          base64 -D -i /tmp/v1010-pub -o /tmp/vyron.pub
          base64 -D -i "$SIG" -o /tmp/v1011.minisig
          minisign -Vm "$UPDATER" -p /tmp/vyron.pub -x /tmp/v1011.minisig
          rm -rf release;mkdir release
          cp "$DMG" release/VYRON-1.0.11-macOS-AppleSilicon.dmg
          cp "$UPDATER" release/VYRON.app.tar.gz
          cp "$SIG" release/VYRON.app.tar.gz.sig
          cp ../vyron-v1011/RELEASE_NOTES_1.0.11.md release/RELEASE_NOTES.md
          shasum -a 256 release/VYRON-1.0.11-macOS-AppleSilicon.dmg > release/SHA256.txt
          shasum -a 256 release/VYRON.app.tar.gz > release/UPDATER_SHA256.txt
          tar -czf release/VYRON-1.0.11-source.tar.gz --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' --exclude='./release' .
          shasum -a 256 release/VYRON-1.0.11-source.tar.gz > release/SOURCE_SHA256.txt
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          data={'version':'1.0.11','notes':Path('release/RELEASE_NOTES.md').read_text(),'pub_date':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'platforms':{'darwin-aarch64':{'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v1.0.11/VYRON.app.tar.gz','signature':Path('release/VYRON.app.tar.gz.sig').read_text().strip()}}}
          Path('release/latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish v1.0.11
        working-directory: .vyron-v1011
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.11 --repo ScaleUPPeisov/scaleup-dashboards >/dev/null 2>&1; then
            gh release upload v1.0.11 release/* --repo ScaleUPPeisov/scaleup-dashboards --clobber
            gh release edit v1.0.11 --repo ScaleUPPeisov/scaleup-dashboards --title 'VYRON 1.0.11 — Project Storage Fix' --notes-file release/RELEASE_NOTES.md
          else
            gh release create v1.0.11 release/* --repo ScaleUPPeisov/scaleup-dashboards --target "$GITHUB_SHA" --title 'VYRON 1.0.11 — Project Storage Fix' --notes-file release/RELEASE_NOTES.md
          fi

      - name: Publish live updater feed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/vyron-main-v1011
          git worktree add /tmp/vyron-main-v1011 origin/main
          mkdir -p /tmp/vyron-main-v1011/vyron-updates
          cp .vyron-v1011/release/latest.json /tmp/vyron-main-v1011/vyron-updates/latest.json
          cd /tmp/vyron-main-v1011
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vyron-updates/latest.json
          if ! git diff --cached --quiet; then git commit -m 'release(vyron): publish 1.0.11 updater feed';git push origin HEAD:main;fi

      - name: Verify live release
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.11 --repo ScaleUPPeisov/scaleup-dashboards --json tagName,assets > /tmp/v1011.json
          python3 - <<'PY'
          import json,time,urllib.request
          r=json.load(open('/tmp/v1011.json'));n={x['name'] for x in r['assets']}
          assert r['tagName']=='v1.0.11'
          assert 'VYRON-1.0.11-macOS-AppleSilicon.dmg' in n and 'VYRON.app.tar.gz' in n
          for _ in range(20):
              try:
                  x=json.load(urllib.request.urlopen('https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json'))
                  if x.get('version')=='1.0.11': print('Live updater 1.0.11: PASS');break
              except Exception: pass
              time.sleep(3)
          else: raise SystemExit('live updater did not reach 1.0.11')
          PY
