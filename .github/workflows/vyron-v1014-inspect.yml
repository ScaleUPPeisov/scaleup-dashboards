name: VYRON 1.0.14 Inspect Schedule Source
on:
  push:
    branches: [vyron-v1014-schedule-patterns]
    paths: ['vyron-v1014-inspect-trigger.txt']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vyron-v1014-schedule-patterns
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v1013-src /tmp/v1013-assets _inspect_v1014
          mkdir -p /tmp/v1013-src /tmp/v1013-assets _inspect_v1014/src
          gh release download v1.0.13 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.0.13-source.tar.gz' --dir /tmp/v1013-assets
          tar -xzf /tmp/v1013-assets/VYRON-1.0.13-source.tar.gz -C /tmp/v1013-src
          for f in src/types.ts src/channelSchedule.ts src/channelSchedule.test.ts src/MetadataPage.tsx src/CommandCenter.tsx src/ChannelRunway.tsx src/channelRunwayCore.ts src/productionPrefs.ts src/YouTubeCenter.tsx src/App.tsx src/styles.css package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml; do
            mkdir -p "_inspect_v1014/$(dirname "$f")"
            cp "/tmp/v1013-src/$f" "_inspect_v1014/$f"
          done
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _inspect_v1014
          if ! git diff --cached --quiet; then git commit -m 'chore(vyron): inspect exact 1.0.13 schedule source'; git push origin HEAD:vyron-v1014-schedule-patterns; fi
