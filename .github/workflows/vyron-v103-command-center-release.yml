name: VYRON 1.0.3 Command Center Release

on:
  push:
    branches: [vyron-v103-command-center-dev]
    paths: ['vyron-v103-release-trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyron-v103-command-center-release
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: "-"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Verify branch and current live version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "vyron-v103-command-center-dev"
          curl -fsSL 'https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json' -o /tmp/current-live.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/current-live.json'))
          assert x['version']=='1.0.2', f"Expected live 1.0.2 before 1.0.3 release, got {x['version']}"
          print('Current live updater is 1.0.2: PASS')
          PY

      - name: Normalize updater keys exactly like trusted releases
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || exit 1
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}" || exit 1
          python3 - <<'PY'
          import base64, os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip(); once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip(); box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key');pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          print('Updater key normalization: PASS')
          PY

      - name: Restore exact released VYRON 1.0.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vyron-v103 && mkdir .vyron-v103
          curl -fL --retry 3 'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v1.0.2/VYRON-1.0.2-source.tar.gz' -o /tmp/v102.tar.gz
          echo '55bf2ae837e18e6de0d412a547ef6a25f64fa9c870d4e66c2b27a4ef933897c7  /tmp/v102.tar.gz' | shasum -a 256 -c -
          tar -xzf /tmp/v102.tar.gz -C .vyron-v103
          grep -q '"version": "1.0.2"' .vyron-v103/package.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          conf=json.loads(Path('.vyron-v103/src-tauri/tauri.conf.json').read_text())
          Path('/tmp/vyron-v102-pubkey.txt').write_text(conf['plugins']['updater']['pubkey'].strip())
          Path('/tmp/vyron-v102-identifier.txt').write_text(conf['identifier'])
          print('1.0.2 source/trust baseline captured')
          PY

      - name: Apply Command Center 1.0.3 overlay
        run: python3 vyron-v100/apply_command_center.py .vyron-v103

      - name: Verify version and immutable updater trust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          pkg=json.loads(Path('.vyron-v103/package.json').read_text())
          conf=json.loads(Path('.vyron-v103/src-tauri/tauri.conf.json').read_text())
          assert pkg['version']=='1.0.3'
          assert conf['version']=='1.0.3'
          assert conf['bundle']['createUpdaterArtifacts'] is True
          baseline=Path('/tmp/vyron-v102-pubkey.txt').read_text().strip()
          assert conf['plugins']['updater']['pubkey'].strip()==baseline
          assert os.environ['TAURI_UPDATER_PUBLIC_KEY'].strip()==baseline
          assert conf['plugins']['updater']['endpoints']==['https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json']
          assert conf['identifier']==Path('/tmp/vyron-v102-identifier.txt').read_text()
          print('VYRON 1.0.3 identity/updater trust unchanged: PASS')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .vyron-v103/src-tauri
          cache-on-failure: true

      - name: Install JS dependencies
        working-directory: .vyron-v103
        run: npm install --no-audit --no-fund

      - name: Frontend tests
        working-directory: .vyron-v103
        run: npm test

      - name: TypeScript production build
        working-directory: .vyron-v103
        run: npm run build

      - name: Zero Quota + Command Center release contracts
        working-directory: .vyron-v103
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'refreshYoutubeIntelligence' src/App.tsx
          ! grep -R 'youtubeProfileHealth\|refreshChannelAnalytics\|youtubeDiscoverCompetitors' src/ChannelsOS.tsx src/AnalyticsPage.tsx src/CompetitorsPage.tsx src/SettingsOS.tsx
          ! grep -R 'youtubeUpload' src/autopilotRuntime.ts
          ! grep -R 'QuotaMeter' src/App.tsx src/SettingsOS.tsx
          grep -q 'QuotaMeter' src/YouTubeCenter.tsx
          grep -q 'CommandCenter' src/YouTubeCenter.tsx
          grep -q 'ChannelRunway' src/YouTubeCenter.tsx
          grep -q 'vyron:command-center:v1' src/commandCenterCore.ts
          grep -q 'SMART BATCH BUILDER' src/CommandCenter.tsx
          ! grep -R "from './api'\|api\.\|youtubeListExisting\|youtubeUpdateExisting\|youtubeProfileHealth\|youtubeAnalytics(\|youtubeUpload" src/commandCenterCore.ts src/commandCenterStore.ts src/CommandCenter.tsx
          grep -q 'vyron:channel-runway:v1' src/channelRunwayCore.ts
          grep -q 'Asia/Krasnoyarsk' src/channelRunwayCore.ts
          grep -q 'existing-cache:v1' src/ExistingVideos.tsx
          grep -q 'metadata-draft:v1' src/MetadataPage.tsx
          grep -q 'production-workspace:v1' src/ProductionWorkspace.tsx
          grep -q 'Сброс по вашему времени' src/QuotaMeter.tsx
          grep -q 'chunks(50)' src-tauri/src/youtube.rs
          grep -q 'metadata_needed' src-tauri/src/youtube.rs
          echo 'Zero Quota + Command Center release contracts: PASS'

      - name: Rust tests
        working-directory: .vyron-v103
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Cargo check ARM64
        working-directory: .vyron-v103
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Prevent updater private key leakage
        working-directory: .vyron-v103
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          secret=os.environ['TAURI_SIGNING_PRIVATE_KEY'].strip().encode()
          for root in [Path('src'),Path('dist'),Path('src-tauri/src')]:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if p.is_file() and secret and secret in p.read_bytes():
                      raise SystemExit(f'PRIVATE UPDATER KEY LEAK: {p}')
          print('Private updater key leak scan: PASS')
          PY

      - name: Build ARM64 app DMG and signed updater artifacts
        working-directory: .vyron-v103
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify updater signature against existing VYRON trust key
        working-directory: .vyron-v103
        shell: bash
        run: |
          set -euo pipefail
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -n "$UPDATER" && test -s "$UPDATER"
          test -n "$SIG" && test -s "$SIG"
          command -v minisign >/dev/null 2>&1 || brew install minisign
          base64 -D -i /tmp/vyron-v102-pubkey.txt -o /tmp/vyron-existing.pub
          base64 -D -i "$SIG" -o /tmp/vyron-v103.minisig
          minisign -Vm "$UPDATER" -p /tmp/vyron-existing.pub -x /tmp/vyron-v103.minisig
          echo 'Updater signature verification: PASS'

      - name: Verify and package release
        working-directory: .vyron-v103
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          BUILT_DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -n "$APP" && test -d "$APP/Contents"
          test -n "$BIN" && test -s "$BIN"
          test -n "$BUILT_DMG" && test -s "$BUILT_DMG"
          test -n "$UPDATER" && test -s "$UPDATER"
          test -n "$SIG" && test -s "$SIG"
          file "$BIN" | tee /tmp/vyron-v103-file.txt
          grep -E 'arm64|Mach-O 64-bit executable arm64' /tmp/vyron-v103-file.txt
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$BUILT_DMG"
          rm -rf release && mkdir release
          cp "$BUILT_DMG" release/VYRON-1.0.3-macOS-AppleSilicon.dmg
          cp "$UPDATER" release/VYRON.app.tar.gz
          cp "$SIG" release/VYRON.app.tar.gz.sig
          cp ../vyron-v100/RELEASE_NOTES_1.0.3.md release/RELEASE_NOTES.md
          shasum -a 256 release/VYRON-1.0.3-macOS-AppleSilicon.dmg > release/SHA256.txt
          shasum -a 256 release/VYRON.app.tar.gz > release/UPDATER_SHA256.txt
          tar -czf release/VYRON-1.0.3-source.tar.gz --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' --exclude='./release' .
          shasum -a 256 release/VYRON-1.0.3-source.tar.gz > release/SOURCE_SHA256.txt
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          sig=Path('release/VYRON.app.tar.gz.sig').read_text().strip()
          if not sig: raise SystemExit('empty updater signature')
          data={
            'version':'1.0.3',
            'notes':Path('release/RELEASE_NOTES.md').read_text(),
            'pub_date':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'platforms':{'darwin-aarch64':{
              'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v1.0.3/VYRON.app.tar.gz',
              'signature':sig
            }}
          }
          Path('release/latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish GitHub release v1.0.3
        working-directory: .vyron-v103
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.3 >/dev/null 2>&1; then
            gh release upload v1.0.3 release/* --clobber
            gh release edit v1.0.3 --title 'VYRON 1.0.3 — Command Center' --notes-file release/RELEASE_NOTES.md
          else
            gh release create v1.0.3 release/* --target "$GITHUB_SHA" --title 'VYRON 1.0.3 — Command Center' --notes-file release/RELEASE_NOTES.md
          fi

      - name: Publish signed live updater feed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/vyron-main-v103
          git worktree add /tmp/vyron-main-v103 origin/main
          mkdir -p /tmp/vyron-main-v103/vyron-updates
          cp .vyron-v103/release/latest.json /tmp/vyron-main-v103/vyron-updates/latest.json
          cd /tmp/vyron-main-v103
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vyron-updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'release(vyron): publish 1.0.3 updater feed'
            git push origin HEAD:main
          fi

      - name: Verify published release assets
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/ScaleUPPeisov/scaleup-dashboards/releases/tags/v1.0.3 > /tmp/release-v103.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/release-v103.json'))
          assert x['tag_name']=='v1.0.3'
          assert not x['draft'] and not x['prerelease']
          names={a['name'] for a in x['assets']}
          required={'VYRON-1.0.3-macOS-AppleSilicon.dmg','VYRON.app.tar.gz','VYRON.app.tar.gz.sig','VYRON-1.0.3-source.tar.gz','SHA256.txt','UPDATER_SHA256.txt','SOURCE_SHA256.txt','RELEASE_NOTES.md','latest.json'}
          missing=required-names
          assert not missing, f'Missing release assets: {sorted(missing)}'
          for a in x['assets']:
              if a['name'] in required: assert a['size']>0, a['name']
          print('Published 1.0.3 assets: PASS')
          PY

      - name: Verify live updater feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 'https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json' -o /tmp/live-v103.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/live-v103.json'))
          assert x['version']=='1.0.3', x.get('version')
          p=x['platforms']['darwin-aarch64']
          assert p['url']=='https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v1.0.3/VYRON.app.tar.gz'
          assert p['signature'].strip()
          print('Live updater 1.0.3: PASS')
          PY
