name: VYRON 1.0.8 Downloads Permission Hotfix Release

on:
  push:
    branches: [vyron-v108-downloads-permission-hotfix]
    paths: ['vyron-v108-release-trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyron-v108-downloads-permission-hotfix-release
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: "-"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout 1.0.8 hotfix branch
        uses: actions/checkout@v4

      - name: Verify current live 1.0.7
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "vyron-v108-downloads-permission-hotfix"
          curl -fsSL 'https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json' -o /tmp/current-live.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/current-live.json'))
          assert x['version']=='1.0.7', f"Expected live 1.0.7 before hotfix, got {x['version']}"
          print('Current live updater 1.0.7: PASS')
          PY

      - name: Normalize existing updater keys
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_UPDATER_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import base64,os
          def dec(v):
              try:return base64.b64decode(v.strip(),validate=True).decode()
              except Exception:return None
          def norm(name,kind):
              raw=os.environ[name].strip();once=dec(raw)
              if once and once.startswith('untrusted comment:'): out,box=raw,once
              else:
                  if not once: raise SystemExit(f'{name}: invalid encoding')
                  out=once.strip();box=dec(out)
                  if not box or not box.startswith('untrusted comment:'): raise SystemExit(f'{name}: not a Tauri key')
              if kind not in box.splitlines()[0].lower(): raise SystemExit(f'{name}: wrong key type')
              return out
          sk=norm('TAURI_SIGNING_PRIVATE_KEY','secret key');pk=norm('TAURI_UPDATER_PUBLIC_KEY','public key')
          print(f'::add-mask::{sk}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'TAURI_SIGNING_PRIVATE_KEY={sk}\nTAURI_UPDATER_PUBLIC_KEY={pk}\n')
          print('Updater key normalization: PASS')
          PY

      - name: Restore exact released VYRON 1.0.7 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vyron-v108 /tmp/vyron-v107-assets
          mkdir -p .vyron-v108 /tmp/vyron-v107-assets
          gh release download v1.0.7 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.0.7-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/vyron-v107-assets
          test -s /tmp/vyron-v107-assets/VYRON-1.0.7-source.tar.gz
          test -s /tmp/vyron-v107-assets/SOURCE_SHA256.txt
          EXPECTED="$(awk '{print $1; exit}' /tmp/vyron-v107-assets/SOURCE_SHA256.txt)"
          GOT="$(shasum -a 256 /tmp/vyron-v107-assets/VYRON-1.0.7-source.tar.gz | awk '{print $1}')"
          test "$EXPECTED" = "$GOT"
          tar -xzf /tmp/vyron-v107-assets/VYRON-1.0.7-source.tar.gz -C .vyron-v108
          grep -q '"version": "1.0.7"' .vyron-v108/package.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.vyron-v108')
          c=json.loads((root/'src-tauri/tauri.conf.json').read_text())
          Path('/tmp/v107-identifier').write_text(c['identifier'])
          Path('/tmp/v107-pubkey').write_text(c['plugins']['updater']['pubkey'])
          Path('/tmp/v107-endpoints').write_text(json.dumps(c['plugins']['updater']['endpoints']))
          protected=[
            'src-tauri/src/youtube.rs','src-tauri/src/storage.rs','src-tauri/src/files.rs',
            'src/api.ts','src/store.ts','src/types.ts','src/YouTubeCenter.tsx',
            'src/AnalyticsPage.tsx','src/CompetitorsPage.tsx','src/SettingsOS.tsx',
            'src/ProductionOS.tsx','src/ProductionWorkspace.tsx','src/ProductionManager.tsx',
            'src/productionManagerApi.ts','src/productionPrefs.ts','src-tauri/src/production_manager.rs'
          ]
          Path('/tmp/v107-protected.json').write_text(json.dumps({p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in protected},sort_keys=True))
          print('Exact 1.0.7 release source restored: PASS')
          PY

      - name: Apply only VYRON 1.0.8 permission hotfix
        run: python3 vyron-v100/apply_v108.py .vyron-v108

      - name: Verify scope identity updater and collector contracts
        shell: bash
        run: |
          set -euo pipefail
          cd .vyron-v108
          python3 - <<'PY'
          import hashlib,json,os,plistlib
          from pathlib import Path
          p=json.loads(Path('package.json').read_text());c=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert p['version']=='1.0.8' and c['version']=='1.0.8'
          assert c['identifier']==Path('/tmp/v107-identifier').read_text()=='studio.channelflow.desktop'
          assert c['plugins']['updater']['pubkey']==Path('/tmp/v107-pubkey').read_text()
          assert c['plugins']['updater']['pubkey'].strip()==os.environ['TAURI_UPDATER_PUBLIC_KEY'].strip()
          assert json.dumps(c['plugins']['updater']['endpoints'])==Path('/tmp/v107-endpoints').read_text()
          protected=json.loads(Path('/tmp/v107-protected.json').read_text())
          for f,h in protected.items():
              got=hashlib.sha256(Path(f).read_bytes()).hexdigest()
              assert got==h, f'OUT-OF-SCOPE FILE CHANGED: {f}'
          with open('src-tauri/Info.plist','rb') as f: info=plistlib.load(f)
          assert info.get('NSDownloadsFolderUsageDescription')
          print('Identity/updater/scope/privacy metadata: PASS')
          PY
          grep -Fq 'collector_seen_at_start(&session,&baseline)' src-tauri/src/production_manager.rs
          ! grep -Fq 'let mut seen=baseline;' src-tauri/src/production_manager.rs
          grep -Fq 'recursive_images(&downloads)' src-tauri/src/production_manager.rs
          grep -Fq 'fs::copy(&src,&tmp)' src-tauri/src/production_manager.rs
          ! grep -RniE 'youtube_upload_video|youtube_list_existing_videos|youtube_update_existing_video|youtube_channel_analytics|youtube_channel_stats|youtube_oauth_profile_health|ytInvoke|googleapis\.com' src/ProductionManager.tsx src/productionManagerApi.ts src/productionPrefs.ts src-tauri/src/production_manager.rs
          echo '1.0.8 permission + 1.0.7 collector + Zero Quota contracts: PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .vyron-v108/src-tauri
          cache-on-failure: true

      - name: Install JS dependencies
        working-directory: .vyron-v108
        run: npm install --no-audit --no-fund

      - name: Frontend regression tests
        working-directory: .vyron-v108
        run: npm test

      - name: TypeScript production build
        working-directory: .vyron-v108
        run: npm run build

      - name: Rust Production acceptance tests
        working-directory: .vyron-v108
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture

      - name: Cargo check ARM64
        working-directory: .vyron-v108
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build ARM64 app DMG and signed updater
        working-directory: .vyron-v108
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify built privacy metadata updater signature and package
        working-directory: .vyron-v108
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name 'VYRON.app' -print -quit)
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          BUILT_DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          UPDATER=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          SIG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' -print -quit)
          test -n "$APP" && test -d "$APP/Contents" && test -n "$BIN" && test -s "$BIN"
          test -n "$BUILT_DMG" && test -s "$BUILT_DMG" && test -n "$UPDATER" && test -s "$UPDATER" && test -n "$SIG" && test -s "$SIG"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "$(cat /tmp/v107-identifier)"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "1.0.8"
          /usr/bin/plutil -extract NSDownloadsFolderUsageDescription raw -o - "$APP/Contents/Info.plist" | tee /tmp/downloads-usage.txt
          test -s /tmp/downloads-usage.txt
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify "$BUILT_DMG"
          command -v minisign >/dev/null 2>&1 || brew install minisign
          base64 -D -i /tmp/v107-pubkey -o /tmp/vyron-existing.pub
          base64 -D -i "$SIG" -o /tmp/vyron-v108.minisig
          minisign -Vm "$UPDATER" -p /tmp/vyron-existing.pub -x /tmp/vyron-v108.minisig
          rm -rf release && mkdir release
          cp "$BUILT_DMG" release/VYRON-1.0.8-macOS-AppleSilicon.dmg
          cp "$UPDATER" release/VYRON.app.tar.gz
          cp "$SIG" release/VYRON.app.tar.gz.sig
          cp ../vyron-v100/RELEASE_NOTES_1.0.8.md release/RELEASE_NOTES.md
          shasum -a 256 release/VYRON-1.0.8-macOS-AppleSilicon.dmg > release/SHA256.txt
          shasum -a 256 release/VYRON.app.tar.gz > release/UPDATER_SHA256.txt
          tar -czf release/VYRON-1.0.8-source.tar.gz --exclude='./node_modules' --exclude='./dist' --exclude='./src-tauri/target' --exclude='./release' .
          shasum -a 256 release/VYRON-1.0.8-source.tar.gz > release/SOURCE_SHA256.txt
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          sig=Path('release/VYRON.app.tar.gz.sig').read_text().strip()
          data={
            'version':'1.0.8',
            'notes':Path('release/RELEASE_NOTES.md').read_text(),
            'pub_date':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'platforms':{'darwin-aarch64':{
              'url':'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/download/v1.0.8/VYRON.app.tar.gz',
              'signature':sig
            }}
          }
          Path('release/latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish GitHub release v1.0.8
        working-directory: .vyron-v108
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.8 --repo ScaleUPPeisov/scaleup-dashboards >/dev/null 2>&1; then
            gh release upload v1.0.8 release/* --repo ScaleUPPeisov/scaleup-dashboards --clobber
            gh release edit v1.0.8 --repo ScaleUPPeisov/scaleup-dashboards --title 'VYRON 1.0.8 — macOS Downloads Permission Hotfix' --notes-file release/RELEASE_NOTES.md
          else
            gh release create v1.0.8 release/* --repo ScaleUPPeisov/scaleup-dashboards --target "$GITHUB_SHA" --title 'VYRON 1.0.8 — macOS Downloads Permission Hotfix' --notes-file release/RELEASE_NOTES.md
          fi

      - name: Publish signed live updater feed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/vyron-main-v108
          git worktree add /tmp/vyron-main-v108 origin/main
          mkdir -p /tmp/vyron-main-v108/vyron-updates
          cp .vyron-v108/release/latest.json /tmp/vyron-main-v108/vyron-updates/latest.json
          cd /tmp/vyron-main-v108
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vyron-updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'release(vyron): publish 1.0.8 updater feed'
            git push origin HEAD:main
          fi

      - name: Verify published release and live updater
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.8 --repo ScaleUPPeisov/scaleup-dashboards --json tagName,name,assets > /tmp/release-v108.json
          python3 - <<'PY'
          import json,time,urllib.request
          for _ in range(12):
              try:
                  x=json.load(urllib.request.urlopen('https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json'))
                  if x.get('version')=='1.0.8':
                      assert 'darwin-aarch64' in x['platforms']
                      print('Live updater 1.0.8: PASS')
                      break
              except Exception as e: print('retry live updater:',e)
              time.sleep(5)
          else: raise SystemExit('live updater did not reach 1.0.8')
          PY
          echo 'VYRON 1.0.8 RELEASED: PASS'
