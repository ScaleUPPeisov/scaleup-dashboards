name: VYRON 1.0.9 Inspect Exact 1.0.8 Source
on:
  push:
    branches: [vyron-v109-production-storage-release]
    paths: ['vyron-v109-inspect-trigger.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact 1.0.8 release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v109 && mkdir -p /tmp/v109
          rm -f /tmp/VYRON-1.0.8-source.tar.gz
          gh release download v1.0.8 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.0.8-source.tar.gz' --dir /tmp
          tar -xzf /tmp/VYRON-1.0.8-source.tar.gz -C /tmp/v109
      - name: Exact ProductionManager header and tail
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HEADER ==='; sed -n '1,230p' /tmp/v109/src/ProductionManager.tsx
          echo '=== PREFS ==='; cat /tmp/v109/src/productionPrefs.ts
          echo '=== LIB ==='; cat /tmp/v109/src-tauri/src/lib.rs
          echo '=== TEST TAIL ==='; tail -n 180 /tmp/v109/src-tauri/src/production_manager_tests.rs
