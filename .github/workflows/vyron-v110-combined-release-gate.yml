name: VYRON 1.2.0 Full UI Component Inspect
on:
  push:
    branches: [vyron-yt-peisov-1.2.0-full-master]
    paths:
      - '.github/workflows/vyron-v110-combined-release-gate.yml'
      - 'vyron-v120-combined-trigger.txt'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: vyron-yt-peisov-1.2.0-full-master}
      - name: Restore exact 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v120-src /tmp/v120-assets; mkdir -p /tmp/v120-src /tmp/v120-assets
          gh release download v1.1.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.1.0-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/v120-assets
          test "$(awk '{print $1;exit}' /tmp/v120-assets/SOURCE_SHA256.txt)" = "$(sha256sum /tmp/v120-assets/VYRON-1.1.0-source.tar.gz|awk '{print $1}')"
          tar -xzf /tmp/v120-assets/VYRON-1.1.0-source.tar.gz -C /tmp/v120-src
      - name: Exact component sources
        shell: bash
        run: |
          for f in DashboardOS.tsx SettingsOS.tsx PublisherOS.tsx QuotaMeter.tsx store.ts api.ts; do
            echo "===== $f ====="; cat /tmp/v120-src/src/$f; done
          echo '===== App.tsx 1-82 ====='; sed -n '1,82p' /tmp/v120-src/src/App.tsx
          echo '===== ProductionOS.tsx 1-48 ====='; sed -n '1,48p' /tmp/v120-src/src/ProductionOS.tsx
          echo '===== youtube.rs 1-150 ====='; sed -n '1,150p' /tmp/v120-src/src-tauri/src/youtube.rs
