name: VYRON 1.2.0 Exact Write Graph Inspect
on:
  push:
    branches: [vyron-yt-peisov-1.2.0-full-master]
    paths:
      - '.github/workflows/vyron-v110-combined-release-gate.yml'
      - 'vyron-v120-combined-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vyron-yt-peisov-1.2.0-full-master
      - name: Restore exact released VYRON 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v120-src /tmp/v120-assets
          mkdir -p /tmp/v120-src /tmp/v120-assets
          gh release download v1.1.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.1.0-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/v120-assets
          EXPECTED="$(awk '{print $1;exit}' /tmp/v120-assets/SOURCE_SHA256.txt)"
          GOT="$(sha256sum /tmp/v120-assets/VYRON-1.1.0-source.tar.gz|awk '{print $1}')"
          test "$EXPECTED" = "$GOT"
          tar -xzf /tmp/v120-assets/VYRON-1.1.0-source.tar.gz -C /tmp/v120-src
          grep -q '"version": "1.1.0"' /tmp/v120-src/package.json
      - name: YouTube exact update and backup graph
        shell: bash
        run: |
          echo '===== youtube.rs 150-270 ====='
          sed -n '150,270p' /tmp/v120-src/src-tauri/src/youtube.rs
          echo '===== all method events ====='
          grep -n 'emit_youtube_api_request' /tmp/v120-src/src-tauri/src/youtube.rs /tmp/v120-src/src-tauri/src/youtube_intelligence.rs || true
      - name: YouTube Center exact tabs
        shell: bash
        run: |
          echo '===== YouTubeCenter.tsx ====='
          sed -n '1,260p' /tmp/v120-src/src/YouTubeCenter.tsx
      - name: Channel and Settings types
        shell: bash
        run: |
          echo '===== types.ts 1-75 ====='
          sed -n '1,75p' /tmp/v120-src/src/types.ts
          echo '===== store defaults/settings ====='
          grep -nE 'default.*settings|const default|Settings|safe|autoUpload|youtubeCategory|create.*channel|cadenceDays' /tmp/v120-src/src/store.ts /tmp/v120-src/src/defaults.ts /tmp/v120-src/src/*.ts 2>/dev/null | head -n 300 || true
      - name: Existing file picker commands
        shell: bash
        run: |
          echo '===== file picker API ====='
          grep -nE 'chooseImages|choose.*Folder|choose.*File|dialog|open\(' /tmp/v120-src/src/api.ts /tmp/v120-src/src-tauri/src/files.rs /tmp/v120-src/src-tauri/src/system.rs | head -n 260 || true
