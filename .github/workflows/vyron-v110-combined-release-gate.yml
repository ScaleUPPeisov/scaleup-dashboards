name: VYRON 1.2.0 Metadata Apply Inspect
on:
  push:
    branches: [vyron-yt-peisov-1.2.0-full-master]
    paths: ['.github/workflows/vyron-v110-combined-release-gate.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: vyron-yt-peisov-1.2.0-full-master}
      - name: Restore exact 1.1.0 and print Metadata apply
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v120-src /tmp/v120-assets;mkdir -p /tmp/v120-src /tmp/v120-assets
          gh release download v1.1.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.1.0-source.tar.gz' --dir /tmp/v120-assets
          tar -xzf /tmp/v120-assets/VYRON-1.1.0-source.tar.gz -C /tmp/v120-src
          nl -ba /tmp/v120-src/src/MetadataPage.tsx | sed -n '1,155p'
