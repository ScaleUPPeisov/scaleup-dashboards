name: VYRON 1.2.0 Exact 1.1.0 Full Master Inspect
on:
  push:
    branches: [vyron-yt-peisov-1.2.0-full-master]
    paths:
      - '.github/workflows/vyron-v110-combined-release-gate.yml'
      - 'vyron-v120-combined-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vyron-yt-peisov-1.2.0-full-master
      - name: Restore exact released VYRON 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v120-src /tmp/v120-assets
          mkdir -p /tmp/v120-src /tmp/v120-assets
          gh release download v1.1.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.1.0-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/v120-assets
          EXPECTED="$(awk '{print $1;exit}' /tmp/v120-assets/SOURCE_SHA256.txt)"
          GOT="$(sha256sum /tmp/v120-assets/VYRON-1.1.0-source.tar.gz|awk '{print $1}')"
          test "$EXPECTED" = "$GOT"
          tar -xzf /tmp/v120-assets/VYRON-1.1.0-source.tar.gz -C /tmp/v120-src
          echo "SOURCE_SHA=$GOT"
          grep -q '"version": "1.1.0"' /tmp/v120-src/package.json
      - name: App dashboard settings map
        shell: bash
        run: |
          for f in App.tsx DashboardOS.tsx SettingsOS.tsx; do
            echo "===== $f ====="
            grep -nE 'VYRON|Dashboard|Главная|sidebar|nav|Settings|Настройки|О программе|Лиценз|Обновлен|quota|Quota|Дата|date|Production|YouTube|section|tab' /tmp/v120-src/src/$f | head -n 320 || true
          done
      - name: Production ENDLUME map
        shell: bash
        run: |
          for f in ProductionOS.tsx ProductionManager.tsx ProductionStatusBridge.tsx productionManagerApi.ts; do
            echo "===== $f ====="
            grep -nE 'Рендер|Публика|render|publish|ENDLUME|selected|project|batch|status|progress|handoff|openEndlume|validateProjects|SENT|READY_UPLOAD|tab|section' /tmp/v120-src/src/$f | head -n 360 || true
          done
      - name: Metadata publisher quota map
        shell: bash
        run: |
          for f in MetadataPage.tsx PublisherOS.tsx api.ts youtubeQuota.ts types.ts; do
            echo "===== $f ====="
            grep -nE 'thumbnail|DOCX|Word|metadata|publishAt|schedule|privacy|quota|Quota|upload|videos.update|videos.insert|selected|channel|sortChannels|Apply|Примен|queue|job' /tmp/v120-src/src/$f | head -n 420 || true
          done
      - name: Rust upload thumbnail license updater map
        shell: bash
        run: |
          for f in youtube.rs lib.rs license.rs updater_bridge.rs production_manager.rs; do
            echo "===== src-tauri/src/$f ====="
            grep -nE 'youtube_upload|videos.insert|thumbnails|thumbnail|upload|daily|quota|license|updater|version|production|ENDLUME|selected_project_ids|command' /tmp/v120-src/src-tauri/src/$f | head -n 420 || true
          done
