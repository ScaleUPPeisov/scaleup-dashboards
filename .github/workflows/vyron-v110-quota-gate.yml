name: VYRON 1.1.0 Exact Quota Gate
on:
  push:
    branches: [vyron-yt-peisov-1.1.0-dev]
    paths:
      - 'vyron-v110/apply_v110_quota.py'
      - '.github/workflows/vyron-v110-quota-gate.yml'
      - 'vyron-v110-quota-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vyron-yt-peisov-1.1.0-dev
      - name: Restore exact VYRON 1.0.15 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v110q-assets /tmp/v110q-src
          gh release download v1.0.15 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.0.15-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/v110q-assets
          test "$(awk '{print $1;exit}' /tmp/v110q-assets/SOURCE_SHA256.txt)" = "$(shasum -a 256 /tmp/v110q-assets/VYRON-1.0.15-source.tar.gz|awk '{print $1}')"
          tar -xzf /tmp/v110q-assets/VYRON-1.0.15-source.tar.gz -C /tmp/v110q-src
      - name: Apply quota patch
        run: python3 vyron-v110/apply_v110_quota.py /tmp/v110q-src
      - name: Static quota contracts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v110q-src
          grep -q "'videos.update':{bucket:'general',cost:50" src/youtubeQuota.ts
          grep -q "'videos.insert':{bucket:'videoUploads',cost:1" src/youtubeQuota.ts
          grep -q 'America/Los_Angeles' src/youtubeQuota.ts
          grep -q 'subscribeYoutubeQuotaClock' src/youtubeQuota.ts
          grep -q 'youtube-api-request' src-tauri/src/youtube.rs
          grep -q 'emit_youtube_api_request(&app,"videos.insert"' src-tauri/src/youtube.rs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: /tmp/v110q-src/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Frontend tests and build
        working-directory: /tmp/v110q-src
        run: |
          npm ci
          npm test
          npm run build
      - name: Rust tests and ARM64 check
        working-directory: /tmp/v110q-src/src-tauri
        run: |
          cargo test --lib
          cargo check --target aarch64-apple-darwin
