name: VYRON 2.0.0 Audit Exact 1.2.0
on:
  push:
    branches: [vyron-yt-peisov-2.0.0-final]
    paths: ['vyron-v200-audit-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vyron-yt-peisov-2.0.0-final
          fetch-depth: 0
      - name: Restore and verify exact released VYRON 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v120 /tmp/v120-assets
          mkdir -p /tmp/v120 /tmp/v120-assets
          gh release download v1.2.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.2.0-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/v120-assets
          expected="$(awk '{print $1;exit}' /tmp/v120-assets/SOURCE_SHA256.txt)"
          got="$(sha256sum /tmp/v120-assets/VYRON-1.2.0-source.tar.gz | awk '{print $1}')"
          test "$expected" = "$got"
          tar -xzf /tmp/v120-assets/VYRON-1.2.0-source.tar.gz -C /tmp/v120
          node -e "const p=require('/tmp/v120/package.json'); if(p.version!=='1.2.0') process.exit(2)"
          echo "Exact VYRON 1.2.0 source SHA: $got"
      - name: Create final-gap audit snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vyron-v200/audit-v120
          mkdir -p vyron-v200/audit-v120/src vyron-v200/audit-v120/rust
          find /tmp/v120/src -maxdepth 1 -type f | sed 's#^/tmp/v120/##' | sort > vyron-v200/audit-v120/FILE_LIST.txt
          for f in \
            App.tsx DashboardOS.tsx SettingsOS.tsx PublisherOS.tsx MetadataPage.tsx ExistingVideos.tsx \
            AnalyticsOS.tsx CompetitorsOS.tsx CompetitorOS.tsx YouTubeCenter.tsx CommandCenter.tsx ChannelRunway.tsx \
            store.ts types.ts api.ts youtubeQuota.ts youtubePublishSafety.ts publishCenterCore.ts notificationCenter.ts; do
            if [ -f "/tmp/v120/src/$f" ]; then cp "/tmp/v120/src/$f" "vyron-v200/audit-v120/src/$f"; fi
          done
          for f in youtube.rs youtube_intelligence.rs storage.rs system.rs files.rs updater_bridge.rs license.rs production_manager.rs; do
            if [ -f "/tmp/v120/src-tauri/src/$f" ]; then cp "/tmp/v120/src-tauri/src/$f" "vyron-v200/audit-v120/rust/$f"; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/v120')
          names=[p.name for p in (root/'src').glob('*') if p.is_file()]
          terms=['Analytics','Compet','Revenue','Cache','Sync','Attention','Error','Autopilot','Publisher','Youtube']
          hits=[]
          for p in (root/'src').glob('*'):
              if p.is_file() and any(t.lower() in p.name.lower() for t in terms):
                  hits.append(p.name)
          Path('vyron-v200/audit-v120/AUDIT_INDEX.md').write_text('# Exact VYRON 1.2.0 audit snapshot\n\nVersion: 1.2.0\n\nRelevant files found:\n'+'\n'.join(f'- {x}' for x in sorted(hits))+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vyron-v200/audit-v120
          if ! git diff --cached --quiet; then
            git commit -m 'audit(vyron): snapshot exact released 1.2.0 gaps'
            git push origin HEAD:vyron-yt-peisov-2.0.0-final
          fi
