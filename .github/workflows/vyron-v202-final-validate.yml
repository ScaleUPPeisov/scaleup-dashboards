name: VYRON YT PEISOV 2.0.2 Final Validate
on:
  push:
    branches: [vyron-yt-peisov-2.0.0-final]
    paths: ['vyron-v202-validate-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      VITE_BUILD_DATE: 2026-09-04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vyron-yt-peisov-2.0.0-final
          fetch-depth: 0
      - name: Restore exact released VYRON 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v202-work /tmp/v202-assets
          mkdir -p /tmp/v202-work /tmp/v202-assets
          gh release download v1.2.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.2.0-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/v202-assets
          expected="$(awk '{print $1;exit}' /tmp/v202-assets/SOURCE_SHA256.txt)"
          got="$(shasum -a 256 /tmp/v202-assets/VYRON-1.2.0-source.tar.gz | awk '{print $1}')"
          test "$expected" = "$got"
          tar -xzf /tmp/v202-assets/VYRON-1.2.0-source.tar.gz -C /tmp/v202-work
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('/tmp/v202-work');p=json.loads((r/'package.json').read_text());c=json.loads((r/'src-tauri/tauri.conf.json').read_text())
          assert p['version']=='1.2.0'
          Path('/tmp/v202-id').write_text(c['identifier'])
          Path('/tmp/v202-product').write_text(c.get('productName',''))
          Path('/tmp/v202-pub').write_text(c['plugins']['updater']['pubkey'])
          Path('/tmp/v202-endpoints').write_text(json.dumps(c['plugins']['updater']['endpoints']))
          PY
      - name: Apply VYRON 2.0.2 patch chain
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v202-work
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_persistence_recovery.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_intelligence_errors.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_autopilot_attention.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_settings_importfix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_rust_fingerprintfix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v201/apply_v201_quota_rollover_fix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v201/apply_v201_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v202/apply_v202_studio_draft_bridge.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v202/apply_v202_version.py" .
      - name: 2.0.2 acceptance contracts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v202-work
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('package.json').read_text());c=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert p['version']=='2.0.2' and c['version']=='2.0.2'
          assert c['identifier']==Path('/tmp/v202-id').read_text()
          assert c.get('productName','')==Path('/tmp/v202-product').read_text()
          assert c['plugins']['updater']['pubkey']==Path('/tmp/v202-pub').read_text()
          assert json.dumps(c['plugins']['updater']['endpoints'])==Path('/tmp/v202-endpoints').read_text()
          rust=Path('src-tauri/src/studio_drafts.rs').read_text();meta=Path('src/MetadataPage.tsx').read_text();api=Path('src/api.ts').read_text();yt=Path('src-tauri/src/youtube.rs').read_text();ext=Path('studio-draft-bridge/content.js').read_text()
          assert '127.0.0.1' in rust and '19470' in rust and 'X-Vyron-Bridge' in rust
          assert 'studio_drafts_start_bridge' in rust and 'studio_drafts_list' in rust
          assert 'cookies' not in ext.lower() and 'document.cookie' not in ext
          assert 'studio.youtube.com' in Path('studio-draft-bridge/manifest.json').read_text()
          assert 'Черновики Studio' in meta and 'Studio Drafts' in meta and 'studioDraftsList' in api
          assert 'playlistItems.list' in yt and 'videos.list' in yt and 'search.list' not in yt
          assert 'beginManualYoutubeQuotaProbe' in Path('src/youtubeQuota.ts').read_text()
          print('VYRON YT PEISOV 2.0.2 acceptance contracts: PASS')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Frontend tests and production build
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v202-work
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Rust regression suite
        shell: bash
        run: |
          cd /tmp/v202-work
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - name: Apple Silicon compile gate
        shell: bash
        run: |
          cd /tmp/v202-work
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
      - name: Final summary
        run: echo 'VYRON YT PEISOV 2.0.2 FINAL VALIDATION PASS'
