name: VYRON YT PEISOV 2.0.3 Final Validate
on:
  push:
    branches: [vyron-yt-peisov-2.0.0-final]
    paths: ['vyron-v203-validate-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      VITE_BUILD_DATE: 2026-09-05
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vyron-yt-peisov-2.0.0-final
          fetch-depth: 0
      - name: Restore exact released VYRON 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v203-work /tmp/v203-assets
          mkdir -p /tmp/v203-work /tmp/v203-assets
          gh release download v1.2.0 --repo ScaleUPPeisov/scaleup-dashboards --pattern 'VYRON-1.2.0-source.tar.gz' --pattern 'SOURCE_SHA256.txt' --dir /tmp/v203-assets
          expected="$(awk '{print $1;exit}' /tmp/v203-assets/SOURCE_SHA256.txt)"
          got="$(shasum -a 256 /tmp/v203-assets/VYRON-1.2.0-source.tar.gz | awk '{print $1}')"
          test "$expected" = "$got"
          tar -xzf /tmp/v203-assets/VYRON-1.2.0-source.tar.gz -C /tmp/v203-work
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('/tmp/v203-work');p=json.loads((r/'package.json').read_text());c=json.loads((r/'src-tauri/tauri.conf.json').read_text())
          assert p['version']=='1.2.0'
          Path('/tmp/v203-id').write_text(c['identifier'])
          Path('/tmp/v203-product').write_text(c.get('productName',''))
          Path('/tmp/v203-pub').write_text(c['plugins']['updater']['pubkey'])
          Path('/tmp/v203-endpoints').write_text(json.dumps(c['plugins']['updater']['endpoints']))
          PY
      - name: Apply VYRON 2.0.3 patch chain
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v203-work
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_persistence_recovery.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_intelligence_errors.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_autopilot_attention.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_settings_importfix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_rust_fingerprintfix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v200/apply_v200_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v201/apply_v201_quota_rollover_fix.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v201/apply_v201_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v202/apply_v202_studio_draft_bridge.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v202/apply_v202_version.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v203/apply_v203_oauth_discovery.py" .
          python3 "$GITHUB_WORKSPACE/vyron-v203/apply_v203_version.py" .
      - name: 2.0.3 acceptance contracts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v203-work
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('package.json').read_text());c=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert p['version']=='2.0.3' and c['version']=='2.0.3'
          assert c['identifier']==Path('/tmp/v203-id').read_text()
          assert c.get('productName','')==Path('/tmp/v203-product').read_text()
          assert c['plugins']['updater']['pubkey']==Path('/tmp/v203-pub').read_text()
          assert json.dumps(c['plugins']['updater']['endpoints'])==Path('/tmp/v203-endpoints').read_text()
          yt=Path('src-tauri/src/youtube.rs').read_text();meta=Path('src/MetadataPage.tsx').read_text();quota=Path('src/youtubeQuota.ts').read_text()
          assert 'snippet,contentDetails,status' in yt
          assert '("forMine","true")' in yt and 'oauth-forMine' in yt and 'draftCandidate' in yt
          assert 'playlistItems' in yt and 'videos' in yt
          assert 'STUDIO DRAFT BRIDGE' not in meta and 'studioDraftsStartBridge' not in meta
          assert 'Studio Drafts:' not in meta and 'Bridge ON' not in meta
          assert 'beginManualYoutubeQuotaProbe' in quota
          print('VYRON YT PEISOV 2.0.3 acceptance contracts: PASS')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Frontend tests and production build
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v203-work
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Rust regression suite
        shell: bash
        run: |
          cd /tmp/v203-work
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - name: Apple Silicon compile gate
        shell: bash
        run: |
          cd /tmp/v203-work
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
      - name: Final summary
        run: echo 'VYRON YT PEISOV 2.0.3 FINAL VALIDATION PASS'
