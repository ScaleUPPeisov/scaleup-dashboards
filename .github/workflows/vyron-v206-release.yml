name: VYRON YT PEISOV 2.0.6 Signed Release
on:
  push:
    branches: [vyron-yt-peisov-2.0.6]
    paths: ['vyron-v206-release-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vyron-v206-release
  cancel-in-progress: false
jobs:
  release-macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: '-'
      VITE_BUILD_DATE: '2026-09-06'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vyron-yt-peisov-2.0.6
          fetch-depth: 0
      - name: Require green 2.0.6 pre-release gate on current patch line
        shell: bash
        run: |
          set -euo pipefail
          test -f vyron-v206-validate-trigger.txt
          RUN_JSON="$(gh run list --repo ScaleUPPeisov/scaleup-dashboards --workflow 'VYRON YT PEISOV 2.0.6 Final Validate' --branch vyron-yt-peisov-2.0.6 --limit 1 --json conclusion,status,headSha)"
          python3 - "$RUN_JSON" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1]);assert x and x[0]['status']=='completed' and x[0]['conclusion']=='success',x
          print('2.0.6 pre-release gate: GREEN')
          PY
      - name: Detect already-published verified VYRON 2.0.6
        id: published
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v2.0.6 --repo ScaleUPPeisov/scaleup-dashboards --json tagName,assets > /tmp/vyron-v206-existing-release.json 2>/dev/null; then echo 'ready=false' >> "$GITHUB_OUTPUT";exit 0;fi
          gh api 'repos/ScaleUPPeisov/scaleup-dashboards/contents/vyron-updates/latest.json?ref=main' --jq .content | tr -d '\n' | base64 --decode > /tmp/vyron-v206-existing-feed.json
          if python3 - <<'PY'
          import json
          r=json.load(open('/tmp/vyron-v206-existing-release.json'));x=json.load(open('/tmp/vyron-v206-existing-feed.json'));names={a['name'] for a in r.get('assets',[])}
          required={'VYRON-2.0.6-macOS-AppleSilicon.dmg','VYRON.app.tar.gz','VYRON.app.tar.gz.sig','VYRON-2.0.6-source.tar.gz','SOURCE_SHA256.txt','UPDATER_SHA256.txt','latest.json'}
          assert r.get('tagName')=='v2.0.6';assert required<=names,sorted(required-names);assert x.get('version')=='2.0.6';p=x.get('platforms',{}).get('darwin-aarch64',{});assert p.get('url','').endswith('/v2.0.6/VYRON.app.tar.gz');assert p.get('signature')
          PY
          then echo 'ready=true' >> "$GITHUB_OUTPUT";else echo 'ready=false' >> "$GITHUB_OUTPUT";fi
      - uses: actions/setup-node@v4
        if: steps.published.outputs.ready != 'true'
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.published.outputs.ready != 'true'
        with:
          targets: aarch64-apple-darwin
      - name: Rebuild and sign exact VYRON 2.0.6
        if: steps.published.outputs.ready != 'true'
        shell: bash
        run: bash vyron-v206/release_build_v206.sh
      - name: Verify, publish release and switch updater feed
        if: steps.published.outputs.ready != 'true'
        shell: bash
        run: bash vyron-v206/release_publish_v206.sh
      - name: Verify both updater endpoints are client-visible
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..24}; do
            if curl -fsSL -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' 'https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/vyron-updates/latest.json' -o /tmp/v206-raw.json && \
               curl -fsSL -L -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' 'https://github.com/ScaleUPPeisov/scaleup-dashboards/releases/latest/download/latest.json' -o /tmp/v206-release-latest.json && \
               python3 - <<'PY'
          import json
          for f in ('/tmp/v206-raw.json','/tmp/v206-release-latest.json'):
              x=json.load(open(f));assert x.get('version')=='2.0.6';p=x.get('platforms',{}).get('darwin-aarch64',{});assert p.get('url','').endswith('/v2.0.6/VYRON.app.tar.gz');assert p.get('signature')
          PY
            then exit 0; fi
            sleep 10
          done
          echo 'Updater endpoints did not converge to 2.0.6' >&2
          exit 1
      - name: Final release summary
        run: echo 'VYRON YT PEISOV 2.0.6 SIGNED RELEASE PASS'
