[package]
name = "reelsfactory"
version = "0.2.0"
description = "ReelsFactory macOS video studio"
authors = ["ScaleUP"]
edition = "2021"

[lib]
name = "reelsfactory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"

