<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelsFactory</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="updateBanner" class="update-banner hidden">
    <div><b id="updateTitle"></b><span id="updateNotes"></span></div>
    <button id="installUpdate" class="primary small"></button>
  </div>

  <div class="shell">
    <aside>
      <div class="brand"><div class="brand-mark">RF</div><div><strong>ReelsFactory</strong><small>AI Reels Editor · v0.2.0</small></div></div>
      <nav>
        <button class="nav active" data-page="home" data-i18n="navHome"></button>
        <button class="nav" data-page="projects" data-i18n="navProjects"></button>
        <button class="nav" data-page="settings" data-i18n="navSettings"></button>
      </nav>
      <div class="performance-pill"><i></i><span>60 FPS UI</span></div>
    </aside>

    <main>
      <section id="home" class="page active">
        <header class="hero">
          <div><span class="eyebrow">APPLE SILICON · LOCAL FIRST</span><h1 data-i18n="heroTitle"></h1><p data-i18n="heroText"></p></div>
          <div class="hero-actions"><button id="pickVideoTop" class="primary" data-i18n="createReel"></button></div>
        </header>

        <section id="dropZone" class="drop-zone" tabindex="0">
          <div class="drop-icon">↓</div><div><b data-i18n="dropTitle"></b><span data-i18n="dropSub"></span></div>
          <button id="pickVideo" class="secondary" data-i18n="chooseFile"></button>
        </section>

        <section id="sourcePanel" class="source-panel hidden">
          <div class="preview-wrap"><video id="sourcePreview" controls playsinline></video></div>
          <div class="source-info">
            <div class="source-head"><div><span class="eyebrow" data-i18n="sourceVideo"></span><h3 id="videoName">—</h3></div><button id="replaceVideo" class="ghost" data-i18n="replace"></button></div>
            <div class="meta-grid">
              <div><span data-i18n="duration"></span><b id="videoDuration">—</b></div><div><span data-i18n="resolution"></span><b id="videoResolution">—</b></div><div><span>FPS</span><b id="videoFps">—</b></div><div><span data-i18n="fileSize"></span><b id="videoSize">—</b></div>
            </div>
          </div>
        </section>

        <section class="workflow-grid">
          <div class="panel">
            <div class="panel-head"><div><span class="step">01</span><div><b data-i18n="editStyle"></b><small data-i18n="editStyleSub"></small></div></div></div>
            <div class="segmented three" id="stylePicker"><button class="active" data-value="clean">Clean</button><button data-value="dynamic">Dynamic</button><button data-value="viral">Viral</button></div>
            <p class="context-note" id="styleHint"></p>
          </div>

          <div class="panel">
            <div class="panel-head"><div><span class="step">02</span><div><b data-i18n="smartCuts"></b><small data-i18n="smartCutsSub"></small></div></div><label class="toggle"><input id="smartCuts" type="checkbox" checked><span></span></label></div>
            <div class="segmented three" id="cutPicker"><button data-value="low">Low</button><button class="active" data-value="medium">Medium</button><button data-value="high">High</button></div>
            <p class="context-note" data-i18n="smartCutsSafety"></p>
          </div>

          <div class="panel">
            <div class="panel-head"><div><span class="step">03</span><div><b data-i18n="frameMode"></b><small data-i18n="frameModeSub"></small></div></div></div>
            <div class="segmented" id="framePicker"><button class="active" data-value="face916" data-i18n="faceTracking"></button><button data-value="crop916">Center Crop</button></div>
            <div class="availability"><span class="dot green"></span><span data-i18n="faceTrackingLive"></span></div>
          </div>

          <div class="panel">
            <div class="panel-head"><div><span class="step">04</span><div><b data-i18n="autoZoom"></b><small data-i18n="autoZoomSub"></small></div></div></div>
            <div class="segmented three" id="zoomPicker"><button data-value="off">Off</button><button class="active" data-value="soft">Soft</button><button data-value="dynamic">Dynamic</button></div>
            <p class="context-note" data-i18n="autoZoomLogic"></p>
          </div>

          <div class="panel">
            <div class="panel-head"><div><span class="step">05</span><div><b data-i18n="captions"></b><small data-i18n="captionsSub"></small></div></div><label class="toggle"><input id="captions" type="checkbox" checked><span></span></label></div>
            <select id="captionStyle"><option value="clean">Clean</option><option value="dynamic">Dynamic</option><option value="bold">Bold</option><option value="minimal">Minimal</option><option value="podcast">Podcast</option></select>
            <label class="inline-check"><input id="highlightKeywords" type="checkbox"><span data-i18n="highlightKeywords"></span></label>
          </div>

          <div class="panel disabled-feature">
            <div class="panel-head"><div><span class="step">06</span><div><b data-i18n="contentGoal"></b><small data-i18n="contentGoalSub"></small></div></div><span class="beta-badge" data-i18n="nextModule"></span></div>
            <select id="goalSelect" disabled><option value="sales" data-i18n="goalSales"></option><option value="expert" data-i18n="goalExpert"></option><option value="personal" data-i18n="goalPersonal"></option><option value="educational" data-i18n="goalEducational"></option><option value="storytelling" data-i18n="goalStory"></option><option value="entertainment" data-i18n="goalEntertainment"></option></select>
          </div>
        </section>

        <section class="reality-check"><div><b data-i18n="engineNow"></b><span data-i18n="engineNowText"></span></div><div class="engine-tags"><span>Whisper</span><span>Apple Vision</span><span>AVFoundation</span><span>Smart Cuts</span><span>9:16</span></div></section>

        <div class="actionbar"><div class="status"><i id="statusDot"></i><div><b id="statusTitle"></b><span id="statusText"></span></div></div><button id="render" class="primary large" disabled data-i18n="makeReel"></button></div>
        <div id="result" class="result hidden"><div><b data-i18n="ready"></b><span id="resultPath"></span></div><div class="result-actions"><button id="previewResult" class="secondary" data-i18n="preview"></button><button id="showResult" class="secondary" data-i18n="showFinder"></button></div></div>
      </section>

      <section id="projects" class="page">
        <div class="page-head"><div><span class="eyebrow">REELSFACTORY</span><h2 data-i18n="projectsTitle"></h2><p data-i18n="projectsSub"></p></div></div>
        <div id="projectsList" class="projects-list"></div><div id="projectsEmpty" class="empty panel"><b data-i18n="projectsEmpty"></b><p data-i18n="projectsEmptySub"></p></div>
      </section>

      <section id="settings" class="page">
        <div class="page-head"><div><span class="eyebrow">REELSFACTORY</span><h2 data-i18n="settingsTitle"></h2></div></div>
        <div class="settings-stack">
          <div class="panel setting-row"><div><b data-i18n="language"></b><span data-i18n="languageSub"></span></div><div class="segmented compact" id="langPicker"><button data-value="ru">Русский</button><button data-value="en">English</button></div></div>
          <div class="panel setting-row"><div><b data-i18n="performance"></b><span data-i18n="performanceSub"></span></div><label class="toggle"><input id="reduceEffects" type="checkbox" checked><span></span></label></div>
          <div class="panel setting-row"><div><b data-i18n="exportDefault"></b><span data-i18n="exportDefaultSub"></span></div><select id="exportDefault"><option value="balanced">Balanced</option><option value="fast">Fast</option><option value="high">High</option></select></div>
          <div class="panel update-center"><div><b data-i18n="updateCenter"></b><span id="updateState"></span></div><div class="update-meta"><div><span data-i18n="currentVersion"></span><b>0.2.0</b></div><div><span data-i18n="latestVersion"></span><b id="latestVersion">—</b></div><div><span data-i18n="releaseDate"></span><b id="releaseDate">—</b></div><div><span data-i18n="releaseTime"></span><b id="releaseTime">—</b></div></div><div class="update-actions"><button id="checkUpdate" class="secondary" data-i18n="checkUpdates"></button></div></div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
