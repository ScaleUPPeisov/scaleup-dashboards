<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#080D16"/>
<title>VYRON Mobile</title>
<style>
:root{--bg:#080D16;--panel:#101827;--panel2:#0D1421;--border:rgba(130,155,210,.16);--text:#F4F7FF;--sub:#9BA8BE;--ter:#69778E;--blue:#5C6CFF;--violet:#7B5CFF;--green:#39E6A0;--amber:#FFC83D;--red:#FF4E5D;--purple:#B05CFF;--cyan:#4F9CFF}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;min-height:100%}
body{background:radial-gradient(circle at 70% -10%,rgba(92,108,255,.16),transparent 32%),linear-gradient(180deg,#080D16,#0A101B 40%,#080D16)}
button,input{font:inherit}.app{max-width:460px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}
.header{padding:22px 2px 16px;display:flex;align-items:flex-start;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px;font-size:29px}.title{font-size:30px;font-weight:800;letter-spacing:-.6px;margin-top:12px}.sync{font-size:11px;color:var(--amber);font-weight:700;margin-top:5px}
.iconbtn{width:44px;height:44px;border:1px solid var(--border);border-radius:16px;background:rgba(16,24,39,.72);color:var(--sub)}
.card{background:linear-gradient(135deg,rgba(21,30,46,.96),rgba(10,16,27,.98));border:1px solid var(--border);box-shadow:0 16px 36px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.02);border-radius:22px;padding:17px;margin:10px 0}
.hero{padding:20px}.eyebrow{font-size:11px;color:var(--sub);font-weight:800;letter-spacing:1.1px}.heroValue{font-size:29px;font-weight:850;margin:5px 0}.muted{font-size:13px;color:var(--sub);line-height:1.35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.big{font-size:24px;font-weight:850}.small{font-size:11px;color:var(--sub);margin-top:5px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 8px}.section h3{font-size:16px;margin:0}.live{font-size:12px;color:var(--cyan);font-weight:800}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grow{flex:1}.name{font-weight:800;font-size:16px}.metric{font-weight:850;font-size:18px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.blue{color:var(--cyan)}.purple{color:var(--purple)}
.avatar{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--violet));display:grid;place-items:center;font-weight:900;flex:none}
.rule{height:1px;background:var(--border);margin:14px 0}.progress{height:7px;border-radius:99px;background:#192335;overflow:hidden;margin-top:12px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:99px}
.search{height:48px;border:1px solid var(--border);border-radius:16px;background:#0D1522;color:var(--text);padding:0 14px;width:100%;outline:none}.filters{display:flex;gap:8px;overflow:auto;padding:8px 0 2px}.chip{white-space:nowrap;border:1px solid var(--border);background:#0D1522;color:var(--sub);border-radius:999px;padding:9px 12px;font-size:12px}.chip.active{background:rgba(92,108,255,.16);color:#fff;border-color:rgba(92,108,255,.5)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(460px,100%);height:76px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(8,13,22,.94);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav button{border:0;background:none;color:var(--ter);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav button b{font-size:18px;line-height:1}.nav button.active{color:var(--blue);text-shadow:0 0 16px rgba(92,108,255,.7)}
.primary{width:100%;min-height:48px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--violet));color:white;font-weight:850;padding:12px 16px}.secondary{min-height:44px;border:1px solid var(--border);border-radius:14px;background:#0D1522;color:var(--text);font-weight:750;padding:10px 13px}
.login{max-width:420px;margin:0 auto;min-height:100vh;padding:22vh 20px 40px}.login .brand{font-size:36px}.login h1{font-size:32px;margin:14px 0 22px}.field{width:100%;height:50px;border:1px solid var(--border);background:#0D1522;color:#fff;border-radius:15px;padding:0 14px;margin:7px 0;outline:none}.error{color:var(--red);font-size:12px;margin:8px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:16px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(135deg,rgba(21,30,46,.96),rgba(10,16,27,.98))}.kpi .v{font-size:22px;font-weight:850}.kpi .l{font-size:11px;color:var(--sub);margin-top:4px}
.chart{height:150px;display:flex;align-items:flex-end;gap:4px;padding-top:16px}.bar{flex:1;min-width:3px;background:linear-gradient(180deg,var(--blue),rgba(92,108,255,.18));border-radius:4px 4px 1px 1px}
.device{padding:13px 0;border-bottom:1px solid var(--border)}.device:last-child{border-bottom:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;z-index:40;padding:20px}.modal .card{width:min(390px,100%);padding:24px}.code{font-size:30px;font-weight:900;letter-spacing:3px;text-align:center;margin:18px 0;color:var(--cyan)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.117.2";
const SUPABASE_URL="https://odlseljmogaguyqdlkyv.supabase.co";
const SUPABASE_KEY="sb_publishable_zKjzhQTdTG8f9BfR2X5NVg_zQgjo70f";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:localStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const root=document.getElementById("root");
let user=null,session=null,tab="home",filter="Все",query="",channel=null;
let state={channels:[],stats:[],projects:[],inventory:[],publisherJobs:[],endlumeJobs:[],devices:[],notifications:[],lastSync:null,status:"offline"};

const fmt=v=>v==null||Number.isNaN(Number(v))?"—":new Intl.NumberFormat("ru-RU",{maximumFractionDigits:1}).format(Number(v));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const latestStats=(days=28)=>{const m=new Map();for(const x of state.stats){if(Number(x.period_days)!==days)continue;const p=m.get(x.channel_id);if(!p||Date.parse(x.timestamp)>Date.parse(p.timestamp))m.set(x.channel_id,x)}return m};
const inventory=id=>state.inventory.find(x=>x.channel_id===id);
const chStatus=c=>{const i=inventory(c.id);if(/error|failed/i.test(c.status||""))return["Ошибка загрузки","red"];if(i?.stale||i?.folder_state==="OFFLINE")return["Нет подключения","amber"];if(i?.remaining_content_days!=null&&i.remaining_content_days<=0)return["Нужно добавить видео","red"];if(i?.remaining_content_days!=null&&i.remaining_content_days<=6)return["Нужно добавить видео","amber"];const n=i?.next_scheduled_publication?new Date(i.next_scheduled_publication):null;if(n&&n.toDateString()===new Date().toDateString())return["Публикация сегодня","blue"];return["Всё нормально","green"]};
const metricPeriod=(s,d)=>s?(s.views_period??(d===7?s.views_7d:d===28?s.views_28d:null)):null;
const subPeriod=(s,d)=>s?(s.subscriber_delta_period??(d===7?s.subscriber_delta_7d:d===28?s.subscriber_delta_28d:null)):null;
function cacheKey(){return user?"vyron-web:snapshot:"+user.id:null}
function save(){const k=cacheKey();if(k)localStorage.setItem(k,JSON.stringify(state))}
function restore(){const k=cacheKey();if(!k)return;try{const x=JSON.parse(localStorage.getItem(k)||"null");if(x&&Array.isArray(x.channels))state={...state,...x}}catch{}}
function age(){if(!state.lastSync)return"Нет подтверждённой синхронизации";const m=Math.floor((Date.now()-Date.parse(state.lastSync))/60000);return m<1?"Обновлено только что":m<60?"Обновлено "+m+" мин назад":"Обновлено "+Math.floor(m/60)+" ч назад"}
function header(title){return '<div class="header"><div><div class="brand">VYRON</div><div class="title">'+esc(title)+'</div>'+((state.status==="online"||state.status==="syncing")?"":'<div class="sync">Нет подключения · '+esc(age())+'</div>')+'</div><button class="iconbtn">●</button></div>'}
function nav(){const items=[["home","⌂","Главная"],["channels","◉","Каналы"],["projects","◇","Проекты"],["analytics","⌁","Аналитика"],["settings","⚙","Настройки"]];return '<div class="nav">'+items.map(([id,ic,l])=>'<button data-tab="'+id+'" class="'+(tab===id?"active":"")+'"><b>'+ic+'</b><span>'+l+'</span></button>').join("")+'</div>'}
function aggregate(days=28){const by=latestStats(days),rows=[...by.values()];const views=rows.length?rows.reduce((n,x)=>n+(metricPeriod(x,days)||0),0):null;const subs=rows.length?rows.reduce((n,x)=>n+(subPeriod(x,days)||0),0):null;const watch=rows.filter(x=>x.watch_time!=null);const ctr=rows.filter(x=>x.ctr!=null);const daily=new Map();for(const r of rows)for(const p of (r.daily_points||[])){const d=String(p.date||"");const v=Number(p.views);if(d&&Number.isFinite(v))daily.set(d,(daily.get(d)||0)+v)}return{views,subs,watch:watch.length?watch.reduce((n,x)=>n+Number(x.watch_time||0),0):null,ctr:ctr.length?ctr.reduce((n,x)=>n+Number(x.ctr||0),0)/ctr.length:null,daily:[...daily.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[1]),by}}
function home(){const a=aggregate(28),attention=state.channels.filter(c=>["amber","red"].includes(chStatus(c)[1])),rendering=state.projects.filter(x=>x.status==="RENDERING").length,errors=state.projects.filter(x=>x.status==="ERROR").length,endlume=state.endlumeJobs.find(x=>x.state==="rendering")||state.endlumeJobs[0];return header("Главная")+'<div class="card hero"><div class="eyebrow">СЕТЬ КАНАЛОВ</div><div class="heroValue">'+state.channels.length+' каналов</div><div class="muted">'+(state.channels.length-attention.length)+' работают штатно · '+attention.length+' требуют внимания</div><div class="grid" style="margin-top:18px"><div><div class="metric">'+fmt(a.views)+'</div><div class="small">просмотров / 28д</div></div><div><div class="metric">'+(a.subs==null?"—":(a.subs>=0?"+":"")+fmt(a.subs))+'</div><div class="small">подписчиков</div></div></div></div><div class="section"><h3>Сейчас</h3><span class="live">'+(state.status==="online"?"Live":"Cache")+'</span></div><div class="grid"><div class="card"><div class="big">'+rendering+'</div><div class="small">рендерятся</div></div><div class="card"><div class="big">'+errors+'</div><div class="small">ошибки</div></div></div><div class="section"><h3>ENDLUME</h3><span class="live">'+(endlume?esc(endlume.state):"Нет данных")+'</span></div><div class="card"><div class="row"><div><div class="name">'+esc(endlume?.machine_name||"ENDLUME")+'</div><div class="muted">'+esc(endlume?.current_project||"Нет активного проекта")+'</div></div><div class="metric purple">'+(endlume?.progress==null?"—":Math.round(endlume.progress)+"%")+'</div></div>'+(endlume?.progress!=null?'<div class="progress"><i style="width:'+Math.max(0,Math.min(100,endlume.progress))+'%"></i></div>':"")+'</div>'}
function channels(){const by=latestStats(28);let rows=state.channels.filter(c=>c.name.toLowerCase().includes(query.toLowerCase()));if(filter!=="Все")rows=rows.filter(c=>{const s=chStatus(c)[1];return filter==="Активные"?s!=="red":filter==="Нужен контент"?s==="amber":s==="red"});return header("Каналы")+'<input id="search" class="search" value="'+esc(query)+'" placeholder="Поиск каналов…"/><div class="filters">'+["Все","Активные","Нужен контент","Ошибки"].map(x=>'<button class="chip '+(x===filter?"active":"")+'" data-filter="'+x+'">'+x+'</button>').join("")+'</div>'+(rows.length?rows.map((c,i)=>{const s=by.get(c.id),inv=inventory(c.id),st=chStatus(c);return '<div class="card"><div class="row"><div class="avatar">'+esc((c.name||"??").slice(0,2).toUpperCase())+'</div><div class="grow"><div class="name">'+esc(c.name)+'</div><div class="muted">'+fmt(s?.subscriber_count)+' подписчиков</div></div><span class="badge '+st[1]+'"><i class="dot"></i>'+st[0]+'</span></div><div class="grid" style="margin-top:18px"><div><div class="metric">'+fmt(s?.views_today)+'</div><div class="small">сегодня</div></div><div><div class="metric">'+fmt(metricPeriod(s,28))+'</div><div class="small">28 дней</div></div></div><div class="rule"></div><div class="row"><span class="muted">'+(inv?inv.ready_video_count:"—")+' видео готово</span><span class="muted">Запас: '+(inv?.remaining_content_days==null?"—":fmt(inv.remaining_content_days)+" дней")+'</span></div></div>'}).join(""):'<div class="card"><div class="muted">Каналы пока не синхронизированы</div></div>')}
function projects(){return header("Проекты")+'<div class="muted" style="margin:-8px 2px 14px">Управляйте своими видеопроектами</div>'+(state.projects.length?state.projects.map(p=>{const tone=p.status==="COMPLETED"?"green":p.status==="ERROR"?"red":p.status==="RENDERING"?"purple":"blue";return '<div class="card"><div class="row"><div class="grow"><div class="name">'+esc(p.project_name)+'</div><div class="muted">'+esc(p.machine||"—")+'</div></div><span class="badge '+tone+'"><i class="dot"></i>'+esc(p.status)+'</span></div>'+(p.status==="RENDERING"?'<div class="progress"><i style="width:'+Math.max(0,Math.min(100,p.progress||0))+'%"></i></div><div class="small purple">'+(p.progress==null?"Прогресс ожидается":Math.round(p.progress)+"%")+'</div>':"")+(p.error_message?'<div class="error">'+esc(p.error_message)+'</div>':"")+'</div>'}).join(""):'<div class="card"><div class="muted">Проекты пока не синхронизированы</div></div>')}
function analytics(){const a=aggregate(28),vals=a.daily,max=Math.max(1,...vals);return header("Аналитика")+'<div class="kpis"><div class="kpi"><div class="v">'+fmt(a.views)+'</div><div class="l">Просмотры / 28д</div></div><div class="kpi"><div class="v">'+(a.subs==null?"—":(a.subs>=0?"+":"")+fmt(a.subs))+'</div><div class="l">Подписчики</div></div><div class="kpi"><div class="v">'+(a.watch==null?"—":fmt(a.watch/60)+" ч")+'</div><div class="l">Watch time</div></div><div class="kpi"><div class="v">'+(a.ctr==null?"—":fmt(a.ctr)+"%")+'</div><div class="l">CTR</div></div></div><div class="section"><h3>Рост просмотров</h3><span class="live">28 дней</span></div><div class="card"><div class="chart">'+(vals.length?vals.map(v=>'<div class="bar" style="height:'+Math.max(3,v/max*100)+'%"></div>').join(""):'<div class="muted">Нет данных</div>')+'</div></div>'}
function settings(){const now=Date.now();return header("Настройки")+'<div class="card"><div class="name">'+esc(session?.user?.user_metadata?.full_name||session?.user?.email||"VYRON")+'</div><div class="muted">'+state.channels.length+' каналов под управлением</div></div><div class="card"><div class="device row"><span>Синхронизация</span><b class="'+(state.status==="online"?"green":"amber")+'">'+(state.status==="online"?"● Онлайн":state.status==="syncing"?"Синхронизация…":"Нет подключения")+'</b></div><div class="device row"><span>Подключённые устройства</span><b>'+state.devices.length+'</b></div><div class="device row"><span>ENDLUME</span><b class="purple">'+(state.endlumeJobs.some(x=>x.state!=="disconnected")?"● Подключено":"Нет связи")+'</b></div><div class="device row"><span>Последняя синхронизация</span><b class="muted">'+esc(age())+'</b></div></div><button id="pair" class="primary">Подключить Desktop VYRON</button><div class="section"><h3>Устройства</h3></div>'+(state.devices.length?'<div class="card">'+state.devices.map(d=>'<div class="device row"><div><div class="name">'+esc(d.name)+'</div><div class="muted">'+((now-Date.parse(d.last_seen_at)<45000)?"● Сейчас в сети":"Последняя связь: "+new Date(d.last_seen_at).toLocaleString("ru-RU"))+'</div></div><span>'+esc(d.device_kind)+'</span></div>').join("")+'</div>':"")+'<button id="logout" class="secondary" style="width:100%;margin-top:12px;color:var(--red)">Выйти</button>'}
function render(){if(!session){renderLogin();return}root.innerHTML='<main class="app">'+({home:home,channels,projects,analytics,settings}[tab]())+nav()+'</main>';bind()}
function renderLogin(){root.innerHTML='<div class="login"><div class="brand">VYRON</div><h1>Вход</h1><div class="card"><input id="email" class="field" type="email" placeholder="Email" autocomplete="email"/><input id="password" class="field" type="password" placeholder="Пароль" autocomplete="current-password"/><div id="loginerr" class="error"></div><button id="login" class="primary">Войти</button></div></div>';document.getElementById("login").onclick=async()=>{const btn=document.getElementById("login"),e=document.getElementById("email").value.trim(),p=document.getElementById("password").value;btn.textContent="Вход…";const {error}=await supabase.auth.signInWithPassword({email:e,password:p});if(error){document.getElementById("loginerr").textContent=error.message;btn.textContent="Войти"}}}
function bind(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});const s=document.getElementById("search");if(s)s.oninput=e=>{query=e.target.value;render()};const lo=document.getElementById("logout");if(lo)lo.onclick=()=>supabase.auth.signOut();const p=document.getElementById("pair");if(p)p.onclick=createPair}
async function createPair(){const {data,error}=await supabase.functions.invoke("vyron-mobile-sync-ingest",{body:{action:"create_pairing_code"}});if(error||!data?.ok){alert("Не удалось создать код сопряжения");return}document.body.insertAdjacentHTML("beforeend",'<div id="modal" class="modal"><div class="card"><div class="eyebrow">DESKTOP PAIRING</div><div class="code">'+esc(data.pairingCode)+'</div><div class="muted" style="text-align:center">Код действует 10 минут и используется один раз.</div><button id="closemodal" class="primary" style="margin-top:18px">Готово</button></div></div>');document.getElementById("closemodal").onclick=()=>document.getElementById("modal").remove()}
async function serverSnapshot(){const names=[["channels","vyron_mobile_channels"],["stats","vyron_mobile_channel_stats"],["projects","vyron_mobile_projects"],["inventory","vyron_mobile_content_inventory"],["publisherJobs","vyron_mobile_publisher_jobs"],["endlumeJobs","vyron_mobile_endlume_jobs"],["devices","vyron_mobile_devices"],["notifications","vyron_mobile_notifications"]];const results=await Promise.all(names.map(async([k,t])=>[k,await supabase.from(t).select("*")]));for(const [k,r] of results){if(r.error)throw r.error;state[k]=r.data||[]}state.channels=state.channels.filter(x=>!x.deleted_at);state.projects=state.projects.filter(x=>!x.deleted_at);state.lastSync=new Date().toISOString();state.status="online";save();render()}
function patch(key,payload,idKey="id"){const row=payload.new||payload.old;if(!row)return;let arr=state[key]||[];const id=row[idKey];if(payload.eventType==="DELETE"||row.deleted_at)arr=arr.filter(x=>x[idKey]!==id);else{const i=arr.findIndex(x=>x[idKey]===id);if(i>=0)arr[i]=row;else arr=[row,...arr]}state[key]=arr;state.lastSync=new Date().toISOString();state.status="online";save();render()}
async function boot(){const {data:{session:s}}=await supabase.auth.getSession();session=s;user=s?.user||null;if(!session){render();return}restore();render();state.status="syncing";render();try{await serverSnapshot()}catch{state.status="offline";render()}if(channel)await supabase.removeChannel(channel);channel=supabase.channel("vyron-web-"+user.id);const map=[["vyron_mobile_channels","channels","id"],["vyron_mobile_channel_stats","stats","id"],["vyron_mobile_projects","projects","id"],["vyron_mobile_content_inventory","inventory","channel_id"],["vyron_mobile_publisher_jobs","publisherJobs","id"],["vyron_mobile_endlume_jobs","endlumeJobs","id"],["vyron_mobile_devices","devices","id"],["vyron_mobile_notifications","notifications","id"]];for(const [table,key,idKey] of map)channel.on("postgres_changes",{event:"*",schema:"public",table,filter:"owner_id=eq."+user.id},p=>patch(key,p,idKey));channel.subscribe(st=>{state.status=st==="SUBSCRIBED"?"online":st==="CHANNEL_ERROR"?"offline":state.status;render()})}
supabase.auth.onAuthStateChange((_e,s)=>{session=s;user=s?.user||null;if(!s){state={channels:[],stats:[],projects:[],inventory:[],publisherJobs:[],endlumeJobs:[],devices:[],notifications:[],lastSync:null,status:"offline"};render()}else boot()});
boot();
</script>
</body>
</html>
